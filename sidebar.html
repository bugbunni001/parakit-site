<style>
    /* 1. โครงสร้างหลักของ Sidebar - Modern Deep Dark */
    .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 280px; /* ขยายกว้างขึ้นเล็กน้อยให้ดูไม่อึดอัด */
        height: 100vh;
        height: 100dvh;
        background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
        color: #f8fafc;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 4px 0 25px rgba(0,0,0,0.3);
    }

    /* 2. Responsive Settings */
    @media (max-width: 991.98px) {
        .sidebar { transform: translateX(-280px); }
        .sidebar.show { transform: translateX(0); }
    }

    @media (min-width: 992px) {
        .sidebar { transform: translateX(0); border-right: 1px solid rgba(255,255,255,0.05); }
    }

    /* 3. Header - ปรับให้ดูพรีเมียมขึ้น */
    .sidebar-header {
        padding: 30px 24px;
        font-size: 20px;
        font-weight: 700;
        background: rgba(15, 23, 42, 0.8);
        backdrop-filter: blur(10px);
        color: #fff;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 12px;
        letter-spacing: 0.5px;
    }
    
    .sidebar-header i {
        color: #38bdf8; /* สีฟ้าสว่างเพิ่มความเด่น */
        font-size: 22px;
    }

    /* 4. รายการเมนู - ปรับ Hover และระยะห่าง */
    .menu {
        display: flex;
        flex-direction: column;
        padding: 15px 12px 100px 12px; /* เพิ่ม Padding รอบๆ ให้เมนูดูเป็น Card */
    }

    .item {
        margin-bottom: 4px;
    }

    .menu a, .menu .drop-btn {
        width: 100%;
        min-height: 48px;
        padding: 12px 16px;
        background: transparent;
        border: none;
        border-radius: 8px; /* ปรับให้โค้งมนดูสมัยใหม่ */
        color: #94a3b8;
        text-align: left;
        font-size: 14px;
        font-weight: 400;
        cursor: pointer;
        display: flex;
        align-items: center;
        text-decoration: none;
        transition: all 0.25s ease;
        position: relative;
    }

    /* Effect เมื่อ Hover หรือ Active */
    .menu a:hover, .menu .drop-btn:hover {
        background: rgba(255, 255, 255, 0.05);
        color: #fff;
        padding-left: 22px;
    }

    /* เส้น Highlight ด้านข้างเมนู */
    .menu a:hover::before, .menu .drop-btn:hover::before {
        content: "";
        position: absolute;
        left: 0;
        top: 10px;
        bottom: 10px;
        width: 4px;
        background: #10b981; /* สีเขียว Success */
        border-radius: 0 4px 4px 0;
    }

    /* 5. เมนูย่อย (Submenu) - ปรับ Layer ให้ชัดเจน */
    .sub {
        display: none;
        background: rgba(0, 0, 0, 0.2);
        margin: 4px 0 8px 0;
        border-radius: 8px;
        padding: 5px 0;
    }

    .item.open .sub {
        display: block;
        animation: slideDown 0.3s ease-out;
    }

    .sub a {
        padding-left: 48px;
        font-size: 13.5px;
        color: #64748b;
        min-height: 38px;
    }

    .sub a:hover {
        color: #10b981;
        background: transparent;
        padding-left: 54px;
    }

    /* 6. ลูกศร - ปรับให้ดูนิ่มนวล */
    .arrow {
        margin-left: auto;
        transition: transform 0.3s ease;
        font-size: 10px;
        opacity: 0.4;
    }

    .item.open .arrow {
        transform: rotate(90deg);
        opacity: 1;
        color: #10b981;
    }

    /* Animation */
    @keyframes slideDown {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* สกロールบาร์ - แบบบางพิเศษ */
    .sidebar::-webkit-scrollbar {
        width: 5px;
    }
    .sidebar::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.05);
        border-radius: 10px;
    }
    .sidebar:hover::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.1);
    }
</style>

<script>
    // ฟังก์ชัน กาง-หุบ เมนูย่อย (ปรับปรุงประสิทธิภาพ)
    window.toggleDrop = function(btn, id) {
        const item = btn.closest('.item'); 
        if (!item) return;

        // ปิดเมนูอื่นๆ ก่อน (Optional: ถ้าต้องการให้เปิดได้ทีละเมนูเดียว)
        /*
        document.querySelectorAll('.item').forEach(el => {
            if(el !== item) el.classList.remove('open');
        });
        */

        const isOpen = item.classList.toggle("open");
        
        if (id) {
            localStorage.setItem('menu-' + id, isOpen);
        }
    }

    // ฟังก์ชันคืนค่าสถานะเมนูที่เคยเปิดไว้
    function restoreMenuState() {
        const menus = ['credit', 'branch']; 
        menus.forEach(id => {
            if (localStorage.getItem('menu-' + id) === 'true') {
                const menuEl = document.getElementById('menu-' + id);
                if (menuEl) menuEl.classList.add('open');
            }
        });
    }

    // รันฟังก์ชันคืนค่าสถานะ
    document.addEventListener('DOMContentLoaded', restoreMenuState);
</script>
