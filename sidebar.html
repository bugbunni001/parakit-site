<style>
    /* 1. โครงสร้างหลัก Sidebar - iOS Glassmorphism */
    .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 280px;
        height: 100vh;
        height: 100dvh;
        /* พื้นหลังขาวกระจกโปร่งแสง */
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(25px) saturate(180%);
        -webkit-backdrop-filter: blur(25px) saturate(180%);
        color: #1c1c1e;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        overflow-x: hidden;
        border-right: 1px solid rgba(255, 255, 255, 0.3);
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 10px 0 30px rgba(0, 0, 0, 0.05);
    }

    /* 2. Responsive */
    @media (max-width: 991.98px) {
        .sidebar { transform: translateX(-280px); }
        .sidebar.show { transform: translateX(0); }
    }

    /* 3. Header - เรียบหรูสไตล์ Apple */
    .sidebar-header {
        padding: 30px 24px;
        font-size: 20px;
        font-weight: 700;
        background: rgba(255, 255, 255, 0.5);
        color: #1c1c1e;
        border-bottom: 0.5px solid rgba(0, 0, 0, 0.1);
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 12px;
        letter-spacing: -0.5px;
    }
    
    .sidebar-header i {
        color: #007aff; /* สีฟ้า iOS */
        font-size: 22px;
    }

    /* 4. รายการเมนู - เน้นความชัดเจน (High Contrast) */
    .menu {
        display: flex;
        flex-direction: column;
        padding: 15px 12px 100px 12px;
    }

    .item { margin-bottom: 5px; }

    .menu a, .menu .drop-btn {
        width: 100%;
        min-height: 50px;
        padding: 12px 16px;
        background: transparent;
        border: none;
        border-radius: 12px;
        color: #1c1c1e; /* สีตัวหนังสือเข้มชัดเจน */
        text-align: left;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        text-decoration: none;
        transition: all 0.2s ease;
        position: relative;
    }

    /* Hover Effect - ใช้สีเทาอ่อนแบบ iOS */
    .menu a:hover, .menu .drop-btn:hover {
        background: rgba(0, 0, 0, 0.05);
        color: #007aff;
    }

    /* 5. เมนูย่อย (Submenu) - ก้อนเนื้อหาแยกชั้นชัดเจน */
    .sub {
        display: none;
        background: rgba(0, 0, 0, 0.03);
        margin: 4px 8px;
        border-radius: 12px;
        padding: 4px 0;
    }

    .item.open .sub {
        display: block;
        animation: iosSlideDown 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .sub a {
        padding-left: 45px;
        font-size: 14px;
        color: #3a3a3c;
        min-height: 44px;
        font-weight: 400;
    }

    .sub a:hover {
        color: #007aff;
        background: rgba(0, 122, 255, 0.1);
    }

    /* 6. ลูกศร - เรียบง่าย */
    .arrow {
        margin-left: auto;
        transition: transform 0.3s ease;
        font-size: 11px;
        color: #8e8e93;
    }

    .item.open .arrow {
        transform: rotate(90deg);
        color: #007aff;
    }

    /* Keyframes */
    @keyframes iosSlideDown {
        from { opacity: 0; transform: scaleY(0.95) translateY(-10px); }
        to { opacity: 1; transform: scaleY(1) translateY(0); }
    }

    /* Scrollbar */
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.1);
        border-radius: 10px;
    }
</style>

<script>
    window.toggleDrop = function(btn, id) {
        const item = btn.closest('.item'); 
        if (!item) return;

        const isOpen = item.classList.toggle("open");
        
        if (id) {
            localStorage.setItem('menu-' + id, isOpen);
        }
    }

    function restoreMenuState() {
        const menus = ['credit', 'branch']; 
        menus.forEach(id => {
            if (localStorage.getItem('menu-' + id) === 'true') {
                const menuEl = document.getElementById('menu-' + id);
                if (menuEl) menuEl.classList.add('open');
            }
        });
    }

    document.addEventListener('DOMContentLoaded', restoreMenuState);
</script>
