<style>
    /* 1. โครงสร้างหลักของ Sidebar */
    .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 260px;
        height: 100vh;
        height: 100dvh;
        background: #1e293b;
        color: #fff;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 2. การตั้งค่าแยก Desktop และ Mobile */
    @media (max-width: 991.98px) {
        .sidebar {
            transform: translateX(-260px);
        }
        .sidebar.show {
            transform: translateX(0);
        }
    }

    @media (min-width: 992px) {
        .sidebar {
            transform: translateX(0);
            border-right: 1px solid rgba(255,255,255,0.05);
        }
    }

    /* 3. ส่วนหัว Sidebar */
    .sidebar-header {
        padding: 25px 20px;
        font-size: 18px;
        font-weight: 600;
        background: #0f172a;
        color: #fff;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    /* 4. รายการเมนู */
    .menu {
        display: flex;
        flex-direction: column;
        padding: 10px 0 100px 0;
    }

    .item {
        border-bottom: 1px solid rgba(255,255,255,0.03);
    }

    .menu a, .menu .drop-btn {
        width: 100%;
        min-height: 50px;
        padding: 12px 20px;
        background: none;
        border: none;
        color: #cbd5e1;
        text-align: left;
        font-size: 15px;
        cursor: pointer;
        display: flex;
        align-items: center;
        text-decoration: none;
        transition: all 0.2s ease;
        gap: 12px;
    }

    /* สไตล์ไอคอน SVG ในเมนูหลัก */
    .menu svg {
        width: 18px;
        height: 18px;
        fill: currentColor;
        flex-shrink: 0;
    }

    .menu a:hover, .menu .drop-btn:hover {
        background: #334155;
        color: #fff;
        padding-left: 25px;
    }

    /* เมนูย่อย */
    .sub {
        display: none;
        background: #0f172a;
        padding: 5px 0;
    }

    .item.open .sub {
        display: block;
    }

    .sub a {
        padding-left: 45px;
        font-size: 14px;
        color: #94a3b8;
        min-height: 40px;
        gap: 10px;
    }

    .sub a svg {
        width: 14px;
        height: 14px;
    }

    .sub a:hover {
        color: #5bbf8a;
        padding-left: 50px;
    }

    /* ลูกศร */
    .arrow {
        margin-left: auto;
        transition: 0.3s;
        opacity: 0.5;
        width: 10px !important;
        height: 10px !important;
    }

    .item.open .arrow {
        transform: rotate(90deg);
    }

    /* สกロールบาร์ */
    .sidebar::-webkit-scrollbar {
        width: 4px;
    }
    .sidebar::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.1);
        border-radius: 10px;
    }
</style>

<script>
    // ฟังก์ชัน กาง-หุบ เมนูย่อย
    window.toggleDrop = function(btn, id) {
        const item = btn.closest('.item'); 
        if (!item) return;

        const isOpen = item.classList.toggle("open");
        
        if (id) {
            localStorage.setItem('menu-' + id, isOpen);
        }
    }

    // ฟังก์ชันคืนค่าสถานะเมนูที่เคยเปิดไว้
    function restoreMenuState() {
        const menus = ['credit', 'branch']; 
        menus.forEach(id => {
            if (localStorage.getItem('menu-' + id) === 'true') {
                const menuEl = document.getElementById('menu-' + id);
                if (menuEl) menuEl.classList.add('open');
            }
        });
    }

    // รันฟังก์ชันคืนค่าสถานะ
    restoreMenuState();
</script>
