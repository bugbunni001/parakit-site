<style>
    /* 1. โครงสร้างหลักของ Sidebar - iOS Glassmorphism */
    .sidebar {
        position: fixed;
        top: 15px; /* ลอยจากขอบบน */
        left: 15px; /* ลอยจากขอบซ้าย */
        width: 280px;
        height: calc(100vh - 30px);
        background: rgba(255, 255, 255, 0.4); /* โปร่งแสง */
        backdrop-filter: blur(20px) saturate(180%); /* เอฟเฟกต์กระจกฝ้า */
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.5); /* เส้นขอบแก้ว */
        border-radius: 24px; /* มุมโค้งมนแบบ iOS */
        color: #1c1c1e;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        overflow-x: hidden;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    /* Dark Mode Support (Optional) */
    @media (prefers-color-scheme: dark) {
        .sidebar {
            background: rgba(28, 28, 30, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }
    }

    /* 2. Responsive Settings */
    @media (max-width: 991.98px) {
        .sidebar { transform: translateX(-310px); }
        .sidebar.show { transform: translateX(0); }
    }

    /* 3. Header - เรียบหรูสไตล์ Apple */
    .sidebar-header {
        padding: 25px 20px;
        font-size: 18px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 0.5px solid rgba(0, 0, 0, 0.1);
        background: rgba(255, 255, 255, 0.2);
    }

    /* 4. รายการเมนู - ปรับให้เหมือน List ใน iOS Settings */
    .menu {
        display: flex;
        flex-direction: column;
        padding: 15px 12px;
    }

    .item { margin-bottom: 2px; }

    .menu a, .menu .drop-btn {
        width: 100%;
        min-height: 44px;
        padding: 10px 14px;
        background: transparent;
        border: none;
        border-radius: 12px;
        color: inherit;
        text-align: left;
        font-size: 15px;
        font-weight: 400;
        cursor: pointer;
        display: flex;
        align-items: center;
        text-decoration: none;
        transition: background 0.2s ease;
    }

    /* Hover Effect - ใช้สีเทาอ่อนจางๆ */
    .menu a:hover, .menu .drop-btn:hover {
        background: rgba(0, 0, 0, 0.05);
    }

    /* Active State สำหรับปุ่มที่ถูกกด */
    .menu a:active, .menu .drop-btn:active {
        background: rgba(0, 0, 0, 0.1);
        transform: scale(0.98);
    }

    /* 5. เมนูย่อย (Submenu) - เหมือนกาง Folder */
    .sub {
        display: none;
        background: rgba(0, 0, 0, 0.03);
        margin: 4px 8px;
        border-radius: 12px;
        overflow: hidden;
    }

    .item.open .sub {
        display: block;
        animation: iosSlideDown 0.3s ease-out;
    }

    .sub a {
        padding-left: 45px;
        font-size: 14px;
        color: rgba(0, 0, 0, 0.6);
    }
    
    @media (prefers-color-scheme: dark) {
        .sub a { color: rgba(255, 255, 255, 0.6); }
        .menu a:hover, .menu .drop-btn:hover { background: rgba(255, 255, 255, 0.1); }
    }

    /* 6. ลูกศร - ใช้สไตล์ Chevron */
    .arrow {
        margin-left: auto;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        font-size: 12px;
        opacity: 0.3;
    }

    .item.open .arrow {
        transform: rotate(90deg);
        opacity: 0.8;
    }

    /* iOS Style Animation */
    @keyframes iosSlideDown {
        from { opacity: 0; transform: translateY(-5px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* สกロールบาร์ - ซ่อนไว้จนกว่าจะเลื่อนเหมือน iOS */
    .sidebar::-webkit-scrollbar { width: 3px; }
    .sidebar::-webkit-scrollbar-thumb {
        background: rgba(0, 0, 0, 0.1);
        border-radius: 10px;
    }
</style>

<script>
    // ฟังก์ชัน กาง-หุบ เมนูย่อย (รักษาความเสถียรเดิม)
    window.toggleDrop = function(btn, id) {
        const item = btn.closest('.item'); 
        if (!item) return;

        const isOpen = item.classList.toggle("open");
        
        if (id) {
            localStorage.setItem('menu-' + id, isOpen);
        }
    }

    // ฟังก์ชันคืนค่าสถานะเมนู
    function restoreMenuState() {
        const menus = ['credit', 'branch']; 
        menus.forEach(id => {
            if (localStorage.getItem('menu-' + id) === 'true') {
                const menuEl = document.getElementById('menu-' + id);
                if (menuEl) menuEl.classList.add('open');
            }
        });
    }

    document.addEventListener('DOMContentLoaded', restoreMenuState);
</script>
