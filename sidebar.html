<script src="https://unpkg.com/lucide@latest"></script>

<style>
    /* 1. โครงสร้างหลักของ Sidebar (Modern Look) */
    .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 260px;
        height: 100vh;
        height: 100dvh;
        background: #0f172a; /* เข้มขึ้นเพื่อให้ดูพรีเมียม */
        color: #f8fafc;
        z-index: 2000;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* 2. การตั้งค่าแยก Desktop และ Mobile */
    @media (max-width: 991.98px) {
        .sidebar { transform: translateX(-260px); }
        .sidebar.show { transform: translateX(0); }
    }

    @media (min-width: 992px) {
        .sidebar { transform: translateX(0); border-right: 1px solid rgba(255,255,255,0.05); }
    }

    /* 3. ส่วนหัว Sidebar */
    .sidebar-header {
        padding: 30px 24px;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.5px;
        background: #0f172a;
        color: #fff;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 12px;
    }
    
    .sidebar-header i {
        color: #3b82f6; /* สีฟ้าเน้นจุดเด่น */
    }

    /* 4. รายการเมนู */
    .menu {
        display: flex;
        flex-direction: column;
        padding: 15px 12px 100px 12px; /* เพิ่ม Padding รอบๆ ให้ดูไม่ติดขอบ */
        gap: 4px;
    }

    .item {
        border-radius: 8px;
        overflow: hidden;
        transition: all 0.2s ease;
    }

    .menu a, .menu .drop-btn {
        width: 100%;
        min-height: 48px;
        padding: 10px 16px;
        background: none;
        border: none;
        color: #94a3b8;
        text-align: left;
        font-size: 14.5px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        text-decoration: none;
        transition: all 0.2s ease;
        border-radius: 8px;
        gap: 12px;
    }

    /* SVG Icon Style */
    .menu i, .menu svg {
        width: 18px;
        height: 18px;
        stroke-width: 2px;
    }

    .menu a:hover, .menu .drop-btn:hover {
        background: rgba(255, 255, 255, 0.05);
        color: #fff;
    }
    
    /* เมนูที่กำลังเปิดอยู่ */
    .item.open > .drop-btn {
        color: #fff;
        background: rgba(255, 255, 255, 0.03);
    }

    /* เมนูย่อย */
    .sub {
        display: none;
        background: rgba(0, 0, 0, 0.2);
        padding: 4px 0;
        margin-top: 2px;
        border-radius: 0 0 8px 8px;
    }

    .item.open .sub {
        display: block;
    }

    .sub a {
        padding-left: 46px;
        font-size: 13.5px;
        color: #64748b;
        min-height: 38px;
    }

    .sub a:hover {
        color: #10b981; /* สีเขียว Success */
        background: none;
        padding-left: 50px;
    }

    /* ลูกศร */
    .arrow {
        margin-left: auto;
        transition: transform 0.3s ease;
        opacity: 0.5;
    }

    .item.open .arrow {
        transform: rotate(90deg);
        opacity: 1;
    }

    /* สกロールบาร์แบบเรียบง่าย */
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.05);
        border-radius: 10px;
    }
</style>

<script>
    // เริ่มใช้งาน Lucide Icons
    lucide.createIcons();

    // ฟังก์ชัน กาง-หุบ เมนูย่อย
    window.toggleDrop = function(btn, id) {
        const item = btn.closest('.item'); 
        if (!item) return;

        const isOpen = item.classList.toggle("open");
        
        if (id) {
            localStorage.setItem('menu-' + id, isOpen);
        }
    }

    // ฟังก์ชันคืนค่าสถานะเมนูที่เคยเปิดไว้
    function restoreMenuState() {
        const menus = ['credit', 'branch']; 
        menus.forEach(id => {
            if (localStorage.getItem('menu-' + id) === 'true') {
                const menuEl = document.getElementById('menu-' + id);
                if (menuEl) menuEl.classList.add('open');
            }
        });
    }

    restoreMenuState();
</script>
