<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ดาวน์โหลด parakit-site</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ios-blue: #007aff;
            --ios-bg: #f2f2f7;
            --glass-white: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.5);
            --sidebar-dark: rgba(28, 28, 30, 0.96);
            --text-main: #1c1c1e;
            --text-light: #8e8e93;
            --transition-swift: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* ===== GLOBAL RESET & เดิม ===== */
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif !important; }
        
        body { 
            margin: 0; 
            background-color: var(--ios-bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 122, 255, 0.08) 0px, transparent 40%), 
                radial-gradient(at 100% 100%, rgba(255, 45, 85, 0.06) 0px, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main); 
            -webkit-font-smoothing: antialiased;
            padding-bottom: 60px;
            overflow-x: hidden;
        }

        /* ===== LOCK FULL PAGE (คงเดิม) ===== */
        .lock-page { position: fixed; inset: 0; background: #1e293b; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .lock-box { background: #ffffff; padding: 40px 30px; border-radius: 24px; text-align: center; width: 320px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .lock-box h3 { margin: 0 0 20px 0; color: #1e293b; font-weight: 600; }
        .lock-box input { width: 100%; padding: 12px 16px; font-size: 18px; margin-bottom: 15px; border: 1.5px solid #e2e8f0; border-radius: 12px; text-align: center; letter-spacing: 4px; outline: none; transition: 0.3s; }
        .lock-box input:focus { border-color: #5bbf8a; box-shadow: 0 0 0 4px rgba(91, 191, 138, 0.1); }
        .lock-box button { width: 100%; padding: 14px; background: #5bbf8a; color: white; border: none; font-size: 16px; font-weight: 600; border-radius: 12px; cursor: pointer; transition: 0.3s; }
        .lock-box button:hover { background: #4eab7a; transform: translateY(-2px); }
        .error { color: #ef4444; font-size: 14px; margin-top: 10px; font-weight: 400; }

        /* ===== Header Navbar ===== */
        .top-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 60px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            z-index: 1000;
            display: flex;
            align-items: center;
            padding: 0 20px 0 75px; 
            border-bottom: 0.5px solid rgba(0,0,0,0.1);
        }

        .content { 
            padding: 80px 20px 40px; 
            max-width: 1200px; 
            margin: 0 auto; 
            animation: fadeIn 0.8s ease-out; 
            display: none; /* ซ่อนไว้รอปลดล็อค */
        }

        /* ===== Floating Draggable Button ===== */
        #floatingMenuBtn {
            position: fixed;
            top: 10px;
            left: 15px;
            width: 45px;
            height: 45px;
            background: var(--ios-blue);
            color: white;
            border-radius: 50%;
            display: none; /* ซ่อนไว้รอปลดล็อค */
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: move;
            z-index: 2100;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
            border: none;
            touch-action: none;
            transition: transform 0.2s, opacity 0.2s;
        }
        #floatingMenuBtn:active { transform: scale(0.9); }

        /* ===== Floating Sidebar ===== */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.2);
            z-index: 2000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .sidebar-overlay.active { display: block; opacity: 1; }

        .sidebar-float {
            position: fixed;
            width: 280px;
            max-height: 70vh;
            background: var(--sidebar-dark);
            border-radius: 20px;
            overflow-y: auto;
            z-index: 2001;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.8) translateY(10px);
            transition: opacity 0.3s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.2) transparent;
        }
        .sidebar-float.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1) translateY(0);
        }

        /* Sidebar Content Styles */
        .sidebar-float .sidebar-header { padding: 20px; font-size: 17px; font-weight: 600; color: #fff; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
        .sidebar-float .menu { padding: 8px 0; display: block; }
        .sidebar-float .menu a, .sidebar-float .drop-btn { 
            width: 100%; padding: 12px 20px; background: none; border: none; 
            color: #ebebf5; text-align: left; font-size: 14px; cursor: pointer; 
            display: flex; align-items: center; text-decoration: none; transition: 0.2s;
        }
        .sidebar-float .menu a:hover, .sidebar-float .drop-btn:hover { background: rgba(255,255,255,0.1); padding-left: 20px; }
        .sidebar-float .sub { display: none; background: rgba(0,0,0,0.2); }
        .sidebar-float .item.open .sub { display: block; }
        .sidebar-float .sub a { padding-left: 45px; font-size: 13px; color: #8e8e93; }

        /* ===== MAIN BUTTONS (คงเดิม) ===== */
        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; max-width: 1000px; margin: 20px auto; }
        .btn { background: #fff; color: #1e293b; padding: 24px 20px; border-radius: 20px; text-align: center; font-size: 16px; text-decoration: none; transition: all 0.3s ease; font-weight: 600; border: 1px solid #f1f5f9; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
        .btn:hover { background: #5bbf8a; color: #fff; box-shadow: 0 20px 25px -5px rgba(91, 191, 138, 0.3); transform: translateY(-5px); border-color: #5bbf8a; }

        footer { text-align: center; padding: 60px 20px 40px; color: var(--text-light); font-size: 12px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            .top-header { padding-left: 70px; }
        }
    </style>
</head>

<body>

<div class="lock-page" id="lockPage">
    <div class="lock-box">
        <h3>🔒 ใส่รหัสเข้าใช้งาน</h3>
        <input type="password" id="password" placeholder="••••" autofocus onkeydown="if(event.key==='Enter') checkPass()">
        <button onclick="checkPass()">เข้าสู่ระบบ</button>
        <div class="error" id="error"></div>
    </div>
</div>

<header class="top-header">
    <div style="font-weight: 700; font-size: 1.25rem; color: var(--text-main); letter-spacing: -0.8px;">ดาวน์โหลด</div>
</header>

<button id="floatingMenuBtn" title="ลากเพื่อย้าย">เมนู</button>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebarFloat()"></div>
<aside class="sidebar-float" id="sidebarFloat"></aside>

<div class="content" id="mainContent">
    <div class="container">
        <a class="btn" href="https://drive.usercontent.google.com/download?id=1G-pjJW6nrpi6NWiw7N52p4iYa5i6qsqG&export=download" target="_blank">
            <span>📄</span> ใบเตือน HRM 003
        </a>
        <a class="btn" href="https://drive.usercontent.google.com/download?id=1kRlJsp2TXV9cfnBITiLRnAZSQ3z-nBrl&export=download" target="_blank">
            <span>📄</span> ใบเตือน HRM 004
        </a>
        <a class="btn" href="https://url.in.th/KDMww" target="_blank">
            <span>🔳</span> QR CODE UMAY+ (1)
        </a>
        <a class="btn" href="https://url.in.th/lELFu" target="_blank">
            <span>🔳</span> QR CODE UMAY+ (2)
        </a>
    </div>
    <footer>© 2026 Copy Right By Angerina Frog</footer>
</div>

<script>
    const PASS = "0285";
    const dragBtn = document.getElementById('floatingMenuBtn');
    const sideFloat = document.getElementById('sidebarFloat');
    const sideOverlay = document.getElementById('sidebarOverlay');
    let isDragging = false;
    let startX, startY;
    let shiftX, shiftY;

    // --- 1. ระบบปลดล็อค (คงเดิมแต่เพิ่มการแสดงปุ่มเมนู) ---
    function checkPass() {
        const input = document.getElementById("password");
        if (input.value === PASS) {
            document.getElementById("lockPage").style.display = "none";
            document.getElementById("mainContent").style.display = "block";
            dragBtn.style.display = "flex";
            loadButtonPosition();
        } else {
            document.getElementById("error").innerText = "❌ รหัสไม่ถูกต้อง กรุณาลองใหม่";
            input.value = "";
            input.focus();
        }
    }

    // --- 2. ระบบ Floating Menu (Copy 1:1) ---
    function loadButtonPosition() {
        const savedLeft = localStorage.getItem('floatBtnLeft');
        const savedTop = localStorage.getItem('floatBtnTop');
        if (savedLeft && savedTop) {
            dragBtn.style.left = savedLeft + 'px';
            dragBtn.style.top = savedTop + 'px';
        }
    }

    dragBtn.onpointerdown = function(e) {
        isDragging = false;
        startX = e.clientX;
        startY = e.clientY;
        const rect = dragBtn.getBoundingClientRect();
        shiftX = e.clientX - rect.left;
        shiftY = e.clientY - rect.top;
        dragBtn.setPointerCapture(e.pointerId);
        document.addEventListener('pointermove', onPointerMove);
        document.addEventListener('pointerup', onPointerUp);
    };

    function onPointerMove(e) {
        if (!isDragging && (Math.abs(e.clientX - startX) > 5 || Math.abs(e.clientY - startY) > 5)) {
            isDragging = true;
        }
        if (isDragging) {
            let newX = e.clientX - shiftX;
            let newY = e.clientY - shiftY;
            newX = Math.max(0, Math.min(newX, window.innerWidth - dragBtn.offsetWidth));
            newY = Math.max(0, Math.min(newY, window.innerHeight - dragBtn.offsetHeight));
            dragBtn.style.left = newX + 'px';
            dragBtn.style.top = newY + 'px';
        }
    }

    function onPointerUp(e) {
        document.removeEventListener('pointermove', onPointerMove);
        document.removeEventListener('pointerup', onPointerUp);
        dragBtn.releasePointerCapture(e.pointerId);
        if (isDragging) {
            localStorage.setItem('floatBtnLeft', dragBtn.offsetLeft);
            localStorage.setItem('floatBtnTop', dragBtn.offsetTop);
        } else {
            toggleSidebarFloat();
        }
        isDragging = false;
    }

    function toggleSidebarFloat() {
        const btnRect = dragBtn.getBoundingClientRect();
        const sidebarWidth = 280;
        let top = btnRect.bottom + 10;
        let left = btnRect.left;
        if (left + sidebarWidth > window.innerWidth) left = window.innerWidth - sidebarWidth - 15;
        if (top + 400 > window.innerHeight) {
            top = btnRect.top - 410;
            if (top < 10) top = 10;
        }
        sideFloat.style.top = top + 'px';
        sideFloat.style.left = left + 'px';
        sideFloat.style.transformOrigin = `${btnRect.left - left + 20}px ${btnRect.top > top ? 'bottom' : 'top'}`;
        const isActive = sideFloat.classList.toggle('active');
        sideOverlay.classList.toggle('active', isActive);
        if (isActive && !sideFloat.innerHTML) loadSidebarContent();
    }

    function closeSidebarFloat() {
        sideFloat.classList.remove('active');
        sideOverlay.classList.remove('active');
    }

    function loadSidebarContent() {
        const version = new Date().getTime();
        fetch(`sidebar.html?v=${version}`)
            .then(res => res.text())
            .then(data => {
                sideFloat.innerHTML = `<div class="sidebar-header">เมนูนำทาง</div>` + data;
                ['credit', 'branch', 'sales'].forEach(id => {
                    if (localStorage.getItem('menu-' + id) === 'true') {
                        const el = sideFloat.querySelector('#menu-' + id);
                        if (el) el.classList.add('open');
                    }
                });
            });
    }

    window.toggleDrop = function(btn, id) {
        const item = btn.parentElement;
        const isOpen = item.classList.toggle("open");
        if (id) localStorage.setItem('menu-' + id, isOpen);
    }

    window.onload = function () {
        document.getElementById("password").focus();
    }
</script>

</body>
</html>
