<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matเครื่อง - Parakit-site</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ios-blue: #007aff;
            --ios-green: #34c759;
            --ios-bg: #f2f2f7;
            --sidebar-dark: rgba(28, 28, 30, 0.96); /* ปรับตาม index.html */
            --glass-white: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-main: #1c1c1e;
            --text-light: #8e8e93;
            --transition-swift: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* ===== GLOBAL RESET ===== */
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif !important; }
        
        body { 
            margin: 0; 
            background-color: var(--ios-bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 122, 255, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(52, 199, 89, 0.05) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main); 
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            padding-bottom: 60px;
        }

        /* ===== Floating Draggable Button (จาก index.html 1:1) ===== */
        #floatingMenuBtn {
            position: fixed;
            top: 10px;
            left: 15px;
            width: 45px;
            height: 45px;
            background: var(--ios-blue);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: move;
            z-index: 2100;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
            border: none;
            touch-action: none;
            transition: transform 0.2s, opacity 0.2s;
        }
        #floatingMenuBtn:active { transform: scale(0.9); }

        /* ===== Floating Sidebar (จาก index.html 1:1) ===== */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.2);
            z-index: 2000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .sidebar-overlay.active { display: block; opacity: 1; }

        .sidebar-float {
            position: fixed;
            width: 280px;
            max-height: 70vh;
            background: var(--sidebar-dark);
            border-radius: 20px;
            overflow-y: auto;
            z-index: 2001;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.8) translateY(10px);
            transition: opacity 0.3s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.2) transparent;
        }
        .sidebar-float.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1) translateY(0);
        }

        /* Sidebar Content Styles */
        .sidebar-float .sidebar-header { padding: 20px; font-size: 17px; font-weight: 600; color: #fff; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
        .sidebar-float .menu { padding: 8px 0; }
        .sidebar-float .menu a, .sidebar-float .drop-btn { 
            width: 100%; padding: 12px 20px; background: none; border: none; 
            color: #ebebf5; text-align: left; font-size: 14px; cursor: pointer; 
            display: flex; align-items: center; text-decoration: none; transition: 0.2s;
        }
        .sidebar-float .menu a:hover, .sidebar-float .drop-btn:hover { background: rgba(255,255,255,0.1); }
        .sidebar-float .sub { display: none; background: rgba(0,0,0,0.2); }
        .sidebar-float .item.open .sub { display: block; }
        .sidebar-float .sub a { padding-left: 45px; font-size: 13px; color: #8e8e93; }

        /* MAIN CONTENT */
        .content { padding: 80px 20px 40px; transition: var(--transition); max-width: 1200px; margin: 0 auto; }
        
        .header-section { text-align: center; margin-bottom: 35px; animation: fadeIn 0.8s ease-out; }
        .header-section h2 { margin-bottom: 8px; font-size: 32px; font-weight: 600; letter-spacing: -1px; }
        .header-section p { 
            color: var(--ios-blue); font-weight: 500; font-size: 18px;
            background: rgba(0, 122, 255, 0.08); display: inline-block; padding: 4px 16px; border-radius: 20px;
        }

        /* EDITOR CARD (Glassmorphism) */
        .editor-card { 
            background: var(--glass-white); 
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-radius: 35px; padding: 25px; 
            border: 1px solid var(--glass-border);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.05); 
            max-width: 1100px; margin: 0 auto; 
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        #editor-container { 
            height: 600px; font-size: 16px; 
            border: 1px solid rgba(0,0,0,0.03) !important; 
            border-radius: 0 0 24px 24px; 
            background: rgba(255,255,255,0.4);
        }
        
        .locked .ql-toolbar { display: none; }
        .locked #editor-container { border-radius: 24px; border-top: 1px solid rgba(0,0,0,0.03) !important; }

        /* Quill Customization */
        .ql-toolbar.ql-snow { 
            border: 1px solid rgba(0,0,0,0.03) !important; 
            border-radius: 24px 24px 0 0; 
            background: rgba(255,255,255,0.6); 
            padding: 12px !important;
        }
        .ql-container.ql-snow { border-top: none !important; }
        
        /* BUTTONS (iOS Style) */
        .btn-group { display: flex; justify-content: center; gap: 15px; margin-top: 30px; }
        .btn { 
            padding: 14px 35px; border-radius: 18px; border: none; 
            font-weight: 600; cursor: pointer; transition: var(--transition); 
            font-size: 16px; display: flex; align-items: center; gap: 10px; 
        }
        .btn-edit { background: var(--ios-blue); color: white; box-shadow: 0 8px 25px rgba(0,122,255,0.25); }
        .btn-save { background: var(--ios-green); color: white; display: none; box-shadow: 0 8px 25px rgba(52,199,89,0.25); }
        .btn:hover { transform: translateY(-4px) scale(1.02); opacity: 0.95; }
        .btn:active { transform: scale(0.96); }

        /* MODAL (iOS Alert Style) */
        .modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.3); display: none; align-items: center; justify-content: center; z-index: 3000; backdrop-filter: blur(10px); }
        .modal-content { 
            background: var(--glass-white); 
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            padding: 30px; border-radius: 28px; text-align: center; width: 340px; 
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 70px rgba(0,0,0,0.2);
            animation: modalPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes modalPop { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        
        .modal-content h3 { margin-top: 0; font-size: 20px; font-weight: 600; }
        .modal-content input { 
            width: 100%; padding: 15px; margin: 15px 0; 
            border: 1px solid rgba(0,0,0,0.08); border-radius: 14px; 
            font-size: 22px; text-align: center; outline: none; background: rgba(255,255,255,0.5);
            transition: all 0.3s;
        }
        .modal-content input:focus { border-color: var(--ios-blue); background: #fff; box-shadow: 0 0 0 4px rgba(0,122,255,0.1); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div id="pwdModal" class="modal">
    <div class="modal-content">
        <h3>🔑 ยืนยันรหัสผ่าน</h3>
        <p style="color:var(--text-light); font-size: 14px; margin-bottom: 5px;">โปรดระบุรหัสเพื่อเข้าถึงโหมดแก้ไข</p>
        <input type="password" id="pwdInput" placeholder="••••••••" onkeydown="if(event.key==='Enter') checkPassword()">
        <button class="btn btn-edit" style="width: 100%; justify-content: center;" onclick="checkPassword()">ยืนยัน</button>
        <button onclick="closeModal()" style="margin-top:18px; background:none; border:none; color:var(--ios-blue); cursor:pointer; font-size:16px; font-weight:500;">ยกเลิก</button>
    </div>
</div>

<button id="floatingMenuBtn" title="ลากเพื่อย้าย">เมนู</button>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebarFloat()"></div>
<aside class="sidebar-float" id="sidebarFloat"></aside>

<main class="content">
    <div class="header-section">
        <h2>📦 Material Code</h2>
        <p>SAMSUNG & APPLE</p>
    </div>

    <div class="editor-card locked" id="editor-wrapper">
        <div id="editor-container">
            <p id="loading-text" style="padding:40px; text-align:center; color:var(--text-light);">⏳ กำลังดึงข้อมูล Mat สินค้า กรุณารอสักครู่...</p>
        </div>
        <div class="btn-group">
            <button id="btnEdit" class="btn btn-edit" onclick="openModal()">✏️ แก้ไขข้อมูล</button>
            <button id="btnSave" class="btn btn-save" onclick="saveData()">💾 บันทึกข้อมูล</button>
        </div>
    </div>
</main>

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwEiM60_MBFU21Gz98AIvaPKw1kW81txonhCdISDsdCNlPBheIf3HNcHG1XOyutp3XrCg/exec'; 

    const dragBtn = document.getElementById('floatingMenuBtn');
    const sideFloat = document.getElementById('sidebarFloat');
    const sideOverlay = document.getElementById('sidebarOverlay');
    let isDragging = false;
    let startX, startY;
    let shiftX, shiftY;

    document.addEventListener("DOMContentLoaded", () => {
        initEditor();
        loadData();
        loadButtonPosition(); // โหลดตำแหน่งปุ่ม
    });

    // --- ระบบลากปุ่มแบบ Smooth (1:1 จาก index.html) ---
    function loadButtonPosition() {
        const savedLeft = localStorage.getItem('floatBtnLeft');
        const savedTop = localStorage.getItem('floatBtnTop');
        if (savedLeft && savedTop) {
            dragBtn.style.left = savedLeft + 'px';
            dragBtn.style.top = savedTop + 'px';
        }
    }

    dragBtn.onpointerdown = function(e) {
        isDragging = false;
        startX = e.clientX;
        startY = e.clientY;
        const rect = dragBtn.getBoundingClientRect();
        shiftX = e.clientX - rect.left;
        shiftY = e.clientY - rect.top;
        dragBtn.setPointerCapture(e.pointerId);
        document.addEventListener('pointermove', onPointerMove);
        document.addEventListener('pointerup', onPointerUp);
    };

    function onPointerMove(e) {
        if (!isDragging && (Math.abs(e.clientX - startX) > 5 || Math.abs(e.clientY - startY) > 5)) {
            isDragging = true;
        }
        if (isDragging) {
            let newX = e.clientX - shiftX;
            let newY = e.clientY - shiftY;
            newX = Math.max(0, Math.min(newX, window.innerWidth - dragBtn.offsetWidth));
            newY = Math.max(0, Math.min(newY, window.innerHeight - dragBtn.offsetHeight));
            dragBtn.style.left = newX + 'px';
            dragBtn.style.top = newY + 'px';
        }
    }

    function onPointerUp(e) {
        document.removeEventListener('pointermove', onPointerMove);
        document.removeEventListener('pointerup', onPointerUp);
        dragBtn.releasePointerCapture(e.pointerId);
        if (isDragging) {
            localStorage.setItem('floatBtnLeft', dragBtn.offsetLeft);
            localStorage.setItem('floatBtnTop', dragBtn.offsetTop);
        } else {
            toggleSidebarFloat();
        }
        isDragging = false;
    }

    // --- ระบบ Sidebar (1:1 จาก index.html) ---
    function toggleSidebarFloat() {
        const btnRect = dragBtn.getBoundingClientRect();
        const sidebarWidth = 280;
        let top = btnRect.bottom + 10;
        let left = btnRect.left;
        if (left + sidebarWidth > window.innerWidth) {
            left = window.innerWidth - sidebarWidth - 15;
        }
        if (top + 400 > window.innerHeight) {
            top = btnRect.top - 410;
            if (top < 10) top = 10;
        }
        sideFloat.style.top = top + 'px';
        sideFloat.style.left = left + 'px';
        sideFloat.style.transformOrigin = `${btnRect.left - left + 20}px ${btnRect.top > top ? 'bottom' : 'top'}`;
        const isActive = sideFloat.classList.toggle('active');
        sideOverlay.classList.toggle('active', isActive);
        if (isActive && !sideFloat.innerHTML) loadSidebarContent();
    }

    function closeSidebarFloat() {
        sideFloat.classList.remove('active');
        sideOverlay.classList.remove('active');
    }

    function loadSidebarContent() {
        fetch('sidebar.html')
            .then(res => res.text())
            .then(data => {
                sideFloat.innerHTML = `<div class="sidebar-header">เมนูนำทาง</div>` + data;
                ['credit', 'branch', 'sales'].forEach(id => {
                    if (localStorage.getItem('menu-' + id) === 'true') {
                        const el = sideFloat.querySelector('#menu-' + id);
                        if (el) el.classList.add('open');
                    }
                });
            });
    }

    window.toggleDrop = function(btn, id) {
        const item = btn.parentElement;
        const isOpen = item.classList.toggle("open");
        if (id) localStorage.setItem('menu-' + id, isOpen);
    }

    // --- ระบบ Editor & Data (Original 100%) ---
    let quill;
    function initEditor() {
        quill = new Quill('#editor-container', {
            modules: { 
                toolbar: [
                    [{header:[1,2,3,false]}],
                    [{size:['small',false,'large','huge']}],
                    ['bold','italic','underline'],
                    [{color:[]},{background:[]}],
                    ['clean']
                ] 
            },
            theme: 'snow', 
            readOnly: true
        });
    }

    async function loadData() {
        const ts = new Date().getTime();
        try {
            const response = await fetch(scriptURL + "?t=" + ts);
            if (!response.ok) throw new Error('Network error');
            const data = await response.text();
            if (data) {
                quill.root.innerHTML = data;
            } else {
                quill.root.innerHTML = "<p style='text-align:center;'>ไม่มีข้อมูลในระบบ</p>";
            }
        } catch (error) {
            console.error(error);
            quill.root.innerHTML = "<p style='color:#ff3b30; text-align:center; padding:20px;'>❌ ไม่สามารถโหลดข้อมูลได้ โปรดตรวจสอบการเชื่อมต่อ</p>";
        }
    }

    async function saveData() {
        const btnSave = document.getElementById('btnSave');
        const originalContent = btnSave.innerHTML;
        btnSave.innerHTML = "⏳ กำลังบันทึก...";
        btnSave.disabled = true;
        try {
            await fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors', 
                headers: { 'Content-Type': 'text/plain' },
                body: quill.root.innerHTML
            });
            alert("✅ บันทึกข้อมูลพารากิจเรียบร้อยแล้ว!");
            location.reload();
        } catch (e) {
            alert("❌ เกิดข้อผิดพลาดในการบันทึกข้อมูล");
            btnSave.innerHTML = originalContent;
            btnSave.disabled = false;
        }
    }

    function openModal() { 
        document.getElementById('pwdModal').style.display = 'flex'; 
        document.getElementById('pwdInput').focus(); 
    }
    function closeModal() { 
        document.getElementById('pwdModal').style.display = 'none'; 
        document.getElementById('pwdInput').value = ''; 
    }

    function checkPassword() {
        if (document.getElementById('pwdInput').value === "80000397") {
            document.getElementById('editor-wrapper').classList.remove('locked');
            quill.enable(true);
            document.getElementById('btnEdit').style.display = 'none';
            document.getElementById('btnSave').style.display = 'inline-block';
            closeModal();
        } else { 
            alert("ขออภัย! รหัสผ่านไม่ถูกต้อง"); 
            document.getElementById('pwdInput').value = '';
        }
    }
</script>
</body>
</html>
