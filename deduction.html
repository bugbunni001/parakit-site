<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>บันทึกการหักเงิน - Parakit-site</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ios-blue: #007aff; 
            --ios-bg: #f5f5f7; 
            --sidebar-dark: rgba(28, 28, 30, 0.94);
            --glass-white: rgba(255, 255, 255, 0.85); 
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-main: #1d1d1f; 
            --text-light: #86868b; 
            --ios-red: #ff3b30; 
            --ios-green: #34c759;
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            /* Floating Menu Vars จาก index.html */
            --transition-swift: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif !important; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; 
            background-color: var(--ios-bg); 
            color: var(--text-main); 
            -webkit-font-smoothing: antialiased; 
            min-height: 100vh;
        }

        /* ===== FLOATING MENU SYSTEM (1:1 FROM INDEX.HTML) ===== */
        #floatingMenuBtn {
            position: fixed;
            top: 15px;
            left: 15px;
            width: 45px;
            height: 45px;
            background: var(--ios-blue);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: move;
            z-index: 2100;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
            border: none;
            touch-action: none;
            user-select: none;
            transition: transform 0.2s, opacity 0.2s;
        }
        #floatingMenuBtn:active { transform: scale(0.9); }

        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 2000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s var(--transition-swift);
        }
        .sidebar-overlay.active { display: block; opacity: 1; }

        .sidebar-float {
            position: fixed;
            width: 280px;
            max-height: 80vh;
            background: var(--sidebar-dark);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 20px;
            overflow-y: auto;
            z-index: 2001;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.8) translateY(10px);
            transition: opacity 0.3s var(--transition-swift), 
                        transform 0.4s var(--transition-bounce),
                        visibility 0.3s;
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar-float.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1) translateY(0);
        }

        /* Sidebar Internal Styling จาก index.html */
        .sidebar-header { padding: 20px; font-size: 17px; font-weight: 600; color: #fff; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
        .menu { padding: 8px 0; }
        .menu a, .menu .drop-btn { 
            width: 100%; padding: 12px 20px; background: none; border: none; 
            color: #ebebf5; text-align: left; font-size: 14px; cursor: pointer; 
            display: flex; align-items: center; text-decoration: none; transition: 0.2s;
        }
        .menu a:hover, .menu .drop-btn:hover { background: rgba(255,255,255,0.1); }
        .sub { display: none; background: rgba(0,0,0,0.2); }
        .item.open .sub { display: block; }
        .sub a { padding-left: 45px; font-size: 13px; color: #8e8e93; }

        /* ===== DEDUCTION CONTENT LAYOUT (เดิมคงไว้ 100%) ===== */
        .content { padding: 84px 16px 40px; max-width: 1100px; margin: 0 auto; animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }
        .summary-card { 
            background: #fff; padding: 20px; border-radius: 20px; 
            border: 1px solid rgba(0,0,0,0.03); box-shadow: var(--card-shadow);
            transition: var(--transition);
            display: flex; flex-direction: column; gap: 4px;
        }
        .summary-card:hover { transform: translateY(-5px); box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
        .summary-name { font-size: 14px; color: var(--text-light); font-weight: 500; }
        .summary-val { font-size: 24px; font-weight: 700; color: var(--text-main); letter-spacing: -1px; }

        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .btn-add {
            background: var(--ios-blue); color: white; border: none; padding: 12px 24px; 
            border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer;
            transition: var(--transition); box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3);
            display: flex; align-items: center; gap: 8px;
        }
        .btn-add:hover { transform: scale(1.03); filter: brightness(1.1); }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 3000; padding: 20px; backdrop-filter: blur(10px); }
        .modal.show { display: flex; }
        .form-container { 
            background: #fff; padding: 32px; border-radius: 28px; 
            width: 100%; max-width: 480px; box-shadow: 0 30px 60px rgba(0,0,0,0.15);
            animation: modalPop 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes modalPop { from { opacity: 0; transform: scale(0.9) translateY(30px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        input, select { 
            width: 100%; padding: 14px; border: 1.5px solid #f2f2f7; border-radius: 14px; 
            font-size: 16px; background: #f9f9fb; outline: none; transition: 0.2s; 
        }
        input:focus, select:focus { border-color: var(--ios-blue); background: #fff; }
        
        .btn-submit { 
            width: 100%; padding: 16px; border: none; border-radius: 16px; 
            background: var(--ios-blue); color: white; font-size: 17px; font-weight: 600; 
            cursor: pointer; transition: var(--transition); margin-top: 10px;
        }

        .table-box { 
            background: #fff; padding: 24px; border-radius: 24px; 
            border: 1px solid rgba(0,0,0,0.03); box-shadow: var(--card-shadow); overflow: hidden;
        }
        .table-container { width: 100%; overflow-x: auto; border-radius: 16px; border: 1px solid #f2f2f7; }
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th { padding: 14px 16px; text-align: left; color: var(--text-light); font-size: 13px; background: #f9f9fb; }
        td { padding: 16px; border-bottom: 1px solid #f2f2f7; font-size: 15px; }
        
        .amt-red { color: var(--ios-red); font-weight: 700; }
        .btn-delete { background: #fff1f0; border: none; color: var(--ios-red); width: 36px; height: 36px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .popup { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 4000; padding: 20px; backdrop-filter: blur(8px); }
        .popup.show { display: flex; }
        .popup-box { background: #fff; padding: 28px; border-radius: 28px; text-align: center; max-width: 360px; width: 100%; }
        .spinner { width: 32px; height: 32px; border: 3px solid rgba(0,122,255,0.15); border-top-color: var(--ios-blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        footer { text-align: center; padding: 50px 20px; color: var(--text-light); font-size: 12px; }
        .btn-bulk-delete { background: var(--ios-red); color: white; border: none; padding: 10px 18px; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; display: none; }
    </style>
</head>
<body>

<button id="floatingMenuBtn" title="ลากเพื่อย้าย">เมนู</button>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebarFloat()"></div>
<aside class="sidebar-float" id="sidebarFloat"></aside>

<div class="content">
    <div class="summary-container">
        <div class="section-title" style="font-size: 14px; font-weight: 600; color: var(--text-light); text-transform: uppercase; margin-bottom: 12px;">สรุปยอดหักเงินสะสม</div>
        <div class="summary-grid">
            <div class="summary-card"><div class="summary-name">ศุภกฤต</div><div class="summary-val" id="sum-ศุภกฤต">0 ฿</div></div>
            <div class="summary-card"><div class="summary-name">นวพล</div><div class="summary-val" id="sum-นวพล">0 ฿</div></div>
            <div class="summary-card"><div class="summary-name">ปิยะพร</div><div class="summary-val" id="sum-ปิยะพร">0 ฿</div></div>
            <div class="summary-card"><div class="summary-name">กรทักษ์</div><div class="summary-val" id="sum-กรทักษ์">0 ฿</div></div>
        </div>
    </div>

    <div class="action-bar">
        <h3 style="margin:0; font-size: 20px; font-weight: 700;">รายการบันทึกทั้งหมด</h3>
        <button class="btn-add" onclick="openForm()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            เพิ่มข้อมูลใหม่
        </button>
    </div>

    <div class="table-box">
        <div class="table-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <div style="display:flex; gap:12px; align-items:center;">
                <button id="bulkDeleteBtn" class="btn-bulk-delete" onclick="openAuthPopup('bulkDelete')">ลบที่เลือก (<span id="selectedCount">0</span>)</button>
            </div>
            <button onclick="fetchData(true)" style="background:none; border:none; color:var(--ios-blue); font-weight:600; cursor:pointer; font-size:14px;">
                รีเฟรชข้อมูล
            </button>
        </div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width:40px; text-align:center;"><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)"></th>
                        <th>วันที่</th><th>พนักงาน</th><th>เหตุผล</th><th>หมายเหตุ</th><th>หักเงิน</th><th style="width:50px;"></th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="7" style="text-align:center; padding:60px;"><div class="spinner" style="margin:0 auto;"></div></td></tr>
                </tbody>
            </table>
        </div>
        <div class="pagination" id="paginationContainer" style="display:flex; justify-content:center; gap:5px; margin-top:25px;"></div>
    </div>
</div>

<div class="modal" id="formModal" onclick="if(event.target==this) closeForm()">
    <div class="form-container">
        <div style="display:flex; justify-content:space-between; align-items:start; margin-bottom:20px;">
            <div>
                <h3 style="margin: 0; font-size: 22px;">ลงข้อมูลการหักเงิน</h3>
                <p style="color: var(--text-light); font-size: 14px; margin-top: 4px;">ระบุรายละเอียดเพื่อหักเงินพนักงาน</p>
            </div>
            <button onclick="closeForm()" style="background:#f2f2f7; border:none; width:32px; height:32px; border-radius:50%; cursor:pointer;">×</button>
        </div>
        <form id="deductionForm" onsubmit="return false;">
            <div class="form-grid" style="display:grid; gap:18px;">
                <div><label style="font-size:13px; font-weight:600; color:var(--text-light);">วันที่ดำเนินการ</label><input type="date" id="date" required></div>
                <div>
                    <label style="font-size:13px; font-weight:600; color:var(--text-light);">พนักงาน</label>
                    <select id="employee" required>
                        <option value="" disabled selected>-- เลือกรายชื่อ --</option>
                        <option value="ศุภกฤต">ศุภกฤต</option><option value="นวพล">นวพล</option>
                        <option value="ปิยะพร">ปิยะพร</option><option value="กรทักษ์">กรทักษ์</option>
                    </select>
                </div>
                <div><label style="font-size:13px; font-weight:600; color:var(--text-light);">เหตุผลการหักเงิน</label><input type="text" id="reason" placeholder="เช่น มาสาย, ทำของเสียหาย" required></div>
                <div><label style="font-size:13px; font-weight:600; color:var(--text-light);">หมายเหตุเพิ่มเติม</label><input type="text" id="note" placeholder="ใส่รายละเอียดเพิ่มเติม (ถ้ามี)"></div>
                <div><label style="font-size:13px; font-weight:600; color:var(--text-light);">จำนวนเงินที่หัก (บาท)</label><input type="number" id="amount" placeholder="0.00" step="0.01" required></div>
            </div>
            <button type="submit" class="btn-submit" id="btnMainSubmit" onclick="submitForm()">บันทึกข้อมูล</button>
        </form>
    </div>
</div>

<div class="popup" id="authPopup">
    <div class="popup-box">
        <div style="font-size: 40px; margin-bottom: 10px;">🔒</div>
        <h3 style="margin:0 0 8px 0;">ยืนยันสิทธิ์การลบ</h3>
        <p style="font-size: 14px; color: var(--text-light); margin-bottom: 20px;">กรุณากรอกรหัสผ่านเพื่อดำเนินการ</p>
        <input type="password" id="adminPass" style="text-align:center; letter-spacing: 4px;" placeholder="••••">
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button onclick="closeAuthPopup()" style="flex:1; padding:12px; border:none; border-radius:12px; background:#f2f2f7; font-weight:600; cursor:pointer;">ยกเลิก</button>
            <button onclick="confirmAuth()" style="flex:1; padding:12px; border:none; border-radius:12px; background:var(--ios-red); color:white; font-weight:600; cursor:pointer;">ยืนยันลบ</button>
        </div>
    </div>
</div>

<div class="popup" id="statusPopup">
    <div class="popup-box">
        <div id="statusIcon" style="font-size: 48px; margin-bottom: 15px;"></div>
        <h3 id="statusTitle" style="margin:0 0 8px 0;"></h3>
        <p id="statusText" style="font-size: 14px; color: var(--text-light); margin-bottom: 25px;"></p>
        <button onclick="closeStatusPopup()" style="width:100%; padding:14px; border:none; border-radius:14px; background:var(--ios-blue); color:white; font-weight:600; cursor:pointer;">รับทราบ</button>
    </div>
</div>

<div id="loading" class="popup"><div class="popup-box" style="padding:40px;"><div class="spinner" style="margin:0 auto 20px;"></div><p style="margin:0; font-weight:600;">กำลังดำเนินการ...</p></div></div>

<footer>© 2026 Copy Right By Angerina Frog</footer>

<script>
    // --- APP CONFIG ยอดเดิม ---
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz_s0R3v3m1i-r7F8BqO5rB6R8v0P8z-Y8z0P8z0P8z/exec";
    const ADMIN_PASS = "0285";

    // --- FLOATING MENU SCRIPT (1:1 FROM INDEX.HTML) ---
    const dragBtn = document.getElementById('floatingMenuBtn');
    const sideFloat = document.getElementById('sidebarFloat');
    const sideOverlay = document.getElementById('sidebarOverlay');
    let isDragging = false;
    let startX, startY, shiftX, shiftY;

    function loadButtonPosition() {
        const savedLeft = localStorage.getItem('floatBtnLeft');
        const savedTop = localStorage.getItem('floatBtnTop');
        if (savedLeft && savedTop) {
            dragBtn.style.left = savedLeft + 'px';
            dragBtn.style.top = savedTop + 'px';
        }
    }

    dragBtn.onpointerdown = function(e) {
        isDragging = false;
        startX = e.clientX; startY = e.clientY;
        const rect = dragBtn.getBoundingClientRect();
        shiftX = e.clientX - rect.left;
        shiftY = e.clientY - rect.top;
        dragBtn.setPointerCapture(e.pointerId);
        document.addEventListener('pointermove', onPointerMove);
        document.addEventListener('pointerup', onPointerUp);
    };

    function onPointerMove(e) {
        if (!isDragging && (Math.abs(e.clientX - startX) > 5 || Math.abs(e.clientY - startY) > 5)) isDragging = true;
        if (isDragging) {
            let newX = e.clientX - shiftX;
            let newY = e.clientY - shiftY;
            newX = Math.max(0, Math.min(newX, window.innerWidth - dragBtn.offsetWidth));
            newY = Math.max(0, Math.min(newY, window.innerHeight - dragBtn.offsetHeight));
            dragBtn.style.left = newX + 'px';
            dragBtn.style.top = newY + 'px';
        }
    }

    function onPointerUp(e) {
        document.removeEventListener('pointermove', onPointerMove);
        document.removeEventListener('pointerup', onPointerUp);
        dragBtn.releasePointerCapture(e.pointerId);
        if (isDragging) {
            localStorage.setItem('floatBtnLeft', dragBtn.offsetLeft);
            localStorage.setItem('floatBtnTop', dragBtn.offsetTop);
        } else {
            toggleSidebarFloat();
        }
        isDragging = false;
    }

    function toggleSidebarFloat() {
        const btnRect = dragBtn.getBoundingClientRect();
        const sidebarWidth = 280;
        let top = btnRect.bottom + 10;
        let left = btnRect.left;
        if (left + sidebarWidth > window.innerWidth) left = window.innerWidth - sidebarWidth - 15;
        if (top + 450 > window.innerHeight) top = btnRect.top - 460;
        
        sideFloat.style.top = Math.max(10, top) + 'px';
        sideFloat.style.left = Math.max(10, left) + 'px';
        const isActive = sideFloat.classList.toggle('active');
        sideOverlay.classList.toggle('active', isActive);
        if (isActive && !sideFloat.innerHTML) loadSidebarContent();
    }

    function closeSidebarFloat() {
        sideFloat.classList.remove('active');
        sideOverlay.classList.remove('active');
    }

    function loadSidebarContent() {
        const version = new Date().getTime();
        fetch(`sidebar.html?v=${version}`)
            .then(res => res.text())
            .then(data => {
                sideFloat.innerHTML = `<div class="sidebar-header">เมนูนำทาง</div>` + data;
                ['credit', 'branch', 'sales'].forEach(id => {
                    if (localStorage.getItem('menu-' + id) === 'true') {
                        const el = sideFloat.querySelector('#menu-' + id);
                        if (el) el.classList.add('open');
                    }
                });
            });
    }

    window.toggleDrop = function(btn, id) {
        const item = btn.parentElement;
        const isOpen = item.classList.toggle("open");
        if (id) localStorage.setItem('menu-' + id, isOpen);
    }

    // --- LOGIC เดิมของ DEDUCTION.HTML คงไว้ทั้งหมด ---
    let allData = [];
    let currentPage = 1;
    let itemsPerPage = 10;
    let selectedRows = [];
    let isProcessing = false;
    let currentAuthAction = null;
    let currentDeleteIndex = null;

    const svgIcons = {
        success: '<svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#34c759" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>',
        error: '<svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#ff3b30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>'
    };

    function openForm() { document.getElementById('formModal').classList.add('show'); document.getElementById('date').valueAsDate = new Date(); }
    function closeForm() { document.getElementById('formModal').classList.remove('show'); document.getElementById('deductionForm').reset(); }

    async function fetchData(showLoader = false) {
        if(showLoader) setProcessing(true);
        try {
            const res = await fetch(APPS_SCRIPT_URL + "?action=readData");
            const data = await res.json();
            allData = data.slice(1).reverse();
            calculateSummary(allData);
            renderTable();
        } catch (e) { console.error("Fetch error", e); }
        finally { if(showLoader) setProcessing(false); }
    }

    function calculateSummary(data) {
        const sums = { "ศุภกฤต": 0, "นวพล": 0, "ปิยะพร": 0, "กรทักษ์": 0 };
        data.forEach(row => { if(sums.hasOwnProperty(row[1])) sums[row[1]] += parseFloat(row[4] || 0); });
        for(let name in sums) document.getElementById(`sum-${name}`).innerText = sums[name].toLocaleString() + " ฿";
    }

    function renderTable() {
        const start = (currentPage - 1) * itemsPerPage;
        const pageData = allData.slice(start, start + itemsPerPage);
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = pageData.map((row, i) => {
            const idx = allData.length - 1 - (start + i); 
            return `<tr>
                <td style="text-align:center;"><input type="checkbox" class="row-check" data-idx="${idx}" onchange="updateSelection()"></td>
                <td>${row[0]}</td><td>${row[1]}</td><td>${row[2]}</td><td><small style="color:#8e8e93">${row[3] || '-'}</small></td>
                <td class="amt-red">-${parseFloat(row[4]).toLocaleString()} ฿</td>
                <td><button class="btn-delete" onclick="openAuthPopup('delete', ${idx})">ลบ</button></td>
            </tr>`;
        }).join('');
        renderPagination();
    }

    function renderPagination() {
        const totalPages = Math.ceil(allData.length / itemsPerPage);
        const container = document.getElementById('paginationContainer');
        let html = '';
        for(let i=1; i<=totalPages; i++) {
            html += `<button onclick="currentPage=${i}; renderTable();" style="padding:8px 14px; border:none; border-radius:8px; background:${i===currentPage? 'var(--ios-blue)':'#fff'}; color:${i===currentPage?'#fff':'#8e8e93'}; font-weight:600; cursor:pointer;">${i}</button>`;
        }
        container.innerHTML = html;
    }

    async function submitForm() {
        const form = document.getElementById('deductionForm');
        if(!form.checkValidity()) return form.reportValidity();
        setProcessing(true);
        const payload = {
            action: "addRow",
            date: document.getElementById('date').value,
            employee: document.getElementById('employee').value,
            reason: document.getElementById('reason').value,
            note: document.getElementById('note').value,
            amount: document.getElementById('amount').value
        };
        try {
            await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            closeForm(); showStatusPopup("บันทึกข้อมูลสำเร็จแล้ว", true); fetchData(true);
        } catch (e) { showStatusPopup("เกิดข้อผิดพลาดในการบันทึก", false); }
        finally { setProcessing(false); }
    }

    function openAuthPopup(action, idx = null) {
        currentAuthAction = action; currentDeleteIndex = idx;
        document.getElementById('authPopup').classList.add('show');
        document.getElementById('adminPass').focus();
    }

    function closeAuthPopup() { document.getElementById('authPopup').classList.remove('show'); document.getElementById('adminPass').value = ''; }

    function confirmAuth() {
        if(document.getElementById('adminPass').value === ADMIN_PASS) {
            closeAuthPopup();
            if(currentAuthAction === 'delete') deleteData(currentDeleteIndex);
            else if(currentAuthAction === 'bulkDelete') bulkDeleteData();
        } else { alert("รหัสผ่านไม่ถูกต้อง"); }
    }

    async function deleteData(idx) {
        setProcessing(true);
        try {
            await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "deleteRow", rowIndex: idx }) });
            showStatusPopup("ลบรายการแล้ว", true); fetchData(true);
        } catch (e) { showStatusPopup("เกิดข้อผิดพลาด", false); } finally { setProcessing(false); }
    }

    async function bulkDeleteData() {
        setProcessing(true);
        try {
            const sortedIdx = [...selectedRows].sort((a,b) => b-a);
            for(let idx of sortedIdx) await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "deleteRow", rowIndex: idx }) });
            showStatusPopup(`ลบจำนวน ${selectedRows.length} รายการเรียบร้อย`, true); selectedRows = []; fetchData(true);
        } catch (e) { showStatusPopup("เกิดข้อผิดพลาดในการลบหลายรายการ", false); } finally { setProcessing(false); }
    }

    function updateSelection() {
        selectedRows = Array.from(document.querySelectorAll('.row-check:checked')).map(cb => parseInt(cb.dataset.idx));
        document.getElementById('selectedCount').innerText = selectedRows.length;
        document.getElementById('bulkDeleteBtn').style.display = selectedRows.length > 0 ? 'block' : 'none';
    }

    function toggleSelectAll(master) {
        document.querySelectorAll('.row-check').forEach(cb => cb.checked = master.checked);
        updateSelection();
    }

    function setProcessing(val) { isProcessing = val; document.getElementById('loading').style.display = val ? 'flex' : 'none'; document.getElementById('btnMainSubmit').disabled = val; }
    function showStatusPopup(text, isSuccess) {
        document.getElementById("statusIcon").innerHTML = isSuccess ? svgIcons.success : svgIcons.error;
        document.getElementById("statusTitle").innerText = isSuccess ? "สำเร็จ" : "ล้มเหลว";
        document.getElementById("statusText").innerText = text;
        document.getElementById("statusPopup").classList.add("show");
    }
    function closeStatusPopup() { document.getElementById("statusPopup").classList.remove("show"); }

    document.addEventListener('DOMContentLoaded', () => {
        loadButtonPosition();
        fetchData();
    });
</script>
</body>
</html>
