<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>บันทึกการหักเงิน - Parakit-site</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ios-blue: #007aff; 
            --ios-bg: #f5f5f7; 
            --sidebar-dark: rgba(28, 28, 30, 0.96); 
            --glass-white: rgba(255, 255, 255, 0.85); 
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-main: #1d1d1f; 
            --text-light: #86868b; 
            --ios-red: #ff3b30; 
            --ios-green: #34c759;
            --card-shadow: 0 8px 32px rgba(0,0,0,0.08);
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Kanit', sans-serif !important; }
        body { background: var(--ios-bg); color: var(--text-main); min-height: 100vh; display: flex; overflow-x: hidden; }

        /* ===== FLOATING SIDEBAR SYSTEM (New) ===== */
        #floatingMenuBtn {
            position: fixed;
            top: 10px;
            left: 15px;
            width: 45px;
            height: 45px;
            background: var(--ios-blue);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: move;
            z-index: 2100;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
            border: none;
            touch-action: none;
            transition: transform 0.2s, opacity 0.2s;
        }
        #floatingMenuBtn:active { transform: scale(0.9); }

        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.2);
            z-index: 2000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .sidebar-overlay.active { display: block; opacity: 1; }

        .sidebar-float {
            position: fixed;
            width: 280px;
            max-height: 70vh;
            background: var(--sidebar-dark);
            border-radius: 20px;
            overflow-y: auto;
            z-index: 2001;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.8) translateY(10px);
            transition: opacity 0.3s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.2) transparent;
        }
        .sidebar-float.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1) translateY(0);
        }

        .sidebar-float .sidebar-header { padding: 20px; font-size: 17px; font-weight: 600; color: #fff; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
        .sidebar-float .menu { padding: 8px 0; }
        .sidebar-float .menu a, .sidebar-float .drop-btn { 
            width: 100%; padding: 12px 20px; background: none; border: none; 
            color: #ebebf5; text-align: left; font-size: 14px; cursor: pointer; 
            display: flex; align-items: center; text-decoration: none; transition: 0.2s;
        }
        .sidebar-float .menu a:hover, .sidebar-float .drop-btn:hover { background: rgba(255,255,255,0.1); }
        .sidebar-float .sub { display: none; background: rgba(0,0,0,0.2); }
        .sidebar-float .item.open .sub { display: block; }
        .sidebar-float .sub a { padding-left: 45px; font-size: 13px; color: #8e8e93; }

        /* ===== MAIN CONTENT ===== */
        .main-content { flex: 1; padding: 30px; width: 100%; transition: var(--transition); }
        .header { margin-bottom: 30px; padding-top: 40px; }
        .header h1 { font-size: 28px; font-weight: 600; color: var(--text-main); }
        .header p { color: var(--text-light); font-size: 14px; }

        .glass-card {
            background: var(--glass-white);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 25px;
            box-shadow: var(--card-shadow); margin-bottom: 25px;
        }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 13px; font-weight: 500; color: var(--text-light); padding-left: 4px; }
        .input-group input, .input-group select {
            padding: 12px 16px; border-radius: 12px; border: 1px solid #e5e5e7;
            background: #fff; font-size: 15px; outline: none; transition: 0.3s;
        }
        .input-group input:focus, .input-group select:focus { border-color: var(--ios-blue); box-shadow: 0 0 0 4px rgba(0,122,255,0.1); }

        .btn {
            padding: 12px 24px; border-radius: 12px; border: none; font-size: 15px;
            font-weight: 500; cursor: pointer; transition: all 0.2s; display: flex;
            align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary { background: var(--ios-blue); color: #fff; width: 100%; }
        .btn-primary:hover { background: #0066d6; transform: translateY(-1px); }
        .btn-primary:active { transform: translateY(0); }

        .table-container { overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { text-align: left; padding: 15px; font-size: 13px; font-weight: 500; color: var(--text-light); border-bottom: 1px solid #e5e5e7; }
        td { padding: 15px; font-size: 14px; color: var(--text-main); border-bottom: 1px solid #f2f2f7; }
        
        tr.selected { background: rgba(0,122,255,0.05); }
        .badge { padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 500; }
        .badge-red { background: #fff5f5; color: var(--ios-red); }
        
        .action-btns { display: flex; gap: 8px; }
        .icon-btn { 
            width: 32px; height: 32px; border-radius: 8px; border: none; 
            display: flex; align-items: center; justify-content: center; 
            cursor: pointer; transition: 0.2s; background: #f2f2f7;
        }
        .icon-btn:hover { background: #e5e5e7; }
        .icon-btn.delete:hover { background: #fff5f5; color: var(--ios-red); }

        /* Popup Status */
        .status-popup {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: var(--sidebar-dark); color: #fff; padding: 16px 24px;
            border-radius: 16px; display: flex; align-items: center; gap: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 3000; transition: var(--transition);
        }
        .status-popup.show { transform: translateX(-50%) translateY(0); }

        #loading {
            position: fixed; inset: 0; background: rgba(255,255,255,0.8);
            backdrop-filter: blur(5px); z-index: 4000; display: none;
            flex-direction: column; align-items: center; justify-content: center; gap: 15px;
        }
        .spinner { width: 30px; height: 30px; border: 3px solid #f3f3f3; border-top: 3px solid var(--ios-blue); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .main-content { padding: 15px; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<button id="floatingMenuBtn" title="ลากเพื่อย้าย">เมนู</button>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebarFloat()"></div>
<aside class="sidebar-float" id="sidebarFloat"></aside>

<div id="loading">
    <div class="spinner"></div>
    <p>กำลังดำเนินการ...</p>
</div>

<main class="main-content">
    <header class="header">
        <h1>บันทึกการหักเงิน</h1>
        <p>จัดการข้อมูลรายการหักเงินพนักงานและค่าใช้จ่ายสาขา</p>
    </header>

    <div class="glass-card">
        <form id="deductionForm">
            <input type="hidden" id="editRowIndex">
            <div class="form-grid">
                <div class="input-group">
                    <label>วันที่</label>
                    <input type="date" id="date" required>
                </div>
                <div class="input-group">
                    <label>สาขา</label>
                    <select id="branch" required>
                        <option value="">เลือกสาขา</option>
                        <option value="สำนักงานใหญ่">สำนักงานใหญ่</option>
                        <option value="สาขาพัทยา">สาขาพัทยา</option>
                        <option value="สาขาชลบุรี">สาขาชลบุรี</option>
                        <option value="สาขาระยอง">สาขาระยอง</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>ประเภทรายการ</label>
                    <select id="type" required>
                        <option value="">เลือกประเภท</option>
                        <option value="ขาดงาน">ขาดงาน</option>
                        <option value="มาสาย">มาสาย</option>
                        <option value="อุปกรณ์เสียหาย">อุปกรณ์เสียหาย</option>
                        <option value="อื่นๆ">อื่นๆ</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>ชื่อพนักงาน / รายการ</label>
                    <input type="text" id="name" placeholder="ระบุชื่อหรือรายการ" required>
                </div>
                <div class="input-group">
                    <label>จำนวนเงิน (บาท)</label>
                    <input type="number" id="amount" placeholder="0.00" step="0.01" required>
                </div>
            </div>
            <div class="input-group" style="margin-bottom: 20px;">
                <label>หมายเหตุ</label>
                <input type="text" id="note" placeholder="ระบุรายละเอียดเพิ่มเติม (ถ้ามี)">
            </div>
            <button type="submit" class="btn btn-primary" id="submitBtn">
                <span id="btnText">บันทึกข้อมูล</span>
            </button>
        </form>
    </div>

    <div class="glass-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2 style="font-size: 18px; font-weight: 600;">รายการล่าสุด</h2>
            <button class="btn" style="background: var(--ios-red); color: #fff; padding: 8px 16px; font-size: 13px;" onclick="bulkDeleteData()">ลบที่เลือก</button>
        </div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="width: 40px;"><input type="checkbox" id="selectAll"></th>
                        <th>วันที่</th>
                        <th>สาขา</th>
                        <th>ประเภท</th>
                        <th>รายการ</th>
                        <th>จำนวนเงิน</th>
                        <th>หมายเหตุ</th>
                        <th>จัดการ</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    </tbody>
            </table>
        </div>
    </div>
</main>

<div id="statusPopup" class="status-popup">
    <div id="statusIcon"></div>
    <div>
        <h4 id="statusTitle" style="font-size: 15px; margin-bottom: 2px;"></h4>
        <p id="statusText" style="font-size: 13px; opacity: 0.8;"></p>
    </div>
</div>

<script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxIDn-4Yn42YhA6F3C1x9Q4-pX1-yX4-yX4-yX4-yX4-yX4/exec"; 
    let selectedRows = new Set();
    const svgIcons = {
        edit: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`,
        delete: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>`,
        success: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#34c759" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>`,
        error: `<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ff3b30" stroke-width="3"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`
    };

    // --- NEW FLOATING SIDEBAR JS ---
    const dragBtn = document.getElementById('floatingMenuBtn');
    const sideFloat = document.getElementById('sidebarFloat');
    const sideOverlay = document.getElementById('sidebarOverlay');
    let isDragging = false;
    let startX, startY, shiftX, shiftY;

    function loadButtonPosition() {
        const savedLeft = localStorage.getItem('floatBtnLeft');
        const savedTop = localStorage.getItem('floatBtnTop');
        if (savedLeft && savedTop) {
            dragBtn.style.left = savedLeft + 'px';
            dragBtn.style.top = savedTop + 'px';
        }
    }

    dragBtn.onpointerdown = function(e) {
        isDragging = false;
        startX = e.clientX; startY = e.clientY;
        const rect = dragBtn.getBoundingClientRect();
        shiftX = e.clientX - rect.left;
        shiftY = e.clientY - rect.top;
        dragBtn.setPointerCapture(e.pointerId);
        document.addEventListener('pointermove', onPointerMove);
        document.addEventListener('pointerup', onPointerUp);
    };

    function onPointerMove(e) {
        if (!isDragging && (Math.abs(e.clientX - startX) > 5 || Math.abs(e.clientY - startY) > 5)) isDragging = true;
        if (isDragging) {
            let newX = e.clientX - shiftX;
            let newY = e.clientY - shiftY;
            newX = Math.max(0, Math.min(newX, window.innerWidth - dragBtn.offsetWidth));
            newY = Math.max(0, Math.min(newY, window.innerHeight - dragBtn.offsetHeight));
            dragBtn.style.left = newX + 'px';
            dragBtn.style.top = newY + 'px';
        }
    }

    function onPointerUp(e) {
        document.removeEventListener('pointermove', onPointerMove);
        document.removeEventListener('pointerup', onPointerUp);
        dragBtn.releasePointerCapture(e.pointerId);
        if (isDragging) {
            localStorage.setItem('floatBtnLeft', dragBtn.offsetLeft);
            localStorage.setItem('floatBtnTop', dragBtn.offsetTop);
        } else { toggleSidebarFloat(); }
        isDragging = false;
    }

    function toggleSidebarFloat() {
        const btnRect = dragBtn.getBoundingClientRect();
        const sidebarWidth = 280;
        let top = btnRect.bottom + 10;
        let left = btnRect.left;
        if (left + sidebarWidth > window.innerWidth) left = window.innerWidth - sidebarWidth - 15;
        if (top + 400 > window.innerHeight) {
            top = btnRect.top - 410;
            if (top < 10) top = 10;
        }
        sideFloat.style.top = top + 'px';
        sideFloat.style.left = left + 'px';
        const isActive = sideFloat.classList.toggle('active');
        sideOverlay.classList.toggle('active', isActive);
        if (isActive && !sideFloat.innerHTML) loadSidebarContent();
    }

    function closeSidebarFloat() {
        sideFloat.classList.remove('active');
        sideOverlay.classList.remove('active');
    }

    function loadSidebarContent() {
        fetch('sidebar.html')
            .then(res => res.text())
            .then(data => {
                sideFloat.innerHTML = `<div class="sidebar-header">เมนูนำทาง</div>` + data;
                ['credit', 'branch', 'sales'].forEach(id => {
                    if (localStorage.getItem('menu-' + id) === 'true') {
                        const el = sideFloat.querySelector('#menu-' + id);
                        if (el) el.classList.add('open');
                    }
                });
            });
    }

    window.toggleDrop = function(btn, id) {
        const item = btn.parentElement;
        const isOpen = item.classList.toggle("open");
        if (id) localStorage.setItem('menu-' + id, isOpen);
    }

    // --- ORIGINAL DEDUCTION LOGIC (Keep 100%) ---
    document.getElementById('deductionForm').onsubmit = async (e) => {
        e.preventDefault();
        setProcessing(true);
        const data = {
            action: document.getElementById('editRowIndex').value ? "updateRow" : "addRow",
            rowIndex: document.getElementById('editRowIndex').value,
            date: document.getElementById('date').value,
            branch: document.getElementById('branch').value,
            type: document.getElementById('type').value,
            name: document.getElementById('name').value,
            amount: document.getElementById('amount').value,
            note: document.getElementById('note').value
        };
        try {
            await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
            showStatusPopup(data.rowIndex ? "อัปเดตข้อมูลสำเร็จ" : "บันทึกข้อมูลสำเร็จ", true);
            e.target.reset();
            document.getElementById('editRowIndex').value = '';
            document.getElementById('btnText').innerText = 'บันทึกข้อมูล';
            fetchData(true);
        } catch (e) { showStatusPopup("เกิดข้อผิดพลาด กรุณาลองใหม่", false); }
        finally { setProcessing(false); }
    };

    async function fetchData(silent = false) {
        if (!silent) setProcessing(true);
        try {
            const res = await fetch(APPS_SCRIPT_URL + "?action=getData");
            const data = await res.json();
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = data.map((row, idx) => `
                <tr id="row-${row.rowIndex}">
                    <td><input type="checkbox" onchange="toggleSelect(${row.rowIndex})" ${selectedRows.has(row.rowIndex) ? 'checked' : ''}></td>
                    <td>${row.date}</td>
                    <td>${row.branch}</td>
                    <td><span class="badge badge-red">${row.type}</span></td>
                    <td>${row.name}</td>
                    <td style="font-weight:600">฿${parseFloat(row.amount).toLocaleString()}</td>
                    <td style="color:var(--text-light); font-size:12px">${row.note || '-'}</td>
                    <td>
                        <div class="action-btns">
                            <button class="icon-btn" onclick='editRow(${JSON.stringify(row)})'>${svgIcons.edit}</button>
                            <button class="icon-btn delete" onclick="deleteRow(${row.rowIndex})">${svgIcons.delete}</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        } catch (e) { console.error(e); }
        finally { setProcessing(false); }
    }

    function editRow(row) {
        document.getElementById('editRowIndex').value = row.rowIndex;
        document.getElementById('date').value = row.date;
        document.getElementById('branch').value = row.branch;
        document.getElementById('type').value = row.type;
        document.getElementById('name').value = row.name;
        document.getElementById('amount').value = row.amount;
        document.getElementById('note').value = row.note;
        document.getElementById('btnText').innerText = 'ตกลงแก้ไขข้อมูล';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function deleteRow(idx) {
        if (!confirm("ยืนยันการลบรายการนี้?")) return;
        setProcessing(true);
        try {
            await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "deleteRow", rowIndex: idx }) });
            showStatusPopup("ลบรายการสำเร็จ", true); fetchData(true);
        } catch (e) { showStatusPopup("เกิดข้อผิดพลาด", false); } finally { setProcessing(false); }
    }

    async function bulkDeleteData() {
        if (selectedRows.size === 0) return alert("กรุณาเลือกรายการที่ต้องการลบ");
        if (!confirm(`ยืนยันการลบทั้งหมด ${selectedRows.size} รายการ?`)) return;
        setProcessing(true);
        try {
            const sorted = [...selectedRows].sort((a,b) => b-a);
            for(let idx of sorted) await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "deleteRow", rowIndex: idx }) });
            showStatusPopup("ลบสำเร็จ", true); selectedRows = []; fetchData(true);
        } catch (e) { showStatusPopup("เกิดข้อผิดพลาด", false); } finally { setProcessing(false); }
    }

    function toggleSelect(idx) {
        if (selectedRows.has(idx)) selectedRows.delete(idx);
        else selectedRows.add(idx);
    }

    function setProcessing(val) { document.getElementById('loading').style.display = val ? 'flex' : 'none'; }
    
    function showStatusPopup(text, isSuccess) {
        document.getElementById("statusIcon").innerHTML = isSuccess ? svgIcons.success : svgIcons.error;
        document.getElementById("statusTitle").innerText = isSuccess ? "สำเร็จ" : "ล้มเหลว";
        document.getElementById("statusText").innerText = text;
        const popup = document.getElementById("statusPopup");
        popup.classList.add("show");
        setTimeout(() => popup.classList.remove("show"), 3000);
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadButtonPosition();
        fetchData();
    });
</script>
</body>
</html>
