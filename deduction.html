<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>บันทึกการหักเงิน - Parakit-site</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ios-blue: #007aff; 
            --ios-bg: #f5f5f7; 
            --sidebar-dark: rgba(28, 28, 30, 0.94); /* ปรับสีให้ตรงกับต้นฉบับ sidebar */
            --glass-white: rgba(255, 255, 255, 0.75); 
            --glass-border: rgba(255, 255, 255, 0.4);
            --text-main: #1d1d1f; 
            --text-light: #86868b; 
            --ios-red: #ff3b30; 
            --ios-green: #34c759;
            --sidebar-width: 280px; 
            --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.08);
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            --transition-swift: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); /* จากต้นฉบับ sidebar */
        }
        
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif !important; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; 
            background-color: var(--ios-bg); 
            color: var(--text-main); 
            -webkit-font-smoothing: antialiased; 
            min-height: 100vh;
            transition: padding-left 0.3s cubic-bezier(0.4, 0, 0.2, 1); /* รองรับการขยับของหน้า */
        }

        /* ===== ORIGINAL SIDEBAR SYSTEM (CSS) ===== */
        .sidebar { 
            position: fixed; top: 0; left: 0; 
            width: var(--sidebar-width); height: 100vh; 
            background: var(--sidebar-dark); 
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            color: #fff; overflow-y: auto; 
            transition: all .3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2000;
            box-shadow: 10px 0 30px rgba(0,0,0,0.1);
        }
        
        @media(min-width:769px) { 
            body:not(.collapsed) { padding-left: var(--sidebar-width); }
            body:not(.collapsed) .top-header { left: var(--sidebar-width); }
            body.collapsed .sidebar { transform: translateX(-100%); }
            body.collapsed .top-header { left: 0; }
        }

        @media(max-width:768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.show { transform: translateX(0); }
            body { padding-left: 0 !important; }
            .top-header { left: 0 !important; }
        }

        .top-header { 
            position: fixed; top: 0; left: 0; right: 0; height: 60px; 
            background: rgba(255, 255, 255, 0.7); 
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); 
            z-index: 1200; display: flex; align-items: center; padding: 0 20px; 
            border-bottom: 0.5px solid rgba(0,0,0,0.1); 
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .top-toggle { 
            width: 36px; height: 36px; border-radius: 10px; border: none; 
            background: transparent; color: var(--ios-blue); cursor: pointer; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 22px; transition: background 0.2s; 
        }
        .top-toggle:hover { background: rgba(0, 122, 255, 0.1); }

        .overlay { 
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.3); 
            backdrop-filter: blur(4px); display: none; z-index: 1500; 
        }
        .overlay.show { display: block; }

        /* Sidebar Internals (จากต้นฉบับ) */
        .sidebar-header { padding: 30px 20px; font-size: 20px; font-weight: 600; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
        .menu { padding: 10px 0; }
        .menu a, .menu .drop-btn { 
            width: 100%; min-height: 50px; padding: 12px 20px; background: none; border: none; 
            color: #ebebf5; text-align: left; font-size: 15px; cursor: pointer; 
            display: flex; align-items: center; text-decoration: none; transition: 0.3s;
        }
        .menu a:hover, .menu .drop-btn:hover { background: rgba(255,255,255,0.1); padding-left: 30px; }
        .sub { display: none; background: rgba(0,0,0,0.2); }
        .item.open .sub { display: block; }
        .sub a { padding-left: 45px; font-size: 14px; color: #8e8e93; }

        /* ===== CONTENT STYLES ===== */
        .content { padding: 80px 16px 40px; max-width: 1400px; margin: 0 auto; animation: fadeUp 0.5s ease; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        @media(min-width: 1024px) { .summary-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; } }
        .summary-card { background: var(--glass-white); padding: 16px; border-radius: 18px; border: 1px solid var(--glass-border); box-shadow: var(--card-shadow); }
        .summary-name { font-size: 12px; color: var(--text-light); font-weight: 500; }
        .summary-val { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
        
        .content-grid { display: grid; grid-template-columns: 1fr; gap: 20px; align-items: start; }
        @media(min-width: 1100px) { .content-grid { grid-template-columns: 380px 1fr; } }
        
        .box { background: var(--glass-white); padding: 24px; border-radius: 22px; border: 1px solid var(--glass-border); box-shadow: var(--card-shadow); }
        .subtitle { color: var(--text-light); font-size: 13px; margin: 4px 0 20px; }
        
        .form-row { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; }
        input, select { width: 100%; padding: 12px; border: 1px solid rgba(0,0,0,0.08); border-radius: 12px; font-size: 16px; background: #fff; outline: none; transition: var(--transition); }
        input:focus, select:focus { border-color: var(--ios-blue); box-shadow: 0 0 0 3px rgba(0,122,255,0.1); }
        
        .btn-submit { width: 100%; padding: 16px; border: none; border-radius: 14px; background: var(--ios-blue); color: white; font-size: 16px; font-weight: 600; cursor: pointer; transition: var(--transition); box-shadow: 0 4px 12px rgba(0,122,255,0.2); }
        .btn-submit:hover:not(:disabled) { filter: brightness(1.15); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,122,255,0.3); }
        .btn-submit:active:not(:disabled) { transform: translateY(0); filter: brightness(0.9); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .table-container { width: 100%; overflow-x: auto; border-radius: 14px; background: rgba(255,255,255,0.4); }
        table { width: 100%; border-collapse: collapse; min-width: 650px; }
        th { padding: 12px; text-align: left; color: var(--text-light); font-size: 12px; background: rgba(0,0,0,0.02); }
        td { padding: 14px 12px; border-bottom: 0.5px solid rgba(0,0,0,0.05); font-size: 14px; }
        
        .amt-red { color: var(--ios-red); font-weight: 700; }
        .btn-delete { background: rgba(255,59,48,0.1); border: none; color: var(--ios-red); width: 32px; height: 32px; border-radius: 8px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .btn-delete:hover { background: var(--ios-red); color: white; filter: brightness(1.1); transform: scale(1.05); }
        .btn-bulk-delete { background: var(--ios-red); color: white; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; display: none; transition: var(--transition); }
        
        .popup { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 4000; padding: 20px; backdrop-filter: blur(8px); }
        .popup.show { display: flex; }
        .popup-box { background: #fff; padding: 24px; border-radius: 24px; text-align: center; max-width: 340px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.15); }
        .spinner { width: 28px; height: 28px; border: 3px solid rgba(0,122,255,0.1); border-top-color: var(--ios-blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--ios-blue); transition: 0.2s; }
        footer { text-align: center; padding: 30px; color: var(--text-light); font-size: 11px; }
        .page-btn { border:none; width:32px; height:32px; border-radius:8px; cursor:pointer; font-weight:600; transition: var(--transition); }
    </style>
</head>
<body>

<header class="top-header">
    <button class="top-toggle" onclick="toggleSidebar()">☰</button>
    <div style="font-weight: 700; font-size: 1.1rem; letter-spacing: -0.5px;">บันทึกการหักเงิน</div>
</header>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
<aside class="sidebar" id="sidebar"></aside>

<div class="content">
    <div class="summary-grid">
        <div class="summary-card"><div class="summary-name">ศุภกฤต</div><div class="summary-val" id="sum-ศุภกฤต">0 ฿</div></div>
        <div class="summary-card"><div class="summary-name">นวพล</div><div class="summary-val" id="sum-นวพล">0 ฿</div></div>
        <div class="summary-card"><div class="summary-name">ปิยะพร</div><div class="summary-val" id="sum-ปิยะพร">0 ฿</div></div>
        <div class="summary-card"><div class="summary-name">กรทักษ์</div><div class="summary-val" id="sum-กรทักษ์">0 ฿</div></div>
    </div>

    <div class="content-grid">
        <div class="box">
            <h3 style="margin:0;">บันทึกรายการ</h3>
            <p class="subtitle">หักเงินพนักงานตามรายการที่ระบุ</p>
            <form id="deductionForm" onsubmit="return false;">
                <div class="form-row"><label>วันที่ดำเนินการ</label><input type="date" id="date" required></div>
                <div class="form-row">
                    <label>พนักงาน</label>
                    <select id="employee" required>
                        <option value="" disabled selected>เลือกรายชื่อ...</option>
                        <option value="ศุภกฤต">ศุภกฤต</option><option value="นวพล">นวพล</option>
                        <option value="ปิยะพร">ปิยะพร</option><option value="กรทักษ์">กรทักษ์</option>
                    </select>
                </div>
                <div class="form-row">
                    <label>เหตุผลหลัก</label>
                    <select id="reason" onchange="checkReason(this)" required>
                        <option value="" disabled selected>ระบุเหตุผล...</option>
                        <option value="มาสาย">มาสาย</option><option value="ไม่ลงเวลาเข้า-ออกงาน">ไม่ลงเวลาเข้า-ออกงาน</option>
                        <option value="ยอดขายไม่เป็นไปตามตกลง">ยอดขายไม่เป็นไปตามตกลง</option><option value="มี Score 1">มี Score 1</option>
                        <option value="Retention %ต่ำกว่า 88%">Retention %ต่ำกว่า 88%</option><option value="TVS NOW ไม่มียอด">TVS NOW ไม่มียอด</option>
                        <option value="อื่นๆ">อื่นๆ</option>
                    </select>
                    <div id="otherReasonContainer" style="display:none; margin-top:10px;"><input type="text" id="otherReason" placeholder="ระบุเหตุผลเพิ่มเติม..."></div>
                </div>
                <div class="form-row">
                    <label>จำนวนเงิน (THB)</label>
                    <select id="amount" required>
                        <option value="" disabled selected>เลือกยอดเงิน...</option>
                        <option value="10">10 ฿</option><option value="20">20 ฿</option>
                        <option value="30">30 ฿</option><option value="50">50 ฿</option>
                    </select>
                </div>
                <button type="button" id="btnMainSubmit" class="btn-submit" onclick="openAuthPopup('submit')">ยืนยันการบันทึก</button>
            </form>
        </div>

        <div class="box">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3 style="margin:0;">รายการล่าสุด</h3>
                <div style="display:flex; gap:10px; align-items:center;">
                    <button id="bulkDeleteBtn" class="btn-bulk-delete" onclick="openAuthPopup('bulkDelete')">ลบที่เลือก (<span id="selectedCount">0</span>)</button>
                    <button class="btn-refresh" onclick="fetchData(true)" style="background:none; border:none; color:var(--ios-blue); font-weight:600; cursor:pointer; font-size:13px; transition:0.2s;">รีเฟรช</button>
                </div>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th style="width:30px;"><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)"></th>
                            <th>วันที่</th><th>พนักงาน</th><th>เหตุผล</th><th>หมายเหตุ</th><th>หักเงิน</th><th style="width:40px;"></th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"><tr><td colspan="7" style="text-align:center; padding:40px;"><div class="spinner" style="margin:0 auto;"></div></td></tr></tbody>
                </table>
            </div>
            <div class="pagination" id="paginationContainer" style="display:flex; justify-content:center; gap:8px; margin-top:20px;"></div>
        </div>
    </div>
</div>

<div class="popup" id="authPopup">
    <div class="popup-box">
        <div id="otpSelectAdmin">
            <h3>ยืนยันตัวตน</h3>
            <p class="subtitle">เลือก Admin เพื่อรับรหัส OTP</p>
            <select id="adminEmailSelect" style="margin-bottom: 20px;">
                <option value="" disabled selected>-- เลือกผู้รับรหัส --</option>
                <option value="book016boat@gmail.com">ศุภกฤต (Admin)</option>
                <option value="malikastory2542@gmail.com">ปิยพร (Admin)</option>
            </select>
            <div style="display: flex; gap: 10px;">
                <button class="btn-submit" style="background:#eee; color:#333; box-shadow:none;" onclick="closeAuthPopup()">ยกเลิก</button>
                <button class="btn-submit" onclick="sendOTPRequest()">รับรหัส</button>
            </div>
        </div>
        <div id="otpInputForm" style="display:none;">
            <h3>รหัส OTP</h3>
            <p class="subtitle">กรอกรหัส 6 หลักจากอีเมล</p>
            <input type="number" id="confirmOTP" placeholder="000000" style="text-align: center; margin-bottom: 20px; font-size: 24px; letter-spacing: 4px; font-weight: 700;">
            <div style="display: flex; gap: 10px;">
                <button class="btn-submit" style="background:#eee; color:#333; box-shadow:none;" onclick="resetAuthPopup()">ย้อนกลับ</button>
                <button class="btn-submit" id="btnVerifyOtp" onclick="verifyAndExecute()">ยืนยัน</button>
            </div>
        </div>
    </div>
</div>

<div class="popup" id="statusPopup">
    <div class="popup-box">
        <div id="statusIcon" style="margin-bottom: 10px; display: flex; justify-content: center;"></div>
        <h3 id="statusTitle"></h3>
        <p id="statusText" class="subtitle"></p>
        <button class="btn-submit" id="btnCloseStatus" onclick="closeStatusPopup()">ตกลง</button>
    </div>
</div>

<div class="popup" id="loading" style="background:rgba(255,255,255,0.8); z-index:5000;">
    <div style="text-align:center;">
        <div class="spinner" style="width:40px; height:40px; margin:0 auto;"></div>
        <div style="margin-top:15px; font-weight:600; color:var(--ios-blue);">กำลังดำเนินการ...</div>
    </div>
</div>

<footer>© 2026 Copyright By Angerina Frog</footer>

<script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwMoRlPuQ08-f-Eabf2QKNSW4iVZFERLJjCtUYONoZJQmrEVanL2GOcpV5bmNDlEGJK/exec";
    let generatedOTP = "", allData = [], currentPage = 1, rowsPerPage = 7, currentMode = 'submit', rowToDelete = null;
    let selectedRows = [], isProcessing = false;

    const svgIcons = {
        success: `<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#34c759" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`,
        error: `<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ff3b30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`,
        trash: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`
    };

    window.onload = () => {
        includeSidebar();
        document.getElementById('date').value = new Date().toISOString().split("T")[0];
        fetchData(false);
        setupEventListeners();
    };

    // --- ORIGINAL SIDEBAR SYSTEM (JS) ---
    function includeSidebar() {
        const cached = localStorage.getItem('sidebar_cache');
        if (cached) {
            document.getElementById('sidebar').innerHTML = cached;
            restoreMenuState();
        }

        fetch('sidebar.html')
            .then(response => response.text())
            .then(data => {
                if (data !== cached) {
                    document.getElementById('sidebar').innerHTML = data;
                    localStorage.setItem('sidebar_cache', data);
                    restoreMenuState();
                }
            })
            .catch(err => console.warn("Sidebar Load Error"));
            
        if(localStorage.getItem('sidebar_collapsed') === 'true' && window.innerWidth > 768) {
            document.body.classList.add('collapsed');
        }
    }

    function toggleSidebar() {
        if (window.innerWidth <= 768) {
            document.getElementById("sidebar").classList.toggle("show");
            document.getElementById("overlay").classList.toggle("show");
        } else {
            const isCollapsed = document.body.classList.toggle("collapsed");
            localStorage.setItem('sidebar_collapsed', isCollapsed);
        }
    }

    window.toggleDrop = function(btn, id) {
        const item = btn.parentElement;
        const isOpen = item.classList.toggle("open");
        if (id) localStorage.setItem('menu-' + id, isOpen);
    }

    function restoreMenuState() {
        ['credit', 'branch', 'sales'].forEach(id => {
            if (localStorage.getItem('menu-' + id) === 'true') {
                const el = document.getElementById('menu-' + id);
                if (el) el.classList.add('open');
            }
        });
    }

    // --- DATA HANDLING SYSTEM ---
    function setupEventListeners() {
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (document.getElementById('authPopup').classList.contains('show')) {
                    if (document.getElementById('otpInputForm').style.display !== 'none') verifyAndExecute();
                    else if (document.getElementById('otpSelectAdmin').style.display !== 'none') sendOTPRequest();
                } else if (document.getElementById('statusPopup').classList.contains('show')) closeStatusPopup();
            }
        });
    }

    async function fetchData(showLoading = true) {
        if(showLoading) document.getElementById('loading').style.display = 'flex';
        try {
            const res = await fetch(APPS_SCRIPT_URL + "?action=getData");
            const data = await res.json();
            allData = data.rows.map((r, i) => ({...r, sheetIndex: i + 2})).reverse();
            selectedRows = [];
            updateSummary(data.rows);
            displayTable();
            updateBulkUI();
        } catch (e) {
            document.getElementById('tableBody').innerHTML = '<tr><td colspan="7" style="text-align:center; color:red;">โหลดข้อมูลไม่สำเร็จ</td></tr>';
        } finally { document.getElementById('loading').style.display = 'none'; }
    }

    function displayTable() {
        const tbody = document.getElementById('tableBody');
        const start = (currentPage - 1) * rowsPerPage;
        const items = allData.slice(start, start + rowsPerPage);
        
        tbody.innerHTML = items.length ? items.map(row => `
            <tr>
                <td><input type="checkbox" class="row-cb" data-idx="${row.sheetIndex}" ${selectedRows.includes(row.sheetIndex) ? 'checked' : ''} onchange="handleRowSelect(this)"></td>
                <td style="font-weight:500;">${row.date ? row.date.split('T')[0] : '-'}</td>
                <td><span style="font-weight:600; color:var(--ios-blue);">${row.name}</span></td>
                <td><span style="background:rgba(0,0,0,0.05); padding:3px 8px; border-radius:6px; font-size:12px;">${row.reason}</span></td>
                <td style="color:var(--text-light); font-size:12px;">${row.other || '-'}</td>
                <td class="amt-red">-${row.amount}฿</td>
                <td style="text-align:center;">
                    <button class="btn-delete" onclick="prepareDelete(${row.sheetIndex})">${svgIcons.trash}</button>
                </td>
            </tr>
        `).join('') : '<tr><td colspan="7" style="text-align:center; padding:40px;">ไม่พบรายการบันทึก</td></tr>';
        renderPagination();
    }

    function handleRowSelect(cb) {
        const idx = parseInt(cb.dataset.idx);
        if (cb.checked) selectedRows.push(idx);
        else selectedRows = selectedRows.filter(i => i !== idx);
        updateBulkUI();
    }

    function toggleSelectAll(mainCb) {
        const cbs = document.querySelectorAll('.row-cb');
        if (mainCb.checked) {
            cbs.forEach(cb => {
                cb.checked = true;
                const idx = parseInt(cb.dataset.idx);
                if (!selectedRows.includes(idx)) selectedRows.push(idx);
            });
        } else {
            cbs.forEach(cb => {
                cb.checked = false;
                const idx = parseInt(cb.dataset.idx);
                selectedRows = selectedRows.filter(i => i !== idx);
            });
        }
        updateBulkUI();
    }

    function updateBulkUI() {
        const btn = document.getElementById('bulkDeleteBtn');
        const count = document.getElementById('selectedCount');
        count.innerText = selectedRows.length;
        btn.style.display = selectedRows.length > 0 ? 'block' : 'none';
        document.getElementById('selectAll').checked = selectedRows.length > 0 && 
            document.querySelectorAll('.row-cb').length > 0 && 
            Array.from(document.querySelectorAll('.row-cb')).every(cb => cb.checked);
    }

    function renderPagination() {
        const total = Math.ceil(allData.length / rowsPerPage);
        const container = document.getElementById('paginationContainer');
        container.innerHTML = '';
        if (total <= 1) return;
        for (let i = 1; i <= total; i++) {
            const btn = document.createElement('button');
            btn.className = 'page-btn';
            btn.innerText = i;
            btn.style.cssText = `background:${i===currentPage?'var(--ios-blue)':'#fff'}; color:${i===currentPage?'#fff':'#333'}`;
            btn.onclick = () => { currentPage = i; displayTable(); updateBulkUI(); };
            container.appendChild(btn);
        }
    }

    function updateSummary(rows) {
        const sums = { "ศุภกฤต": 0, "นวพล": 0, "ปิยะพร": 0, "กรทักษ์": 0 };
        rows.forEach(r => { if (sums.hasOwnProperty(r.name)) sums[r.name] += parseFloat(r.amount); });
        for (let n in sums) {
            const el = document.getElementById(`sum-${n}`);
            if (el) el.innerText = sums[n].toLocaleString() + " ฿";
        }
    }

    function checkReason(s) { document.getElementById('otherReasonContainer').style.display = s.value === 'อื่นๆ' ? 'block' : 'none'; }

    function openAuthPopup(mode) {
        if (isProcessing) return;
        currentMode = mode;
        if (mode === 'submit' && !document.getElementById('deductionForm').checkValidity()) {
            document.getElementById('deductionForm').reportValidity();
            return;
        }
        resetAuthPopup();
        document.getElementById("authPopup").classList.add("show");
    }

    function prepareDelete(index) { rowToDelete = index; openAuthPopup('delete'); }
    function resetAuthPopup() { document.getElementById("otpSelectAdmin").style.display = "block"; document.getElementById("otpInputForm").style.display = "none"; document.getElementById("confirmOTP").value = ""; }
    function closeAuthPopup() { document.getElementById("authPopup").classList.remove("show"); }

    async function sendOTPRequest() {
        const email = document.getElementById("adminEmailSelect").value;
        if (!email || isProcessing) return;
        setProcessing(true);
        generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
        try {
            await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "sendOTP", email, otp: generatedOTP }) });
            document.getElementById("otpSelectAdmin").style.display = "none";
            document.getElementById("otpInputForm").style.display = "block";
        } finally { setProcessing(false); }
    }

    function verifyAndExecute() {
        if (document.getElementById("confirmOTP").value === generatedOTP) {
            closeAuthPopup();
            if (currentMode === 'submit') submitData(); 
            else if (currentMode === 'delete') deleteData(rowToDelete);
            else if (currentMode === 'bulkDelete') bulkDeleteData();
        } else showStatusPopup("รหัส OTP ไม่ถูกต้อง!", false);
    }

    async function submitData() {
        setProcessing(true);
        const data = { date: document.getElementById('date').value, employee: document.getElementById('employee').value, reason: document.getElementById('reason').value, otherReason: document.getElementById('otherReason').value, amount: document.getElementById('amount').value, action: "insert" };
        try {
            await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
            showStatusPopup("บันทึกข้อมูลเรียบร้อยแล้ว", true);
            document.getElementById('deductionForm').reset();
            document.getElementById('date').value = new Date().toISOString().split("T")[0];
            fetchData(true);
        } catch (e) { showStatusPopup("เกิดข้อผิดพลาด", false); }
        finally { setProcessing(false); }
    }

    async function deleteData(idx) {
        setProcessing(true);
        try {
            await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "deleteRow", rowIndex: idx }) });
            showStatusPopup("ลบรายการแล้ว", true);
            fetchData(true);
        } catch (e) { showStatusPopup("เกิดข้อผิดพลาด", false); }
        finally { setProcessing(false); }
    }

    async function bulkDeleteData() {
        setProcessing(true);
        try {
            const sortedIdx = [...selectedRows].sort((a,b) => b-a);
            for(let idx of sortedIdx) {
                await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "deleteRow", rowIndex: idx }) });
            }
            showStatusPopup(`ลบจำนวน ${selectedRows.length} รายการเรียบร้อย`, true);
            fetchData(true);
        } catch (e) { showStatusPopup("เกิดข้อผิดพลาดในการลบหลายรายการ", false); }
        finally { setProcessing(false); }
    }

    function setProcessing(val) { isProcessing = val; document.getElementById('loading').style.display = val ? 'flex' : 'none'; document.getElementById('btnMainSubmit').disabled = val; }

    function showStatusPopup(text, isSuccess) {
        document.getElementById("statusIcon").innerHTML = isSuccess ? svgIcons.success : svgIcons.error;
        document.getElementById("statusTitle").innerText = isSuccess ? "สำเร็จ" : "ล้มเหลว";
        document.getElementById("statusText").innerText = text;
        document.getElementById("statusPopup").classList.add("show");
    }
    
    function closeStatusPopup() { document.getElementById("statusPopup").classList.remove("show"); }
</script>
</body>
</html>
