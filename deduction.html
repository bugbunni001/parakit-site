<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>บันทึกการหักเงิน - Parakit-site</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ios-blue: #007aff; 
            --ios-bg: #f5f5f7; 
            --sidebar-dark: rgba(28, 28, 30, 0.94);
            --glass-white: rgba(255, 255, 255, 0.85); 
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-main: #1d1d1f; 
            --text-light: #86868b; 
            --ios-red: #ff3b30; 
            --ios-green: #34c759;
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            --transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            --transition-swift: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif !important; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; 
            background-color: var(--ios-bg); 
            color: var(--text-main); 
            -webkit-font-smoothing: antialiased; 
            min-height: 100vh;
        }

        /* ===== FLOATING MENU STYLES (FROM INDEX.HTML) ===== */
        #floatingMenuBtn {
            position: fixed; bottom: 30px; right: 30px;
            width: 60px; height: 60px;
            background: var(--ios-blue); color: white;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 24px; cursor: grab; z-index: 9999;
            box-shadow: 0 4px 15px rgba(0,122,255,0.4);
            touch-action: none; user-select: none; transition: transform 0.2s;
        }
        #floatingMenuBtn:active { cursor: grabbing; transform: scale(0.9); }

        .side-float {
            position: fixed; top: 0; right: 0;
            width: 280px; height: 100vh;
            background: var(--sidebar-dark);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            transform: translateX(100%); transition: var(--transition-swift);
            z-index: 10000; color: white; overflow-y: auto;
        }
        .side-float.open { transform: translateX(0); }
        .side-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.3);
            backdrop-filter: blur(4px); display: none; z-index: 9998;
        }
        .side-overlay.show { display: block; }

        /* Menu Item Styles */
        .menu-content { padding: 20px 0; }
        .menu-item { width: 100%; border: none; background: none; color: #fff; padding: 15px 25px; text-align: left; display: flex; align-items: center; gap: 12px; cursor: pointer; text-decoration: none; font-size: 15px; }
        .menu-item:hover { background: rgba(255,255,255,0.1); }
        .drop-btn { justify-content: space-between; width: 100%; }
        .sub-menu { display: none; background: rgba(0,0,0,0.2); }
        .item-container.open .sub-menu { display: block; }
        .sub-menu a { padding-left: 55px; font-size: 14px; opacity: 0.8; }

        /* ===== CONTENT LAYOUT ===== */
        .top-header { 
            position: fixed; top: 0; left: 0; right: 0; height: 64px; 
            background: rgba(245, 245, 247, 0.8); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
            z-index: 1200; display: flex; align-items: center; padding: 0 20px; 
            border-bottom: 1px solid rgba(0,0,0,0.05); 
        }

        .content { padding: 84px 16px 40px; max-width: 1100px; margin: 0 auto; animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Summary & Table Styles */
        .summary-container { margin-bottom: 24px; }
        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
        .summary-card { 
            background: #fff; padding: 20px; border-radius: 20px; 
            border: 1px solid rgba(0,0,0,0.03); box-shadow: var(--card-shadow);
            transition: var(--transition); display: flex; flex-direction: column; gap: 4px;
        }
        .summary-card:hover { transform: translateY(-5px); box-shadow: 0 8px 30px rgba(0,0,0,0.08); }
        .summary-name { font-size: 14px; color: var(--text-light); font-weight: 500; }
        .summary-val { font-size: 24px; font-weight: 700; color: var(--text-main); letter-spacing: -1px; }

        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .btn-add {
            background: var(--ios-blue); color: white; border: none; padding: 12px 24px; 
            border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer;
            transition: var(--transition); box-shadow: 0 4px 15px rgba(0, 122, 255, 0.3);
            display: flex; align-items: center; gap: 8px;
        }
        .btn-add:hover { transform: scale(1.03); filter: brightness(1.1); }

        .table-box { 
            background: #fff; padding: 24px; border-radius: 24px; 
            border: 1px solid rgba(0,0,0,0.03); box-shadow: var(--card-shadow); overflow: hidden;
        }
        .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .table-container { width: 100%; overflow-x: auto; border-radius: 16px; border: 1px solid #f2f2f7; }
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th { padding: 14px 16px; text-align: left; color: var(--text-light); font-size: 13px; background: #f9f9fb; font-weight: 500; }
        td { padding: 16px; border-bottom: 1px solid #f2f2f7; font-size: 15px; }
        .amt-red { color: var(--ios-red); font-weight: 700; }

        /* Modals & Popups */
        .modal, .popup { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 11000; padding: 20px; backdrop-filter: blur(10px); }
        .modal.show, .popup.show { display: flex; }
        .form-container, .popup-box { 
            background: #fff; padding: 32px; border-radius: 28px; 
            width: 100%; max-width: 480px; box-shadow: 0 30px 60px rgba(0,0,0,0.15);
            animation: modalPop 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes modalPop { from { opacity: 0; transform: scale(0.9) translateY(30px); } to { opacity: 1; transform: scale(1) translateY(0); } }

        input, select { width: 100%; padding: 14px; border: 1.5px solid #f2f2f7; border-radius: 14px; font-size: 16px; background: #f9f9fb; outline: none; margin-bottom: 10px; }
        .btn-submit { width: 100%; padding: 16px; border: none; border-radius: 16px; background: var(--ios-blue); color: white; font-size: 17px; font-weight: 600; cursor: pointer; transition: var(--transition); }
        .btn-delete { background: #fff1f0; border: none; color: var(--ios-red); width: 36px; height: 36px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        .spinner { width: 32px; height: 32px; border: 3px solid rgba(0,122,255,0.15); border-top-color: var(--ios-blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        footer { text-align: center; padding: 50px 20px; color: var(--text-light); font-size: 12px; }
        .btn-bulk-delete { background: var(--ios-red); color: white; border: none; padding: 10px 18px; border-radius: 12px; font-size: 13px; font-weight: 600; cursor: pointer; display: none; }
    </style>
</head>
<body>

<header class="top-header">
    <div style="font-weight: 700; font-size: 1.15rem; letter-spacing: -0.5px;">บันทึกการหักเงิน</div>
</header>

<div id="floatingMenuBtn" onmousedown="startDrag(event)" ontouchstart="startDrag(event)" onclick="toggleSideFloat()">☰</div>
<div class="side-overlay" id="sideOverlay" onclick="toggleSideFloat()"></div>
<aside class="side-float" id="sideFloat">
    <div class="menu-content" id="sidebar">
        </div>
</aside>

<div class="content">
    <div class="summary-container">
        <div class="section-title" style="font-size: 14px; font-weight: 600; color: var(--text-light); text-transform: uppercase; margin-bottom: 12px;">สรุปยอดหักเงินสะสม</div>
        <div class="summary-grid">
            <div class="summary-card"><div class="summary-name">ศุภกฤต</div><div class="summary-val" id="sum-ศุภกฤต">0 ฿</div></div>
            <div class="summary-card"><div class="summary-name">นวพล</div><div class="summary-val" id="sum-นวพล">0 ฿</div></div>
            <div class="summary-card"><div class="summary-name">ปิยะพร</div><div class="summary-val" id="sum-ปิยะพร">0 ฿</div></div>
            <div class="summary-card"><div class="summary-name">กรทักษ์</div><div class="summary-val" id="sum-กรทักษ์">0 ฿</div></div>
        </div>
    </div>

    <div class="action-bar">
        <h3 style="margin:0; font-size: 20px; font-weight: 700;">รายการบันทึกทั้งหมด</h3>
        <button class="btn-add" onclick="openForm()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            เพิ่มข้อมูลใหม่

    <div class="table-box">

            <button onclick="fetchData(true)" style="background:none; border:none; color:var(--ios-blue); font-weight:600; cursor:pointer; font-size:14px;">รีเฟรชข้อมูล</button>

        <div class="table-container">
            <table>
                <thead>
                    <tr>

                        <th>วันที่</th><th>พนักงาน</th><th>เหตุผล</th><th>หมายเหตุ</th><th>หักเงิน</th><th style="width:50px;"></th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="7" style="text-align:center; padding:60px;"><div class="spinner" style="margin:0 auto;"></div></td></tr>
                </tbody>
            </table>
        </div>
        <div class="pagination" id="paginationContainer" style="display:flex; justify-content:center; gap:5px; margin-top:25px;"></div>
    </div>
</div>

<div class="modal" id="formModal" onclick="if(event.target==this) closeForm()">
    <div class="form-container">
        <div style="display:flex; justify-content:space-between; align-items:start; margin-bottom:20px;">
            <div>
                <h3 style="margin: 0; font-size: 22px;">ลงข้อมูลการหักเงิน</h3>
                <p style="color: var(--text-light); font-size: 14px; margin-top: 4px;">ระบุรายละเอียดเพื่อหักเงินพนักงาน</p>

                <option value="ยอดขายไม่เป็นไปตามตกลง">ยอดขายไม่เป็นไปตามตกลง</option><option value="มี Score 1">มี Score 1</option>
                <option value="Retention %ต่ำกว่า 88%">Retention %ต่ำกว่า 88%</option><option value="TVS NOW ไม่มียอด">TVS NOW ไม่มียอด</option>
                <option value="อื่นๆ">อื่นๆ</option>

    <div style="text-align:center;">
        <div class="spinner" style="margin:0 auto;"></div>
        <div style="margin-top:10px; color:var(--ios-blue);">กำลังประมวลผล...</div>
    </div>
</div>

<script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwMoRlPuQ08-f-Eabf2QKNSW4iVZFERLJjCtUYONoZJQmrEVanL2GOcpV5bmNDlEGJK/exec";
    let generatedOTP = "", allData = [], currentPage = 1, rowsPerPage = 7, currentMode = 'submit', rowToDelete = null;
    let selectedRows = [], isProcessing = false;

    const svgIcons = {
        success: `<svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#34c759" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>`,
        error: `<svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#ff3b30" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>`,
        trash: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`
    };

    window.onload = () => {
        includeSidebar();
        document.getElementById('date').value = new Date().toISOString().split("T")[0];
        fetchData(false);
        loadButtonPosition();
    };

    /* ===== FLOATING SIDEBAR LOGIC (FROM INDEX.HTML) ===== */
    function includeSidebar() {
        fetch('sidebar.html').then(r => r.text()).then(data => {
            document.getElementById('sidebar').innerHTML = data;
            ['credit', 'branch', 'sales'].forEach(id => {
                if (localStorage.getItem('menu-' + id) === 'true') {
                    const el = document.querySelector('#menu-' + id);
                    if (el) el.classList.add('open');
                }
            });
        });
    }

    function toggleSideFloat() {
        document.getElementById('sideFloat').classList.toggle('open');
        document.getElementById('sideOverlay').classList.toggle('show');
    }

    window.toggleDrop = function(btn, id) {
        const item = btn.parentElement;
        const isOpen = item.classList.toggle("open");
        if (id) localStorage.setItem('menu-' + id, isOpen);
    }

    // Draggable Logic
    let isDragging = false, currentX, currentY, initialX, initialY, xOffset = 0, yOffset = 0;
    const dragBtn = document.getElementById("floatingMenuBtn");

    function startDrag(e) {
        if (e.type === "touchstart") {
            initialX = e.touches[0].clientX - xOffset;
            initialY = e.touches[0].clientY - yOffset;
        } else {
            initialX = e.clientX - xOffset;
            initialY = e.clientY - yOffset;
        }
        if (e.target === dragBtn) isDragging = true;
    }

    document.addEventListener("mousemove", drag);
    document.addEventListener("touchmove", drag, { passive: false });
    document.addEventListener("mouseup", endDrag);
    document.addEventListener("touchend", endDrag);

    function drag(e) {
        if (isDragging) {
            e.preventDefault();
            if (e.type === "touchmove") {
                currentX = e.touches[0].clientX - initialX;
                currentY = e.touches[0].clientY - initialY;
            } else {
                currentX = e.clientX - initialX;
                currentY = e.clientY - initialY;
            }
            xOffset = currentX; yOffset = currentY;
            setTranslate(currentX, currentY, dragBtn);
        }
    }

    function endDrag() {
        if (isDragging) {
            isDragging = false;
            localStorage.setItem('floatBtnX', xOffset);
            localStorage.setItem('floatBtnY', yOffset);
        }
    }

    function setTranslate(x, y, el) { el.style.transform = `translate3d(${x}px, ${y}px, 0)`; }

    function loadButtonPosition() {
        const x = localStorage.getItem('floatBtnX');
        const y = localStorage.getItem('floatBtnY');
        if (x && y) {
            xOffset = parseFloat(x); yOffset = parseFloat(y);
            setTranslate(xOffset, yOffset, dragBtn);
        }
    }

    /* ===== DATA & FORM LOGIC (ORIGINAL) ===== */
    function openForm() { document.getElementById('formModal').classList.add('show'); }
    function closeForm() { document.getElementById('formModal').classList.remove('show'); }

    async function fetchData(showLoading = true) {
        if(showLoading) document.getElementById('loading').style.display = 'flex';
        try {
            const res = await fetch(APPS_SCRIPT_URL + "?action=getData");
            const data = await res.json();
            allData = data.rows.map((r, i) => ({...r, sheetIndex: i + 2})).reverse();
            updateSummary(data.rows);
            displayTable();
            updateBulkUI();
        } catch (e) { document.getElementById('tableBody').innerHTML = '<tr><td colspan="7" style="text-align:center; color:red;">โหลดข้อมูลไม่สำเร็จ</td></tr>'; } 
        finally { document.getElementById('loading').style.display = 'none'; }
    }

    function displayTable() {
        const tbody = document.getElementById('tableBody');
        const start = (currentPage - 1) * rowsPerPage;
        const items = allData.slice(start, start + rowsPerPage);
        tbody.innerHTML = items.length ? items.map(row => `
            <tr>
                <td style="text-align:center;"><input type="checkbox" class="row-cb" data-idx="${row.sheetIndex}" ${selectedRows.includes(row.sheetIndex) ? 'checked' : ''} onchange="handleRowSelect(this)"></td>
                <td style="font-weight:500;">${row.date ? row.date.split('T')[0] : '-'}</td>
                <td><span style="font-weight:600; color:var(--ios-blue);">${row.name}</span></td>
                <td><span style="background:#f2f2f7; color:#3a3a3c; padding:4px 10px; border-radius:8px; font-size:13px;">${row.reason}</span></td>
                <td style="color:var(--text-light); font-size:13px;">${row.other || '-'}</td>
                <td class="amt-red">-${row.amount}฿</td>
                <td style="text-align:center;"><button class="btn-delete" onclick="prepareDelete(${row.sheetIndex})">${svgIcons.trash}</button></td>
            </tr>`).join('') : '<tr><td colspan="7" style="text-align:center; padding:40px;">ไม่พบรายการบันทึก</td></tr>';
        renderPagination();
    }

    function handleRowSelect(cb) { const idx = parseInt(cb.dataset.idx); if (cb.checked) selectedRows.push(idx); else selectedRows = selectedRows.filter(i => i !== idx); updateBulkUI(); }
    function toggleSelectAll(mainCb) {
        const cbs = document.querySelectorAll('.row-cb');
        cbs.forEach(cb => { cb.checked = mainCb.checked; const idx = parseInt(cb.dataset.idx); if (mainCb.checked) { if (!selectedRows.includes(idx)) selectedRows.push(idx); } else selectedRows = selectedRows.filter(i => i !== idx); });
        updateBulkUI();
    }

    function updateBulkUI() {
        const btn = document.getElementById('bulkDeleteBtn');
        document.getElementById('selectedCount').innerText = selectedRows.length;
        btn.style.display = selectedRows.length > 0 ? 'block' : 'none';
    }

    function renderPagination() {
        const total = Math.ceil(allData.length / rowsPerPage);
        const container = document.getElementById('paginationContainer');
        container.innerHTML = '';
        if (total <= 1) return;
        for (let i = 1; i <= total; i++) {
            const btn = document.createElement('button');
            btn.style.cssText = `border:none; width:36px; height:36px; border-radius:10px; cursor:pointer; font-weight:600; margin:0 2px; background:${i===currentPage?'var(--ios-blue)':'#f2f2f7'}; color:${i===currentPage?'#fff':'#333'}`;
            btn.innerText = i;
            btn.onclick = () => { currentPage = i; displayTable(); };
            container.appendChild(btn);
        }
    }

    function updateSummary(rows) {
        const sums = { "ศุภกฤต": 0, "นวพล": 0, "ปิยะพร": 0, "กรทักษ์": 0 };
        rows.forEach(r => { if (sums.hasOwnProperty(r.name)) sums[r.name] += parseFloat(r.amount); });
        for (let n in sums) { const el = document.getElementById(`sum-${n}`); if (el) el.innerText = sums[n].toLocaleString() + " ฿"; }
    }

    function checkReason(s) { document.getElementById('otherReasonContainer').style.display = s.value === 'อื่นๆ' ? 'block' : 'none'; }
    function openAuthPopup(mode) { if (isProcessing) return; currentMode = mode; if (mode === 'submit' && !document.getElementById('deductionForm').checkValidity()) { document.getElementById('deductionForm').reportValidity(); return; } resetAuthPopup(); document.getElementById("authPopup").classList.add("show"); }
    function prepareDelete(index) { rowToDelete = index; openAuthPopup('delete'); }
    function resetAuthPopup() { document.getElementById("otpSelectAdmin").style.display = "block"; document.getElementById("otpInputForm").style.display = "none"; document.getElementById("confirmOTP").value = ""; }
    function closeAuthPopup() { document.getElementById("authPopup").classList.remove("show"); }

    async function sendOTPRequest() {
        const email = document.getElementById("adminEmailSelect").value;
        if (!email || isProcessing) return;
        setProcessing(true);
        generatedOTP = Math.floor(100000 + Math.random() * 900000).toString();
        try { await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "sendOTP", email, otp: generatedOTP }) }); document.getElementById("otpSelectAdmin").style.display = "none"; document.getElementById("otpInputForm").style.display = "block";
        } finally { setProcessing(false); }
    }

    function verifyAndExecute() {
        if (document.getElementById("confirmOTP").value === generatedOTP) {
            closeAuthPopup();
            if (currentMode === 'submit') submitData(); else if (currentMode === 'delete') deleteData(rowToDelete); else if (currentMode === 'bulkDelete') bulkDeleteData();
        } else showStatusPopup("รหัส OTP ไม่ถูกต้อง!", false);
    }

    async function submitData() {
        setProcessing(true);
        const data = { date: document.getElementById('date').value, employee: document.getElementById('employee').value, reason: document.getElementById('reason').value, otherReason: document.getElementById('otherReason').value, amount: document.getElementById('amount').value, action: "insert" };
        try { 
            await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) }); 
            showStatusPopup("บันทึกข้อมูลเรียบร้อยแล้ว", true); 
            document.getElementById('deductionForm').reset(); 
            document.getElementById('date').value = new Date().toISOString().split("T")[0]; 
            closeForm(); fetchData(true);
        } catch (e) { showStatusPopup("เกิดข้อผิดพลาด", false); } finally { setProcessing(false); }
    }

    async function deleteData(idx) {
        setProcessing(true);
        try { await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "deleteRow", rowIndex: idx }) }); showStatusPopup("ลบรายการแล้ว", true); fetchData(true);
        } catch (e) { showStatusPopup("เกิดข้อผิดพลาด", false); } finally { setProcessing(false); }
    }

    async function bulkDeleteData() {
        setProcessing(true);
        try {
            const sortedIdx = [...selectedRows].sort((a,b) => b-a);
            for(let idx of sortedIdx) await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "deleteRow", rowIndex: idx }) });
            showStatusPopup(`ลบจำนวน ${selectedRows.length} รายการเรียบร้อย`, true); selectedRows = []; fetchData(true);
        } catch (e) { showStatusPopup("เกิดข้อผิดพลาด", false); } finally { setProcessing(false); }
    }

    function setProcessing(val) { isProcessing = val; document.getElementById('loading').style.display = val ? 'flex' : 'none'; document.getElementById('btnMainSubmit').disabled = val; }
    function showStatusPopup(text, isSuccess) {
        document.getElementById("statusIcon").innerHTML = isSuccess ? svgIcons.success : svgIcons.error;
        document.getElementById("statusTitle").innerText = isSuccess ? "สำเร็จ" : "ล้มเหลว";
        document.getElementById("statusText").innerText = text;
        document.getElementById("statusPopup").classList.add("show");
    }
    function closeStatusPopup() { document.getElementById("statusPopup").classList.remove("show"); }
</script>
</body>
</html>
