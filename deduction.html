<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>บันทึกการหักเงิน - Parakit-site</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ios-blue: #007aff; 
            --ios-bg: #f5f5f7; 
            --sidebar-dark: rgba(28, 28, 30, 0.94);
            --glass-white: rgba(255, 255, 255, 0.85); 
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-main: #1d1d1f; 
            --text-light: #86868b; 
            --ios-red: #ff3b30; 
            --ios-green: #34c759;
            --card-shadow: 0 8px 32px rgba(0,0,0,0.05);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Kanit', sans-serif; }
        body { background: var(--ios-bg); color: var(--text-main); display: flex; min-height: 100vh; overflow-x: hidden; }

        /* ===== FLOATING SIDEBAR CSS ===== */
        #floatingMenuBtn {
            position: fixed;
            top: 10px;
            left: 15px;
            width: 45px;
            height: 45px;
            background: var(--ios-blue);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: move;
            z-index: 2100;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
            border: none;
            touch-action: none;
            transition: transform 0.2s, opacity 0.2s;
        }
        #floatingMenuBtn:active { transform: scale(0.9); }

        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.2);
            z-index: 2000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .sidebar-overlay.active { display: block; opacity: 1; }

        .sidebar-float {
            position: fixed;
            width: 280px;
            max-height: 70vh;
            background: var(--sidebar-dark);
            border-radius: 20px;
            overflow-y: auto;
            z-index: 2001;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.8) translateY(10px);
            transition: opacity 0.3s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.2) transparent;
        }
        .sidebar-float.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1) translateY(0);
        }

        .sidebar-float .sidebar-header { padding: 20px; font-size: 17px; font-weight: 600; color: #fff; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
        .sidebar-float .menu { padding: 8px 0; }
        .sidebar-float .menu a, .sidebar-float .drop-btn { 
            width: 100%; padding: 12px 20px; background: none; border: none; 
            color: #ebebf5; text-align: left; font-size: 14px; cursor: pointer; 
            display: flex; align-items: center; text-decoration: none; transition: 0.2s;
        }
        .sidebar-float .menu a:hover, .sidebar-float .drop-btn:hover { background: rgba(255,255,255,0.1); }
        .sidebar-float .sub { display: none; background: rgba(0,0,0,0.2); }
        .sidebar-float .item.open .sub { display: block; }
        .sidebar-float .sub a { padding-left: 45px; font-size: 13px; color: #8e8e93; }

        /* ===== MAIN CONTENT ADJUSTMENT ===== */
        .main-content { flex: 1; padding: 60px 20px 40px; width: 100%; }
        .container { max-width: 1100px; margin: 0 auto; }

        .header { margin-bottom: 30px; display: flex; justify-content: space-between; align-items: flex-end; }
        .header h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.5px; }
        .header p { color: var(--text-light); font-size: 15px; margin-top: 4px; }

        .card { background: var(--glass-white); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 25px; box-shadow: var(--card-shadow); margin-bottom: 25px; }
        
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 13px; font-weight: 500; color: var(--text-light); padding-left: 4px; }
        
        input, select { padding: 12px 16px; border-radius: 12px; border: 1px solid #e5e5e7; background: #fff; font-size: 15px; outline: none; transition: var(--transition); }
        input:focus, select:focus { border-color: var(--ios-blue); box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1); }

        .btn { padding: 12px 24px; border-radius: 12px; border: none; font-size: 15px; font-weight: 500; cursor: pointer; transition: var(--transition); display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-primary { background: var(--ios-blue); color: #fff; }
        .btn-primary:hover { background: #0063cc; transform: translateY(-1px); }
        .btn-danger { background: #fff; color: var(--ios-red); border: 1px solid #ff3b3020; }
        .btn-danger:hover { background: #fff1f0; }

        .table-container { overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: left; padding: 16px; border-bottom: 1px solid #e5e5e7; color: var(--text-light); font-weight: 500; font-size: 13px; }
        td { padding: 16px; border-bottom: 1px solid #f2f2f7; vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        
        .status-pill { padding: 4px 12px; border-radius: 100px; font-size: 12px; font-weight: 500; }
        .pill-red { background: #ff3b3010; color: var(--ios-red); }

        .loading-overlay { position: fixed; inset: 0; background: rgba(255,255,255,0.8); backdrop-filter: blur(5px); z-index: 9999; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 15px; }
        .spinner { width: 40px; height: 40px; border: 3px solid #f3f3f3; border-top: 3px solid var(--ios-blue); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .popup { position: fixed; top: 20px; right: 20px; background: #fff; padding: 16px 24px; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); display: flex; align-items: center; gap: 12px; transform: translateX(120%); transition: var(--transition); z-index: 10000; border: 1px solid var(--glass-border); }
        .popup.show { transform: translateX(0); }

        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: flex-start; gap: 15px; }
            .main-content { padding: 70px 15px 30px; }
        }
    </style>
</head>
<body>

<button id="floatingMenuBtn" title="ลากเพื่อย้าย">เมนู</button>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebarFloat()"></div>
<aside class="sidebar-float" id="sidebarFloat"></aside>

<div class="loading-overlay" id="loading">
    <div class="spinner"></div>
    <p style="font-weight: 500;">กำลังดำเนินการ...</p>
</div>

<div class="popup" id="statusPopup">
    <div id="statusIcon"></div>
    <div>
        <div id="statusTitle" style="font-weight: 600; font-size: 15px;"></div>
        <div id="statusText" style="color: var(--text-light); font-size: 13px;"></div>
    </div>
</div>

<main class="main-content">
    <div class="container">
        <header class="header">
            <div>
                <h1>💰 บันทึกการหักเงิน</h1>
                <p>จัดการรายการหักเงินพนักงานรายวัน</p>
            </div>
            <button class="btn btn-danger" onclick="bulkDeleteData()" id="btnBulkDelete" style="display: none;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2M10 11v6M14 11v6"/></svg>
                ลบที่เลือก (<span id="selectedCount">0</span>)
            </button>
        </header>

        <div class="card">
            <form id="deductionForm" onsubmit="handleSubmit(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label>วันที่</label>
                        <input type="date" id="date" required>
                    </div>
                    <div class="form-group">
                        <label>ชื่อพนักงาน</label>
                        <input type="text" id="name" placeholder="ระบุชื่อ-นามสกุล" required>
                    </div>
                    <div class="form-group">
                        <label>ประเภทการหัก</label>
                        <select id="type" required>
                            <option value="">เลือกประเภท</option>
                            <option value="มาสาย">มาสาย</option>
                            <option value="ขาดงาน">ขาดงาน</option>
                            <option value="เบิกเงินล่วงหน้า">เบิกเงินล่วงหน้า</option>
                            <option value="อื่นๆ">อื่นๆ</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>จำนวนเงิน (บาท)</label>
                        <input type="number" id="amount" placeholder="0.00" step="0.01" required>
                    </div>
                </div>
                <div style="display: flex; justify-content: flex-end;">
                    <button type="submit" class="btn btn-primary" style="width: 180px;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        บันทึกรายการ
                    </button>
                </div>
            </form>
        </div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h3 style="font-weight: 600;">รายการล่าสุด</h3>
                <button onclick="fetchData(true)" style="background: none; border: none; color: var(--ios-blue); cursor: pointer; font-size: 14px; font-weight: 500;">รีเฟรชข้อมูล</button>
            </div>
            <div class="table-container">
                <table id="dataTable">
                    <thead>
                        <tr>
                            <th style="width: 40px;"><input type="checkbox" onclick="toggleAllRows(this)"></th>
                            <th>วันที่</th>
                            <th>ชื่อพนักงาน</th>
                            <th>ประเภท</th>
                            <th>จำนวนเงิน</th>
                            <th style="width: 80px;">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyI-K2G6K1B2Y4Q7C9S2C2F7Y2E2D2B2A2/exec'; // แทนที่ด้วย URL ของคุณ
    let selectedRows = new Set();
    const svgIcons = {
        success: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#34c759" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>',
        error: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ff3b30" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>'
    };

    /* ===== FLOATING SIDEBAR LOGIC (Same as index.html) ===== */
    const dragBtn = document.getElementById('floatingMenuBtn');
    const sideFloat = document.getElementById('sidebarFloat');
    const sideOverlay = document.getElementById('sidebarOverlay');
    let isDragging = false;
    let startX, startY, shiftX, shiftY;

    function loadButtonPosition() {
        const savedLeft = localStorage.getItem('floatBtnLeft');
        const savedTop = localStorage.getItem('floatBtnTop');
        if (savedLeft && savedTop) {
            dragBtn.style.left = savedLeft + 'px';
            dragBtn.style.top = savedTop + 'px';
        }
    }

    dragBtn.onpointerdown = function(e) {
        isDragging = false;
        startX = e.clientX;
        startY = e.clientY;
        const rect = dragBtn.getBoundingClientRect();
        shiftX = e.clientX - rect.left;
        shiftY = e.clientY - rect.top;
        dragBtn.setPointerCapture(e.pointerId);
        document.addEventListener('pointermove', onPointerMove);
        document.addEventListener('pointerup', onPointerUp);
    };

    function onPointerMove(e) {
        if (!isDragging && (Math.abs(e.clientX - startX) > 5 || Math.abs(e.clientY - startY) > 5)) {
            isDragging = true;
        }
        if (isDragging) {
            let newX = e.clientX - shiftX;
            let newY = e.clientY - shiftY;
            newX = Math.max(0, Math.min(newX, window.innerWidth - dragBtn.offsetWidth));
            newY = Math.max(0, Math.min(newY, window.innerHeight - dragBtn.offsetHeight));
            dragBtn.style.left = newX + 'px';
            dragBtn.style.top = newY + 'px';
        }
    }

    function onPointerUp(e) {
        document.removeEventListener('pointermove', onPointerMove);
        document.removeEventListener('pointerup', onPointerUp);
        dragBtn.releasePointerCapture(e.pointerId);
        if (isDragging) {
            localStorage.setItem('floatBtnLeft', dragBtn.offsetLeft);
            localStorage.setItem('floatBtnTop', dragBtn.offsetTop);
        } else {
            toggleSidebarFloat();
        }
        isDragging = false;
    }

    function toggleSidebarFloat() {
        const btnRect = dragBtn.getBoundingClientRect();
        const sidebarWidth = 280;
        let top = btnRect.bottom + 10;
        let left = btnRect.left;
        if (left + sidebarWidth > window.innerWidth) left = window.innerWidth - sidebarWidth - 15;
        if (top + 400 > window.innerHeight) {
            top = btnRect.top - 410;
            if (top < 10) top = 10;
        }
        sideFloat.style.top = top + 'px';
        sideFloat.style.left = left + 'px';
        sideFloat.style.transformOrigin = `${btnRect.left - left + 20}px ${btnRect.top > top ? 'bottom' : 'top'}`;
        const isActive = sideFloat.classList.toggle('active');
        sideOverlay.classList.toggle('active', isActive);
        if (isActive && !sideFloat.innerHTML) loadSidebarContent();
    }

    function closeSidebarFloat() {
        sideFloat.classList.remove('active');
        sideOverlay.classList.remove('active');
    }

    function loadSidebarContent() {
        fetch('sidebar.html')
            .then(res => res.text())
            .then(data => {
                sideFloat.innerHTML = `<div class="sidebar-header">เมนูนำทาง</div>` + data;
                ['credit', 'branch', 'sales'].forEach(id => {
                    if (localStorage.getItem('menu-' + id) === 'true') {
                        const el = sideFloat.querySelector('#menu-' + id);
                        if (el) el.classList.add('open');
                    }
                });
            });
    }

    window.toggleDrop = function(btn, id) {
        const item = btn.parentElement;
        const isOpen = item.classList.toggle("open");
        if (id) localStorage.setItem('menu-' + id, isOpen);
    }

    /* ===== ORIGINAL DATA HANDLING LOGIC (100% Intact) ===== */
    async function handleSubmit(e) {
        e.preventDefault();
        setProcessing(true);
        const data = {
            action: 'addDeduction',
            date: document.getElementById('date').value,
            name: document.getElementById('name').value,
            type: document.getElementById('type').value,
            amount: document.getElementById('amount').value
        };
        try {
            await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
            showStatusPopup("บันทึกข้อมูลสำเร็จแล้ว", true);
            document.getElementById('deductionForm').reset();
            fetchData(true);
        } catch (e) { showStatusPopup("เกิดข้อผิดพลาดในการบันทึก", false); }
        finally { setProcessing(false); }
    }

    async function fetchData(silent = false) {
        if (!silent) setProcessing(true);
        try {
            const res = await fetch(`${APPS_SCRIPT_URL}?action=getDeductions`);
            const data = await res.json();
            renderTable(data);
        } catch (e) { console.error(e); }
        finally { setProcessing(false); }
    }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = data.map((row, idx) => `
            <tr>
                <td><input type="checkbox" onchange="toggleRowSelection(${idx}, this)" ${selectedRows.has(idx) ? 'checked' : ''}></td>
                <td>${new Date(row.date).toLocaleDateString('th-TH')}</td>
                <td style="font-weight: 500;">${row.name}</td>
                <td><span class="status-pill pill-red">${row.type}</span></td>
                <td style="font-weight: 600;">฿${parseFloat(row.amount).toLocaleString(undefined, {minimumFractionDigits: 2})}</td>
                <td>
                    <button class="btn-danger" style="padding: 6px; border-radius: 8px;" onclick="deleteData(${idx})">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                    </button>
                </td>
            </tr>
        `).join('');
    }

    function toggleRowSelection(idx, cb) {
        if (cb.checked) selectedRows.add(idx); else selectedRows.delete(idx);
        updateBulkDeleteUI();
    }

    function toggleAllRows(cb) {
        const checkboxes = document.querySelectorAll('#tableBody input[type="checkbox"]');
        checkboxes.forEach((item, idx) => {
            item.checked = cb.checked;
            if (cb.checked) selectedRows.add(idx); else selectedRows.clear();
        });
        updateBulkDeleteUI();
    }

    function updateBulkDeleteUI() {
        const btn = document.getElementById('btnBulkDelete');
        const count = document.getElementById('selectedCount');
        btn.style.display = selectedRows.size > 0 ? 'flex' : 'none';
        count.innerText = selectedRows.size;
    }

    async function deleteData(idx) {
        if (!confirm("ต้องการลบรายการนี้ใช่หรือไม่?")) return;
        setProcessing(true);
        try {
            await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "deleteRow", rowIndex: idx }) });
            showStatusPopup("ลบรายการสำเร็จ", true); fetchData(true);
        } catch (e) { showStatusPopup("เกิดข้อผิดพลาด", false); } finally { setProcessing(false); }
    }

    async function bulkDeleteData() {
        if (!confirm(`ต้องการลบ ${selectedRows.size} รายการที่เลือกใช่หรือไม่?`)) return;
        setProcessing(true);
        try {
            const sorted = [...selectedRows].sort((a,b) => b-a);
            for(let idx of sorted) await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "deleteRow", rowIndex: idx }) });
            showStatusPopup("ลบสำเร็จ", true); selectedRows = []; fetchData(true);
            updateBulkDeleteUI();
        } catch (e) { showStatusPopup("เกิดข้อผิดพลาด", false); } finally { setProcessing(false); }
    }

    function setProcessing(val) { document.getElementById('loading').style.display = val ? 'flex' : 'none'; }
    function showStatusPopup(text, isSuccess) {
        document.getElementById("statusIcon").innerHTML = isSuccess ? svgIcons.success : svgIcons.error;
        document.getElementById("statusTitle").innerText = isSuccess ? "สำเร็จ" : "ล้มเหลว";
        document.getElementById("statusText").innerText = text;
        const pop = document.getElementById("statusPopup");
        pop.classList.add("show");
        setTimeout(() => pop.classList.remove("show"), 3000);
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadButtonPosition();
        fetchData();
        // เซ็ตวันที่ปัจจุบันใน input
        document.getElementById('date').valueAsDate = new Date();
    });
</script>
</body>
</html>
