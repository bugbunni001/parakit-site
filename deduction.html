<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>บันทึกการหักเงิน - Parakit-site</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ios-blue: #007aff; 
            --ios-bg: #f5f5f7; 
            --sidebar-dark: rgba(28, 28, 30, 0.96); 
            --glass-white: rgba(255, 255, 255, 0.85); 
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-main: #1d1d1f; 
            --text-light: #86868b; 
            --ios-red: #ff3b30; 
            --ios-green: #34c759;
            --card-shadow: 0 8px 32px rgba(0,0,0,0.08);
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Kanit', sans-serif !important; -webkit-font-smoothing: antialiased; }

        body { background: var(--ios-bg); color: var(--text-main); overflow-x: hidden; min-height: 100vh; }

        /* ===== FLOATING SIDEBAR SYSTEM (NEW) ===== */
        #floatingMenuBtn {
            position: fixed;
            top: 10px;
            left: 15px;
            width: 45px;
            height: 45px;
            background: var(--ios-blue);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: move;
            z-index: 2100;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
            border: none;
            touch-action: none;
            transition: transform 0.2s, opacity 0.2s;
            will-change: transform;
        }
        #floatingMenuBtn:active { transform: scale(0.9); }

        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.3);
            z-index: 2000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
            backdrop-filter: blur(4px);
        }
        .sidebar-overlay.active { display: block; opacity: 1; }

        .sidebar-float {
            position: fixed;
            width: 280px;
            max-height: 70vh;
            background: var(--sidebar-dark);
            border-radius: 20px;
            overflow-y: auto;
            z-index: 2001;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.8) translateY(10px);
            transition: opacity 0.3s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            scrollbar-width: thin;
        }
        .sidebar-float.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1) translateY(0);
        }
        .sidebar-float .sidebar-header { padding: 20px; font-size: 17px; font-weight: 600; color: #fff; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
        .sidebar-float .menu { padding: 8px 0; }
        .sidebar-float .menu a, .sidebar-float .drop-btn { 
            width: 100%; padding: 12px 20px; background: none; border: none; 
            color: #ebebf5; text-align: left; font-size: 14px; cursor: pointer; 
            display: flex; align-items: center; text-decoration: none; transition: 0.2s;
        }
        .sidebar-float .menu a:hover, .sidebar-float .drop-btn:hover { background: rgba(255,255,255,0.1); }
        .sidebar-float .sub { display: none; background: rgba(0,0,0,0.2); }
        .sidebar-float .item.open .sub { display: block; }
        .sidebar-float .sub a { padding-left: 45px; font-size: 13px; color: #8e8e93; }

        /* ===== MAIN CONTENT ADJUSTMENT ===== */
        .main-content { 
            padding: 80px 20px 40px; /* เพิ่ม Padding Top เพื่อหลบปุ่มลอย */
            max-width: 1200px; margin: 0 auto; 
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .header-section { margin-bottom: 30px; }
        .header-section h1 { font-size: 28px; font-weight: 600; color: var(--text-main); letter-spacing: -0.5px; }
        .header-section p { color: var(--text-light); font-size: 15px; margin-top: 4px; }

        .glass-card {
            background: var(--glass-white);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 24px; border: 1px solid var(--glass-border);
            box-shadow: var(--card-shadow); margin-bottom: 24px; padding: 24px;
        }

        /* Form Styling */
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 13px; font-weight: 500; color: var(--text-light); padding-left: 4px; }
        .form-group input, .form-group select {
            padding: 12px 16px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.08);
            background: white; font-size: 15px; transition: var(--transition); outline: none;
        }
        .form-group input:focus { border-color: var(--ios-blue); box-shadow: 0 0 0 4px rgba(0,122,255,0.1); }

        .btn {
            padding: 12px 24px; border-radius: 12px; font-weight: 600; font-size: 15px;
            cursor: pointer; transition: var(--transition); border: none; display: flex;
            align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary { background: var(--ios-blue); color: white; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(0,122,255,0.3); }
        .btn-danger { background: #fff1f0; color: var(--ios-red); border: 1px solid #ffa39e; }
        .btn-danger:hover { background: var(--ios-red); color: white; }

        /* Table Styling */
        .table-container { overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { padding: 16px; text-align: left; font-size: 13px; font-weight: 600; color: var(--text-light); border-bottom: 1px solid rgba(0,0,0,0.05); }
        td { padding: 16px; font-size: 14px; border-bottom: 1px solid rgba(0,0,0,0.02); }
        tr:hover td { background: rgba(0,0,0,0.01); }

        .checkbox-cell { width: 40px; }
        input[type="checkbox"] { width: 18px; height: 18px; border-radius: 4px; cursor: pointer; }

        /* Loading Overlay */
        #loading {
            position: fixed; inset: 0; background: rgba(255,255,255,0.8);
            backdrop-filter: blur(10px); z-index: 3000; display: none;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(0,122,255,0.1); border-top-color: var(--ios-blue); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Status Popup */
        .status-popup {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: white; padding: 16px 24px; border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15); z-index: 4000;
            display: flex; align-items: center; gap: 12px; transition: var(--transition);
        }
        .status-popup.show { transform: translateX(-50%) translateY(0); }

        @media (max-width: 768px) {
            .main-content { padding: 70px 15px 30px; }
            .form-grid { grid-template-columns: 1fr; }
            .header-section h1 { font-size: 24px; }
        }
    </style>
</head>
<body>

<button id="floatingMenuBtn" title="ลากเพื่อย้าย">เมนู</button>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebarFloat()"></div>
<aside class="sidebar-float" id="sidebarFloat"></aside>

<div id="loading">
    <div class="spinner"></div>
    <p style="margin-top: 15px; font-weight: 500;">กำลังดำเนินการ...</p>
</div>

<div class="status-popup" id="statusPopup">
    <div id="statusIcon"></div>
    <div>
        <h4 id="statusTitle" style="font-size: 15px;"></h4>
        <p id="statusText" style="font-size: 13px; color: var(--text-light);"></p>
    </div>
</div>

<div class="main-content">
    <div class="header-section">
        <h1>บันทึกรายการหักเงิน</h1>
        <p>จัดการข้อมูลการคืนเงินและรายการหักต่างๆ ของสาขา</p>
    </div>

    <div class="glass-card">
        <form id="deductionForm" onsubmit="handleSubmit(event)">
            <div class="form-grid">
                <div class="form-group">
                    <label>วันที่</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label>ชื่อสาขา</label>
                    <select id="branch" required>
                        <option value="">เลือกสาขา</option>
                        <option value="สำนักงานใหญ่">สำนักงานใหญ่</option>
                        <option value="บางพลี">บางพลี</option>
                        <option value="ศรีนครินทร์">ศรีนครินทร์</option>
                        <option value="เทพารักษ์">เทพารักษ์</option>
                        <option value="กิ่งแก้ว">กิ่งแก้ว</option>
                        <option value="ตำหรุ">ตำหรุ</option>
                        <option value="คลองด่าน">คลองด่าน</option>
                        <option value="บางบ่อ">บางบ่อ</option>
                        <option value="แพรกษา">แพรกษา</option>
                        <option value="นิคมฯ">นิคมฯ</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>รายการ</label>
                    <input type="text" id="item" placeholder="ระบุชื่อรายการ" required>
                </div>
                <div class="form-group">
                    <label>จำนวนเงิน (บาท)</label>
                    <input type="number" id="amount" step="0.01" placeholder="0.00" required>
                </div>
            </div>
            <div style="display: flex; gap: 12px; justify-content: flex-end;">
                <button type="submit" class="btn btn-primary">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                    เพิ่มรายการ
                </button>
            </div>
        </form>
    </div>

    <div class="glass-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3 style="font-size: 18px; font-weight: 600;">รายการทั้งหมด</h3>
            <button onclick="bulkDeleteData()" id="deleteSelectedBtn" class="btn btn-danger" style="display: none; padding: 8px 16px; font-size: 13px;">
                ลบรายการที่เลือก (<span id="selectedCount">0</span>)
            </button>
        </div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th class="checkbox-cell"><input type="checkbox" id="selectAll" onclick="toggleSelectAll()"></th>
                        <th>วันที่</th>
                        <th>สาขา</th>
                        <th>รายการ</th>
                        <th style="text-align: right;">จำนวนเงิน</th>
                        <th style="text-align: center;">จัดการ</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx7X-58GkXgJq6Vp89V69K26eO5vVq7zG3P89Wp89V69K26eO5v/exec'; // แทนที่ด้วย URL ของคุณ
    let selectedRows = new Set();

    const svgIcons = {
        success: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#34c759" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
        error: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ff3b30" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>'
    };

    /* ==========================================
        ✅ FLOATING SIDEBAR LOGIC (1:1 from remembered code)
       ========================================== */
    const dragBtn = document.getElementById('floatingMenuBtn');
    const sideFloat = document.getElementById('sidebarFloat');
    const sideOverlay = document.getElementById('sidebarOverlay');
    let isDragging = false;
    let startX, startY, shiftX, shiftY;

    function loadButtonPosition() {
        const savedLeft = localStorage.getItem('floatBtnLeft');
        const savedTop = localStorage.getItem('floatBtnTop');
        if (savedLeft && savedTop) {
            dragBtn.style.left = savedLeft + 'px';
            dragBtn.style.top = savedTop + 'px';
        }
    }

    dragBtn.onpointerdown = function(e) {
        isDragging = false;
        startX = e.clientX;
        startY = e.clientY;
        const rect = dragBtn.getBoundingClientRect();
        shiftX = e.clientX - rect.left;
        shiftY = e.clientY - rect.top;
        dragBtn.setPointerCapture(e.pointerId);
        document.addEventListener('pointermove', onPointerMove);
        document.addEventListener('pointerup', onPointerUp);
    };

    function onPointerMove(e) {
        if (!isDragging && (Math.abs(e.clientX - startX) > 5 || Math.abs(e.clientY - startY) > 5)) {
            isDragging = true;
        }
        if (isDragging) {
            let newX = e.clientX - shiftX;
            let newY = e.clientY - shiftY;
            newX = Math.max(0, Math.min(newX, window.innerWidth - dragBtn.offsetWidth));
            newY = Math.max(0, Math.min(newY, window.innerHeight - dragBtn.offsetHeight));
            dragBtn.style.left = newX + 'px';
            dragBtn.style.top = newY + 'px';
        }
    }

    function onPointerUp(e) {
        document.removeEventListener('pointermove', onPointerMove);
        document.removeEventListener('pointerup', onPointerUp);
        dragBtn.releasePointerCapture(e.pointerId);
        if (isDragging) {
            localStorage.setItem('floatBtnLeft', dragBtn.offsetLeft);
            localStorage.setItem('floatBtnTop', dragBtn.offsetTop);
        } else {
            toggleSidebarFloat();
        }
        isDragging = false;
    }

    function toggleSidebarFloat() {
        const btnRect = dragBtn.getBoundingClientRect();
        const sidebarWidth = 280;
        let top = btnRect.bottom + 10;
        let left = btnRect.left;

        if (left + sidebarWidth > window.innerWidth) left = window.innerWidth - sidebarWidth - 15;
        if (top + 400 > window.innerHeight) {
            top = btnRect.top - 410;
            if (top < 10) top = 10;
        }

        sideFloat.style.top = top + 'px';
        sideFloat.style.left = left + 'px';
        sideFloat.style.transformOrigin = `${btnRect.left - left + 20}px ${btnRect.top > top ? 'bottom' : 'top'}`;

        const isActive = sideFloat.classList.toggle('active');
        sideOverlay.classList.toggle('active', isActive);
        if (isActive && !sideFloat.innerHTML) loadSidebarContent();
    }

    function closeSidebarFloat() {
        sideFloat.classList.remove('active');
        sideOverlay.classList.remove('active');
    }

    function loadSidebarContent() {
        fetch('sidebar.html')
            .then(res => res.text())
            .then(data => {
                sideFloat.innerHTML = `<div class="sidebar-header">เมนูนำทาง</div>` + data;
                ['credit', 'branch', 'sales'].forEach(id => {
                    if (localStorage.getItem('menu-' + id) === 'true') {
                        const el = sideFloat.querySelector('#menu-' + id);
                        if (el) el.classList.add('open');
                    }
                });
            });
    }

    window.toggleDrop = function(btn, id) {
        const item = btn.parentElement;
        const isOpen = item.classList.toggle("open");
        if (id) localStorage.setItem('menu-' + id, isOpen);
    }

    /* ==========================================
        ✅ ORIGINAL DATA FUNCTIONS (100% Intact)
       ========================================== */
    async function fetchData(silent = false) {
        if (!silent) setProcessing(true);
        try {
            const response = await fetch(APPS_SCRIPT_URL + '?action=getDeductions');
            const data = await response.json();
            renderTable(data);
        } catch (e) {
            showStatusPopup("โหลดข้อมูลไม่สำเร็จ", false);
        } finally {
            if (!silent) setProcessing(false);
        }
    }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = data.length ? '' : '<tr><td colspan="6" style="text-align:center; color:var(--text-light);">ไม่พบข้อมูลรายการ</td></tr>';
        
        data.forEach((row, index) => {
            const tr = document.createElement('tr');
            const rowIdx = row.rowIndex;
            tr.innerHTML = `
                <td class="checkbox-cell"><input type="checkbox" onchange="handleRowSelect(this, ${rowIdx})" ${selectedRows.has(rowIdx) ? 'checked' : ''}></td>
                <td>${formatDate(row.date)}</td>
                <td><span style="font-weight:500;">${row.branch}</span></td>
                <td>${row.item}</td>
                <td style="text-align: right; font-weight: 600; color: var(--ios-red);">- ${parseFloat(row.amount).toLocaleString('th-TH', { minimumFractionDigits: 2 })}</td>
                <td style="text-align: center;">
                    <button onclick="deleteData(${rowIdx})" class="btn" style="padding: 6px; color: var(--text-light);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></svg></button>
                </td>
            `;
            tbody.appendChild(tr);
        });
        updateSelectedUI();
    }

    async function handleSubmit(e) {
        e.preventDefault();
        setProcessing(true);
        const data = {
            action: "addDeduction",
            date: document.getElementById('date').value,
            branch: document.getElementById('branch').value,
            item: document.getElementById('item').value,
            amount: document.getElementById('amount').value
        };

        try {
            await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
            showStatusPopup("บันทึกข้อมูลสำเร็จ", true);
            document.getElementById('deductionForm').reset();
            fetchData(true);
        } catch (e) {
            showStatusPopup("เกิดข้อผิดพลาดในการบันทึก", false);
        } finally {
            setProcessing(false);
        }
    }

    async function deleteData(idx) {
        if (!confirm("ยืนยันการลบรายการนี้?")) return;
        setProcessing(true);
        try {
            await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "deleteRow", rowIndex: idx }) });
            showStatusPopup("ลบรายการสำเร็จ", true);
            fetchData(true);
        } catch (e) {
            showStatusPopup("เกิดข้อผิดพลาด", false);
        } finally {
            setProcessing(false);
        }
    }

    async function bulkDeleteData() {
        if (!confirm(`ยืนยันการลบ ${selectedRows.size} รายการที่เลือก?`)) return;
        setProcessing(true);
        try {
            const sorted = [...selectedRows].sort((a,b) => b-a);
            for(let idx of sorted) {
                await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "deleteRow", rowIndex: idx }) });
            }
            showStatusPopup("ลบสำเร็จ", true);
            selectedRows = new Set();
            fetchData(true);
        } catch (e) {
            showStatusPopup("เกิดข้อผิดพลาด", false);
        } finally {
            setProcessing(false);
        }
    }

    function handleRowSelect(checkbox, idx) {
        if (checkbox.checked) selectedRows.add(idx);
        else selectedRows.delete(idx);
        updateSelectedUI();
    }

    function toggleSelectAll() {
        const master = document.getElementById('selectAll');
        const checkboxes = document.querySelectorAll('#tableBody input[type="checkbox"]');
        checkboxes.forEach(cb => {
            const idx = parseInt(cb.getAttribute('onchange').match(/\d+/)[0]);
            cb.checked = master.checked;
            if (master.checked) selectedRows.add(idx);
            else selectedRows.delete(idx);
        });
        updateSelectedUI();
    }

    function updateSelectedUI() {
        const count = selectedRows.size;
        document.getElementById('deleteSelectedBtn').style.display = count > 0 ? 'flex' : 'none';
        document.getElementById('selectedCount').innerText = count;
    }

    function formatDate(dateStr) {
        const d = new Date(dateStr);
        return d.toLocaleDateString('th-TH', { day: '2-digit', month: 'short', year: '2-digit' });
    }

    function setProcessing(val) { document.getElementById('loading').style.display = val ? 'flex' : 'none'; }

    function showStatusPopup(text, isSuccess) {
        const popup = document.getElementById("statusPopup");
        document.getElementById("statusIcon").innerHTML = isSuccess ? svgIcons.success : svgIcons.error;
        document.getElementById("statusTitle").innerText = isSuccess ? "สำเร็จ" : "ล้มเหลว";
        document.getElementById("statusText").innerText = text;
        popup.classList.add("show");
        setTimeout(() => popup.classList.remove("show"), 3000);
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadButtonPosition(); // Load Floating Button pos
        fetchData();
    });
</script>
</body>
</html>
