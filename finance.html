<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ลงข้อมูลสินเชื่อ - Parakit-site</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ios-blue: #007aff;
            --ios-green: #34c759;
            --ios-bg: #f2f2f7;
            --glass-white: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
            /* Sidebar style from index.html */
            --sidebar-dark: rgba(28, 28, 30, 0.96);
            --text-main: #1c1c1e;
            --text-light: #8e8e93;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            --transition-swift: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* ===== GLOBAL RESET & STRUCTURE ===== */
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif !important; }
        
        body { 
            margin: 0; 
            background-color: var(--ios-bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 122, 255, 0.06) 0px, transparent 40%),
                radial-gradient(at 100% 0%, rgba(52, 199, 89, 0.04) 0px, transparent 40%);
            background-attachment: fixed;
            padding-bottom: 80px; 
            color: var(--text-main); 
            -webkit-font-smoothing: antialiased; 
            overflow-x: hidden;
        }

        /* ===== Header Navbar (New from index) ===== */
        .top-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 60px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            z-index: 1000;
            display: flex;
            align-items: center;
            padding: 0 20px 0 75px; 
            border-bottom: 0.5px solid rgba(0,0,0,0.1);
        }

        /* ===== Floating Draggable Button (1:1 from index) ===== */
        #floatingMenuBtn {
            position: fixed;
            top: 10px;
            left: 15px;
            width: 45px;
            height: 45px;
            background: var(--ios-blue);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: move;
            z-index: 2100;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
            border: none;
            touch-action: none;
            transition: transform 0.2s, opacity 0.2s;
        }
        #floatingMenuBtn:active { transform: scale(0.9); }

        /* ===== Floating Sidebar & Overlay (1:1 from index) ===== */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.2);
            z-index: 2000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .sidebar-overlay.active { display: block; opacity: 1; }

        .sidebar-float {
            position: fixed;
            width: 280px;
            max-height: 70vh;
            background: var(--sidebar-dark);
            border-radius: 20px;
            overflow-y: auto;
            z-index: 2001;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.8) translateY(10px);
            transition: opacity 0.3s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.2) transparent;
        }
        .sidebar-float.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1) translateY(0);
        }

        /* Sidebar Content Styles */
        .sidebar-float .sidebar-header { padding: 20px; font-size: 17px; font-weight: 600; color: #fff; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
        .sidebar-float .menu { padding: 8px 0; }
        .sidebar-float .menu a, .sidebar-float .drop-btn { 
            width: 100%; padding: 12px 20px; background: none; border: none; 
            color: #ebebf5; text-align: left; font-size: 14px; cursor: pointer; 
            display: flex; align-items: center; text-decoration: none; transition: 0.2s;
        }
        .sidebar-float .menu a:hover, .sidebar-float .drop-btn:hover { background: rgba(255,255,255,0.1); }
        .sidebar-float .sub { display: none; background: rgba(0,0,0,0.2); }
        .sidebar-float .item.open .sub { display: block; }
        .sidebar-float .sub a { padding-left: 45px; font-size: 13px; color: #8e8e93; }

        /* ===== MAIN CONTENT (Restored original box) ===== */
        .content { 
            padding: 80px 15px 40px; 
            display: flex; justify-content: center; 
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .box { 
            background: var(--glass-white); 
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            width: 100%; max-width: 440px; padding: 30px 24px; 
            border-radius: 28px; border: 1px solid var(--glass-border);
            box-shadow: 0 15px 35px rgba(0,0,0,0.04); 
        }

        h3 { 
            margin-top: 0; margin-bottom: 25px; 
            color: var(--text-main); text-align: center; 
            font-weight: 600; font-size: 22px; letter-spacing: -0.3px;
        }
        
        .form-row { margin-bottom: 16px; }
        label { 
            display: block; margin-bottom: 6px; margin-left: 4px;
            font-size: 13.5px; color: var(--text-main); font-weight: 500; 
        }
        
        input, select { 
            width: 100%; padding: 12px 16px; 
            border: 1px solid rgba(0,0,0,0.05); 
            border-radius: 12px; font-size: 15px; outline: none; 
            transition: var(--transition); background: rgba(255,255,255,0.4); 
            color: var(--text-main);
        }
        input:focus, select:focus { 
            border-color: var(--ios-blue); 
            background: #fff;
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.08);
        }

        .btn-submit { 
            width: 100%; padding: 14px; border: none; border-radius: 16px; 
            background: var(--ios-blue); color: white; 
            font-size: 16px; font-weight: 600; cursor: pointer; 
            transition: var(--transition); margin-top: 10px; 
            display: flex; align-items: center; justify-content: center; gap: 8px; 
            box-shadow: 0 6px 15px rgba(0, 122, 255, 0.2);
        }
        .btn-submit:hover { transform: translateY(-2px); filter: brightness(1.05); }
        .btn-submit:active { transform: scale(0.98); }

        #reasonGroup { display: none; animation: slideDown 0.3s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        #preview { 
            width: 100%; margin-top: 12px; border-radius: 14px; 
            display: none; border: 1.5px solid var(--glass-border); 
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        /* ===== POPUP & LOADING ===== */
        .loading { 
            position: fixed; inset: 0; background: rgba(255,255,255,0.7); 
            display: none; flex-direction: column; align-items: center; justify-content: center; 
            z-index: 3000; backdrop-filter: blur(15px); 
        }
        .spinner { 
            width: 35px; height: 35px; border: 3px solid rgba(0,0,0,0.05); 
            border-top: 3px solid var(--ios-blue); border-radius: 50%; 
            animation: spin 0.8s linear infinite; 
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .popup { position: fixed; inset: 0; background: rgba(0,0,0,0.2); display: none; align-items: center; justify-content: center; z-index: 4000; backdrop-filter: blur(10px); }
        .popup.show { display: flex; }
        .popup-box { 
            background: var(--glass-white); padding: 30px 25px; border-radius: 24px; 
            text-align: center; max-width: 300px; width: 100%; 
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            animation: popupPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        @keyframes popupPop { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
        
        .check-icon { width: 55px; height: 55px; margin: 0 auto 15px; display: block; }
        .check-icon circle { stroke: var(--ios-green); stroke-width: 2.5; fill: none; }
        .check-icon path { stroke: var(--ios-green); stroke-width: 4; fill: none; stroke-linecap: round; }
        .warn-icon { font-size: 50px; color: #ff3b30; margin-bottom: 15px; }
        
        .success .warn-icon, .error .check-icon { display: none; }
        
        .btn-ok { 
            background: var(--text-main); color: #fff; width: 100%; 
            padding: 10px; border: none; border-radius: 12px; 
            font-size: 15px; font-weight: 600; cursor: pointer;
        }

        footer { 
            width: 100%; text-align: center; padding: 18px; 
            color: var(--text-light); font-size: 11px; 
            background: rgba(255,255,255,0.4); backdrop-filter: blur(10px);
            border-top: 1px solid var(--glass-border);
            position: fixed; bottom: 0; left: 0; z-index: 1100;
        }
    </style>
</head>

<body>

<header class="top-header">
    <div style="font-weight: 700; font-size: 1.25rem; color: var(--text-main); letter-spacing: -0.8px;">ลงข้อมูลสินเชื่อ</div>
</header>

<button id="floatingMenuBtn" title="ลากเพื่อย้าย">เมนู</button>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebarFloat()"></div>
<aside class="sidebar-float" id="sidebarFloat"></aside>

<div class="content">
    <div class="box">
        <h3>📝 ลงข้อมูลสินเชื่อ</h3>
        <form id="loanForm">
            <div class="form-row">
                <label>วันที่</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-row">
                <label>สาขา</label>
                <select id="branch" required>
                    <option value="">-- เลือกสาขา --</option>
                    <option>TS BC Pracha Uthit</option><option>TS LT Bang Yai</option><option>TS Terminal 21 Rama 3</option>
                    <option>TS Lotus Bangkruai Sainoi</option><option>TS Robinson Samutprakan</option><option>TS LT Bangpoo</option>
                    <option>TS LT Sukhumvit 50</option><option>TS BC Rama 2</option><option>TS LT Rama 2</option>
                </select>
            </div>
            <div class="form-row">
                <label>ชื่อพนักงาน</label>
                <input type="text" id="staffName" required placeholder="ชื่อพนักงาน">
            </div>

            <div class="form-row">
                <label>ชื่อลูกค้า</label>
                <input type="text" id="customerName" required placeholder="ชื่อ-นามสกุล ลูกค้า">
            </div>

            <div class="form-row">
                <label>เบอร์โทรศัพท์ลูกค้า</label>
                <input type="tel" id="customerPhone" required placeholder="08XXXXXXXX" pattern="[0-9]{10}">
            </div>

            <div class="form-row">
                <label>ประเภทสินเชื่อ</label>
                <select id="loanType" required>
                    <option value="">-- เลือกสินเชื่อ --</option>
                    <option>True PayNext Extra</option><option>SG Finance+</option><option>Samsung Finance+</option><option>Umay+</option>
                </select>
            </div>
            <div class="form-row">
                <label>ผลอนุมัติ</label>
                <select id="result" onchange="toggleReason()" required>
                    <option value="">-- เลือกผล --</option>
                    <option value="ผ่าน">ผ่าน</option>
                    <option value="ไม่ผ่าน">ไม่ผ่าน</option>
                </select>
            </div>
            <div class="form-row" id="reasonGroup">
                <label>เหตุผล (กรณีผ่าน)</label>
                <select id="reason">
                    <option value="">-- เลือกเหตุผล --</option>
                    <option>ผ่าน ซื้อเครื่อง ใช้วงเงิน</option>
                    <option>ผ่าน ไม่ซื้อเครื่อง ยังไม่ตัดสินใจซื้อ ด้วยเหตุผลอื่นๆ</option>
                    <option>ผ่าน ไม่ซื้อเครื่อง วางดาวน์สูง</option>
                    <option>ผ่าน ไม่ซื้อเครื่องได้วงเงินน้อย ไม่พอซื้อเครื่อง</option>
                    <option>ผ่าน ไม่ซื้อเครื่อง ลูกค้ายังไม่อยากใช้วงเงินสินเชื่อ</option>
                </select>
            </div>
            <div class="form-row">
                <label>รูปภาพหลักฐาน</label>
                <input type="file" id="imageFile" accept="image/*" onchange="previewImage()" style="padding: 8px; font-size: 12px;">
                <img id="preview">
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">💾 บันทึกข้อมูล</button>
        </form>
    </div>
</div>

<div class="loading" id="loading">
    <div class="spinner"></div>
    <div style="margin-top:12px; font-size: 14px; font-weight:600; color:#1c1c1e;">กำลังซิงค์ข้อมูล...</div>
</div>

<div class="popup" id="popup">
    <div class="popup-box" id="pBox">
        <div class="icon-box">
            <svg class="check-icon" viewBox="0 0 52 52">
                <circle cx="26" cy="26" r="23"/>
                <path d="M14 27l7 7 16-16"/>
            </svg>
            <div class="warn-icon">⚠️</div>
        </div>
        <h3 id="popupText" style="margin-bottom:20px; font-size:17px; color: #1c1c1e;"></h3>
        <button class="btn-ok" onclick="closePopup()">ตกลง</button>
    </div>
</div>

<footer>© 2026 Copy Right By Angerina Frog</footer>

<script>
    // --- Constant for App Script ---
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyZqabSCrYmEBNr2z9zpWTYjyptJYoSiLsyN9tgvgPw9KbBH4RyF0FwWvx1Ofu8nE9seg/exec"; 

    // --- Floating Sidebar Logic (1:1 from index.html) ---
    const dragBtn = document.getElementById('floatingMenuBtn');
    const sideFloat = document.getElementById('sidebarFloat');
    const sideOverlay = document.getElementById('sidebarOverlay');
    let isDragging = false;
    let startX, startY, shiftX, shiftY;

    function loadButtonPosition() {
        const savedLeft = localStorage.getItem('floatBtnLeft');
        const savedTop = localStorage.getItem('floatBtnTop');
        if (savedLeft && savedTop) {
            dragBtn.style.left = savedLeft + 'px';
            dragBtn.style.top = savedTop + 'px';
        }
    }

    dragBtn.onpointerdown = function(e) {
        isDragging = false;
        startX = e.clientX; startY = e.clientY;
        const rect = dragBtn.getBoundingClientRect();
        shiftX = e.clientX - rect.left;
        shiftY = e.clientY - rect.top;
        dragBtn.setPointerCapture(e.pointerId);
        document.addEventListener('pointermove', onPointerMove);
        document.addEventListener('pointerup', onPointerUp);
    };

    function onPointerMove(e) {
        if (!isDragging && (Math.abs(e.clientX - startX) > 5 || Math.abs(e.clientY - startY) > 5)) isDragging = true;
        if (isDragging) {
            let newX = e.clientX - shiftX;
            let newY = e.clientY - shiftY;
            newX = Math.max(0, Math.min(newX, window.innerWidth - dragBtn.offsetWidth));
            newY = Math.max(0, Math.min(newY, window.innerHeight - dragBtn.offsetHeight));
            dragBtn.style.left = newX + 'px';
            dragBtn.style.top = newY + 'px';
        }
    }

    function onPointerUp(e) {
        document.removeEventListener('pointermove', onPointerMove);
        document.removeEventListener('pointerup', onPointerUp);
        dragBtn.releasePointerCapture(e.pointerId);
        if (isDragging) {
            localStorage.setItem('floatBtnLeft', dragBtn.offsetLeft);
            localStorage.setItem('floatBtnTop', dragBtn.offsetTop);
        } else {
            toggleSidebarFloat();
        }
        isDragging = false;
    }

    function toggleSidebarFloat() {
        const btnRect = dragBtn.getBoundingClientRect();
        const sidebarWidth = 280;
        let top = btnRect.bottom + 10;
        let left = btnRect.left;
        if (left + sidebarWidth > window.innerWidth) left = window.innerWidth - sidebarWidth - 15;
        if (top + 400 > window.innerHeight) {
            top = btnRect.top - 410;
            if (top < 10) top = 10;
        }
        sideFloat.style.top = top + 'px';
        sideFloat.style.left = left + 'px';
        sideFloat.style.transformOrigin = `${btnRect.left - left + 20}px ${btnRect.top > top ? 'bottom' : 'top'}`;
        const isActive = sideFloat.classList.toggle('active');
        sideOverlay.classList.toggle('active', isActive);
        if (isActive && !sideFloat.innerHTML) loadSidebarContent();
    }

    function closeSidebarFloat() {
        sideFloat.classList.remove('active');
        sideOverlay.classList.remove('active');
    }

    function loadSidebarContent() {
        fetch('sidebar.html')
            .then(res => res.text())
            .then(data => {
                sideFloat.innerHTML = `<div class="sidebar-header">เมนูนำทาง</div>` + data;
                ['credit', 'branch', 'sales'].forEach(id => {
                    if (localStorage.getItem('menu-' + id) === 'true') {
                        const el = sideFloat.querySelector('#menu-' + id);
                        if (el) el.classList.add('open');
                    }
                });
            });
    }

    window.toggleDrop = function(btn, id) {
        const item = btn.parentElement;
        const isOpen = item.classList.toggle("open");
        if (id) localStorage.setItem('menu-' + id, isOpen);
    }

    // --- Original Form Logic ---
    document.getElementById('date').value = new Date().toISOString().split("T")[0];

    function toggleReason() {
        const isPass = document.getElementById('result').value === 'ผ่าน';
        document.getElementById('reasonGroup').style.display = isPass ? 'block' : 'none';
    }

    function previewImage() {
        const file = document.getElementById('imageFile').files[0];
        const preview = document.getElementById('preview');
        if (file) {
            const reader = new FileReader();
            reader.onloadend = () => { preview.src = reader.result; preview.style.display = 'block'; }
            reader.readAsDataURL(file);
        }
    }

    document.getElementById('loanForm').onsubmit = function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const staffName = document.getElementById('staffName').value.trim();
        const customerName = document.getElementById('customerName').value.trim();
        const customerPhone = document.getElementById('customerPhone').value.trim();

        if (!staffName || !customerName || !customerPhone) {
            showPopup("กรุณากรอกข้อมูลให้ครบถ้วน", false);
            return;
        }

        loading.style.display = "flex";
        btn.disabled = true;

        const file = document.getElementById('imageFile').files[0];
        const formData = {
            date: document.getElementById('date').value,
            branch: document.getElementById('branch').value,
            staffName: staffName,
            customerName: customerName,
            customerPhone: customerPhone,
            loanType: document.getElementById('loanType').value,
            result: document.getElementById('result').value,
            reason: document.getElementById('reason').value || "ไม่ผ่าน"
        };

        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                formData.imageFile = e.target.result;
                formData.imageName = file.name;
                formData.imageType = file.type;
                sendData(formData);
            };
            reader.readAsDataURL(file);
        } else {
            sendData(formData);
        }
    };

    function sendData(data) {
        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors", 
            body: JSON.stringify(data)
        })
        .then(() => {
            document.getElementById('loading').style.display = "none";
            showPopup("บันทึกข้อมูลสำเร็จ", true);
            setTimeout(() => location.reload(), 2000);
        })
        .catch(err => {
            document.getElementById('loading').style.display = "none";
            showPopup("ผิดพลาด: " + err, false);
            document.getElementById('submitBtn').disabled = false;
        });
    }

    function showPopup(text, isSuccess) {
        const popup = document.getElementById("popup");
        const pBox = document.getElementById("pBox");
        document.getElementById("popupText").innerText = text;
        popup.classList.remove("success", "error");
        popup.classList.add(isSuccess ? "success" : "error");
        popup.classList.add("show");
    }

    function closePopup() { 
        document.getElementById("popup").classList.remove("show");
    }

    window.onload = loadButtonPosition;
</script>
</body>
</html>
