<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ลงข้อมูลสินเชื่อ - Parakit-site</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        :root {
            --ios-blue: #007aff;
            --ios-green: #34c759;
            --ios-red: #ff3b30;
            --ios-orange: #ff9500;
            --ios-bg: #f2f2f7;
            --glass-white: rgba(255, 255, 255, 0.7);
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.5);
            --sidebar-dark: rgba(28, 28, 30, 0.96);
            --text-main: #1c1c1e;
            --text-light: #8e8e93;
            --text-muted: #8e8e93;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-swift: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * { box-sizing: border-box; font-family: 'Kanit', sans-serif !important; -webkit-tap-highlight-color: transparent; }
        
        body { 
            margin: 0; 
            background-color: var(--ios-bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 122, 255, 0.06) 0px, transparent 40%),
                radial-gradient(at 100% 0%, rgba(52, 199, 89, 0.04) 0px, transparent 40%);
            background-attachment: fixed;
            padding-bottom: 80px; 
            color: var(--text-main); 
            -webkit-font-smoothing: antialiased; 
            overflow-x: hidden;
        }

        /* ===== OPTIMIZED FLOATING SIDEBAR (UPDATED) ===== */
        #floatingMenuBtn {
            position: fixed;
            top: 15px;
            left: 15px;
            width: auto; 
            height: 42px;
            padding: 0 20px;
            background: var(--ios-blue);
            color: white;
            border-radius: 21px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 500;
            cursor: move;
            z-index: 2100;
            box-shadow: 0 8px 20px rgba(0, 122, 255, 0.3);
            border: 1px solid rgba(255,255,255,0.2);
            touch-action: none;
            will-change: transform;
            transition: transform 0.2s, opacity 0.2s;
        }

        #floatingMenuBtn:active { transform: scale(0.92); }

        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.3);
            z-index: 2000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .sidebar-overlay.active { display: block; opacity: 1; }

        .sidebar-float {
            position: fixed;
            width: 280px;
            max-height: 70vh;
            background: var(--sidebar-dark);
            border-radius: 20px;
            overflow-y: auto;
            z-index: 2001;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.9) translateY(10px);
            transition: opacity 0.25s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            will-change: transform, opacity;
            scrollbar-width: none;
        }
        .sidebar-float::-webkit-scrollbar { display: none; }
        .sidebar-float.active { opacity: 1; visibility: visible; transform: scale(1) translateY(0); }

        .sidebar-float .sidebar-header { padding: 20px; font-size: 17px; font-weight: 600; color: #fff; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
        .sidebar-float .menu { padding: 8px 0; }
        .sidebar-float .menu a, .sidebar-float .drop-btn { 
            width: 100%; padding: 12px 20px; background: none; border: none; 
            color: #ebebf5; text-align: left; font-size: 14px; cursor: pointer; 
            display: flex; align-items: center; text-decoration: none; transition: 0.2s;
        }
        .sidebar-float .menu a:hover, .sidebar-float .drop-btn:hover { background: rgba(255,255,255,0.1); }
        .sidebar-float .sub { display: none; background: rgba(0,0,0,0.2); }
        .sidebar-float .item.open .sub { display: block; }
        .sidebar-float .sub a { padding-left: 45px; font-size: 13px; color: #8e8e93; }

        /* ===== MAIN CONTENT STYLES ===== */
        .top-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 60px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            z-index: 1000;
            display: flex;
            align-items: center;
            padding: 0 20px 0 100px; 
            border-bottom: 0.5px solid rgba(0,0,0,0.1);
        }

        .content { padding: 80px 15px 40px; display: flex; justify-content: center; animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .box { 
            background: var(--glass-white); 
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            width: 100%; max-width: 440px; padding: 30px 24px; 
            border-radius: 28px; border: 1px solid var(--glass-border);
            box-shadow: 0 15px 35px rgba(0,0,0,0.04); 
        }

        h3 { margin: 0 0 25px; color: var(--text-main); text-align: center; font-weight: 600; font-size: 22px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .form-row { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; margin-left: 4px; font-size: 13.5px; font-weight: 500; }
        
        input, select { 
            width: 100%; padding: 12px 16px; border: 1px solid rgba(0,0,0,0.05); 
            border-radius: 12px; font-size: 15px; outline: none; transition: var(--transition-swift); 
            background: rgba(255,255,255,0.4);
        }
        input:focus, select:focus { border-color: var(--ios-blue); background: #fff; box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.08); transform: translateY(-1px); }

        .btn-submit { 
            width: 100%; padding: 14px; border: none; border-radius: 16px; 
            background: var(--ios-blue); color: white; font-size: 16px; font-weight: 600; 
            cursor: pointer; transition: var(--transition-bounce); margin-top: 10px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.2);
        }
        .btn-submit:hover { transform: scale(1.02); background: #006ee6; }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { background: #ccc; cursor: not-allowed; transform: none !important; box-shadow: none; }

        #reasonGroup { display: none; animation: slideDown 0.3s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        #preview { width: 100%; margin-top: 12px; border-radius: 14px; display: none; border: 1.5px solid var(--glass-border); transition: var(--transition); }

        .loading { 
            position: fixed; inset: 0; background: rgba(255,255,255,0.8); 
            display: none; flex-direction: column; align-items: center; justify-content: center; 
            z-index: 3000; backdrop-filter: blur(10px); 
        }
        .spinner { width: 35px; height: 35px; border: 3px solid rgba(0,0,0,0.05); border-top: 3px solid var(--ios-blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .popup { position: fixed; inset: 0; background: rgba(0,0,0,0.2); display: none; align-items: center; justify-content: center; z-index: 4000; backdrop-filter: blur(10px); }
        .popup.show { display: flex; }
        .popup-box { background: var(--glass-white); padding: 30px 25px; border-radius: 24px; text-align: center; max-width: 300px; width: 100%; border: 1px solid var(--glass-border); animation: popupPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popupPop { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
        
        .check-icon { width: 55px; height: 55px; margin: 0 auto 15px; display: block; }
        .check-icon circle { stroke: var(--ios-green); stroke-width: 2.5; fill: none; }
        .check-icon path { stroke: var(--ios-green); stroke-width: 4; fill: none; stroke-linecap: round; }
        .warn-icon { font-size: 50px; color: #ff3b30; margin-bottom: 15px; display: none; }
        
        .error .warn-icon { display: block; }
        .error .check-icon { display: none; }
        
        .btn-ok { 
            background: var(--text-main); color: #fff; width: 100%; padding: 12px; border: none; 
            border-radius: 12px; font-weight: 600; cursor: pointer; transition: var(--transition-swift);
        }
        .btn-ok:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-ok:active { transform: scale(0.97); }

        footer { width: 100%; text-align: center; padding: 18px; color: var(--text-light); font-size: 11px; background: rgba(255,255,255,0.4); backdrop-filter: blur(10px); border-top: 1px solid var(--glass-border); position: fixed; bottom: 0; left: 0; z-index: 1100; }
    </style>
</head>

<body>

<header class="top-header">
    <div style="font-weight: 700; font-size: 1.25rem; color: var(--text-main); letter-spacing: -0.8px;">ลงข้อมูลสินเชื่อ</div>
</header>

<button id="floatingMenuBtn" title="ลากเพื่อย้าย">เมนู</button>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebarFloat()"></div>
<aside class="sidebar-float" id="sidebarFloat"></aside>

<div class="content">
    <div class="box">
        <h3><i class="bi bi-pencil-square"></i> ลงข้อมูลสินเชื่อ</h3>
        <form id="loanForm">
            <div class="form-row"><label>วันที่</label><input type="date" id="date" required></div>
            <div class="form-row">
                <label>สาขา</label>
                <select id="branch" required>
                    <option value="">-- เลือกสาขา --</option>
                    <option>80000397 TS BC Pracha Uthit</option>
                    <option>80000264 TS LT Rama 2</option>
                    <option>80000022 TS BC Rama 2</option>
                    <option>80000530 TS LT Bang Yai</option>
                    <option>80000215 TS JC Wanghin</option>
                    <option>80000251 TS LT Rama 3</option>
                    <option>80000538 TS Robinson Samutprakan</option>
                    <option>80000023 TS BC Bangplee</option>
                    <option>80000263 TS LT Bangpoo</option>
                    <option>80000087 TS LT Srinakarin</option>
                    <option>80002441 TS Lotus Bangkruai Sainoi</option>
                    <option>80000284 TS BC Sapankhwai</option>
                    <option>80000086 TS LT Bangkapi</option>
                    <option>80000207 TS LT Prachachuen</option>
                    <option>80002390 TS Terminal 21 Rama 3</option>
                    <option>80002425 Makro Sathorn</option>
                    <option>80002456 Makro Bangbon</option>
                </select>
            </div>
            <div class="form-row"><label>ชื่อพนักงาน</label><input type="text" id="staffName" required placeholder="ชื่อพนักงาน"></div>
            <div class="form-row"><label>ชื่อลูกค้า</label><input type="text" id="customerName" required placeholder="ชื่อ-นามสกุล ลูกค้า"></div>
            
            <div class="form-row">
                <label>เบอร์โทรศัพท์ลูกค้า</label>
                <input type="tel" id="customerPhone" required placeholder="08XXXXXXXX" 
                       oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10);" 
                       pattern="[0-9]{10}">
            </div>

            <div class="form-row">
                <label>ประเภทสินเชื่อ</label>
                <select id="loanType" required>
                    <option value="">-- เลือกสินเชื่อ --</option>
                    <option>True PayNext Extra</option><option>SG Finance+</option><option>Samsung Finance+</option><option>Umay+</option>
                </select>
            </div>
            <div class="form-row">
                <label>ผลอนุมัติ</label>
                <select id="result" onchange="toggleReason()" required>
                    <option value="">-- เลือกผล --</option>
                    <option value="ผ่าน">ผ่าน</option>
                    <option value="ไม่ผ่าน">ไม่ผ่าน</option>
                </select>
            </div>
            <div class="form-row" id="reasonGroup">
                <label>เหตุผล (กรณีผ่าน)</label>
                <select id="reason">
                    <option value="">-- เลือกเหตุผล --</option>
                    <option>ผ่าน ซื้อเครื่อง ใช้วงเงิน</option>
                    <option>ผ่าน ไม่ซื้อเครื่อง ยังไม่ตัดสินใจซื้อ ด้วยเหตุผลอื่นๆ</option>
                    <option>ผ่าน ไม่ซื้อเครื่อง วางดาวน์สูง</option>
                    <option>ผ่าน ไม่ซื้อเครื่องได้วงเงินน้อย ไม่พอซื้อเครื่อง</option>
                    <option>ผ่าน ไม่ซื้อเครื่อง ลูกค้ายังไม่อยากใช้วงเงินสินเชื่อ</option>
                </select>
            </div>
            <div class="form-row">
                <label>รูปภาพหลักฐาน</label>
                <input type="file" id="imageFile" accept="image/*" onchange="previewImage()" style="padding: 8px; font-size: 12px;">
                <img id="preview">
            </div>
            <button type="submit" class="btn-submit" id="submitBtn"><i class="bi bi-floppy"></i> บันทึกข้อมูล</button>
        </form>
    </div>
</div>

<div class="loading" id="loading">
    <div class="spinner"></div>
    <div style="margin-top:12px; font-size: 14px; font-weight:600; color:#1c1c1e;">กำลังบันทึกข้อมูล...</div>
</div>

<div class="popup" id="popup">
    <div class="popup-box" id="pBox">
        <div class="icon-box">
            <svg class="check-icon" viewBox="0 0 52 52"><circle cx="26" cy="26" r="23"/><path d="M14 27l7 7 16-16"/></svg>
            <div class="warn-icon"><i class="bi bi-exclamation-triangle-fill"></i></div>
        </div>
        <h3 id="popupText" style="margin-bottom:20px; font-size:17px; color: #1c1c1e;"></h3>
        <button class="btn-ok" id="popupOkBtn" onclick="closePopup()">ตกลง</button>
    </div>
</div>

<footer>© 2026 Copy Right By Angerina Frog</footer>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwUxvcC65qEJLAFNcHVerHXAnKddXsRu_zhMRmI1LzKtbQ1WP9MoAhKdfmcSt35Wm-RTQ/exec";

    /* ===== JS FOR FLOATING SIDEBAR (UPDATED) ===== */
    const dragBtn = document.getElementById('floatingMenuBtn');
    const sideFloat = document.getElementById('sidebarFloat');
    const sideOverlay = document.getElementById('sidebarOverlay');
    let isDragging = false;
    let startX, startY, shiftX, shiftY;

    function loadButtonPosition() {
        const savedLeft = localStorage.getItem('floatBtnLeft');
        const savedTop = localStorage.getItem('floatBtnTop');
        if (savedLeft && savedTop) {
            dragBtn.style.left = savedLeft + 'px';
            dragBtn.style.top = savedTop + 'px';
        }
    }

    dragBtn.addEventListener('pointerdown', (e) => {
        isDragging = false;
        startX = e.clientX; startY = e.clientY;
        const rect = dragBtn.getBoundingClientRect();
        shiftX = e.clientX - rect.left;
        shiftY = e.clientY - rect.top;
        dragBtn.setPointerCapture(e.pointerId);
        
        const moveHandler = (ev) => {
            if (!isDragging && (Math.abs(ev.clientX - startX) > 5 || Math.abs(ev.clientY - startY) > 5)) isDragging = true;
            if (isDragging) {
                let x = ev.clientX - shiftX;
                let y = ev.clientY - shiftY;
                x = Math.max(0, Math.min(x, window.innerWidth - dragBtn.offsetWidth));
                y = Math.max(0, Math.min(y, window.innerHeight - dragBtn.offsetHeight));
                dragBtn.style.left = x + 'px';
                dragBtn.style.top = y + 'px';
            }
        };

        const upHandler = (ev) => {
            document.removeEventListener('pointermove', moveHandler);
            document.removeEventListener('pointerup', upHandler);
            dragBtn.releasePointerCapture(ev.pointerId);
            if (isDragging) {
                localStorage.setItem('floatBtnLeft', dragBtn.offsetLeft);
                localStorage.setItem('floatBtnTop', dragBtn.offsetTop);
            } else { toggleSidebarFloat(); }
            isDragging = false;
        };

        document.addEventListener('pointermove', moveHandler, { passive: true });
        document.addEventListener('pointerup', upHandler);
    });

    function toggleSidebarFloat() {
        const btnRect = dragBtn.getBoundingClientRect();
        let top = btnRect.bottom + 10;
        let left = btnRect.left;
        if (left + 280 > window.innerWidth) left = window.innerWidth - 295;
        if (top + 400 > window.innerHeight) top = Math.max(10, btnRect.top - 410);
        
        sideFloat.style.top = top + 'px';
        sideFloat.style.left = left + 'px';
        const isActive = sideFloat.classList.toggle('active');
        sideOverlay.classList.toggle('active', isActive);
        if (isActive && !sideFloat.innerHTML) loadSidebarContent();
    }

    function closeSidebarFloat() {
        sideFloat.classList.remove('active');
        sideOverlay.classList.remove('active');
    }

    function loadSidebarContent() {
        fetch('sidebar.html')
            .then(res => res.text())
            .then(data => {
                sideFloat.innerHTML = `<div class="sidebar-header">เมนูนำทาง</div>` + data;
                // โหลดสถานะการเปิดเมนูย่อย
                ['credit', 'branch', 'sales'].forEach(id => {
                    if (localStorage.getItem('menu-' + id) === 'true') {
                        const el = sideFloat.querySelector('#menu-' + id);
                        if (el) el.classList.add('open');
                    }
                });
            })
            .catch(() => { sideFloat.innerHTML = `<div style="padding:20px; color:white;">ไม่พบไฟล์ sidebar.html</div>`; });
    }

    window.toggleDrop = function(btn, id) {
        const item = btn.parentElement;
        const isOpen = item.classList.toggle("open");
        if (id) localStorage.setItem('menu-' + id, isOpen);
    }

    /* ===== JS FOR LOAN FORM FUNCTIONS (REMAINS SAME) ===== */
    document.getElementById('date').value = new Date().toISOString().split("T")[0];

    function toggleReason() {
        const isPass = document.getElementById('result').value === 'ผ่าน';
        document.getElementById('reasonGroup').style.display = isPass ? 'block' : 'none';
    }

    function previewImage() {
        const file = document.getElementById('imageFile').files[0];
        const preview = document.getElementById('preview');
        if (file) {
            const reader = new FileReader();
            reader.onloadend = () => { preview.src = reader.result; preview.style.display = 'block'; }
            reader.readAsDataURL(file);
        }
    }

    document.addEventListener('keydown', function(e) {
        if (e.key === "Enter") {
            const popup = document.getElementById("popup");
            if (popup.classList.contains("show")) {
                closePopup();
                e.preventDefault();
            }
        }
    });

    document.getElementById('loanForm').onsubmit = function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        
        loading.style.display = "flex";
        btn.disabled = true;
        btn.innerHTML = `กำลังส่ง...`;

        const file = document.getElementById('imageFile').files[0];
        const formData = {
            date: document.getElementById('date').value,
            branch: document.getElementById('branch').value,
            staffName: document.getElementById('staffName').value,
            customerName: document.getElementById('customerName').value,
            customerPhone: document.getElementById('customerPhone').value,
            loanType: document.getElementById('loanType').value,
            result: document.getElementById('result').value,
            reason: document.getElementById('reason').value || "ไม่ผ่าน"
        };

        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                formData.imageFile = e.target.result;
                formData.imageName = file.name;
                formData.imageType = file.type;
                sendData(formData);
            };
            reader.readAsDataURL(file);
        } else {
            sendData(formData);
        }
    };

    function sendData(data) {
        fetch(WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify(data)
        })
        .then(res => res.json())
        .then(res => {
            document.getElementById('loading').style.display = "none";
            if(res.result === "success") {
                showPopup("บันทึกข้อมูลสำเร็จ", true);
                setTimeout(() => location.reload(), 1500);
            } else {
                throw new Error(res.error);
            }
        })
        .catch(err => {
            document.getElementById('loading').style.display = "none";
            showPopup("ผิดพลาด: " + err.message, false);
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('submitBtn').innerHTML = `<i class="bi bi-floppy"></i> บันทึกข้อมูล`;
        });
    }

    function showPopup(text, isSuccess) {
        const popup = document.getElementById("popup");
        document.getElementById("popupText").innerText = text;
        popup.classList.remove("success", "error");
        popup.classList.add(isSuccess ? "success" : "error");
        popup.classList.add("show");
        document.getElementById("popupOkBtn").focus();
    }

    function closePopup() { document.getElementById("popup").classList.remove("show"); }
    
    window.onload = () => {
        loadButtonPosition();
    };
</script>
</body>
</html>
