<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เว็บลงยอด Retention - Parakit-Site</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { 
            --ios-blue: #007aff; 
            --ios-bg: #f2f2f7; 
            --glass: rgba(255, 255, 255, 0.7); 
            --sidebar-dark: rgba(28, 28, 30, 0.96); 
        }
        
        body { font-family: 'Kanit', sans-serif; background-color: var(--ios-bg); min-height: 100vh; background-image: radial-gradient(at 0% 0%, rgba(0,122,255,0.05) 0px, transparent 50%); }
        
        .glass-card { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 24px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-motion:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.85); box-shadow: 0 20px 40px rgba(0,0,0,0.05); }
        
        /* ตกแต่ง Select ให้เหมือน Dropdown iOS */
        .ios-input { 
            width: 100%; padding: 12px 16px; border-radius: 14px; border: 1px solid rgba(0,0,0,0.08); 
            background: white; outline: none; transition: 0.2s; cursor: pointer;
            appearance: none; -webkit-appearance: none;
        }
        .ios-input:focus { border-color: var(--ios-blue); box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1); }
        
        .select-wrapper { position: relative; width: 100%; }
        .select-wrapper::after { 
            content: "\F282"; font-family: "bootstrap-icons"; position: absolute; 
            right: 15px; top: 50%; transform: translateY(-50%); 
            pointer-events: none; color: #8e8e93; font-size: 14px; 
        }

        .btn-primary { background: var(--ios-blue); color: white; border-radius: 16px; transition: all 0.2s; }
        .btn-primary:active { transform: scale(0.96); }
        
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center; animation: fadeIn 0.3s ease; }
        .modal-active { display: flex; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.1); border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.2); }

        #floatingMenuBtn {
            position: fixed; top: 10px; left: 15px; width: 45px; height: 45px;
            background: var(--ios-blue); color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; cursor: move; z-index: 2100;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4); border: none;
            touch-action: none; transition: transform 0.2s, opacity 0.2s;
        }
        .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.2); z-index: 2000; display: none; opacity: 0; transition: opacity 0.3s; }
        .sidebar-overlay.active { display: block; opacity: 1; }
        .sidebar-float {
            position: fixed; width: 280px; max-height: 70vh; background: var(--sidebar-dark); border-radius: 20px;
            overflow-y: auto; z-index: 2001; opacity: 0; visibility: hidden;
            transform: scale(0.8) translateY(10px); transition: opacity 0.3s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar-float.active { opacity: 1; visibility: visible; transform: scale(1) translateY(0); }
        .sidebar-float .sidebar-header { padding: 20px; font-size: 17px; font-weight: 600; color: #fff; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
        .sidebar-float .menu { padding: 8px 0; }
        .sidebar-float .menu a, .sidebar-float .drop-btn { 
            width: 100%; padding: 12px 20px; background: none; border: none; 
            color: #ebebf5; text-align: left; font-size: 14px; cursor: pointer; 
            display: flex; align-items: center; text-decoration: none; transition: 0.2s;
        }
        .sidebar-float .menu a:hover, .sidebar-float .drop-btn:hover { background: rgba(255,255,255,0.1); }
        .sidebar-float .sub { display: none; background: rgba(0,0,0,0.2); }
        .sidebar-float .item.open .sub { display: block; }
        .sidebar-float .sub a { padding-left: 45px; font-size: 13px; color: #8e8e93; }
        .sidebar-float::-webkit-scrollbar { width: 4px; }
        .sidebar-float::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    </style>
</head>
<body class="p-6">

<button id="floatingMenuBtn" title="ลากเพื่อย้าย">เมนู</button>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebarFloat()"></div>
<aside class="sidebar-float" id="sidebarFloat"></aside>

<div class="max-w-4xl mx-auto mt-4">
    <div class="flex items-center gap-5 mb-10">
        <div class="w-16 h-16 bg-white shadow-sm rounded-2xl flex items-center justify-center text-blue-600 text-3xl shadow-lg">
            <i class="bi bi-shield-check"></i>
        </div>
        <div>
            <h1 class="text-3xl font-bold text-slate-800 tracking-tight">เว็บลงยอด Rention</h1>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <button onclick="openModal('saveModal')" class="glass-card card-motion p-10 flex flex-col items-center justify-center gap-5 group">
            <div class="w-20 h-20 bg-blue-50 text-blue-600 rounded-3xl flex items-center justify-center text-4xl group-hover:scale-110 transition-transform shadow-sm">
                <i class="bi bi-plus-lg"></i>
            </div>
            <span class="text-xl font-bold text-slate-700">ลงยอด Retention</span>
        </button>

        <button onclick="openModal('pullModal')" class="glass-card card-motion p-10 flex flex-col items-center justify-center gap-5 group">
            <div class="w-20 h-20 bg-green-50 text-green-600 rounded-3xl flex items-center justify-center text-4xl group-hover:scale-110 transition-transform shadow-sm">
                <i class="bi bi-file-earmark-bar-graph"></i>
            </div>
            <span class="text-xl font-bold text-slate-700">ดึงยอด Retention</span>
        </button>
    </div>
</div>

<div id="saveModal" class="modal-overlay">
    <div class="glass-card w-full max-w-lg p-8 mx-4 shadow-2xl bg-white/90">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-bold text-slate-800">บันทึกยอด Retention</h2>
            <button onclick="closeModal('saveModal')" class="text-slate-400 hover:text-red-500 transition-colors text-2xl"><i class="bi bi-x-circle-fill"></i></button>
        </div>
        <div class="space-y-5">
            <div class="grid grid-cols-2 gap-4">
                <div><label class="text-xs font-bold text-slate-400 ml-1">วันที่</label><input type="date" id="saveDate" class="ios-input mt-1"></div>
                <div>
                    <label class="text-xs font-bold text-slate-400 ml-1 uppercase">รหัสพนักงาน</label>
                    <input type="number" id="staffId" class="ios-input mt-1" placeholder="กรอกรหัสพนักงาน" 
                        oninput="if(this.value.length > 8) this.value = this.value.slice(0, 8);"
                        onkeydown="if(event.key==='e' || event.key==='E' || event.key==='.' || event.key==='-') event.preventDefault();">
                </div>
            </div>
            <div>
                <label class="text-xs font-bold text-slate-400 ml-1 uppercase">สาขา</label>
                <div class="select-wrapper">
                    <select id="saveBranch" class="ios-input mt-1">
                        <option value="" disabled selected>กรุณาเลือกสาขา...</option>
                    </select>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-4 border-t border-slate-200 pt-4 mt-2">
                <div><label class="text-xs font-bold text-blue-500 ml-1">Save TOL</label><input type="number" id="sTOL" class="ios-input mt-1" value="0" onclick="this.select()"></div>
                <div><label class="text-xs font-bold text-red-500 ml-1">Cancel TOL</label><input type="number" id="cTOL" class="ios-input mt-1" value="0" onclick="this.select()"></div>
                <div><label class="text-xs font-bold text-orange-500 ml-1">Save TMH</label><input type="number" id="sTMH" class="ios-input mt-1" value="0" onclick="this.select()"></div>
                <div><label class="text-xs font-bold text-red-500 ml-1">Cancel TMH</label><input type="number" id="cTMH" class="ios-input mt-1" value="0" onclick="this.select()"></div>
            </div>
            <button onclick="saveData()" class="w-full btn-primary py-4 font-bold text-lg mt-6 shadow-blue-200 shadow-lg flex justify-center items-center gap-2">
                <i class="bi bi-save"></i> บันทึกข้อมูล
            </button>
        </div>
    </div>
</div>

<div id="pullModal" class="modal-overlay">
    <div class="glass-card w-full max-w-md p-8 mx-4 shadow-2xl bg-white/90">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-2xl font-bold text-slate-800">ดึงข้อมูลการ SAVE ของสาขา</h2>
            <button onclick="closeModal('pullModal')" class="text-slate-400 hover:text-red-500 transition-colors text-2xl"><i class="bi bi-x-circle-fill"></i></button>
        </div>
        <div class="space-y-5">
            <div><label class="text-xs font-bold text-slate-400 ml-1 uppercase">วันที่</label><input type="date" id="pullDate" class="ios-input mt-1"></div>
            <div>
                <label class="text-xs font-bold text-slate-400 ml-1 uppercase">สาขา</label>
                <div class="select-wrapper">
                    <select id="pullBranch" class="ios-input mt-1">
                        <option value="" disabled selected>กรุณาเลือกสาขา...</option>
                        <option value="All Shop">All Shop</option>
                    </select>
                </div>
            </div>
            <div><label class="text-xs font-bold text-slate-400 ml-1 uppercase">ช่วงเวลา</label>
                <div class="select-wrapper">
                    <select id="pullTime" class="ios-input mt-1 cursor-pointer">
                        <option value="14.00">14.00 (0.00 - 14.00)</option>
                        <option value="16.00">16.00 (14.01 - 16.00)</option>
                        <option value="20.00">20.00 (16.01 - 23.59)</option>
                        <option value="รวมทั้งหมด">รวมทั้งหมด</option>
                    </select>
                </div>
            </div>
            <button onclick="pullData()" class="w-full btn-primary py-4 font-bold text-lg mt-6 shadow-lg bg-emerald-500 flex justify-center items-center gap-2">
                <i class="bi bi-cloud-arrow-down"></i> เรียกดูข้อมูล
            </button>
        </div>
    </div>
</div>

<div id="reportModal" class="modal-overlay">
    <div class="glass-card w-full max-w-2xl p-8 mx-4 max-h-[90vh] overflow-y-auto custom-scroll shadow-2xl bg-white">
        <div class="flex justify-between items-start mb-6 border-b border-slate-100 pb-5">
            <div>
                <h2 class="text-2xl font-bold text-slate-800" id="resBranch">-</h2>
                <div class="flex items-center gap-3 mt-2 text-slate-500 text-sm font-medium">
                    <span id="resDate"><i class="bi bi-calendar3 mr-1"></i> -</span>
                    <span class="text-slate-300">|</span>
                    <span id="resTime"><i class="bi bi-clock mr-1"></i> เวลา: -</span>
                </div>
            </div>
            <button onclick="closeModal('reportModal')" class="text-slate-400 hover:text-red-500 transition-colors text-2xl"><i class="bi bi-x-circle-fill"></i></button>
        </div>
        
        <div id="resContent" class="space-y-4"></div>
        
        <div class="grid grid-cols-2 gap-6 mt-8 pt-6 border-t border-dashed border-slate-300">
            <div class="space-y-3">
                <p class="text-center font-bold text-slate-400 text-xs tracking-widest uppercase">สรุปยอด TOL</p>
                <div class="bg-blue-50/50 p-4 rounded-2xl text-center border border-blue-100">
                    <p class="text-[10px] text-blue-500 font-bold uppercase mb-1">Total Save TOL</p>
                    <p id="sumSTOL" class="text-3xl font-black text-blue-600">0</p>
                </div>
                <div class="bg-red-50/50 p-4 rounded-2xl text-center border border-red-100">
                    <p class="text-[10px] text-red-500 font-bold uppercase mb-1">Total Cancel TOL</p>
                    <p id="sumCTOL" class="text-3xl font-black text-red-600">0</p>
                </div>
            </div>
            <div class="space-y-3">
                <p class="text-center font-bold text-slate-400 text-xs tracking-widest uppercase">สรุปยอด TMH</p>
                <div class="bg-blue-50/50 p-4 rounded-2xl text-center border border-blue-100">
                    <p class="text-[10px] text-blue-500 font-bold uppercase mb-1">Total Save TMH</p>
                    <p id="sumSTMH" class="text-3xl font-black text-blue-600">0</p>
                </div>
                <div class="bg-red-50/50 p-4 rounded-2xl text-center border border-red-100">
                    <p class="text-[10px] text-red-500 font-bold uppercase mb-1">Total Cancel TMH</p>
                    <p id="sumCTMH" class="text-3xl font-black text-red-600">0</p>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mt-6">
            <button onclick="calculateSavePercent()" class="p-4 bg-slate-800 text-white rounded-2xl font-bold hover:bg-black transition-all flex items-center justify-center gap-2">
                <i class="bi bi-percent"></i> คำนวณ %Save
            </button>
            <button onclick="calculateRequiredSave()" class="p-4 bg-indigo-600 text-white rounded-2xl font-bold hover:bg-indigo-700 transition-all flex items-center justify-center gap-2">
                <i class="bi bi-calculator"></i> คำนวณการเพิ่ม %Save
            </button>
        </div>
    </div>
</div>

<script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbzhdGW3QQgMbW8195YveJu_le3LW3uephdRUXZkqC2bd9lpF5uQqc4VoxuD3gp-KPXs2A/exec';
    
    let totals = { sTOL: 0, cTOL: 0, sTMH: 0, cTMH: 0 };

    const branches = [
        "80000397 TS BC Pracha Uthit", "80000264 TS LT Rama 2", "80000022 TS BC Rama 2",
        "80000530 TS LT Bang Yai", "80000215 TS JC Wanghin", "80000251 TS LT Rama 3",
        "80000538 TS Robinson Samutprakan", "80000023 TS BC Bangplee", "80000263 TS LT Bangpoo",
        "80000087 TS LT Srinakarin", "80002441 TS Lotus Bangkruai Sainoi", "80000284 TS BC Sapankhwai",
        "80000086 TS LT Bangkapi", "80000207 TS LT Prachachuen", "80002390 TS Terminal 21 Rama 3"
    ];

    window.onload = () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('saveDate').value = today;
        document.getElementById('pullDate').value = today;
        
        const saveSelect = document.getElementById('saveBranch');
        branches.forEach(b => {
            let opt = document.createElement('option');
            opt.value = b; opt.textContent = b;
            saveSelect.appendChild(opt);
        });

        const pullSelect = document.getElementById('pullBranch');
        branches.forEach(b => {
            let opt = document.createElement('option');
            opt.value = b; opt.textContent = b;
            pullSelect.appendChild(opt);
        });

        document.getElementById('saveModal').addEventListener('keypress', (e) => { if (e.key === 'Enter') saveData(); });
        document.getElementById('pullModal').addEventListener('keypress', (e) => { if (e.key === 'Enter') pullData(); });
        loadButtonPosition();
    };

    function openModal(id) { document.getElementById(id).classList.add('modal-active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('modal-active'); }

    async function saveData() {
        const branchVal = document.getElementById('saveBranch').value;
        if(!branchVal) return Swal.fire('ข้อมูลไม่ครบ', 'กรุณาเลือกสาขา', 'warning');

        const data = {
            date: document.getElementById('saveDate').value,
            branch: branchVal,
            staffId: document.getElementById('staffId').value,
            saveTol: document.getElementById('sTOL').value,
            cancelTol: document.getElementById('cTOL').value,
            saveTmh: document.getElementById('sTMH').value,
            cancelTmh: document.getElementById('cTMH').value
        };
        if(data.staffId.length !== 8) return Swal.fire('ผิดพลาด', 'รหัสพนักงานต้องมี 8 หลัก', 'error');
        Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        try {
            await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'save', data: data }), mode: 'no-cors' });
            setTimeout(() => {
                Swal.fire('สำเร็จ', 'บันทึกยอด Retention เรียบร้อยแล้ว', 'success');
                closeModal('saveModal');
                document.getElementById('staffId').value = '';
                document.getElementById('sTOL').value = '0'; document.getElementById('cTOL').value = '0';
                document.getElementById('sTMH').value = '0'; document.getElementById('cTMH').value = '0';
                document.getElementById('saveBranch').value = '';
            }, 1000);
        } catch(e) { Swal.fire('Error', 'การเชื่อมต่อผิดพลาด', 'error'); }
    }

    async function pullData() {
        const branchVal = document.getElementById('pullBranch').value;
        if(!branchVal) return Swal.fire('ข้อมูลไม่ครบ', 'กรุณาเลือกสาขาที่ต้องการดึงข้อมูล', 'warning');

        const filter = {
            date: document.getElementById('pullDate').value,
            branch: branchVal,
            time: document.getElementById('pullTime').value
        };
        Swal.fire({ title: 'กำลังดึงข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        try {
            const res = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'pull', data: filter }) });
            const result = await res.json();
            Swal.close();
            if(result.status === 'not_found' || !result.list || result.list.length === 0) {
                return Swal.fire('ไม่พบข้อมูล', 'ไม่พบข้อมูลในช่วงเวลาดังกล่าว', 'info');
            }

            const displayList = result.list;
            totals = displayList.reduce((acc, item) => {
                acc.sTOL += item.sTOL; acc.cTOL += item.cTOL;
                acc.sTMH += item.sTMH; acc.cTMH += item.cTMH;
                return acc;
            }, { sTOL: 0, cTOL: 0, sTMH: 0, cTMH: 0 });

            document.getElementById('resBranch').innerText = result.branch;
            document.getElementById('resDate').innerHTML = `<i class="bi bi-calendar3 mr-1"></i> วันที่: ${result.date}`;
            document.getElementById('resTime').innerHTML = `<i class="bi bi-clock mr-1"></i> เวลา: ${result.timeLabel}`;
            
            document.getElementById('sumSTOL').innerText = totals.sTOL;
            document.getElementById('sumCTOL').innerText = totals.cTOL;
            document.getElementById('sumSTMH').innerText = totals.sTMH;
            document.getElementById('sumCTMH').innerText = totals.cTMH;

            let html = '';
            displayList.forEach(item => {
                const labelName = item.isBranchGroup ? "สาขา" : "ID";
                const iconClass = item.isBranchGroup ? "bi bi-shop" : "bi bi-person-badge";
                html += `
                <div class="p-5 bg-slate-50/80 rounded-2xl border border-slate-100 flex flex-col sm:flex-row justify-between gap-4 transition hover:bg-white hover:shadow-md">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center shadow-sm text-blue-500"><i class="${iconClass}"></i></div>
                        <span class="font-bold text-slate-700 tracking-wide">${labelName}: ${item.staffId}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-x-8 gap-y-2 text-sm font-medium">
                        <div class="flex justify-between gap-6"><span>Save TOL :</span> <span class="text-blue-600 font-bold">${item.sTOL}</span></div>
                        <div class="flex justify-between gap-6"><span>Cancel TOL :</span> <span class="text-red-500 font-bold">${item.cTOL}</span></div>
                        <div class="flex justify-between gap-6"><span>Save TMH :</span> <span class="text-blue-600 font-bold">${item.sTMH}</span></div>
                        <div class="flex justify-between gap-6"><span>Cancel TMH :</span> <span class="text-red-500 font-bold">${item.cTMH}</span></div>
                    </div>
                </div>`;
            });
            document.getElementById('resContent').innerHTML = html;
            closeModal('pullModal');
            openModal('reportModal');
        } catch(e) { Swal.fire('Error', 'ดึงข้อมูลไม่สำเร็จ', 'error'); }
    }

    function calculateSavePercent() {
        const tolTotal = totals.sTOL + totals.cTOL;
        const tmhTotal = totals.sTMH + totals.cTMH;
        const tolPercent = tolTotal > 0 ? ((totals.sTOL / tolTotal) * 100).toFixed(2) : "0.00";
        const tmhPercent = tmhTotal > 0 ? ((totals.sTMH / tmhTotal) * 100).toFixed(2) : "0.00";
        Swal.fire({
            title: 'ผลลัพธ์คำนวณ %Save',
            html: `<div class="space-y-6 mt-4">
                <div class="p-4 bg-blue-50 rounded-2xl border border-blue-100">
                    <p class="text-xs font-bold text-blue-500 uppercase mb-2">TOL Retention</p>
                    <div class="text-4xl font-black text-blue-600">${tolPercent}%</div>
                </div>
                <div class="p-4 bg-indigo-50 rounded-2xl border border-indigo-100">
                    <p class="text-xs font-bold text-indigo-500 uppercase mb-2">TMH Retention</p>
                    <div class="text-4xl font-black text-indigo-600">${tmhPercent}%</div>
                </div>
            </div>`,
            confirmButtonText: 'รับทราบ', confirmButtonColor: '#007aff'
        });
    }

    function calculateRequiredSave() {
        const tolReq = Math.max(0, (totals.cTOL * 7.51) - totals.sTOL).toFixed(2);
        const tmhReq = Math.max(0, (totals.cTMH * 7.51) - totals.sTMH).toFixed(2);
        Swal.fire({
            title: 'สรุปยอดที่ต้อง SAVE เพิ่ม',
            html: `<div class="space-y-6 mt-4">
                <div class="p-4 bg-emerald-50 rounded-2xl border border-emerald-100 text-center">
                    <p class="text-xs font-bold text-emerald-600 uppercase mb-2">ยอดที่ต้องเพิ่ม (TOL)</p>
                    <div class="text-4xl font-black text-emerald-700">${tolReq}</div>
                </div>
                <div class="p-4 bg-teal-50 rounded-2xl border border-teal-100 text-center">
                    <p class="text-xs font-bold text-teal-600 uppercase mb-2">ยอดที่ต้องเพิ่ม (TMH)</p>
                    <div class="text-4xl font-black text-teal-700">${tmhReq}</div>
                </div>
            </div>`,
            confirmButtonText: 'ตกลง', confirmButtonColor: '#007aff'
        });
    }

    // ===== JAVASCRIPT ระบบเมนูและปุ่มลาก =====
    const dragBtn = document.getElementById('floatingMenuBtn');
    const sideFloat = document.getElementById('sidebarFloat');
    const sideOverlay = document.getElementById('sidebarOverlay');
    let isDragging = false;
    let startX, startY, shiftX, shiftY;

    function loadButtonPosition() {
        const savedLeft = localStorage.getItem('floatBtnLeft');
        const savedTop = localStorage.getItem('floatBtnTop');
        if (savedLeft && savedTop) { dragBtn.style.left = savedLeft + 'px'; dragBtn.style.top = savedTop + 'px'; }
    }

    dragBtn.onpointerdown = function(e) {
        isDragging = false; startX = e.clientX; startY = e.clientY;
        const rect = dragBtn.getBoundingClientRect();
        shiftX = e.clientX - rect.left; shiftY = e.clientY - rect.top;
        dragBtn.setPointerCapture(e.pointerId);
        document.addEventListener('pointermove', onPointerMove);
        document.addEventListener('pointerup', onPointerUp);
    };

    function onPointerMove(e) {
        if (!isDragging && (Math.abs(e.clientX - startX) > 5 || Math.abs(e.clientY - startY) > 5)) isDragging = true;
        if (isDragging) {
            let newX = e.clientX - shiftX, newY = e.clientY - shiftY;
            newX = Math.max(0, Math.min(newX, window.innerWidth - dragBtn.offsetWidth));
            newY = Math.max(0, Math.min(newY, window.innerHeight - dragBtn.offsetHeight));
            dragBtn.style.left = newX + 'px'; dragBtn.style.top = newY + 'px';
        }
    }

    function onPointerUp(e) {
        document.removeEventListener('pointermove', onPointerMove);
        document.removeEventListener('pointerup', onPointerUp);
        dragBtn.releasePointerCapture(e.pointerId);
        if (isDragging) {
            localStorage.setItem('floatBtnLeft', dragBtn.offsetLeft);
            localStorage.setItem('floatBtnTop', dragBtn.offsetTop);
        } else toggleSidebarFloat();
        isDragging = false;
    }

    function toggleSidebarFloat() {
        const btnRect = dragBtn.getBoundingClientRect();
        const sidebarWidth = 280;
        let top = btnRect.bottom + 10, left = btnRect.left;
        if (left + sidebarWidth > window.innerWidth) left = window.innerWidth - sidebarWidth - 15;
        if (top + 400 > window.innerHeight) { top = btnRect.top - 410; if (top < 10) top = 10; }
        sideFloat.style.top = top + 'px'; sideFloat.style.left = left + 'px';
        sideFloat.style.transformOrigin = `${btnRect.left - left + 20}px ${btnRect.top > top ? 'bottom' : 'top'}`;
        const isActive = sideFloat.classList.toggle('active');
        sideOverlay.classList.toggle('active', isActive);
        if (isActive && !sideFloat.innerHTML) loadSidebarContent();
    }

    function closeSidebarFloat() { sideFloat.classList.remove('active'); sideOverlay.classList.remove('active'); }

    // ฟังก์ชันโหลดเมนู Sidebar และกาง Dropdown ตามที่เคยจำไว้
    function loadSidebarContent() { 
        fetch('sidebar.html').then(res => res.text()).then(data => { 
            sideFloat.innerHTML = `<div class="sidebar-header">เมนูนำทาง</div>` + data; 
            
            // ตรวจสอบสถานะการกางจาก localStorage
            const items = sideFloat.querySelectorAll('.item');
            items.forEach(item => {
                const btn = item.querySelector('.drop-btn');
                if (btn) {
                    const match = btn.getAttribute('onclick').match(/'([^']+)'/);
                    if (match) {
                        const menuId = match[1];
                        if (localStorage.getItem('sidebar-menu-' + menuId) === 'true') {
                            item.classList.add('open');
                        }
                    }
                }
            });
        }); 
    }

    // ฟังก์ชันคลิก Dropdown และบันทึกสถานะ
    window.toggleDrop = function(btn, id) { 
        const item = btn.parentElement; 
        const isOpen = item.classList.toggle("open"); 
        if (id) localStorage.setItem('sidebar-menu-' + id, isOpen); 
    }
</script>
</body>
</html>
