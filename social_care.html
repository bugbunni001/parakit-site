<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Care+ - Parakit-site</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ios-blue: #007aff;
            --ios-bg: #f2f2f7;
            --glass-white: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-main: #1c1c1e;
            --text-light: #8e8e93;
            --transition-swift: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* ===== GLOBAL RESET ===== */
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif !important; }
        
        body { 
            margin: 0; 
            background-color: var(--ios-bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 122, 255, 0.08) 0px, transparent 40%), 
                radial-gradient(at 100% 100%, rgba(255, 45, 85, 0.06) 0px, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main); 
            -webkit-font-smoothing: antialiased;
            padding-bottom: 60px;
            overflow-x: hidden;
        }

        .content { 
            padding: 40px 20px; /* ปรับ Padding ด้านบนเนื่องจากไม่มี Header */
            max-width: 1300px; 
            margin: 0 auto; 
            animation: fadeIn 0.8s ease-out; 
        }

        /* ===== Social Care+ Page Styles ===== */
        .info-card { 
            max-width: 850px; 
            margin: 0 auto; 
            background: var(--glass-white); 
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            padding: 25px; 
            border-radius: 35px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.06);
            border: 1px solid var(--glass-border);
        }

        .page-title {
            text-align: center;
            font-weight: 700;
            font-size: 1.75rem;
            color: var(--text-main);
            letter-spacing: -0.8px;
            margin-bottom: 25px;
        }

        .btn-container { text-align: center; margin-bottom: 35px; }
        .btn-guide {
            display: inline-flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #007aff 0%, #0051ff 100%);
            color: white; text-decoration: none; padding: 16px 32px;
            border-radius: 20px; font-weight: 500; gap: 10px;
            transition: var(--transition-bounce);
            box-shadow: 0 10px 25px rgba(0, 122, 255, 0.3);
        }
        .btn-guide:hover { transform: translateY(-5px) scale(1.03); }
        
        .responsive-img {
            max-width: 100%; height: auto; display: block;
            margin: 25px auto; border-radius: 24px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        }

        footer { text-align: center; padding: 60px 20px 40px; color: var(--text-light); font-size: 12px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            .info-card { padding: 20px; border-radius: 20px; }
            .page-title { font-size: 1.5rem; }
        }
    </style>
</head>

<body>

<div class="content">
    <div class="page-title">Social Care+</div>

    <div class="info-card">
        <div class="btn-container">
            <a class="btn-guide" href="https://static.vrcomseven.com/20260115/103822-%E0%B8%84%E0%B8%B9%E0%B9%88%E0%B8%A1%E0%B8%B7%E0%B8%AD%E0%B8%81%E0%B8%B2%E0%B8%A3%E0%B8%95%E0%B8%B1%E0%B8%94%E0%B8%AA%E0%B8%B4%E0%B8%99%E0%B8%84%E0%B9%89%E0%B8%B2-Social-Care+-KJ9d.pdf" target="_blank">
                📄 คลิ๊กเพื่อดู คู่มือการตัดขายผ่าน LS
            </a>
        </div>
        
        <img src="https://i.postimg.cc/nLD3JJCz/616575334-25491448347178839-7451669251559590402-n.jpg" class="responsive-img">
        <img src="https://i.postimg.cc/38hRm4XK/CONTENT-SOCIAL-CARE-Jan-2026.jpg" class="responsive-img">
        <img src="https://i.postimg.cc/GrrKhw0g/615758705-25491448370512170-2748739875965096788-n.jpg" class="responsive-img">
        <img src="https://i.postimg.cc/Wj2mcGrQ/615429251-25491448410512166-7247742471364854088-n.jpg" class="responsive-img">
        <img src="https://i.postimg.cc/XnydkQ6M/615556222-25491448413845499-6146352792300419636-n.jpg" class="responsive-img">
    </div>

    <footer>© 2026 Copy Right By Angerina Frog</footer>
</div>

</body>
</html>
