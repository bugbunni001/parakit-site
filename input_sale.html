<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลงยอดขาย - Parakit-site</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --ios-blue: #007aff;
            --ios-bg: #f2f2f7;
            --ios-system-gray: #f2f2f7;
            --glass-white: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.5);
            --sidebar-dark: rgba(28, 28, 30, 0.94);
            --text-main: #1c1c1e;
            --text-light: #8e8e93;
            --sidebar-width: 280px;
            --transition-swift: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            --card-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.08);
            --success-green: #34c759;
            --error-red: #ff3b30;
        }

        /* ===== GLOBAL RESET ===== */
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif !important; }
        
        body { 
            margin: 0; 
            background-color: var(--ios-bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 122, 255, 0.08) 0px, transparent 40%), 
                radial-gradient(at 100% 100%, rgba(255, 45, 85, 0.06) 0px, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main); 
            -webkit-font-smoothing: antialiased;
            padding-bottom: 80px;
            transition: padding-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-x: hidden;
        }

        /* ===== Header & Sidebar System (iOS Style) ===== */
        .top-header {
            position: fixed; top: 0; left: 0; right: 0; height: 60px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            z-index: 1200; display: flex; align-items: center; padding: 0 20px;
            border-bottom: 0.5px solid rgba(0,0,0,0.1);
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .top-toggle {
            width: 36px; height: 36px; border-radius: 10px; border: none;
            background: transparent; color: var(--ios-blue); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; transition: background 0.2s; margin-right: 15px;
        }
        .top-toggle:hover { background: rgba(0, 122, 255, 0.1); }

        .sidebar { 
            position: fixed; top: 0; left: 0; width: var(--sidebar-width); height: 100vh; 
            background: var(--sidebar-dark); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            color: #fff; overflow-y: auto; transition: all .3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2000; box-shadow: 10px 0 30px rgba(0,0,0,0.1);
        }

        @media(min-width:769px) { 
            body:not(.collapsed) { padding-left: var(--sidebar-width); }
            body:not(.collapsed) .top-header { left: var(--sidebar-width); }
            body.collapsed .sidebar { transform: translateX(-100%); }
            body.collapsed .top-header { left: 0; }
        }

        @media(max-width:768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.show { transform: translateX(0); }
            body { padding-left: 0 !important; }
            .top-header { left: 0 !important; }
        }

        .overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(4px); display: none; z-index: 1500; }
        .overlay.show { display: block; }

        /* ===== Main Content Area ===== */
        .content { padding: 90px 20px 40px; display: flex; flex-direction: column; align-items: center; animation: fadeIn 0.8s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .box { background: var(--glass-white); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); width: 100%; max-width: 500px; padding: 30px; border-radius: 24px; border: 1px solid var(--glass-border); box-shadow: var(--card-shadow); margin-bottom: 30px;}
        h3 { margin-top: 0; margin-bottom: 25px; color: var(--text-main); text-align: center; font-weight: 600; }
        
        .form-row { margin-bottom: 18px; }
        .form-row-multi { display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-light); font-weight: 500; padding-left: 4px; }
        
        input, select { 
            width: 100%; padding: 12px 16px; border: 1px solid rgba(0,0,0,0.05); border-radius: 12px; 
            font-size: 16px; background: rgba(0,0,0,0.03); color: var(--text-main); outline: none; transition: 0.2s;
        }
        input:focus, select:focus { background: #fff; border-color: var(--ios-blue); }

        .btn-submit { 
            width: 100%; padding: 16px; border: none; border-radius: 16px; background: var(--ios-blue); 
            color: white; font-size: 17px; font-weight: 600; cursor: pointer; display: flex; 
            align-items: center; justify-content: center; gap: 10px; transition: var(--transition-swift);
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,122,255,0.3); opacity: 0.9; }

        /* ===== Floating Button ===== */
        .floating-btn {
            position: fixed; top: 50%; right: 0px; z-index: 1400;
            background: var(--ios-blue); color: white; border: none;
            padding: 15px 20px; border-radius: 15px 0 0 15px; font-size: 15px; font-weight: 600;
            box-shadow: -4px 0 15px rgba(0, 122, 255, 0.3); cursor: pointer;
            display: flex; align-items: center; gap: 10px; transition: all 0.3s ease;
            transform: translateY(-50%);
        }
        .floating-btn:hover { background: #0056b3; padding-right: 30px; }

        /* ===== Table Modal & Popups (SVG Identical) ===== */
        .modal-table { 
            position: fixed; inset: 0; background: rgba(0,0,0,0.4); 
            display: none; align-items: center; justify-content: center; 
            z-index: 5000; backdrop-filter: blur(10px); padding: 20px;
        }
        .modal-table.show { display: flex; }
        .modal-content { 
            background: #fff; width: 100%; max-width: 1100px; max-height: 90vh;
            border-radius: 30px; position: relative; overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2); animation: pop 0.4s ease;
            display: flex; flex-direction: column;
        }
        .modal-header { padding: 25px 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--ios-system-gray); }
        .close-modal { background: var(--ios-system-gray); border: none; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        
        .table-container { padding: 20px; overflow-x: auto; overflow-y: auto; flex-grow: 1; }
        .search-wrapper { position: relative; max-width: 300px; margin-bottom: 15px; }
        .search-wrapper svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-light); }
        #searchBox { padding-left: 40px; margin-bottom: 0; }

        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { text-align: left; padding: 15px 12px; border-bottom: 2px solid var(--ios-system-gray); font-size: 13px; color: var(--text-light); position: sticky; top: 0; background: white; }
        td { padding: 15px 12px; border-bottom: 1px solid var(--ios-system-gray); font-size: 14px; }
        .btn-del-row { background: var(--error-red); color: white; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; }

        .loading { position: fixed; inset: 0; background: rgba(255,255,255,0.7); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 6000; backdrop-filter: blur(10px); }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(0,122,255,0.1); border-top: 4px solid var(--ios-blue); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .popup { position: fixed; inset: 0; background: rgba(0,0,0,0.3); display: none; align-items: center; justify-content: center; z-index: 7000; backdrop-filter: blur(8px); }
        .popup.show { display: flex; }
        .popup-box { background: #fff; padding: 30px; border-radius: 28px; text-align: center; max-width: 380px; width: 90%; box-shadow: 0 20px 50px rgba(0,0,0,0.15); animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .popup-icon { margin-bottom: 15px; }
        #credit_row { display: none; }
        footer { width: 100%; text-align: center; padding: 20px; color: var(--text-light); font-size: 10px; position: relative; margin-top: 20px; }
    </style>
</head>

<body>

<header class="top-header">
    <button class="top-toggle" onclick="toggleSidebar()">☰</button>
    <div style="font-weight: 700; font-size: 1.25rem; color: var(--text-main); letter-spacing: -0.8px;">ลงยอดขาย</div>
</header>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
<aside class="sidebar" id="sidebar"></aside>

<div class="content">
    <div class="box">
        <h3>📊 บันทึกยอดขายรายวัน</h3>
        <div class="form-row"><label>วันที่ขาย</label><input type="date" id="date"></div>
        <div class="form-row">
            <label>ชื่อพนักงาน</label>
            <select id="staff">
                <option value="">-- เลือกพนักงาน --</option>
                <option value="ปิยะพร">ปิยะพร</option><option value="นวพล">นวพล</option><option value="กรทักษ์">กรทักษ์</option>
            </select>
        </div>
        <div class="form-row">
            <label>ชื่อคนขายให้</label>
            <select id="seller"><option value="">-- เลือก --</option><option value="โด้">โด้</option><option value="มิ้น">มิ้น</option><option value="ตั้ม">ตั้ม</option></select>
        </div>
        <div class="form-row-multi">
            <div style="flex: 1.5;">
                <label>รายการ Postpay</label>
                <select id="type">
                    <option value="">-- ประเภท --</option>
                    <option>New Sim Only</option><option>Mg Sim Only</option><option>New Rahu</option>
                    <option>New พลังดาว</option><option>New MyPlan</option><option>New/Mg Bundling</option>
                    <option>Mnp</option><option>BDBC</option>
                </select>
            </div>
            <div style="flex: 1;"><label>ระบุยอดเงิน</label><input type="number" id="amount" placeholder="0.00"></div>
        </div>
        <div class="form-row-multi">
            <div style="flex: 1.5;">
                <label>รายการ Device</label>
                <select id="device" onchange="checkDeviceCredit(this.value)">
                    <option value="">-- ยี่ห้อ --</option>
                    <option>iPhone</option><option>iPad</option><option>Samsung</option><option>Xiaomi</option>
                    <option>Realme</option><option>Oppo</option><option>Vivo</option><option>Honor</option>
                    <option>Infinix</option><option>Alldocube</option><option>Accessaries</option>
                </select>
            </div>
            <div style="flex: 1;"><label>ระบุยอดเงิน</label><input type="number" id="deviceAmount" placeholder="0.00"></div>
        </div>
        <div class="form-row" id="credit_row">
            <label>สินเชื่อที่เลือก</label>
            <input type="text" id="credit_field" readonly style="background: #fdfdfd; cursor: not-allowed; border: 1px dashed var(--ios-blue);">
        </div>
        <button type="button" class="btn-submit" onclick="submitData()">💾 บันทึกข้อมูล</button>
    </div>
</div>

<button class="floating-btn" onclick="openTableModal()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
    <span>ตรวจสอบรายการขาย</span>
</button>

<div class="modal-table" id="tableModal">
    <div class="modal-content">
        <div class="modal-header">
            <div style="display: flex; align-items: center; gap: 10px;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--ios-blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                <h3 style="margin:0; text-align:left; font-size: 18px;">รายการขายของวันนี้</h3>
            </div>
            <button class="close-modal" onclick="closeTableModal()">✕</button>
        </div>
        <div class="table-container">
            <div class="search-wrapper">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="searchBox" placeholder="ค้นหาในตาราง..." onkeyup="searchTable()">
            </div>
            <table>
                <thead>
                    <tr>
                        <th>วันที่</th><th>พนักงาน</th><th>คนขาย</th><th>Postpay</th><th>ยอด</th>
                        <th>Device</th><th>ยอด</th><th>เวลา</th><th>สินเชื่อ</th><th>ลบ</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="loading" id="loading"><div class="spinner"></div><p style="margin-top:15px; color:var(--ios-blue); font-weight:600;">กำลังประมวลผล...</p></div>

<div class="popup" id="alertPopup">
    <div class="popup-box">
        <div class="popup-icon">
            <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#ffcc00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        </div>
        <h3 id="alertMsg" style="font-size: 16px;"></h3>
        <button class="btn-submit" onclick="closePopup('alertPopup')">ตกลง</button>
    </div>
</div>

<div class="popup" id="confirmPopup">

        <div class="popup-icon">
            <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#ff3b30" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
        </div>
        <h3 style="font-size: 16px;">ยืนยันการลบข้อมูลนี้ใช่หรือไม่?</h3>
        <div style="display:flex; gap:10px;">
            <button class="btn-submit" style="background:#ff3b30" id="btnConfirmDel">ลบ</button>
            <button class="btn-submit" style="background:#8e8e93" onclick="closePopup('confirmPopup')">ยกเลิก</button>
        </div>
    </div>
</div>

<div class="popup" id="creditPopup">
    <div class="popup-box">
        <div class="popup-icon">
            <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#007aff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
        </div>
        <h3 style="font-size: 16px;">เครื่องนี้ซื้อพร้อมสินเชื่อหรือไม่?</h3>
        <div style="display:flex; gap:10px;">
            <button class="btn-submit" style="background:#34c759" onclick="handleCreditChoice(true)">ใช่</button>
            <button class="btn-submit" style="background:#ff3b30" onclick="handleCreditChoice(false)">ไม่ใช่</button>
        </div>
    </div>
</div>

<div class="popup" id="creditSelectPopup">
    <div class="popup-box">
        <h3 style="font-size: 16px; margin-bottom: 20px;">เลือกประเภทสินเชื่อ</h3>
        <div style="display: flex; flex-direction: column; gap: 10px;">
            <button class="btn-submit" style="background: #f2f2f7; color: var(--text-main); font-weight: 500;" onclick="selectCredit('SG Finance+')">SG Finance+</button>
            <button class="btn-submit" style="background: #f2f2f7; color: var(--text-main); font-weight: 500;" onclick="selectCredit('True Paynext Extra')">True Paynext Extra</button>
            <button class="btn-submit" style="background: #f2f2f7; color: var(--text-main); font-weight: 500;" onclick="selectCredit('Samsung Finance+')">Samsung Finance+</button>
            <button class="btn-submit" style="background: #f2f2f7; color: var(--text-main); font-weight: 500;" onclick="selectCredit('Umay+')">Umay+</button>
            <button class="btn-submit" style="background: #8e8e93;" onclick="closePopup('creditSelectPopup')">ยกเลิก</button>
        </div>
    </div>
</div>

<div class="popup" id="successPopup">
    <div class="popup-box">
        <div class="popup-icon">
            <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="#34c759" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        </div>
        <h3 style="font-size: 16px;">บันทึกข้อมูลเรียบร้อยแล้ว</h3>
        <button class="btn-submit" onclick="closePopup('successPopup')">ตกลง</button>
    </div>
</div>

<script>
// --- Sidebar System (iOS Dynamic Logic) ---
function includeSidebar() {
    const cached = localStorage.getItem('sidebar_cache');
    if (cached) {
        document.getElementById('sidebar').innerHTML = cached;
        restoreMenuState();
    }

    fetch('sidebar.html')
        .then(response => response.text())
        .then(data => {
            if (data !== cached) {
                document.getElementById('sidebar').innerHTML = data;
                localStorage.setItem('sidebar_cache', data);
                restoreMenuState();
            }
        })
        .catch(err => console.warn("Sidebar Load Error"));
        
    if(localStorage.getItem('sidebar_collapsed') === 'true' && window.innerWidth > 768) {
        document.body.classList.add('collapsed');
    }
}

function toggleSidebar() {
    if (window.innerWidth <= 768) {
        document.getElementById("sidebar").classList.toggle("show");
        document.getElementById("overlay").classList.toggle("show");
    } else {
        const isCollapsed = document.body.classList.toggle("collapsed");
        localStorage.setItem('sidebar_collapsed', isCollapsed);
    }
}

window.toggleDrop = function(btn, id) {
    const item = btn.parentElement;
    const isOpen = item.classList.toggle("open");
    if (id) localStorage.setItem('menu-' + id, isOpen);
}

function restoreMenuState() {
    ['credit', 'branch', 'sales'].forEach(id => {
        if (localStorage.getItem('menu-' + id) === 'true') {
            const el = document.getElementById('menu-' + id);
            if (el) el.classList.add('open');
        }
    });
}

// --- Main Form Logic (100% Unchanged) ---
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx3PVyayHIvzKr4iW4CSTICl3Vy9InNuQdjkYiq4Ke064DeOYOLXBYJGtkNwm0i6i2_eQ/exec";

function setThaiDate() {
    const now = new Date();
    const offset = 7 * 60; 
    const localTime = new Date(now.getTime() + (offset + now.getTimezoneOffset()) * 60000);
    document.getElementById("date").value = localTime.toISOString().split("T")[0];
}

window.onload = () => {
    includeSidebar();
    loadTableData();
    setThaiDate();
};

function openTableModal() {
    loadTableData(); 
    document.getElementById("tableModal").classList.add("show");
}
function closeTableModal() {
    document.getElementById("tableModal").classList.remove("show");
}

document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
        const activePopup = document.querySelector('.popup.show');
        if (activePopup) {
            if (activePopup.id === 'creditPopup' || activePopup.id === 'creditSelectPopup') return;
            if (activePopup.id === 'confirmPopup') {
                document.getElementById('btnConfirmDel').click();
            } else {
                const btn = activePopup.querySelector('.btn-submit');
                if (btn) btn.click();
            }
        } else {
            if (!document.getElementById("tableModal").classList.contains("show")) {
                submitData();
            }
        }
    }
});

function loadTableData() {
    fetch(SCRIPT_URL + "?action=read")
    .then(res => res.json())
    .then(data => {
        const tbody = document.getElementById("dataTableBody");
        tbody.innerHTML = "";
        if (data.length === 0) {
            tbody.innerHTML = "<tr><td colspan='10' style='text-align:center;'>ยังไม่มีข้อมูลวันนี้</td></tr>";
            return;
        }
        data.forEach(row => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${row.date}</td><td>${row.staff}</td><td>${row.seller}</td>
                <td>${row.type}</td><td>${row.amount}</td><td>${row.device}</td>
                <td>${row.deviceAmount}</td><td>${row.time}</td><td>${row.credit}</td>
                <td><button class="btn-del-row" onclick="confirmDelete(${row.rowNum})">ลบ</button></td>
            `;
            tbody.appendChild(tr);
        });
    });
}

function submitData() {
    const staff = document.getElementById("staff").value;
    const postpay = document.getElementById("type").value;
    const amount = document.getElementById("amount").value;
    const device = document.getElementById("device").value;
    const deviceAmount = document.getElementById("deviceAmount").value;

    if (!staff) { showAlert("กรุณาเลือกชื่อพนักงาน"); return; }
    if (!postpay && !device) { showAlert("กรุณาเลือก 'รายการ Postpay' หรือ 'รายการ Device' อย่างน้อยหนึ่งรายการก่อนบันทึก"); return; }
    if (postpay && !amount) { showAlert("กรุณาระบุยอดเงินของรายการ Postpay"); return; }
    if (device && !deviceAmount) { showAlert("กรุณาระบุยอดเงินของรายการ Device"); return; }

    document.getElementById("loading").style.display = "flex";
    const fd = new FormData();
    ["date","staff","seller","type","amount","device","deviceAmount","credit_field"].forEach(id => {
        fd.append(id === "credit_field" ? "credit" : id, document.getElementById(id).value);
    });

    fetch(SCRIPT_URL, { method: "POST", body: fd })
    .then(res => res.json())
    .then(res => {
        document.getElementById("loading").style.display = "none";
        if(res.result === "success") {
            document.getElementById("successPopup").classList.add("show");
            resetForm();
            loadTableData();
        }
    }).catch(() => { 
        document.getElementById("loading").style.display = "none";
        loadTableData();
    });
}

function confirmDelete(rowNum) {
    document.getElementById("confirmPopup").classList.add("show");
    document.getElementById("btnConfirmDel").onclick = () => {
        closePopup('confirmPopup');
        document.getElementById("loading").style.display = "flex";
        fetch(`${SCRIPT_URL}?action=delete&row=${rowNum}`, { method: "POST" })
        .then(() => {
            document.getElementById("loading").style.display = "none";
            loadTableData(); 
        });
    };
}

function searchTable() {
    const val = document.getElementById("searchBox").value.toLowerCase();
    const rows = document.querySelectorAll("#dataTableBody tr");
    rows.forEach(row => {
        row.style.display = row.innerText.toLowerCase().includes(val) ? "" : "none";
    });
}

function checkDeviceCredit(v) {
    if (v !== "" && v !== "Accessaries") {
        document.getElementById("creditPopup").classList.add("show");
    } else {
        document.getElementById("credit_row").style.display = "none";
        document.getElementById("credit_field").value = "";
    }
}

function handleCreditChoice(isC) {
    closePopup('creditPopup');
    if (isC) {
        document.getElementById("creditSelectPopup").classList.add("show");
    } else {
        document.getElementById("credit_row").style.display = "none";
        document.getElementById("credit_field").value = "";
    }
}

function selectCredit(creditName) {
    document.getElementById("credit_field").value = creditName;
    document.getElementById("credit_row").style.display = "block";
    closePopup('creditSelectPopup');
}

function showAlert(t) { document.getElementById("alertMsg").innerText = t; document.getElementById("alertPopup").classList.add("show"); }
function closePopup(id) { document.getElementById(id).classList.remove("show"); }

function resetForm() {
    ["amount","deviceAmount","staff","seller","type","device","credit_field"].forEach(id => document.getElementById(id).value = "");
    setThaiDate();
    document.getElementById("credit_row").style.display = "none";
}
</script>
