<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เช็คค่าคอมมิชชั่น | Commission Check</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --ios-blue: #007aff;
            --ios-bg: #f2f2f7;
            --glass-white: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.5);
            --sidebar-dark: rgba(28, 28, 30, 0.96);
            --text-main: #1c1c1e;
            --text-light: #8e8e93;
            --transition-swift: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * { box-sizing: border-box; font-family: 'Kanit', sans-serif !important; }
        body { margin: 0; background: #f8fafc; padding-bottom: 50px; color: #334155; overflow-x: hidden; }

        /* ระบบ Lock Page เดิม */
        .lock-page { position: fixed; inset: 0; background: #1e293b; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .lock-box { background: #ffffff; padding: 40px 30px; border-radius: 24px; text-align: center; width: 90%; max-width: 350px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); }
        .lock-box h3 { margin-top: 0; color: #1e293b; margin-bottom: 20px; }
        .lock-box input { width: 100%; padding: 14px; font-size: 18px; margin-bottom: 15px; border: 2px solid #e2e8f0; border-radius: 12px; text-align: center; outline: none; transition: 0.2s; }
        .lock-box input:focus { border-color: #5bbf8a; }
        .lock-box button { width: 100%; padding: 14px; background: #1e293b; color: white; border: none; font-size: 16px; font-weight: 600; border-radius: 12px; cursor: pointer; transition: 0.2s; }
        .error { color: #ef4444; font-size: 14px; margin-top: 10px; }

        /* ===== Floating Draggable Button ===== */
        #floatingMenuBtn {
            position: fixed;
            top: 10px;
            left: 15px;
            width: 45px;
            height: 45px;
            background: var(--ios-blue);
            color: white;
            border-radius: 50%;
            display: none; /* ซ่อนไว้ก่อนปลดล็อค */
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: move;
            z-index: 2100;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
            border: none;
            touch-action: none;
            transition: transform 0.2s, opacity 0.2s;
        }
        #floatingMenuBtn:active { transform: scale(0.9); }

        /* ===== Floating Sidebar & Overlay ===== */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.2);
            z-index: 2000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .sidebar-overlay.active { display: block; opacity: 1; }

        .sidebar-float {
            position: fixed;
            width: 280px;
            max-height: 70vh;
            background: var(--sidebar-dark);
            border-radius: 20px;
            overflow-y: auto;
            z-index: 2001;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.8) translateY(10px);
            transition: opacity 0.3s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.2) transparent;
        }
        .sidebar-float.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1) translateY(0);
        }

        /* Sidebar Content Styles */
        .sidebar-float .sidebar-header { padding: 20px; font-size: 17px; font-weight: 600; color: #fff; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
        .sidebar-float .menu { padding: 8px 0; }
        .sidebar-float .menu a, .sidebar-float .drop-btn { 
            width: 100%; padding: 12px 20px; background: none; border: none; 
            color: #ebebf5; text-align: left; font-size: 14px; cursor: pointer; 
            display: flex; align-items: center; text-decoration: none; transition: 0.2s;
        }
        .sidebar-float .menu a:hover, .sidebar-float .drop-btn:hover { background: rgba(255,255,255,0.1); }
        .sidebar-float .sub { display: none; background: rgba(0,0,0,0.2); }
        .sidebar-float .item.open .sub { display: block; }
        .sidebar-float .sub a { padding-left: 45px; font-size: 13px; color: #8e8e93; }

        /* Content Layout */
        .content { padding: 10px; padding-top: 20px; display: none; min-height: 100vh; }
        .box-container { width: 100%; background: #fff; padding: 10px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); height: calc(100vh - 100px); display: flex; flex-direction: column; }
        .sheet-container { flex-grow: 1; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }
        footer { width: 100%; text-align: center; padding: 15px 0; background: #fff; color: #94a3b8; position: fixed; bottom: 0; font-size: 12px; border-top: 1px solid #f1f5f9; }
    </style>
</head>
<body>

<div class="lock-page" id="lockPage">
    <div class="lock-box">
        <h3>🔒 รหัสเข้าใช้งาน</h3>
        <input type="password" id="password" placeholder="ระบุรหัสผ่าน" autofocus onkeydown="if(event.key==='Enter') checkPass()">
        <button onclick="checkPass()">เข้าสู่ระบบ</button>
        <div class="error" id="error"></div>
    </div>
</div>

<button id="floatingMenuBtn" title="ลากเพื่อย้าย">เมนู</button>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebarFloat()"></div>
<aside class="sidebar-float" id="sidebarFloat"></aside>

<main class="content" id="mainContent">
    <div class="box-container">
        <div class="sheet-container">
            <iframe src="https://docs.google.com/spreadsheets/d/1z-gI0C8Nur9KMJqCSdBxTaY6gF2zNBkcL1xSeHgLIv4/edit?gid=990579738#gid=990579738"></iframe>
        </div>
    </div>
</main>

<footer>© 2026 Copy Right By Angerina Frog</footer>

<script>
    const PASS = "0285";
    const dragBtn = document.getElementById('floatingMenuBtn');
    const sideFloat = document.getElementById('sidebarFloat');
    const sideOverlay = document.getElementById('sidebarOverlay');
    
    let isDragging = false;
    let startX, startY;
    let shiftX, shiftY;

    // --- 1. ระบบรหัสผ่าน ---
    function checkPass() {
        const input = document.getElementById("password");
        if (input.value === PASS) {
            document.getElementById("lockPage").style.display = "none";
            document.getElementById("mainContent").style.display = "block";
            dragBtn.style.display = "flex"; // แสดงปุ่มเมนูเมื่อปลดล็อค
            loadButtonPosition();
        } else {
            document.getElementById("error").innerText = "❌ รหัสไม่ถูกต้อง กรุณาลองใหม่";
            input.value = "";
            input.focus();
        }
    }

    // --- 2. ระบบลากปุ่ม (Drag System) ---
    function loadButtonPosition() {
        const savedLeft = localStorage.getItem('floatBtnLeft');
        const savedTop = localStorage.getItem('floatBtnTop');
        if (savedLeft && savedTop) {
            dragBtn.style.left = savedLeft + 'px';
            dragBtn.style.top = savedTop + 'px';
        }
    }

    dragBtn.onpointerdown = function(e) {
        isDragging = false;
        startX = e.clientX;
        startY = e.clientY;
        const rect = dragBtn.getBoundingClientRect();
        shiftX = e.clientX - rect.left;
        shiftY = e.clientY - rect.top;
        dragBtn.setPointerCapture(e.pointerId);
        document.addEventListener('pointermove', onPointerMove);
        document.addEventListener('pointerup', onPointerUp);
    };

    function onPointerMove(e) {
        if (!isDragging && (Math.abs(e.clientX - startX) > 5 || Math.abs(e.clientY - startY) > 5)) {
            isDragging = true;
        }
        if (isDragging) {
            let newX = e.clientX - shiftX;
            let newY = e.clientY - shiftY;
            newX = Math.max(0, Math.min(newX, window.innerWidth - dragBtn.offsetWidth));
            newY = Math.max(0, Math.min(newY, window.innerHeight - dragBtn.offsetHeight));
            dragBtn.style.left = newX + 'px';
            dragBtn.style.top = newY + 'px';
        }
    }

    function onPointerUp(e) {
        document.removeEventListener('pointermove', onPointerMove);
        document.removeEventListener('pointerup', onPointerUp);
        dragBtn.releasePointerCapture(e.pointerId);
        if (isDragging) {
            localStorage.setItem('floatBtnLeft', dragBtn.offsetLeft);
            localStorage.setItem('floatBtnTop', dragBtn.offsetTop);
        } else {
            toggleSidebarFloat();
        }
        isDragging = false;
    }

    // --- 3. ระบบ Sidebar ลอยตัว ---
    function toggleSidebarFloat() {
        const btnRect = dragBtn.getBoundingClientRect();
        const sidebarWidth = 280;
        let top = btnRect.bottom + 10;
        let left = btnRect.left;

        if (left + sidebarWidth > window.innerWidth) {
            left = window.innerWidth - sidebarWidth - 15;
        }
        if (top + 400 > window.innerHeight) {
            top = btnRect.top - 410;
            if (top < 10) top = 10;
        }

        sideFloat.style.top = top + 'px';
        sideFloat.style.left = left + 'px';
        sideFloat.style.transformOrigin = `${btnRect.left - left + 20}px ${btnRect.top > top ? 'bottom' : 'top'}`;

        const isActive = sideFloat.classList.toggle('active');
        sideOverlay.classList.toggle('active', isActive);
        if (isActive && !sideFloat.innerHTML) includeSidebar();
    }

    function closeSidebarFloat() {
        sideFloat.classList.remove('active');
        sideOverlay.classList.remove('active');
    }

    function includeSidebar() {
        const v = new Date().getTime();
        fetch(`sidebar.html?v=${v}`)
            .then(res => {
                if (!res.ok) throw new Error('ไม่พบไฟล์');
                return res.text();
            })
            .then(data => {
                sideFloat.innerHTML = `<div class="sidebar-header">เมนูนำทาง</div>` + data;
                restoreMenuState();
            })
            .catch(err => console.error("Sidebar Error:", err));
    }

    window.toggleDrop = function(btn, id) {
        const item = btn.parentElement;
        const isOpen = item.classList.toggle("open");
        if (id) localStorage.setItem('menu-' + id, isOpen);
    }

    function restoreMenuState() {
        ['credit', 'branch', 'sales'].forEach(id => {
            if (localStorage.getItem('menu-' + id) === 'true') {
                const el = sideFloat.querySelector('#menu-' + id);
                if (el) el.classList.add('open');
            }
        });
    }

    window.onload = function () {
        document.getElementById("password").focus();
    }
</script>
</body>
</html>
