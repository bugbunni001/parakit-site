<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log งานที่ต้องเคลียร์ - Premium iOS Design</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.4);
            --ios-blue: #007AFF;
            --ios-red: #FF3B30;
            --ios-green: #34C759;
            --text-main: #1d1d1f;
        }

        * {
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: var(--text-main);
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .container {
            padding: 40px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 40px;
        }

        h2 { 
            text-align: center; 
            font-weight: 600; 
            margin-bottom: 30px; 
            font-size: 28px;
        }

        .form-group { margin-bottom: 20px; }
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-size: 0.95em; 
            font-weight: 500; 
        }
        
        input, select {
            width: 100%;
            padding: 14px 18px;
            border-radius: 15px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            background: rgba(255, 255, 255, 0.9);
            border-color: var(--ios-blue);
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            background: var(--ios-blue);
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,122,255,0.3); }
        .btn-submit:disabled { background: #a1a1a6; cursor: not-allowed; }

        .list-container {
            width: 100%;
            max-width: 1100px;
            margin-bottom: 50px;
        }

        .table-wrapper { overflow-x: auto; border-radius: 20px; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 255, 255, 0.2);
        }

        th {
            background: rgba(255, 255, 255, 0.4);
            padding: 18px 15px;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 16px 15px;
            border-bottom: 1px solid var(--glass-border);
            font-size: 15px;
        }

        .link-file { color: var(--ios-blue); text-decoration: none; font-weight: 500; }

        .btn-delete {
            background: rgba(255, 59, 48, 0.1);
            color: var(--ios-red);
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 59, 48, 0.2);
            cursor: pointer;
            font-weight: 500;
        }

        .btn-delete:hover { background: var(--ios-red); color: white; }

        @media (max-width: 768px) {
            table, thead, tbody, th, td, tr { display: block; }
            thead tr { position: absolute; top: -9999px; left: -9999px; }
            tr { margin-bottom: 15px; background: rgba(255, 255, 255, 0.3); border-radius: 15px; padding: 10px; }
            td { border: none; position: relative; padding-left: 50%; text-align: right; }
            td:before { content: attr(data-label); position: absolute; left: 15px; font-weight: 600; text-align: left; }
        }
    </style>
</head>
<body>

<div class="container glass-card">
    <h2><i class="fa-solid fa-clipboard-list"></i> บันทึกงานใหม่</h2>
    <form id="jobForm">
        <div class="form-group">
            <label>วันที่ดำเนินการ</label>
            <input type="date" id="date" required>
        </div>
        <div class="form-group">
            <label>หมายเลขสมาชิก</label>
            <input type="text" id="memberId" placeholder="ระบุเลขสมาชิก (ใส่เลข 0 นำหน้าได้)" required>
        </div>
        <div class="form-group">
            <label>ชื่อ-นามสกุล ลูกค้า</label>
            <input type="text" id="name" placeholder="ระบุชื่อลูกค้า" required>
        </div>
        <div class="form-group">
            <label>เบอร์ติดต่อ</label>
            <input type="text" id="phone" placeholder="ระบุเบอร์โทร (ใส่เลข 0 นำหน้าได้)" required>
        </div>
        <div class="form-group">
            <label>พนักงานที่รับลูกค้า</label>
            <select id="staff">
                <option value="ศุภกฤต">ศุภกฤต</option>
                <option value="นวพล">นวพล</option>
                <option value="ปิยะพร">ปิยะพร</option>
                <option value="กรทักษ์">กรทักษ์</option>
            </select>
        </div>
        <div class="form-group">
            <label>แนบรูปภาพเอกสาร</label>
            <input type="file" id="file" accept="image/*">
        </div>
        <button type="submit" id="submitBtn" class="btn-submit">
            <span id="btnText">บันทึกข้อมูล</span>
        </button>
    </form>
</div>

<div class="list-container">
    <div class="table-wrapper glass-card">
        <table>
            <thead>
                <tr>
                    <th>วันที่</th>
                    <th>สมาชิก</th>
                    <th>ชื่อลูกค้า</th>
                    <th>เบอร์ติดต่อ</th>
                    <th>พนักงาน</th>
                    <th>เอกสาร</th>
                    <th>จัดการ</th>
                </tr>
            </thead>
            <tbody id="dataTable"></tbody>
        </table>
    </div>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwWkxqF354ktYRVnk6CBn82IvX7XvTa3Ba4GXOjESCsaA7YS0VGTPpE9YC-AN0jbqUY/exec';

    // Set Default Date to Today
    document.getElementById('date').valueAsDate = new Date();

    const form = document.getElementById('jobForm');
    const btn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');

    window.onload = loadData;

    // Function to format Date to DD-MM-YYYY
    function formatDate(dateStr) {
        if (!dateStr) return "-";
        const date = new Date(dateStr);
        if (isNaN(date)) return dateStr; // ถ้าไม่ใช่รูปแบบวันที่ให้ส่งคืนค่าเดิม
        const day = String(date.getDate()).padStart(2, '0');
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const year = date.getFullYear();
        return `${day}-${month}-${year}`;
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        btn.disabled = true;
        btnText.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> กำลังบันทึก...';

        const fileInput = document.getElementById('file');
        let fileData = null;
        if (fileInput.files.length > 0) {
            fileData = await toBase64(fileInput.files[0]);
        }

        const payload = {
            action: "insert",
            date: document.getElementById('date').value, // YYYY-MM-DD
            memberId: "'" + document.getElementById('memberId').value, // ใส่ ' นำหน้าเพื่อบังคับเป็น Text ใน Google Sheet
            name: document.getElementById('name').value,
            phone: "'" + document.getElementById('phone').value, // ใส่ ' นำหน้าเพื่อบังคับเป็น Text
            staff: document.getElementById('staff').value,
            fileData: fileData
        };

        try {
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
            Swal.fire({ icon: 'success', title: 'สำเร็จ!', text: 'บันทึกข้อมูลเรียบร้อยแล้วค่ะ', timer: 2000, showConfirmButton: false });
            form.reset();
            document.getElementById('date').valueAsDate = new Date();
            loadData();
        } catch (error) {
            Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: 'กรุณาลองใหม่อีกครั้ง' });
        } finally {
            btn.disabled = false;
            btnText.innerText = "บันทึกข้อมูล";
        }
    });

    async function loadData() {
        const tableBody = document.getElementById('dataTable');
        tableBody.innerHTML = '<tr><td colspan="7" style="text-align:center;">กำลังโหลดข้อมูล...</td></tr>';

        try {
            const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({action: "read"}) });
            const data = await response.json();
            tableBody.innerHTML = '';

            data.reverse().forEach(row => {
                const tr = document.createElement('tr');
                // จัดการเบอร์และ ID ให้แสดงเลข 0 (ลบเครื่องหมาย ' ออกถ้ามี)
                const displayId = String(row[1]).replace(/^'/, '');
                const displayPhone = String(row[3]).replace(/^'/, '');
                
                tr.innerHTML = `
                    <td data-label="วันที่">${formatDate(row[0])}</td>
                    <td data-label="สมาชิก">${displayId}</td>
                    <td data-label="ชื่อลูกค้า">${row[2]}</td>
                    <td data-label="เบอร์ติดต่อ">${displayPhone}</td>
                    <td data-label="พนักงาน">${row[4]}</td>
                    <td data-label="เอกสาร">${row[5] ? `<a href="${row[5]}" target="_blank" class="link-file"><i class="fa-solid fa-image"></i> กดที่นี่เพื่อดูเอกสาร</a>` : '-'}</td>
                    <td data-label="จัดการ"><button class="btn-delete" onclick="deleteData('${row[0]}', '${row[1]}')"><i class="fa-solid fa-trash-can"></i> ลบ</button></td>
                `;
                tableBody.appendChild(tr);
            });
        } catch (error) {
            tableBody.innerHTML = '<tr><td colspan="7" style="text-align:center;">โหลดข้อมูลไม่สำเร็จ</td></tr>';
        }
    }

    async function deleteData(date, memberId) {
        const result = await Swal.fire({
            title: 'ยืนยันการลบ?',
            text: "ข้อมูลนี้จะถูกลบออกจากระบบถาวร",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#FF3B30',
            confirmButtonText: 'ลบข้อมูล',
            cancelButtonText: 'ยกเลิก'
        });

        if (result.isConfirmed) {
            Swal.showLoading();
            await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({action: "delete", date: date, memberId: memberId})
            });
            Swal.fire('ลบแล้ว!', 'ลบข้อมูลเรียบร้อยแล้ว', 'success');
            loadData();
        }
    }

    const toBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
</script>

</body>
</html>
