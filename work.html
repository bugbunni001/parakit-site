<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเคลียร์งาน - Parakit-site</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            /* Sidebar Variables */
            --ios-blue: #007aff;
            --ios-system-gray: #f2f2f7;
            --sidebar-dark: rgba(28, 28, 30, 0.95);
            --sidebar-width: 280px;
            
            /* App Glass Variables */
            --glass: rgba(255, 255, 255, 0.25);
            --glass-white: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
            --ios-red: #FF3B30;
            --ios-green: #34C759;
            --text-main: #1d1d1f;
            --text-light: #8e8e93;
            --card-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.08);
        }

        * { box-sizing: border-box; font-family: 'Kanit', sans-serif !important; }
        
        body {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            color: var(--text-main);
            transition: padding-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding-bottom: 80px;
        }

        /* ===== Header Navbar Glass ===== */
        .top-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 65px;
            background: var(--glass-white);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            z-index: 1200;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 0.5px solid rgba(0,0,0,0.1);
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .top-toggle {
            width: 36px; height: 36px;
            border-radius: 10px;
            border: none;
            background: var(--ios-blue);
            color: white;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            z-index: 1300;
            margin-right: 15px;
            transition: transform 0.2s;
        }
        .top-toggle:active { transform: scale(0.9); }

        /* ===== Sidebar Style Glass Dark ===== */
        .sidebar { 
            position: fixed; top: 0; left: 0; 
            width: var(--sidebar-width); height: 100vh; 
            background: var(--sidebar-dark); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            color: #fff; overflow-y: auto; 
            transition: all .3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2000;
            box-shadow: 10px 0 30px rgba(0,0,0,0.1);
        }

        @media(min-width:769px) { 
            body:not(.collapsed) { padding-left: var(--sidebar-width); }
            body:not(.collapsed) .top-header { left: var(--sidebar-width); }
            body.collapsed .sidebar { transform: translateX(-100%); }
            body.collapsed .top-header { left: 0; }
        }

        @media(max-width:768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.show { transform: translateX(0); }
            body { padding-left: 0 !important; }
            .top-header { left: 0 !important; }
        }

        /* Overlay */
        .overlay { 
            position: fixed; inset: 0; 
            background: rgba(0, 0, 0, 0.3); 
            backdrop-filter: blur(4px); 
            display: none; z-index: 1500; 
        }
        .overlay.show { display: block; }

        /* Sidebar Internal Menu */
        .sidebar-header { padding: 25px 20px; font-size: 18px; font-weight: 600; background: rgba(0,0,0,0.2); border-bottom: 0.5px solid rgba(255,255,255,0.1); }
        .menu { padding: 10px 0; }
        .menu a, .menu .drop-btn { width: 100%; min-height: 50px; padding: 12px 20px; background: none; border: none; color: #ebebf5; font-size: 15px; cursor: pointer; display: flex; align-items: center; text-decoration: none; transition: 0.3s; }
        .menu a:hover, .menu .drop-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .sub { display: none; background: rgba(0,0,0,0.2); padding: 5px 0; }
        .item.open .sub { display: block; }
        .sub a { padding-left: 45px; font-size: 14px; color: #8e8e93; }
        .arrow { margin-left: auto; transition: 0.3s; font-size: 10px; opacity: 0.5; }
        .item.open .arrow { transform: rotate(90deg); }

        /* ===== MAIN CONTENT LAYOUT ===== */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 100px 20px 40px;
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .container { padding: 40px; width: 100%; max-width: 600px; margin-bottom: 40px; }
        h2 { text-align: center; font-weight: 600; margin-bottom: 30px; font-size: 28px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.95em; font-weight: 500; }
        input, select {
            width: 100%; padding: 14px 18px; border-radius: 15px;
            border: 1px solid var(--glass-border); background: rgba(255, 255, 255, 0.6);
            font-size: 16px; outline: none; transition: all 0.3s ease;
        }
        input:focus, select:focus { background: rgba(255, 255, 255, 0.9); border-color: var(--ios-blue); }
        .btn-submit {
            width: 100%; padding: 16px; border: none; border-radius: 16px;
            background: var(--ios-blue); color: white; font-size: 18px; font-weight: 600;
            cursor: pointer; transition: all 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,122,255,0.3); }

        /* Search & List */
        .search-container { width: 100%; max-width: 1100px; margin-bottom: 15px; display: flex; justify-content: flex-end; }
        .search-box { position: relative; width: 100%; max-width: 350px; }
        .search-box input { padding-left: 45px; border-radius: 12px; background: rgba(255, 255, 255, 0.5); }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #666; }

        .list-container { width: 100%; max-width: 1100px; margin-bottom: 50px; }
        .table-wrapper { overflow-x: auto; border-radius: 20px; }
        table { width: 100%; border-collapse: collapse; background: rgba(255, 255, 255, 0.2); }
        th { background: rgba(255, 255, 255, 0.4); padding: 18px 15px; text-align: left; font-weight: 600; }
        td { padding: 16px 15px; border-bottom: 1px solid var(--glass-border); font-size: 15px; }
        .link-file { color: var(--ios-blue); text-decoration: none; font-weight: 500; }
        .btn-delete {
            background: rgba(255, 59, 48, 0.1); color: var(--ios-red); padding: 8px 12px;
            border-radius: 10px; border: 1px solid rgba(255, 59, 48, 0.2); cursor: pointer; font-weight: 500;
        }
        .btn-delete:hover { background: var(--ios-red); color: white; }

        @media (max-width: 768px) {
            table, thead, tbody, th, td, tr { display: block; }
            thead tr { position: absolute; top: -9999px; left: -9999px; }
            tr { margin-bottom: 15px; background: rgba(255, 255, 255, 0.3); border-radius: 15px; padding: 10px; }
            td { border: none; position: relative; padding-left: 50%; text-align: right; }
            td:before { content: attr(data-label); position: absolute; left: 15px; font-weight: 600; text-align: left; }
            .search-container { justify-content: center; }
            .search-box { max-width: 100%; }
        }

        footer { width: 100%; text-align: center; padding: 25px; color: var(--text-light); font-size: 11px; }
    </style>
</head>
<body>

<header class="top-header">
    <button class="top-toggle" onclick="toggleSidebar()">☰</button>
    <div style="font-weight: 600; font-size: 1.1rem; color: var(--text-main);">ระบบเคลียร์งาน</div>
</header>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<aside class="sidebar" id="sidebar"></aside>

<div class="main-content">
    <div class="container glass-card">
        <h2><i class="fa-solid fa-clipboard-list"></i> ระบบบันทึกงานที่ต้องเก็บไว้ทำ (กันลืม) </h2>
        <form id="jobForm">
            <div class="form-group">
                <label>วันที่ดำเนินการ</label>
                <input type="date" id="date" required>
            </div>
            <div class="form-group">
                <label>หมายเลขสมาชิก TMH / TOL / TVS</label>
                <input type="text" id="memberId" placeholder="ระบุเลขสมาชิก" required>
            </div>
            <div class="form-group">
                <label>ชื่อ-นามสกุล ลูกค้า</label>
                <input type="text" id="name" placeholder="ระบุชื่อ-นามสกุล ลูกค้า" required>
            </div>
            <div class="form-group">
                <label>เบอร์ติดต่อ</label>
                <input type="text" id="phone" placeholder="ระบุเบอร์โทรศัพท์" required>
            </div>
            <div class="form-group">
                <label>พนักงานที่รับลูกค้า</label>
                <select id="staff">
                    <option value="">-- เลือกพนักงาน --</option>
                    <option value="ศุภกฤต">ศุภกฤต</option>
                    <option value="นวพล">นวพล</option>
                    <option value="ปิยะพร">ปิยะพร</option>
                    <option value="กรทักษ์">กรทักษ์</option>
                </select>
            </div>
            <div class="form-group">
                <label>แนบรูปภาพเอกสาร</label>
                <input type="file" id="file" accept="image/*">
            </div>
            <button type="submit" id="submitBtn" class="btn-submit">
                <span id="btnText">บันทึกข้อมูล</span>
            </button>
        </form>
    </div>

    <div class="search-container">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="ค้นหา ชื่อ, เบอร์, พนักงาน..." onkeyup="filterData()">
        </div>
    </div>

    <div class="list-container">
        <div class="table-wrapper glass-card">
            <table>
                <thead>
                    <tr>
                        <th>วันที่</th>
                        <th>สมาชิก</th>
                        <th>ชื่อลูกค้า</th>
                        <th>เบอร์ติดต่อ</th>
                        <th>พนักงาน</th>
                        <th>เอกสาร</th>
                        <th>ลบ</th>
                    </tr>
                </thead>
                <tbody id="dataTable"></tbody>
            </table>
        </div>
    </div>

    <footer>© 2026 Copy Right By Angerina Frog</footer>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxQ6oHl9McfWiPCEzIZXOlqJlyqrrv_jzultnBcpOhdfe-jnqCGZ3mBST6-uSP-icA/exec';

    // Sidebar Logic (จาก Memory)
    function includeSidebar() {
        const cached = localStorage.getItem('sidebar_cache');
        if (cached) {
            document.getElementById('sidebar').innerHTML = cached;
            restoreMenuState();
        }
        fetch('sidebar.html')
            .then(response => response.text())
            .then(data => {
                if (data !== cached) {
                    document.getElementById('sidebar').innerHTML = data;
                    localStorage.setItem('sidebar_cache', data);
                    restoreMenuState();
                }
            })
            .catch(err => console.warn("Sidebar Load Error"));
            
        if(localStorage.getItem('sidebar_collapsed') === 'true' && window.innerWidth > 768) {
            document.body.classList.add('collapsed');
        }
    }

    function toggleSidebar() {
        if (window.innerWidth <= 768) {
            document.getElementById("sidebar").classList.toggle("show");
            document.getElementById("overlay").classList.toggle("show");
        } else {
            const isCollapsed = document.body.classList.toggle("collapsed");
            localStorage.setItem('sidebar_collapsed', isCollapsed);
        }
    }

    window.toggleDrop = function(btn, id) {
        const item = btn.parentElement;
        const isOpen = item.classList.toggle("open");
        if (id) localStorage.setItem('menu-' + id, isOpen);
    }

    function restoreMenuState() {
        ['credit', 'branch', 'sales'].forEach(id => {
            if (localStorage.getItem('menu-' + id) === 'true') {
                const el = document.getElementById('menu-' + id);
                if (el) el.classList.add('open');
            }
        });
    }

    // App Logic
    document.getElementById('date').valueAsDate = new Date();
    const form = document.getElementById('jobForm');
    const btn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');

    window.onload = () => {
        includeSidebar();
        loadData();
    };

    function formatDateForDisplay(dateStr) {
        if (!dateStr) return "-";
        const date = new Date(dateStr);
        if (isNaN(date)) return dateStr; 
        const day = String(date.getDate()).padStart(2, '0');
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const year = date.getFullYear();
        return `${day}-${month}-${year}`;
    }

    function formatDateForDelete(dateStr) {
        const date = new Date(dateStr);
        if (isNaN(date)) return dateStr;
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        btn.disabled = true;
        btnText.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> กำลังบันทึก...';

        const fileInput = document.getElementById('file');
        let fileData = null;
        if (fileInput.files.length > 0) { fileData = await toBase64(fileInput.files[0]); }

        const payload = {
            action: "insert",
            date: document.getElementById('date').value,
            memberId: "'" + document.getElementById('memberId').value,
            name: document.getElementById('name').value,
            phone: "'" + document.getElementById('phone').value,
            staff: document.getElementById('staff').value,
            fileData: fileData
        };

        try {
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
            Swal.fire({ icon: 'success', title: 'สำเร็จ!', text: 'บันทึกเรียบร้อย', timer: 2000, showConfirmButton: false });
            form.reset();
            document.getElementById('date').valueAsDate = new Date();
            loadData();
        } catch (error) {
            Swal.fire({ icon: 'error', title: 'ผิดพลาด', text: 'ลองใหม่อีกครั้ง' });
        } finally {
            btn.disabled = false;
            btnText.innerText = "บันทึกข้อมูล";
        }
    });

    async function loadData() {
        const tableBody = document.getElementById('dataTable');
        tableBody.innerHTML = '<tr><td colspan="7" style="text-align:center;">กำลังโหลดข้อมูล...</td></tr>';

        try {
            const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({action: "read"}) });
            const data = await response.json();
            tableBody.innerHTML = '';

            data.reverse().forEach(row => {
                const tr = document.createElement('tr');
                const deleteDate = formatDateForDelete(row[0]);
                const rawMemberId = String(row[1]);
                const displayId = String(row[1]).replace(/^'/, '');
                const displayPhone = String(row[3]).replace(/^'/, '');
                
                tr.innerHTML = `
                    <td data-label="วันที่">${formatDateForDisplay(row[0])}</td>
                    <td data-label="สมาชิก">${displayId}</td>
                    <td data-label="ชื่อลูกค้า">${row[2]}</td>
                    <td data-label="เบอร์ติดต่อ">${displayPhone}</td>
                    <td data-label="พนักงาน">${row[4]}</td>
                    <td data-label="เอกสาร">${row[5] ? `<a href="${row[5]}" target="_blank" class="link-file"><i class="fa-solid fa-image"></i> ดูเอกสาร</a>` : '-'}</td>
                    <td data-label="ลบ">
                        <button class="btn-delete" onclick="deleteData('${deleteDate}', '${rawMemberId}')">
                            <i class="fa-solid fa-trash-can"></i> ลบ
                        </button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        } catch (error) {
            console.error(error);
            tableBody.innerHTML = '<tr><td colspan="7" style="text-align:center;">โหลดข้อมูลไม่สำเร็จ</td></tr>';
        }
    }

    function filterData() {
        const input = document.getElementById('searchInput');
        const filter = input.value.toLowerCase();
        const table = document.getElementById('dataTable');
        const tr = table.getElementsByTagName('tr');

        for (let i = 0; i < tr.length; i++) {
            const nameCol = tr[i].getElementsByTagName('td')[2];
            const phoneCol = tr[i].getElementsByTagName('td')[3];
            const staffCol = tr[i].getElementsByTagName('td')[4];

            if (nameCol || phoneCol || staffCol) {
                const nameText = nameCol.textContent || nameCol.innerText;
                const phoneText = phoneCol.textContent || phoneCol.innerText;
                const staffText = staffCol.textContent || staffCol.innerText;

                if (nameText.toLowerCase().indexOf(filter) > -1 || 
                    phoneText.toLowerCase().indexOf(filter) > -1 ||
                    staffText.toLowerCase().indexOf(filter) > -1) {
                    tr[i].style.display = "";
                } else {
                    tr[i].style.display = "none";
                }
            }
        }
    }

    async function deleteData(delDate, rawId) {
        const result = await Swal.fire({
            title: 'ยืนยันการลบ?',
            text: "ข้อมูลจะถูกลบถาวร",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#FF3B30',
            confirmButtonText: 'ลบข้อมูล',
            cancelButtonText: 'ยกเลิก'
        });

        if (result.isConfirmed) {
            Swal.fire({ title: 'กำลังลบ...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({action: "delete", date: delDate, memberId: rawId})
                });
                Swal.fire('สำเร็จ!', 'ลบข้อมูลแล้ว', 'success');
                loadData();
            } catch (error) {
                Swal.fire('ผิดพลาด', 'ไม่สามารถลบได้', 'error');
            }
        }
    }

    const toBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
</script>

</body>
</html>
