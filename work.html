<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเคลียร์งาน - Parakit-site</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --ios-blue: #007aff;
            --ios-dark-blue: #0056b3;
            --ios-bg: #f2f2f7;
            --glass-white: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
            --sidebar-dark: rgba(28, 28, 30, 0.94);
            --text-main: #1c1c1e;
            --text-light: #636366;
            --ios-red: #FF3B30;
            --ios-green: #34C759;
            --ios-orange: #FF9500;
            --ios-purple: #8e5aff;
            --shadow-soft: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        * { box-sizing: border-box; font-family: 'Prompt', sans-serif !important; }

        body { 
            margin: 0; 
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            background-attachment: fixed;
            color: var(--text-main); 
            min-height: 100vh;
            padding-bottom: 60px;
            scroll-behavior: smooth;
        }

        .top-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 65px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: 1300;
            display: flex; align-items: center;
            padding: 0 20px 0 75px; 
            border-bottom: 1px solid var(--glass-border);
        }

        #floatingMenuBtn {
            position: fixed;
            top: 10px;
            left: 15px;
            width: 45px;
            height: 45px;
            background: var(--ios-blue);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            cursor: move;
            z-index: 2100;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
            border: none;
            touch-action: none;
            transition: transform 0.2s, opacity 0.2s;
        }
        #floatingMenuBtn:active { transform: scale(0.9); }

        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.2);
            z-index: 2000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .sidebar-overlay.active { display: block; opacity: 1; }

        .sidebar-float {
            position: fixed;
            width: 280px;
            max-height: 70vh;
            background: var(--sidebar-dark);
            border-radius: 20px;
            overflow-y: auto;
            z-index: 2001;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.8) translateY(10px);
            transition: opacity 0.3s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.2) transparent;
        }
        .sidebar-float.active { opacity: 1; visibility: visible; transform: scale(1) translateY(0); }
        .sidebar-float .sidebar-header { padding: 20px; font-size: 17px; font-weight: 600; color: #fff; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
        .sidebar-float .menu { padding: 8px 0; }
        .sidebar-float .menu a, .sidebar-float .drop-btn { 
            width: 100%; padding: 12px 20px; background: none; border: none; 
            color: #ebebf5; text-align: left; font-size: 14px; cursor: pointer; 
            display: flex; align-items: center; text-decoration: none; transition: 0.2s;
        }
        .sidebar-float .menu a:hover, .sidebar-float .drop-btn:hover { background: rgba(255,255,255,0.1); }
        .sidebar-float .sub { display: none; background: rgba(0,0,0,0.2); }
        .sidebar-float .item.open .sub { display: block; }
        .sidebar-float .sub a { padding-left: 45px; font-size: 13px; color: #8e8e93; }

        .stats-container {
            width: 100%;
            max-width: 1300px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            padding: 10px 0 15px 0;
        }

        .stat-card-long {
            grid-column: span 2;
            background: linear-gradient(90deg, #5856d6, #007aff);
            color: white;
            padding: 15px 25px;
            border-radius: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(88, 86, 214, 0.3);
            margin-bottom: 10px;
        }
        .stat-card-long.complaint-card { background: linear-gradient(90deg, #FF3B30, #ff6b6b); box-shadow: 0 4px 15px rgba(255, 59, 48, 0.4); }
        .stat-card-long.daily-card { background: linear-gradient(90deg, #8e5aff, #5856d6); box-shadow: 0 4px 15px rgba(142, 90, 255, 0.3); }
        .stat-card-long.overdue-card { background: linear-gradient(90deg, #FF9500, #FFCC00); box-shadow: 0 4px 15px rgba(255, 149, 0, 0.3); }
        .stat-card-long:hover { transform: scale(1.01); filter: brightness(1.1); }
        .stat-card-long .info { display: flex; flex-direction: column; }
        .stat-card-long .title { font-size: 14px; font-weight: 600; }
        .stat-card-long .date-label { font-size: 18px; opacity: 0.9; }
        .stat-card-long .count-val { font-size: 24px; font-weight: 700; }

        .stat-card {
            padding: 15px 10px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            background: white;
            box-shadow: 0 10px 20px rgba(0,122,255,0.15);
            border-color: var(--ios-blue);
        }
        
        .stat-card.active {
            border-color: var(--ios-blue);
            background: white;
            box-shadow: 0 0 0 2px var(--ios-blue);
        }
        .stat-card .count { font-size: 22px; font-weight: 700; color: var(--ios-blue); line-height: 1; }
        .stat-card .label { font-size: 12px; color: var(--text-light); font-weight: 500; margin-top: 6px; }

        .stat-card.pinned-stat .count { color: var(--ios-orange); }
        .stat-card.processing-stat .count { color: var(--ios-dark-blue); }
        .stat-card.complaint-stat .count { color: var(--ios-red); }

        .main-content { 
            display: flex; flex-direction: column; align-items: center; 
            padding: 85px 25px 40px; 
            animation: fadeIn 0.6s ease-out; 
        }

        .action-bar {
            width: 100%; max-width: 1300px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; gap: 15px;
            flex-wrap: wrap;
        }

        .left-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

        .btn-add-job {
            background: linear-gradient(135deg, #007aff, #0056b3);
            color: white; padding: 12px 24px; border-radius: 16px; border: none;
            font-size: 15px; font-weight: 600; cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 122, 255, 0.3);
            transition: 0.3s; display: flex; align-items: center; gap: 8px;
        }
        .btn-add-job:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(0, 122, 255, 0.4); }

        .btn-trash-view {
            background: rgba(255, 59, 48, 0.1); color: var(--ios-red);
            padding: 12px 20px; border-radius: 16px; border: 1px solid rgba(255, 59, 48, 0.2);
            font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; gap: 8px;
        }
        .btn-trash-view:hover { background: var(--ios-red); color: white; transform: translateY(-2px); }

        .btn-log-view {
            background: rgba(0, 0, 0, 0.05); color: var(--text-main);
            padding: 12px 20px; border-radius: 16px; border: 1px solid var(--glass-border);
            font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; gap: 8px;
        }
        .btn-log-view:hover { background: var(--text-main); color: white; transform: translateY(-2px); }

        .search-area-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-grow: 1;
            max-width: 750px; 
        }

        .date-filter-wrapper {
            display: flex;
            gap: 8px;
            align-items: center;
            min-width: 160px;
            position: relative;
        }
        .date-input-container { position: relative; flex-grow: 1; }
        .date-input-container i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--ios-blue); pointer-events: none; }
        
        .btn-clear-all {
            background: #fff0f0;
            color: var(--ios-red);
            border: 1px solid rgba(255, 59, 48, 0.2);
            padding: 0 15px;
            height: 48px;
            border-radius: 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-clear-all:hover { background: var(--ios-red); color: white; transform: scale(1.05); }

        .date-filter-input {
            width: 100%; padding: 14px 15px 14px 42px; border-radius: 18px; 
            border: 1px solid var(--glass-border); background: rgba(255, 255, 255, 0.8);
            outline: none; transition: 0.3s; font-size: 14px; color: var(--text-main);
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            cursor: pointer;
        }
        .date-filter-input:focus { border-color: var(--ios-blue); background: white; }

        .search-wrapper { flex-grow: 1; position: relative; }
        .search-wrapper i.bi-search { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--ios-blue); }
        
        .btn-clear-search {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: #eee;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            color: #999;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            transition: 0.2s;
            opacity: 0;
            visibility: hidden;
        }
        .search-input:not(:placeholder-shown) + .btn-clear-search {
            opacity: 1;
            visibility: visible;
        }
        .btn-clear-search:hover { background: #ddd; color: var(--ios-red); }

        .search-input { 
            width: 100%; padding: 14px 45px 14px 48px; border-radius: 18px; 
            border: 1px solid var(--glass-border); background: rgba(255, 255, 255, 0.8);
            outline: none; transition: 0.3s; font-size: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .search-input:focus { border-color: var(--ios-blue); box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1); background: white; }

        .btn-refresh-inline {
            width: 48px; height: 48px; border-radius: 18px; border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.8); color: var(--ios-blue);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s; font-size: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .btn-refresh-inline:hover { background: white; transform: scale(1.05); color: var(--ios-green); border-color: var(--ios-green); }

        .table-wrapper { 
            width: 100%; max-width: 1300px; overflow-x: auto; border-radius: 28px; 
            background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); box-shadow: var(--shadow-soft);
        }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th { 
            background: rgba(255, 255, 255, 0.6); padding: 18px 15px; 
            text-align: left; font-size: 14px; color: var(--text-light); 
            border-bottom: 1px solid rgba(0,0,0,0.05); font-weight: 600; text-transform: uppercase;
        }
        td { padding: 16px 15px; border-bottom: 1px solid rgba(255,255,255,0.4); font-size: 14px; vertical-align: middle; transition: 0.2s; }
        tbody tr:hover td { background: rgba(255, 255, 255, 0.4); }

        .report-id-label {
            font-size: 10px;
            color: var(--text-light);
            background: rgba(0,0,0,0.05);
            padding: 1px 5px;
            border-radius: 4px;
            display: block;
            margin-top: 4px;
            font-weight: 400;
        }

        .job-type-badge {
            background: white; color: var(--ios-blue);
            padding: 4px 12px; border-radius: 10px;
            font-size: 12px; font-weight: 600; white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            border: 1px solid rgba(0, 122, 255, 0.15);
        }
        .job-type-badge.complaint-badge {
            background: #fff0f0; color: var(--ios-red); border-color: rgba(255, 59, 48, 0.3);
        }

        .pinned-row { background: rgba(255, 149, 0, 0.08) !important; }

        .action-btns-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .action-btns {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .deadline-label-small {
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            font-size: 11px;
            color: var(--ios-blue);
            font-weight: 600;
            background: #f2f2f7;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .btn-pin, .btn-process, .btn-edit, .btn-delete, .btn-daily {
            width: 36px; height: 36px; border-radius: 10px; border: none; cursor: pointer; transition: all 0.2s;
            display: inline-flex; align-items: center; justify-content: center; font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        .btn-pin { background: #fff8ed; color: var(--ios-orange); }
        .btn-pin.active { background: var(--ios-orange); color: white; box-shadow: 0 4px 10px rgba(255, 149, 0, 0.3); }
        
        .btn-process { background: #eef7ff; color: var(--ios-blue); }
        .btn-process.active { background: var(--ios-dark-blue); color: white; box-shadow: 0 4px 10px rgba(0, 86, 179, 0.3); }
        .btn-process:hover:not(.active) { background: #ddecff; transform: translateY(-2px); }

        .btn-daily { background: #f5eeff; color: var(--ios-purple); }
        .btn-daily.active { background: var(--ios-purple); color: white; box-shadow: 0 4px 10px rgba(142, 90, 255, 0.3); }
        .btn-daily:hover:not(.active) { background: #efe5ff; transform: translateY(-2px); }

        .btn-edit { background: #eef7ed; color: var(--ios-green); }
        .btn-edit:hover { background: var(--ios-green); color: white; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(52, 199, 89, 0.3); }

        .btn-delete { background: #fff0f0; color: var(--ios-red); }
        .btn-delete:hover { background: var(--ios-red); color: white; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(255, 59, 48, 0.3); }
        
        .btn-pin:hover:not(.active) { background: #ffe6c2; transform: translateY(-2px); }

        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 25px;
            width: 100%;
            max-width: 1300px;
        }

        .pagination-btn {
            min-width: 40px;
            height: 40px;
            padding: 0 10px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.6);
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pagination-btn:hover {
            background: white;
            border-color: var(--ios-blue);
            color: var(--ios-blue);
            transform: translateY(-2px);
        }

        .pagination-btn.active {
            background: var(--ios-blue);
            color: white;
            border-color: var(--ios-blue);
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        .pagination-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .floating-controls {
            position: fixed;
            bottom: 25px;
            right: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1100;
        }

        .btn-float {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            color: var(--ios-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 18px;
            text-decoration: none;
        }

        .btn-float:hover { background: white; transform: scale(1.1); box-shadow: 0 6px 20px rgba(0,122,255,0.2); }

        #btn-back-to-top { opacity: 0; visibility: hidden; transform: translateY(20px); }
        #btn-back-to-top.show { opacity: 1; visibility: visible; transform: translateY(0); }

        .swal2-container { z-index: 9999 !important; }
        .swal-modal-custom { border-radius: 30px !important; padding: 20px !important; }
        .swal2-title { font-weight: 700 !important; color: var(--text-main) !important; }

        .swal-form-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: left; margin-top: 15px; }
        .swal-field-full { grid-column: span 2; }
        .swal-label { font-size: 13px; font-weight: 600; color: var(--text-light); margin-bottom: 6px; display: block; margin-left: 5px; }
        .swal-input-styled { 
            width: 100%; padding: 12px 15px; border-radius: 14px; border: 1.5px solid #e5e5ea; 
            font-size: 15px; outline: none; transition: 0.2s; background: #f9f9f9;
        }
        .swal-input-styled:focus { border-color: var(--ios-blue); background: #fff; box-shadow: 0 0 0 4px rgba(0,122,255,0.1); }
        
        .detail-view-item { background: #f9f9f9; padding: 12px 15px; border-radius: 14px; border: 1.5px solid #f0f0f5; }
        .detail-view-item .val { font-size: 15px; font-weight: 600; color: var(--text-main); display: block; }

        .file-list { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
        .file-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #fff; padding: 8px 12px; border-radius: 10px; border: 1px solid #e5e5ea;
            font-size: 13px;
        }
        .file-item .remove-file { color: var(--ios-red); cursor: pointer; font-size: 16px; padding-left: 10px; }
        
        .existing-file-item { background: #f0f9ff; border-color: #bae6fd; }
        .existing-file-item i.bi-trash { color: var(--ios-red); }

        .bi-spin {
            display: inline-block;
            animation: bi-spin-keyframes 1s linear infinite;
        }
        @keyframes bi-spin-keyframes {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .modal-table { width:100% !important; min-width:100% !important; margin-top:10px; border-collapse: collapse; }
        .modal-table th { padding: 12px 10px; font-size:14px; background: rgba(0,0,0,0.05); color: var(--text-main); font-weight: 600; }
        .modal-table td { padding: 12px 10px; font-size:14px; border-bottom: 1px solid rgba(0,0,0,0.05); color: var(--text-main); vertical-align: middle; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header class="top-header">
    <div style="font-weight: 700; font-size: 1.4rem; color: var(--text-main); letter-spacing: -1px;">ระบบเคลียร์งาน</div>
</header>

<button id="floatingMenuBtn" title="ลากเพื่อย้าย">เมนู</button>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebarFloat()"></div>
<aside class="sidebar-float" id="sidebarFloat"></aside>

<div class="floating-controls">
    <button id="btn-back-to-top" class="btn-float" onclick="scrollToTop()" title="กลับไปด้านบน">
        <i class="bi bi-arrow-up"></i>
    </button>
</div>

<div class="main-content">
    
    <div class="stats-container" id="statsContainer"></div>

    <div class="action-bar">
        <div class="left-actions">
            <button class="btn-add-job" onclick="openAddJobModal()">
                <i class="bi bi-plus-circle"></i> เพิ่มรายการใหม่
            </button>
            <button class="btn-trash-view" onclick="openTrashModal()">
                <i class="bi bi-trash3"></i> ถังขยะ
            </button>
            <button class="btn-log-view" onclick="openLogsModal()">
                <i class="bi bi-journal-text"></i> Log ทำรายการ
            </button>
        </div>
        <div class="search-area-wrapper">
            <div class="date-filter-wrapper">
                <button class="btn-clear-all" onclick="clearAllFilters()" title="ล้างข้อมูลทั้งหมด">ล้างข้อมูล</button>
                <div class="date-input-container">
                    <i class="bi bi-calendar3"></i>
                    <input type="date" id="dateFilter" class="date-filter-input" onchange="filterData()" title="กรองตามวันครบกำหนด">
                </div>
            </div>
            
            <div class="search-wrapper">
                <i class="bi bi-search"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="ค้นหาข้อมูล..." onkeyup="filterData()">
                <button id="clearSearchBtn" class="btn-clear-search" onclick="clearSearch()" title="ล้างการค้นหา">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
            <button class="btn-refresh-inline" onclick="loadData(true)" title="รีเฟรชข้อมูล">
                <i class="bi bi-arrow-clockwise"></i>
            </button>
        </div>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th width="120">วันที่ / เลขที่</th>
                    <th width="160">ประเภทงาน</th>
                    <th>รหัสสมาชิก</th>
                    <th>ชื่อลูกค้า / เบอร์</th>
                    <th width="300">รายละเอียด</th> 
                    <th>พนักงาน</th>
                    <th>เอกสาร</th>
                    <th width="200">จัดการ</th>
                </tr>
            </thead>
            <tbody id="dataTable">
                <tr><td colspan="8" style="text-align:center; padding:50px; color:#888;">กำลังโหลดข้อมูล...</td></tr>
            </tbody>
        </table>
    </div>

    <div id="pagination" class="pagination-container"></div>
    
    <p style="margin-top:30px; font-size:13px; color:rgba(0,0,0,0.5); font-weight: 500;">
        <i class="bi bi-c-circle"></i> 2026 Copyright by <strong>Angerina Frog</strong>
    </p>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz14y6ULzTcdbJrmHSsDuXUgh19BQL8bQGuh7OF6hPertx2fII5iVnk_R3g8qTQ97TK/exec';

    const jobTypes = [
        "Complaint", "MGM ปรับลด", "ยกเลิกบริการ (ปกติ)", "ยกเลิกบริการ (5P)", "MNP",
        "เปลี่ยนรายเดือนเป็นเติมเงิน", "เปลี่ยนโปรโมชั่น", "Add ส่วนลด",
        "Delete ส่วนลด" , "Add เน็ตเพิ่ม", "ระงับสัญญาณชั่วคราวTOL", 
        "ส่งเรื่องตรวจสอบ", "ขอเงินคืน" , "งานเก็บไว้เช็ค" , "TRUE MOBILE CARE" ,
        "ฝากไฟล์งานเฉยๆ"
    ];

    let fullData = [];
    let filteredData = [];
    let currentPage = 1;
    const itemsPerPage = 10;
    
    let selectedFiles = []; 
    let existingFiles = []; 

    const dragBtn = document.getElementById('floatingMenuBtn');
    const sideFloat = document.getElementById('sidebarFloat');
    const sideOverlay = document.getElementById('sidebarOverlay');
    let isDragging = false;
    let startX, startY, shiftX, shiftY;

    // Helper Function สำหรับดึงข้อมูลผ่าน Fetch ป้องกัน Timeout สายหลุด
    async function fetchWithTimeout(url, options = {}, timeout = 10000) {
        const controller = new AbortController();
        const id = setTimeout(() => controller.abort(), timeout);
        try {
            const response = await fetch(url, { ...options, signal: controller.signal });
            clearTimeout(id);
            return response;
        } catch (error) {
            clearTimeout(id);
            throw error;
        }
    }

    function parseCustomDate(dateVal) {
        if (!dateVal || dateVal === "-" || dateVal === "") return null;
        if (dateVal instanceof Date) return isNaN(dateVal) ? null : dateVal;
        
        if (typeof dateVal === 'string') {
            const parts = dateVal.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (parts) {
                const day = parseInt(parts[1], 10);
                const month = parseInt(parts[2], 10) - 1; 
                const year = parseInt(parts[3], 10);
                return new Date(year, month, day);
            }
        }
        const d = new Date(dateVal);
        return isNaN(d) ? null : d;
    }

    function fixDate(dateVal) {
        const d = parseCustomDate(dateVal);
        if (!d) return (dateVal && dateVal !== "") ? dateVal : "-";
        return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
    }

    function formatForInputDate(dateVal) {
        const d = parseCustomDate(dateVal);
        if (!d) return "";
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function generateReportId() {
        return Math.floor(1000000000 + Math.random() * 9000000000).toString();
    }

    function loadButtonPosition() {
        const savedLeft = localStorage.getItem('floatBtnLeft');
        const savedTop = localStorage.getItem('floatBtnTop');
        if (savedLeft && savedTop) {
            dragBtn.style.left = savedLeft + 'px';
            dragBtn.style.top = savedTop + 'px';
        }
    }

    dragBtn.onpointerdown = function(e) {
        isDragging = false;
        startX = e.clientX; startY = e.clientY;
        const rect = dragBtn.getBoundingClientRect();
        shiftX = e.clientX - rect.left; shiftY = e.clientY - rect.top;
        dragBtn.setPointerCapture(e.pointerId);
        document.addEventListener('pointermove', onPointerMove);
        document.addEventListener('pointerup', onPointerUp);
    };

    function onPointerMove(e) {
        if (!isDragging && (Math.abs(e.clientX - startX) > 5 || Math.abs(e.clientY - startY) > 5)) isDragging = true;
        if (isDragging) {
            let newX = e.clientX - shiftX; let newY = e.clientY - shiftY;
            newX = Math.max(0, Math.min(newX, window.innerWidth - dragBtn.offsetWidth));
            newY = Math.max(0, Math.min(newY, window.innerHeight - dragBtn.offsetHeight));
            dragBtn.style.left = newX + 'px'; dragBtn.style.top = newY + 'px';
        }
    }

    function onPointerUp(e) {
        document.removeEventListener('pointermove', onPointerMove);
        document.removeEventListener('pointerup', onPointerUp);
        dragBtn.releasePointerCapture(e.pointerId);
        if (isDragging) {
            localStorage.setItem('floatBtnLeft', dragBtn.offsetLeft);
            localStorage.setItem('floatBtnTop', dragBtn.offsetTop);
        } else { toggleSidebarFloat(); }
        isDragging = false;
    }

    function toggleSidebarFloat() {
        const btnRect = dragBtn.getBoundingClientRect();
        const sidebarWidth = 280;
        let top = btnRect.bottom + 10;
        let left = btnRect.left;
        if (left + sidebarWidth > window.innerWidth) left = window.innerWidth - sidebarWidth - 15;
        if (top + 400 > window.innerHeight) { top = btnRect.top - 410; if (top < 10) top = 10; }
        sideFloat.style.top = top + 'px'; sideFloat.style.left = left + 'px';
        sideFloat.style.transformOrigin = `${btnRect.left - left + 20}px ${btnRect.top > top ? 'bottom' : 'top'}`;
        const isActive = sideFloat.classList.toggle('active');
        sideOverlay.classList.toggle('active', isActive);
        if (isActive && !sideFloat.innerHTML) loadSidebarContent();
    }

    function closeSidebarFloat() {
        sideFloat.classList.remove('active');
        sideOverlay.classList.remove('active');
    }

    function loadSidebarContent() {
        fetch('sidebar.html')
            .then(res => res.text())
            .then(data => {
                sideFloat.innerHTML = `<div class="sidebar-header">เมนูนำทาง</div>` + data;
                ['credit', 'branch', 'sales'].forEach(id => {
                    if (localStorage.getItem('menu-' + id) === 'true') {
                        const el = sideFloat.querySelector('#menu-' + id);
                        if (el) el.classList.add('open');
                    }
                });
            }).catch(err => console.log("Sidebar load failed"));
    }

    window.toggleDrop = function(btn, id) {
        const item = btn.parentElement;
        const isOpen = item.classList.toggle("open");
        if (id) localStorage.setItem('menu-' + id, isOpen);
    }

    window.onscroll = function() {
        const btn = document.getElementById("btn-back-to-top");
        if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) btn.classList.add("show");
        else btn.classList.remove("show");
    };

    function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

    function updateStats(data) {
        const statsCon = document.getElementById('statsContainer');
        const counts = {};
        let processingCount = 0;
        let pinnedCount = 0;
        let deadlineCount = 0;
        let dailyCount = 0;
        let overdueCount = 0;
        let complaintCount = 0; 
        
        const todayStr = formatForInputDate(new Date());
        
        jobTypes.forEach(t => counts[t] = 0);
        data.forEach(row => {
            const type = row[8] || "ทั่วไป";
            if(counts[type] !== undefined) counts[type]++;
            if(row._isPinned) pinnedCount++;
            if(row._isProcessing) processingCount++;
            
            if(type === "Complaint") complaintCount++;
            
            if(row._isDaily) {
                dailyCount++;
            } else {
                if (row._deadlineStr === todayStr) {
                    deadlineCount++;
                } else if (row._isOverdue) {
                    overdueCount++;
                }
            }
        });
        
        let cardsHtml = `
            <div class="stat-card-long complaint-card" onclick="filterByType('Complaint', this)">
                <div class="info">
                    <span class="title">Complaint เร่งด่วน</span>
                    <span class="title">(ต้องเคลียร์ทันที!)</span>
                    <span class="date-label">เคสลูกค้าร้องเรียน</span>
                </div>
                <div class="count-val">${complaintCount} รายการ</div>
            </div>
            <div class="stat-card-long overdue-card" onclick="filterByOverdue(this)">
                <div class="info">
                    <span class="title">งานที่เลยกำหนด</span>
                    <span class="title">(โดนปรับแน่!)</span>
                    <span class="date-label">ถ้ายังเห็น!</span>
                </div>
                <div class="count-val">${overdueCount} รายการ</div>
            </div>
            <div class="stat-card-long" onclick="filterByDeadline(this)">
                <div class="info">
                    <span class="title">ครบที่กำหนด</span>
                    <span class="title">(วันนี้)</span>
                    <span class="date-label">${fixDate(new Date())}</span>
                </div>
                <div class="count-val">${deadlineCount} รายการ</div>
            </div>
            <div class="stat-card-long daily-card" onclick="filterByDaily(this)">
                <div class="info">
                    <span class="title">แสดงงานทุกวัน</span>
                    <span class="title">(Infinity Mode)</span>
                    <span class="date-label">ติดตามงาน</span>
                </div>
                <div class="count-val">${dailyCount} รายการ</div>
            </div>
            <div class="stat-card active" onclick="filterByType('ทั้งหมด', this)">
                <span class="count">${data.length}</span>
                <span class="label">ทั้งหมด</span>
            </div>
            <div class="stat-card pinned-stat" onclick="filterByPinned(this)">
                <span class="count">${pinnedCount}</span>
                <span class="label">ปักหมุด</span>
            </div>
            <div class="stat-card processing-stat" onclick="filterByProcessing(this)">
                <span class="count">${processingCount}</span>
                <span class="label">กำลังดำเนินการ</span>
            </div>
        `;
        jobTypes.forEach(type => {
            let specialClass = "";
            if (type === "Complaint") specialClass = " complaint-stat";
            cardsHtml += `<div class="stat-card${specialClass}" onclick="filterByType('${type}', this)"><span class="count">${counts[type]}</span><span class="label">${type}</span></div>`;
        });
        statsCon.innerHTML = cardsHtml;
    }

    function filterByOverdue(el) {
        document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active'));
        filteredData = fullData.filter(row => row._isOverdue);
        currentPage = 1; renderTable();
    }

    function filterByDeadline(el) {
        document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active'));
        const todayStr = formatForInputDate(new Date());
        filteredData = fullData.filter(row => row._deadlineStr === todayStr && !row._isDaily);
        currentPage = 1; renderTable();
    }

    function filterByDaily(el) {
        document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active'));
        filteredData = fullData.filter(row => row._isDaily);
        currentPage = 1; renderTable();
    }

    function filterByPinned(el) {
        document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        filteredData = fullData.filter(row => row._isPinned);
        currentPage = 1; renderTable();
    }

    function filterByProcessing(el) {
        document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        filteredData = fullData.filter(row => row._isProcessing);
        currentPage = 1; renderTable();
    }

    function filterByType(type, el) {
        document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active'));
        if(el && el.classList.contains('stat-card')) el.classList.add('active');
        document.getElementById('searchInput').value = (type === 'ทั้งหมด') ? '' : type;
        filterData();
    }

    function clearAllFilters() {
        document.getElementById('dateFilter').value = "";
        document.getElementById('searchInput').value = "";
        filterData();
    }

    function clearSearch() {
        const searchInput = document.getElementById('searchInput');
        searchInput.value = "";
        searchInput.focus();
        filterData();
    }

    function filterData() {
        const filter = document.getElementById('searchInput').value.toLowerCase();
        const dateFilter = document.getElementById('dateFilter').value;
        filteredData = fullData.filter(row => {
            const matchesSearch = row._searchStr.includes(filter);
            const matchesDate = !dateFilter || row._deadlineStr === dateFilter || row._isDaily;
            return matchesSearch && matchesDate;
        });
        currentPage = 1; renderTable();
    }

    // ปรับแก้ระบบดึงข้อมูลให้เร็วขึ้นและลดอาการล้มเหลวด้วย Retry & Timeout Handling
    async function loadData(manual = false, retries = 1) {
        const tableBody = document.getElementById('dataTable');
        const refreshBtn = document.querySelector('.bi-arrow-clockwise');
        if(refreshBtn) refreshBtn.classList.add('bi-spin');
        
        try {
            const res = await fetchWithTimeout(SCRIPT_URL, { 
                method: 'POST', 
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({action: "read"}) 
            }, 8000); // ตั้ง Timeout ที่ 8 วินาที

            if (!res.ok) throw new Error(`HTTP Error: ${res.status}`);
            
            const data = await res.json();
            
            const today = new Date();
            today.setHours(0, 0, 0, 0);

            fullData = data.map(row => {
                const deadlineStr = formatForInputDate(row[10]);
                const isDaily = (row[12] === "true" || row[12] === true);
                const isPinned = (row[7] === "true" || row[7] === true);
                const isProcessing = (row[9] === "true" || row[9] === true);
                
                let isOverdue = false;
                if (!isDaily && row[10] && row[10] !== "-" && row[10] !== "") {
                    const dDate = parseCustomDate(row[10]);
                    isOverdue = dDate && dDate < today;
                }

                row._searchStr = row.join(' ').toLowerCase();
                row._deadlineStr = deadlineStr;
                row._isDaily = isDaily;
                row._isPinned = isPinned;
                row._isProcessing = isProcessing;
                row._isOverdue = isOverdue;
                return row;
            }).sort((a, b) => {
                if (a._isPinned !== b._isPinned) return a._isPinned ? -1 : 1;
                const dateA = parseCustomDate(a[0]) || 0;
                const dateB = parseCustomDate(b[0]) || 0;
                return dateB - dateA;
            });

            filterData();
            updateStats(fullData);
        } catch (e) { 
            console.error("Load attempt failed:", e);
            if (retries > 0) {
                // พยายามดึงใหม่อีก 1 ครั้งอัตโนมัติ
                setTimeout(() => loadData(manual, retries - 1), 1000);
            } else {
                tableBody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:30px; color:var(--ios-red);">ดึงข้อมูลไม่สำเร็จ กรุณากดปุ่มรีเฟรชอีกครั้ง</td></tr>'; 
            }
        } finally { 
            if(refreshBtn) refreshBtn.classList.remove('bi-spin'); 
        }
    }

    function renderTable() {
        const tableBody = document.getElementById('dataTable');
        tableBody.innerHTML = '';
        if (filteredData.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:50px; color:#888;">ไม่พบข้อมูล</td></tr>';
            renderPagination(0); return;
        }
        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const paginatedItems = filteredData.slice(startIndex, endIndex);
        
        paginatedItems.forEach(row => {
            const tr = document.createElement('tr');
            const isPinned = row._isPinned;
            const isProcessing = row._isProcessing;
            const isDaily = row._isDaily;
            const rawPass = row[13] ? String(row[13]).replace(/^'/, '') : "";
            const hasPassword = rawPass.trim() !== ""; 
            
            const reportId = row[11] || "-";
            const rowJson = encodeURIComponent(JSON.stringify(row));
            const deadlineDate = fixDate(row[10]);
            if (isPinned) tr.classList.add('pinned-row');
            
            const blurStyle = hasPassword ? 'filter: blur(5px); user-select: none; opacity: 0.6; display: inline-block;' : '';
            const lockIcon = hasPassword ? '<i class="bi bi-lock-fill" style="color:var(--ios-red); margin-right:6px;" title="ติดรหัสผ่าน"></i>' : '';
            
            let filesHtml = '-';
            if (hasPassword && row[5]) {
                filesHtml = '<span style="color:var(--ios-red); font-size:12px; font-weight:600;"><i class="bi bi-lock-fill"></i> ล็อคไฟล์</span>';
            } else if (row[5] && row[5] !== "-" && row[5] !== "") {
                const urls = row[5].split(", ");
                filesHtml = urls.map((u, i) => `<a href="${u}" target="_blank" style="color:var(--ios-blue); text-decoration:none; margin-right:5px;"><i class="bi bi-file-earmark-text"></i> ${i+1}</a>`).join('');
            }
            
            const isOverdueItem = row._isOverdue;
            const currentJobType = row[8] || "ทั่วไป";
            const isComplaintType = currentJobType === "Complaint";

            tr.innerHTML = `
                <td><strong>${fixDate(row[0])}</strong><span class="report-id-label">ID: ${reportId}</span></td>
                <td><span class="job-type-badge${isComplaintType ? ' complaint-badge' : ''}">${currentJobType}</span></td>
                <td onclick="checkPasswordAndShow('${rowJson}')" style="cursor:pointer; font-weight:600; color:var(--ios-blue);">
                    ${lockIcon}<span style="${blurStyle}">${String(row[1]||'').replace(/^'/, '')}</span>
                </td>
                <td onclick="checkPasswordAndShow('${rowJson}')" style="cursor:pointer;">
                    <span style="${blurStyle}">${row[2]||''}<br><small style="color:#8e8e93">${String(row[3]||'').replace(/^'/, '')}</small></span>
                </td>
                <td onclick="checkPasswordAndShow('${rowJson}')" style="cursor:pointer;">
                    <div style="max-width:300px; max-height:100px; overflow:hidden; white-space:normal; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; color:#666; font-size:13px; line-height:1.4; ${blurStyle}">${String(row[6]||'-').replace(/^'/, '')}</div>
                </td>
                <td>${row[4]||''}</td>
                <td onclick="checkPasswordAndShow('${rowJson}')" style="cursor:${hasPassword ? 'pointer' : 'default'};">${filesHtml}</td>
                <td>
                    <div class="action-btns-container">
                        <div class="action-btns">
                            <button class="btn-pin ${isPinned ? 'active' : ''}" onclick="togglePin('${reportId}')" title="ปักหมุด"><i class="bi bi-pin-angle-fill"></i></button>
                            <button class="btn-process ${isProcessing ? 'active' : ''}" onclick="toggleProcessing('${reportId}')" title="กำลังดำเนินการ"><i class="bi bi-clock-history"></i></button>
                            <button class="btn-daily ${isDaily ? 'active' : ''}" onclick="toggleDaily('${reportId}')" title="แสดงงานนี้ทุกวัน"><i class="bi bi-infinity"></i></button>
                            <button class="btn-edit" onclick="editData('${rowJson}')" title="แก้ไขข้อมูล"><i class="bi bi-pencil-square"></i></button>
                            <button class="btn-delete" onclick="deleteData('${reportId}')" title="ลบรายการ"><i class="bi bi-trash3-fill"></i></button>
                        </div>
                        ${isDaily ? `<span class="deadline-label-small" style="background:#f5eeff; color:var(--ios-purple); border-color:rgba(142,90,255,0.2);">แสดงทุกวัน (Infinity)</span>` : 
                          (deadlineDate !== "-" ? `<span class="deadline-label-small" style="${isOverdueItem ? 'background:#fff0f0; color:var(--ios-red); border-color:rgba(255,59,48,0.3);' : ''}">${isOverdueItem ? 'เลยกำหนด : ' : 'ครบกำหนด : '}${deadlineDate}</span>` : '')}
                    </div>
                </td>
            `;
            tableBody.appendChild(tr);
        });
        renderPagination(filteredData.length);
    }

    function renderPagination(totalItems) {
        const paginationCon = document.getElementById('pagination');
        paginationCon.innerHTML = '';
        const totalPages = Math.ceil(totalItems / itemsPerPage);
        if (totalPages <= 1) return;
        const prevBtn = document.createElement('button');
        prevBtn.className = 'pagination-btn'; prevBtn.innerHTML = '<i class="bi bi-chevron-left"></i>';
        prevBtn.disabled = currentPage === 1;
        prevBtn.onclick = () => { currentPage--; renderTable(); scrollToTop(); };
        paginationCon.appendChild(prevBtn);
        for (let i = 1; i <= totalPages; i++) {
            const pageBtn = document.createElement('button');
            pageBtn.className = `pagination-btn ${i === currentPage ? 'active' : ''}`;
            pageBtn.innerText = i;
            pageBtn.onclick = () => { currentPage = i; renderTable(); scrollToTop(); };
            paginationCon.appendChild(pageBtn);
        }
        const nextBtn = document.createElement('button');
        nextBtn.className = 'pagination-btn'; nextBtn.innerHTML = '<i class="bi bi-chevron-right"></i>';
        nextBtn.disabled = currentPage === totalPages;
        nextBtn.onclick = () => { currentPage++; renderTable(); scrollToTop(); };
        paginationCon.appendChild(nextBtn);
    }

    async function toggleProcessing(reportId) {
        const idx = fullData.findIndex(r => r[11] == reportId);
        if(idx !== -1) {
            fullData[idx]._isProcessing = !fullData[idx]._isProcessing;
            fullData[idx][9] = String(fullData[idx]._isProcessing);
            filterData(); updateStats(fullData); 
        }
        try { 
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: "toggleProcessing", reportId: reportId }) }); 
        } catch (e) { loadData(); }
    }

    async function togglePin(reportId) {
        const idx = fullData.findIndex(r => r[11] == reportId);
        if(idx !== -1) {
            fullData[idx]._isPinned = !fullData[idx]._isPinned;
            fullData[idx][7] = String(fullData[idx]._isPinned);
            fullData.sort((a, b) => {
                if (a._isPinned !== b._isPinned) return a._isPinned ? -1 : 1;
                const dateA = parseCustomDate(a[0]) || 0;
                const dateB = parseCustomDate(b[0]) || 0;
                return dateB - dateA;
            });
            filterData(); updateStats(fullData);
        }
        try {

    async function toggleDaily(reportId) {
        const idx = fullData.findIndex(r => r[11] == reportId);
        if(idx !== -1) {
            fullData[idx]._isDaily = !fullData[idx]._isDaily;
            fullData[idx][12] = String(fullData[idx]._isDaily);
            
            if (fullData[idx]._isDaily) {
                fullData[idx]._isOverdue = false;
            } else if (fullData[idx][10] && fullData[idx][10] !== "-" && fullData[idx][10] !== "") {
                const today = new Date(); today.setHours(0,0,0,0);
                const dDate = parseCustomDate(fullData[idx][10]);
                fullData[idx]._isOverdue = dDate && dDate < today;
            }
            
            filterData(); updateStats(fullData);
        }
        try { 
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: "toggleDaily", reportId: reportId }) }); 
        } catch (e) { loadData(); }
    }

    window.handleFileSelect = async function(event) {
        const files = event.target.files;
        for (let i = 0; i < files.length; i++) {
            if (selectedFiles.length + existingFiles.length >= 5) { break; }
            const file = files[i];
            const reader = new FileReader();
            const filePromise = new Promise(resolve => {
                reader.onload = () => resolve({ name: file.name, data: reader.result, id: Date.now() + Math.random() });
                reader.readAsDataURL(file);
            });
            const fileObj = await filePromise;
            selectedFiles.push(fileObj);
        }
        event.target.value = ""; renderSelectedFiles();
    };

    window.removeFile = function(id) {
        selectedFiles = selectedFiles.filter(f => f.id !== id); renderSelectedFiles();
    };
    
    window.removeExistingFile = function(url) {
        existingFiles = existingFiles.filter(u => u !== url); renderSelectedFiles();
    };

    function renderSelectedFiles() {
        const fileListDiv = document.getElementById('selectedFileList');
        if (!fileListDiv) return;
        let html = '';
        existingFiles.forEach((url, idx) => {
            html += `<div class="file-item existing-file-item"><span onclick="window.open('${url}', '_blank')" style="cursor:pointer; color:var(--ios-blue); text-decoration:underline;"><i class="bi bi-cloud-fill"></i> ไฟล์เดิม ${idx + 1}</span><span class="remove-file" onclick="removeExistingFile('${url}')"><i class="bi bi-trash"></i></span></div>`;
        });
        selectedFiles.forEach(file => {
            html += `<div class="file-item"><span><i class="bi bi-file-earmark"></i> ${file.name}</span><span class="remove-file" onclick="removeFile(${file.id})"><i class="bi bi-x-circle-fill"></i></span></div>`;
        });
        fileListDiv.innerHTML = html;
    }

                    if (value !== pass) return 'รหัสผ่านไม่ถูกต้อง!';
                }
            }).then((result) => {
                if (result.isConfirmed) proceedToEdit(rowJson);
            });
        } else { proceedToEdit(rowJson); }
    }

    function proceedToEdit(rowJson) {
        const item = JSON.parse(decodeURIComponent(rowJson));
        
        selectedFiles = []; 
        existingFiles = (item[5] && item[5] !== "-" && item[5] !== "") ? item[5].split(", ") : []; 
        
        let typeOptions = `<option value="">-- เลือกประเภทงาน --</option>`;
        jobTypes.forEach(t => { typeOptions += `<option value="${t}" ${item[8] === t ? 'selected' : ''}>${t}</option>`; });
        
        let staffOptions = `<option value="">-- เลือกพนักงาน --</option>`;
        ['ศุภกฤต', 'นวพล', 'ปิยะพร', 'กรทักษ์', 'พจมาลย์'].forEach(s => {
            staffOptions += `<option value="${s}" ${item[4] === s ? 'selected' : ''}>${s}</option>`;
        });
        
        Swal.fire({
            title: 'แก้ไขข้อมูล: ' + (item[11] || ''),
            customClass: { popup: 'swal-modal-custom' }, width: '700px',
            allowOutsideClick: false,
            html: `
                <div class="swal-form-container">
                    <div class="swal-field-full"><label class="swal-label">ประเภทงาน</label><select id="swal-jobType" class="swal-input-styled">${typeOptions}</select></div>
                    <div><label class="swal-label">วันที่</label><input type="date" id="swal-date" class="swal-input-styled" value="${formatForInputDate(item[0])}"></div>
                    <div><label class="swal-label">รหัสสมาชิก</label><input type="text" id="swal-memberId" class="swal-input-styled" value="${String(item[1]||'').replace(/^'/, '')}"></div>
                    <div class="swal-field-full"><label class="swal-label">ชื่อลูกค้า</label><input type="text" id="swal-name" class="swal-input-styled" value="${item[2]||''}"></div>
                    <div><label class="swal-label">เบอร์ติดต่อ</label><input type="text" id="swal-phone" class="swal-input-styled" value="${String(item[3]||'').replace(/^'/, '')}" maxlength="10"></div>
                    <div><label class="swal-label">พนักงาน</label><select id="swal-staff" class="swal-input-styled">${staffOptions}</select></div>
                    
                    <div><label class="swal-label">วันครบกำหนดงาน</label><input type="date" id="swal-deadline" class="swal-input-styled" value="${formatForInputDate(item[10])}"></div>
                    <div>
                        <label class="swal-label" style="color:var(--ios-red);"><i class="bi bi-lock-fill"></i> รหัสผ่านล็อคงาน</label>
                        <input type="text" id="swal-jobPassword" class="swal-input-styled" value="${String(item[13]||'').replace(/^'/, '')}" placeholder="กำหนดรหัสผ่าน">
                    </div>

                    <div class="swal-field-full" style="display:flex; align-items:center; gap:10px; background:#f5eeff; padding:10px; border-radius:14px; border:1px dashed var(--ios-purple);">
                        <input type="checkbox" id="swal-isDaily" style="width:20px; height:20px; cursor:pointer;" ${item[12] === 'true' ? 'checked' : ''}>
                        <label for="swal-isDaily" style="font-size:14px; font-weight:600; color:var(--ios-purple); cursor:pointer;">แสดงงานนี้ทุกวัน (Infinity Mode)</label>
                    </div>

                    <div class="swal-field-full"><label class="swal-label">รายละเอียด</label><textarea id="swal-jobDetail" class="swal-input-styled" style="height:160px; resize:none;">${String(item[6] || '').replace(/^'/, '')}</textarea></div>
                    <div class="swal-field-full">
                        <label class="swal-label">จัดการไฟล์แนบ</label>
                        <input type="file" id="file" class="swal-input-styled" onchange="handleFileSelect(event)" multiple>
                        <div id="selectedFileList" class="file-list"></div>
                    </div>
                </div>
            `,
            didOpen: () => renderSelectedFiles(),
            showCancelButton: true, confirmButtonText: 'บันทึกการแก้ไข',
            preConfirm: () => {
                const memberIdVal = document.getElementById('swal-memberId').value.trim();
                const phoneVal = document.getElementById('swal-phone').value.trim();
                const staffVal = document.getElementById('swal-staff').value;
                if (!memberIdVal || !phoneVal || !staffVal) { Swal.showValidationMessage('กรุณากรอกข้อมูลและเลือกชื่อพนักงานให้ครบถ้วน'); return false; }
                return { 
                    action: "update", reportId: item[11], date: document.getElementById('swal-date').value, 
                    memberId: "'" + memberIdVal, 
                    name: document.getElementById('swal-name').value, phone: "'" + phoneVal, 
                    staff: staffVal, jobDetail: "'" + document.getElementById('swal-jobDetail').value, 
                    jobType: document.getElementById('swal-jobType').value, deadline: document.getElementById('swal-deadline').value,
                    isDaily: document.getElementById('swal-isDaily').checked ? "true" : "",
                    password: "'" + document.getElementById('swal-jobPassword').value,
                    existingFiles: existingFiles, files: selectedFiles.map(f => ({name: f.name, data: f.data})) 
                };
            }
        }).then(async (result) => {
            if (result.isConfirmed) {
                Swal.fire({title: 'กำลังอัพเดท...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});
                try {
                    const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(result.value) });
                    const serverResponse = await res.json();
                    if(serverResponse.status === "success") {
                        Swal.fire({title: 'สำเร็จ', icon: 'success', timer: 1000, showConfirmButton: false}).then(() => {
                            const newType = result.value.jobType;
                            if(newType) { document.getElementById('searchInput').value = newType; }
                            currentPage = 1;
                            loadData(true);
                        });
                    } else { throw new Error('Server Error'); }
                } catch (e) {
                    console.error("Update error:", e);
                    Swal.fire('ผิดพลาด', 'ไม่สามารถอัพเดทได้', 'error');
                }
            }
        });
    }

    window.onload = () => { loadButtonPosition(); loadData(); };
</script>

</body>
</html>
