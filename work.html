<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log งานที่ต้องเคลียร์ - iOS Glass Design</title>
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.2);
            --glass-border: rgba(255, 255, 255, 0.3);
            --ios-blue: #007AFF;
        }

        body {
            background: linear-gradient(135deg, #8BC6EC 0%, #9599E2 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #1d1d1f;
        }

        .container {
            background: var(--glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
            margin-bottom: 30px;
        }

        h2 { text-align: center; font-weight: 600; margin-top: 0; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 0.9em; font-weight: 500; }
        
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.5);
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: var(--ios-blue);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:active { opacity: 0.7; }

        .list-container {
            width: 100%;
            max-width: 900px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            overflow: hidden;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--glass-border);
        }

        th { background: rgba(255, 255, 255, 0.3); }

        .btn-delete {
            background: #FF3B30;
            padding: 5px 10px;
            font-size: 12px;
            width: auto;
        }

        .link-file { color: var(--ios-blue); text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>

<div class="container">
    <h2>บันทึกงานใหม่</h2>
    <form id="jobForm">
        <div class="form-group">
            <label>วันที่</label>
            <input type="date" id="date" required>
        </div>
        <div class="form-group">
            <label>หมายเลขสมาชิก</label>
            <input type="text" id="memberId" placeholder="ระบุ ID" required>
        </div>
        <div class="form-group">
            <label>ชื่อ-นามสกุล ลูกค้า</label>
            <input type="text" id="name" placeholder="ชื่อลูกค้า" required>
        </div>
        <div class="form-group">
            <label>เบอร์ติดต่อ</label>
            <input type="tel" id="phone" placeholder="08x-xxxxxxx" required>
        </div>
        <div class="form-group">
            <label>พนักงานที่รับลูกค้า</label>
            <select id="staff">
                <option value="ศุภกฤต">ศุภกฤต</option>
                <option value="นวพล">นวพล</option>
                <option value="ปิยะพร">ปิยะพร</option>
                <option value="กรทักษ์">กรทักษ์</option>
            </select>
        </div>
        <div class="form-group">
            <label>แนบเอกสาร (รูปภาพ)</label>
            <input type="file" id="file" accept="image/*">
        </div>
        <button type="submit" id="submitBtn">บันทึกข้อมูล</button>
    </form>
</div>

<div class="list-container">
    <table>
        <thead>
            <tr>
                <th>วันที่</th>
                <th>สมาชิก</th>
                <th>ชื่อลูกค้า</th>
                <th>เบอร์ติดต่อ</th>
                <th>พนักงาน</th>
                <th>เอกสาร</th>
                <th>จัดการ</th>
            </tr>
        </thead>
        <tbody id="dataTable">
            </tbody>
    </table>
</div>

<script>
    // ** สำคัญ: วาง URL ที่ได้จาก Google Apps Script ที่นี่ **
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyB6RVkW06_kOyN2IwocFGi5yeJQpKWIyh0XM7gFBCRr2z7873IDnBFoZ6f_gm1Ja1TVQ/exec';

    // Set Default Date to Today
    document.getElementById('date').valueAsDate = new Date();

    const form = document.getElementById('jobForm');
    
    // Load Data on Start
    window.onload = loadData;

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "กำลังบันทึก...";

        const fileInput = document.getElementById('file');
        let fileData = null;

        if (fileInput.files.length > 0) {
            fileData = await toBase64(fileInput.files[0]);
        }

        const payload = {
            action: "insert",
            date: document.getElementById('date').value,
            memberId: document.getElementById('memberId').value,
            name: document.getElementById('name').value,
            phone: document.getElementById('phone').value,
            staff: document.getElementById('staff').value,
            fileData: fileData
        };

        await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        });

        form.reset();
        document.getElementById('date').valueAsDate = new Date();
        btn.disabled = false;
        btn.innerText = "บันทึกข้อมูล";
        loadData();
    });

    async function loadData() {
        const response = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({action: "read"})
        });
        const data = await response.json();
        const tableBody = document.getElementById('dataTable');
        tableBody.innerHTML = '';

        data.forEach(row => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${row[0]}</td>
                <td>${row[1]}</td>
                <td>${row[2]}</td>
                <td>${row[3]}</td>
                <td>${row[4]}</td>
                <td>${row[5] ? `<a href="${row[5]}" target="_blank" class="link-file">กดที่นี่เพื่อดูเอกสาร</a>` : '-'}</td>
                <td><button class="btn-delete" onclick="deleteData('${row[0]}', '${row[1]}')">ลบ</button></td>
            `;
            tableBody.appendChild(tr);
        });
    }

    async function deleteData(date, memberId) {
        if(!confirm("ยืนยันการลบข้อมูล?")) return;
        await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({action: "delete", date: date, memberId: memberId})
        });
        loadData();
    }

    const toBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
</script>

</body>
</html>
