<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเคลียร์งาน - Parakit-site</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --ios-blue: #007aff;
            --ios-bg: #f2f2f7;
            --glass-white: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.5);
            --sidebar-dark: rgba(28, 28, 30, 0.94);
            --text-main: #1c1c1e;
            --text-light: #8e8e93;
            --sidebar-width: 280px;
            --ios-red: #FF3B30;
            --ios-green: #34C759;
            --transition-swift: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; }

        html, body, input, select, textarea, button, span, div {
            font-family: 'Kanit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol" !important;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        body { 
            margin: 0; 
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            background-attachment: fixed;
            color: var(--text-main); 
            padding-bottom: 60px;
            transition: padding-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .top-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 60px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            z-index: 1200;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 0.5px solid rgba(0,0,0,0.1);
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .top-toggle {
            width: 36px; height: 36px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--ios-blue);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            transition: background 0.2s;
        }
        .top-toggle:hover { background: rgba(0, 122, 255, 0.1); }

        .sidebar { 
            position: fixed; top: 0; left: 0; 
            width: var(--sidebar-width); height: 100vh; 
            background: var(--sidebar-dark); 
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            color: #fff; overflow-y: auto; 
            transition: all .3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2000;
            box-shadow: 10px 0 30px rgba(0,0,0,0.1);
        }
        
        @media(min-width:769px) { 
            body:not(.collapsed) { padding-left: var(--sidebar-width); }
            body:not(.collapsed) .top-header { left: var(--sidebar-width); }
            body.collapsed .sidebar { transform: translateX(-100%); }
            body.collapsed .top-header { left: 0; }
        }

        @media(max-width:768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.show { transform: translateX(0); }
            body { padding-left: 0 !important; }
            .top-header { left: 0 !important; }
        }

        .overlay { 
            position: fixed; inset: 0; 
            background: rgba(0, 0, 0, 0.3); 
            backdrop-filter: blur(4px); 
            display: none; z-index: 1500; 
        }
        .overlay.show { display: block; }

        .sidebar-header { padding: 30px 20px; font-size: 20px; font-weight: 600; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
        .menu { padding: 10px 0; }
        .menu a, .menu .drop-btn { 
            width: 100%; min-height: 50px; padding: 12px 20px; background: none; border: none; 
            color: #ebebf5; text-align: left; font-size: 15px; cursor: pointer; 
            display: flex; align-items: center; text-decoration: none; transition: 0.3s;
        }
        .menu a:hover, .menu .drop-btn:hover { background: rgba(255,255,255,0.1); padding-left: 30px; }
        .sub { display: none; background: rgba(0,0,0,0.2); }
        .item.open .sub { display: block; }
        .sub a { padding-left: 45px; font-size: 14px; color: #8e8e93; }

        .main-content { display: flex; flex-direction: column; align-items: center; padding: 100px 20px 40px; animation: fadeIn 0.6s ease-out; }
        .glass-card { background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(20px); border-radius: 24px; border: 1px solid var(--glass-border); box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .container { padding: 30px; width: 100%; max-width: 650px; margin-bottom: 40px; }
        
        h2 { text-align: center; margin-bottom: 25px; font-size: 24px; color: #1c1c1e; font-weight: 600; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; }
        input, select, textarea {
            width: 100%; padding: 12px 15px; border-radius: 12px; border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.6); font-size: 15px; outline: none; transition: 0.3s;
        }
        input:focus, select:focus, textarea:focus { background: white; border-color: var(--ios-blue); box-shadow: 0 0 0 4px rgba(0,122,255,0.1); }
        .btn-submit {
            width: 100%; padding: 15px; border: none; border-radius: 12px;
            background: var(--ios-blue); color: white; font-size: 16px; font-weight: 600;
            cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-submit:hover { opacity: 0.9; transform: scale(1.01); }

        /* --- Search Styles --- */
        .search-container { 
            width: 100%; 
            max-width: 1200px; 
            display: flex; 
            justify-content: flex-end; 
            margin-bottom: 15px; 
        }
        .search-wrapper { 
            width: 100%; 
            max-width: 320px; 
            position: relative; 
        }
        .search-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-light); }
        .search-input { padding-left: 40px !important; border-radius: 15px !important; background: rgba(255, 255, 255, 0.5); }

        .list-container { width: 100%; max-width: 1200px; }
        .table-wrapper { overflow-x: auto; border-radius: 20px; background: rgba(255,255,255,0.4); }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { background: rgba(255, 255, 255, 0.5); padding: 15px; text-align: left; font-size: 14px; color: #444; border-bottom: 1px solid rgba(0,0,0,0.05); font-weight: 600; }
        td { padding: 14px 15px; border-bottom: 1px solid rgba(255,255,255,0.3); font-size: 14px; }

        .clickable { cursor: pointer; }
        .clickable:hover { color: var(--ios-blue); text-decoration: underline; }
        
        .text-truncate { 
            max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
            font-size: 13px; color: #555;
        }

        .btn-edit { background: #eef7ed; color: var(--ios-green); border: 1px solid #dcf0db; padding: 6px 10px; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-right: 5px; }
        .btn-edit:hover { background: var(--ios-green); color: white; }
        .btn-delete { background: #fff0f0; color: var(--ios-red); border: 1px solid #ffdada; padding: 6px 10px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .btn-delete:hover { background: var(--ios-red); color: white; }

        /* --- SweetAlert Custom Styles (จุดที่แก้ไข) --- */
        .swal2-container { z-index: 9999 !important; } /* ให้ pop up อยู่บนสุด */
        .swal2-popup { 
            border-radius: 24px !important; 
            padding: 20px !important;
            font-family: 'Kanit', sans-serif !important;
        }
        .swal2-title { font-size: 1.25rem !important; font-weight: 600 !important; color: #1c1c1e !important; }
        .swal2-html-container { font-size: 16px !important; line-height: 1.6 !important; }
        .swal2-input, .swal2-textarea, .swal2-select { 
            font-size: 16px !important; 
            border-radius: 12px !important; 
            border: 1px solid #ddd !important;
            margin: 10px auto !important;
        }
        .swal2-confirm, .swal2-cancel { 
            border-radius: 12px !important; 
            font-size: 16px !important; 
            padding: 10px 24px !important;
            font-weight: 500 !important;
        }

        .detail-row { display: flex; margin-bottom: 8px; border-bottom: 0.5px solid #eee; padding-bottom: 6px; }
        .detail-label { font-weight: 600; width: 110px; color: #666; flex-shrink: 0; font-size: 16px; }
        .detail-value { font-size: 16px; color: #333; }
        /* ------------------------------------------- */
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            .container { padding: 20px; }
            .text-truncate { max-width: 100%; white-space: normal; }
            .search-container { justify-content: center; }
            .search-wrapper { max-width: 100%; }
        }
    </style>
</head>
<body>

<header class="top-header">
    <button class="top-toggle" onclick="toggleSidebar()">☰</button>
    <div style="font-weight: 700; font-size: 1.25rem; color: var(--text-main); letter-spacing: -0.8px; margin-left: 15px;">ระบบเคลียร์งาน</div>
</header>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<aside class="sidebar" id="sidebar"></aside>

<div class="main-content">
    <div class="container glass-card">
        <h2><i class="fa-solid fa-edit"></i> บันทึกงานกันลืม</h2>
        <form id="jobForm">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group">
                    <label>วันที่ดำเนินการ</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label>หมายเลขสมาชิก</label>
                    <input type="text" id="memberId" placeholder="TMH/TOL/TVS" required>
                </div>
            </div>
            <div class="form-group">
                <label>ชื่อลูกค้า</label>
                <input type="text" id="name" placeholder="ชื่อ-นามสกุล" required>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group">
                    <label>เบอร์ติดต่อ</label>
                    <input type="text" id="phone" placeholder="0XXXXXXXXX" required>
                </div>
                <div class="form-group">
                    <label>พนักงาน</label>
                    <select id="staff" required>
                        <option value="">-- เลือก --</option>
                        <option value="ศุภกฤต">ศุภกฤต</option>
                        <option value="นวพล">นวพล</option>
                        <option value="ปิยะพร">ปิยะพร</option>
                        <option value="กรทักษ์">กรทักษ์</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>รายละเอียดงาน</label>
                <textarea id="jobDetail" rows="3" placeholder="ระบุรายละเอียดงาน..."></textarea>
            </div>
            <div class="form-group">
                <label>แนบรูป (ถ้ามี)</label>
                <input type="file" id="file" accept="image/*">
            </div>
            <button type="submit" id="submitBtn" class="btn-submit">บันทึกข้อมูล</button>
        </form>
    </div>

    <div class="search-container">
        <div class="search-wrapper">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="ค้นหาข้อมูล..." onkeyup="filterData()">
        </div>
    </div>

    <div class="list-container">
        <div class="table-wrapper glass-card">
            <table>
                <thead>
                    <tr>
                        <th>วันที่</th>
                        <th>รหัสสมาชิก</th>
                        <th>ชื่อลูกค้า / เบอร์</th>
                        <th>รายละเอียด</th>
                        <th>พนักงาน</th>
                        <th>เอกสาร</th>
                        <th>จัดการ</th>
                    </tr>
                </thead>
                <tbody id="dataTable"></tbody>
            </table>
        </div>
    </div>
    <p style="margin-top:20px; font-size:12px; color:#888;">© 2026 Copy Right By Angerina Frog</p>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby0SPBWiQUbLa_-GfB08M4G_i3i2E_GBJqas9eJUe7W0h1hh4wKDKKtyms3ToJWCJ_5/exec';

    // --- 1. ระบบ Sidebar System (คงเดิม 100%) ---
    function includeSidebar() {
        const cached = localStorage.getItem('sidebar_cache');
        if (cached) {
            document.getElementById('sidebar').innerHTML = cached;
            restoreMenuState();
        }

        fetch('sidebar.html')
            .then(response => response.text())
            .then(data => {
                if (data !== cached) {
                    document.getElementById('sidebar').innerHTML = data;
                    localStorage.setItem('sidebar_cache', data);
                    restoreMenuState();
                }
            })
            .catch(err => console.warn("Sidebar Load Error"));
            
        if(localStorage.getItem('sidebar_collapsed') === 'true' && window.innerWidth > 768) {
            document.body.classList.add('collapsed');
        }
    }

    function toggleSidebar() {
        if (window.innerWidth <= 768) {
            document.getElementById("sidebar").classList.toggle("show");
            document.getElementById("overlay").classList.toggle("show");
        } else {
            const isCollapsed = document.body.classList.toggle("collapsed");
            localStorage.setItem('sidebar_collapsed', isCollapsed);
        }
    }

    window.toggleDrop = function(btn, id) {
        const item = btn.parentElement;
        const isOpen = item.classList.toggle("open");
        if (id) localStorage.setItem('menu-' + id, isOpen);
    }

    function restoreMenuState() {
        ['credit', 'branch', 'sales'].forEach(id => {
            if (localStorage.getItem('menu-' + id) === 'true') {
                const el = document.getElementById('menu-' + id);
                if (el) el.classList.add('open');
            }
        });
    }

    // --- 2. ระบบจัดการข้อมูล ---
    function fixDate(dateVal) {
        if (!dateVal) return "-";
        const d = new Date(dateVal);
        if (isNaN(d)) return dateVal;
        return `${String(d.getDate()).padStart(2, '0')}-${String(d.getMonth() + 1).padStart(2, '0')}-${d.getFullYear()}`;
    }

    function formatForInputDate(dateVal) {
        const d = new Date(dateVal);
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function filterData() {
        const input = document.getElementById('searchInput');
        const filter = input.value.toLowerCase();
        const tbody = document.getElementById('dataTable');
        const rows = tbody.getElementsByTagName('tr');

        for (let i = 0; i < rows.length; i++) {
            const text = rows[i].textContent || rows[i].innerText;
            if (text.toLowerCase().indexOf(filter) > -1) {
                rows[i].style.display = "";
            } else {
                rows[i].style.display = "none";
            }
        }
    }

    function showFullDetail(rowJson) {
        const item = JSON.parse(decodeURIComponent(rowJson));
        const imageUrl = item[5]; 
        
        let html = `
            <div style="text-align: left;">
                <div class="detail-row"><div class="detail-label">วันที่:</div><div class="detail-value">${fixDate(item[0])}</div></div>
                <div class="detail-row"><div class="detail-label">รหัสสมาชิก:</div><div class="detail-value">${String(item[1]).replace(/^'/, '')}</div></div>
                <div class="detail-row"><div class="detail-label">ลูกค้า:</div><div class="detail-value">${item[2]}</div></div>
                <div class="detail-row"><div class="detail-label">เบอร์ติดต่อ:</div><div class="detail-value">${String(item[3]).replace(/^'/, '')}</div></div>
                <div class="detail-row"><div class="detail-label">พนักงาน:</div><div class="detail-value">${item[4]}</div></div>
                <div class="detail-row" style="border-bottom:none;"><div class="detail-label">รายละเอียด:</div><div class="detail-value" style="white-space:pre-wrap;">${item[6] || '-'}</div></div>
        `;

        if (imageUrl) {
            html += `
                <div style="margin-top:20px; text-align:center;">
                    <a href="${imageUrl}" target="_blank" style="display:inline-block; background:var(--ios-blue); color:white; padding:10px 20px; border-radius:12px; text-decoration:none; font-size:13px; font-weight:500;">
                        <i class="fa-solid fa-image"></i> ดูรูปภาพที่แนบไว้
                    </a>
                </div>
            `;
        }
        html += `</div>`;

        Swal.fire({ 
            title: 'รายละเอียดงาน', 
            html: html, 
            showCancelButton: true,
            confirmButtonText: '<i class="fa-solid fa-pen-to-square"></i> แก้ไข', 
            cancelButtonText: 'ปิด',
            confirmButtonColor: '#34C759', 
            cancelButtonColor: '#8e8e93',
            width: '700px' 
        }).then((result) => {
            if (result.isConfirmed) {
                editData(rowJson);
            }
        });
    }

    async function loadData() {
        const tableBody = document.getElementById('dataTable');
        tableBody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:30px;">กำลังดึงข้อมูล...</td></tr>';
        
        try {
            const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({action: "read"}) });
            const data = await res.json();
            tableBody.innerHTML = '';

            data.reverse().forEach(row => {
                const tr = document.createElement('tr');
                const rowJson = encodeURIComponent(JSON.stringify(row));
                const displayId = String(row[1]).replace(/^'/, '');
                const displayPhone = String(row[3]).replace(/^'/, '');

                tr.innerHTML = `
                    <td>${fixDate(row[0])}</td>
                    <td class="clickable" onclick="showFullDetail('${rowJson}')"><strong>${displayId}</strong></td>
                    <td class="clickable" onclick="showFullDetail('${rowJson}')">${row[2]}<br><small style="color:#8e8e93">${displayPhone}</small></td>
                    <td class="clickable" onclick="showFullDetail('${rowJson}')"><div class="text-truncate">${row[6] || "-"}</div></td>
                    <td>${row[4]}</td>
                    <td>${row[5] ? `<a href="${row[5]}" target="_blank" style="color:#007aff;"><i class="fa-solid fa-image"></i> ดูรูป</a>` : '-'}</td>
                    <td>
                        <button class="btn-edit" onclick="editData('${rowJson}')"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button class="btn-delete" onclick="deleteData('${row[0]}', '${row[1]}')"><i class="fa-solid fa-trash"></i></button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
            filterData();
        } catch (e) { tableBody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:red;">โหลดข้อมูลไม่สำเร็จ</td></tr>'; }
    }

    window.editData = function(rowJson) {
        const item = JSON.parse(decodeURIComponent(rowJson));
        const oldDate = formatForInputDate(item[0]);
        const oldMemberId = String(item[1]);

        Swal.fire({
            title: 'แก้ไขข้อมูลงาน',
            html: `
                <div style="text-align:left;">
                    <label style="font-size:13px; font-weight:500; color:#666;">วันที่</label>
                    <input type="date" id="swal-date" class="swal2-input" value="${oldDate}" style="width:100%; margin-bottom:12px;">
                    <label style="font-size:13px; font-weight:500; color:#666;">รหัสสมาชิก</label>
                    <input type="text" id="swal-memberId" class="swal2-input" value="${String(item[1]).replace(/^'/, '')}" style="width:100%; margin-bottom:12px;">
                    <label style="font-size:13px; font-weight:500; color:#666;">ชื่อลูกค้า</label>
                    <input type="text" id="swal-name" class="swal2-input" value="${item[2]}" style="width:100%; margin-bottom:12px;">
                    <label style="font-size:13px; font-weight:500; color:#666;">เบอร์ติดต่อ</label>
                    <input type="text" id="swal-phone" class="swal2-input" value="${String(item[3]).replace(/^'/, '')}" style="width:100%; margin-bottom:12px;">
                    <label style="font-size:13px; font-weight:500; color:#666;">พนักงาน</label>
                    <select id="swal-staff" class="swal2-input" style="width:100%; margin-bottom:12px;">
                        <option value="ศุภกฤต" ${item[4] === 'ศุภกฤต' ? 'selected' : ''}>ศุภกฤต</option>
                        <option value="นวพล" ${item[4] === 'นวพล' ? 'selected' : ''}>นวพล</option>
                        <option value="ปิยะพร" ${item[4] === 'ปิยะพร' ? 'selected' : ''}>ปิยะพร</option>
                        <option value="กรทักษ์" ${item[4] === 'กรทักษ์' ? 'selected' : ''}>กรทักษ์</option>
                    </select>
                    <label style="font-size:13px; font-weight:500; color:#666;">รายละเอียดงาน</label>
                    <textarea id="swal-jobDetail" class="swal2-textarea" style="width:100%; height:80px;">${item[6] || ''}</textarea>
                </div>
            `,
            showCancelButton: true,
            confirmButtonText: 'บันทึกการแก้ไข',
            cancelButtonText: 'ยกเลิก',
            confirmButtonColor: '#34C759',
            preConfirm: () => {
                return {
                    action: "update",
                    oldDate: oldDate,
                    oldMemberId: oldMemberId,
                    date: document.getElementById('swal-date').value,
                    memberId: "'" + document.getElementById('swal-memberId').value,
                    name: document.getElementById('swal-name').value,
                    phone: "'" + document.getElementById('swal-phone').value,
                    staff: document.getElementById('swal-staff').value,
                    jobDetail: document.getElementById('swal-jobDetail').value
                }
            }
        }).then(async (result) => {
            if (result.isConfirmed) {
                Swal.fire({title: 'กำลังอัพเดท...', didOpen: () => Swal.showLoading()});
                try {
                    await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(result.value) });
                    Swal.fire('สำเร็จ', 'แก้ไขข้อมูลเรียบร้อยแล้ว', 'success');
                    loadData();
                } catch (err) { Swal.fire('Error', 'ไม่สามารถบันทึกได้', 'error'); }
            }
        });
    }

    document.getElementById('jobForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true; btn.innerText = 'กำลังบันทึก...';

        const fileInput = document.getElementById('file');
        let fileData = null;
        if (fileInput.files.length > 0) {
            fileData = await new Promise(resolve => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.readAsDataURL(fileInput.files[0]);
            });
        }

        const payload = {
            action: "insert",
            date: document.getElementById('date').value,
            memberId: "'" + document.getElementById('memberId').value,
            name: document.getElementById('name').value,
            phone: "'" + document.getElementById('phone').value,
            staff: document.getElementById('staff').value,
            jobDetail: document.getElementById('jobDetail').value,
            fileData: fileData
        };

        try {
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
            Swal.fire('สำเร็จ', 'บันทึกข้อมูลเรียบร้อยแล้ว', 'success');
            document.getElementById('jobForm').reset();
            document.getElementById('date').valueAsDate = new Date();
            loadData();
        } catch (err) { Swal.fire('Error', 'บันทึกไม่สำเร็จ', 'error'); }
        btn.disabled = false; btn.innerText = 'บันทึกข้อมูล';
    });

    async function deleteData(d, id) {
        const confirm = await Swal.fire({
            title: 'ลบข้อมูล?', text: "ยืนยันการลบรายการนี้", icon: 'warning',
            showCancelButton: true, confirmButtonColor: '#FF3B30', confirmButtonText: 'ลบ'
        });
        if (confirm.isConfirmed) {
            Swal.fire({title: 'กำลังลบ...', didOpen: () => Swal.showLoading()});
            try {
                const dateObj = new Date(d);
                const dateStr = dateObj.getFullYear() + '-' + String(dateObj.getMonth()+1).padStart(2,'0') + '-' + String(dateObj.getDate()).padStart(2,'0');
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({action: "delete", date: dateStr, memberId: id}) });
                Swal.fire('ลบแล้ว!', '', 'success');
                loadData();
            } catch (e) { Swal.fire('Error', 'ลบไม่สำเร็จ', 'error'); }
        }
    }

    window.onload = () => {
        includeSidebar();
        document.getElementById('date').valueAsDate = new Date();
        loadData();
    };
</script>

</body>
</html>
