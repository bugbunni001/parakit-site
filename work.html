<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเคลียร์งาน - Parakit-site</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --ios-blue: #007aff;
            --ios-system-gray: #f2f2f7;
            --sidebar-dark: rgba(28, 28, 30, 0.95);
            --sidebar-width: 280px;
            --glass: rgba(255, 255, 255, 0.25);
            --glass-white: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
            --ios-red: #FF3B30;
            --text-main: #1d1d1f;
            --text-light: #8e8e93;
        }

        * { box-sizing: border-box; }
        body, input, select, button, textarea { font-family: 'Kanit', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            color: var(--text-main);
            transition: padding-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding-bottom: 80px;
        }

        /* ===== Header & Sidebar (จาก Memory) ===== */
        .top-header {
            position: fixed; top: 0; left: 0; right: 0; height: 65px;
            background: var(--glass-white); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: 1200; display: flex; align-items: center; padding: 0 20px;
            border-bottom: 0.5px solid rgba(0,0,0,0.1); transition: left 0.3s;
        }
        .top-toggle {
            width: 36px; height: 36px; border-radius: 10px; border: none;
            background: var(--ios-blue); color: white; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }
        .sidebar { 
            position: fixed; top: 0; left: 0; width: var(--sidebar-width); height: 100vh; 
            background: var(--sidebar-dark); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            color: #fff; overflow-y: auto; transition: all .3s; z-index: 2000;
        }
        @media(min-width:769px) { 
            body:not(.collapsed) { padding-left: var(--sidebar-width); }
            body:not(.collapsed) .top-header { left: var(--sidebar-width); }
            body.collapsed .sidebar { transform: translateX(-100%); }
            body.collapsed .top-header { left: 0; }
        }
        @media(max-width:768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.show { transform: translateX(0); }
            .top-header { left: 0 !important; }
        }

        /* ===== Main Layout ===== */
        .main-content { display: flex; flex-direction: column; align-items: center; padding: 100px 20px 40px; }
        .glass-card { background: var(--glass); backdrop-filter: blur(20px); border-radius: 24px; border: 1px solid var(--glass-border); box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        .container { padding: 30px; width: 100%; max-width: 650px; margin-bottom: 40px; }
        
        h2 { text-align: center; margin-bottom: 25px; font-size: 24px; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; }
        input, select, textarea {
            width: 100%; padding: 12px 15px; border-radius: 12px; border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.6); font-size: 15px; outline: none; transition: 0.3s;
        }
        input:focus, select:focus, textarea:focus { background: white; border-color: var(--ios-blue); }
        .btn-submit {
            width: 100%; padding: 15px; border: none; border-radius: 12px;
            background: var(--ios-blue); color: white; font-size: 16px; font-weight: 600;
            cursor: pointer; transition: 0.3s; margin-top: 10px;
        }

        /* ===== Table Styling ===== */
        .list-container { width: 100%; max-width: 1200px; }
        .table-wrapper { overflow-x: auto; border-radius: 20px; background: rgba(255,255,255,0.4); }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { background: rgba(255, 255, 255, 0.5); padding: 15px; text-align: left; font-size: 14px; color: #444; border-bottom: 2px solid white; }
        td { padding: 14px 15px; border-bottom: 1px solid rgba(255,255,255,0.3); font-size: 14px; }

        /* คลิกได้ (Interactive) */
        .clickable { cursor: pointer; transition: 0.2s; }
        .clickable:hover { color: var(--ios-blue); text-decoration: underline; }
        
        .text-truncate { 
            max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
            font-size: 13px; color: #555;
        }

        .btn-delete {
            background: #fff0f0; color: var(--ios-red); border: 1px solid #ffdada;
            padding: 6px 10px; border-radius: 8px; cursor: pointer;
        }
        .btn-delete:hover { background: var(--ios-red); color: white; }

        /* Modal Styles */
        .detail-row { display: flex; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; text-align: left; }
        .detail-label { font-weight: 600; width: 120px; color: #666; flex-shrink: 0; }
        .detail-value { color: #111; word-break: break-all; }

        @media (max-width: 768px) {
            .container { padding: 20px; }
            td:before { font-weight: 600; }
            .text-truncate { max-width: 100%; white-space: normal; }
        }
    </style>
</head>
<body>

<header class="top-header">
    <button class="top-toggle" onclick="toggleSidebar()">☰</button>
    <div style="margin-left:15px; font-weight: 600; font-size: 1.1rem;">ระบบเคลียร์งาน</div>
</header>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
<aside class="sidebar" id="sidebar"></aside>

<div class="main-content">
    <div class="container glass-card">
        <h2><i class="fa-solid fa-edit"></i> บันทึกงานกันลืม</h2>
        <form id="jobForm">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group">
                    <label>วันที่ดำเนินการ</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label>หมายเลขสมาชิก</label>
                    <input type="text" id="memberId" placeholder="TMH/TOL/TVS" required>
                </div>
            </div>
            <div class="form-group">
                <label>ชื่อลูกค้า</label>
                <input type="text" id="name" placeholder="ชื่อ-นามสกุล" required>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="form-group">
                    <label>เบอร์ติดต่อ</label>
                    <input type="text" id="phone" placeholder="0XXXXXXXXX" required>
                </div>
                <div class="form-group">
                    <label>พนักงาน</label>
                    <select id="staff" required>
                        <option value="">-- เลือก --</option>
                        <option value="ศุภกฤต">ศุภกฤต</option>
                        <option value="นวพล">นวพล</option>
                        <option value="ปิยะพร">ปิยะพร</option>
                        <option value="กรทักษ์">กรทักษ์</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>รายละเอียดงาน</label>
                <textarea id="jobDetail" rows="3" placeholder="ระบุรายละเอียดงาน..."></textarea>
            </div>
            <div class="form-group">
                <label>แนบรูป (ถ้ามี)</label>
                <input type="file" id="file" accept="image/*">
            </div>
            <button type="submit" id="submitBtn" class="btn-submit">บันทึกข้อมูล</button>
        </form>
    </div>

    <div class="list-container">
        <div class="table-wrapper glass-card">
            <table>
                <thead>
                    <tr>
                        <th>วันที่</th>
                        <th>รหัสสมาชิก</th>
                        <th>ชื่อลูกค้า / เบอร์</th>
                        <th>รายละเอียด</th>
                        <th>พนักงาน</th>
                        <th>เอกสาร</th>
                        <th>จัดการ</th>
                    </tr>
                </thead>
                <tbody id="dataTable"></tbody>
            </table>
        </div>
    </div>
    <p style="margin-top:20px; font-size:12px; color:#888;">© 2026 Copy Right By Angerina Frog</p>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxQ6oHl9McfWiPCEzIZXOlqJlyqrrv_jzultnBcpOhdfe-jnqCGZ3mBST6-uSP-icA/exec';

    // แก้ไขวันที่จาก Google ให้สวยงาม
    function fixDate(dateVal) {
        if (!dateVal) return "-";
        const d = new Date(dateVal);
        if (isNaN(d)) return dateVal;
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const year = d.getFullYear();
        return `${day}-${month}-${year}`;
    }

    // ฟังก์ชัน Popup ดูข้อมูลฉบับเต็ม
    function showFullDetail(rowJson) {
        const item = JSON.parse(decodeURIComponent(rowJson));
        const html = `
            <div style="font-family:'Kanit';">
                <div class="detail-row"><div class="detail-label">วันที่:</div><div class="detail-value">${fixDate(item[0])}</div></div>
                <div class="detail-row"><div class="detail-label">รหัสสมาชิก:</div><div class="detail-value">${String(item[1]).replace(/^'/, '')}</div></div>
                <div class="detail-row"><div class="detail-label">ลูกค้า:</div><div class="detail-value">${item[2]}</div></div>
                <div class="detail-row"><div class="detail-label">เบอร์ติดต่อ:</div><div class="detail-value">${String(item[3]).replace(/^'/, '')}</div></div>
                <div class="detail-row"><div class="detail-label">พนักงาน:</div><div class="detail-value">${item[4]}</div></div>
                <div class="detail-row"><div class="detail-label">รายละเอียด:</div><div class="detail-value" style="white-space:pre-wrap;">${item[6] || '-'}</div></div>
            </div>
        `;
        Swal.fire({
            title: 'รายละเอียดข้อมูลงาน',
            html: html,
            confirmButtonText: 'ปิด',
            confirmButtonColor: '#007aff',
            width: '500px'
        });
    }

    async function loadData() {
        const tableBody = document.getElementById('dataTable');
        tableBody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:30px;">กำลังดึงข้อมูล...</td></tr>';
        
        try {
            const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({action: "read"}) });
            const data = await res.json();
            tableBody.innerHTML = '';

            data.reverse().forEach(row => {
                const tr = document.createElement('tr');
                const rowJson = encodeURIComponent(JSON.stringify(row));
                const displayId = String(row[1]).replace(/^'/, '');
                const displayPhone = String(row[3]).replace(/^'/, '');
                const detailText = row[6] || "-";

                tr.innerHTML = `
                    <td>${fixDate(row[0])}</td>
                    <td class="clickable" onclick="showFullDetail('${rowJson}')"><strong>${displayId}</strong></td>
                    <td class="clickable" onclick="showFullDetail('${rowJson}')">
                        ${row[2]}<br><small style="color:#666">${displayPhone}</small>
                    </td>
                    <td class="clickable" onclick="showFullDetail('${rowJson}')">
                        <div class="text-truncate">${detailText}</div>
                    </td>
                    <td>${row[4]}</td>
                    <td>${row[5] ? `<a href="${row[5]}" target="_blank" style="color:#007aff; text-decoration:none;"><i class="fa-solid fa-image"></i> ดูรูป</a>` : '-'}</td>
                    <td>
                        <button class="btn-delete" onclick="deleteData('${row[0]}', '${row[1]}')">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        } catch (e) {
            tableBody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:red;">โหลดข้อมูลไม่สำเร็จ</td></tr>';
        }
    }

    // Sidebar functions (Simplified)
    function toggleSidebar() {
        if (window.innerWidth <= 768) {
            document.getElementById("sidebar").classList.toggle("show");
            document.getElementById("overlay").classList.toggle("show");
        } else {
            document.body.classList.toggle("collapsed");
        }
    }

    document.getElementById('jobForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = 'กำลังบันทึก...';

        const fileInput = document.getElementById('file');
        let fileData = null;
        if (fileInput.files.length > 0) {
            const reader = new FileReader();
            fileData = await new Promise(resolve => {
                reader.onload = () => resolve(reader.result);
                reader.readAsDataURL(fileInput.files[0]);
            });
        }

        const payload = {
            action: "insert",
            date: document.getElementById('date').value,
            memberId: "'" + document.getElementById('memberId').value,
            name: document.getElementById('name').value,
            phone: "'" + document.getElementById('phone').value,
            staff: document.getElementById('staff').value,
            jobDetail: document.getElementById('jobDetail').value,
            fileData: fileData
        };

        try {
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
            Swal.fire('สำเร็จ', 'บันทึกข้อมูลเรียบร้อยแล้ว', 'success');
            document.getElementById('jobForm').reset();
            document.getElementById('date').valueAsDate = new Date();
            loadData();
        } catch (err) { Swal.fire('Error', 'บันทึกไม่สำเร็จ', 'error'); }
        btn.disabled = false;
        btn.innerText = 'บันทึกข้อมูล';
    });

    async function deleteData(d, id) {
        const confirm = await Swal.fire({
            title: 'ลบข้อมูล?', text: "ยืนยันการลบรายการนี้", icon: 'warning',
            showCancelButton: true, confirmButtonColor: '#FF3B30', confirmButtonText: 'ลบ'
        });
        if (confirm.isConfirmed) {
            Swal.fire({title: 'กำลังลบ...', didOpen: () => Swal.showLoading()});
            try {
                // Format วันที่ให้ตรงกับที่ Script คาดหวัง (YYYY-MM-DD)
                const dateObj = new Date(d);
                const dateStr = dateObj.getFullYear() + '-' + String(dateObj.getMonth()+1).padStart(2,'0') + '-' + String(dateObj.getDate()).padStart(2,'0');
                
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({action: "delete", date: dateStr, memberId: id}) });
                Swal.fire('ลบแล้ว!', '', 'success');
                loadData();
            } catch (e) { Swal.fire('Error', 'ลบไม่สำเร็จ', 'error'); }
        }
    }

    window.onload = () => {
        document.getElementById('date').valueAsDate = new Date();
        loadData();
        // Load sidebar from memory logic could be added here
    };
</script>

</body>
</html>
