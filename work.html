<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเคลียร์งาน - Parakit-site</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --ios-blue: #007aff;
            --ios-dark-blue: #0056b3;
            --ios-bg: #f2f2f7;
            --glass-white: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
            --sidebar-dark: rgba(28, 28, 30, 0.94);
            --text-main: #1c1c1e;
            --text-light: #636366;
            --ios-red: #FF3B30;
            --ios-green: #34C759;
            --ios-orange: #FF9500;
            --shadow-soft: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }

        body { 
            margin: 0; 
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            background-attachment: fixed;
            color: var(--text-main); 
            min-height: 100vh;
            padding-bottom: 60px;
            scroll-behavior: smooth;
        }

        .top-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 65px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: 1300;
            display: flex; align-items: center;
            padding: 0 20px 0 75px; 
            border-bottom: 1px solid var(--glass-border);
        }

        #floatingMenuBtn {
            position: fixed;
            top: 10px;
            left: 15px;
            width: 45px;
            height: 45px;
            background: var(--ios-blue);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: move;
            z-index: 2100;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
            border: none;
            touch-action: none;
            transition: transform 0.2s, opacity 0.2s;
        }
        #floatingMenuBtn:active { transform: scale(0.9); }

        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.2);
            z-index: 2000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .sidebar-overlay.active { display: block; opacity: 1; }

        .sidebar-float {
            position: fixed;
            width: 280px;
            max-height: 70vh;
            background: var(--sidebar-dark);
            border-radius: 20px;
            overflow-y: auto;
            z-index: 2001;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.8) translateY(10px);
            transition: opacity 0.3s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.2) transparent;
        }
        .sidebar-float.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1) translateY(0);
        }

        .sidebar-float .sidebar-header { padding: 20px; font-size: 17px; font-weight: 600; color: #fff; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
        .sidebar-float .menu { padding: 8px 0; }
        .sidebar-float .menu a, .sidebar-float .drop-btn { 
            width: 100%; padding: 12px 20px; background: none; border: none; 
            color: #ebebf5; text-align: left; font-size: 14px; cursor: pointer; 
            display: flex; align-items: center; text-decoration: none; transition: 0.2s;
        }
        .sidebar-float .menu a:hover, .sidebar-float .drop-btn:hover { background: rgba(255,255,255,0.1); }
        .sidebar-float .sub { display: none; background: rgba(0,0,0,0.2); }
        .sidebar-float .item.open .sub { display: block; }
        .sidebar-float .sub a { padding-left: 45px; font-size: 13px; color: #8e8e93; }

        .stats-container {
            width: 100%;
            max-width: 1300px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            padding: 10px 0 15px 0;
        }

        .stat-card-long {
            grid-column: 1 / -1;
            background: linear-gradient(90deg, #5856d6, #007aff);
            color: white;
            padding: 15px 25px;
            border-radius: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(88, 86, 214, 0.3);
            margin-bottom: 10px;
        }
        .stat-card-long:hover { transform: scale(1.01); filter: brightness(1.1); }
        .stat-card-long .info { display: flex; flex-direction: column; }
        .stat-card-long .title { font-size: 14px; font-weight: 600; }
        .stat-card-long .date-label { font-size: 20px; opacity: 0.9; }
        .stat-card-long .count-val { font-size: 28px; font-weight: 700; }

        .stat-card {
            padding: 15px 10px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            background: white;
            box-shadow: 0 10px 20px rgba(0,122,255,0.15);
            border-color: var(--ios-blue);
        }
        
        .stat-card.active {
            border-color: var(--ios-blue);
            background: white;
            box-shadow: 0 0 0 2px var(--ios-blue);
        }
        .stat-card .count { font-size: 22px; font-weight: 700; color: var(--ios-blue); line-height: 1; }
        .stat-card .label { font-size: 12px; color: var(--text-light); font-weight: 500; margin-top: 6px; }

        .stat-card.pinned-stat .count { color: var(--ios-orange); }
        .stat-card.processing-stat .count { color: var(--ios-dark-blue); }

        .main-content { 
            display: flex; flex-direction: column; align-items: center; 
            padding: 85px 25px 40px; 
            animation: fadeIn 0.6s ease-out; 
        }

        .action-bar {
            width: 100%; max-width: 1300px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; gap: 15px;
            flex-wrap: wrap;
        }

        .btn-add-job {
            background: linear-gradient(135deg, #007aff, #0056b3);
            color: white; padding: 12px 28px; border-radius: 16px; border: none;
            font-size: 16px; font-weight: 600; cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 122, 255, 0.3);
            transition: 0.3s; display: flex; align-items: center; gap: 10px;
        }
        .btn-add-job:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(0, 122, 255, 0.4); opacity: 0.9; }

        .search-area-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-grow: 1;
            max-width: 600px; /* ขยายความกว้างเพื่อให้พอดีกับปฏิทิน */
        }

        .date-filter-wrapper {
            position: relative;
            min-width: 160px;
        }
        .date-filter-wrapper i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--ios-blue); pointer-events: none; }
        .date-filter-input {
            width: 100%; padding: 14px 15px 14px 42px; border-radius: 18px; 
            border: 1px solid var(--glass-border); background: rgba(255, 255, 255, 0.8);
            outline: none; transition: 0.3s; font-size: 14px; color: var(--text-main);
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            cursor: pointer;
        }
        .date-filter-input:focus { border-color: var(--ios-blue); background: white; }

        .search-wrapper { 
            flex-grow: 1; position: relative; 
        }
        .search-wrapper i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--ios-blue); }
        .search-input { 
            width: 100%; padding: 14px 20px 14px 48px; border-radius: 18px; 
            border: 1px solid var(--glass-border); background: rgba(255, 255, 255, 0.8);
            outline: none; transition: 0.3s; font-size: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .search-input:focus { border-color: var(--ios-blue); box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1); background: white; }

        .btn-refresh-inline {
            width: 48px; height: 48px; border-radius: 18px; border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.8); color: var(--ios-blue);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s; font-size: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .btn-refresh-inline:hover { background: white; transform: scale(1.05); color: var(--ios-green); border-color: var(--ios-green); }

        .table-wrapper { 
            width: 100%; max-width: 1300px; overflow-x: auto; border-radius: 28px; 
            background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); box-shadow: var(--shadow-soft);
        }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th { 
            background: rgba(255, 255, 255, 0.6); padding: 18px 15px; 
            text-align: left; font-size: 14px; color: var(--text-light); 
            border-bottom: 1px solid rgba(0,0,0,0.05); font-weight: 600; text-transform: uppercase;
        }
        td { padding: 16px 15px; border-bottom: 1px solid rgba(255,255,255,0.4); font-size: 14px; vertical-align: middle; transition: 0.2s; }
        tbody tr:hover td { background: rgba(255, 255, 255, 0.4); }

        .report-id-label {
            font-size: 10px;
            color: var(--text-light);
            background: rgba(0,0,0,0.05);
            padding: 1px 5px;
            border-radius: 4px;
            display: block;
            margin-top: 4px;
            font-weight: 400;
        }

        .job-type-badge {
            background: white; color: var(--ios-blue);
            padding: 4px 12px; border-radius: 10px;
            font-size: 12px; font-weight: 600; white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            border: 1px solid rgba(0, 122, 255, 0.15);
        }

        .pinned-row { background: rgba(255, 149, 0, 0.08) !important; }

        .action-btns-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .action-btns {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .deadline-label-small {
            font-size: 11px;
            color: var(--ios-red);
            font-weight: 600;
            background: #fff0f0;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 59, 48, 0.2);
        }

        .btn-pin, .btn-process, .btn-edit, .btn-delete {
            width: 36px; height: 36px; border-radius: 10px; border: none; cursor: pointer; transition: all 0.2s;
            display: inline-flex; align-items: center; justify-content: center; font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        .btn-pin { background: #fff8ed; color: var(--ios-orange); }
        .btn-pin.active { background: var(--ios-orange); color: white; box-shadow: 0 4px 10px rgba(255, 149, 0, 0.3); }
        
        .btn-process { background: #eef7ff; color: var(--ios-blue); }
        .btn-process.active { background: var(--ios-dark-blue); color: white; box-shadow: 0 4px 10px rgba(0, 86, 179, 0.3); }
        .btn-process:hover:not(.active) { background: #ddecff; transform: translateY(-2px); }

        .btn-edit { background: #eef7ed; color: var(--ios-green); }
        .btn-edit:hover { background: var(--ios-green); color: white; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(52, 199, 89, 0.3); }

        .btn-delete { background: #fff0f0; color: var(--ios-red); }
        .btn-delete:hover { background: var(--ios-red); color: white; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(255, 59, 48, 0.3); }
        
        .btn-pin:hover:not(.active) { background: #ffe6c2; transform: translateY(-2px); }

        /* Pagination Styles */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 25px;
            width: 100%;
            max-width: 1300px;
        }

        .pagination-btn {
            min-width: 40px;
            height: 40px;
            padding: 0 10px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.6);
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pagination-btn:hover {
            background: white;
            border-color: var(--ios-blue);
            color: var(--ios-blue);
            transform: translateY(-2px);
        }

        .pagination-btn.active {
            background: var(--ios-blue);
            color: white;
            border-color: var(--ios-blue);
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        .pagination-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .floating-controls {
            position: fixed;
            bottom: 25px;
            right: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1100;
        }

        .btn-float {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            color: var(--ios-blue);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 18px; text-decoration: none;
        }

        .btn-float:hover { background: white; transform: scale(1.1); box-shadow: 0 6px 20px rgba(0,122,255,0.2); }

        #btn-back-to-top { opacity: 0; visibility: hidden; transform: translateY(20px); }
        #btn-back-to-top.show { opacity: 1; visibility: visible; transform: translateY(0); }

        .swal2-container { z-index: 9999 !important; }
        .swal-modal-custom { border-radius: 30px !important; padding: 20px !important; }
        .swal2-title { font-weight: 700 !important; color: var(--text-main) !important; }

        .swal-form-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: left; margin-top: 15px; }
        .swal-field-full { grid-column: span 2; }
        .swal-label { font-size: 13px; font-weight: 600; color: var(--text-light); margin-bottom: 6px; display: block; margin-left: 5px; }
        .swal-input-styled { 
            width: 100%; padding: 12px 15px; border-radius: 14px; border: 1.5px solid #e5e5ea; 
            font-size: 15px; outline: none; transition: 0.2s; background: #f9f9f9;
        }
        .swal-input-styled:focus { border-color: var(--ios-blue); background: #fff; box-shadow: 0 0 0 4px rgba(0,122,255,0.1); }
        
        .detail-view-item { background: #f9f9f9; padding: 12px 15px; border-radius: 14px; border: 1.5px solid #f0f0f5; }
        .detail-view-item .val { font-size: 15px; font-weight: 600; color: var(--text-main); display: block; }

        .file-list { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
        .file-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #fff; padding: 8px 12px; border-radius: 10px; border: 1px solid #e5e5ea;
            font-size: 13px;
        }
        .file-item .remove-file { color: var(--ios-red); cursor: pointer; font-size: 16px; padding-left: 10px; }
        
        .existing-file-item { background: #f0f9ff; border-color: #bae6fd; }
        .existing-file-item i.fa-trash-can { color: var(--ios-red); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header class="top-header">
    <div style="font-weight: 700; font-size: 1.4rem; color: var(--text-main); letter-spacing: -1px;">ระบบเคลียร์งาน</div>
</header>

<button id="floatingMenuBtn" title="ลากเพื่อย้าย">เมนู</button>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebarFloat()"></div>
<aside class="sidebar-float" id="sidebarFloat"></aside>

<div class="floating-controls">
    <button id="btn-back-to-top" class="btn-float" onclick="scrollToTop()" title="กลับไปด้านบน">
        <i class="fa-solid fa-arrow-up"></i>
    </button>
</div>

<div class="main-content">
    
    <div class="stats-container" id="statsContainer"></div>

    <div class="action-bar">
        <button class="btn-add-job" onclick="openAddJobModal()">
            <i class="fa-solid fa-plus-circle"></i> เพิ่มรายการใหม่
        </button>
        <div class="search-area-wrapper">
            <div class="date-filter-wrapper">
                <i class="fa-solid fa-calendar-days"></i>
                <input type="date" id="dateFilter" class="date-filter-input" onchange="filterByDate()" title="กรองตามวันครบกำหนด">
            </div>
            
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="ค้นหาข้อมูล..." onkeyup="filterData()">
            </div>
            <button class="btn-refresh-inline" onclick="loadData(true)" title="รีเฟรชข้อมูล">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th width="120">วันที่ / เลขที่</th>
                    <th width="160">ประเภทงาน</th>
                    <th>รหัสสมาชิก</th>
                    <th>ชื่อลูกค้า / เบอร์</th>
                    <th width="300">รายละเอียด</th> 
                    <th>พนักงาน</th>
                    <th>เอกสาร</th>
                    <th width="180">จัดการ</th>
                </tr>
            </thead>
            <tbody id="dataTable">
                <tr><td colspan="8" style="text-align:center; padding:50px; color:#888;">กำลังโหลดข้อมูล...</td></tr>
            </tbody>
        </table>
    </div>

    <div id="pagination" class="pagination-container"></div>
    
    <p style="margin-top:30px; font-size:13px; color:rgba(0,0,0,0.5); font-weight: 500;">
        <i class="fa-solid fa-copyright"></i> 2026 Copyright by <strong>Angerina Frog</strong>
    </p>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwI59gZy_3FZOT8yQkR2aYG2LqyNhnHy_Uvki1MIDAMq9jBBI4aIdEgoW3pZsJQNeCw/exec';

    const jobTypes = [
        "MGM ปรับลด", "ยกเลิกบริการ (ปกติ)", "ยกเลิกบริการ (5P)", "MNP",
        "เปลี่ยนรายเดือนเป็นเติมเงิน", "เปลี่ยนโปรโมชั่น", "Add ส่วนลด",
        "Add เน็ตเพิ่ม", "ระงับสัญญาณชั่วคราวTOL", "ส่งเรื่องตรวจสอบ"
    ];

    let fullData = [];
    let filteredData = [];
    let currentPage = 1;
    const itemsPerPage = 10;
    
    let selectedFiles = []; 
    let existingFiles = []; 

    const dragBtn = document.getElementById('floatingMenuBtn');
    const sideFloat = document.getElementById('sidebarFloat');
    const sideOverlay = document.getElementById('sidebarOverlay');
    let isDragging = false;
    let startX, startY, shiftX, shiftY;

    function generateReportId() {
        return Math.floor(1000000000 + Math.random() * 9000000000).toString();
    }

    function loadButtonPosition() {
        const savedLeft = localStorage.getItem('floatBtnLeft');
        const savedTop = localStorage.getItem('floatBtnTop');
        if (savedLeft && savedTop) {
            dragBtn.style.left = savedLeft + 'px';
            dragBtn.style.top = savedTop + 'px';
        }
    }

    dragBtn.onpointerdown = function(e) {
        isDragging = false;
        startX = e.clientX; startY = e.clientY;
        const rect = dragBtn.getBoundingClientRect();
        shiftX = e.clientX - rect.left; shiftY = e.clientY - rect.top;
        dragBtn.setPointerCapture(e.pointerId);
        document.addEventListener('pointermove', onPointerMove);
        document.addEventListener('pointerup', onPointerUp);
    };

    function onPointerMove(e) {
        if (!isDragging && (Math.abs(e.clientX - startX) > 5 || Math.abs(e.clientY - startY) > 5)) isDragging = true;
        if (isDragging) {
            let newX = e.clientX - shiftX;
            let newY = e.clientY - shiftY;
            newX = Math.max(0, Math.min(newX, window.innerWidth - dragBtn.offsetWidth));
            newY = Math.max(0, Math.min(newY, window.innerHeight - dragBtn.offsetHeight));
            dragBtn.style.left = newX + 'px';
            dragBtn.style.top = newY + 'px';
        }
    }

    function onPointerUp(e) {
        document.removeEventListener('pointermove', onPointerMove);
        document.removeEventListener('pointerup', onPointerUp);
        dragBtn.releasePointerCapture(e.pointerId);
        if (isDragging) {
            localStorage.setItem('floatBtnLeft', dragBtn.offsetLeft);
            localStorage.setItem('floatBtnTop', dragBtn.offsetTop);
        } else {
            toggleSidebarFloat();
        }
        isDragging = false;
    }

    function toggleSidebarFloat() {
        const btnRect = dragBtn.getBoundingClientRect();
        const sidebarWidth = 280;
        let top = btnRect.bottom + 10;
        let left = btnRect.left;
        if (left + sidebarWidth > window.innerWidth) left = window.innerWidth - sidebarWidth - 15;
        if (top + 400 > window.innerHeight) {
            top = btnRect.top - 410;
            if (top < 10) top = 10;
        }
        sideFloat.style.top = top + 'px';
        sideFloat.style.left = left + 'px';
        sideFloat.style.transformOrigin = `${btnRect.left - left + 20}px ${btnRect.top > top ? 'bottom' : 'top'}`;
        const isActive = sideFloat.classList.toggle('active');
        sideOverlay.classList.toggle('active', isActive);
        if (isActive && !sideFloat.innerHTML) loadSidebarContent();
    }

    function closeSidebarFloat() {
        sideFloat.classList.remove('active');
        sideOverlay.classList.remove('active');
    }

    function loadSidebarContent() {
        fetch('sidebar.html')
            .then(res => res.text())
            .then(data => {
                sideFloat.innerHTML = `<div class="sidebar-header">เมนูนำทาง</div>` + data;
                ['credit', 'branch', 'sales'].forEach(id => {
                    if (localStorage.getItem('menu-' + id) === 'true') {
                        const el = sideFloat.querySelector('#menu-' + id);
                        if (el) el.classList.add('open');
                    }
                });
            }).catch(err => console.log("Sidebar load failed"));
    }

    window.toggleDrop = function(btn, id) {
        const item = btn.parentElement;
        const isOpen = item.classList.toggle("open");
        if (id) localStorage.setItem('menu-' + id, isOpen);
    }

    function fixDate(dateVal) {
        if (!dateVal || dateVal === "-") return "-";
        const d = new Date(dateVal);
        return isNaN(d) ? dateVal : `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
    }

    function formatForInputDate(dateVal) {
        if (!dateVal) return "";
        const d = new Date(dateVal);
        if (isNaN(d)) return "";
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    window.onscroll = function() {
        const btn = document.getElementById("btn-back-to-top");
        if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) btn.classList.add("show");
        else btn.classList.remove("show");
    };

    function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

    function updateStats(data) {
        const statsCon = document.getElementById('statsContainer');
        const counts = {};
        let processingCount = 0;
        let pinnedCount = 0;
        let deadlineCount = 0;
        const todayStr = formatForInputDate(new Date());

        jobTypes.forEach(t => counts[t] = 0);
        data.forEach(row => {
            const type = row[8] || "ทั่วไป";
            if(counts[type] !== undefined) counts[type]++;
            if(row[7] === "true" || row[7] === true) pinnedCount++;
            if(row[9] === "true" || row[9] === true) processingCount++;
            if(row[10] && formatForInputDate(row[10]) === todayStr) deadlineCount++;
        });

        let html = `
            <div class="stat-card-long" onclick="filterByType('deadlineToday')">
                <div class="info">
                    <span class="title"><i class="fa-solid fa-calendar-check"></i> งานที่ครบกำหนดวันนี้</span>
                    <span class="date-label">${fixDate(new Date())}</span>
                </div>
                <div class="count-val">${deadlineCount} รายการ</div>
            </div>
            <div class="stat-card pinned-stat" onclick="filterByType('pinned')">
                <div class="count">${pinnedCount}</div>
                <div class="label">ปักหมุดไว้</div>
            </div>
            <div class="stat-card processing-stat" onclick="filterByType('processing')">
                <div class="count">${processingCount}</div>
                <div class="label">กำลังดำเนินการ</div>
            </div>
        `;
        jobTypes.forEach(t => {
            if(counts[t] > 0) {
                html += `
                    <div class="stat-card" onclick="filterByType('${t}')">
                        <div class="count">${counts[t]}</div>
                        <div class="label">${t}</div>
                    </div>
                `;
            }
        });
        statsCon.innerHTML = html;
    }

    async function loadData(forceRefresh = false) {
        const tableBody = document.getElementById('dataTable');
        if (forceRefresh) tableBody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:50px;"><i class="fa-solid fa-spinner fa-spin"></i> กำลังรีเฟรชข้อมูล...</td></tr>';
        
        try {
            const response = await fetch(`${SCRIPT_URL}?action=read`);
            const result = await response.json();
            fullData = result.data || [];
            
            // แก้ไขตรงนี้: ให้เป็นค่าว่างหากไม่มีการระบุวันที่ใน URL
            const urlParams = new URLSearchParams(window.location.search);
            const urlDate = urlParams.get('date') || ""; // เปลี่ยนจากวันปัจจุบันเป็นค่าว่าง
            document.getElementById('dateFilter').value = urlDate;
            
            filterData();
        } catch (error) {
            tableBody.innerHTML = '<tr><td colspan="8" style="text-align:center; color:red; padding:50px;">เกิดข้อผิดพลาดในการโหลดข้อมูล</td></tr>';
        }
    }

    function filterByDate() {
        currentPage = 1;
        filterData();
    }

    function filterByType(type) {
        const searchInput = document.getElementById('searchInput');
        const dateFilter = document.getElementById('dateFilter');
        
        if (type === 'deadlineToday') {
            dateFilter.value = formatForInputDate(new Date());
            searchInput.value = '';
        } else if (type === 'pinned') {
            searchInput.value = 'isPinned';
            dateFilter.value = '';
        } else if (type === 'processing') {
            searchInput.value = 'isProcessing';
            dateFilter.value = '';
        } else {
            searchInput.value = type;
            dateFilter.value = '';
        }
        currentPage = 1;
        filterData();
    }

    function filterData() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const dateTerm = document.getElementById('dateFilter').value;
        
        filteredData = fullData.filter(row => {
            const rowDate = formatForInputDate(row[10]);
            const matchesDate = dateTerm ? rowDate === dateTerm : true;
            
            if (searchTerm === 'ispinned') return (row[7] === "true" || row[7] === true) && matchesDate;
            if (searchTerm === 'isprocessing') return (row[9] === "true" || row[9] === true) && matchesDate;

            const matchesSearch = row.some((cell, idx) => {
                if (idx === 7 || idx === 9 || idx === 11) return false;
                return String(cell).toLowerCase().includes(searchTerm);
            });
            
            return matchesSearch && matchesDate;
        });

        updateStats(fullData);
        renderTable();
    }

    function renderTable() {
        const tableBody = document.getElementById('dataTable');
        const pagination = document.getElementById('pagination');
        
        if (filteredData.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:50px; color:#888;">ไม่พบข้อมูลที่ตรงกับเงื่อนไข</td></tr>';
            pagination.innerHTML = '';
            return;
        }

        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const pageData = filteredData.slice(startIndex, endIndex);

        tableBody.innerHTML = pageData.map(row => {
            const isPinned = row[7] === "true" || row[7] === true;
            const isProcessing = row[9] === "true" || row[9] === true;
            const files = row[12] ? JSON.parse(row[12]) : [];
            
            return `
                <tr class="${isPinned ? 'pinned-row' : ''}">
                    <td>
                        <div style="font-weight:600; color:var(--ios-blue);">${fixDate(row[1])}</div>
                        <span class="report-id-label">ID: ${row[11]}</span>
                    </td>
                    <td><span class="job-type-badge">${row[8] || "-"}</span></td>
                    <td style="font-weight:600;">${row[2] || "-"}</td>
                    <td>
                        <div style="font-weight:500;">${row[3] || "-"}</div>
                        <div style="font-size:12px; color:var(--text-light);"><i class="fa-solid fa-phone"></i> ${row[4] || "-"}</div>
                    </td>
                    <td style="font-size:13px; line-height:1.4;">${row[6] || "-"}</td>
                    <td><div style="color:var(--text-light); font-size:13px;">${row[5] || "-"}</div></td>
                    <td>
                        ${files.length > 0 ? `<button class="btn-process" onclick='viewFiles(${JSON.stringify(files)})' title="ดูเอกสาร"><i class="fa-solid fa-file-lines"></i></button>` : "-"}
                    </td>
                    <td>
                        <div class="action-btns-container">
                            <div class="action-btns">
                                <button class="btn-pin ${isPinned ? 'active' : ''}" onclick="toggleStatus('${row[11]}', 'pin', ${isPinned})" title="ปักหมุด">
                                    <i class="fa-solid fa-thumbtack"></i>
                                </button>
                                <button class="btn-process ${isProcessing ? 'active' : ''}" onclick="toggleStatus('${row[11]}', 'process', ${isProcessing})" title="กำลังดำเนินการ">
                                    <i class="fa-solid fa-spinner ${isProcessing ? 'fa-spin' : ''}"></i>
                                </button>
                                <button class="btn-edit" onclick='openEditModal(${JSON.stringify(row)})' title="แก้ไข">
                                    <i class="fa-solid fa-pen-to-square"></i>
                                </button>
                                <button class="btn-delete" onclick="deleteJob('${row[11]}')" title="ลบ">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                            ${row[10] ? `<span class="deadline-label-small">ครบกำหนด: ${fixDate(row[10])}</span>` : ""}
                        </div>
                    </td>
                </tr>
            `;
        }).join('');

        renderPagination();
    }

    function renderPagination() {
        const pagination = document.getElementById('pagination');
        const totalPages = Math.ceil(filteredData.length / itemsPerPage);
        
        if (totalPages <= 1) {
            pagination.innerHTML = '';
            return;
        }

        let html = `<button class="pagination-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}><i class="fa-solid fa-chevron-left"></i></button>`;
        
        for (let i = 1; i <= totalPages; i++) {
            if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                html += `<button class="pagination-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
            } else if (i === currentPage - 2 || i === currentPage + 2) {
                html += `<span style="padding: 0 5px; color: #888;">...</span>`;
            }
        }

        html += `<button class="pagination-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}><i class="fa-solid fa-chevron-right"></i></button>`;
        pagination.innerHTML = html;
    }

    function changePage(page) {
        currentPage = page;
        renderTable();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function toggleStatus(reportId, type, currentVal) {
        const action = type === 'pin' ? 'togglePin' : 'toggleProcess';
        try {
            await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: action, reportId: reportId, value: !currentVal })
            });
            loadData();
        } catch (e) { Swal.fire('Error', 'ไม่สามารถอัพเดทสถานะได้', 'error'); }
    }

    async function deleteJob(reportId) {
        const confirm = await Swal.fire({
            title: 'ยืนยันการลบ?',
            text: "คุณจะไม่สามารถกู้คืนข้อมูลนี้ได้!",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#FF3B30',
            cancelButtonColor: '#8e8e93',
            confirmButtonText: 'ลบรายการ',
            cancelButtonText: 'ยกเลิก',
            customClass: { popup: 'swal-modal-custom' }
        });

        if (confirm.isConfirmed) {
            Swal.fire({ title: 'กำลังลบ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: "delete", reportId: reportId }) });
            Swal.fire({ title: 'ลบสำเร็จ', icon: 'success', timer: 1500, allowOutsideClick: false });
            loadData();
        }
    }

    function viewFiles(files) {
        let content = `<div style="display:flex; flex-direction:column; gap:10px; text-align:left; padding:10px;">`;
        files.forEach(f => {
            content += `<a href="${f.url}" target="_blank" style="text-decoration:none; background:#f2f2f7; padding:12px; border-radius:12px; display:flex; align-items:center; gap:10px; color:var(--ios-blue); font-weight:500; border: 1px solid #e5e5ea;">
                <i class="fa-solid fa-file-arrow-down" style="font-size:20px;"></i>
                <span style="flex-grow:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${f.name}</span>
            </a>`;
        });
        content += `</div>`;
        Swal.fire({ title: 'รายการเอกสาร', html: content, showCloseButton: true, showConfirmButton: false, customClass: { popup: 'swal-modal-custom' } });
    }

    function openAddJobModal() {
        selectedFiles = [];
        const reportId = generateReportId();
        const today = formatForInputDate(new Date());

        Swal.fire({
            title: 'เพิ่มรายการงานใหม่',
            html: `
                <div class="swal-form-container">
                    <div><label class="swal-label">วันที่รับงาน</label><input type="date" id="swal-date" class="swal-input-styled" value="${today}"></div>
                    <div><label class="swal-label">รหัสสมาชิก</label><input type="text" id="swal-memberId" class="swal-input-styled" placeholder="เช่น 0102555"></div>
                    <div><label class="swal-label">ชื่อลูกค้า</label><input type="text" id="swal-name" class="swal-input-styled" placeholder="ระบุชื่อลูกค้า"></div>
                    <div><label class="swal-label">เบอร์โทรศัพท์</label><input type="text" id="swal-phone" class="swal-input-styled" placeholder="ระบุเบอร์โทร"></div>
                    <div><label class="swal-label">ประเภทงาน</label><select id="swal-jobType" class="swal-input-styled">${jobTypes.map(t => `<option value="${t}">${t}</option>`).join('')}</select></div>
                    <div><label class="swal-label">วันครบกำหนด</label><input type="date" id="swal-deadline" class="swal-input-styled" value="${today}"></div>
                    <div class="swal-field-full"><label class="swal-label">พนักงานผู้รับผิดชอบ</label><input type="text" id="swal-staff" class="swal-input-styled" placeholder="ระบุชื่อพนักงาน"></div>
                    <div class="swal-field-full"><label class="swal-label">รายละเอียดงาน</label><textarea id="swal-jobDetail" class="swal-input-styled" style="height:100px; resize:none;" placeholder="ระบุรายละเอียดเพิ่มเติม..."></textarea></div>
                    <div class="swal-field-full">
                        <label class="swal-label">แนบไฟล์เอกสาร</label>
                        <input type="file" id="swal-files" multiple style="display:none;" onchange="handleFileSelect(this)">
                        <button type="button" class="swal-input-styled" onclick="document.getElementById('swal-files').click()" style="text-align:center; cursor:pointer; background:#fff;">
                            <i class="fa-solid fa-cloud-arrow-up"></i> เลือกไฟล์
                        </button>
                        <div id="file-list-display" class="file-list"></div>
                    </div>
                </div>
            `,
            confirmButtonText: 'บันทึกข้อมูล',
            showCancelButton: true,
            cancelButtonText: 'ยกเลิก',
            customClass: { popup: 'swal-modal-custom', confirmButton: 'btn-add-job' },
            preConfirm: () => {
                return {
                    action: "create",
                    reportId: reportId,
                    date: document.getElementById('swal-date').value,
                    memberId: "'" + document.getElementById('swal-memberId').value,
                    name: document.getElementById('swal-name').value,
                    phone: "'" + document.getElementById('swal-phone').value,
                    staff: document.getElementById('swal-staff').value,
                    jobDetail: document.getElementById('swal-jobDetail').value,
                    jobType: document.getElementById('swal-jobType').value,
                    deadline: document.getElementById('swal-deadline').value,
                    files: selectedFiles.map(f => ({name: f.name, data: f.data}))
                };
            }
        }).then(async (result) => {
            if (result.isConfirmed) {
                Swal.fire({title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(result.value) });
                Swal.fire({title: 'สำเร็จ', icon: 'success', timer: 1500, allowOutsideClick: false}); loadData();
            }
        });
    }

    async function handleFileSelect(input) {
        const files = Array.from(input.files);
        for (let file of files) {
            const base64 = await toBase64(file);
            selectedFiles.push({ name: file.name, data: base64 });
        }
        updateFileDisplay();
    }

    function toBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result.split(',')[1]);
            reader.onerror = error => reject(error);
        });
    }

    function updateFileDisplay() {
        const container = document.getElementById('file-list-display');
        let html = '';
        existingFiles.forEach((f, i) => {
            html += `<div class="file-item existing-file-item"><span><i class="fa-solid fa-server"></i> ${f.name}</span><i class="fa-solid fa-trash-can remove-file" onclick="removeExisting(${i})"></i></div>`;
        });
        selectedFiles.forEach((f, i) => {
            html += `<div class="file-item"><span><i class="fa-solid fa-file"></i> ${f.name}</span><i class="fa-solid fa-xmark remove-file" onclick="removeSelected(${i})"></i></div>`;
        });
        container.innerHTML = html;
    }

    window.removeSelected = (idx) => { selectedFiles.splice(idx, 1); updateFileDisplay(); };
    window.removeExisting = (idx) => { existingFiles.splice(idx, 1); updateFileDisplay(); };

    function openEditModal(item) {
        selectedFiles = [];
        existingFiles = item[12] ? JSON.parse(item[12]) : [];

        Swal.fire({
            title: 'แก้ไขข้อมูลงาน',
            html: `
                <div class="swal-form-container">
                    <div><label class="swal-label">วันที่รับงาน</label><input type="date" id="swal-date" class="swal-input-styled" value="${formatForInputDate(item[1])}"></div>
                    <div><label class="swal-label">รหัสสมาชิก</label><input type="text" id="swal-memberId" class="swal-input-styled" value="${item[2].replace("'", "")}"></div>
                    <div><label class="swal-label">ชื่อลูกค้า</label><input type="text" id="swal-name" class="swal-input-styled" value="${item[3]}"></div>
                    <div><label class="swal-label">เบอร์โทรศัพท์</label><input type="text" id="swal-phone" class="swal-input-styled" value="${item[4].replace("'", "")}"></div>
                    <div><label class="swal-label">ประเภทงาน</label><select id="swal-jobType" class="swal-input-styled">${jobTypes.map(t => `<option value="${t}" ${t === item[8] ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
                    <div><label class="swal-label">วันครบกำหนด</label><input type="date" id="swal-deadline" class="swal-input-styled" value="${formatForInputDate(item[10])}"></div>
                    <div class="swal-field-full"><label class="swal-label">พนักงานผู้รับผิดชอบ</label><input type="text" id="swal-staff" class="swal-input-styled" value="${item[5]}"></div>
                    <div class="swal-field-full"><label class="swal-label">รายละเอียดงาน</label><textarea id="swal-jobDetail" class="swal-input-styled" style="height:100px; resize:none;">${item[6]}</textarea></div>
                    <div class="swal-field-full">
                        <label class="swal-label">แนบไฟล์เพิ่ม / จัดการไฟล์เดิม</label>
                        <input type="file" id="swal-files" multiple style="display:none;" onchange="handleFileSelect(this)">
                        <button type="button" class="swal-input-styled" onclick="document.getElementById('swal-files').click()" style="text-align:center; cursor:pointer; background:#fff;">
                            <i class="fa-solid fa-cloud-arrow-up"></i> เลือกไฟล์เพิ่ม
                        </button>
                        <div id="file-list-display" class="file-list"></div>
                    </div>
                </div>
            `,
            confirmButtonText: 'บันทึกการแก้ไข',
            showCancelButton: true,
            cancelButtonText: 'ยกเลิก',
            customClass: { popup: 'swal-modal-custom' },
            didOpen: () => updateFileDisplay(),
            preConfirm: () => {
                return { 
                    action: "update", 
                    reportId: item[11], 
                    date: document.getElementById('swal-date').value, 
                    memberId: "'" + document.getElementById('swal-memberId').value, 
                    name: document.getElementById('swal-name').value, 
                    phone: "'" + document.getElementById('swal-phone').value, 
                    staff: document.getElementById('swal-staff').value, 
                    jobDetail: document.getElementById('swal-jobDetail').value, 
                    jobType: document.getElementById('swal-jobType').value, 
                    deadline: document.getElementById('swal-deadline').value,
                    existingFiles: existingFiles, 
                    files: selectedFiles.map(f => ({name: f.name, data: f.data})) 
                };
            }
        }).then(async (result) => {
            if (result.isConfirmed) {
                Swal.fire({title: 'กำลังอัพเดท...', allowOutsideClick: false, didOpen: () => Swal.showLoading()});
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(result.value) });
                Swal.fire({title: 'สำเร็จ', icon: 'success', timer: 1500, allowOutsideClick: false}); loadData();
            }
        });
    }

    window.onload = () => { loadButtonPosition(); loadData(); };
</script>
