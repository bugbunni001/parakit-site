<style>
    /* Sidebar Layout Customization */
    .sidebar-wrapper {
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 10px 0; /* ลดช่องไฟบนล่างของตัว sidebar */
    }

    .sidebar-brand {
        padding: 15px 24px;

        align-items: center;
        gap: 12px;
    }

    .brand-logo {

        color: white;
    }

    /* Menu Section Styles */
    .menu-section {
        margin-bottom: 12px; /* ลดช่องว่างระหว่างกลุ่มเมนู */
    }

    .menu-label {
        padding: 0 24px 6px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: rgba(255, 255, 255, 0.4);
        font-weight: 600;
    }

    .menu-list {
        list-style: none;
        padding: 0 12px;
        margin: 0;
    }

    .menu-item {
        margin-bottom: 2px; /* ลดช่องไฟระหว่างรายการเมนูแต่ละแถว */
        border-radius: 10px;
        overflow: hidden;
    }

    .menu-link {
        display: flex;
        align-items: center;
        padding: 10px 14px; /* ปรับ Padding ภายในให้กระชับ */
        color: rgba(255, 255, 255, 0.8);
        text-decoration: none;
        transition: all 0.2s;
        font-size: 14px;
        gap: 12px;
    }

    .menu-link i {
        width: 20px;
        text-align: center;

        color: var(--ios-blue);
    }

    .menu-link:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
    }

    /* Dropdown Logic */
    .has-dropdown .dropdown-content {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease-out;
        background: rgba(0, 0, 0, 0.2);
        margin: 0 8px;
        border-radius: 8px;
    }

    .has-dropdown.open .dropdown-content {
        max-height: 500px;
        margin-top: 2px;
        margin-bottom: 5px;
        padding: 5px 0; /* ลดช่องไฟในตัว dropdown */
    }

    .has-dropdown .arrow {
        margin-left: auto;
        font-size: 10px;
        transition: transform 0.3s;
        opacity: 0.5;
    }

    .has-dropdown.open .arrow {
        transform: rotate(180deg);
    }

    .dropdown-link {
        padding: 8px 14px 8px 46px; /* ดันข้อความลูกให้ตรงกับข้อความแม่ */
        font-size: 13px;
        display: block;
        color: rgba(255, 255, 255, 0.6);
        text-decoration: none;
        transition: 0.2s;
    }

    .dropdown-link:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.05);
    }

    .active-link {
        background: rgba(0, 122, 255, 0.15) !important;
        color: #fff !important;
        font-weight: 500;
    }
</style>
