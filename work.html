<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเคลียร์งาน - Parakit-site</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --ios-blue: #007aff;
            --ios-bg: #f2f2f7;
            --glass-white: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-main: #1c1c1e;
            --text-light: #8e8e93;
            --ios-red: #FF3B30;
        }

        /* ===== GLOBAL RESET & FONT FIX ===== */
        * { 
            box-sizing: border-box; 
            /* บังคับใช้ Kanit และสำรองด้วย sans-serif ป้องกันฟอนต์สี่เหลี่ยม */
            font-family: 'Kanit', Helvetica, Arial, sans-serif !important; 
        }
        
        body { 
            margin: 0; 
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            background-attachment: fixed;
            color: var(--text-main); 
            -webkit-font-smoothing: antialiased;
            padding-bottom: 60px;
            min-height: 100vh;
        }

        /* ===== Header Navbar ===== */
        .top-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 65px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            z-index: 1200;
            display: flex;
            align-items: center;
            padding: 0 25px;
            border-bottom: 0.5px solid rgba(0,0,0,0.1);
        }

        .header-title {
            font-weight: 700; 
            font-size: 1.3rem; 
            color: var(--text-main); 
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ===== Main Content Area (Full Width) ===== */
        .main-content { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 100px 20px 40px; 
            animation: fadeIn 0.6s ease-out; 
            width: 100%;
        }

        .glass-card { 
            background: rgba(255, 255, 255, 0.4); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px; 
            border: 1px solid var(--glass-border); 
            box-shadow: 0 10px 40px rgba(0,0,0,0.08); 
        }

        .container { 
            padding: 30px; 
            width: 100%; 
            max-width: 650px; 
            margin-bottom: 40px; 
        }
        
        h2 { text-align: center; margin-bottom: 25px; font-size: 24px; color: #1c1c1e; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; color: #444; }
        
        input, select, textarea {
            width: 100%; padding: 12px 15px; border-radius: 12px; border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.6); font-size: 15px; outline: none; transition: 0.3s;
            color: var(--text-main);
        }

        input:focus, select:focus, textarea:focus { 
            background: white; 
            border-color: var(--ios-blue); 
            box-shadow: 0 0 0 4px rgba(0,122,255,0.1); 
        }

        .btn-submit {
            width: 100%; padding: 15px; border: none; border-radius: 12px;
            background: var(--ios-blue); color: white; font-size: 16px; font-weight: 600;
            cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-submit:hover { opacity: 0.9; transform: scale(1.01); }
        .btn-submit:disabled { background: #ccc; cursor: not-allowed; }

        /* ===== Table Styling ===== */
        .list-container { width: 100%; max-width: 1100px; }
        .table-wrapper { overflow-x: auto; border-radius: 20px; background: rgba(255,255,255,0.4); }
        
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th { 
            background: rgba(255, 255, 255, 0.5); 
            padding: 16px; 
            text-align: left; 
            font-size: 14px; 
            color: #555; 
            border-bottom: 1px solid rgba(0,0,0,0.05); 
        }
        td { padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.3); font-size: 14px; vertical-align: middle; }

        .clickable { cursor: pointer; transition: 0.2s; }
        .clickable:hover { color: var(--ios-blue); }
        
        .text-truncate { 
            max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; 
            font-size: 13px; color: #666;
        }

        .btn-delete {
            background: #fff0f0; color: var(--ios-red); border: 1px solid #ffdada;
            padding: 8px 12px; border-radius: 10px; cursor: pointer; transition: 0.2s;
        }
        .btn-delete:hover { background: var(--ios-red); color: white; }

        .detail-row { display: flex; margin-bottom: 10px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .detail-label { font-weight: 600; width: 120px; color: #8e8e93; flex-shrink: 0; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 768px) {
            .container { padding: 20px; }
            .text-truncate { max-width: 150px; }
            .header-title { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

<header class="top-header">
    <div class="header-title">
        <i class="fa-solid fa-clipboard-check" style="color: var(--ios-blue);"></i>
        <span>ระบบเคลียร์งาน</span>
    </div>
</header>

<div class="main-content">
    <div class="container glass-card">
        <h2><i class="fa-solid fa-pen-to-square"></i> บันทึกงานกันลืม</h2>
        <form id="jobForm">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="form-group">
                    <label>วันที่ดำเนินการ</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label>หมายเลขสมาชิก</label>
                    <input type="text" id="memberId" placeholder="TMH/TOL/TVS" required>
                </div>
            </div>
            <div class="form-group">
                <label>ชื่อลูกค้า</label>
                <input type="text" id="name" placeholder="ระบุชื่อ-นามสกุล" required>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="form-group">
                    <label>เบอร์ติดต่อ</label>
                    <input type="text" id="phone" placeholder="0XXXXXXXXX" required>
                </div>
                <div class="form-group">
                    <label>พนักงานผู้รับผิดชอบ</label>
                    <select id="staff" required>
                        <option value="">-- เลือกพนักงาน --</option>
                        <option value="ศุภกฤต">ศุภกฤต</option>
                        <option value="นวพล">นวพล</option>
                        <option value="ปิยะพร">ปิยะพร</option>
                        <option value="กรทักษ์">กรทักษ์</option>
                    </select>
                </div>
            </div>
            <div class="form-group">
                <label>รายละเอียดงาน</label>
                <textarea id="jobDetail" rows="3" placeholder="ระบุรายละเอียดงานที่ดำเนินการ..."></textarea>
            </div>
            <div class="form-group">
                <label>แนบรูปภาพหลักฐาน (ถ้ามี)</label>
                <input type="file" id="file" accept="image/*">
            </div>
            <button type="submit" id="submitBtn" class="btn-submit">
                <i class="fa-solid fa-save"></i> บันทึกข้อมูล
            </button>
        </form>
    </div>

    <div class="list-container">
        <div class="table-wrapper glass-card">
            <table>
                <thead>
                    <tr>
                        <th>วันที่</th>
                        <th>รหัสสมาชิก</th>
                        <th>ลูกค้า / เบอร์</th>
                        <th>รายละเอียด</th>
                        <th>พนักงาน</th>
                        <th>รูปภาพ</th>
                        <th>จัดการ</th>
                    </tr>
                </thead>
                <tbody id="dataTable">
                    </tbody>
            </table>
        </div>
    </div>
    
    <p style="margin-top:30px; font-size:12px; color:#666; letter-spacing: 0.5px;">
        © 2026 COPY RIGHT BY <strong>ANGERINA FROG</strong>
    </p>
</div>

<script>
    // URL ของ Google Apps Script
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxQ6oHl9McfWiPCEzIZXOlqJlyqrrv_jzultnBcpOhdfe-jnqCGZ3mBST6-uSP-icA/exec';

    // --- ระบบจัดการข้อมูล ---
    
    // แปลงวันที่ให้แสดงผลสวยงาม
    function fixDate(dateVal) {
        if (!dateVal) return "-";
        const d = new Date(dateVal);
        if (isNaN(d)) return dateVal;
        return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
    }

    // แสดง Modal รายละเอียดฉบับเต็ม
    function showFullDetail(rowJson) {
        const item = JSON.parse(decodeURIComponent(rowJson));
        const html = `
            <div style="text-align: left; padding: 10px;">
                <div class="detail-row"><div class="detail-label">วันที่:</div><div>${fixDate(item[0])}</div></div>
                <div class="detail-row"><div class="detail-label">รหัสสมาชิก:</div><div>${String(item[1]).replace(/^'/, '')}</div></div>
                <div class="detail-row"><div class="detail-label">ลูกค้า:</div><div>${item[2]}</div></div>
                <div class="detail-row"><div class="detail-label">เบอร์ติดต่อ:</div><div>${String(item[3]).replace(/^'/, '')}</div></div>
                <div class="detail-row"><div class="detail-label">พนักงาน:</div><div>${item[4]}</div></div>
                <div class="detail-row"><div class="detail-label">รายละเอียด:</div><div style="white-space:pre-wrap; color:#333;">${item[6] || '-'}</div></div>
            </div>
        `;
        Swal.fire({ 
            title: 'รายละเอียดงาน', 
            html: html, 
            confirmButtonText: 'รับทราบ', 
            confirmButtonColor: '#007aff', 
            width: '500px',
            customClass: { popup: 'glass-card' }
        });
    }

    // โหลดข้อมูลจาก Google Sheets
    async function loadData() {
        const tableBody = document.getElementById('dataTable');
        tableBody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:40px; color:#8e8e93;"><i class="fa-solid fa-spinner fa-spin"></i> กำลังดึงข้อมูลล่าสุด...</td></tr>';
        
        try {
            const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({action: "read"}) });
            const data = await res.json();
            tableBody.innerHTML = '';

            if (data.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:30px;">ไม่พบข้อมูลในระบบ</td></tr>';
                return;
            }

            data.reverse().forEach(row => {
                const tr = document.createElement('tr');
                const rowJson = encodeURIComponent(JSON.stringify(row));
                const displayId = String(row[1]).replace(/^'/, '');
                const displayPhone = String(row[3]).replace(/^'/, '');

                tr.innerHTML = `
                    <td>${fixDate(row[0])}</td>
                    <td class="clickable" onclick="showFullDetail('${rowJson}')"><strong>${displayId}</strong></td>
                    <td class="clickable" onclick="showFullDetail('${rowJson}')">
                        <span style="font-weight:500;">${row[2]}</span><br>
                        <small style="color:#8e8e93">${displayPhone}</small>
                    </td>
                    <td class="clickable" onclick="showFullDetail('${rowJson}')">
                        <div class="text-truncate">${row[6] || "-"}</div>
                    </td>
                    <td><span style="background:#e1f0ff; color:#007aff; padding:4px 8px; border-radius:6px; font-size:12px;">${row[4]}</span></td>
                    <td>${row[5] ? `<a href="${row[5]}" target="_blank" style="color:#007aff; text-decoration:none;"><i class="fa-solid fa-image"></i> ดูรูป</a>` : '-'}</td>
                    <td>
                        <button class="btn-delete" onclick="deleteData('${row[0]}', '${row[1]}')">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        } catch (e) { 
            tableBody.innerHTML = '<tr><td colspan="7" style="text-align:center; color:red; padding:30px;">เกิดข้อผิดพลาดในการเชื่อมต่อเซิร์ฟเวอร์</td></tr>'; 
        }
    }

    // บันทึกข้อมูลใหม่
    document.getElementById('jobForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true; 
        btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> กำลังบันทึก...';

        const fileInput = document.getElementById('file');
        let fileData = null;
        if (fileInput.files.length > 0) {
            fileData = await new Promise(resolve => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.readAsDataURL(fileInput.files[0]);
            });
        }

        const payload = {
            action: "insert",
            date: document.getElementById('date').value,
            memberId: "'" + document.getElementById('memberId').value,
            name: document.getElementById('name').value,
            phone: "'" + document.getElementById('phone').value,
            staff: document.getElementById('staff').value,
            jobDetail: document.getElementById('jobDetail').value,
            fileData: fileData
        };

        try {
            const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
            if(response.ok) {
                Swal.fire({ icon: 'success', title: 'สำเร็จ', text: 'บันทึกข้อมูลเรียบร้อยแล้ว', timer: 2000, showConfirmButton: false });
                document.getElementById('jobForm').reset();
                document.getElementById('date').valueAsDate = new Date();
                loadData();
            }
        } catch (err) { 
            Swal.fire({ icon: 'error', title: 'ไม่สำเร็จ', text: 'ไม่สามารถบันทึกข้อมูลได้ กรุณาลองใหม่' }); 
        } finally {
            btn.disabled = false; 
            btn.innerHTML = '<i class="fa-solid fa-save"></i> บันทึกข้อมูล';
        }
    });

    // ลบข้อมูล
    async function deleteData(d, id) {
        const confirm = await Swal.fire({
            title: 'ยืนยันการลบ?',
            text: "ข้อมูลนี้จะถูกลบออกจากระบบถาวร",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#FF3B30',
            cancelButtonColor: '#8e8e93',
            confirmButtonText: 'ลบข้อมูล',
            cancelButtonText: 'ยกเลิก'
        });

        if (confirm.isConfirmed) {
            Swal.fire({ title: 'กำลังลบ...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
                const dateObj = new Date(d);
                const dateStr = dateObj.getFullYear() + '-' + String(dateObj.getMonth()+1).padStart(2,'0') + '-' + String(dateObj.getDate()).padStart(2,'0');
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({action: "delete", date: dateStr, memberId: id}) });
                Swal.fire({ icon: 'success', title: 'ลบข้อมูลสำเร็จ', timer: 1500, showConfirmButton: false });
                loadData();
            } catch (e) { 
                Swal.fire({ icon: 'error', title: 'ผิดพลาด', text: 'ลบข้อมูลไม่สำเร็จ' }); 
            }
        }
    }

    // เมื่อโหลดหน้าเว็บ
    window.onload = () => {
        // ตั้งค่าวันที่ปัจจุบันใน Input
        document.getElementById('date').valueAsDate = new Date();
        loadData();
    };
</script>

</body>
</html>
