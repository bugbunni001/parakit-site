<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเคลียร์งาน - Parakit-site</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --ios-blue: #007aff;
            --ios-dark-blue: #0056b3;
            --ios-bg: #f2f2f7;
            --glass-white: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
            --sidebar-dark: rgba(28, 28, 30, 0.94);
            --text-main: #1c1c1e;
            --text-light: #636366;
            --ios-red: #FF3B30;
            --ios-green: #34C759;
            --ios-orange: #FF9500;
            --shadow-soft: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }

        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }

        body { 
            margin: 0; 
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            background-attachment: fixed;
            color: var(--text-main); 
            min-height: 100vh;
            padding-bottom: 60px;
            scroll-behavior: smooth;
        }

        .top-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 65px;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            z-index: 1300;
            display: flex; align-items: center;
            padding: 0 20px 0 75px; 
            border-bottom: 1px solid var(--glass-border);
        }

        #floatingMenuBtn {
            position: fixed;
            top: 10px;
            left: 15px;
            width: 45px;
            height: 45px;
            background: var(--ios-blue);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: move;
            z-index: 2100;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
            border: none;
            touch-action: none;
            transition: transform 0.2s, opacity 0.2s;
        }
        #floatingMenuBtn:active { transform: scale(0.9); }

        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.2);
            z-index: 2000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .sidebar-overlay.active { display: block; opacity: 1; }

        .sidebar-float {
            position: fixed;
            width: 280px;
            max-height: 70vh;
            background: var(--sidebar-dark);
            border-radius: 20px;
            overflow-y: auto;
            z-index: 2001;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.8) translateY(10px);
            transition: opacity 0.3s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.2) transparent;
        }
        .sidebar-float.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1) translateY(0);
        }

        .sidebar-float .sidebar-header { padding: 20px; font-size: 17px; font-weight: 600; color: #fff; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
        .sidebar-float .menu { padding: 8px 0; }
        .sidebar-float .menu a, .sidebar-float .drop-btn { 
            width: 100%; padding: 12px 20px; background: none; border: none; 
            color: #ebebf5; text-align: left; font-size: 14px; cursor: pointer; 
            display: flex; align-items: center; text-decoration: none; transition: 0.2s;
        }
        .sidebar-float .menu a:hover, .sidebar-float .drop-btn:hover { background: rgba(255,255,255,0.1); }
        .sidebar-float .sub { display: none; background: rgba(0,0,0,0.2); }
        .sidebar-float .item.open .sub { display: block; }
        .sidebar-float .sub a { padding-left: 45px; font-size: 13px; color: #8e8e93; }

        .stats-container {
            width: 100%;
            max-width: 1300px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            padding: 10px 0 15px 0;
        }

        .stat-card-long {
            grid-column: 1 / -1;
            background: linear-gradient(90deg, #5856d6, #007aff);
            color: white;
            padding: 15px 25px;
            border-radius: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(88, 86, 214, 0.3);
            margin-bottom: 10px;
        }
        .stat-card-long:hover { transform: scale(1.01); filter: brightness(1.1); }
        .stat-card-long .info { display: flex; flex-direction: column; }
        .stat-card-long .title { font-size: 14px; font-weight: 600; }
        .stat-card-long .date-label { font-size: 20px; opacity: 0.9; }
        .stat-card-long .count-val { font-size: 28px; font-weight: 700; }

        .stat-card {
            padding: 15px 10px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            background: white;
            box-shadow: 0 10px 20px rgba(0,122,255,0.15);
            border-color: var(--ios-blue);
        }
        
        .stat-card.active {
            border-color: var(--ios-blue);
            background: white;
            box-shadow: 0 0 0 2px var(--ios-blue);
        }
        .stat-card .count { font-size: 22px; font-weight: 700; color: var(--ios-blue); line-height: 1; }
        .stat-card .label { font-size: 12px; color: var(--text-light); font-weight: 500; margin-top: 6px; }

        .stat-card.pinned-stat .count { color: var(--ios-orange); }
        .stat-card.processing-stat .count { color: var(--ios-dark-blue); }

        .main-content { 
            display: flex; flex-direction: column; align-items: center; 
            padding: 85px 25px 40px; 
            animation: fadeIn 0.6s ease-out; 
        }

        .action-bar {
            width: 100%; max-width: 1300px;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; gap: 15px;
            flex-wrap: wrap;
        }

        .btn-add-job {
            background: linear-gradient(135deg, #007aff, #0056b3);
            color: white; padding: 12px 28px; border-radius: 16px; border: none;
            font-size: 16px; font-weight: 600; cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 122, 255, 0.3);
            transition: 0.3s; display: flex; align-items: center; gap: 10px;
        }
        .btn-add-job:hover { transform: translateY(-3px); box-shadow: 0 12px 25px rgba(0, 122, 255, 0.4); opacity: 0.9; }

        .search-area-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-grow: 1;
            max-width: 410px;
        }

        .search-wrapper { 
            flex-grow: 1; position: relative; 
        }
        .search-wrapper i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--ios-blue); }
        .search-input { 
            width: 100%; padding: 14px 20px 14px 48px; border-radius: 18px; 
            border: 1px solid var(--glass-border); background: rgba(255, 255, 255, 0.8);
            outline: none; transition: 0.3s; font-size: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .search-input:focus { border-color: var(--ios-blue); box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1); background: white; }

        .btn-refresh-inline {
            width: 48px; height: 48px; border-radius: 18px; border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.8); color: var(--ios-blue);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.3s; font-size: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }
        .btn-refresh-inline:hover { background: white; transform: scale(1.05); color: var(--ios-green); border-color: var(--ios-green); }

        .table-wrapper { 
            width: 100%; max-width: 1300px; overflow-x: auto; border-radius: 28px; 
            background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); box-shadow: var(--shadow-soft);
        }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th { 
            background: rgba(255, 255, 255, 0.6); padding: 18px 15px; 
            text-align: left; font-size: 14px; color: var(--text-light); 
            border-bottom: 1px solid rgba(0,0,0,0.05); font-weight: 600; text-transform: uppercase;
        }
        td { padding: 16px 15px; border-bottom: 1px solid rgba(255,255,255,0.4); font-size: 14px; vertical-align: middle; transition: 0.2s; }
        tbody tr:hover td { background: rgba(255, 255, 255, 0.4); }

        .report-id-label {
            font-size: 10px;
            color: var(--text-light);
            background: rgba(0,0,0,0.05);
            padding: 1px 5px;
            border-radius: 4px;
            display: block;
            margin-top: 4px;
            font-weight: 400;
        }

        .job-type-badge {
            background: white; color: var(--ios-blue);
            padding: 4px 12px; border-radius: 10px;
            font-size: 12px; font-weight: 600; white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            border: 1px solid rgba(0, 122, 255, 0.15);
        }

        .pinned-row { background: rgba(255, 149, 0, 0.08) !important; }

        .action-btns-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        .action-btns {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .deadline-label-small {
            font-size: 11px;
            color: var(--ios-red);
            font-weight: 600;
            background: #fff0f0;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255, 59, 48, 0.2);
        }

        .btn-pin, .btn-process, .btn-edit, .btn-delete {
            width: 36px; height: 36px; border-radius: 10px; border: none; cursor: pointer; transition: all 0.2s;
            display: inline-flex; align-items: center; justify-content: center; font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        
        .btn-pin { background: #fff8ed; color: var(--ios-orange); }
        .btn-pin.active { background: var(--ios-orange); color: white; box-shadow: 0 4px 10px rgba(255, 149, 0, 0.3); }
        
        .btn-process { background: #eef7ff; color: var(--ios-blue); }
        .btn-process.active { background: var(--ios-dark-blue); color: white; box-shadow: 0 4px 10px rgba(0, 86, 179, 0.3); }
        .btn-process:hover:not(.active) { background: #ddecff; transform: translateY(-2px); }

        .btn-edit { background: #eef7ed; color: var(--ios-green); }
        .btn-edit:hover { background: var(--ios-green); color: white; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(52, 199, 89, 0.3); }

        .btn-delete { background: #fff0f0; color: var(--ios-red); }
        .btn-delete:hover { background: var(--ios-red); color: white; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(255, 59, 48, 0.3); }
        
        .btn-pin:hover:not(.active) { background: #ffe6c2; transform: translateY(-2px); }

        /* Pagination Styles */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 25px;
            width: 100%;
            max-width: 1300px;
        }

        .pagination-btn {
            min-width: 40px;
            height: 40px;
            padding: 0 10px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.6);
            color: var(--text-main);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pagination-btn:hover {
            background: white;
            border-color: var(--ios-blue);
            color: var(--ios-blue);
            transform: translateY(-2px);
        }

        .pagination-btn.active {
            background: var(--ios-blue);
            color: white;
            border-color: var(--ios-blue);
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3);
        }

        .pagination-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .floating-controls {
            position: fixed;
            bottom: 25px;
            right: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 1100;
        }

        .btn-float {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            color: var(--ios-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 18px;
            text-decoration: none;
        }

        .btn-float:hover {
            background: white;
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(0,122,255,0.2);
        }

        #btn-back-to-top {
            opacity: 0;
            visibility: hidden;
            transform: translateY(20px);
        }

        #btn-back-to-top.show { opacity: 1; visibility: visible; transform: translateY(0); }

        .swal2-container { z-index: 9999 !important; }
        .swal-modal-custom { border-radius: 30px !important; padding: 20px !important; }
        .swal2-title { font-weight: 700 !important; color: var(--text-main) !important; }

        .swal-form-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; text-align: left; margin-top: 15px; }
        .swal-field-full { grid-column: span 2; }
        .swal-label { font-size: 13px; font-weight: 600; color: var(--text-light); margin-bottom: 6px; display: block; margin-left: 5px; }
        .swal-input-styled { 
            width: 100%; padding: 12px 15px; border-radius: 14px; border: 1.5px solid #e5e5ea; 
            font-size: 15px; outline: none; transition: 0.2s; background: #f9f9f9;
        }
        .swal-input-styled:focus { border-color: var(--ios-blue); background: #fff; box-shadow: 0 0 0 4px rgba(0,122,255,0.1); }
        
        .detail-view-item { background: #f9f9f9; padding: 12px 15px; border-radius: 14px; border: 1.5px solid #f0f0f5; }
        .detail-view-item .val { font-size: 15px; font-weight: 600; color: var(--text-main); display: block; }

        /* File list styles */
        .file-list { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
        .file-item {
            display: flex; justify-content: space-between; align-items: center;
            background: #fff; padding: 8px 12px; border-radius: 10px; border: 1px solid #e5e5ea;
            font-size: 13px;
        }
        .file-item .remove-file { color: var(--ios-red); cursor: pointer; font-size: 16px; padding-left: 10px; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header class="top-header">
    <div style="font-weight: 700; font-size: 1.4rem; color: var(--text-main); letter-spacing: -1px;">ระบบเคลียร์งาน</div>
</header>

<button id="floatingMenuBtn" title="ลากเพื่อย้าย">เมนู</button>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebarFloat()"></div>
<aside class="sidebar-float" id="sidebarFloat"></aside>

<div class="floating-controls">
    <button id="btn-back-to-top" class="btn-float" onclick="scrollToTop()" title="กลับไปด้านบน">
        <i class="fa-solid fa-arrow-up"></i>
    </button>
</div>

<div class="main-content">
    
    <div class="stats-container" id="statsContainer"></div>

    <div class="action-bar">
        <button class="btn-add-job" onclick="openAddJobModal()">
            <i class="fa-solid fa-plus-circle"></i> เพิ่มรายการใหม่
        </button>
        <div class="search-area-wrapper">
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="ค้นหาข้อมูล..." onkeyup="filterData()">
            </div>
            <button class="btn-refresh-inline" onclick="loadData(true)" title="รีเฟรชข้อมูล">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th width="120">วันที่ / เลขที่</th>
                    <th width="160">ประเภทงาน</th>
                    <th>รหัสสมาชิก</th>
                    <th>ชื่อลูกค้า / เบอร์</th>
                    <th width="300">รายละเอียด</th> 
                    <th>พนักงาน</th>
                    <th>เอกสาร</th>
                    <th width="180">จัดการ</th>
                </tr>
            </thead>
            <tbody id="dataTable">
                <tr><td colspan="8" style="text-align:center; padding:50px; color:#888;">กำลังโหลดข้อมูล...</td></tr>
            </tbody>
        </table>
    </div>

    <div id="pagination" class="pagination-container"></div>
    
    <p style="margin-top:30px; font-size:13px; color:rgba(0,0,0,0.5); font-weight: 500;">
        <i class="fa-solid fa-copyright"></i> 2026 Copyright by <strong>Angerina Frog</strong>
    </p>
</div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz0kmLEb1_AlV4pPVU3qES7EnyXlGKjIt7X4ko_tQVpTuSHcCeTyshZ92KUL4lEL_iu/exec';

    const jobTypes = [
        "MGM ปรับลด", "ยกเลิกบริการ (ปกติ)", "ยกเลิกบริการ (5P)", "MNP",
        "เปลี่ยนรายเดือนเป็นเติมเงิน", "เปลี่ยนโปรโมชั่น", "Add ส่วนลด",
        "Add เน็ตเพิ่ม", "ระงับสัญญาณชั่วคราวTOL", "ส่งเรื่องตรวจสอบ"
    ];

    let fullData = [];
    let filteredData = [];
    let currentPage = 1;
    const itemsPerPage = 10;
    
    // Global variable for temporary file storage
    let selectedFiles = [];

    const dragBtn = document.getElementById('floatingMenuBtn');
    const sideFloat = document.getElementById('sidebarFloat');
    const sideOverlay = document.getElementById('sidebarOverlay');
    let isDragging = false;
    let startX, startY, shiftX, shiftY;

    function generateReportId() {
        return Math.floor(1000000000 + Math.random() * 9000000000).toString();
    }

    function loadButtonPosition() {
        const savedLeft = localStorage.getItem('floatBtnLeft');
        const savedTop = localStorage.getItem('floatBtnTop');
        if (savedLeft && savedTop) {
            dragBtn.style.left = savedLeft + 'px';
            dragBtn.style.top = savedTop + 'px';
        }
    }

    dragBtn.onpointerdown = function(e) {
        isDragging = false;
        startX = e.clientX; startY = e.clientY;
        const rect = dragBtn.getBoundingClientRect();
        shiftX = e.clientX - rect.left; shiftY = e.clientY - rect.top;
        dragBtn.setPointerCapture(e.pointerId);
        document.addEventListener('pointermove', onPointerMove);
        document.addEventListener('pointerup', onPointerUp);
    };

    function onPointerMove(e) {
        if (!isDragging && (Math.abs(e.clientX - startX) > 5 || Math.abs(e.clientY - startY) > 5)) isDragging = true;
        if (isDragging) {
            let newX = e.clientX - shiftX; let newY = e.clientY - shiftY;
            newX = Math.max(0, Math.min(newX, window.innerWidth - dragBtn.offsetWidth));
            newY = Math.max(0, Math.min(newY, window.innerHeight - dragBtn.offsetHeight));
            dragBtn.style.left = newX + 'px'; dragBtn.style.top = newY + 'px';
        }
    }

    function onPointerUp(e) {
        document.removeEventListener('pointermove', onPointerMove);
        document.removeEventListener('pointerup', onPointerUp);
        dragBtn.releasePointerCapture(e.pointerId);
        if (isDragging) {
            localStorage.setItem('floatBtnLeft', dragBtn.offsetLeft);
            localStorage.setItem('floatBtnTop', dragBtn.offsetTop);
        } else { toggleSidebarFloat(); }
        isDragging = false;
    }

    function toggleSidebarFloat() {
        const btnRect = dragBtn.getBoundingClientRect();
        const sidebarWidth = 280;
        let top = btnRect.bottom + 10;
        let left = btnRect.left;
        if (left + sidebarWidth > window.innerWidth) left = window.innerWidth - sidebarWidth - 15;
        if (top + 400 > window.innerHeight) { top = btnRect.top - 410; if (top < 10) top = 10; }
        sideFloat.style.top = top + 'px'; sideFloat.style.left = left + 'px';
        sideFloat.style.transformOrigin = `${btnRect.left - left + 20}px ${btnRect.top > top ? 'bottom' : 'top'}`;
        const isActive = sideFloat.classList.toggle('active');
        sideOverlay.classList.toggle('active', isActive);
        if (isActive && !sideFloat.innerHTML) loadSidebarContent();
    }

    function closeSidebarFloat() {
        sideFloat.classList.remove('active');
        sideOverlay.classList.remove('active');
    }

    function loadSidebarContent() {
        fetch('sidebar.html')
            .then(res => res.text())
            .then(data => {
                sideFloat.innerHTML = `<div class="sidebar-header">เมนูนำทาง</div>` + data;
                ['credit', 'branch', 'sales'].forEach(id => {
                    if (localStorage.getItem('menu-' + id) === 'true') {
                        const el = sideFloat.querySelector('#menu-' + id);
                        if (el) el.classList.add('open');
                    }
                });
            }).catch(err => console.log("Sidebar load failed"));
    }

    window.toggleDrop = function(btn, id) {
        const item = btn.parentElement;
        const isOpen = item.classList.toggle("open");
        if (id) localStorage.setItem('menu-' + id, isOpen);
    }

    function fixDate(dateVal) {
        if (!dateVal || dateVal === "-") return "-";
        const d = new Date(dateVal);
        return isNaN(d) ? dateVal : `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
    }

    function formatForInputDate(dateVal) {
        if (!dateVal) return "";
        const d = new Date(dateVal);
        if (isNaN(d)) return "";
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    window.onscroll = function() {
        const btn = document.getElementById("btn-back-to-top");
        if (document.body.scrollTop > 200 || document.documentElement.scrollTop > 200) btn.classList.add("show");
        else btn.classList.remove("show");
    };

    function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

    function updateStats(data) {
        const statsCon = document.getElementById('statsContainer');
        const counts = {};
        let processingCount = 0;
        let pinnedCount = 0;
        let deadlineCount = 0;
        const todayStr = formatForInputDate(new Date());

        jobTypes.forEach(t => counts[t] = 0);
        
        data.forEach(row => {
            const type = row[8] || "ทั่วไป";
            if(counts[type] !== undefined) counts[type]++;
            if(row[7] === "true" || row[7] === true) pinnedCount++;
            if(row[9] === "true" || row[9] === true) processingCount++;
            const deadline = formatForInputDate(row[10]);
            if(deadline === todayStr) deadlineCount++;
        });

        let cardsHtml = `
            <div class="stat-card-long" onclick="filterByDeadline(this)">
                <div class="info">
                    <span class="title">งานที่ครบกำหนด(วันนี้)</span>
                    <span class="date-label">${fixDate(new Date())}</span>
                </div>
                <div class="count-val">${deadlineCount} รายการ</div>
            </div>
            <div class="stat-card active" onclick="filterByType('ทั้งหมด', this)">
                <span class="count">${data.length}</span>
                <span class="label">ทั้งหมด</span>
            </div>
            <div class="stat-card pinned-stat" onclick="filterByPinned(this)">
                <span class="count">${pinnedCount}</span>
                <span class="label">ปักหมุด</span>
            </div>
            <div class="stat-card processing-stat" onclick="filterByProcessing(this)">
                <span class="count">${processingCount}</span>
                <span class="label">กำลังดำเนินการ</span>
            </div>
        `;
        jobTypes.forEach(type => {
            cardsHtml += `<div class="stat-card" onclick="filterByType('${type}', this)"><span class="count">${counts[type]}</span><span class="label">${type}</span></div>`;
        });
        statsCon.innerHTML = cardsHtml;
    }

    function filterByDeadline(el) {
        document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active'));
        const todayStr = fixDate(new Date());
        filteredData = fullData.filter(row => fixDate(row[10]) === todayStr);
        currentPage = 1;
        renderTable();
    }

    function filterByPinned(el) {
        document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        filteredData = fullData.filter(row => (row[7] === "true" || row[7] === true));
        currentPage = 1;
        renderTable();
    }

    function filterByProcessing(el) {
        document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        filteredData = fullData.filter(row => (row[9] === "true" || row[9] === true));
        currentPage = 1;
        renderTable();
    }

    function filterByType(type, el) {
        document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active'));
        el.classList.add('active');
        document.getElementById('searchInput').value = (type === 'ทั้งหมด') ? '' : type;
        filterData();
    }

    function filterData() {
        const filter = document.getElementById('searchInput').value.toLowerCase();
        if (!filter) {
            filteredData = [...fullData];
        } else {
            filteredData = fullData.filter(row => {
                const text = row.join(' ').toLowerCase();
                return text.includes(filter);
            });
        }
        currentPage = 1;
        renderTable();
    }

    async function loadData(manual = false) {
        const tableBody = document.getElementById('dataTable');
        const refreshBtn = document.querySelector('.fa-rotate-right');
        const scrollPos = window.scrollY;
        const currentSearch = document.getElementById('searchInput').value;

        if(refreshBtn) refreshBtn.classList.add('fa-spin');
        try {
            const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({action: "read"}) });
            const data = await res.json();
            
            // Sort Data
            fullData = data.sort((a, b) => {
                const pinA = (a[7] === "true" || a[7] === true);
                const pinB = (b[7] === "true" || b[7] === true);
                if (pinA && !pinB) return -1;
                if (!pinA && pinB) return 1;
                return new Date(b[0]) - new Date(a[0]);
            });

            filteredData = [...fullData];
            updateStats(fullData);
            
            if (!manual && currentSearch) {
                document.getElementById('searchInput').value = currentSearch;
                filterData();
            } else {
                renderTable();
            }

            if (!manual) window.scrollTo(0, scrollPos);

        } catch (e) { tableBody.innerHTML = '<tr><td colspan="8">โหลดข้อมูลไม่สำเร็จ</td></tr>'; }
        finally { if(refreshBtn) refreshBtn.classList.remove('fa-spin'); }
    }

    function renderTable() {
        const tableBody = document.getElementById('dataTable');
        tableBody.innerHTML = '';

        if (filteredData.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:50px; color:#888;">ไม่พบข้อมูล</td></tr>';
            renderPagination(0);
            return;
        }

        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const paginatedItems = filteredData.slice(startIndex, endIndex);

        paginatedItems.forEach(row => {
            const tr = document.createElement('tr');
            const isPinned = (row[7] === "true" || row[7] === true);
            const isProcessing = (row[9] === "true" || row[9] === true);
            const reportId = row[11] || "-";
            const rowJson = encodeURIComponent(JSON.stringify(row));
            const deadlineDate = fixDate(row[10]);

            tr.setAttribute('data-deadline', deadlineDate);
            if (isPinned) tr.classList.add('pinned-row');

            let filesHtml = '-';
            if (row[5]) {
                const urls = row[5].split(", ");
                filesHtml = urls.map((u, i) => `<a href="${u}" target="_blank" style="color:var(--ios-blue); text-decoration:none; margin-right:5px;"><i class="fa-solid fa-file"></i> ${i+1}</a>`).join('');
            }

            tr.innerHTML = `
                <td>
                    <strong>${fixDate(row[0])}</strong>
                    <span class="report-id-label">ID: ${reportId}</span>
                </td>
                <td><span class="job-type-badge">${row[8] || "ทั่วไป"}</span></td>
                <td onclick="showFullDetail('${rowJson}')" style="cursor:pointer; font-weight:600; color:var(--ios-blue);">${String(row[1]).replace(/^'/, '')}</td>
                <td onclick="showFullDetail('${rowJson}')" style="cursor:pointer;">${row[2]}<br><small style="color:#8e8e93">${String(row[3]).replace(/^'/, '')}</small></td>
                <td onclick="showFullDetail('${rowJson}')" style="cursor:pointer;">
                    <div style="max-width:300px; max-height:100px; overflow:hidden; white-space:normal; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; color:#666; font-size:13px; line-height:1.4;">${row[6] || "-"}</div>
                </td>
                <td>${row[4]}</td>
                <td>${filesHtml}</td>
                <td>
                    <div class="action-btns-container">
                        <div class="action-btns">
                            <button class="btn-pin ${isPinned ? 'active' : ''}" onclick="togglePin('${reportId}')" title="ปักหมุด"><i class="fa-solid fa-thumbtack"></i></button>
                            <button class="btn-process ${isProcessing ? 'active' : ''}" onclick="toggleProcessing('${reportId}')" title="กำลังดำเนินการ"><i class="fa-solid fa-clock-rotate-left"></i></button>
                            <button class="btn-edit" onclick="editData('${rowJson}')" title="แก้ไขข้อมูล"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button class="btn-delete" onclick="deleteData('${reportId}')" title="ลบรายการ"><i class="fa-solid fa-trash"></i></button>
                        </div>
                        ${deadlineDate !== "-" ? `<span class="deadline-label-small">ครบกำหนด : ${deadlineDate}</span>` : ''}
                    </div>
                </td>
            `;
            tableBody.appendChild(tr);
        });

        renderPagination(filteredData.length);
    }

    function renderPagination(totalItems) {
        const paginationCon = document.getElementById('pagination');
        paginationCon.innerHTML = '';
        
        const totalPages = Math.ceil(totalItems / itemsPerPage);
        if (totalPages <= 1) return;

        // ปุ่มย้อนกลับ
        const prevBtn = document.createElement('button');
        prevBtn.className = 'pagination-btn';
        prevBtn.innerHTML = '<i class="fa-solid fa-chevron-left"></i>';
        prevBtn.disabled = currentPage === 1;
        prevBtn.onclick = () => { currentPage--; renderTable(); scrollToTop(); };
        paginationCon.appendChild(prevBtn);

        // เลขหน้า
        for (let i = 1; i <= totalPages; i++) {
            const pageBtn = document.createElement('button');
            pageBtn.className = `pagination-btn ${i === currentPage ? 'active' : ''}`;
            pageBtn.innerText = i;
            pageBtn.onclick = () => { currentPage = i; renderTable(); scrollToTop(); };
            paginationCon.appendChild(pageBtn);
        }

        // ปุ่มถัดไป
        const nextBtn = document.createElement('button');
        nextBtn.className = 'pagination-btn';
        nextBtn.innerHTML = '<i class="fa-solid fa-chevron-right"></i>';
        nextBtn.disabled = currentPage === totalPages;
        nextBtn.onclick = () => { currentPage++; renderTable(); scrollToTop(); };
        paginationCon.appendChild(nextBtn);
    }

    async function toggleProcessing(reportId) {
        Swal.fire({title: 'กำลังดำเนินการ...', allowOutsideClick: false, allowEscapeKey: false, didOpen: () => Swal.showLoading()});
        try { 
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: "toggleProcessing", reportId: reportId }) }); 
            Swal.close(); loadData(); 
        } catch (err) { Swal.fire({title: 'Error', icon: 'error', allowOutsideClick: false}); }
    }

    async function togglePin(reportId) {
        Swal.fire({title: 'กำลังดำเนินการ...', allowOutsideClick: false, allowEscapeKey: false, didOpen: () => Swal.showLoading()});
        try { 
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: "togglePin", reportId: reportId }) }); 
            Swal.close(); loadData(); 
        } catch (err) { Swal.fire({title: 'Error', icon: 'error', allowOutsideClick: false}); }
    }

    async function deleteData(reportId) {
        const confirm = await Swal.fire({ 
            title: 'ยืนยันการลบ?', text: "ID: " + reportId, icon: 'warning', 
            showCancelButton: true, confirmButtonColor: '#FF3B30', confirmButtonText: 'ลบเลย',
            allowOutsideClick: false, allowEscapeKey: false
        });
        if (confirm.isConfirmed) {
            Swal.fire({title: 'กำลังลบ...', allowOutsideClick: false, allowEscapeKey: false, didOpen: () => Swal.showLoading()});
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({action: "delete", reportId: reportId}) });
            Swal.fire({title: 'ลบแล้ว!', icon: 'success', timer: 1500, allowOutsideClick: false}); loadData();
        }
    }

    window.showFullDetail = function(rowJson) {
        const item = JSON.parse(decodeURIComponent(rowJson));
        let filesDetail = '-';
        if (item[5]) {
            const urls = item[5].split(", ");
            filesDetail = urls.map((u, i) => `<a href="${u}" target="_blank" style="color:var(--ios-blue); text-decoration:none; font-weight:600; margin-right:15px;"><i class="fa-solid fa-file"></i> ไฟล์ที่ ${i+1}</a>`).join('');
        }

        Swal.fire({
            title: 'รายละเอียดรายการ',
            customClass: { popup: 'swal-modal-custom' },
            width: '700px',
            allowOutsideClick: false,
            allowEscapeKey: false,
            html: `
                <div class="swal-form-container">
                    <div class="swal-field-full"><label class="swal-label">Report ID</label><div class="detail-view-item"><span class="val">${item[11] || '-'}</span></div></div>
                    <div class="swal-field-full"><label class="swal-label">ประเภทงาน</label><div class="detail-view-item"><span class="job-type-badge">${item[8] || 'ทั่วไป'}</span></div></div>
                    <div><label class="swal-label">วันที่ดำเนินการ</label><div class="detail-view-item"><span class="val">${fixDate(item[0])}</span></div></div>
                    <div><label class="swal-label">รหัสสมาชิก</label><div class="detail-view-item"><span class="val">${String(item[1]).replace(/^'/, '')}</span></div></div>
                    <div class="swal-field-full"><label class="swal-label">ชื่อลูกค้า</label><div class="detail-view-item"><span class="val">${item[2]}</span></div></div>
                    <div><label class="swal-label">เบอร์ติดต่อ</label><div class="detail-view-item"><span class="val">${String(item[3]).replace(/^'/, '')}</span></div></div>
                    <div><label class="swal-label">พนักงาน</label><div class="detail-view-item"><span class="val">${item[4]}</span></div></div>
                    <div><label class="swal-label">วันครบกำหนดงาน</label><div class="detail-view-item"><span class="val" style="color:var(--ios-red);">${fixDate(item[10])}</span></div></div>
                    <div class="swal-field-full"><label class="swal-label">รายละเอียดเพิ่มเติม</label><div class="detail-view-item" style="min-height:160px;"><span class="val" style="font-weight:400; white-space:pre-wrap;">${item[6] || '-'}</span></div></div>
                    <div class="swal-field-full" style="text-align:center; margin-top:10px;">${filesDetail}</div>
                </div>
            `,
            showCancelButton: true, confirmButtonText: 'แก้ไขข้อมูล', confirmButtonColor: '#34C759', cancelButtonText: 'ปิด'
        }).then((result) => { if (result.isConfirmed) editData(rowJson); });
    }

    window.editData = function(rowJson) {
        const item = JSON.parse(decodeURIComponent(rowJson));
        let typeOptions = `<option value="">-- เลือกประเภทงาน --</option>`;
        jobTypes.forEach(t => { typeOptions += `<option value="${t}" ${item[8] === t ? 'selected' : ''}>${t}</option>`; });
        Swal.fire({
            title: 'แก้ไขข้อมูล: ' + (item[11] || ''),
            customClass: { popup: 'swal-modal-custom' },
            width: '700px',
            allowOutsideClick: false,
            allowEscapeKey: false,
            html: `
                <div class="swal-form-container">
                    <div class="swal-field-full"><label class="swal-label">ประเภทงาน</label><select id="swal-jobType" class="swal-input-styled">${typeOptions}</select></div>
                    <div><label class="swal-label">วันที่</label><input type="date" id="swal-date" class="swal-input-styled" value="${formatForInputDate(item[0])}"></div>
                    <div><label class="swal-label">รหัสสมาชิก</label><input type="text" id="swal-memberId" class="swal-input-styled" value="${String(item[1]).replace(/^'/, '')}"></div>
                    <div class="swal-field-full"><label class="swal-label">ชื่อลูกค้า</label><input type="text" id="swal-name" class="swal-input-styled" value="${item[2]}"></div>
                    <div><label class="swal-label">เบอร์ติดต่อ</label><input type="text" id="swal-phone" class="swal-input-styled" value="${String(item[3]).replace(/^'/, '')}"></div>
                    <div><label class="swal-label">พนักงาน</label><select id="swal-staff" class="swal-input-styled">${['ศุภกฤต', 'นวพล', 'ปิยะพร', 'กรทักษ์'].map(s => `<option value="${s}" ${item[4] === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
                    <div class="swal-field-full"><label class="swal-label">วันครบกำหนดงาน</label><input type="date" id="swal-deadline" class="swal-input-styled" value="${formatForInputDate(item[10])}"></div>
                    <div class="swal-field-full"><label class="swal-label">รายละเอียด</label><textarea id="swal-jobDetail" class="swal-input-styled" style="height:160px;">${item[6] || ''}</textarea></div>
                </div>
            `,
            showCancelButton: true, confirmButtonText: 'บันทึกการแก้ไข', confirmButtonColor: '#007aff',
            preConfirm: () => ({ action: "update", reportId: item[11], date: document.getElementById('swal-date').value, memberId: "'" + document.getElementById('swal-memberId').value, name: document.getElementById('swal-name').value, phone: "'" + document.getElementById('swal-phone').value, staff: document.getElementById('swal-staff').value, jobDetail: document.getElementById('swal-jobDetail').value, jobType: document.getElementById('swal-jobType').value, deadline: document.getElementById('swal-deadline').value })
        }).then(async (result) => {
            if (result.isConfirmed) {
                Swal.fire({title: 'กำลังอัพเดท...', allowOutsideClick: false, allowEscapeKey: false, didOpen: () => Swal.showLoading()});
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(result.value) });
                Swal.fire({title: 'สำเร็จ', icon: 'success', timer: 1500, allowOutsideClick: false}); loadData();
            }
        });
    }

    // Function to handle file selection and update display
    window.handleFileSelect = async function(event) {
        const files = event.target.files;
        const fileListDiv = document.getElementById('selectedFileList');
        
        for (let i = 0; i < files.length; i++) {
            if (selectedFiles.length >= 3) {
                Swal.showValidationMessage('แนบไฟล์ได้สูงสุด 3 ไฟล์เท่านั้น');
                break;
            }
            
            const file = files[i];
            const reader = new FileReader();
            
            const filePromise = new Promise(resolve => {
                reader.onload = () => resolve({
                    name: file.name,
                    data: reader.result,
                    id: Date.now() + Math.random() // Unique ID for removal
                });
                reader.readAsDataURL(file);
            });
            
            const fileObj = await filePromise;
            selectedFiles.push(fileObj);
        }
        
        // Clear input so same file can be selected again if removed
        event.target.value = "";
        renderSelectedFiles();
    };

    window.removeFile = function(id) {
        selectedFiles = selectedFiles.filter(f => f.id !== id);
        renderSelectedFiles();
    };

    function renderSelectedFiles() {
        const fileListDiv = document.getElementById('selectedFileList');
        if (!fileListDiv) return;
        
        fileListDiv.innerHTML = selectedFiles.map(file => `
            <div class="file-item">
                <span><i class="fa-solid fa-file"></i> ${file.name}</span>
                <span class="remove-file" onclick="removeFile(${file.id})"><i class="fa-solid fa-circle-xmark"></i></span>
            </div>
        `).join('');
    }

    window.openAddJobModal = function() {
        selectedFiles = []; // Reset files
        let typeOptions = `<option value="">-- เลือกประเภทงาน --</option>`;
        jobTypes.forEach(t => { typeOptions += `<option value="${t}">${t}</option>`; });
        const newId = generateReportId();
        
        Swal.fire({
            title: 'บันทึกงานใหม่ (ID: ' + newId + ')',
            customClass: { popup: 'swal-modal-custom' },
            width: '700px',
            allowOutsideClick: false,
            allowEscapeKey: false,
            html: `
                <div class="swal-form-container">
                    <div class="swal-field-full"><label class="swal-label">ประเภทงาน</label><select id="jobType" class="swal-input-styled">${typeOptions}</select></div>
                    <div><label class="swal-label">วันที่ดำเนินการ</label><input type="date" id="date" class="swal-input-styled" value="${new Date().toISOString().split('T')[0]}"></div>
                    <div><label class="swal-label">หมายเลขสมาชิก</label><input type="text" id="memberId" class="swal-input-styled" placeholder="TMH/TOL/TVS"></div>
                    <div class="swal-field-full"><label class="swal-label">ชื่อลูกค้า</label><input type="text" id="name" class="swal-input-styled"></div>
                    <div><label class="swal-label">เบอร์ติดต่อ</label><input type="text" id="phone" class="swal-input-styled" placeholder="0XXXXXXXXX"></div>
                    <div><label class="swal-label">พนักงาน</label><select id="staff" class="swal-input-styled"><option value="">-- เลือก --</option><option value="ศุภกฤต">ศุภกฤต</option><option value="นวพล">นวพล</option><option value="ปิยะพร">ปิยะพร</option><option value="กรทักษ์">กรทักษ์</option></select></div>
                    <div class="swal-field-full"><label class="swal-label">วันครบกำหนดงาน</label><input type="date" id="deadline" class="swal-input-styled"></div>
                    <div class="swal-field-full"><label class="swal-label">รายละเอียด</label><textarea id="jobDetail" class="swal-input-styled" style="height:160px;"></textarea></div>
                    <div class="swal-field-full">
                        <label class="swal-label">แนบไฟล์ (สูงสุด 3 ไฟล์: รูปภาพ, PDF, Word, Excel)</label>
                        <input type="file" id="file" class="swal-input-styled" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx" onchange="handleFileSelect(event)">
                        <div id="selectedFileList" class="file-list"></div>
                    </div>
                </div>
            `,
            showCancelButton: true, confirmButtonText: 'บันทึกข้อมูล', preConfirm: async () => {
                const vals = { reportId: newId, jobType: document.getElementById('jobType').value, date: document.getElementById('date').value, memberId: "'" + document.getElementById('memberId').value, name: document.getElementById('name').value, phone: "'" + document.getElementById('phone').value, staff: document.getElementById('staff').value, jobDetail: document.getElementById('jobDetail').value, deadline: document.getElementById('deadline').value };
                
                if (!vals.jobType || !vals.name || !vals.staff) { Swal.showValidationMessage('กรุณากรอกข้อมูลสำคัญ'); return false; }
                if (selectedFiles.length > 3) { Swal.showValidationMessage('แนบไฟล์ได้สูงสุด 3 ไฟล์เท่านั้น'); return false; }
                
                return { action: "insert", ...vals, files: selectedFiles.map(f => ({name: f.name, data: f.data})) };
            }
        }).then(async (result) => {
            if (result.isConfirmed) {
                Swal.fire({title: 'กำลังบันทึก...', allowOutsideClick: false, allowEscapeKey: false, didOpen: () => Swal.showLoading()});
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(result.value) });
                Swal.fire({title: 'สำเร็จ', icon: 'success', timer: 1500, allowOutsideClick: false}); loadData();
            }
        });
    }

    window.onload = () => { loadButtonPosition(); loadData(); };
</script>
