<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ChatRoom - Parakit-Site</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.js"></script>
  
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #311042 100%);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }
    .chat-area {
      background: rgba(15, 23, 42, 0.4);
      background-size: cover;
      background-position: center;
      transition: all 0.4s ease;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .msg-bubble {
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      transition: all 0.2s ease;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .swal-premium-title { font-family: 'Prompt', sans-serif !important; font-weight: 700 !important; color: #1e293b !important; }
    .swal-premium-html { font-family: 'Prompt', sans-serif !important; }
    .swal-input-box {
      width: 100%; max-width: 340px; padding: 12px 16px; margin: 8px auto; display: block;
      border: 1px solid #cbd5e1; border-radius: 14px; font-size: 14px; font-family: 'Prompt', sans-serif;
      background-color: #f8fafc; transition: all 0.2s ease;
    }
    .swal-input-box:focus { outline: none; border-color: #10b981; background-color: #fff; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15); }
    .swal2-popup { border-radius: 24px !important; padding: 2rem !important; }
    .swal-settings-card {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    #viewer-hidden-container { display: none; }
    .viewer-title { display: none !important; }
    
    /* Context Menu กึ่งกลางหน้าจอ */
    .custom-cm {
      position: fixed;
      z-index: 1000;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) scale(1) !important;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 24px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.45);
      padding: 12px;
      min-width: 240px;
      animation: cmScale 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes cmScale {
      from { transform: translate(-50%, -50%) scale(0.85); opacity: 0; }
      to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
    
    .audio-player-container {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 240px;
      max-width: 300px;
    }
    #msg-input { resize: none; max-height: 120px; }
    
    /* Drag & Drop Overlay Zone */
    #drop-zone-overlay {
      display: none;
      background: rgba(16, 185, 129, 0.15);
      backdrop-filter: blur(8px);
      border: 3px dashed #10b981;
    }
    
    /* Checkbox สำหรับโหมดเลือกหลายรายการ */
    .msg-checkbox {
      display: none;
    }
    .multi-select-mode .msg-checkbox {
      display: block;
    }
  </style>
</head>
<body class="h-[100dvh] w-screen flex items-center justify-center p-0 sm:p-4 md:p-6 overflow-hidden select-none">

  <div id="login-screen" class="glass-card w-full max-w-md rounded-3xl p-6 sm:p-8 text-center mx-4 transition-all duration-300 block z-50">
    <div class="w-16 h-16 sm:w-20 sm:h-20 bg-gradient-to-tr from-emerald-400 to-green-600 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl sm:text-4xl shadow-lg mb-4">
      <i class="fa-solid fa-comments"></i>
    </div>
    <h2 class="text-xl sm:text-2xl font-bold text-slate-800 mb-1">Parakit Connect</h2>
    <p class="text-xs text-slate-400 mb-6">กรอกข้อมูลผู้ใช้งานของคุณเพื่อเข้าสู่ห้องแชทรวม</p>
    
    <div class="space-y-4 text-left">
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5 ml-1">Username</label>
        <div class="relative">
          <input type="text" id="login-username" placeholder="กรอก Username" class="w-full p-3.5 pl-11 rounded-2xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 transition-all">
          <i class="fa-solid fa-user absolute left-4 top-4 text-slate-400 text-sm"></i>
        </div>
      </div>
      
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5 ml-1">Password</label>
        <div class="relative">
          <input type="password" id="login-password" placeholder="กรอกรหัสผ่านของคุณ" class="w-full p-3.5 pl-11 rounded-2xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 transition-all">
          <i class="fa-solid fa-lock absolute left-4 top-4 text-slate-400 text-sm"></i>
        </div>
      </div>
      
      <button id="btn-login" class="w-full py-3.5 sm:py-4 mt-2 bg-gradient-to-r from-green-500 to-emerald-600 text-white font-semibold rounded-2xl shadow-lg shadow-green-500/20 transition-all duration-200 hover:opacity-95">
        <i class="fa-solid fa-arrow-right-to-bracket mr-2"></i> เข้าสู่ระบบแชท
      </button>

      <div class="relative flex py-1 items-center">
        <div class="flex-grow border-t border-slate-200/60"></div>
        <span class="flex-shrink mx-4 text-xs text-slate-400 font-medium">หรือ</span>
        <div class="flex-grow border-t border-slate-200/60"></div>
      </div>

      <button id="btn-open-register" class="w-full py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-2xl transition-all duration-200 text-sm">
        <i class="fa-solid fa-user-plus mr-2"></i> สร้างบัญชีผู้ใช้ใหม่
      </button>
      
      <div class="flex justify-center items-center text-xs pt-1">
        <button id="btn-forgot-pwd" class="text-slate-400 hover:text-green-600 transition-colors"><i class="fa-solid fa-circle-question mr-1"></i>ลืมรหัสผ่าน?</button>
      </div>
    </div>
  </div>

  <div id="chat-interface" class="w-full h-full md:max-w-5xl md:h-[85vh] glass-panel md:rounded-3xl shadow-2xl flex flex-col border-none overflow-hidden transition-all duration-300 relative" style="display: none;">
    
    <div id="drop-zone-overlay" class="absolute inset-0 z-50 flex flex-col items-center justify-center text-green-600 gap-2 font-bold pointer-events-none">
      <i class="fa-solid fa-cloud-arrow-up text-6xl animate-bounce"></i>
      <span class="text-lg">วางไฟล์ลงตรงนี้เพื่อเตรียมส่ง (สูงสุด 5 ไฟล์)</span>
    </div>

    <div class="p-3 bg-slate-900/95 text-white flex items-center justify-between border-b border-white/10 z-10 shadow-lg shrink-0">
      <div class="flex items-center gap-2 sm:gap-3 overflow-hidden mr-2">
        <div class="relative group cursor-pointer shrink-0" id="avatar-container" title="คลิกเพื่อเปลี่ยนรูปโปรไฟล์ผ่านกูเกิลไดรฟ์">
          <img id="my-avatar-img" class="w-10 h-10 sm:w-12 sm:h-12 rounded-full border-2 border-green-400 object-cover shadow-md hover:scale-105 transition-all" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
          <div class="absolute inset-0 bg-black/40 rounded-full opacity-0 group-hover:opacity-100 flex items-center justify-center transition-all">
            <i class="fa-solid fa-camera text-[10px] text-white"></i>
          </div>
          <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-slate-900 rounded-full"></span>
        </div>
        <div class="overflow-hidden">
          <h3 id="my-display-name" class="font-bold text-sm sm:text-base tracking-wide text-white truncate">Name</h3>
          <p class="text-[10px] sm:text-[11px] text-green-400 flex items-center gap-1"><span class="w-1.5 h-1.5 bg-green-500 rounded-full inline-block animate-ping"></span> ออนไลน์</p>
        </div>
      </div>
      
      <div class="shrink-0 flex items-center gap-2">
        <button id="btn-toggle-multi-select" title="เลือกจัดการหลายข้อความ" class="px-3 py-2 rounded-xl bg-blue-500/20 hover:bg-blue-500/40 text-blue-300 flex items-center gap-1.5 transition-all text-xs font-semibold border border-blue-500/30 shadow-md">
          <i class="fa-solid fa-list-check"></i>
          <span id="txt-multi-select">เลือกจัดการ</span>
        </button>
        <button id="btn-open-settings" title="การตั้งค่าระบบแชท" class="px-3.5 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-white flex items-center justify-center gap-1.5 transition-all text-xs font-semibold border border-white/10 shadow-md">
          <i class="fa-solid fa-gear text-sm"></i>
          <span>ตั้งค่า</span>
        </button>
      </div>
    </div>
    
    <div class="chat-area flex-1 p-3 sm:p-4 md:p-6 overflow-y-auto no-scrollbar space-y-4 font-normal flex flex-col" id="chat-body"></div>
    
    <div id="multi-select-bar" class="hidden p-3 bg-slate-900 text-white flex items-center justify-between border-t border-white/10 transition-all">
      <span id="multi-select-count" class="text-xs font-semibold text-slate-300">เลือกไว้ 0 รายการ</span>
      <div class="flex gap-2">
        <button id="btn-delete-selected" class="px-3 py-1.5 bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold rounded-lg flex items-center gap-1 transition-colors">
          <i class="fa-solid fa-trash-can"></i> ลบรายการที่เลือก
        </button>
        <button id="btn-share-selected" class="px-3 py-1.5 bg-green-500 text-white text-xs font-bold rounded-lg flex items-center gap-1 hover:bg-green-600 transition-colors">
          <i class="fa-solid fa-share-nodes"></i> แชร์ไปยังแอปอื่น
        </button>
        <button id="btn-cancel-selected" class="px-3 py-1.5 bg-slate-700 text-slate-300 text-xs font-bold rounded-lg hover:bg-slate-600 transition-colors">
          ยกเลิก
        </button>
      </div>
    </div>

    <div class="p-3 bg-white border-t border-slate-200/80 flex flex-col gap-2 shadow-inner shrink-0 relative pb-safe">
      <div class="flex items-center justify-between px-1">
        <div class="flex items-center gap-4 text-slate-500 w-full justify-between">
          <div class="flex items-center gap-4">
            <label class="cursor-pointer hover:text-green-500 transition-colors flex items-center gap-1.5 text-sm font-medium" title="แนบไฟล์หรือรูปภาพ (สูงสุด 5 ไฟล์)">
              <i class="fa-solid fa-circle-plus text-lg sm:text-xl text-green-500"></i>
              <span class="text-xs text-slate-400 hidden sm:inline">ส่งไฟล์ (สูงสุด 5 ไฟล์พร้อมกัน)</span>
              <input type="file" id="file-input" class="hidden" multiple onchange="handleFileSelection(event)">
            </label>
            <button id="tool-emoji" class="hover:text-amber-500 transition-colors text-lg sm:text-xl" title="ส่งคีย์บอร์ดอิโมจิ"><i class="fa-regular fa-face-smile-wink"></i></button>
            <button id="tool-sticker" class="hover:text-blue-500 transition-colors text-lg sm:text-xl" title="ส่งสติ๊กเกอร์ด่วน"><i class="fa-regular fa-images"></i></button>
          </div>
          <div class="flex items-center gap-2">
            <span id="audio-timer" class="text-xs font-bold text-red-500 hidden animate-pulse">0:00</span>
            <button id="btn-audio-record" class="w-9 h-9 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center transition-all hover:bg-red-50 hover:text-red-500 shadow-sm" title="กดเพื่ออัดเสียงสูงสุด 1 นาที">
              <i class="fa-solid fa-microphone text-sm"></i>
            </button>
          </div>
        </div>
      </div>
      
      <div class="flex items-center gap-2 items-end">
        <textarea id="msg-input" rows="1" placeholder="พิมพ์ข้อความของคุณที่นี่..." class="flex-1 p-2.5 sm:p-3.5 px-4 sm:px-5 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-green-500 font-medium text-slate-800 placeholder-slate-400 shadow-sm transition-all no-scrollbar"></textarea>
        <button id="btn-send" class="w-10 h-10 sm:w-12 sm:h-12 bg-gradient-to-r from-green-500 to-emerald-500 hover:from-green-600 hover:to-emerald-600 text-white rounded-2xl flex items-center justify-center shadow-lg shadow-green-500/20 transform active:scale-95 transition-all shrink-0 mb-0.5">
          <i class="fa-solid fa-paper-plane text-xs sm:text-sm"></i>
        </button>
      </div>
      
      <div class="emoji-picker glass-card shadow-2xl grid grid-cols-6 gap-2 sm:gap-3 p-3 sm:p-4 hidden absolute bottom-24 left-2 right-2 sm:left-4 sm:right-auto sm:min-w-[300px] sm:max-w-[340px] max-h-[180px] rounded-2xl overflow-y-auto z-50 text-xl sm:text-2xl select-none cursor-pointer" id="emoji-picker"></div>
      <div class="sticker-picker glass-card shadow-2xl grid grid-cols-3 gap-2 sm:gap-3 p-3 sm:p-4 hidden absolute bottom-24 left-2 right-2 sm:left-14 sm:right-auto sm:min-w-[300px] sm:max-w-[340px] max-h-[180px] rounded-2xl overflow-y-auto z-50 select-none" id="sticker-picker"></div>
    </div>
    
    <input type="file" id="avatar-input" class="hidden" accept="image/*" onchange="uploadUserAvatarToDrive(event)">
    <input type="file" id="bg-input" class="hidden" accept="image/*" onchange="uploadUserBgToDrive(event)">
  </div>

  <div id="upload-preview-modal" class="glass-card fixed inset-0 m-auto w-[90%] max-w-md h-fit p-5 rounded-3xl hidden z-[100] flex flex-col gap-4 border border-white/60 shadow-2xl">
    <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2 border-b pb-2"><i class="fa-solid fa-file-shield text-green-500 text-base"></i> ตรวจสอบไฟล์ก่อนส่ง (สูงสุด 5 ไฟล์)</h3>
    <div id="preview-list-container" class="flex flex-col gap-3 max-h-[220px] overflow-y-auto no-scrollbar"></div>
    <div class="flex gap-2 justify-end mt-1">
      <button id="btn-close-preview" class="px-4 py-2 bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl hover:bg-slate-300 transition-colors">ยกเลิก</button>
      <button id="btn-submit-upload-all" class="px-4 py-2 bg-gradient-to-r from-green-500 to-emerald-600 text-white text-xs font-semibold rounded-xl shadow-md hover:opacity-95 transition-all">ส่งไฟล์ทั้งหมด</button>
    </div>
  </div>

  <div id="viewer-hidden-container">
    <img id="viewer-target-image" src="" alt="Chat Content Image">
  </div>

  <audio id="global-noti-sound" src="https://assets.mixkit.co/active_storage/sfx/2357/2357-84.wav" preload="auto"></audio>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, update, remove, onDisconnect, set } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBrgdTPcYPn5UO64vsi9KkUVexnIIXV6F4",
      authDomain: "chat-f4677.firebaseapp.com",
      databaseURL: "https://chat-f4677-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "chat-f4677",
      storageBucket: "chat-f4677.firebasestorage.app",
      messagingSenderId: "803920396350",
      appId: "1:803920396350:web:25b6bc0c8d4e51c4d9116f",
      measurementId: "G-1JMSPXQFFL"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxlQsvQXSQddnWzyW2Hs1DPL3ntMpsKQHGd_9h3HUBpp5Sq8oOP8kCjhoI0TtRte1vh/exec";
    let currentUser = null;
    let activeTempUploads = {}; 
    let globalAvatarMap = {}; 
    let currentActiveUsers = {}; 
    let globalViewerInstance = null;
    
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let recordInterval = null;
    let recordDuration = 0;

    let queueFilesToUpload = []; 
    let selectedMessageItems = {}; 

    const emojis = ["😀","😂","🥰","😎","🤩","😏","👍","👌","🙏","🎉","🔥","❤️","😭","😱","😡","🤫","💩","✨","👀","💯","🎂","🚀","👏","🥳","🥺","💔","💖","🌟","🍀","🍺","☕️","🍙","🎮","🐱","🐶","🦊","👑","💸","ชิว","เซ็ง","สู้ๆ","งอน"];
    const stickers = [
      "https://cdn-icons-png.flaticon.com/512/4735/4735419.png","https://cdn-icons-png.flaticon.com/512/4735/4735431.png","https://cdn-icons-png.flaticon.com/512/4735/4735465.png","https://cdn-icons-png.flaticon.com/512/4735/4735515.png","https://fonts.gstatic.com/s/e/notoemoji/latest/1f431/512.webp","https://fonts.gstatic.com/s/e/notoemoji/latest/1f436/512.webp","https://fonts.gstatic.com/s/e/notoemoji/latest/1f98a/512.webp","https://fonts.gstatic.com/s/e/notoemoji/latest/1f42a/512.webp","https://cdn-icons-png.flaticon.com/512/616/616408.png","https://cdn-icons-png.flaticon.com/512/616/616430.png","https://cdn-icons-png.flaticon.com/512/924/924514.png","https://cdn-icons-png.flaticon.com/512/1998/1998614.png"
    ];

    window.addEventListener('DOMContentLoaded', () => {
      initUIEvents();
      initPickers();
      checkSavedLogin();
      initGlobalViewer();
      initContextMenuDismissal();
      initAudioRecorder();
      initDragAndDropEvents();
      initMultiSelectEvents();
    });

    function unlockAudioContext() {
      const audio = document.getElementById('global-noti-sound');
      audio.play().then(() => {
        audio.pause();
        audio.currentTime = 0;
      }).catch(e => console.log("Audio unlock retry:", e));
    }

    function initGlobalViewer() {
      const imgTarget = document.getElementById('viewer-target-image');
      globalViewerInstance = new Viewer(imgTarget, {
        inline: false, button: true, navbar: false, title: false,
        toolbar: { zoomIn: 4, zoomOut: 4, oneToOne: 4, reset: 4, rotateLeft: 4, rotateRight: 4, flipHorizontal: 4, flipVertical: 4 },
        tooltip: true, movable: true, zoomable: true, rotatable: true, scalable: true, transition: true, fullscreen: true, keyboard: true
      });
    }

    window.openImageInZoomViewer = function(url) {
      const imgTarget = document.getElementById('viewer-target-image');
      imgTarget.src = url;
      globalViewerInstance.update();
      globalViewerInstance.show();
    };

    function initContextMenuDismissal() {
      document.addEventListener('click', (e) => {
        const existCm = document.getElementById('custom-context-menu');
        if(existCm && !existCm.contains(e.target)) existCm.remove();
      });
    }

    async function syncAvatarsFromServer() {
      try {
        let res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'getAllAvatars' }) });
        let result = await res.json();
        if (result.status === 'success') {
          globalAvatarMap = result.avatars;
          if (currentUser && globalAvatarMap[currentUser.displayName]) {
            currentUser.avatar = globalAvatarMap[currentUser.displayName];
            document.getElementById('my-avatar-img').src = currentUser.avatar;
            localStorage.setItem('parakit_chat_user', JSON.stringify(currentUser));
          }
        }
      } catch (e) { console.error("ไม่สามารถซิงค์ข้อมูลรูปโปรไฟล์ได้ครับ", e); }
    }

    function setupUserPresence() {
      if (!currentUser) return;
      const myPresenceRef = ref(db, `status/${currentUser.username}`);
      set(myPresenceRef, { displayName: currentUser.displayName, lastActive: Date.now() });
      onDisconnect(myPresenceRef).remove();

      onValue(ref(db, 'status'), (snapshot) => {
        currentActiveUsers = snapshot.val() || {};
        syncAvatarsFromServer().then(() => renderAllMessagesWithTemps());
      });
    }

    async function checkSavedLogin() {
      const savedUser = localStorage.getItem('parakit_chat_user');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        document.getElementById('login-screen').style.display = 'none';
        const chatUI = document.getElementById('chat-interface');

      const previewListContainer = document.getElementById('preview-list-container');
      previewListContainer.innerHTML = '';

      queueFilesToUpload.forEach((file, index) => {
        const row = document.createElement('div');
        row.className = 'flex items-center gap-3 p-2.5 bg-slate-50 border rounded-xl';
        
        let previewHTML = `<i class="fa-solid fa-file-zipper text-2xl text-amber-500"></i>`;
        if (file.type.startsWith('image/')) {
          const objectURL = URL.createObjectURL(file);
          previewHTML = `<img src="${objectURL}" class="w-11 h-11 rounded-lg object-cover border shadow-sm">`;
        } else if (file.type.startsWith('video/')) {
          previewHTML = `<i class="fa-solid fa-film text-2xl text-blue-500"></i>`;
        } else if (file.type.startsWith('audio/')) {
          previewHTML = `<i class="fa-solid fa-file-audio text-2xl text-emerald-500"></i>`;
        }

        row.innerHTML = `
          ${previewHTML}

            <p class="text-[10px] text-slate-400">${(file.size / 1024).toFixed(1)} KB</p>

    async function uploadSingleFileProcess(file) {
      const localTimestamp = Date.now();
      const uploadId = "upload_" + localTimestamp;
      const localObjectURL = URL.createObjectURL(file);
      
      const isImage = file.type.startsWith('image/');
      const isVideo = file.type.startsWith('video/');
      const isAudio = file.type.startsWith('audio/');
      
      let clientType = 'optimistic-file';
      if(isImage) clientType = 'optimistic-image';
      if(isVideo) clientType = 'optimistic-video';

      activeTempUploads[uploadId] = {
        senderName: currentUser.displayName,
        senderAvatar: currentUser.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png',
        type: clientType, content: localObjectURL, filename: file.name, timestamp: localTimestamp
      };
      renderAllMessagesWithTemps();

      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = async () => {
          try {
            let res = await fetch(SCRIPT_URL, { 
              method: 'POST', 
              body: JSON.stringify({ action: 'uploadFile', filename: file.name, base64: reader.result }) 
            });
            let result = await res.json();
            
            if(result.status === 'success') {
              let finalUrl = result.viewUrl || result.url;
              let fileDriveId = result.fileId || '';
              let dbMsgType = 'file';
              
              if(isImage) dbMsgType = 'image';
              if(isVideo) dbMsgType = 'video';
              if(isAudio) dbMsgType = 'audio';

              push(ref(db, 'global_messages'), {
                senderName: currentUser.displayName,
                senderAvatar: currentUser.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png',
                type: dbMsgType, content: finalUrl, filename: file.name, fileId: fileDriveId, timestamp: Date.now(), deleted: false
              });
            } else {
              Swal.fire('อัปโหลดล้มเหลว', result.message || 'เกิดข้อผิดพลาดจากเซิร์ฟเวอร์ครับ', 'error');
            }
          } catch(err) {
            console.error(err);
          }
          delete activeTempUploads[uploadId];
          renderAllMessagesWithTemps();
          resolve();
        };
        reader.readAsDataURL(file);
      });
    }

    // ฟังก์ชันดาวน์โหลดไฟล์แปรสภาพแชร์ตรงเข้าแอปพลิเคชันอื่นในพื้นหลังอย่างปลอดภัยปราศจาก Bug
    async function handleShareSelectedItems() {
      const items = Object.values(selectedMessageItems);
      if(items.length === 0) {
        Swal.fire('คำแนะนำ', 'โปรดเลือกข้อความหรือไฟล์ที่ต้องการแชร์อย่างน้อย 1 รายการครับ', 'info');
        return;
      }

      // 1. ขึ้นเตือนสำเร็จตามที่ระบุ แจ้งผู้ใช้ว่าแชร์ไปแอปเรียบร้อยแล้วทันที
      Swal.fire({
        title: 'แชร์ไปยังแอปเรียบร้อยแล้วครับ',
        text: 'ระบบกำลังดาวน์โหลดและดึงข้อมูลไฟล์สตรีมมิ่งในพื้นหลังให้อัตโนมัติครับ',
        icon: 'success',
        timer: 2000,
        showConfirmButton: false
      });

      // 2. ปิดเมนูจัดการหลายรายการทันทีเพื่อความรวดเร็วในการใช้งานหน้าจอ
      document.getElementById('btn-toggle-multi-select').click();

      // 3. เริ่มสตรีมประมวลผลไฟล์รวมในพื้นหลังเงียบๆ 
      setTimeout(async () => {
        let filesToShare = [];
        let plainTexts = [];

        try {
          for (let msg of items) {
            if (!msg.deleted && msg.fileId && ['image', 'video', 'audio', 'file'].includes(msg.type)) {
              try {
                let res = await fetch(SCRIPT_URL, {
                  method: 'POST',
                  body: JSON.stringify({ action: 'getFileData', fileId: msg.fileId })
                });
                let result = await res.json();
                if (result.status === 'success' && result.base64) {
                  // แปลง Base64 ดิบเป็น Array และ Blob โดยตรง ไม่ผ่าน fetch(dataURL) เพื่อป้องกันเบราว์เซอร์มือถือ Crash 
                  const byteCharacters = atob(result.base64);
                  const byteNumbers = new Array(byteCharacters.length);
                  for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                  }
                  const byteArray = new Uint8Array(byteNumbers);
                  const blob = new Blob([byteArray], { type: result.mimeType || 'application/octet-stream' });
                  const fileObj = new File([blob], msg.filename || `file_${Date.now()}`, { type: blob.type });
                  filesToShare.push(fileObj);
                }
              } catch (err) {
                console.error('Error handling background download:', err);
                plainTexts.push(`[ไฟล์แนบ: ${msg.filename || 'ดาวน์โหลดล้มเหลว'}] \nลิงก์ไฟล์: ${msg.content}`);
              }
            } else if (!msg.deleted && msg.type === 'text') {
              plainTexts.push(`[${msg.senderName}]: ${msg.content}`);
            } else if (!msg.deleted && msg.type === 'sticker') {
              plainTexts.push(`[สติ๊กเกอร์จาก ${msg.senderName}]: ${msg.content}`);
            }
          }

          if (navigator.share) {
            if (filesToShare.length > 0 && navigator.canShare && navigator.canShare({ files: filesToShare })) {
              await navigator.share({
                files: filesToShare,
                title: 'แชร์ไฟล์และมีเดียจาก Parakit Chat',
                text: plainTexts.join('\n\n')
              });
            } else if (plainTexts.length > 0) {
              await navigator.share({
                text: plainTexts.join('\n\n'),
                title: 'แชร์ข้อความจาก Parakit Chat'
              });
            }
          } else {
            let compiledText = plainTexts.join("\n\n---\n\n");
            if (items.some(m => m.fileId)) {
              compiledText += "\n\n(ลิงก์ไฟล์เสริมสำหรับการคัดลอก: " + items.filter(m => m.fileId).map(m => m.content).join(", ") + ")";
            }
            navigator.clipboard.writeText(compiledText);
          }
        } catch (globalErr) {
          console.error("Background share task encountered an error gracefully captured:", globalErr);
        }
      }, 300);
    }

    function initAudioRecorder() {
      const recordBtn = document.getElementById('btn-audio-record');
      const timerSpan = document.getElementById('audio-timer');
      
      recordBtn.addEventListener('click', async () => {
        if (!isRecording) {
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            try {
              const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
              mediaRecorder = new MediaRecorder(stream);
              audioChunks = [];
              
              mediaRecorder.ondataavailable = (e) => { audioChunks.push(e.data); };
              
              mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                if (audioBlob.size > 100) {
                  await uploadAudioAndSend(audioBlob);
                }
                stream.getTracks().forEach(track => track.stop());
              };
              
              mediaRecorder.start();
              isRecording = true;
              recordBtn.innerHTML = `<i class="fa-solid fa-square text-red-500 animate-pulse"></i>`;
              timerSpan.classList.remove('hidden');
              recordDuration = 0;
              timerSpan.innerText = "0:00";
              
              recordInterval = setInterval(() => {
                recordDuration++;
                let secs = recordDuration % 60;
                let mins = Math.floor(recordDuration / 60);
                timerSpan.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                if (recordDuration >= 60) { stopAudioRecording(); }
              }, 1000);
              
            } catch (err) {
              Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเข้าถึงไมโครโฟนของคุณได้ครับ', 'error');
            }
          }
        } else {
          stopAudioRecording();
        }
      });
    }

    function stopAudioRecording() {
      if (recordInterval) clearInterval(recordInterval);
      if (mediaRecorder && isRecording) { mediaRecorder.stop(); }
      isRecording = false;
      document.getElementById('btn-audio-record').innerHTML = `<i class="fa-solid fa-microphone text-sm"></i>`;
      document.getElementById('audio-timer').classList.add('hidden');
    }

    function linkify(text) {

      const urlRegex = /(https?:\/\/[^\s]+)/g;
      let html = text.replace(urlRegex, function(url) {
        return `<a href="${url}" target="_blank" class="text-blue-600 font-medium underline break-all hover:text-blue-800">${url}</a>`;
      });

    // ฟังก์ชันนับเวลานับถอยหลัง (Countdown) ตอนกดเปิดฟังไฟล์เสียงให้สัมพันธ์กับเวลาบันทึกจริง
    window.initAudioTracker = function(audioElement, durationId) {
      const formatTime = (timeInSeconds) => {
        const mins = Math.floor(timeInSeconds / 60);
        const secs = Math.floor(timeInSeconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      };

      audioElement.addEventListener('loadedmetadata', () => {
        audioElement.totalVoiceDuration = audioElement.duration || 0;
        document.getElementById(durationId).innerText = formatTime(audioElement.totalVoiceDuration);
      });

      audioElement.addEventListener('timeupdate', () => {
        const duration = audioElement.totalVoiceDuration || audioElement.duration || 0;
        const remain = Math.max(0, duration - audioElement.currentTime);
        document.getElementById(durationId).innerText = formatTime(remain);
      });

      audioElement.addEventListener('ended', () => {
        const duration = audioElement.totalVoiceDuration || audioElement.duration || 0;
        document.getElementById(durationId).innerText = formatTime(duration);
      });
    };

    window.loadMediaInline = async function(fileId, elementId, type, loadingId) {
      if (!fileId) return;
      try {
        let res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'getFileData', fileId: fileId })
        });
        let result = await res.json();
        if (result.status === 'success' && result.base64) {
          const el = document.getElementById(elementId);
          if (el) {
            el.src = "data:" + result.mimeType + ";base64," + result.base64;
            if (type === 'audio') {
              const durationId = `dur_${elementId.replace('audio_el_', '')}`;
              window.initAudioTracker(el, durationId);
            } else if (type === 'video' && loadingId) {
              const loader = document.getElementById(loadingId);
              if (loader) loader.remove();
            }
          }
        } else {
          const el = document.getElementById(elementId);
          if (el) {
            el.src = `https://drive.google.com/uc?export=download&id=${fileId}`;
            if (type === 'audio') {
              const durationId = `dur_${elementId.replace('audio_el_', '')}`;
              window.initAudioTracker(el, durationId);
            } else if (type === 'video' && loadingId) {
              const loader = document.getElementById(loadingId);
              if (loader) loader.remove();
            }
          }
        }
      } catch (e) {
        console.error("โหลดข้อมูลมีเดียอินไลน์ขัดข้องครับ:", e);
      }
    };

    function validatePassword(pwd) {
      if (pwd.length < 8) return false;
      if (/^\d+$/.test(pwd)) return false; 
      return true;
    }

    async function handleLogin() {
      const userVal = document.getElementById('login-username').value.trim();
      const passVal = document.getElementById('login-password').value;
      if(!userVal || !passVal) return Swal.fire({ title: 'โปรดกรอกข้อมูล', text: 'กรุณาระบุ Username และ Password ให้ครบถ้วน', icon: 'warning', confirmButtonColor: '#10b981' });

      Swal.showLoading();
      try {
        let res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'login', username: userVal, password: passVal }) });
        let result = await res.json();
        if(result.status === 'success') {
          currentUser = result.user;
          localStorage.setItem('parakit_chat_user', JSON.stringify(currentUser));
          
          document.getElementById('login-screen').style.display = 'none';
          const chatUI = document.getElementById('chat-interface');
          chatUI.style.display = 'flex';
          
          document.getElementById('my-display-name').innerText = currentUser.displayName;

    window.uploadUserAvatarToDrive = function(e) {
      const file = e.target.files[0];
      if(!file) return;

      Swal.fire({ title: 'กำลังอัปเดตรูปโปรไฟล์...', html: 'ระบบกำลังส่งรูปภาพลงในไดร์ฟหลักของคุณ', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      
      const reader = new FileReader();
      reader.onloadend = async () => {
        try {
          let res = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'uploadFile', filename: `avatar_${currentUser.username}_${Date.now()}.png`, base64: reader.result })
          });
          let result = await res.json();
          if(result.status === 'success') {
            let directUrl = result.viewUrl || result.url;
            currentUser.avatar = directUrl;
            document.getElementById('my-avatar-img').src = directUrl;
            localStorage.setItem('parakit_chat_user', JSON.stringify(currentUser));
            
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'updateAvatar', username: currentUser.username, avatarUrl: directUrl }) });
            globalAvatarMap[currentUser.displayName] = directUrl;
            Swal.fire({ title: 'สำเร็จ!', text: 'เปลี่ยนรูปโปรไฟล์ผ่านคลาวด์ไดร์ฟเรียบร้อยครับ', icon: 'success', confirmButtonColor: '#10b981' });
            renderAllMessagesWithTemps();
          } else {
            Swal.fire('ล้มเหลว', 'เกิดข้อผิดพลาดจากเซิร์ฟเวอร์ไดร์ฟ', 'error');

    window.directDownloadFromDrive = async function(fileId, filename) {
      if(!fileId) return Swal.fire({ title: 'ผิดพลาด', text: 'ไม่พบรหัสไฟล์สำหรับดาวน์โหลดครับ', icon: 'error', confirmButtonColor: '#10b981' });
      
      Swal.fire({
        title: 'กำลังเตรียมไฟล์...', html: 'ระบบกำลังดึงข้อมูลไฟล์จากไดร์ฟโดยตรงครับ', allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
      });

      try {
        let res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'getFileData', fileId: fileId })
        });
        let result = await res.json();
        if (result.status === 'success' && result.base64) {
          const byteCharacters = atob(result.base64);
          const byteNumbers = new Array(byteCharacters.length);
          for (let i = 0; i < byteCharacters.length; i++) {
            byteNumbers[i] = byteCharacters.charCodeAt(i);
          }
          const byteArray = new Uint8Array(byteNumbers);
          const blob = new Blob([byteArray], { type: result.mimeType || 'application/octet-stream' });
          const blobUrl = URL.createObjectURL(blob);
          
          const a = document.createElement("a");
          a.href = blobUrl;
          a.download = filename || "downloaded_file";
          document.body.appendChild(a);
          a.click();
          
          document.body.removeChild(a);
          URL.revokeObjectURL(blobUrl);
          Swal.close();
        } else {
          throw new Error('Backend failed');
        }
      } catch (err) {
        window.open(`https://drive.google.com/uc?export=download&id=${fileId}`, '_blank');
        Swal.close();
      }
    };

    function bindMessageActionEvents(element, msgKey, msgFileId, textContent) {
      let touchTimer = null;
      
      const showActionMenu = () => {
        const existCm = document.getElementById('custom-context-menu');
        if(existCm) existCm.remove();
        
        const cm = document.createElement('div');
        cm.id = 'custom-context-menu';
        cm.className = 'custom-cm flex flex-col gap-2 text-center items-center justify-center';
        
        let menuHTML = `<h4 class="text-xs font-bold text-slate-400 mb-1 border-b pb-1 w-full tracking-wide">จัดการข้อความ</h4>`;
        if (textContent !== null && textContent !== undefined) {
          menuHTML += `
            <button id="cm-copy" class="w-full text-center flex items-center justify-center gap-2 px-3 py-2.5 bg-slate-50 hover:bg-slate-100 text-slate-700 rounded-xl text-xs font-semibold transition-all border border-slate-200/60">
              <i class="fa-regular fa-copy text-sm text-blue-500"></i> คัดลอกข้อความ
            </button>
          `;
        }
        
        const isMyMsg = element.closest('.msg-row').classList.contains('self');
        if(isMyMsg) {
          menuHTML += `
            <button id="cm-delete" class="w-full text-center flex items-center justify-center gap-2 px-3 py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl text-xs font-semibold transition-all border border-rose-200/40">
              <i class="fa-solid fa-trash-can text-sm"></i> ยกเลิกการส่งข้อความ
            </button>
          `;
        }

        menuHTML += `
          <button id="cm-close" class="w-full text-center py-2 mt-1 bg-slate-100 text-slate-500 rounded-xl text-xs font-medium hover:bg-slate-200 transition-colors">
            ปิดเมนู
          </button>
        `;
        
        cm.innerHTML = menuHTML;
        
        if(cm.querySelector('#cm-copy')) {
          cm.querySelector('#cm-copy').addEventListener('click', (ev) => {
            ev.stopPropagation();
            navigator.clipboard.writeText(textContent); 
            cm.remove();
            Swal.fire({ title: 'สำเร็จ', text: 'คัดลอกข้อความลงคลิปบอร์ดแล้วครับ', icon: 'success', timer: 1000, showConfirmButton: false });
            forceScrollToBottom(); // เลื่อนลงแชทล่าสุดด้านล่างทันทีหลังกดยืนยันป๊อปอัพ
          });
        }
        
        if(cm.querySelector('#cm-delete')) {
          cm.querySelector('#cm-delete').addEventListener('click', (ev) => {
            ev.stopPropagation();
            cm.remove();
            window.triggerDeleteMessageAction(msgKey, msgFileId);
          });
        }

        cm.querySelector('#cm-close').addEventListener('click', (ev) => {
          ev.stopPropagation();
          cm.remove();
        });
        
        document.body.appendChild(cm);
      };

      element.addEventListener('contextmenu', (e) => {
        if(document.getElementById('chat-interface').classList.contains('multi-select-mode')) return;
        e.preventDefault();
        e.stopPropagation();
        showActionMenu();
      });

      element.addEventListener('touchstart', (e) => {
        if(document.getElementById('chat-interface').classList.contains('multi-select-mode')) return;
        touchTimer = setTimeout(() => {
          if (window.navigator.vibrate) window.navigator.vibrate(40); 
          showActionMenu();
        }, 600);
      }, { passive: true });

      element.addEventListener('touchend', () => { if(touchTimer) clearTimeout(touchTimer); });
      element.addEventListener('touchmove', () => { if(touchTimer) clearTimeout(touchTimer); });
    }

      Object.keys(activeTempUploads).forEach(id => {
        const tempMsg = activeTempUploads[id];
        body.appendChild(createTempRow(tempMsg));
      });
      
      // บังคับการดึงสกรอลล์ลงด้านล่างสุดเสมอเมื่อมีการวาดห้องแชทใหม่ครับ
      forceScrollToBottom();

      mediaToLoad.forEach(item => {
        window.loadMediaInline(item.fileId, item.elementId, item.type, item.loadingId);
      });
    }

    function initPickers() {
      const ep = document.getElementById('emoji-picker');
      emojis.forEach(emo => {
        let span = document.createElement('span'); 
        span.className = 'hover:scale-130 transition-transform duration-100 flex items-center justify-center p-1'; 
        span.innerText = emo;
        span.onclick = (e) => { 
          e.stopPropagation();
          document.getElementById('msg-input').value += emo; 
          ep.classList.add('hidden'); 
          forceScrollToBottom();
        };
        ep.appendChild(span);
      });
      
      document.getElementById('tool-emoji').addEventListener('click', (e) => {
        e.stopPropagation(); 
        ep.classList.toggle('hidden');
        document.getElementById('sticker-picker').classList.add('hidden');
      });

      const sp = document.getElementById('sticker-picker');
      stickers.forEach(stk => {
        let img = document.createElement('img'); 
        img.src = stk; 
        img.className = 'w-14 h-14 sm:w-16 sm:h-16 object-contain hover:scale-115 active:scale-95 transition-all duration-100 p-1 cursor-pointer';
        img.onclick = (e) => { 
          e.stopPropagation();
          sendSticker(stk); 
          sp.classList.add('hidden'); 
        };
        sp.appendChild(img);
      });
      
      document.getElementById('tool-sticker').addEventListener('click', (e) => {
        e.stopPropagation(); 
        sp.classList.toggle('hidden');
        ep.classList.add('hidden');
      });

      document.addEventListener('click', () => { 
        ep.classList.add('hidden'); 
        sp.classList.add('hidden'); 
      });
    }
  </script>
</body>
</html>
