<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ChatRoom - Parakit-Site</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #311042 100%);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }
    .chat-area {
      background: rgba(15, 23, 42, 0.4);
      background-size: cover;
      background-position: center;
      transition: all 0.4s ease;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .msg-bubble {
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      transition: all 0.2s ease;
    }
    .msg-row:hover .action-box { opacity: 1; }
    
    .swal-premium-title { font-family: 'Prompt', sans-serif !important; font-weight: 700 !important; color: #1e293b !important; }
    .swal-premium-html { font-family: 'Prompt', sans-serif !important; }
    .swal-input-box {
      width: 100%; max-width: 340px; padding: 12px 16px; margin: 8px auto; display: block;
      border: 1px solid #cbd5e1; border-radius: 14px; font-size: 14px; font-family: 'Prompt', sans-serif;
      background-color: #f8fafc; transition: all 0.2s ease;
    }
    .swal-input-box:focus { outline: none; border-color: #10b981; background-color: #fff; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15); }
    .swal2-popup { border-radius: 24px !important; padding: 2rem !important; }
  </style>
</head>
<body class="h-screen w-screen flex items-center justify-center p-0 sm:p-4 md:p-6 overflow-hidden select-none">

  <div id="login-screen" class="glass-card w-full max-w-md rounded-3xl p-6 sm:p-8 text-center mx-4 transition-all duration-300">
    <div class="w-16 h-16 sm:w-20 sm:h-20 bg-gradient-to-tr from-emerald-400 to-green-600 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl sm:text-4xl shadow-lg mb-4">
      <i class="fa-solid fa-comments"></i>
    </div>
    <h2 class="text-xl sm:text-2xl font-bold text-slate-800 mb-1">Parakit Connect</h2>
    <p class="text-xs text-slate-400 mb-6">กรอกข้อมูลผู้ใช้งานของคุณเพื่อเข้าสู่ห้องแชทรวม</p>
    
    <div class="space-y-4 text-left">
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5 ml-1">Username</label>
        <div class="relative">
          <input type="text" id="login-username" placeholder="กรอก Username" class="w-full p-3.5 pl-11 rounded-2xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 transition-all">
          <i class="fa-solid fa-user absolute left-4 top-4 text-slate-400 text-sm"></i>
        </div>
      </div>
      
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5 ml-1">Password</label>
        <div class="relative">
          <input type="password" id="login-password" placeholder="กรอกรหัสผ่านของคุณ" class="w-full p-3.5 pl-11 rounded-2xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 transition-all">
          <i class="fa-solid fa-lock absolute left-4 top-4 text-slate-400 text-sm"></i>
        </div>
      </div>
      
      <button id="btn-login" class="w-full py-3.5 sm:py-4 mt-2 bg-gradient-to-r from-green-500 to-emerald-600 text-white font-semibold rounded-2xl shadow-md transition-all duration-200 hover:opacity-95 shadow-lg shadow-green-500/20">
        <i class="fa-solid fa-arrow-right-to-bracket mr-2"></i> เข้าสู่ระบบแชท
      </button>

      <div class="relative flex py-1 items-center">
        <div class="flex-grow border-t border-slate-200/60"></div>
        <span class="flex-shrink mx-4 text-xs text-slate-400 font-medium">หรือ</span>
        <div class="flex-grow border-t border-slate-200/60"></div>
      </div>

      <button id="btn-open-register" class="w-full py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-2xl transition-all duration-200 text-sm">
        <i class="fa-solid fa-user-plus mr-2"></i> สร้างบัญชีผู้ใช้ใหม่
      </button>
      
      <div class="flex justify-center items-center text-xs pt-1">
        <button id="btn-forgot-pwd" class="text-slate-400 hover:text-green-600 transition-colors"><i class="fa-solid fa-circle-question mr-1"></i>ลืมรหัสผ่าน?</button>
      </div>
    </div>
  </div>

  <div id="chat-interface" class="w-full h-full md:max-w-4xl md:h-[85vh] glass-panel md:rounded-3xl shadow-2xl flex-col border-none overflow-hidden transition-all duration-300" style="display: none;">
    <div class="p-3 sm:p-4 bg-slate-900/90 text-white flex items-center justify-between border-b border-white/10 z-10 shadow-lg shrink-0">
      <div class="flex items-center gap-2 sm:gap-3 overflow-hidden mr-2">
        <div class="relative group cursor-pointer shrink-0" id="avatar-container" title="คลิกเพื่อเปลี่ยนรูปโปรไฟล์ผ่านกูเกิลไดรฟ์">
          <img id="my-avatar-img" class="w-10 h-10 sm:w-12 sm:h-12 rounded-full border-2 border-green-400 object-cover shadow-md hover:scale-105 transition-all" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
          <div class="absolute inset-0 bg-black/40 rounded-full opacity-0 group-hover:opacity-100 flex items-center justify-center transition-all">
            <i class="fa-solid fa-camera text-[10px] text-white"></i>
          </div>
          <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-slate-900 rounded-full"></span>
        </div>
        <div class="overflow-hidden">
          <h3 id="my-display-name" class="font-bold text-sm sm:text-base tracking-wide text-white truncate">Name</h3>
          <p class="text-[10px] sm:text-[11px] text-green-400 flex items-center gap-1"><span class="w-1.5 h-1.5 bg-green-500 rounded-full inline-block animate-ping"></span> ออนไลน์</p>
        </div>
      </div>
      
      <div class="flex items-center gap-1.5 sm:gap-3 shrink-0">
        <button id="btn-change-bg-upload" title="อัปเดตรูปพื้นหลังแชท" class="w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-white/5 hover:bg-white/15 text-slate-300 hover:text-white flex items-center justify-center transition-all text-sm sm:text-base">
          <i class="fa-solid fa-image"></i>
        </button>
        <button id="btn-clear-view" title="ล้างหน้าจอแชทสำหรับตัวเอง" class="w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-white/5 hover:bg-white/15 text-slate-300 hover:text-white flex items-center justify-center transition-all text-sm sm:text-base">
          <i class="fa-solid fa-broom"></i>
        </button>
        <button id="btn-delete-all-server" title="ลบข้อมูลแชทส่วนกลางทั้งหมด (เฉพาะแอดมิน)" class="w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-rose-500/10 hover:bg-rose-500 text-rose-400 hover:text-white flex items-center justify-center transition-all text-sm sm:text-base shadow-md">
          <i class="fa-solid fa-trash-can"></i>
        </button>
        <button id="btn-logout" title="ออกจากระบบ" class="w-8 h-8 sm:w-10 sm:h-10 rounded-full bg-white/5 hover:bg-white/15 text-slate-300 hover:text-white flex items-center justify-center transition-all text-sm sm:text-base shadow-md">
          <i class="fa-solid fa-power-off"></i>
        </button>
      </div>
    </div>
    
    <div class="chat-area flex-1 p-3 sm:p-4 md:p-6 overflow-y-auto no-scrollbar space-y-4" id="chat-body"></div>
    
    <div class="p-3 sm:p-4 bg-white border-t border-slate-200/80 flex flex-col gap-2 sm:gap-3 shadow-inner shrink-0 relative pb-4 pb-safe">
      <div class="flex items-center justify-between px-1">
        <div class="flex items-center gap-4 sm:gap-5 text-slate-500">
          <label class="cursor-pointer hover:text-green-500 transition-colors flex items-center gap-1.5 text-sm font-medium" title="แนบไฟล์หรือรูปภาพ">
            <i class="fa-solid fa-circle-plus text-lg sm:text-xl text-green-500"></i>
            <span class="text-xs text-slate-400 hidden sm:inline">รูปภาพ / ไฟล์</span>
            <input type="file" id="file-input" class="hidden" onchange="uploadFileAndSend(event)">
          </label>
          <button id="tool-emoji" class="hover:text-amber-500 transition-colors text-lg sm:text-xl" title="ส่งคีย์บอร์ดอิโมจิ"><i class="fa-regular fa-face-smile-wink"></i></button>
          <button id="tool-sticker" class="hover:text-blue-500 transition-colors text-lg sm:text-xl" title="ส่งสติ๊กเกอร์ด่วน"><i class="fa-regular fa-images"></i></button>
        </div>
      </div>
      
      <div class="flex items-center gap-2">
        <input type="text" id="msg-input" placeholder="พิมพ์ข้อความในห้องแชทรวม..." class="flex-1 p-2.5 sm:p-3.5 px-4 sm:px-5 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-green-500 font-medium text-slate-800 placeholder-slate-400 shadow-sm transition-all">
        <button id="btn-send" class="w-10 h-10 sm:w-12 sm:h-12 bg-gradient-to-r from-green-500 to-emerald-500 hover:from-green-600 hover:to-emerald-600 text-white rounded-2xl flex items-center justify-center shadow-lg shadow-green-500/20 transform active:scale-95 transition-all shrink-0">
          <i class="fa-solid fa-paper-plane text-xs sm:text-sm"></i>
        </button>
      </div>
      
      <div class="emoji-picker glass-card shadow-2xl grid grid-cols-6 gap-2 sm:gap-3 p-3 sm:p-4 hidden absolute bottom-20 left-2 right-2 sm:left-4 sm:right-auto sm:min-w-[300px] sm:max-w-[340px] max-h-[200px] rounded-2xl overflow-y-auto z-50 text-xl sm:text-2xl select-none cursor-pointer" id="emoji-picker"></div>
      <div class="sticker-picker glass-card shadow-2xl grid grid-cols-3 gap-2 sm:gap-3 p-3 sm:p-4 hidden absolute bottom-20 left-2 right-2 sm:left-14 sm:right-auto sm:min-w-[300px] sm:max-w-[340px] max-h-[200px] rounded-2xl overflow-y-auto z-50 select-none" id="sticker-picker"></div>
    </div>
    
    <input type="file" id="avatar-input" class="hidden" accept="image/*" onchange="uploadUserAvatarToDrive(event)">
    <input type="file" id="bg-input" class="hidden" accept="image/*" onchange="uploadUserBgToDrive(event)">
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBrgdTPcYPn5UO64vsi9KkUVexnIIXV6F4",
      authDomain: "chat-f4677.firebaseapp.com",
      databaseURL: "https://chat-f4677-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "chat-f4677",
      storageBucket: "chat-f4677.firebasestorage.app",
      messagingSenderId: "803920396350",
      appId: "1:803920396350:web:25b6bc0c8d4e51c4d9116f",
      measurementId: "G-1JMSPXQFFL"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbydCHqLFw-dQWBWEHvbWyxTgJ-bObc2AkM_KSVUyQFL1ErN0lcND1iAhrM8IhE0B7tl/exec";
    let currentUser = null;
    let activeTempUploads = {}; 

    const emojis = [
      "😀","😂","🥰","😎","🤩","😏","👍","👌","🙏","🎉","🔥","❤️",
      "😭","😱","😡","🤫","💩","✨","👀","💯","🎂","🚀","👏","🥳",
      "🥺","💔","💖","🌟","🍀","🍺","☕️","🍙","🎮","🐱","🐶","🦊",
      "👑","💸","ชิว","เซ็ง","สู้ๆ","งอน"
    ];
    
    const stickers = [
      "https://cdn-icons-png.flaticon.com/512/4735/4735419.png",
      "https://cdn-icons-png.flaticon.com/512/4735/4735431.png",
      "https://cdn-icons-png.flaticon.com/512/4735/4735465.png",
      "https://cdn-icons-png.flaticon.com/512/4735/4735515.png",
      "https://fonts.gstatic.com/s/e/notoemoji/latest/1f431/512.webp",
      "https://fonts.gstatic.com/s/e/notoemoji/latest/1f436/512.webp",
      "https://fonts.gstatic.com/s/e/notoemoji/latest/1f98a/512.webp",
      "https://fonts.gstatic.com/s/e/notoemoji/latest/1f42a/512.webp",
      "https://cdn-icons-png.flaticon.com/512/616/616408.png",
      "https://cdn-icons-png.flaticon.com/512/616/616430.png",
      "https://cdn-icons-png.flaticon.com/512/924/924514.png",
      "https://cdn-icons-png.flaticon.com/512/1998/1998614.png"
    ];

    window.addEventListener('DOMContentLoaded', () => {
      initUIEvents();
      initPickers();
      checkSavedLogin();
    });

    function checkSavedLogin() {
      const savedUser = localStorage.getItem('parakit_chat_user');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        document.getElementById('login-screen').style.display = 'none';
        const chatUI = document.getElementById('chat-interface');
        chatUI.style.display = 'flex';
        
        document.getElementById('my-display-name').innerText = currentUser.displayName;
        if(currentUser.avatar) document.getElementById('my-avatar-img').src = currentUser.avatar;
        
        const savedBg = currentUser.bgUrl || localStorage.getItem(`parakit_chat_bg_${currentUser.username}`);
        if (savedBg) {
          const chatBody = document.getElementById('chat-body');
          chatBody.style.backgroundImage = `url('${savedBg}')`;
          chatBody.style.backgroundSize = 'cover';
        }
        
        listenChatMessages();
      }
    }

    function initUIEvents() {
      document.getElementById('btn-open-register').addEventListener('click', openRegisterModal);
      document.getElementById('btn-login').addEventListener('click', handleLogin);
      
      document.getElementById('login-username').addEventListener('keypress', (e) => { if(e.key === 'Enter') document.getElementById('login-password').focus(); });
      document.getElementById('login-password').addEventListener('keypress', (e) => { if(e.key === 'Enter') handleLogin(); });

      document.getElementById('btn-forgot-pwd').addEventListener('click', handleForgotPwd);
      
      document.getElementById('btn-logout').addEventListener('click', () => { 
        localStorage.removeItem('parakit_chat_user');
        location.reload(); 
      });

      document.getElementById('btn-send').addEventListener('click', sendTextMessage);
      document.getElementById('msg-input').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendTextMessage(); });
      
      document.getElementById('avatar-container').addEventListener('click', () => document.getElementById('avatar-input').click());
      document.getElementById('btn-change-bg-upload').addEventListener('click', () => document.getElementById('bg-input').click());
      
      document.getElementById('btn-clear-view').addEventListener('click', () => { document.getElementById('chat-body').innerHTML = ''; });
      document.getElementById('btn-delete-all-server').addEventListener('click', handleAdminDeleteMessages);
    }

    function validatePassword(pwd) {
      if (pwd.length < 8) return false;
      if (/^\d+$/.test(pwd)) return false; 
      return true;
    }

    async function openRegisterModal() {
      const { value: formValues } = await Swal.fire({
        title: 'สร้างบัญชีผู้ใช้ใหม่',
        html: `
          <div class="text-left max-w-xs mx-auto">
            <label class="block text-xs font-semibold text-slate-500 mb-1">ชื่อเล่นแชท (Display Name)</label>
            <input id="swal-name" class="swal-input-box" placeholder="ชื่อเล่นที่แสดงในแชท">
            <label class="block text-xs font-semibold text-slate-500 mb-1 mt-2">Username</label>
            <input id="swal-user" class="swal-input-box" placeholder="สำหรับใช้ล็อกอิน">
            <label class="block text-xs font-semibold text-slate-500 mb-1 mt-2">Password</label>
            <input id="swal-pass" type="password" class="swal-input-box" placeholder="ขั้นต่ำ 8 ตัว (ห้ามเลขล้วน)">
            <label class="block text-xs font-semibold text-slate-500 mb-1 mt-2">Email</label>
            <input id="swal-email" type="email" class="swal-input-box" placeholder="ตัวอย่าง: name@gmail.com">
          </div>
        `,
        focusConfirm: false,
        confirmButtonText: '<i class="fa-solid fa-user-plus mr-1"></i> สมัครและเข้าสู่ระบบ',
        confirmButtonColor: '#10b981',
        showCancelButton: true,
        cancelButtonText: 'ยกเลิก',
        cancelButtonColor: '#64748b',
        customClass: { title: 'swal-premium-title', htmlContainer: 'swal-premium-html' },
        didOpen: () => {
          const inputs = ['swal-name', 'swal-user', 'swal-pass', 'swal-email'];
          inputs.forEach((id) => {
            document.getElementById(id).addEventListener('keypress', (e) => {
              if (e.key === 'Enter') Swal.clickConfirm();
            });
          });
        },
        preConfirm: () => {
          return {
            displayName: document.getElementById('swal-name').value.trim(),
            username: document.getElementById('swal-user').value.trim(),
            password: document.getElementById('swal-pass').value,
            email: document.getElementById('swal-email').value.trim()
          }
        }
      });

      if (!formValues) return;
      if (!formValues.displayName || !formValues.username || !formValues.password || !formValues.email) {
        return Swal.fire({ title: 'เกิดข้อผิดพลาด', text: 'กรุณากรอกข้อมูลให้ครบถ้วนทุกช่องครับ', icon: 'error', confirmButtonColor: '#10b981' });
      }
      if (!formValues.email.endsWith('@gmail.com')) {
        return Swal.fire({ title: 'ข้อมูลไม่ถูกต้อง', text: 'ระบบรองรับการสมัครด้วยบัญชี Gmail เท่านั้นครับ', icon: 'warning', confirmButtonColor: '#10b981' });
      }
      if (!validatePassword(formValues.password)) {
        return Swal.fire({ title: 'รหัสผ่านไม่ปลอดภัย', text: 'รหัสผ่านต้องมีอย่างน้อย 8 ตัว มีส่วนผสมของตัวเลขและตัวอักษร (ห้ามเป็นตัวเลขล้วนครับ)', icon: 'warning', confirmButtonColor: '#10b981' });
      }

      Swal.showLoading();
      try {
        let res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'register', ...formValues }) });
        let result = await res.json();
        
        if(result.status === 'success') {
          currentUser = {
            username: formValues.username,
            email: formValues.email,
            displayName: formValues.displayName,
            avatar: 'https://cdn-icons-png.flaticon.com/512/149/149071.png',
            bgUrl: ''
          };
          localStorage.setItem('parakit_chat_user', JSON.stringify(currentUser));
          
          document.getElementById('login-screen').style.display = 'none';
          const chatUI = document.getElementById('chat-interface');
          chatUI.style.display = 'flex';
          
          document.getElementById('my-display-name').innerText = currentUser.displayName;
          document.getElementById('my-avatar-img').src = currentUser.avatar;
          
          Swal.close();
          listenChatMessages();
        } else { 
          Swal.fire({ title: 'ข้อผิดพลาด', text: result.message, icon: 'error', confirmButtonColor: '#10b981' }); 
        }
      } catch(e) { Swal.fire({ title: 'ข้อผิดพลาด', text: 'ไม่สามารถเชื่อมต่อระบบคลาวด์ได้', icon: 'error', confirmButtonColor: '#10b981' }); }
    }

    async function handleLogin() {
      const userVal = document.getElementById('login-username').value.trim();
      const passVal = document.getElementById('login-password').value;
      if(!userVal || !passVal) return Swal.fire({ title: 'โปรดกรอกข้อมูล', text: 'กรุณาระบุ Username และ Password ให้ครบถ้วน', icon: 'warning', confirmButtonColor: '#10b981' });

      Swal.showLoading();
      try {
        let res = await fetch(SCRIPT_URL, { 
          method: 'POST', 
          body: JSON.stringify({ action: 'login', username: userVal, password: passVal }) 
        });
        let result = await res.json();
        if(result.status === 'success') {
          currentUser = result.user;
          localStorage.setItem('parakit_chat_user', JSON.stringify(currentUser));
          
          document.getElementById('login-screen').style.display = 'none';
          const chatUI = document.getElementById('chat-interface');
          chatUI.style.display = 'flex';
          
          document.getElementById('my-display-name').innerText = currentUser.displayName;
          if(currentUser.avatar) document.getElementById('my-avatar-img').src = currentUser.avatar;
          
          const savedBg = currentUser.bgUrl || localStorage.getItem(`parakit_chat_bg_${currentUser.username}`);
          if (savedBg) {
            const chatBody = document.getElementById('chat-body');
            chatBody.style.backgroundImage = `url('${savedBg}')`;
            chatBody.style.backgroundSize = 'cover';
          }

    window.uploadFileAndSend = function(e) {
      const file = e.target.files[0];
      if(!file) return;
      
      const localTimestamp = Date.now();
      const localObjectURL = URL.createObjectURL(file);
      const isImage = /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(file.name);
      const uploadId = "upload_" + localTimestamp;
      
      activeTempUploads[uploadId] = {
        senderName: currentUser.displayName,
        senderAvatar: currentUser.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png',
        type: isImage ? 'optimistic-image' : 'optimistic-file',
        content: localObjectURL,
        filename: file.name,
        timestamp: localTimestamp
      };
      
      renderAllMessagesWithTemps();

      const reader = new FileReader();
      reader.onloadend = async () => {
        try {
          let res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'uploadFile', filename: file.name, base64: reader.result }) });
          let result = await res.json();
          
          if(result.status === 'success') {
            let finalUrl = result.viewUrl || result.url;
            let fileDriveId = result.fileId || '';
            
            await push(ref(db, 'global_messages'), {
              senderName: currentUser.displayName,
              senderAvatar: currentUser.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png',
              type: isImage ? 'image' : 'file', 
              content: finalUrl, 
              filename: file.name, 
              fileId: fileDriveId,
              timestamp: Date.now(), 
              deleted: false
            });
            
            delete activeTempUploads[uploadId];
            renderAllMessagesWithTemps();
          } else {
            delete activeTempUploads[uploadId];
            Swal.fire({ title: 'อัปโหลดล้มเหลว', text: result.message || 'เกิดข้อผิดพลาดจากเซิร์ฟเวอร์', icon: 'error', confirmButtonColor: '#10b981' });
            renderAllMessagesWithTemps();
          }
        } catch(err) { 
          console.error("เบื้องหลังส่งไฟล์ล้มเหลว", err);
          delete activeTempUploads[uploadId];
          renderAllMessagesWithTemps();
        }
      };
      reader.readAsDataURL(file);
    }

      else if(msg.type === 'sticker') inner = `<img src="${msg.content}" class="w-20 h-20 sm:w-24 sm:h-24 object-contain">`;
      else if(msg.type === 'optimistic-image') inner = `
        <div class="flex flex-col items-end">

    window.directDownloadFromDrive = async function(fileId, filename) {
      if(!fileId) return Swal.fire({ title: 'ผิดพลาด', text: 'ไม่พบรหัสไฟล์สำหรับดาวน์โหลด', icon: 'error', confirmButtonColor: '#10b981' });
      
      Swal.fire({
        title: 'กำลังเตรียมไฟล์...',
        html: 'ระบบกำลังดึงข้อมูลไฟล์จากไดร์ฟโดยตรง',
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
      });

      try {
        const downloadApiUrl = `https://drive.google.com/uc?export=download&id=${fileId}`;
        const response = await fetch(downloadApiUrl, { method: 'GET' });
        if(!response.ok) throw new Error('Network error');
        
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        
        const a = document.createElement("a");
        a.href = blobUrl;
        a.download = filename || "downloaded_file";
        document.body.appendChild(a);
        a.click();
        
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);
        Swal.close();
      } catch (err) {
        window.open(`https://drive.google.com/uc?export=download&id=${fileId}`, '_blank');
        Swal.close();
      }
    };

    function renderAllMessagesWithTemps() {
      const body = document.getElementById('chat-body');
      body.innerHTML = '';
      
      let lastRenderedDate = ""; 
      
      if(lastSnapshotData) {
        Object.keys(lastSnapshotData).forEach(key => {
          const msg = lastSnapshotData[key];
          
          if (msg.timestamp) {
            const msgDateObj = new Date(msg.timestamp);
            const msgDateStr = msgDateObj.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
            
            if (msgDateStr !== lastRenderedDate) {
              const dateDivider = document.createElement('div');
              dateDivider.className = "w-full flex justify-center my-3 select-none";
              dateDivider.innerHTML = `<span class="px-3 py-1 bg-slate-800/40 backdrop-blur-md border border-white/10 text-slate-300 text-[11px] font-medium rounded-full shadow-sm">${msgDateStr}</span>`;
              body.appendChild(dateDivider);
              lastRenderedDate = msgDateStr;
            }
          }

          const isSelf = msg.senderName === currentUser.displayName;
          
          const row = document.createElement('div');
          row.className = `msg-row flex gap-2 sm:gap-3 max-w-[85%] sm:max-w-[75%] width-fit relative items-end group mb-2 ${isSelf ? 'self align-self-end flex-row-reverse ml-auto' : 'other align-self-flex-start'}`;
          
          if(!isSelf) {
            const img = document.createElement('img');
            img.className = 'msg-avatar w-8 h-8 rounded-full object-cover shadow-sm self-start mt-1 shrink-0';
            img.src = msg.senderAvatar;
            row.appendChild(img);
          }

          const wrapper = document.createElement('div');
          wrapper.className = 'msg-content-wrapper flex flex-col overflow-hidden';
          
          if(!isSelf) {
            const nameSpan = document.createElement('span');
            nameSpan.className = 'msg-name text-[11px] text-slate-400 font-medium mb-1 px-1';
            nameSpan.innerText = msg.senderName;
            wrapper.appendChild(nameSpan);
          }

          const bubble = document.createElement('div');
          bubble.className = 'msg-bubble p-2.5 px-3.5 sm:p-3 sm:px-4 rounded-2xl text-sm leading-relaxed flex flex-col gap-2 break-words';

          if(msg.deleted) {
            bubble.innerText = 'ข้อความถูกลบเรียบร้อย';
            bubble.className += ' msg-deleted text-slate-400 italic bg-white/20 border border-dashed text-xs';
          } else {
            const isImageLink = msg.type === 'image' || 
                               (msg.content && (msg.content.includes('drive.google.com/thumbnail') || msg.content.includes('drive.google.com/uc')) && !msg.filename) ||
                               (msg.filename && /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(msg.filename));
            
            if(isImageLink) {
              bubble.innerHTML = `
                <img src="${msg.content}" class="max-w-[160px] sm:max-w-[200px] rounded-xl object-cover cursor-pointer border border-white/20 shadow-md transform hover:scale-[1.02] transition-all" referrerpolicy="no-referrer" onerror="this.src='https://cdn-icons-png.flaticon.com/512/16/16410.png'; this.className='w-12 h-12 opacity-50';" onclick="viewSpotlightImage('${msg.content}', '${msg.filename || 'Image'}')">
                <div class="flex items-center gap-1.5 mt-1 w-full justify-center">
                  <a href="https://drive.google.com/file/d/${msg.fileId || ''}/view" target="_blank" class="px-2 py-1 bg-slate-800/80 hover:bg-slate-900 text-[10px] text-white rounded-md font-medium transition-colors flex items-center gap-1 shadow-sm"><i class="fa-regular fa-eye"></i> ดูไฟล์</a>
                  <button onclick="directDownloadFromDrive('${msg.fileId || ''}', '${msg.filename || 'image.png'}')" class="px-2 py-1 bg-green-600 hover:bg-green-700 text-[10px] text-white rounded-md font-medium transition-colors flex items-center gap-1 shadow-sm"><i class="fa-solid fa-download"></i> ดาวน์โหลด</button>
                </div>
              `;
              bubble.style.padding = '0'; bubble.style.background = 'none'; bubble.style.boxShadow = 'none';
            } else if(msg.type === 'text') {
              bubble.innerText = msg.content;
              bubble.className += isSelf ? ' bg-[#7CE68E] text-slate-900 rounded-tr-none' : ' bg-white text-slate-800 rounded-tl-none';
            } else if(msg.type === 'file') {
              bubble.innerHTML = `
                <div class="flex items-center gap-2 font-semibold text-slate-700 text-xs sm:text-sm break-all">
                  <i class="fa-solid fa-file-lines text-lg sm:text-xl text-emerald-500 shrink-0"></i> ${msg.filename || 'ไฟล์แนบ'}
                </div>
                <div class="flex items-center gap-2 mt-1 border-t border-slate-100 pt-1.5 justify-start">
                  <a href="https://drive.google.com/file/d/${msg.fileId || ''}/view" target="_blank" class="px-1.5 py-0.5 sm:px-2 sm:py-1 bg-slate-100 hover:bg-slate-200 text-[10px] text-slate-600 rounded-md font-medium transition-colors flex items-center gap-1"><i class="fa-regular fa-eye"></i> ดูไฟล์</a>
                  <button onclick="directDownloadFromDrive('${msg.fileId || ''}', '${msg.filename || 'file'}')" class="px-1.5 py-0.5 sm:px-2 sm:py-1 bg-green-50 hover:bg-green-100 text-[10px] text-green-600 rounded-md font-medium transition-colors flex items-center gap-1"><i class="fa-solid fa-download"></i> ดาวน์โหลด</button>
                </div>
              `;
              bubble.className += ' bg-white text-slate-800 rounded-2xl shadow-sm';
            } else if(msg.type === 'sticker') {
              bubble.innerHTML = `<img src="${msg.content}" class="w-20 h-20 sm:w-24 sm:h-24 object-contain select-none">`;
              bubble.style.padding = '0'; bubble.style.background = 'none'; bubble.style.boxShadow = 'none';
            }

            if(isSelf) {
              const actionBox = document.createElement('button');
              actionBox.className = 'action-box text-rose-500 hover:text-rose-600 bg-rose-50 p-1.5 rounded-xl opacity-0 group-hover:opacity-100 transition-opacity duration-200 self-center mx-1 sm:mx-2 shrink-0';
              actionBox.innerHTML = '<i class="fa-solid fa-trash-can text-xs sm:text-sm"></i>';
              actionBox.onclick = () => {
                Swal.fire({
                  title: 'ยกเลิกการส่ง?',
                  text: "คุณต้องการลบข้อความนี้ออกจากห้องแชท และลบไฟล์บนคลาวด์ถาวรใช่หรือไม่",
                  icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', cancelButtonColor: '#64748b', confirmButtonText: 'ใช่, ลบข้อความ',
                  customClass: { title: 'swal-premium-title', htmlContainer: 'swal-premium-html' }
                }).then((res) => {
                  if(res.isConfirmed) { 
                    update(ref(db, `global_messages/${key}`), { deleted: true }); 
                    if(msg.fileId) {
                      fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'deleteFile', fileId: msg.fileId })
                      }).then(res => res.json()).catch(err => console.error(err));
                    }
                  }
                });
              };
              row.appendChild(actionBox);
            }
          }

          wrapper.appendChild(bubble);
          
          const timeSpan = document.createElement('span');
          timeSpan.className = 'text-[9px] text-slate-400 self-end font-medium px-0.5 mb-1 shrink-0';
          timeSpan.innerText = new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
          
          row.appendChild(wrapper);
          row.appendChild(timeSpan);
          body.appendChild(row);
        });
      }
      
      Object.keys(activeTempUploads).forEach(id => {
        const tempMsg = activeTempUploads[id];
        body.appendChild(createTempRow(tempMsg));
      });
      
      body.scrollTop = body.scrollHeight;
    }

    window.viewSpotlightImage = function(url, filename) {
      Swal.fire({
        title: filename,
        imageUrl: url,
        imageAlt: filename,
        showCancelButton: true,
        confirmButtonText: '<i class="fa-solid fa-cloud-arrow-down mr-1"></i> ดาวน์โหลดรูปนี้',
        cancelButtonText: 'ปิดหน้าต่าง',
        confirmButtonColor: '#10b981',
        cancelButtonColor: '#64748b',
        customClass: { title: 'swal-premium-title', htmlContainer: 'swal-premium-html' }
      }).then((result) => {
        if (result.isConfirmed) {
          const a = document.createElement("a"); a.href = url; a.download = filename;
          document.body.appendChild(a); a.click(); document.body.removeChild(a);
        }
      });
    }

    function initPickers() {
      const ep = document.getElementById('emoji-picker');
      emojis.forEach(emo => {
        let span = document.createElement('span'); 
        span.className = 'hover:scale-130 transition-transform duration-100 flex items-center justify-center p-1'; 
        span.innerText = emo;
        span.onclick = (e) => { 
          e.stopPropagation();
          document.getElementById('msg-input').value += emo; 
          ep.classList.add('hidden'); 
        };
        ep.appendChild(span);
      });
      
      document.getElementById('tool-emoji').addEventListener('click', (e) => {
        e.stopPropagation(); 
        ep.classList.toggle('hidden');
        document.getElementById('sticker-picker').classList.add('hidden');
      });

      const sp = document.getElementById('sticker-picker');
      stickers.forEach(stk => {
        let img = document.createElement('img'); 
        img.src = stk; 
        img.className = 'w-14 h-14 sm:w-16 sm:h-16 object-contain hover:scale-115 active:scale-95 transition-all duration-100 p-1 cursor-pointer';
        img.onclick = (e) => { 
          e.stopPropagation();
          sendSticker(stk); 
          sp.classList.add('hidden'); 
        };
        sp.appendChild(img);
      });
      
      document.getElementById('tool-sticker').addEventListener('click', (e) => {
        e.stopPropagation(); 
        sp.classList.toggle('hidden');
        ep.classList.add('hidden');
      });

      document.addEventListener('click', () => { 
        ep.classList.add('hidden'); 
        sp.classList.add('hidden'); 
      });
    }
  </script>
</body>
</html>
