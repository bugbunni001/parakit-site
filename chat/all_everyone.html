<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ChatRoom - Parakit-Site</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.js"></script>
  
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #311042 100%);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }
    .chat-area {
      background: rgba(15, 23, 42, 0.4);
      background-size: cover;
      background-position: center;
      transition: all 0.4s ease;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .msg-bubble {
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      transition: all 0.2s ease;
    }
    
    .swal-premium-title { font-family: 'Prompt', sans-serif !important; font-weight: 700 !important; color: #1e293b !important; }
    .swal-premium-html { font-family: 'Prompt', sans-serif !important; }
    .swal-input-box {
      width: 100%; max-width: 340px; padding: 12px 16px; margin: 8px auto; display: block;
      border: 1px solid #cbd5e1; border-radius: 14px; font-size: 14px; font-family: 'Prompt', sans-serif;
      background-color: #f8fafc; transition: all 0.2s ease;
    }
    .swal-input-box:focus { outline: none; border-color: #10b981; background-color: #fff; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15); }
    .swal2-popup { border-radius: 24px !important; padding: 2rem !important; }
    
    .swal-settings-card {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    
    #viewer-hidden-container { display: none; }
    .viewer-title { display: none !important; }
    
    .custom-cm {
      position: fixed;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
      padding: 6px;
      min-width: 180px;
      animation: cmScale 0.15s ease-out;
    }
    @keyframes cmScale {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    
    .audio-player-container {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 16px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 220px;
      max-width: 280px;
    }
    /* สไตล์เพิ่มเติมสำหรับปรับขนาด Textarea ส่งข้อความอัตโนมัติ */
    #msg-input {
      resize: none;
      max-height: 120px;
    }
  </style>
</head>
<body class="h-[100dvh] w-screen flex items-center justify-center p-0 sm:p-4 md:p-6 overflow-hidden select-none">

  <div id="login-screen" class="glass-card w-full max-w-md rounded-3xl p-6 sm:p-8 text-center mx-4 transition-all duration-300 block z-50">
    <div class="w-16 h-16 sm:w-20 sm:h-20 bg-gradient-to-tr from-emerald-400 to-green-600 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl sm:text-4xl shadow-lg mb-4">
      <i class="fa-solid fa-comments"></i>
    </div>
    <h2 class="text-xl sm:text-2xl font-bold text-slate-800 mb-1">Parakit Connect</h2>
    <p class="text-xs text-slate-400 mb-6">กรอกข้อมูลผู้ใช้งานของคุณเพื่อเข้าสู่ห้องแชทรวม</p>
    
    <div class="space-y-4 text-left">
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5 ml-1">Username</label>
        <div class="relative">
          <input type="text" id="login-username" placeholder="กรอก Username" class="w-full p-3.5 pl-11 rounded-2xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 transition-all">
          <i class="fa-solid fa-user absolute left-4 top-4 text-slate-400 text-sm"></i>
        </div>
      </div>
      
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5 ml-1">Password</label>
        <div class="relative">
          <input type="password" id="login-password" placeholder="กรอกรหัสผ่านของคุณ" class="w-full p-3.5 pl-11 rounded-2xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 transition-all">
          <i class="fa-solid fa-lock absolute left-4 top-4 text-slate-400 text-sm"></i>
        </div>
      </div>
      
      <button id="btn-login" class="w-full py-3.5 sm:py-4 mt-2 bg-gradient-to-r from-green-500 to-emerald-600 text-white font-semibold rounded-2xl shadow-md transition-all duration-200 hover:opacity-95 shadow-lg shadow-green-500/20">
        <i class="fa-solid fa-arrow-right-to-bracket mr-2"></i> เข้าสู่ระบบแชท
      </button>

      <div class="relative flex py-1 items-center">
        <div class="flex-grow border-t border-slate-200/60"></div>
        <span class="flex-shrink mx-4 text-xs text-slate-400 font-medium">หรือ</span>
        <div class="flex-grow border-t border-slate-200/60"></div>
      </div>

      <button id="btn-open-register" class="w-full py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-2xl transition-all duration-200 text-sm">
        <i class="fa-solid fa-user-plus mr-2"></i> สร้างบัญชีผู้ใช้ใหม่
      </button>
      
      <div class="flex justify-center items-center text-xs pt-1">
        <button id="btn-forgot-pwd" class="text-slate-400 hover:text-green-600 transition-colors"><i class="fa-solid fa-circle-question mr-1"></i>ลืมรหัสผ่าน?</button>
      </div>
    </div>
  </div>

  <div id="chat-interface" class="w-full h-full md:max-w-5xl md:h-[85vh] glass-panel md:rounded-3xl shadow-2xl flex flex-col border-none overflow-hidden transition-all duration-300" style="display: none;">
    <div class="p-3 bg-slate-900/95 text-white flex items-center justify-between border-b border-white/10 z-10 shadow-lg shrink-0">
      <div class="flex items-center gap-2 sm:gap-3 overflow-hidden mr-2">
        <div class="relative group cursor-pointer shrink-0" id="avatar-container" title="คลิกเพื่อเปลี่ยนรูปโปรไฟล์ผ่านกูเกิลไดรฟ์">
          <img id="my-avatar-img" class="w-10 h-10 sm:w-12 sm:h-12 rounded-full border-2 border-green-400 object-cover shadow-md hover:scale-105 transition-all" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
          <div class="absolute inset-0 bg-black/40 rounded-full opacity-0 group-hover:opacity-100 flex items-center justify-center transition-all">
            <i class="fa-solid fa-camera text-[10px] text-white"></i>
          </div>
          <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-slate-900 rounded-full"></span>
        </div>
        <div class="overflow-hidden">
          <h3 id="my-display-name" class="font-bold text-sm sm:text-base tracking-wide text-white truncate">Name</h3>
          <p class="text-[10px] sm:text-[11px] text-green-400 flex items-center gap-1"><span class="w-1.5 h-1.5 bg-green-500 rounded-full inline-block animate-ping"></span> ออนไลน์</p>
        </div>
      </div>
      
      <div class="shrink-0 flex items-center gap-2">
        <button id="btn-open-settings" title="การตั้งค่าระบบแชท" class="px-3.5 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-white flex items-center justify-center gap-1.5 transition-all text-xs font-semibold border border-white/10 shadow-md">
          <i class="fa-solid fa-gear text-sm"></i>
          <span>ตั้งค่า</span>
        </button>
      </div>
    </div>
    
    <div class="chat-area flex-1 p-3 sm:p-4 md:p-6 overflow-y-auto no-scrollbar space-y-4 font-normal flex flex-col" id="chat-body"></div>
    
    <div class="p-3 bg-white border-t border-slate-200/80 flex flex-col gap-2 shadow-inner shrink-0 relative pb-safe">
      <div class="flex items-center justify-between px-1">
        <div class="flex items-center gap-4 text-slate-500 w-full justify-between">
          <div class="flex items-center gap-4">
            <label class="cursor-pointer hover:text-green-500 transition-colors flex items-center gap-1.5 text-sm font-medium" title="แนบไฟล์หรือรูปภาพ">
              <i class="fa-solid fa-circle-plus text-lg sm:text-xl text-green-500"></i>
              <span class="text-xs text-slate-400 hidden sm:inline">รูปภาพ / วิดีโอ / ไฟล์</span>
              <input type="file" id="file-input" class="hidden" onchange="uploadFileAndSend(event)">
            </label>
            <button id="tool-emoji" class="hover:text-amber-500 transition-colors text-lg sm:text-xl" title="ส่งคีย์บอร์ดอิโมจิ"><i class="fa-regular fa-face-smile-wink"></i></button>
            <button id="tool-sticker" class="hover:text-blue-500 transition-colors text-lg sm:text-xl" title="ส่งสติ๊กเกอร์ด่วน"><i class="fa-regular fa-images"></i></button>
          </div>
          <div class="flex items-center gap-2">
            <span id="audio-timer" class="text-xs font-bold text-red-500 hidden animate-pulse">0:00</span>
            <button id="btn-audio-record" class="w-9 h-9 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center transition-all hover:bg-red-50 hover:text-red-500 shadow-sm" title="กดเพื่ออัดเสียงสูงสุด 1 นาที">
              <i class="fa-solid fa-microphone text-sm"></i>
            </button>
          </div>
        </div>
      </div>
      
      <div class="flex items-center gap-2 items-end">
        <textarea id="msg-input" rows="1" placeholder="พิมพ์ข้อความในห้องแชทรวม... (Shift + Enter เพื่อขึ้นบรรทัดใหม่)" class="flex-1 p-2.5 sm:p-3.5 px-4 sm:px-5 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-green-500 font-medium text-slate-800 placeholder-slate-400 shadow-sm transition-all no-scrollbar"></textarea>
        <button id="btn-send" class="w-10 h-10 sm:w-12 sm:h-12 bg-gradient-to-r from-green-500 to-emerald-500 hover:from-green-600 hover:to-emerald-600 text-white rounded-2xl flex items-center justify-center shadow-lg shadow-green-500/20 transform active:scale-95 transition-all shrink-0 mb-0.5">
          <i class="fa-solid fa-paper-plane text-xs sm:text-sm"></i>
        </button>
      </div>
      
      <div class="emoji-picker glass-card shadow-2xl grid grid-cols-6 gap-2 sm:gap-3 p-3 sm:p-4 hidden absolute bottom-24 left-2 right-2 sm:left-4 sm:right-auto sm:min-w-[300px] sm:max-w-[340px] max-h-[180px] rounded-2xl overflow-y-auto z-50 text-xl sm:text-2xl select-none cursor-pointer" id="emoji-picker"></div>
      <div class="sticker-picker glass-card shadow-2xl grid grid-cols-3 gap-2 sm:gap-3 p-3 sm:p-4 hidden absolute bottom-24 left-2 right-2 sm:left-14 sm:right-auto sm:min-w-[300px] sm:max-w-[340px] max-h-[180px] rounded-2xl overflow-y-auto z-50 select-none" id="sticker-picker"></div>
    </div>
    
    <input type="file" id="avatar-input" class="hidden" accept="image/*" onchange="uploadUserAvatarToDrive(event)">
    <input type="file" id="bg-input" class="hidden" accept="image/*" onchange="uploadUserBgToDrive(event)">
  </div>

  <div id="viewer-hidden-container">
    <img id="viewer-target-image" src="" alt="Chat Content Image">
  </div>

  <audio id="global-noti-sound" src="https://assets.mixkit.co/active_storage/sfx/2357/2357-84.wav" preload="auto"></audio>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, update, remove, onDisconnect, set } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBrgdTPcYPn5UO64vsi9KkUVexnIIXV6F4",
      authDomain: "chat-f4677.firebaseapp.com",
      databaseURL: "https://chat-f4677-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "chat-f4677",
      storageBucket: "chat-f4677.firebasestorage.app",
      messagingSenderId: "803920396350",
      appId: "1:803920396350:web:25b6bc0c8d4e51c4d9116f",
      measurementId: "G-1JMSPXQFFL"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxqvtiPOhLybcg06uVOaRXkky1icn8WtdZwWlwsnuqI_ch6pYSCTbDhfp5_rSZJrnwK/exec";
    let currentUser = null;
    let activeTempUploads = {}; 
    let globalAvatarMap = {}; 
    let currentActiveUsers = {}; 
    let globalViewerInstance = null;
    
    // ตัวแปรสำหรับฟังก์ชันอัดเสียง
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let recordInterval = null;
    let recordDuration = 0;

    const emojis = ["😀","😂","🥰","😎","🤩","😏","👍","👌","🙏","🎉","🔥","❤️","😭","😱","😡","🤫","💩","✨","👀","💯","🎂","🚀","👏","🥳","🥺","💔","💖","🌟","🍀","🍺","☕️","🍙","🎮","🐱","🐶","🦊","👑","💸","ชิว","เซ็ง","สู้ๆ","งอน"];
    const stickers = [
      "https://cdn-icons-png.flaticon.com/512/4735/4735419.png","https://cdn-icons-png.flaticon.com/512/4735/4735431.png","https://cdn-icons-png.flaticon.com/512/4735/4735465.png","https://cdn-icons-png.flaticon.com/512/4735/4735515.png","https://fonts.gstatic.com/s/e/notoemoji/latest/1f431/512.webp","https://fonts.gstatic.com/s/e/notoemoji/latest/1f436/512.webp","https://fonts.gstatic.com/s/e/notoemoji/latest/1f98a/512.webp","https://fonts.gstatic.com/s/e/notoemoji/latest/1f42a/512.webp","https://cdn-icons-png.flaticon.com/512/616/616408.png","https://cdn-icons-png.flaticon.com/512/616/616430.png","https://cdn-icons-png.flaticon.com/512/924/924514.png","https://cdn-icons-png.flaticon.com/512/1998/1998614.png"
    ];

    window.addEventListener('DOMContentLoaded', () => {
      initUIEvents();
      initPickers();
      checkSavedLogin();
      initGlobalViewer();
      initContextMenuDismissal();
      initAudioRecorder();
    });

    // ปลดล็อกเสียงแจ้งเตือน
    function unlockAudioContext() {
      const audio = document.getElementById('global-noti-sound');
      audio.play().then(() => {
        audio.pause();
        audio.currentTime = 0;
      }).catch(e => console.log("Audio unlock retry:", e));
    }

    function initGlobalViewer() {
      const imgTarget = document.getElementById('viewer-target-image');
      globalViewerInstance = new Viewer(imgTarget, {
        inline: false, button: true, navbar: false, title: false,
        toolbar: { zoomIn: 4, zoomOut: 4, oneToOne: 4, reset: 4, rotateLeft: 4, rotateRight: 4, flipHorizontal: 4, flipVertical: 4 },
        tooltip: true, movable: true, zoomable: true, rotatable: true, scalable: true, transition: true, fullscreen: true, keyboard: true
      });
    }

    window.openImageInZoomViewer = function(url) {
      const imgTarget = document.getElementById('viewer-target-image');
      imgTarget.src = url;
      globalViewerInstance.update();
      globalViewerInstance.show();
    };

    function initContextMenuDismissal() {
      document.addEventListener('click', () => {
        const existCm = document.getElementById('custom-context-menu');
        if(existCm) existCm.remove();
      });
    }

    async function syncAvatarsFromServer() {
      try {
        let res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'getAllAvatars' }) });
        let result = await res.json();
        if (result.status === 'success') {
          globalAvatarMap = result.avatars;
          if (currentUser && globalAvatarMap[currentUser.displayName]) {
            currentUser.avatar = globalAvatarMap[currentUser.displayName];
            document.getElementById('my-avatar-img').src = currentUser.avatar;
            localStorage.setItem('parakit_chat_user', JSON.stringify(currentUser));
          }
        }
      } catch (e) { console.error("ไม่สามารถซิงค์ข้อมูลรูปโปรไฟล์ได้", e); }
    }

    function setupUserPresence() {
      if (!currentUser) return;
      const myPresenceRef = ref(db, `status/${currentUser.username}`);
      set(myPresenceRef, { displayName: currentUser.displayName, lastActive: Date.now() });
      onDisconnect(myPresenceRef).remove();

      onValue(ref(db, 'status'), (snapshot) => {
        currentActiveUsers = snapshot.val() || {};
        syncAvatarsFromServer().then(() => renderAllMessagesWithTemps());
      });
    }

    async function checkSavedLogin() {
      const savedUser = localStorage.getItem('parakit_chat_user');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        document.getElementById('login-screen').style.display = 'none';
        const chatUI = document.getElementById('chat-interface');
        chatUI.style.display = 'flex';
        
        document.getElementById('my-display-name').innerText = currentUser.displayName;
        if(currentUser.avatar) document.getElementById('my-avatar-img').src = currentUser.avatar;
        
        const savedBg = currentUser.bgUrl || localStorage.getItem(`parakit_chat_bg_${currentUser.username}`);
        if (savedBg) {
          const chatBody = document.getElementById('chat-body');
          chatBody.style.backgroundImage = `url('${savedBg}')`;
          chatBody.style.backgroundSize = 'cover';
        }
        
        setupUserPresence();
        await syncAvatarsFromServer();
        listenChatMessages();
      }
    }

    function initUIEvents() {
      document.getElementById('btn-open-register').addEventListener('click', openRegisterModal);
      document.getElementById('btn-login').addEventListener('click', () => {
        unlockAudioContext();
        handleLogin();
      });
      
      document.getElementById('login-username').addEventListener('keypress', (e) => { if(e.key === 'Enter') document.getElementById('login-password').focus(); });
      document.getElementById('login-password').addEventListener('keypress', (e) => { if(e.key === 'Enter') { unlockAudioContext(); handleLogin(); } });

      document.getElementById('btn-forgot-pwd').addEventListener('click', handleForgotPwd);
      document.getElementById('btn-open-settings').addEventListener('click', openSettingsModal);
      document.getElementById('btn-send').addEventListener('click', sendTextMessage);
      
      // ปรับจังหวะปุ่ม Enter บนคอมพิวเตอร์ และพฤติกรรมบนมือถือของ Textarea
      const msgInput = document.getElementById('msg-input');
      msgInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 640) {
          e.preventDefault();
          sendTextMessage();
        }
      });
      
      // ปรับขนาดของช่องกรอกข้อความอัตโนมัติเมื่อกดเว้นบรรทัด
      msgInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
      });
      
      document.getElementById('avatar-container').addEventListener('click', () => document.getElementById('avatar-input').click());
    }

    // ฟังก์ชันจัดการอัดเสียงความยาวสูงสุด 1 นาที
    function initAudioRecorder() {
      const recordBtn = document.getElementById('btn-audio-record');
      const timerSpan = document.getElementById('audio-timer');
      
      recordBtn.addEventListener('click', async () => {
        if (!isRecording) {
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            try {
              const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
              mediaRecorder = new MediaRecorder(stream);
              audioChunks = [];
              
              mediaRecorder.ondataavailable = (e) => {
                audioChunks.push(e.data);
              };
              
              mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                if (audioBlob.size > 100) {
                  await uploadAudioAndSend(audioBlob);
                }
                stream.getTracks().forEach(track => track.stop());
              };
              
              mediaRecorder.start();
              isRecording = true;
              recordBtn.innerHTML = `<i class="fa-solid fa-square text-red-500 animate-pulse"></i>`;
              timerSpan.classList.remove('hidden');
              recordDuration = 0;
              timerSpan.innerText = "0:00";
              
              recordInterval = setInterval(() => {
                recordDuration++;
                let secs = recordDuration % 60;
                timerSpan.innerText = `0:${secs < 10 ? '0' : ''}${secs}`;
                
                if (recordDuration >= 60) {
                  stopAudioRecording();
                }
              }, 1000);
              
            } catch (err) {

            });

        renderAllMessagesWithTemps();
      };
      reader.readAsDataURL(blob);

    // แก้ไขฟังก์ชัน linkify ให้เปลี่ยนเว้นบรรทัด \n เป็น <br> ในตัวแชท
    function linkify(text) {
      if (!text) return "";
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      let html = text.replace(urlRegex, function(url) {
        return `<a href="${url}" target="_blank" class="text-blue-600 font-medium underline break-all hover:text-blue-800">${url}</a>`;
      });
      return html.replace(/\n/g, '<br>');
    }

    window.initAudioTracker = function(audioElement, durationId) {
      // ดึงค่าเวลารองรับเมื่อ Metadata เริ่มโหลด
      audioElement.addEventListener('loadedmetadata', () => {
        const secs = Math.floor(audioElement.duration || 0);
        document.getElementById(durationId).innerText = `0:${secs < 10 ? '0' : ''}${secs}`;
      });
      audioElement.addEventListener('timeupdate', () => {
        if (!audioElement.duration) return;
        const remain = Math.max(0, audioElement.duration - audioElement.currentTime);
        const secs = Math.floor(remain % 60);
        document.getElementById(durationId).innerText = `0:${secs < 10 ? '0' : ''}${secs}`;
      });
      audioElement.addEventListener('ended', () => {
        const secs = Math.floor(audioElement.duration || 0);
        document.getElementById(durationId).innerText = `0:${secs < 10 ? '0' : ''}${secs}`;
      });
    };

    window.uploadFileAndSend = function(e) {
      const file = e.target.files[0];
      if(!file) return;
      
      const localTimestamp = Date.now();
      const localObjectURL = URL.createObjectURL(file);
      const isImage = /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(file.name);
      const isVideo = /\.(mp4|mov|avi|mkv|webm)$/i.test(file.name);
      const uploadId = "upload_" + localTimestamp;
      
      activeTempUploads[uploadId] = {
        senderName: currentUser.displayName,
        senderAvatar: currentUser.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png',
        type: isImage ? 'optimistic-image' : (isVideo ? 'optimistic-video' : 'optimistic-file'),
        content: localObjectURL,
        filename: file.name,
        timestamp: localTimestamp
      };
      
      renderAllMessagesWithTemps();

      const reader = new FileReader();
      reader.onloadend = async () => {
        try {
          if (isVideo) {
            const tempVideo = document.createElement('video');
            tempVideo.src = localObjectURL;
            tempVideo.onloadedmetadata = async function() {
              if (tempVideo.duration > 300) {
                Swal.fire('ไฟล์มีขนาดใหญ่เกินไป', 'ระบบรองรับความยาววิดีโอสูงสุดไม่เกิน 5 นาทีครับ', 'error');
                delete activeTempUploads[uploadId];
                renderAllMessagesWithTemps();
                return;
              }
              await executeUpload();
            };
          } else {
            await executeUpload();
          }

          async function executeUpload() {
            let res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'uploadFile', filename: file.name, base64: reader.result }) });
            let result = await res.json();
            
            if(result.status === 'success') {
              let finalUrl = result.viewUrl || result.url;
              let fileDriveId = result.fileId || '';
              
              await push(ref(db, 'global_messages'), {
                senderName: currentUser.displayName,
                senderAvatar: currentUser.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png',
                type: isImage ? 'image' : (isVideo ? 'video' : 'file'), 
                content: finalUrl, 
                filename: file.name, 
                fileId: fileDriveId,
                timestamp: Date.now(), 
                deleted: false
              });
            } else {
              Swal.fire({ title: 'อัปโหลดล้มเหลว', text: result.message || 'เกิดข้อผิดพลาดจากเซิร์ฟเวอร์', icon: 'error', confirmButtonColor: '#10b981' });
            }
            delete activeTempUploads[uploadId];
            renderAllMessagesWithTemps();
          }
        } catch(err) { 
          console.error(err);
          delete activeTempUploads[uploadId];
          renderAllMessagesWithTemps();
        }
      };
      reader.readAsDataURL(file);
    }

    window.directDownloadFromDrive = async function(fileId, filename) {
      if(!fileId) return Swal.fire({ title: 'ผิดพลาด', text: 'ไม่พบรหัสไฟล์สำหรับดาวน์โหลด', icon: 'error', confirmButtonColor: '#10b981' });

        didOpen: () => { Swal.showLoading(); }
      });

      try {
        const downloadApiUrl = `https://drive.google.com/uc?export=download&id=${fileId}`;
        const response = await fetch(downloadApiUrl, { method: 'GET' });
        if(!response.ok) throw new Error('Network error');
        
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        
        const a = document.createElement("a");
        a.href = blobUrl;
        a.download = filename || "downloaded_file";
        document.body.appendChild(a);
        a.click();
        
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);
        Swal.close();
      } catch (err) {
        window.open(`https://drive.google.com/uc?export=download&id=${fileId}`, '_blank');
        Swal.close();
      }
    };

    function bindMessageActionEvents(element, msgKey, msgFileId, textContent) {
      let touchTimer = null;
      
      const showActionMenu = (clientX, clientY) => {
        const existCm = document.getElementById('custom-context-menu');
        if(existCm) existCm.remove();
        
        const cm = document.createElement('div');
        cm.id = 'custom-context-menu';
        cm.className = 'custom-cm flex flex-col gap-1';
        cm.style.top = `${clientY}px`;
        cm.style.left = `${clientX}px`;
        
        let menuHTML = '';
        if (textContent) {
          menuHTML += `
            <button id="cm-copy" class="w-full text-left flex items-center gap-2 px-3 py-2 hover:bg-slate-100 text-slate-700 rounded-lg text-xs font-semibold transition-all">
              <i class="fa-regular fa-copy"></i> คัดลอกข้อความ
            </button>
          `;
        }
        
        const isMyMsg = element.closest('.msg-row').classList.contains('self');
        if(isMyMsg) {
          menuHTML += `
            <button id="cm-delete" class="w-full text-left flex items-center gap-2 px-3 py-2 hover:bg-rose-50 text-rose-600 rounded-lg text-xs font-semibold transition-all">
              <i class="fa-solid fa-trash-can"></i> ยกเลิกการส่งข้อความ
            </button>
          `;
        }
        
        cm.innerHTML = menuHTML;
        
        if(cm.querySelector('#cm-copy')) {
          cm.querySelector('#cm-copy').addEventListener('click', (ev) => {
            ev.stopPropagation();
            navigator.clipboard.writeText(textContent);
            cm.remove();
            Swal.fire({ title: 'สำเร็จ', text: 'คัดลอกข้อความลงคลิปบอร์ดแล้ว', icon: 'success', timer: 1000, showConfirmButton: false });
          });
        }
        
        if(cm.querySelector('#cm-delete')) {
          cm.querySelector('#cm-delete').addEventListener('click', (ev) => {
            ev.stopPropagation();
            cm.remove();
            window.triggerDeleteMessageAction(msgKey, msgFileId);
          });
        }
        
        document.body.appendChild(cm);
      };

      element.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        e.stopPropagation();
        showActionMenu(e.clientX, e.clientY);
      });

      element.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        touchTimer = setTimeout(() => {
          if (window.navigator.vibrate) window.navigator.vibrate(40); 
          showActionMenu(touch.clientX, touch.clientY);
        }, 600);
      }, { passive: true });

      element.addEventListener('touchend', () => { if(touchTimer) clearTimeout(touchTimer); });
      element.addEventListener('touchmove', () => { if(touchTimer) clearTimeout(touchTimer); });
    }

    function renderAllMessagesWithTemps() {
      const body = document.getElementById('chat-body');
      const isAtBottom = body.scrollHeight - body.scrollTop <= body.clientHeight + 100;
      
      body.innerHTML = '';
      let lastRenderedDate = ""; 

      if(lastSnapshotData) {
        Object.keys(lastSnapshotData).forEach(key => {
          const msg = lastSnapshotData[key];
          
          if (msg.timestamp) {
            const msgDateObj = new Date(msg.timestamp);
            const msgDateStr = msgDateObj.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
            
            if (msgDateStr !== lastRenderedDate) {
              const dateDivider = document.createElement('div');
              dateDivider.className = "w-full flex justify-center my-3 select-none";
              dateDivider.innerHTML = `<span class="px-3 py-1 bg-slate-800/40 backdrop-blur-md border border-white/10 text-slate-300 text-[11px] font-medium rounded-full shadow-sm">${msgDateStr}</span>`;
              body.appendChild(dateDivider);
              lastRenderedDate = msgDateStr;
            }
          }

          const isSelf = msg.senderName === currentUser.displayName;
          const row = document.createElement('div');
          row.className = `msg-row flex gap-2 sm:gap-3 max-w-[85%] sm:max-w-[75%] w-fit relative items-end group mb-2 ${isSelf ? 'self flex-row-reverse ml-auto' : 'other mr-auto text-left'}`;
          
          const resolvedAvatar = globalAvatarMap[msg.senderName] || msg.senderAvatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';

          if(!isSelf) {
            const img = document.createElement('img');
            img.className = 'msg-avatar w-8 h-8 rounded-full object-cover shadow-sm self-start mt-1 shrink-0 cursor-pointer hover:scale-105 transition-transform';
            img.src = resolvedAvatar;
            img.onclick = () => window.viewUserProfileImage(resolvedAvatar, msg.senderName);
            row.appendChild(img);
          }

          const wrapper = document.createElement('div');
          wrapper.className = 'msg-content-wrapper flex flex-col overflow-hidden';
          
          if(!isSelf) {
            const nameSpan = document.createElement('span');
            nameSpan.className = 'msg-name text-[11px] text-slate-400 font-medium mb-1 px-1';
            nameSpan.innerText = msg.senderName;
            wrapper.appendChild(nameSpan);
          }

          const bubble = document.createElement('div');
          bubble.className = 'msg-bubble p-2.5 px-3.5 sm:p-3 sm:px-4 rounded-2xl text-sm leading-relaxed flex flex-col gap-2 break-words';

          if(msg.deleted) {
            bubble.innerText = 'ข้อความถูกลบเรียบร้อย';
            bubble.className += ' msg-deleted text-slate-400 italic bg-white/20 border border-dashed text-xs';
          } else {
            const isImageLink = msg.type === 'image' || 
                               (msg.content && (msg.content.includes('drive.google.com/thumbnail') || msg.content.includes('drive.google.com/uc')) && !msg.filename && msg.type !== 'video' && msg.type !== 'audio');
            
            if(isImageLink) {

                <div class="flex items-center gap-1.5 mt-1 w-full justify-center">
                  <a href="https://drive.google.com/file/d/${msg.fileId || ''}/view" target="_blank" class="px-2 py-1 bg-slate-800/80 hover:bg-slate-900 text-[10px] text-white rounded-md font-medium transition-colors flex items-center gap-1 shadow-sm"><i class="fa-regular fa-eye"></i> ดูไฟล์</a>
                  <button onclick="directDownloadFromDrive('${msg.fileId || ''}', '${msg.filename || 'image.png'}')" class="px-2 py-1 bg-green-600 hover:bg-green-700 text-[10px] text-white rounded-md font-medium transition-colors flex items-center gap-1 shadow-sm"><i class="fa-solid fa-download"></i> ดาวน์โหลด</button>
                </div>
              `;
              bubble.style.padding = '0'; bubble.style.background = 'none'; bubble.style.boxShadow = 'none';
              bindMessageActionEvents(bubble, key, msg.fileId, null);
            } else if(msg.type === 'video') {
              bubble.innerHTML = `
                <video src="${msg.content}" controls preload="metadata" class="max-w-[240px] rounded-xl border border-white/20 shadow-md"></video>
                <div class="flex items-center gap-1.5 mt-1 w-full justify-start">
                  <button onclick="directDownloadFromDrive('${msg.fileId || ''}', '${msg.filename || 'video.mp4'}')" class="px-2 py-1 bg-green-600 hover:bg-green-700 text-[10px] text-white rounded-md font-medium transition-colors flex items-center gap-1 shadow-sm"><i class="fa-solid fa-download"></i> ดาวน์โหลด</button>
                </div>
              `;
              bubble.style.padding = '0'; bubble.style.background = 'none'; bubble.style.boxShadow = 'none';
              bindMessageActionEvents(bubble, key, msg.fileId, null);
            } else if(msg.type === 'audio') {
              const durationId = `dur_${key}`;
              bubble.innerHTML = `
                <div class="audio-player-container">
                  <button onclick="this.nextElementSibling.paused ? this.nextElementSibling.play() : this.nextElementSibling.pause()" class="w-8 h-8 rounded-full bg-emerald-500 text-white flex items-center justify-center shadow-sm shrink-0"><i class="fa-solid fa-play text-xs"></i></button>
                  <audio src="${msg.content}" preload="metadata" onplay="this.previousElementSibling.innerHTML='<i class=\"fa-solid fa-pause text-xs\"></i>'" onpause="this.previousElementSibling.innerHTML='<i class=\"fa-solid fa-play text-xs\"></i>'" onloadstart="window.initAudioTracker(this, '${durationId}')"></audio>
                  <div class="flex flex-col flex-1">
                    <span class="text-[10px] text-slate-400 font-bold">ข้อความเสียง</span>
                    <span id="${durationId}" class="text-xs font-semibold text-slate-700">--:--</span>
                  </div>
                </div>
              `;
              bubble.style.padding = '0'; bubble.style.background = 'none'; bubble.style.boxShadow = 'none';
              bindMessageActionEvents(bubble, key, msg.fileId, null);
            } else if(msg.type === 'text') {
              bubble.innerHTML = linkify(msg.content);
              bubble.className += isSelf ? ' bg-[#7CE68E] text-slate-900 rounded-tr-none' : ' bg-white text-slate-800 rounded-tl-none';
              bindMessageActionEvents(bubble, key, msg.fileId, msg.content);
            } else if(msg.type === 'file') {
              bubble.innerHTML = `
                <div class="flex items-center gap-2 font-semibold text-slate-700 text-xs sm:text-sm break-all">
                  <i class="fa-solid fa-file-lines text-lg sm:text-xl text-emerald-500 shrink-0"></i> ${msg.filename || 'ไฟล์แนบ'}
                </div>
                <div class="flex items-center gap-2 mt-1 border-t border-slate-100 pt-1.5 justify-start">
                  <a href="https://drive.google.com/file/d/${msg.fileId || ''}/view" target="_blank" class="px-1.5 py-0.5 sm:px-2 sm:py-1 bg-slate-100 hover:bg-slate-200 text-[10px] text-slate-600 rounded-md font-medium transition-colors flex items-center gap-1"><i class="fa-regular fa-eye"></i> ดูไฟล์</a>
                  <button onclick="directDownloadFromDrive('${msg.fileId || ''}', '${msg.filename || 'file'}')" class="px-1.5 py-0.5 sm:px-2 sm:py-1 bg-green-50 hover:bg-green-100 text-[10px] text-green-600 rounded-md font-medium transition-colors flex items-center gap-1"><i class="fa-solid fa-download"></i> ดาวน์โหลด</button>
                </div>
              `;
              bubble.className += ' bg-white text-slate-800 rounded-2xl shadow-sm';
              bindMessageActionEvents(bubble, key, msg.fileId, null);
            } else if(msg.type === 'sticker') {
              bubble.innerHTML = `<img src="${msg.content}" class="w-20 h-20 sm:w-24 sm:h-24 object-contain select-none">`;
              bubble.style.padding = '0'; bubble.style.background = 'none'; bubble.style.boxShadow = 'none';
              bindMessageActionEvents(bubble, key, msg.fileId, null);
            }
          }

          wrapper.appendChild(bubble);
          
          const metaContainer = document.createElement('div');
          metaContainer.className = `flex flex-col text-[9px] text-slate-400 font-medium px-0.5 mb-1 shrink-0 ${isSelf ? 'items-end' : 'items-start'}`;

          const totalReadsCount = msg.readBy ? Object.keys(msg.readBy).length : 0;

          if (isSelf && !msg.deleted && totalReadsCount > 0) {
            const readStatusSpan = document.createElement('span');
            readStatusSpan.className = 'text-emerald-400 font-bold mb-0.5 select-none cursor-pointer hover:underline';
            readStatusSpan.innerText = `อ่านแล้ว ${totalReadsCount}`;
            readStatusSpan.onclick = () => window.showWhoReadThisMessage(msg.readBy);
            metaContainer.appendChild(readStatusSpan);
          }
          
          const timeSpan = document.createElement('span');
          timeSpan.innerText = new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
          metaContainer.appendChild(timeSpan);
          
          row.appendChild(wrapper);
          row.appendChild(metaContainer);
          body.appendChild(row);
        });
      }
      
      Object.keys(activeTempUploads).forEach(id => {
        const tempMsg = activeTempUploads[id];
        body.appendChild(createTempRow(tempMsg));
      });
      
      if (isAtBottom) {
        body.scrollTop = body.scrollHeight;
      }
    }

    function initPickers() {
      const ep = document.getElementById('emoji-picker');
      emojis.forEach(emo => {
        let span = document.createElement('span'); 
        span.className = 'hover:scale-130 transition-transform duration-100 flex items-center justify-center p-1'; 
        span.innerText = emo;
        span.onclick = (e) => { 
          e.stopPropagation();
          document.getElementById('msg-input').value += emo; 
          ep.classList.add('hidden'); 
        };
        ep.appendChild(span);
      });
      
      document.getElementById('tool-emoji').addEventListener('click', (e) => {
        e.stopPropagation(); 
        ep.classList.toggle('hidden');
        document.getElementById('sticker-picker').classList.add('hidden');
      });

      const sp = document.getElementById('sticker-picker');
      stickers.forEach(stk => {
        let img = document.createElement('img'); 
        img.src = stk; 
        img.className = 'w-14 h-14 sm:w-16 sm:h-16 object-contain hover:scale-115 active:scale-95 transition-all duration-100 p-1 cursor-pointer';
        img.onclick = (e) => { 
          e.stopPropagation();
          sendSticker(stk); 
          sp.classList.add('hidden'); 
        };
        sp.appendChild(img);
      });
      
      document.getElementById('tool-sticker').addEventListener('click', (e) => {
        e.stopPropagation(); 
        sp.classList.toggle('hidden');
        ep.classList.add('hidden');
      });

      document.addEventListener('click', () => { 
        ep.classList.add('hidden'); 
        sp.classList.add('hidden'); 
      });
    }
  </script>
</body>
</html>
