<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ChatRoom - Parakit-Site</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.js"></script>
  
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #311042 100%);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }
    .chat-area {
      background: rgba(15, 23, 42, 0.4);
      background-size: cover;
      background-position: center;
      transition: all 0.4s ease;
    }
    
    /* เปิดให้มี Scrollbar แบบโมเดิร์น สวยงามไม่รกสายตา */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.1);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(16, 185, 129, 0.4);
      border-radius: 10px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(16, 185, 129, 0.7);
    }

    .msg-bubble {
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      transition: all 0.2s ease;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .swal-premium-title { font-family: 'Prompt', sans-serif !important; font-weight: 700 !important; color: #1e293b !important; }
    .swal-premium-html { font-family: 'Prompt', sans-serif !important; }
    .swal-input-box {
      width: 100%; max-width: 340px; padding: 12px 16px; margin: 8px auto; display: block;
      border: 1px solid #cbd5e1; border-radius: 14px; font-size: 14px; font-family: 'Prompt', sans-serif;
      background-color: #f8fafc; transition: all 0.2s ease;
    }
    .swal-input-box:focus { outline: none; border-color: #10b981; background-color: #fff; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15); }
    .swal2-popup { border-radius: 24px !important; padding: 2rem !important; }
    .swal-settings-card {
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    #viewer-hidden-container { display: none; }
    .viewer-title { display: none !important; }
    
    /* Context Menu */
    .custom-cm {
      position: fixed;
      z-index: 1000;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) scale(1) !important;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 24px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.45);
      padding: 12px;
      min-width: 240px;
      animation: cmScale 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes cmScale {
      from { transform: translate(-50%, -50%) scale(0.85); opacity: 0; }
      to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }
    
    .audio-player-container {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 240px;
      max-width: 300px;
    }
    #msg-input { resize: none; max-height: 120px; }
    
    /* Drag & Drop Overlay Zone */
    #drop-zone-overlay {
      display: none;
      background: rgba(16, 185, 129, 0.15);
      backdrop-filter: blur(8px);
      border: 3px dashed #10b981;
    }
    
    /* Checkbox สำหรับโหมดเลือกหลายรายการ */
    .msg-checkbox {
      display: none;
    }
    .multi-select-mode .msg-checkbox {
      display: block;
    }

    /* Modern Video Player Style Overlay */
    .video-premium-container {
      position: relative;
      max-width: 260px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      background: #000;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .video-play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .video-premium-container:hover .video-play-overlay {
      background: rgba(0, 0, 0, 0.1);
    }
    .video-play-btn {
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 18px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .video-premium-container:hover .video-play-btn {
      transform: scale(1.15);
      background: #10b981;
      border-color: #10b981;
    }

    /* สไตล์ Grid กลุ่มรูปภาพแบบแอป LINE */
    .image-group-grid {
      display: grid;
      gap: 4px;
      border-radius: 16px;
      overflow: hidden;
      max-width: 320px;
    }
    .img-grid-item {
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    .img-grid-item:hover {
      transform: scale(1.02);
      filter: brightness(0.95);
    }
    /* ปุ่มดาวน์โหลดแยกภาพเดี่ยวในกลุ่ม Grid */
    .single-img-dl-btn {
      opacity: 0;
      transition: opacity 0.2s ease, background-color 0.2s ease;
    }
    .relative:hover .single-img-dl-btn {
      opacity: 1;
    }

    /* ไฮไลท์สำหรับคำที่ค้นหาเจอ */
    .search-highlight {
      background-color: #fde047;
      color: #0f172a;
      padding: 0 2px;
      border-radius: 4px;
      font-weight: 600;
    }
  </style>
</head>
<body class="h-[100dvh] w-screen flex items-center justify-center p-0 sm:p-4 md:p-6 overflow-hidden">

  <div id="login-screen" class="glass-card w-full max-w-md rounded-3xl p-6 sm:p-8 text-center mx-4 transition-all duration-300 block z-50 select-none">
    <div class="w-16 h-16 sm:w-20 sm:h-20 bg-gradient-to-tr from-emerald-400 to-green-600 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl sm:text-4xl shadow-lg mb-4">
      <i class="fa-solid fa-comments"></i>
    </div>
    <h2 class="text-xl sm:text-2xl font-bold text-slate-800 mb-1">Parakit Connect</h2>
    <p class="text-xs text-slate-400 mb-6">กรอกข้อมูลผู้ใช้งานของคุณเพื่อเข้าสู่ห้องแชทรวม</p>
    
    <div class="space-y-4 text-left">
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5 ml-1">Username</label>
        <div class="relative">
          <input type="text" id="login-username" placeholder="กรอก Username" class="w-full p-3.5 pl-11 rounded-2xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 transition-all">
          <i class="fa-solid fa-user absolute left-4 top-4 text-slate-400 text-sm"></i>
        </div>
      </div>
      
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5 ml-1">Password</label>
        <div class="relative">
          <input type="password" id="login-password" placeholder="กรอกรหัสผ่านของคุณ" class="w-full p-3.5 pl-11 rounded-2xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 transition-all">
          <i class="fa-solid fa-lock absolute left-4 top-4 text-slate-400 text-sm"></i>
        </div>
      </div>
      
      <button id="btn-login" class="w-full py-3.5 sm:py-4 mt-2 bg-gradient-to-r from-green-500 to-emerald-600 text-white font-semibold rounded-2xl shadow-lg shadow-green-500/20 transition-all duration-200 hover:opacity-95">
        <i class="fa-solid fa-arrow-right-to-bracket mr-2"></i> เข้าสู่ระบบแชท
      </button>

      <div class="relative flex py-1 items-center">
        <div class="flex-grow border-t border-slate-200/60"></div>
        <span class="flex-shrink mx-4 text-xs text-slate-400 font-medium">หรือ</span>
        <div class="flex-grow border-t border-slate-200/60"></div>
      </div>

      <button id="btn-open-register" class="w-full py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-2xl transition-all duration-200 text-sm">
        <i class="fa-solid fa-user-plus mr-2"></i> สร้างบัญชีผู้ใช้ใหม่
      </button>
      
      <div class="flex justify-center items-center text-xs pt-1">
        <button id="btn-forgot-pwd" class="text-slate-400 hover:text-green-600 transition-colors"><i class="fa-solid fa-circle-question mr-1"></i>ลืมรหัสผ่าน?</button>
      </div>
    </div>
  </div>

  <div id="chat-interface" class="w-full h-full md:max-w-5xl md:h-[85vh] glass-panel md:rounded-3xl shadow-2xl flex flex-col border-none overflow-hidden transition-all duration-300 relative" style="display: none;">
    
    <div id="drop-zone-overlay" class="absolute inset-0 z-50 flex flex-col items-center justify-center text-green-600 gap-2 font-bold pointer-events-none select-none">
      <i class="fa-solid fa-cloud-arrow-up text-6xl animate-bounce"></i>
      <span class="text-lg">วางไฟล์ลงตรงนี้เพื่อเตรียมส่ง (สูงสุด 20 ไฟล์)</span>
    </div>

    <!-- ส่วนหัวของแชท -->
    <div class="bg-slate-900/95 text-white border-b border-white/10 z-10 shadow-lg shrink-0 flex flex-col select-none">
      <div class="p-3 flex items-center justify-between">
        <div class="flex items-center gap-2 sm:gap-3 overflow-hidden mr-2">
          <div class="relative group cursor-pointer shrink-0" id="avatar-container" title="คลิกเพื่อเปลี่ยนรูปโปรไฟล์ผ่านกูเกิลไดรฟ์">
            <img id="my-avatar-img" class="w-10 h-10 sm:w-12 sm:h-12 rounded-full border-2 border-green-400 object-cover shadow-md hover:scale-105 transition-all" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
            <div class="absolute inset-0 bg-black/40 rounded-full opacity-0 group-hover:opacity-100 flex items-center justify-center transition-all">
              <i class="fa-solid fa-camera text-[10px] text-white"></i>
            </div>
            <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-slate-900 rounded-full"></span>
          </div>
          <div class="overflow-hidden">
            <h3 id="my-display-name" class="font-bold text-sm sm:text-base tracking-wide text-white truncate">Name</h3>
            <p class="text-[10px] sm:text-[11px] text-green-400 flex items-center gap-1"><span class="w-1.5 h-1.5 bg-green-500 rounded-full inline-block animate-ping"></span> ออนไลน์</p>
          </div>
        </div>
        
        <div class="shrink-0 flex items-center gap-1.5 sm:gap-2">
          <button id="btn-toggle-search" title="ค้นหาข้อความ" class="p-2 sm:px-3 sm:py-2 rounded-xl bg-white/5 hover:bg-white/15 text-slate-300 flex items-center justify-center gap-1.5 transition-all text-xs font-semibold border border-white/5 shadow-sm">
            <i class="fa-solid fa-magnifying-glass text-sm"></i>
            <span class="hidden md:inline">ค้นหา</span>
          </button>
          
          <button id="btn-toggle-multi-select" title="เลือกจัดการหลายข้อความ" class="px-2.5 py-2 rounded-xl bg-blue-500/20 hover:bg-blue-500/40 text-blue-300 flex items-center gap-1.5 transition-all text-xs font-semibold border border-blue-500/30 shadow-md">
            <i class="fa-solid fa-list-check"></i>
            <span id="txt-multi-select" class="hidden sm:inline">เลือกจัดการ</span>
          </button>
          <button id="btn-open-settings" title="การตั้งค่าระบบแชท" class="px-3.5 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-white flex items-center justify-center gap-1.5 transition-all text-xs font-semibold border border-white/10 shadow-md">
            <i class="fa-solid fa-gear text-sm"></i>
            <span class="hidden sm:inline">ตั้งค่า</span>
          </button>
        </div>
      </div>

      <!-- แถบค้นหาข้อความและข้ามไปยังวันที่ -->
      <div id="search-filter-bar" class="hidden px-3 pb-3 pt-1 border-t border-white/5 flex flex-col sm:flex-row gap-2 items-center bg-slate-900/40">
        <div class="relative w-full sm:flex-1">
          <input type="text" id="chat-search-input" placeholder="พิมพ์ข้อความที่ต้องการค้นหา..." class="w-full bg-slate-800 text-white text-xs pl-8 pr-8 py-2 rounded-xl focus:outline-none focus:ring-1 focus:ring-green-500 border border-slate-700 font-light">
          <i class="fa-solid fa-magnifying-glass absolute left-2.5 top-2.5 text-slate-500 text-[11px]"></i>
          <button id="btn-clear-search" class="hidden absolute right-2.5 top-2 text-slate-400 hover:text-white text-xs"><i class="fa-solid fa-circle-xmark"></i></button>
        </div>
        <div class="relative w-full sm:w-auto flex items-center gap-1.5 shrink-0">
          <span class="text-[10px] text-slate-400 font-medium shrink-0"><i class="fa-regular fa-calendar-days"></i> ข้ามไปวันที่:</span>
          <input type="date" id="chat-date-picker" class="bg-slate-800 text-white text-xs px-2.5 py-1.5 rounded-xl focus:outline-none focus:ring-1 focus:ring-green-500 border border-slate-700 font-light cursor-pointer scheme-dark">
        </div>
      </div>
    </div>
    
    <!-- พื้นที่แสดงข้อความในแชท -->
    <div class="chat-area flex-1 p-3 sm:p-4 md:p-6 overflow-y-auto custom-scrollbar space-y-4 font-normal flex flex-col" id="chat-body"></div>
    
    <div id="multi-select-bar" class="hidden p-3 bg-slate-900 text-white flex items-center justify-between border-t border-white/10 transition-all z-20 shrink-0 select-none">
      <span id="multi-select-count" class="text-xs font-semibold text-slate-300">เลือกไว้ 0 รายการ</span>
      <div class="flex gap-2">
        <button id="btn-delete-selected" class="px-2.5 py-1.5 bg-rose-500 hover:bg-rose-600 text-white text-xs font-bold rounded-lg flex items-center gap-1 transition-colors">
          <i class="fa-solid fa-trash-can"></i> <span class="hidden sm:inline">ลบรายการที่เลือก</span><span class="sm:hidden">ลบ</span>
        </button>
        <button id="btn-share-selected" class="px-2.5 py-1.5 bg-green-50 text-white text-xs font-bold rounded-lg flex items-center gap-1 hover:bg-green-600 transition-colors">
          <i class="fa-solid fa-share-nodes"></i> <span class="hidden sm:inline">แชร์ไปยังแอปอื่น</span><span class="sm:hidden">แชร์</span>
        </button>
        <button id="btn-cancel-selected" class="px-2.5 py-1.5 bg-slate-700 text-slate-300 text-xs font-bold rounded-lg hover:bg-slate-600 transition-colors">
          ยกเลิก
        </button>
      </div>
    </div>

    <div class="p-3 bg-white border-t border-slate-200/80 flex flex-col gap-2 shadow-inner shrink-0 relative pb-safe select-none">
      <div class="flex items-center justify-between px-1">
        <div class="flex items-center gap-4 text-slate-500 w-full justify-between">
          <div class="flex items-center gap-4">
            <label class="cursor-pointer hover:text-green-500 transition-colors flex items-center gap-1.5 text-sm font-medium" title="แนบไฟล์ได้ทุกประเภท (สูงสุด 20 ไฟล์)">
              <i class="fa-solid fa-circle-plus text-lg sm:text-xl text-green-500"></i>
              <span class="text-xs text-slate-400 hidden sm:inline">ส่งไฟล์ได้ทุกประเภท (สูงสุด 20 ไฟล์พร้อมกัน)</span>
              <input type="file" id="file-input" class="hidden" multiple onchange="handleFileSelection(event)">
            </label>
            <button id="tool-emoji" class="hover:text-amber-500 transition-colors text-lg sm:text-xl" title="ส่งคีย์บอร์ดอิโมจิ"><i class="fa-regular fa-face-smile-wink"></i></button>
            <button id="tool-sticker" class="hover:text-blue-500 transition-colors text-lg sm:text-xl" title="ส่งสติ๊กเกอร์ด่วน"><i class="fa-regular fa-images"></i></button>
          </div>
          <div class="flex items-center gap-2">
            <span id="audio-timer" class="text-xs font-bold text-red-500 hidden animate-pulse">0:00</span>
            <button id="btn-audio-record" class="w-9 h-9 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center transition-all hover:bg-red-50 hover:text-red-500 shadow-sm" title="กดเพื่ออัดเสียงสูงสุด 1 นาที">
              <i class="fa-solid fa-microphone text-sm"></i>
            </button>
          </div>
        </div>
      </div>
      
      <div class="flex items-center gap-2 items-end">
        <textarea id="msg-input" rows="1" placeholder="พิมพ์ข้อความของคุณที่นี่..." class="flex-1 p-2.5 sm:p-3.5 px-4 sm:px-5 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-green-500 font-medium text-slate-800 placeholder-slate-400 shadow-sm transition-all custom-scrollbar select-text"></textarea>
        <button id="btn-send" class="w-10 h-10 sm:w-12 sm:h-12 bg-gradient-to-r from-green-500 to-emerald-500 hover:from-green-600 hover:to-emerald-600 text-white rounded-2xl flex items-center justify-center shadow-lg shadow-green-500/20 transform active:scale-95 transition-all shrink-0 mb-0.5">
          <i class="fa-solid fa-paper-plane text-xs sm:text-sm"></i>
        </button>
      </div>
      
      <div class="emoji-picker glass-card shadow-2xl grid grid-cols-6 gap-2 sm:gap-3 p-3 sm:p-4 hidden absolute bottom-24 left-2 right-2 sm:left-4 sm:right-auto sm:min-w-[300px] sm:max-w-[340px] max-h-[180px] rounded-2xl overflow-y-auto custom-scrollbar z-50 text-xl sm:text-2xl cursor-pointer" id="emoji-picker"></div>
      <div class="sticker-picker glass-card shadow-2xl grid grid-cols-3 gap-2 sm:gap-3 p-3 sm:p-4 hidden absolute bottom-24 left-2 right-2 sm:left-14 sm:right-auto sm:min-w-[300px] sm:max-w-[340px] max-h-[180px] rounded-2xl overflow-y-auto custom-scrollbar z-50" id="sticker-picker"></div>
    </div>
    
    <input type="file" id="avatar-input" class="hidden" accept="image/*" onchange="uploadUserAvatarToDrive(event)">
    <input type="file" id="bg-input" class="hidden" accept="image/*" onchange="uploadUserBgToDrive(event)">
  </div>

  <div id="upload-preview-modal" class="glass-card fixed inset-0 m-auto w-[90%] max-w-md h-fit p-5 rounded-3xl hidden z-[100] flex flex-col gap-4 border border-white/60 shadow-2xl select-none">
    <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2 border-b pb-2"><i class="fa-solid fa-file-shield text-green-500 text-base"></i> ตรวจสอบไฟล์ก่อนส่ง (สูงสุด 20 ไฟล์)</h3>
    <div id="preview-list-container" class="flex flex-col gap-3 max-h-[220px] overflow-y-auto custom-scrollbar"></div>
    <div class="flex gap-2 justify-end mt-1">
      <button id="btn-close-preview" class="px-4 py-2 bg-slate-200 text-slate-700 text-xs font-semibold rounded-xl hover:bg-slate-300 transition-colors">ยกเลิก</button>
      <button id="btn-submit-upload-all" class="px-4 py-2 bg-gradient-to-r from-green-500 to-emerald-600 text-white text-xs font-semibold rounded-xl shadow-md hover:opacity-95 transition-all">ส่งไฟล์ทั้งหมด</button>
    </div>
  </div>

  <div id="viewer-hidden-container" class="select-none">
    <img id="viewer-target-image" src="" alt="Chat Content Image">
  </div>

  <audio id="global-noti-sound" src="https://assets.mixkit.co/active_storage/sfx/2357/2357-84.wav" preload="auto"></audio>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";

    // ฟังก์ชันจัดการดึงรูปออกจากคลิปบอร์ด
    async function handlePasteAction(e) {
      const clipboardData = e.clipboardData || window.clipboardData;
      if (!clipboardData) return;

      const items = clipboardData.items;
      let targetImageFiles = [];

      for (let i = 0; i < items.length; i++) {
        // ตรวจสอบว่ามีข้อมูลประเภทรูปภาพถูกคัดลอกมาหรือไม่
        if (items[i].type.indexOf('image') !== -1) {
          const file = items[i].getAsFile();
          if (file) {
            // ตั้งชื่อไฟล์จำลองอัตโนมัติหากรูปภาพนั้นไม่มีชื่อ (เช่น รูปจากการกด PrintScreen หรือ Copy ภาพดิบ)
            let finalFile = file;
            if (!file.name || file.name === "image.png") {
              const extension = file.type.split('/')[1] || 'png';
              finalFile = new File([file], `clipboard_${Date.now()}.${extension}`, { type: file.type });
            }
            targetImageFiles.push(finalFile);
          }
        }
      }

      // หากเจอป้อนข้อมูลรูปภาพในคลิปบอร์ด ให้ส่งเข้าสตรีมการตรวจสอบและแสดง Modal ยืนยันก่อนส่ง
      if (targetImageFiles.length > 0) {
        e.preventDefault(); // หยุดการเอา Base64 ดิบไปแปะลงเป็น Text ในช่อง Textarea
        processRawFiles(targetImageFiles);
      }
    }

    function checkVideoDuration(file) {
      return new Promise((resolve) => {
        if (!file.type.startsWith('video/')) {
          resolve(true);
          return;
        }
        const video = document.createElement('video');
        video.preload = 'metadata';
        video.src = URL.createObjectURL(file);
        video.onloadedmetadata = function() {
          URL.revokeObjectURL(video.src);
          if (video.duration > 180) { 
            resolve(false);
          } else {
            resolve(true);
          }
        };
        video.onerror = function() {
          resolve(false);
        };
      });
    }

    function getFileIconClass(filename, mimeType) {
      const ext = filename.split('.').pop().toLowerCase();
      if (mimeType.startsWith('image/') || ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp'].includes(ext)) {
        return { icon: 'fa-solid fa-file-image', color: 'text-blue-500' };
      }
      if (mimeType.startsWith('video/') || ['mp4', 'mov', 'avi', 'mkv', 'webm', '3gp'].includes(ext)) {
        return { icon: 'fa-solid fa-file-video', color: 'text-indigo-500' };
      }
      if (mimeType.startsWith('audio/') || ['mp3', 'wav', 'ogg', 'm4a', 'aac', 'flac'].includes(ext)) {
        return { icon: 'fa-solid fa-file-audio', color: 'text-purple-500' };
      }
      if (ext === 'pdf') {
        return { icon: 'fa-solid fa-file-pdf', color: 'text-rose-500' };
      }
      if (['doc', 'docx', 'odt', 'rtf'].includes(ext)) {
        return { icon: 'fa-solid fa-file-word', color: 'text-blue-600' };
      }
      if (['xls', 'xlsx', 'ods', 'csv'].includes(ext)) {
        return { icon: 'fa-solid fa-file-excel', color: 'text-emerald-600' };
      }
      if (['ppt', 'pptx', 'odp'].includes(ext)) {
        return { icon: 'fa-solid fa-file-powerpoint', color: 'text-orange-500' };
      }
      if (['zip', 'rar', '7z', 'tar', 'gz', 'bz2'].includes(ext)) {
        return { icon: 'fa-solid fa-file-zipper', color: 'text-amber-500' };
      }
      if (['txt', 'md', 'html', 'css', 'js', 'json', 'xml'].includes(ext)) {
        return { icon: 'fa-solid fa-file-code', color: 'text-slate-600' };
      }
      return { icon: 'fa-solid fa-file-lines', color: 'text-green-500' };
    }

    async function processRawFiles(files) {
      const totalSelected = files.length;
      if(totalSelected > 20) {
        Swal.fire('ข้อจำกัดระบบ', 'สามารถเลือกแนบไฟล์ได้สูงสุดรอบละ 20 ไฟล์พร้อมกันครับ', 'warning');
        return;
      }
      
      Swal.fire({
        title: 'กำลังตรวจสอบไฟล์...',
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
      });

      let validFiles = [];
      for(let i = 0; i < files.length; i++) {
        if (files[i].type.startsWith('video/')) {
          const isValidDuration = await checkVideoDuration(files[i]);
          if (!isValidDuration) {
            Swal.fire('ไฟล์วิดีโอนานเกินไป', `ไฟล์ ${files[i].name} มีความยาวเกิน 3 นาที ระบบจำกัดความยาวเพื่อประหยัดพื้นที่คลาวด์ครับ`, 'warning');
            return;
          }
        }

        const MAX_FILE_SIZE = 25 * 1024 * 1024; 
        if (files[i].size > MAX_FILE_SIZE) {
           Swal.fire('ไฟล์ขนาดใหญ่เกินไป', `ไฟล์ ${files[i].name} มีขนาดใหญ่กว่า 25MB ระบบคลาวด์รับข้อมูลไม่ไหวครับ`, 'warning');
        } else {
           validFiles.push(files[i]);
        }
      }

      Swal.close();
      if (validFiles.length === 0) return;
      queueFilesToUpload = validFiles;

      const previewListContainer = document.getElementById('preview-list-container');
      previewListContainer.innerHTML = '';

      queueFilesToUpload.forEach((file) => {
        const row = document.createElement('div');
        row.className = 'flex items-center gap-3 p-2.5 bg-slate-50 border rounded-xl';
        
        let previewHTML = '';
        if (file.type.startsWith('image/')) {
          const objectURL = URL.createObjectURL(file);
          previewHTML = `<img src="${objectURL}" class="w-11 h-11 rounded-lg object-cover border shadow-sm">`;
        } else {
          const iconConfig = getFileIconClass(file.name, file.type);
          previewHTML = `<div class="w-11 h-11 bg-white rounded-lg flex items-center justify-center border shadow-sm"><i class="${iconConfig.icon} text-2xl ${iconConfig.color}"></i></div>`;
        }

        row.innerHTML = `
          ${previewHTML}
          <div class="flex-1 overflow-hidden">
            <p class="text-xs font-bold text-slate-700 truncate">${file.name}</p>
            <p class="text-[10px] text-slate-400">${file.type.startsWith('image/') ? 'รูปภาพ (จะถูกบีบอัดอัตโนมัติ)' : file.type.startsWith('video/') ? 'วิดีโอ (จำกัดไม่เกิน 3 นาที)' : (file.size / 1024).toFixed(1) + ' KB'}</p>
          </div>
        `;
        previewListContainer.appendChild(row);
      });

      document.getElementById('upload-preview-modal').classList.remove('hidden');
    }

    async function executeQueueUploads() {

    function compressImageProcess(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            
            const MAX_SIDE = 1200;
            if (width > height) {
              if (width > MAX_SIDE) {
                height *= MAX_SIDE / width;
                width = MAX_SIDE;
              }
            } else {
              if (height > MAX_SIDE) {
                width *= MAX_SIDE / height;
                height = MAX_SIDE;
              }
            }
            
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            
            const compressedBase64 = canvas.toDataURL('image/jpeg', 0.8);
            resolve(compressedBase64);
          };
        };
      });
    }

    async function uploadSingleFileProcess(file, batchGroupId = "") {
      const localTimestamp = Date.now();
      const uploadId = "upload_" + localTimestamp;
      const localObjectURL = URL.createObjectURL(file);
      
      const isImage = file.type.startsWith('image/');
      const isVideo = file.type.startsWith('video/');
      const isAudio = file.type.startsWith('audio/');
      
      let clientType = 'optimistic-file';
      if(isImage) clientType = 'optimistic-image';
      if(isVideo) clientType = 'optimistic-video';

      activeTempUploads[uploadId] = {
        senderName: currentUser.displayName,
        senderAvatar: currentUser.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png',
        type: clientType, content: localObjectURL, filename: file.name, timestamp: localTimestamp
      };
      renderAllMessagesWithTemps(true);

      try {
        let base64Payload = "";
        let finalFilename = file.name;
        
        if (isImage) {
          base64Payload = await compressImageProcess(file);
          if (!finalFilename.toLowerCase().endsWith('.jpg') && !finalFilename.toLowerCase().endsWith('.jpeg')) {
            finalFilename = finalFilename.substring(0, finalFilename.lastIndexOf('.')) + '.jpg';
          }
        } else {
          base64Payload = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.readAsDataURL(file);
          });
        }
        
        let res = await fetch(SCRIPT_URL, { 
          method: 'POST', 
          body: JSON.stringify({ action: 'uploadFile', filename: finalFilename, base64: base64Payload }) 
        });
        let result = await res.json();
        
        if(result.status === 'success') {
          let finalUrl = result.viewUrl || result.url;
          let fileDriveId = result.fileId || '';
          let dbMsgType = 'file';
          
          if(isImage) dbMsgType = 'image';
          if(isVideo) dbMsgType = 'video';
          if(isAudio) dbMsgType = 'audio';

          push(ref(db, 'global_messages'), {
            senderName: currentUser.displayName,
            senderAvatar: currentUser.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png',
            type: dbMsgType, content: finalUrl, filename: finalFilename, fileId: fileDriveId, timestamp: Date.now(), deleted: false,
            batchGroupId: isImage ? batchGroupId : ""
          });
        } else {
          Swal.fire('อัปโหลดล้มเหลว', result.message || 'เกิดข้อผิดพลาดจากเซิร์ฟเวอร์หลังบ้านครับ', 'error');
        }
      } catch(err) {
        console.error('Network Error Upload:', err);
        Swal.fire('การเชื่อมต่อขัดข้อง', 'โปรดตรวจสอบความเสถียรของอินเทอร์เน็ตครับ', 'error');
      }
      
      delete activeTempUploads[uploadId];
      renderAllMessagesWithTemps(true);
    }

    async function fetchFileBlobFromBackend(fileId) {
      let res = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'getFileData', fileId: fileId })
      });
      let result = await res.json();
      if (result.status === 'success' && result.base64) {
        let cleanBase64 = result.base64;
        if (cleanBase64.includes(',')) cleanBase64 = cleanBase64.split(',')[1];
        const byteCharacters = atob(cleanBase64);
        const byteNumbers = new Array(byteCharacters.length);
        for (let i = 0; i < byteCharacters.length; i++) {
          byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        const byteArray = new Uint8Array(byteNumbers);
        return new Blob([byteArray], { type: result.mimeType || 'application/octet-stream' });
      }
      throw new Error("ดาวน์โหลดมีเดียขัดข้อง");
    }

    async function handleShareSelectedItems() {
      const items = Object.values(selectedMessageItems);
      if(items.length === 0) {
        Swal.fire('คำแนะนำ', 'โปรดเลือกข้อความหรือไฟล์ที่ต้องการแชร์อย่างน้อย 1 รายการครับ', 'info');
        return;
      }

      items.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));
      
      Swal.fire({
        title: 'กำลังเตรียมข้อมูลแชร์...',
        html: 'ระบบกำลังดึงไฟล์มีเดียจากคลาวด์เพื่อเตรียมส่งออกไปยังแอปพลิเคชันปลายทางครับ...',
        allowOutsideClick: false,
        didOpen: () => { Swal.showLoading(); }
      });

      let plainTexts = [];
      let shareFilesArray = [];

      try {
        for (let msg of items) {
          if (msg.deleted) continue;
          
          if (msg.type === 'text') {
            plainTexts.push(`[${msg.senderName}]: ${msg.content}`);
          } else if (msg.type === 'sticker') {
            plainTexts.push(`[สติ๊กเกอร์จาก ${msg.senderName}]: ${msg.content}`);
          } else if (['image', 'video', 'audio', 'file'].includes(msg.type)) {
            let typeLabel = "ไฟล์แนบ";
            if(msg.type === 'image') typeLabel = "รูปภาพ";
            if(msg.type === 'video') typeLabel = "วิดีโอ";
            if(msg.type === 'audio') typeLabel = "ข้อความเสียง";
            
            let filename = msg.filename || (msg.type === 'audio' ? 'voice_message.mp3' : msg.type === 'video' ? 'video_message.mp4' : 'file');
            plainTexts.push(`[${typeLabel}จาก ${msg.senderName}]: ${filename}\n🔗 ลิงก์ไฟล์: ${msg.content}`);
            
            if (msg.fileId) {
              try {
                const blobData = await fetchFileBlobFromBackend(msg.fileId);
                const fileObj = new File([blobData], filename, { type: blobData.type });
                shareFilesArray.push(fileObj);
              } catch(mediaErr) {
                console.error("ไม่สามารถดึงไฟล์ลงอาร์เรย์แชร์ได้: ", mediaErr);
              }
            }
          }
        }

        let compiledShareText = plainTexts.join('\n\n');
        Swal.close();

        if (navigator.share) {
          let shareData = {
            title: 'แชร์ข้อมูลจาก Parakit Chat',
            text: compiledShareText
          };
          
          if (shareFilesArray.length > 0 && navigator.canShare && navigator.canShare({ files: shareFilesArray })) {
            shareData.files = shareFilesArray;
          }
          
          await navigator.share(shareData);
        } else {
          throw new Error("ระบบปฏิบัติการนี้ไม่มี Web Share API");
        }
      } catch (shareErr) {
        let plainTextsBackup = [];
        for (let msg of items) {
          if (msg.deleted) continue;
          if (msg.type === 'text') plainTextsBackup.push(`[${msg.senderName}]: ${msg.content}`);
          else if (msg.type === 'sticker') plainTextsBackup.push(`[สติ๊กเกอร์จาก ${msg.senderName}]: ${msg.content}`);
          else plainTextsBackup.push(`[ไฟล์จาก ${msg.senderName}]: ${msg.filename || 'เปิดดูออนไลน์'}\n🔗 ลิงก์: ${msg.content}`);
        }
        navigator.clipboard.writeText(plainTextsBackup.join('\n\n'));
        Swal.fire('คัดลอกสำเร็จ', 'อุปกรณ์ไม่รองรับการแชร์ไฟล์สด ระบบคัดลอกข้อความและลิงก์มีเดียลงคลิปบอร์ดให้แทนแล้ว นำไปวางส่งต่อได้เลยครับ', 'success');
      }
      
      document.getElementById('btn-toggle-multi-select').click();
    }

    function initAudioRecorder() {
      const recordBtn = document.getElementById('btn-audio-record');
      const timerSpan = document.getElementById('audio-timer');
      
      recordBtn.addEventListener('click', async () => {
        if (!isRecording) {
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            try {
              const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
              mediaRecorder = new MediaRecorder(stream);
              audioChunks = [];
              
              mediaRecorder.ondataavailable = (e) => { audioChunks.push(e.data); };
              
              mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                if (audioBlob.size > 100) {
                  await uploadAudioAndSend(audioBlob);
                }
                stream.getTracks().forEach(track => track.stop());
              };
              
              mediaRecorder.start();
              isRecording = true;
              recordBtn.innerHTML = `<i class="fa-solid fa-square text-red-500 animate-pulse"></i>`;
              timerSpan.classList.remove('hidden');
              recordDuration = 0;
              timerSpan.innerText = "0:00";
              
              recordInterval = setInterval(() => {
                recordDuration++;
                let secs = recordDuration % 60;
                let mins = Math.floor(recordDuration / 60);
                timerSpan.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                if (recordDuration >= 60) { stopAudioRecording(); }
              }, 1000);
              
            } catch (err) {
              Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเข้าถึงไมโครโฟนของคุณได้ครับ', 'error');
            }
          }
        } else {
          stopAudioRecording();
        }
      });
    }

    function stopAudioRecording() {
      if (recordInterval) clearInterval(recordInterval);
      if (mediaRecorder && isRecording) { mediaRecorder.stop(); }
      isRecording = false;
      document.getElementById('btn-audio-record').innerHTML = `<i class="fa-solid fa-microphone text-sm"></i>`;
      document.getElementById('audio-timer').classList.add('hidden');
    }

    function linkify(text) {
      if (!text) return "";
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      let html = text.replace(urlRegex, function(url) {
        return `<a href="${url}" target="_blank" class="text-blue-600 font-medium underline break-all hover:text-blue-800">${url}</a>`;
      });
      return html;
    }

    function highlightSearchKeyword(text, keyword) {
      if (!text) return "";
      if (!keyword) return linkify(text);
      
      const escapedKeyword = keyword.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
      const regex = new RegExp(`(${escapedKeyword})`, 'gi');
      
      const parts = text.split(/(https?:\/\/[^\s]+)/g);
      
      const processedParts = parts.map(part => {
        if (part.match(/^https?:\/\//)) {
          return `<a href="${part}" target="_blank" class="text-blue-600 font-medium underline break-all hover:text-blue-800">${part}</a>`;
        }
        return part.replace(regex, '<span class="search-highlight">$1</span>');
      });
      
      return processedParts.join('');
    }

    window.initAudioTracker = function(audioElement, durationId) {
      const formatTime = (timeInSeconds) => {
        if (isNaN(timeInSeconds) || !isFinite(timeInSeconds)) return "0:00";
        const mins = Math.floor(timeInSeconds / 60);
        const secs = Math.floor(timeInSeconds % 60);
        return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      };

      const el = document.getElementById(durationId);

      const updateDuration = () => {
        audioElement.totalVoiceDuration = audioElement.duration || 0;
        if (el) el.innerText = formatTime(audioElement.totalVoiceDuration);
      };

      if (audioElement.readyState >= 1) {
        updateDuration();
      } else {
        audioElement.addEventListener('loadedmetadata', updateDuration);
      }

      audioElement.addEventListener('durationchange', updateDuration);

      audioElement.addEventListener('timeupdate', () => {
        const duration = audioElement.totalVoiceDuration || audioElement.duration || 0;
        const remain = Math.max(0, duration - audioElement.currentTime);
        if (el) el.innerText = formatTime(remain);
      });

      audioElement.addEventListener('ended', () => {
        const duration = audioElement.totalVoiceDuration || audioElement.duration || 0;
        if (el) el.innerText = formatTime(duration);
      });
    };

    window.loadMediaInline = async function(fileId, elementId, type, loadingId) {
      if (!fileId) return;
      try {
        let res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'getFileData', fileId: fileId })
        });
        let result = await res.json();
        if (result.status === 'success' && result.base64) {
          const el = document.getElementById(elementId);
          if (el) {
            let srcData = result.base64;
            if(!srcData.startsWith('data:')) {
              srcData = "data:" + (result.mimeType || (type === 'video' ? 'video/mp4' : 'audio/mp3')) + ";base64," + srcData;
            }
            el.src = srcData;
            if (type === 'audio') {
              const durationId = `dur_${elementId.replace('audio_el_', '')}`;
              window.initAudioTracker(el, durationId);
            } else if (type === 'video' && loadingId) {
              const loader = document.getElementById(loadingId);
              if (loader) loader.remove();
            }
          }
        } else {
          const el = document.getElementById(elementId);
          if (el) {
            el.src = `https://drive.google.com/uc?export=download&id=${fileId}`;
            if (type === 'audio') {
              const durationId = `dur_${elementId.replace('audio_el_', '')}`;
              window.initAudioTracker(el, durationId);
            } else if (type === 'video' && loadingId) {
              const loader = document.getElementById(loadingId);
              if (loader) loader.remove();
            }
          }
        }
      } catch (e) {
        console.error("โหลดข้อมูลมีเดียอินไลน์ขัดข้องครับ:", e);
      }
    };

    function createTempRow(msg) {

      else if(msg.type === 'sticker') inner = `<img src="${msg.content}" class="w-20 h-20 sm:w-24 sm:h-24 object-contain">`;
      else if(msg.type === 'optimistic-image') inner = `

        </div>`;
      else if(msg.type === 'optimistic-video') inner = `<div class="p-3 rounded-2xl bg-white border text-xs flex items-center gap-2 text-slate-500 shadow-sm"><i class="fa-solid fa-spinner animate-spin text-green-500"></i> กำลังอัปโหลดวิดีโอ...</div>`;
      else if(msg.type === 'optimistic-file') inner = `<div class="p-3 rounded-2xl bg-white border text-xs flex items-center gap-2 text-slate-500 shadow-sm"><i class="fa-solid fa-spinner animate-spin text-green-500"></i> กำลังอัปโหลดไฟล์: ${msg.filename}</div>`;
      
      row.innerHTML = inner;
      return row;
    }

    let lastSnapshotData = null;
    let initialLoadComplete = false;

    function listenChatMessages() {
      const chatRef = ref(db, 'global_messages');
      onValue(chatRef, (snapshot) => {
        lastSnapshotData = snapshot.val();
        
        let shouldScroll = false;
        if (initialLoadComplete && lastSnapshotData) {
          const sound = document.getElementById('global-noti-sound');
          sound.play().catch(e => console.log("แจ้งเตือนเสียงถูกบล็อกชั่วคราวครับ: ", e));
          
          const lastKey = Object.keys(lastSnapshotData).pop();
          if(lastSnapshotData[lastKey] && lastSnapshotData[lastKey].senderName === currentUser.displayName) {
            shouldScroll = true;
          }
        } else {
          shouldScroll = true;
        }
        initialLoadComplete = true;

        checkAndMarkAsRead();
        renderAllMessagesWithTemps(shouldScroll);
      });
    }

    function checkAndMarkAsRead() {
      if (!lastSnapshotData || !currentUser) return;
      
      Object.keys(lastSnapshotData).forEach(key => {
        const msg = lastSnapshotData[key];
        const isSelf = msg.senderName === currentUser.displayName;
        const hasRead = msg.readBy && msg.readBy[currentUser.username];
        
        if (!isSelf && !msg.deleted && !hasRead) {
          const readRef = ref(db, `global_messages/${key}/readBy/${currentUser.username}`);
          set(readRef, currentUser.displayName);
        }
      });
    }

      });

      try {
        let res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ action: 'getFileData', fileId: fileId })
        });
        let result = await res.json();
        if (result.status === 'success' && result.base64) {
          let cleanBase64 = result.base64;
          if (cleanBase64.includes(',')) cleanBase64 = cleanBase64.split(',')[1];
          
          const byteCharacters = atob(cleanBase64);
          const byteNumbers = new Array(byteCharacters.length);
          for (let i = 0; i < byteCharacters.length; i++) {
            byteNumbers[i] = byteCharacters.charCodeAt(i);
          }
          const byteArray = new Uint8Array(byteNumbers);
          const blob = new Blob([byteArray], { type: result.mimeType || 'application/octet-stream' });
          const blobUrl = URL.createObjectURL(blob);
          
          const a = document.createElement("a");
          a.href = blobUrl;
          a.download = filename || "downloaded_file";
          document.body.appendChild(a);
          a.click();
          
          document.body.removeChild(a);
          URL.revokeObjectURL(blobUrl);
          Swal.close();
        } else {
          throw new Error('Backend failed');
        }
      } catch (err) {
        window.open(`https://drive.google.com/uc?export=download&id=${fileId}`, '_blank');
        Swal.close();
      }
    };

            });
            let result = await res.json();
            if(result.status === 'success' && result.base64) {
              let base64Data = result.base64;
              if (base64Data.includes(',')) base64Data = base64Data.split(',')[1];
              
              const byteCharacters = atob(base64Data);
              const byteNumbers = new Array(byteCharacters.length);
              for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
              }
              const byteArray = new Uint8Array(byteNumbers);
              const blob = new Blob([byteArray], { type: 'image/jpeg' });
              const blobUrl = URL.createObjectURL(blob);
              
              const a = document.createElement("a");
              a.href = blobUrl;
              a.download = imgMsg.filename || `image_${batchGroupId}_${currentCount}.jpg`;
              document.body.appendChild(a);
              a.click();

              URL.revokeObjectURL(blobUrl);

      } catch(err) {
        console.error(err);
        Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถประมวลผลการโหลดชุดรูปภาพแบบต่อเนื่องได้ครับ', 'error');

    function bindMessageActionEvents(element, msgKey, msgFileId, textContent, isBatchImageGroup = false, batchGroupId = "") {
      let touchTimer = null;
      
      const showActionMenu = () => {
        const existCm = document.getElementById('custom-context-menu');
        if(existCm) existCm.remove();
        
        const cm = document.createElement('div');
        cm.id = 'custom-context-menu';
        cm.className = 'custom-cm flex flex-col gap-2 text-center items-center justify-center select-none';
        
        let menuHTML = `<h4 class="text-xs font-bold text-slate-400 mb-1 border-b pb-1 w-full tracking-wide">จัดการข้อความ</h4>`;
        if (textContent !== null && textContent !== undefined) {
          menuHTML += `
            <button id="cm-copy" class="w-full text-center flex items-center justify-center gap-2 px-3 py-2.5 bg-slate-50 hover:bg-slate-100 text-slate-700 rounded-xl text-xs font-semibold transition-all border border-slate-200/60">
              <i class="fa-regular fa-copy text-sm text-blue-500"></i> คัดลอกข้อความทั้งหมด
            </button>
          `;
        }
        
        const isMyMsg = element.closest('.msg-row').classList.contains('self');
        if(isMyMsg) {
          if(isBatchImageGroup) {
            menuHTML += `
              <button id="cm-delete-batch" class="w-full text-center flex items-center justify-center gap-2 px-3 py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl text-xs font-semibold transition-all border border-rose-200/40">
                <i class="fa-solid fa-trash-can"></i> ยกเลิกส่งรูปแบบกลุ่ม
              </button>
            `;
          } else {
            menuHTML += `
              <button id="cm-delete" class="w-full text-center flex items-center justify-center gap-2 px-3 py-2.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl text-xs font-semibold transition-all border border-rose-200/40">
                <i class="fa-solid fa-trash-can"></i> ยกเลิกการส่งข้อความ
              </button>
            `;
          }
        }

        menuHTML += `
          <button id="cm-close" class="w-full text-center py-2 mt-1 bg-slate-100 text-slate-500 rounded-xl text-xs font-medium hover:bg-slate-200 transition-colors">
            定เมนู
          </button>
        `;
        
        cm.innerHTML = menuHTML;
        
        if(cm.querySelector('#cm-copy')) {
          cm.querySelector('#cm-copy').addEventListener('click', (ev) => {
            ev.stopPropagation();
            navigator.clipboard.writeText(textContent); 
            cm.remove();
            Swal.fire({ title: 'สำเร็จ', text: 'คัดลอกข้อความลงคลิปบอร์ดแล้วครับ', icon: 'success', timer: 1000, showConfirmButton: false });
          });
        }
        
        if(cm.querySelector('#cm-delete')) {
          cm.querySelector('#cm-delete').addEventListener('click', (ev) => {
            ev.stopPropagation();
            cm.remove();
            window.triggerDeleteMessageAction(msgKey, msgFileId);
          });
        }

        if(cm.querySelector('#cm-delete-batch')) {
          cm.querySelector('#cm-delete-batch').addEventListener('click', (ev) => {
            ev.stopPropagation();
            cm.remove();
            window.triggerDeleteImageBatchGroupAction(batchGroupId);
          });
        }

        cm.querySelector('#cm-close').addEventListener('click', (ev) => {
          ev.stopPropagation();
          cm.remove();
        });
        
        document.body.appendChild(cm);
      };

      element.addEventListener('contextmenu', (e) => {
        if(document.getElementById('chat-interface').classList.contains('multi-select-mode')) return;
        if (window.getSelection().toString().trim() !== "") return;

        e.preventDefault();
        e.stopPropagation();
        showActionMenu();
      });

      element.addEventListener('touchstart', (e) => {
        if(document.getElementById('chat-interface').classList.contains('multi-select-mode')) return;
        touchTimer = setTimeout(() => {
          if (window.getSelection().toString().trim() !== "") return;
          if (window.navigator.vibrate) window.navigator.vibrate(40); 
          showActionMenu();
        }, 600);
      }, { passive: true });

      element.addEventListener('touchend', () => { if(touchTimer) clearTimeout(touchTimer); });
      element.addEventListener('touchmove', () => { if(touchTimer) clearTimeout(touchTimer); });
    }

                  </div>
                </div>
                <div class="flex items-center gap-1.5 mt-1 w-full justify-start select-none">
                  <button onclick="directDownloadFromDrive('${msg.fileId || ''}', '${msg.filename || 'video.mp4'}')" class="px-2 py-1 bg-green-600 hover:bg-green-700 text-[10px] text-white rounded-md font-medium transition-colors flex items-center gap-1 shadow-sm"><i class="fa-solid fa-download"></i> ดาวน์โหลดวีดิโอ</button>
                </div>
              `;
              bubble.style.padding = '0'; bubble.style.background = 'none'; bubble.style.boxShadow = 'none';
              bindMessageActionEvents(bubble, key, msg.fileId, null);
              mediaToLoad.push({ fileId: msg.fileId, elementId: videoId, type: 'video', loadingId: `loading_video_${key}` });
            } else if(msg.type === 'audio') {
              const audioId = `audio_el_${key}`;
              const durationId = `dur_${key}`;
              bubble.innerHTML = `
                <div class="audio-player-container select-none">
                  <button onclick="this.nextElementSibling.paused ? this.nextElementSibling.play() : this.nextElementSibling.pause()" class="w-8 h-8 rounded-full bg-emerald-500 text-white flex items-center justify-center shadow-sm shrink-0"><i class="fa-solid fa-play text-xs"></i></button>
                  <audio id="${audioId}" preload="metadata" onplay="this.previousElementSibling.innerHTML='<i class=\"fa-solid fa-pause text-xs\"></i>'" onpause="this.previousElementSibling.innerHTML='<i class=\"fa-solid fa-play text-xs\"></i>'"></audio>
                  <div class="flex flex-col flex-1">
                    <span class="text-[10px] text-slate-400 font-bold">ข้อความเสียง</span>
                    <span id="${durationId}" class="text-xs font-semibold text-slate-700"><i class="fa-solid fa-circle-notch animate-spin text-emerald-500 mr-1"></i>กำลังคำนวณ...</span>
                  </div>
                </div>
                <div class="flex items-center gap-1.5 mt-1 w-full justify-start select-none">
                  <button onclick="directDownloadFromDrive('${msg.fileId || ''}', '${msg.filename || 'audio.mp3'}')" class="px-2 py-0.5 bg-green-600/10 hover:bg-green-600/20 text-[10px] text-green-600 rounded-md font-semibold transition-colors flex items-center gap-1"><i class="fa-solid fa-download"></i> ดาวน์โหลดข้อความเสียง</button>
                </div>
              `;
              bubble.style.padding = '0'; bubble.style.background = 'none'; bubble.style.boxShadow = 'none';
              bindMessageActionEvents(bubble, key, msg.fileId, null);
              mediaToLoad.push({ fileId: msg.fileId, elementId: audioId, type: 'audio', loadingId: null });
            } else if(msg.type === 'text') {
              bubble.innerHTML = highlightSearchKeyword(msg.content, currentSearchKeyword);
              bubble.className += isSelf ? ' bg-[#7CE68E] text-slate-900 rounded-tr-none' : ' bg-white text-slate-800 rounded-tl-none';
              bindMessageActionEvents(bubble, key, msg.fileId, msg.content); 
            } else if(msg.type === 'file') {
              const iconConfig = getFileIconClass(msg.filename || 'file', '');
              bubble.innerHTML = `
                <div class="flex items-center gap-2 font-semibold text-slate-700 text-xs sm:text-sm break-all select-text">
                  <i class="${iconConfig.icon} text-lg sm:text-xl ${iconConfig.color} shrink-0 select-none"></i> ${highlightSearchKeyword(msg.filename, currentSearchKeyword)}
                </div>
                <div class="flex items-center gap-2 mt-1 border-t border-slate-100 pt-1.5 justify-start select-none">
                  <a href="https://drive.google.com/file/d/${msg.fileId || ''}/view" target="_blank" class="px-1.5 py-0.5 sm:px-2 sm:py-1 bg-slate-100 hover:bg-slate-200 text-[10px] text-slate-600 rounded-md font-medium transition-colors flex items-center gap-1"><i class="fa-regular fa-eye"></i> ดูไฟล์</a>
                  <button onclick="directDownloadFromDrive('${msg.fileId || ''}', '${msg.filename || 'file'}')" class="px-1.5 py-0.5 sm:px-2 sm:py-1 bg-green-50 hover:bg-green-100 text-[10px] text-green-600 rounded-md font-medium transition-colors flex items-center gap-1"><i class="fa-solid fa-download"></i> ดาวน์โหลด</button>
                </div>
              `;
              bubble.className += ' bg-white text-slate-800 rounded-2xl shadow-sm';
              bindMessageActionEvents(bubble, key, msg.fileId, null);
            } else if(msg.type === 'sticker') {
              bubble.innerHTML = `<img src="${msg.content}" class="w-20 h-20 sm:w-24 sm:h-24 object-contain select-none">`;
              bubble.style.padding = '0'; bubble.style.background = 'none'; bubble.style.boxShadow = 'none';
              bindMessageActionEvents(bubble, key, msg.fileId, null);
            }
          }

          wrapper.appendChild(bubble);
          
          const metaContainer = document.createElement('div');
          metaContainer.className = `flex flex-col text-[9px] text-slate-400 font-medium px-0.5 mb-1 shrink-0 select-none ${isSelf ? 'items-end' : 'items-start'}`;

          const totalReadsCount = msg.readBy ? Object.keys(msg.readBy).length : 0;

          if (isSelf && !msg.deleted && totalReadsCount > 0) {
            const readStatusSpan = document.createElement('span');
            readStatusSpan.className = 'text-emerald-400 font-bold mb-0.5 select-none cursor-pointer hover:underline';
            readStatusSpan.innerText = `อ่านแล้ว ${totalReadsCount}`;
            readStatusSpan.onclick = () => window.showWhoReadThisMessage(msg.readBy);
            metaContainer.appendChild(readStatusSpan);
          }
          
          const timeSpan = document.createElement('span');
          timeSpan.innerText = new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
          metaContainer.appendChild(timeSpan);
          
          row.appendChild(wrapper);
          row.appendChild(metaContainer);
          body.appendChild(row);
        }
      }
      
      Object.keys(activeTempUploads).forEach(id => {
        const tempMsg = activeTempUploads[id];
        body.appendChild(createTempRow(tempMsg));
      });
      
      if (forceScrollToBottomFlag || isUserAtBottom) {
        body.scrollTop = body.scrollHeight;
      } else {
        body.scrollTop = previousScrollTop;
      }

      mediaToLoad.forEach(item => {
        window.loadMediaInline(item.fileId, item.elementId, item.type, item.loadingId);
      });
    }

    function initPickers() {
      const ep = document.getElementById('emoji-picker');
      emojis.forEach(emo => {
        let span = document.createElement('span'); 
        span.className = 'hover:scale-130 transition-transform duration-100 flex items-center justify-center p-1 select-none'; 
        span.innerText = emo;
        span.onclick = (e) => { 
          e.stopPropagation();
          document.getElementById('msg-input').value += emo; 
          ep.classList.add('hidden'); 
          forceScrollToBottom(); 
        };
        ep.appendChild(span);
      });
      
      document.getElementById('tool-emoji').addEventListener('click', (e) => {
        e.stopPropagation(); 
        ep.classList.toggle('hidden');
        document.getElementById('sticker-picker').classList.add('hidden');
      });

      const sp = document.getElementById('sticker-picker');
      stickers.forEach(stk => {
        let img = document.createElement('img'); 
        img.src = stk; 
        img.className = 'w-14 h-14 sm:w-16 sm:h-16 object-contain hover:scale-115 active:scale-95 transition-all duration-100 p-1 cursor-pointer select-none';
        img.onclick = (e) => { 
          e.stopPropagation();
          sendSticker(stk); 
          sp.classList.add('hidden'); 
        };
        sp.appendChild(img);
      });
      
      document.getElementById('tool-sticker').addEventListener('click', (e) => {
        e.stopPropagation(); 
        sp.classList.toggle('hidden');
        ep.classList.add('hidden');
      });

      document.addEventListener('click', () => { 
        ep.classList.add('hidden'); 
        sp.classList.add('hidden'); 
      });
    }
  </script>
</body>
</html>
