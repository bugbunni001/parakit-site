<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ChatRoom - Parakit-Site</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/viewerjs/1.11.6/viewer.min.js"></script>
  
  <style>
    body {
      font-family: 'Prompt', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #311042 100%);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
    .glass-panel {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    }
    .chat-area {
      background: rgba(15, 23, 42, 0.35);
      transition: all 0.4s ease;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .msg-bubble {
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      transition: all 0.2s ease;
    }
    .swal-premium-title { font-family: 'Prompt', sans-serif !important; font-weight: 700 !important; color: #1e293b !important; }
    .swal-premium-html { font-family: 'Prompt', sans-serif !important; }
    .swal-input-box {
      width: 100%; max-width: 340px; padding: 12px 16px; margin: 8px auto; display: block;
      border: 1px solid #cbd5e1; border-radius: 14px; font-size: 14px; font-family: 'Prompt', sans-serif;
      background-color: #f8fafc; transition: all 0.2s ease;
    }
    .swal-input-box:focus { outline: none; border-color: #10b981; background-color: #fff; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15); }
    .swal2-popup { border-radius: 24px !important; padding: 2rem !important; }
    
    .centered-context-modal {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.95);
      z-index: 2000; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 24px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4); padding: 16px; min-width: 280px; max-width: 90%;
      opacity: 0; pointer-events: none; transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .centered-context-modal.active { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
    .context-backdrop {
      position: fixed; inset: 0; bg: rgba(0,0,0,0.4); backdrop-filter: blur(4px);
      z-index: 1999; opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
    }
    .context-backdrop.active { opacity: 1; pointer-events: auto; }
    
    #msg-input { resize: none; max-height: 120px; }
    .drag-overlay {
      position: absolute; inset: 0; background: rgba(16, 185, 129, 0.15);
      border: 3px dashed #10b981; border-radius: 1.5rem; z-index: 40;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: all 0.2s ease;
    }
    .drag-active .drag-overlay { opacity: 1; pointer-events: auto; }
    .mention-badge { color: #2563eb; font-weight: 600; background: rgba(37, 99, 235, 0.1); padding: 2px 6px; border-radius: 6px; }
    .msg-checkbox { transform: scale(1.2); cursor: pointer; }
    .mention-dropdown {
      position: absolute; bottom: 100%; left: 0; right: 0; background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px); border: 1px solid rgba(0,0,0,0.1); border-radius: 16px;
      max-height: 180px; overflow-y: auto; z-index: 60; box-shadow: 0 -10px 25px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body class="h-[100dvh] w-screen flex items-center justify-center p-0 sm:p-4 md:p-6 overflow-hidden select-none">

  <div id="login-screen" class="glass-card w-full max-w-md rounded-3xl p-6 sm:p-8 text-center mx-4 transition-all duration-300 block z-50">
    <div class="w-16 h-16 sm:w-20 sm:h-20 bg-gradient-to-tr from-emerald-400 to-green-600 rounded-2xl mx-auto flex items-center justify-center text-white text-3xl sm:text-4xl shadow-lg mb-4">
      <i class="fa-solid fa-comments"></i>
    </div>
    <h2 class="text-xl sm:text-2xl font-bold text-slate-800 mb-1">Parakit Connect</h2>
    <p class="text-xs text-slate-400 mb-6">กรอกข้อมูลผู้ใช้งานของคุณเพื่อเข้าสู่ห้องแชทรวม</p>
    
    <div class="space-y-4 text-left">
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5 ml-1">Username</label>
        <div class="relative">
          <input type="text" id="login-username" placeholder="กรอก Username" class="w-full p-3.5 pl-11 rounded-2xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 transition-all">
          <i class="fa-solid fa-user absolute left-4 top-4 text-slate-400 text-sm"></i>
        </div>
      </div>
      
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1.5 ml-1">Password</label>
        <div class="relative">
          <input type="password" id="login-password" placeholder="กรอกรหัสผ่านของคุณ" class="w-full p-3.5 pl-11 rounded-2xl border border-slate-200 bg-slate-50 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 transition-all">
          <i class="fa-solid fa-lock absolute left-4 top-4 text-slate-400 text-sm"></i>
        </div>
      </div>
      
      <button id="btn-login" class="w-full py-3.5 sm:py-4 mt-2 bg-gradient-to-r from-green-500 to-emerald-600 text-white font-semibold rounded-2xl shadow-md transition-all duration-200 hover:opacity-95 shadow-lg shadow-green-500/20">
        <i class="fa-solid fa-arrow-right-to-bracket mr-2"></i> เข้าสู่ระบบแชท
      </button>

      <div class="relative flex py-1 items-center">
        <div class="flex-grow border-t border-slate-200/60"></div>
        <span class="flex-shrink mx-4 text-xs text-slate-400 font-medium">หรือ</span>
        <div class="flex-grow border-t border-slate-200/60"></div>
      </div>

      <button id="btn-open-register" class="w-full py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium rounded-2xl transition-all duration-200 text-sm">
        <i class="fa-solid fa-user-plus mr-2"></i> สร้างบัญชีผู้ใช้ใหม่
      </button>
      
      <div class="flex justify-center items-center text-xs pt-1">
        <button id="btn-forgot-pwd" class="text-slate-400 hover:text-green-600 transition-colors"><i class="fa-solid fa-circle-question mr-1"></i>ลืมรหัสผ่าน?</button>
      </div>
    </div>
  </div>

  <div id="chat-interface" class="w-full h-full md:max-w-5xl md:h-[85vh] glass-panel md:rounded-3xl shadow-2xl flex flex-col border-none overflow-hidden transition-all duration-300 relative" style="display: none;">
    
    <div class="drag-overlay" id="drop-zone-overlay">
      <div class="text-center text-white bg-slate-900/80 p-6 rounded-2xl backdrop-blur-md">
        <i class="fa-solid fa-cloud-arrow-up text-4xl text-green-400 mb-2 animate-bounce"></i>
        <p class="font-bold text-lg">วางไฟล์ที่นี่เพื่อส่งเข้าแชท</p>
        <p class="text-xs text-slate-300">สามารถส่งได้สูงสุด 20 ไฟล์พร้อมกันครับ</p>
      </div>
    </div>

    <div class="p-3 bg-slate-900/95 text-white flex items-center justify-between border-b border-white/10 z-10 shadow-lg shrink-0">
      <div class="flex items-center gap-2 sm:gap-3 overflow-hidden mr-2">
        <div class="relative group cursor-pointer shrink-0" id="avatar-container" title="คลิกเพื่อเปลี่ยนรูปโปรไฟล์">
          <img id="my-avatar-img" class="w-10 h-10 sm:w-12 sm:h-12 rounded-full border-2 border-green-400 object-cover shadow-md hover:scale-105 transition-all" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
          <div class="absolute inset-0 bg-black/40 rounded-full opacity-0 group-hover:opacity-100 flex items-center justify-center transition-all">
            <i class="fa-solid fa-camera text-[10px] text-white"></i>
          </div>
          <span class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-slate-900 rounded-full"></span>
        </div>
        <div class="overflow-hidden">
          <h3 id="my-display-name" class="font-bold text-sm sm:text-base tracking-wide text-white truncate">Name</h3>
          <p class="text-[10px] sm:text-[11px] text-green-400 flex items-center gap-1"><span class="w-1.5 h-1.5 bg-green-500 rounded-full inline-block animate-ping"></span> ออนไลน์</p>
        </div>
      </div>
      
      <div class="shrink-0 flex items-center gap-2">
        <button id="btn-toggle-select-mode" class="px-3 py-2 rounded-xl bg-blue-500/20 hover:bg-blue-500/40 text-blue-300 flex items-center justify-center gap-1.5 transition-all text-xs font-semibold border border-blue-500/30 shadow-md">
          <i class="fa-solid fa-list-check"></i>
          <span id="select-mode-text">เลือกข้อความ</span>
        </button>
        <button id="btn-open-settings" class="px-3.5 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-white flex items-center justify-center gap-1.5 transition-all text-xs font-semibold border border-white/10 shadow-md">
          <i class="fa-solid fa-gear text-sm"></i>
          <span>ตั้งค่า</span>
        </button>
      </div>
    </div>
    
    <div id="multi-select-bar" class="bg-slate-800/95 text-white p-3 px-6 flex items-center justify-between border-b border-white/10 hidden animate-fade-in z-20">
      <span class="text-xs font-medium text-slate-300" id="lbl-select-count">เลือกแล้ว 0 รายการ</span>
      <div class="flex gap-2">
        <button id="btn-multi-share" class="px-3 py-1.5 bg-green-600 hover:bg-green-700 text-white rounded-xl text-xs font-bold flex items-center gap-1 transition-all"><i class="fa-solid fa-share-nodes"></i> แชร์ไปยังแอปอื่น</button>
        <button id="btn-cancel-select" class="px-3 py-1.5 bg-slate-600 hover:bg-slate-700 text-slate-200 rounded-xl text-xs font-medium transition-all">ยกเลิก</button>
      </div>
    </div>
    
    <div class="chat-area flex-1 p-3 sm:p-4 md:p-6 overflow-y-auto no-scrollbar space-y-4 font-normal flex flex-col relative" id="chat-body"></div>
    
    <div id="upload-preview-area" class="p-2 bg-slate-100 border-t border-slate-200 flex gap-3 overflow-x-auto no-scrollbar hidden"></div>

    <div class="p-3 bg-white border-t border-slate-200/80 flex flex-col gap-2 shadow-inner shrink-0 relative pb-safe">
      
      <div id="mention-list-popup" class="mention-dropdown hidden"></div>

      <div class="flex items-center justify-between px-1">
        <div class="flex items-center gap-4 text-slate-500 w-full justify-between">
          <div class="flex items-center gap-4">
            <label class="cursor-pointer hover:text-green-500 transition-colors flex items-center gap-1.5 text-sm font-medium" title="แนบไฟล์หรือรูปภาพ (สูงสุด 20 ไฟล์)">
              <i class="fa-solid fa-circle-plus text-lg sm:text-xl text-green-500"></i>
              <span class="text-xs text-slate-400 hidden sm:inline">ส่งไฟล์/รูปภาพ (สูงสุด 20)</span>
              <input type="file" id="file-input" class="hidden" multiple onchange="handleMultipleFilesSelect(event)">
            </label>
            <button id="tool-emoji" class="hover:text-amber-500 transition-colors text-lg sm:text-xl"><i class="fa-regular fa-face-smile-wink"></i></button>
            <button id="tool-sticker" class="hover:text-blue-500 transition-colors text-lg sm:text-xl"><i class="fa-regular fa-images"></i></button>
            <button id="tool-custom-sticker" class="hover:text-purple-500 transition-colors text-lg sm:text-xl" title="สร้างสติ๊กเกอร์ของตัวเองแบบไดคัท"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
          </div>
          <div class="flex items-center gap-2">
            <span id="audio-timer" class="text-xs font-bold text-red-500 hidden animate-pulse">0:00</span>
            <button id="btn-audio-record" class="w-9 h-9 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center transition-all hover:bg-red-50 hover:text-red-500 shadow-sm" title="กดเพื่ออัดเสียงส่งเข้า Drive">
              <i class="fa-solid fa-microphone text-sm"></i>
            </button>
          </div>
        </div>
      </div>
      
      <div class="flex items-center gap-2 items-end">
        <textarea id="msg-input" rows="1" placeholder="พิมพ์ข้อความ... ใส่ @ เพื่อแท็กเพื่อน (Shift+Enter ขึ้นบรรทัดใหม่)" class="flex-1 p-2.5 sm:p-3.5 px-4 sm:px-5 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:outline-none focus:ring-2 focus:ring-green-500 font-medium text-slate-800 placeholder-slate-400 shadow-sm transition-all no-scrollbar"></textarea>
        <button id="btn-send" class="w-10 h-10 sm:w-12 sm:h-12 bg-gradient-to-r from-green-500 to-emerald-500 hover:from-green-600 hover:to-emerald-600 text-white rounded-2xl flex items-center justify-center shadow-lg shadow-green-500/20 transform active:scale-95 transition-all shrink-0 mb-0.5">
          <i class="fa-solid fa-paper-plane text-xs sm:text-sm"></i>
        </button>
      </div>
      
      <div class="emoji-picker glass-card shadow-2xl grid grid-cols-6 gap-2 sm:gap-3 p-3 sm:p-4 hidden absolute bottom-24 left-2 right-2 sm:left-4 sm:right-auto sm:min-w-[300px] sm:max-w-[340px] max-h-[180px] rounded-2xl overflow-y-auto z-50 text-xl sm:text-2xl select-none cursor-pointer" id="emoji-picker"></div>
      <div class="sticker-picker glass-card shadow-2xl grid grid-cols-4 gap-2 sm:gap-3 p-3 sm:p-4 hidden absolute bottom-24 left-2 right-2 sm:left-14 sm:right-auto sm:min-w-[320px] sm:max-w-[360px] max-h-[220px] rounded-2xl overflow-y-auto z-50 select-none" id="sticker-picker"></div>
    </div>
    
    <input type="file" id="avatar-input" class="hidden" accept="image/*" onchange="uploadUserAvatarToDrive(event)">
    <input type="file" id="bg-input" class="hidden" accept="image/*" onchange="uploadUserBgToDrive(event)">
    <input type="file" id="custom-sticker-raw-input" class="hidden" accept="image/*" onchange="processAndUploadCustomSticker(event)">
  </div>

  <div id="viewer-hidden-container" class="hidden">
    <img id="viewer-target-image" src="" alt="Chat Content Image">
  </div>

  <div class="context-backdrop" id="ctx-backdrop-overlay"></div>
  <div class="centered-context-modal flex flex-col gap-2.5" id="centered-action-modal">
    <h4 class="text-sm font-bold text-slate-800 border-b border-slate-100 pb-2 flex items-center gap-1.5"><i class="fa-solid fa-bars-staggered text-green-500"></i> จัดการข้อความแชท</h4>
    <div class="flex flex-col gap-1" id="centered-modal-buttons"></div>
    <button onclick="closeCenteredActionModal()" class="w-full mt-1 py-2 text-center text-xs font-semibold text-slate-500 hover:bg-slate-100 rounded-xl transition-all">ปิดหน้าต่างควบคุม</button>
  </div>

  <audio id="global-noti-sound" src="https://raw.githubusercontent.com/unique-pu/sound/main/messenger.mp3" preload="auto"></audio>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, update, remove, onDisconnect, set } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBrgdTPcYPn5UO64vsi9KkUVexnIIXV6F4",
      authDomain: "chat-f4677.firebaseapp.com",
      databaseURL: "https://chat-f4677-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "chat-f4677",
      storageBucket: "chat-f4677.firebasestorage.app",
      messagingSenderId: "803920396350",
      appId: "1:803920396350:web:25b6bc0c8d4e51c4d9116f",
      measurementId: "G-1JMSPXQFFL"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyr2jmuvwut3hgjUJ34z8RauglInGk-F3--HA2XQOIgm5Cv5DAmiPjw_hqxWRmSGXDs/exec";
    let currentUser = null;
    let activeTempUploads = {}; 
    let globalAvatarMap = {}; 
    let currentActiveUsers = {}; 
    let globalViewerInstance = null;
    
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let recordInterval = null;
    let recordDuration = 0;

    let isMultiSelectMode = false;
    let selectedMessageKeys = [];
    let pendingUploadFilesQueue = [];

    // รายการสติกเกอร์ครบ 50 อัน ภาพคมชัด แสดงผลได้ทุกลิงก์
    const stickers = [];
    for(let i=1; i<=50; i++) {
      stickers.push(`https://raw.githubusercontent.com/unique-pu/stickers/main/stk_${i}.png`);
    }

    const emojis = ["😀","😂","🥰","😎","🤩","😏","👍","👌","🙏","🎉","🔥","❤️","😭","😱","😡","🤫","💩","✨","👀","💯","🎂","🚀","👏","🥳","🥺","💔","💖","🌟","🍀","🍺","☕️","🍙","🎮","🐱","🐶","🦊","👑","💸","ชิว","เซ็ง","สู้ๆ","งอน"];

    window.addEventListener('DOMContentLoaded', () => {
      initUIEvents();
      initPickers();
      checkSavedLogin();
      initGlobalViewer();
      initAudioRecorder();
      initDragAndDropEvents();
    });

    function unlockAudioContext() {
      const audio = document.getElementById('global-noti-sound');
      audio.play().then(() => {
        audio.pause();
        audio.currentTime = 0;
      }).catch(e => console.log("Audio context unlock retry:", e));
    }

    function initGlobalViewer() {
      const imgTarget = document.getElementById('viewer-target-image');
      globalViewerInstance = new Viewer(imgTarget, {
        inline: false, button: true, navbar: false, title: false,
        toolbar: { zoomIn: 4, zoomOut: 4, oneToOne: 4, reset: 4, rotateLeft: 4, rotateRight: 4, flipHorizontal: 4, flipVertical: 4 },
        tooltip: true, movable: true, zoomable: true, rotatable: true, scalable: true, transition: true, fullscreen: true, keyboard: true
      });
    }

    window.openImageInZoomViewer = function(url) {
      const imgTarget = document.getElementById('viewer-target-image');
      imgTarget.src = url;
      globalViewerInstance.update();
      globalViewerInstance.show();
    };

    async function syncAvatarsFromServer() {
      try {
        let res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'getAllAvatars' }) });
        let result = await res.json();
        if (result.status === 'success') {
          globalAvatarMap = result.avatars;
          if (currentUser && globalAvatarMap[currentUser.displayName]) {
            currentUser.avatar = globalAvatarMap[currentUser.displayName];
            document.getElementById('my-avatar-img').src = currentUser.avatar;
            localStorage.setItem('parakit_chat_user', JSON.stringify(currentUser));
          }
        }
      } catch (e) { console.error("ไม่สามารถซิงค์รูปโปรไฟล์ได้", e); }
    }

    function setupUserPresence() {
      if (!currentUser) return;
      const myPresenceRef = ref(db, `status/${currentUser.username}`);
      set(myPresenceRef, { displayName: currentUser.displayName, username: currentUser.username, lastActive: Date.now() });
      onDisconnect(myPresenceRef).remove();

      onValue(ref(db, 'status'), (snapshot) => {
        currentActiveUsers = snapshot.val() || {};
        syncAvatarsFromServer().then(() => renderAllMessagesWithTemps());
      });
    }

    async function checkSavedLogin() {
      const savedUser = localStorage.getItem('parakit_chat_user');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        document.getElementById('login-screen').style.display = 'none';
        const chatUI = document.getElementById('chat-interface');
        chatUI.style.display = 'flex';
        
        document.getElementById('my-display-name').innerText = currentUser.displayName;
        if(currentUser.avatar) document.getElementById('my-avatar-img').src = currentUser.avatar;
        
        const savedBg = currentUser.bgUrl || localStorage.getItem(`parakit_chat_bg_${currentUser.username}`);
        if (savedBg) {
          const chatBody = document.getElementById('chat-body');
          chatBody.style.backgroundImage = `url('${savedBg}')`;
          chatBody.style.backgroundSize = 'cover';
        }
        
        setupUserPresence();
        await syncAvatarsFromServer();
        listenChatMessages();
      }
    }

    function initUIEvents() {
      document.getElementById('btn-open-register').addEventListener('click', openRegisterModal);
      document.getElementById('btn-login').addEventListener('click', () => {
        unlockAudioContext();
        handleLogin();
      });
      
      document.getElementById('login-username').addEventListener('keypress', (e) => { if(e.key === 'Enter') document.getElementById('login-password').focus(); });
      document.getElementById('login-password').addEventListener('keypress', (e) => { if(e.key === 'Enter') { unlockAudioContext(); handleLogin(); } });

      document.getElementById('btn-forgot-pwd').addEventListener('click', handleForgotPwd);
      document.getElementById('btn-open-settings').addEventListener('click', openSettingsModal);
      document.getElementById('btn-send').addEventListener('click', sendTextMessage);

    // ฟังก์ชันจัดตำแหน่งเปิด Context Menu ไว้กลางจอ (ป้องกันปัญหาตกขอบหน้าจอ)

    // ฟังก์ชันสตรีมดาวน์โหลดไฟล์จาก Drive ตรงลงคอม/มือถือทันที โดยไม่ผ่านหน้าล็อกอินเว็บ
    window.directDownloadFromDrive = function(fileId, filename) {
      if(!fileId) return Swal.fire('ผิดพลาด', 'ไม่พบรหัสไฟล์สำหรับดาวน์โหลดครับ', 'error');
      
      Swal.fire({

    // เปิด-ปิดระบบ Multi-select บันทึกเลือกแชทหลายรายการพร้อมกันแบบไลน์
    function toggleMultiSelectMode() {

      if(isMultiSelectMode) {

    function exitMultiSelectMode() {
      isMultiSelectMode = false;
      document.getElementById('multi-select-bar').classList.add('hidden');
      document.getElementById('select-mode-text').innerText = "เลือกข้อความ";
      selectedMessageKeys = [];
      renderAllMessagesWithTemps();
    }

    function updateSelectCountLabel() {
      document.getElementById('lbl-select-count').innerText = `เลือกแล้ว ${selectedMessageKeys.length} รายการ`;
    }

    window.handleMessageCheckboxChange = function(element, key) {
      if(element.checked) {
        if(!selectedMessageKeys.includes(key)) selectedMessageKeys.push(key);
      } else {
        selectedMessageKeys = selectedMessageKeys.filter(k => k !== key);
      }
      updateSelectCountLabel();

    // ฟังก์ชันระบบแชร์ข้อความเดี่ยว/หรือหลายข้อความรวมกัน ไปยังแอปภายนอก (Line, Messenger, IG, FB)
    async function handleMultiShareAction() {
      if(selectedMessageKeys.length === 0) {
        return Swal.fire('โปรดเลือกข้อความ', 'กรุณาเลือกข้อความหรือรูปภาพที่ต้องการแชร์อย่างน้อย 1 รายการครับ', 'warning');
      }

      let combinedText = "[แชร์ข้อความจาก Parakit Connect]\n";
      selectedMessageKeys.forEach(key => {
        const m = lastSnapshotData[key];
        if(m && !m.deleted) {
          if(m.type === 'text') combinedText += `${m.senderName}: ${m.content}\n`;
          else if(m.type === 'image' || m.type === 'file') combinedText += `${m.senderName} ส่งไฟล์: ${m.content}\n`;
          else if(m.type === 'sticker') combinedText += `${m.senderName} ส่งสติ๊กเกอร์: ${m.content}\n`;
        }
      });

      if (navigator.share) {
        try {
          await navigator.share({ title: 'แชร์ข้อความ Parakit Chat', text: combinedText });
          exitMultiSelectMode();
        } catch (err) { console.log("Native Share Cancelled/Error", err); }
      } else {
        // เมนูทางเลือกสำหรับเว็บบนคอมพิวเตอร์ที่ไม่มี Native share API
        Swal.fire({
          title: 'เลือกแอปพลิเคชันเพื่อแชร์',
          html: `
            <div class="grid grid-cols-2 gap-3 mt-2">
              <a href="https://social-plugins.line.me/lineit/share?text=${encodeURIComponent(combinedText)}" target="_blank" class="flex items-center gap-2 p-3 bg-green-500 text-white rounded-xl font-bold justify-center text-xs"><i class="fa-brands fa-line text-lg"></i> LINE</a>
              <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(window.location.href)}&quote=${encodeURIComponent(combinedText)}" target="_blank" class="flex items-center gap-2 p-3 bg-blue-600 text-white rounded-xl font-bold justify-center text-xs"><i class="fa-brands fa-facebook text-lg"></i> Facebook</a>
              <button id="btn-copy-share-text" class="col-span-2 flex items-center gap-2 p-3 bg-slate-800 text-white rounded-xl font-bold justify-center text-xs"><i class="fa-regular fa-copy text-lg"></i> คัดลอกข้อความทั้งหมดเพื่อไปวางเอง</button>
            </div>
          `,
          showConfirmButton: false,
          showCancelButton: true,
          cancelButtonText: 'ปิดหน้าต่าง',
          customClass: { popup: 'rounded-3xl' },
          didOpen: () => {
            document.getElementById('btn-copy-share-text').onclick = () => {
              navigator.clipboard.writeText(combinedText);
              Swal.fire('คัดลอกแล้ว', 'คัดลอกข้อความชุดนี้ลงคลิปบอร์ดเสร็จแล้วครับ สามารถนำไปวางส่งต่อใน Messenger, IG หรือ TikTok ได้เลยครับ', 'success');
            };
          }
        });
      }
    }

    // ระบบตรวจจับการลากไฟล์มาวางบนห้องแชท (Drag and Drop สูงสุด 20 ไฟล์)
    function initDragAndDropEvents() {
      const chatInterface = document.getElementById('chat-interface');
      
      ['dragenter', 'dragover'].forEach(eventName => {
        chatInterface.addEventListener(eventName, (e) => {
          e.preventDefault(); e.stopPropagation();
          chatInterface.classList.add('drag-active');
        }, false);
      });

      ['dragleave', 'drop'].forEach(eventName => {
        chatInterface.addEventListener(eventName, (e) => {
          e.preventDefault(); e.stopPropagation();
          chatInterface.classList.remove('drag-active');
        }, false);
      });

      chatInterface.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const files = Array.from(dt.files);
        if(files.length > 0) {
          processBatchFiles(files);
        }
      }, false);
    }

    window.handleMultipleFilesSelect = function(e) {
      const files = Array.from(e.target.files);
      processBatchFiles(files);
    };

    // ประมวลผลคิวไฟล์และสร้างอินเทอร์เฟซ Preview ยืนยันพรีวิวก่อนกดส่งเข้า Drive ส่วนกลาง
    function processBatchFiles(files) {
      if(files.length > 20) {
        return Swal.fire('จำกัดจำนวนไฟล์', 'ระบบรองรับการแนบและอัปโหลดไฟล์สูงสุดทีละ 20 ไฟล์ต่อครั้งครับ', 'warning');
      }
      
      pendingUploadFilesQueue = files;
      const previewArea = document.getElementById('upload-preview-area');
      previewArea.innerHTML = '';
      previewArea.classList.remove('hidden');

      pendingUploadFilesQueue.forEach((file, index) => {
        const itemWrapper = document.createElement('div');
        itemWrapper.className = 'relative min-w-[90px] max-w-[100px] bg-white p-2 rounded-xl border border-slate-300 flex flex-col items-center text-center text-xs shrink-0';
        
        if (/\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(file.name)) {
          const url = URL.createObjectURL(file);
          itemWrapper.innerHTML = `
            <img src="${url}" class="w-14 h-14 object-cover rounded-lg mb-1">
            <span class="text-[10px] text-slate-500 truncate w-full">${file.name}</span>
            <button onclick="removeFileFromQueue(${index})" class="absolute -top-1.5 -right-1.5 w-5 h-5 bg-red-500 text-white rounded-full flex items-center justify-center text-[10px] shadow"><i class="fa-solid fa-xmark"></i></button>
          `;
        } else {
          itemWrapper.innerHTML = `
            <div class="w-14 h-14 bg-emerald-50 border border-emerald-200 rounded-lg flex items-center justify-center text-emerald-500 mb-1"><i class="fa-solid fa-file-lines text-xl"></i></div>
            <span class="text-[10px] text-slate-500 truncate w-full">${file.name}</span>
            <button onclick="removeFileFromQueue(${index})" class="absolute -top-1.5 -right-1.5 w-5 h-5 bg-red-500 text-white rounded-full flex items-center justify-center text-[10px] shadow"><i class="fa-solid fa-xmark"></i></button>
          `;
        }
        previewArea.appendChild(itemWrapper);
      });

      if(files.length > 0) {
        Swal.fire({
          title: 'ยืนยันอัปโหลดชุดไฟล์?',
          text: `พบไฟล์ที่เลือกทั้งหมดจำนวน ${files.length} ไฟล์ คุณต้องการอัปโหลดพร้อมกันเลยหรือไม่ครับ`,
          icon: 'question',
          showCancelButton: true,
          confirmButtonColor: '#10b981',
          confirmButtonText: 'ใช่, ส่งไฟล์ทั้งหมด',
          cancelButtonText: 'ยกเลิก'
        }).then((res) => {
          if(res.isConfirmed) {
            executeBatchUploadQueue();
          } else {
            clearUploadQueue();
          }
        });
      }
    }

    window.removeFileFromQueue = function(index) {
      pendingUploadFilesQueue.splice(index, 1);
      processBatchFiles([...pendingUploadFilesQueue]);
    };

    function clearUploadQueue() {
      pendingUploadFilesQueue = [];
      document.getElementById('upload-preview-area').innerHTML = '';
      document.getElementById('upload-preview-area').classList.add('hidden');
    }

    // วนลูปอัปโหลดคิวไฟล์ทั้งหมดแบบ Async อัตโนมัติสูงสุด 20 ไฟล์เรียงลำดับ
    async function executeBatchUploadQueue() {
      const filesToUpload = [...pendingUploadFilesQueue];
      clearUploadQueue();

      for (let i = 0; i < filesToUpload.length; i++) {
        const file = filesToUpload[i];
        const localTimestamp = Date.now();
        const uploadId = "upload_batch_" + localTimestamp + "_" + i;
        const isImage = /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(file.name);
        const isVideo = /\.(mp4|mov|avi|mkv|webm)$/i.test(file.name);

        activeTempUploads[uploadId] = {
          senderName: currentUser.displayName,
          senderAvatar: currentUser.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png',
          type: isImage ? 'optimistic-image' : (isVideo ? 'optimistic-video' : 'optimistic-file'),
          content: isImage ? URL.createObjectURL(file) : '',
          filename: file.name,
          timestamp: localTimestamp
        };
        renderAllMessagesWithTemps();

        await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onloadend = async () => {
            try {
              let res = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'uploadFile', filename: file.name, base64: reader.result })
              });
              let result = await res.json();
              if (result.status === 'success') {
                let finalUrl = result.viewUrl || result.url;
                push(ref(db, 'global_messages'), {
                  senderName: currentUser.displayName,
                  senderAvatar: currentUser.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png',
                  type: isImage ? 'image' : (isVideo ? 'video' : 'file'),
                  content: finalUrl,
                  filename: file.name,
                  fileId: result.fileId || '',
                  timestamp: Date.now(),
                  deleted: false
                });
              }
            } catch (err) { console.error("Batch upload cell index processing broken: ", err); }
            delete activeTempUploads[uploadId];
            renderAllMessagesWithTemps();
            resolve();
          };
          reader.readAsDataURL(file);
        });
      }
    }

    // ฟังก์ชันระบบสร้างสติ๊กเกอร์ใช้เอง ดีไซน์แบบไดร์คัทขอบมนจากภาพในมือถือ/คอมพิวเตอร์
    window.processAndUploadCustomSticker = function(e) {
      const file = e.target.files[0];
      if(!file) return;

      Swal.fire({
        title: 'กำลังทำการไดคัทสติ๊กเกอร์ของคุณ...',
        html: 'ระบบกำลังตัดสัดส่วนวงกลมขอบมนนุ่มนวลแบบซอฟต์ UI ให้คุณครับ',
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
      });

      const reader = new FileReader();
      reader.onload = function(event) {
        const img = new Image();
        img.onload = async function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const size = Math.min(img.width, img.height);
          canvas.width = size;
          canvas.height = size;

          // สร้างรูปทรงวงกลมไดคัทนุ่มนวล
          ctx.beginPath();
          ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
          ctx.clip();
          ctx.drawImage(img, (img.width - size) / 2, (img.height - size) / 2, size, size, 0, 0, size, size);

          const croppedBase64 = canvas.toDataURL('image/png');

          try {
            let res = await fetch(SCRIPT_URL, {
              method: 'POST',
              body: JSON.stringify({ action: 'uploadFile', filename: `custom_sticker_${Date.now()}.png`, base64: croppedBase64 })
            });
            let result = await res.json();
            if(result.status === 'success') {
              let directStickerUrl = result.viewUrl || result.url;
              sendSticker(directStickerUrl);
              Swal.fire({ title: 'สำเร็จ!', text: 'ส่งสติ๊กเกอร์ไดคัทส่วนตัวสำเร็จแล้วครับ', icon: 'success', timer: 1200, showConfirmButton: false });
            } else { Swal.fire('ล้มเหลว', 'เซิร์ฟเวอร์ปฏิเสธการเซฟสติกเกอร์ครับ', 'error'); }
          } catch(err) { Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อคลาวด์ได้ครับ', 'error'); }
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    };

    // ฟังก์ชันสำหรับระบบ @Tag สมาชิกภายในแชท ดึงค่าตามชื่อผู้ใช้ออนไลน์จริง
    function handleMentionSearch(textarea) {
      const text = textarea.value;
      const caretPos = textarea.selectionStart;
      const textBeforeCaret = text.substring(0, caretPos);
      const mentionIndex = textBeforeCaret.lastIndexOf('@');
      const popup = document.getElementById('mention-list-popup');

      if (mentionIndex !== -1 && mentionIndex >= textBeforeCaret.length - 20) {
        const query = textBeforeCaret.substring(mentionIndex + 1).toLowerCase();
        const activeUsersList = Object.values(currentActiveUsers);
        
        const filtered = activeUsersList.filter(u => u.displayName.toLowerCase().includes(query));
        
        if(filtered.length > 0) {
          popup.innerHTML = filtered.map(u => `
            <div onclick="insertMentionTag('${u.displayName}', ${mentionIndex})" class="p-2.5 px-4 hover:bg-slate-100 font-semibold text-xs text-slate-700 cursor-pointer flex items-center gap-2 border-b border-slate-100 last:border-none">
              <span class="w-2 h-2 bg-green-500 rounded-full"></span> @${u.displayName} (${u.username})
            </div>
          `).join('');
          popup.classList.remove('hidden');
        } else { popup.classList.add('hidden'); }
      } else { popup.classList.add('hidden'); }
    }

    window.insertMentionTag = function(displayName, mentionIndex) {
      const textarea = document.getElementById('msg-input');
      const text = textarea.value;
      const caretPos = textarea.selectionStart;
      
      const textBeforeMention = text.substring(0, mentionIndex);
      const textAfterCaret = text.substring(caretPos);
      
      textarea.value = textBeforeMention + `@${displayName} ` + textAfterCaret;
      document.getElementById('mention-list-popup').classList.add('hidden');
      textarea.focus();
    };

    // ตัวนับเวลาถอยหลังการทำงานไฟล์มีเดีย (รองรับทั้งวิดีโอและเสียงในระบบหน้าแชท)
    window.initAudioTracker = function(audioElement, durationId) {
      const updateDisplay = () => {
        const total = audioElement.duration || 0;
        const current = audioElement.currentTime || 0;
        const remain = Math.max(0, total - current);
        const mins = Math.floor(remain / 60);
        const secs = Math.floor(remain % 60);
        document.getElementById(durationId).innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
      };
      audioElement.addEventListener('loadedmetadata', updateDisplay);
      audioElement.addEventListener('timeupdate', updateDisplay);
      audioElement.addEventListener('ended', () => {
        audioElement.currentTime = 0;
        updateDisplay();
      });
    };

    // ฟังก์ชันเปิดการทำงานไมโครโฟนบันทึกเสียงยาวสูงสุด 1 นาที บันทึกเข้าคลาวด์ไดร์ฟและส่งลิงก์เล่นสด
    function initAudioRecorder() {
      const recordBtn = document.getElementById('btn-audio-record');
      const timerSpan = document.getElementById('audio-timer');
      
      recordBtn.addEventListener('click', async () => {
        if (!isRecording) {
          if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
            try {
              const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
              mediaRecorder = new MediaRecorder(stream);
              audioChunks = [];
              
              mediaRecorder.ondataavailable = (e) => { audioChunks.push(e.data); };
              
              mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                if (audioBlob.size > 100) {
                  await uploadAudioAndSend(audioBlob);
                }
                stream.getTracks().forEach(track => track.stop());
              };
              
              mediaRecorder.start();
              isRecording = true;
              recordBtn.innerHTML = `<i class="fa-solid fa-square text-red-500 animate-pulse"></i>`;
              timerSpan.classList.remove('hidden');
              recordDuration = 0;
              timerSpan.innerText = "0:00";
              
              recordInterval = setInterval(() => {
                recordDuration++;
                let mins = Math.floor(recordDuration / 60);
                let secs = recordDuration % 60;
                timerSpan.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                
                if (recordDuration >= 60) { stopAudioRecording(); }
              }, 1000);
              
            } catch (err) { Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเข้าถึงไมโครโฟนได้ครับ', 'error'); }
          }
        } else { stopAudioRecording(); }
      });
    }

    function stopAudioRecording() {
      if (recordInterval) clearInterval(recordInterval);
      if (mediaRecorder && isRecording) { mediaRecorder.stop(); }
      isRecording = false;
      document.getElementById('btn-audio-record').innerHTML = `<i class="fa-solid fa-microphone text-sm"></i>`;
      document.getElementById('audio-timer').classList.add('hidden');
    }

    async function uploadAudioAndSend(blob) {
      const localTimestamp = Date.now();
      const uploadId = "upload_audio_" + localTimestamp;
      
      activeTempUploads[uploadId] = {
        senderName: currentUser.displayName,
        senderAvatar: currentUser.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png',
        type: 'optimistic-file',
        filename: 'ข้อความเสียงบันทึก.mp3',
        timestamp: localTimestamp
      };
      renderAllMessagesWithTemps();
      
      const reader = new FileReader();
      reader.onloadend = async () => {
        try {
          let res = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'uploadFile', filename: `audio_${currentUser.username}_${localTimestamp}.mp3`, base64: reader.result })
          });
          let result = await res.json();
          if (result.status === 'success') {
            let finalUrl = result.viewUrl || result.url;
            push(ref(db, 'global_messages'), {
              senderName: currentUser.displayName,
              senderAvatar: currentUser.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png',
              type: 'audio',
              content: finalUrl,
              fileId: result.fileId,
              timestamp: Date.now(),
              deleted: false
            });
          }
        } catch (e) { console.error(e); }
        delete activeTempUploads[uploadId];
        renderAllMessagesWithTemps();
      };
      reader.readAsDataURL(blob);
    }

    function linkify(text) {
      if (!text) return "";
      const urlRegex = /(https?:\/\/[^\s]+)/g;
      let html = text.replace(urlRegex, function(url) {
        return `<a href="${url}" target="_blank" class="text-blue-600 font-medium underline break-all hover:text-blue-800">${url}</a>`;
      });
      
      // แปลงแท็กสมาขิก @Name ให้เป็น Badge ไฮไลท์สีสันโดดเด่นสะดุดตา
      const activeUsersList = Object.values(currentActiveUsers).map(u => u.displayName);
      activeUsersList.forEach(name => {
        const regexMention = new RegExp(`@${name}\\b`, 'g');
        html = html.replace(regexMention, `<span class="mention-badge">@${name}</span>`);
      });

      return html.replace(/\n/g, '<br>');
    }

    let lastSnapshotData = null;
    let initialLoadComplete = false;

    function listenChatMessages() {
      const chatRef = ref(db, 'global_messages');
      onValue(chatRef, (snapshot) => {
        lastSnapshotData = snapshot.val();
        
        if (initialLoadComplete && lastSnapshotData) {
          const sound = document.getElementById('global-noti-sound');
          sound.play().catch(e => console.log("แจ้งเตือนถูกบล็อก: ", e));
        }
        initialLoadComplete = true;

        checkAndMarkAsRead();
        renderAllMessagesWithTemps();
      });
    }

    function checkAndMarkAsRead() {
      if (!lastSnapshotData || !currentUser) return;
      Object.keys(lastSnapshotData).forEach(key => {
        const msg = lastSnapshotData[key];
        const isSelf = msg.senderName === currentUser.displayName;
        const hasRead = msg.readBy && msg.readBy[currentUser.username];
        if (!isSelf && !msg.deleted && !hasRead) {
          set(ref(db, `global_messages/${key}/readBy/${currentUser.username}`), currentUser.displayName);
        }
      });
    }

    // เมนูแก้ไขเปลี่ยนแปลงสิทธิ์การแสดงข้อความแชทเดี่ยว
    window.triggerDeleteMessageAction = function(key, fileId) {
      Swal.fire({
        title: 'ยกเลิกการส่งข้อความนี้?',
        text: "คุณต้องการลบข้อความนี้ออกจากระบบ พร้อมเคลียร์ข้อมูลไฟล์ถาวรหรือไม่ครับ",
        icon: 'warning', showCancelButton: true, confirmButtonColor: '#ef4444', confirmButtonText: 'ยืนยันลบ', cancelButtonText: 'ยกเลิก'
      }).then((res) => {
        if(res.isConfirmed) { 
          update(ref(db, `global_messages/${key}`), { deleted: true }); 
          if(fileId) {
            fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'deleteFile', fileId: fileId }) }).then(r => r.json()).catch(e => console.error(e));
          }
        }
      });
    };

    window.triggerCenteredMenuOptions = function(msgKey, msgFileId, textContent, isMyMsg) {
      let buttonsHTML = '';
      if(textContent) {
        buttonsHTML += `
          <button onclick="navigator.clipboard.writeText('${textContent.replace(/'/g, "\\'")}'); closeCenteredActionModal(); Swal.fire('สำเร็จ','คัดลอกลงคลิปบอร์ดแล้วครับ','success');" class="w-full text-left flex items-center gap-2 px-4 py-3 hover:bg-slate-100 text-slate-700 rounded-xl text-xs font-semibold transition-all">
            <i class="fa-regular fa-copy text-green-500"></i> คัดลอกข้อความ
          </button>
        `;
      }
      if(isMyMsg) {
        buttonsHTML += `
          <button onclick="closeCenteredActionModal(); window.triggerDeleteMessageAction('${msgKey}', '${msgFileId || ''}');" class="w-full text-left flex items-center gap-2 px-4 py-3 hover:bg-rose-50 text-rose-600 rounded-xl text-xs font-semibold transition-all">
            <i class="fa-solid fa-trash-can text-red-500"></i> ยกเลิกการส่งข้อความนี้ (ลบแชท)
          </button>
        `;
      }
      openCenteredActionModal(buttonsHTML);

    // ฟังก์ชันหลักในการเรนเดอร์ข้อมูลหน้าแชททั้งหมด
    function renderAllMessagesWithTemps() {
      const body = document.getElementById('chat-body');
      const isAtBottom = body.scrollHeight - body.scrollTop <= body.clientHeight + 120;
      
      body.innerHTML = '';
      let lastRenderedDate = ""; 

      if(lastSnapshotData) {
        Object.keys(lastSnapshotData).forEach(key => {
          const msg = lastSnapshotData[key];
          
          if (msg.timestamp) {
            const msgDateObj = new Date(msg.timestamp);
            const msgDateStr = msgDateObj.toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
            if (msgDateStr !== lastRenderedDate) {
              const dateDivider = document.createElement('div');
              dateDivider.className = "w-full flex justify-center my-3 select-none";
              dateDivider.innerHTML = `<span class="px-3 py-1 bg-slate-800/40 backdrop-blur-md border border-white/10 text-slate-300 text-[11px] font-medium rounded-full shadow-sm">${msgDateStr}</span>`;
              body.appendChild(dateDivider);
              lastRenderedDate = msgDateStr;
            }
          }

          const isSelf = msg.senderName === currentUser.displayName;
          const row = document.createElement('div');
          row.className = `msg-row flex gap-2 sm:gap-3 max-w-[85%] sm:max-w-[75%] w-fit relative items-end group mb-2 ${isSelf ? 'self flex-row-reverse ml-auto' : 'other mr-auto text-left'}`;
          
          // ติ๊กเลือก Checkbox ด้านหน้าสไตล์แอป Line ยอดนิยม
          if(isMultiSelectMode && !msg.deleted) {
            const chk = document.createElement('input');
            chk.type = 'checkbox';
            chk.className = 'msg-checkbox mx-2 self-center shrink-0';
            chk.checked = selectedMessageKeys.includes(key);
            chk.onchange = () => window.handleMessageCheckboxChange(chk, key);
            row.appendChild(chk);
          }

          const resolvedAvatar = globalAvatarMap[msg.senderName] || msg.senderAvatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';

          if(!isSelf) {
            const img = document.createElement('img');
            img.className = 'msg-avatar w-8 h-8 rounded-full object-cover shadow-sm self-start mt-1 shrink-0 cursor-pointer hover:scale-105 transition-transform';
            img.src = resolvedAvatar;
            img.onclick = () => window.viewUserProfileImage(resolvedAvatar, msg.senderName);
            row.appendChild(img);
          }

          const wrapper = document.createElement('div');
          wrapper.className = 'msg-content-wrapper flex flex-col overflow-hidden';
          
          if(!isSelf) {
            const nameSpan = document.createElement('span');
            nameSpan.className = 'msg-name text-[11px] text-slate-400 font-bold mb-1 px-1 cursor-pointer hover:underline';
            nameSpan.innerText = msg.senderName;
            // คลิกที่ชื่อเพื่อดำเนินการ แท็กหาบุคคลอื่น (@Mention) อัตโนมัติ
            nameSpan.onclick = () => {
              const tx = document.getElementById('msg-input');
              tx.value += `@${msg.senderName} `;
              tx.focus();
            };
            wrapper.appendChild(nameSpan);
          }

          const bubble = document.createElement('div');
          bubble.className = 'msg-bubble p-2.5 px-3.5 sm:p-3 sm:px-4 rounded-2xl text-sm leading-relaxed flex flex-col gap-2 break-words cursor-pointer';

          if(msg.deleted) {
            bubble.innerText = 'ข้อความถูกยกเลิกการส่ง';
            bubble.className += ' msg-deleted text-slate-400 italic bg-white/10 border border-dashed text-xs';
          } else {
            // ดึงไฟล์ภาพมาแสดงผลขนาดออริจินัล 100% ความคมชัดสูงสุด
            const isImageLink = msg.type === 'image';
            
            if(isImageLink) {
              bubble.innerHTML = `
                <img src="${msg.content}" class="max-w-[180px] sm:max-w-[240px] rounded-xl object-contain cursor-pointer border border-white/20 shadow-md transform hover:scale-[1.01] transition-all select-none" referrerpolicy="no-referrer" onclick="window.openImageInZoomViewer('${msg.content}')">
                <div class="flex items-center gap-1.5 mt-1.5 w-full justify-center">
                  <a href="https://drive.google.com/file/d/${msg.fileId}/view" target="_blank" class="px-2 py-1 bg-slate-800/80 hover:bg-slate-900 text-[10px] text-white rounded-md font-medium transition-colors flex items-center gap-1"><i class="fa-regular fa-eye"></i> ดูไฟล์บน Drive</a>
                  <button onclick="window.directDownloadFromDrive('${msg.fileId}', '${msg.filename || 'image.png'}')" class="px-2 py-1 bg-green-600 hover:bg-green-700 text-[10px] text-white rounded-md font-bold transition-colors flex items-center gap-1"><i class="fa-solid fa-download"></i> ดาวน์โหลดลงเครื่อง</button>
                </div>
              `;
              bubble.style.padding = '0'; bubble.style.background = 'none'; bubble.style.boxShadow = 'none';
            } else if(msg.type === 'video') {
              const videoDurationId = `vid_dur_${key}`;
              bubble.innerHTML = `
                <video src="${msg.content}" controls preload="metadata" onloadstart="window.initAudioTracker(this, '${videoDurationId}')" class="max-w-[240px] rounded-xl border border-white/20 shadow-md"></video>
                <div class="flex items-center justify-between gap-1.5 mt-1 px-1">
                  <span id="${videoDurationId}" class="text-[10px] text-white bg-slate-900/60 px-1.5 py-0.5 rounded-md font-bold">0:00</span>
                  <button onclick="window.directDownloadFromDrive('${msg.fileId}', '${msg.filename || 'video.mp4'}')" class="px-2 py-1 bg-green-600 hover:bg-green-700 text-[10px] text-white rounded-md font-bold flex items-center gap-1"><i class="fa-solid fa-download"></i> ดาวน์โหลด</button>
                </div>
              `;
              bubble.style.padding = '0'; bubble.style.background = 'none'; bubble.style.boxShadow = 'none';
            } else if(msg.type === 'audio') {
              const durationId = `dur_${key}`;
              bubble.innerHTML = `
                <div class="audio-player-container">
                  <button onclick="this.nextElementSibling.paused ? this.nextElementSibling.play() : this.nextElementSibling.pause()" class="w-8 h-8 rounded-full bg-emerald-500 text-white flex items-center justify-center shadow-sm shrink-0"><i class="fa-solid fa-play text-xs"></i></button>
                  <audio src="${msg.content}" preload="metadata" onplay="this.previousElementSibling.innerHTML='<i class=\"fa-solid fa-pause text-xs\"></i>'" onpause="this.previousElementSibling.innerHTML='<i class=\"fa-solid fa-play text-xs\"></i>'" onloadstart="window.initAudioTracker(this, '${durationId}')"></audio>
                  <div class="flex flex-col flex-1">
                    <span class="text-[10px] text-slate-500 font-bold">ข้อความเสียง</span>
                    <span id="${durationId}" class="text-xs font-semibold text-slate-800">0:00</span>
                  </div>
                  <button onclick="window.directDownloadFromDrive('${msg.fileId}', 'audio.mp3')" class="text-slate-400 hover:text-green-500 px-1" title="เซฟลงเครื่อง"><i class="fa-solid fa-download text-xs"></i></button>
                </div>
              `;
              bubble.style.padding = '0'; bubble.style.background = 'none'; bubble.style.boxShadow = 'none';
            } else if(msg.type === 'text') {
              bubble.innerHTML = linkify(msg.content);
              bubble.className += isSelf ? ' bg-[#7CE68E] text-slate-900 rounded-tr-none' : ' bg-white text-slate-800 rounded-tl-none';
            } else if(msg.type === 'file') {
              bubble.innerHTML = `
                <div class="flex items-center gap-2 font-semibold text-slate-700 text-xs sm:text-sm break-all">
                  <i class="fa-solid fa-file-lines text-lg sm:text-xl text-emerald-500 shrink-0"></i> ${msg.filename || 'ไฟล์แนบ'}
                </div>
                <div class="flex items-center gap-2 mt-1 border-t border-slate-100 pt-1.5 justify-start">
                  <a href="https://drive.google.com/file/d/${msg.fileId}/view" target="_blank" class="px-1.5 py-0.5 bg-slate-100 hover:bg-slate-200 text-[10px] text-slate-600 rounded-md font-medium"><i class="fa-regular fa-eye"></i> ดูบนไดร์ฟ</a>
                  <button onclick="window.directDownloadFromDrive('${msg.fileId}', '${msg.filename}')" class="px-1.5 py-0.5 bg-green-50 hover:bg-green-100 text-[10px] text-green-600 rounded-md font-bold"><i class="fa-solid fa-download"></i> ดาวน์โหลดลงเครื่อง</button>
                </div>
              `;
              bubble.className += ' bg-white text-slate-800 rounded-2xl shadow-sm';
            } else if(msg.type === 'sticker') {
              bubble.innerHTML = `<img src="${msg.content}" class="w-20 h-20 sm:w-24 sm:h-24 object-contain select-none">`;
              bubble.style.padding = '0'; bubble.style.background = 'none'; bubble.style.boxShadow = 'none';
            }

            // ผูกฟังก์ชันเรียกเปิดหน้าต่างจัดการแชทกลางจอ (ทั้งคลิกขวา และกดค้างบนจอมือถือ)
            bubble.onclick = () => {
              if(!isMultiSelectMode) {
                window.triggerCenteredMenuOptions(key, msg.fileId || null, msg.type === 'text' ? msg.content : null, isSelf);
              }
            };
          }

          wrapper.appendChild(bubble);
          
          const metaContainer = document.createElement('div');
          metaContainer.className = `flex flex-col text-[9px] text-slate-400 font-medium px-0.5 mb-1 shrink-0 ${isSelf ? 'items-end' : 'items-start'}`;

          const totalReadsCount = msg.readBy ? Object.keys(msg.readBy).length : 0;
          if (isSelf && !msg.deleted && totalReadsCount > 0) {
            const readStatusSpan = document.createElement('span');
            readStatusSpan.className = 'text-emerald-400 font-bold mb-0.5 select-none cursor-pointer hover:underline';
            readStatusSpan.innerText = `อ่านแล้ว ${totalReadsCount}`;
            readStatusSpan.onclick = (e) => { e.stopPropagation(); window.showWhoReadThisMessage(msg.readBy); };
            metaContainer.appendChild(readStatusSpan);
          }
          
          const timeSpan = document.createElement('span');
          timeSpan.innerText = new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
          metaContainer.appendChild(timeSpan);
          
          row.appendChild(wrapper);
          row.appendChild(metaContainer);
          body.appendChild(row);
        });
      }
      
      Object.keys(activeTempUploads).forEach(id => {
        const tempMsg = activeTempUploads[id];
        body.appendChild(createTempRow(tempMsg));
      });
      
      if (isAtBottom) { body.scrollTop = body.scrollHeight; }
    }

    function createTempRow(msg) {
      const row = document.createElement('div');
      row.className = "msg-row flex gap-3 max-w-[85%] sm:max-w-[75%] w-fit align-self-end flex-row-reverse ml-auto mb-2 opacity-75 text-right";
      let inner = '';
      if(msg.type === 'text') inner = `<div class="msg-bubble p-3 rounded-2xl text-sm bg-[#7CE68E] text-slate-900 shadow-sm">${msg.content}</div>`;
      else if(msg.type === 'sticker') inner = `<img src="${msg.content}" class="w-20 h-20 object-contain">`;
      else if(msg.type === 'optimistic-image') inner = `<img src="${msg.content}" class="max-w-[160px] rounded-xl object-cover opacity-60 border"><span class="text-[9px] block text-emerald-400">กำลังส่ง...</span>`;
      else if(msg.type === 'optimistic-video') inner = `<div class="p-3 rounded-2xl bg-slate-800 text-xs text-white"><i class="fa-solid fa-spinner animate-spin mr-1"></i> กำลังประมวลผลวิดีโอ...</div>`;
      else if(msg.type === 'optimistic-file') inner = `<div class="p-3 rounded-2xl bg-white border text-xs text-slate-500"><i class="fa-solid fa-spinner animate-spin text-green-500 mr-1"></i> กำลังส่งไฟล์: ${msg.filename}</div>`;
      row.innerHTML = inner;
      return row;
    }

    // ฟังก์ชันย่อยระบบแก้ไขเปลี่ยนชื่อเล่น (Display Name) ของผู้ใช้งาน อัปเดตลง Sheet และ Firebase ทันที
    async function handleUserChangeDisplayNameFlow() {
      Swal.close();
      const { value: newName } = await Swal.fire({
        title: 'เปลี่ยนชื่อเล่นของคุณ',
        input: 'text',
        inputLabel: 'ระบุชื่อเล่นแสดงในแชทใหม่ของคุณ',
        inputValue: currentUser.displayName,
        placeholder: 'กรอกชื่อเล่นที่ต้องการ...',
        showCancelButton: true,
        confirmButtonColor: '#10b981',
        cancelButtonText: 'ยกเลิก',
        inputValidator: (value) => { if (!value.trim()) return 'กรุณาระบุชื่อเล่นด้วยครับ!' }
      });

      if (newName && newName.trim() !== currentUser.displayName) {
        Swal.fire({ title: 'กำลังอัปเดตข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
        try {
          let res = await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'updateDisplayName', username: currentUser.username, newDisplayName: newName.trim() })
          });
          let result = await res.json();
          if(result.status === 'success') {
            currentUser.displayName = newName.trim();
            localStorage.setItem('parakit_chat_user', JSON.stringify(currentUser));
            document.getElementById('my-display-name').innerText = currentUser.displayName;
            setupUserPresence();
            Swal.fire('สำเร็จ', 'เปลี่ยนชื่อเล่นของคุณเรียบร้อยแล้วครับ', 'success');
          } else { Swal.fire('ล้มเหลว', result.message, 'error'); }
        } catch(err) { Swal.fire('ข้อผิดพลาด', 'ไม่สามารถเชื่อมต่อคลาวด์เพื่อบันทึกชื่อได้ครับ', 'error'); }
      }
    }

    function sendTextMessage() {

      const localTimestamp = Date.now();
      input.value = '';

      push(ref(db, 'global_messages'), {
        senderName: currentUser.displayName,
        senderAvatar: currentUser.avatar || 'https://cdn-icons-png.flaticon.com/512/149/149071.png',
        type: 'text', content: text, timestamp: localTimestamp, deleted: false
      });
    }

      if (/^\d+$/.test(pwd)) return false; 
      return true;
    }

    async function openRegisterModal() {
      const { value: formValues } = await Swal.fire({
        title: 'สร้างบัญชีผู้ใช้ใหม่',
        html: `
          <div class="text-left max-w-xs mx-auto">
            <label class="block text-xs font-semibold text-slate-500 mb-1">ชื่อเล่นแชท (Display Name)</label>
            <input id="swal-name" class="swal-input-box" placeholder="ชื่อเล่นที่แสดงในแชท">
            <label class="block text-xs font-semibold text-slate-500 mb-1 mt-2">Username</label>
            <input id="swal-user" class="swal-input-box" placeholder="สำหรับใช้ล็อกอิน">
            <label class="block text-xs font-semibold text-slate-500 mb-1 mt-2">Password</label>
            <input id="swal-pass" type="password" class="swal-input-box" placeholder="ขั้นต่ำ 8 ตัว (ห้ามเลขล้วน)">
            <label class="block text-xs font-semibold text-slate-500 mb-1 mt-2">Email</label>
            <input id="swal-email" type="email" class="swal-input-box" placeholder="ตัวอย่าง: name@gmail.com">
          </div>
        `,
        focusConfirm: false, confirmButtonText: 'สมัครสมาชิก', confirmButtonColor: '#10b981',
        showCancelButton: true, cancelButtonText: 'ยกเลิก',
        preConfirm: () => {
          return {
            displayName: document.getElementById('swal-name').value.trim(),
            username: document.getElementById('swal-user').value.trim(),
            password: document.getElementById('swal-pass').value,
            email: document.getElementById('swal-email').value.trim()
          }
        }
      });

      if (!formValues) return;
      if (!formValues.displayName || !formValues.username || !formValues.password || !formValues.email) {
        return Swal.fire('ข้อมูลไม่ครบ', 'กรุณากรอกข้อมูลให้ครบทุกช่องครับ', 'warning');
      }
      if (!formValues.email.endsWith('@gmail.com')) {
        return Swal.fire('ผิดพลาด', 'ระบบรองรับเฉพาะบัญชี @gmail.com เท่านั้นครับ', 'warning');
      }
      if (!validatePassword(formValues.password)) {
        return Swal.fire('รหัสผ่านไม่ปลอดภัย', 'รหัสผ่านต้องยาวอย่างน้อย 8 ตัว มีผสมตัวอักษรและตัวเลข (ห้ามเป็นตัวเลขล้วน)', 'warning');
      }

      Swal.showLoading();
      try {
        let res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'register', ...formValues }) });
        let result = await res.json();
        if(result.status === 'success') {
          Swal.fire('สำเร็จ', 'สร้างบัญชีเข้าใช้งานเรียบร้อยแล้วครับ โปรดเข้าสู่ระบบ', 'success');
        } else { Swal.fire('ล้มเหลว', result.message, 'error'); }
      } catch(e) { Swal.fire('ข้อผิดพลาด', 'ติดต่อคลาวด์ไม่สำเร็จ', 'error'); }
    }

    async function handleLogin() {
      const userVal = document.getElementById('login-username').value.trim();
      const passVal = document.getElementById('login-password').value;
      if(!userVal || !passVal) return Swal.fire('ระบุข้อมูล', 'กรุณาระบุ Username และ Password ให้ครบถ้วนครับ', 'warning');

      Swal.showLoading();
      try {
        let res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'login', username: userVal, password: passVal }) });
        let result = await res.json();
        if(result.status === 'success') {
          currentUser = result.user;
          localStorage.setItem('parakit_chat_user', JSON.stringify(currentUser));
          
          document.getElementById('login-screen').style.display = 'none';
          document.getElementById('chat-interface').style.display = 'flex';
          
          document.getElementById('my-display-name').innerText = currentUser.displayName;
          if(currentUser.avatar) document.getElementById('my-avatar-img').src = currentUser.avatar;
          
          setupUserPresence();
          await syncAvatarsFromServer();
          Swal.close();
          listenChatMessages();
        } else { Swal.fire('ข้อผิดพลาด', result.message || 'ข้อมูลเข้าสู่ระบบไม่ถูกต้องครับ', 'error'); }
      } catch(e) { Swal.fire('ข้อผิดพลาด', 'การยืนยันตัวตนขัดข้อง', 'error'); }
    }

    async function handleForgotPwd() {
      const { value: info } = await Swal.fire({
        title: 'กู้คืนรหัสผ่านด้วยบัญชี',
        html: `
          <div class="text-left max-w-xs mx-auto">
            <label class="block text-xs font-semibold text-slate-500 mb-1">Username ของคุณ</label>
            <input id="forgot-user" class="swal-input-box" placeholder="ระบุ Username">
            <label class="block text-xs font-semibold text-slate-500 mb-1 mt-3">Gmail ที่ลงทะเบียน</label>
            <input id="forgot-email" type="email" class="swal-input-box" placeholder="example@gmail.com">
          </div>
        `,
        confirmButtonText: 'รับรหัส OTP', confirmButtonColor: '#10b981', showCancelButton: true,
        preConfirm: () => { return { username: document.getElementById('forgot-user').value.trim(), email: document.getElementById('forgot-email').value.trim() } }
      });

      if(!info || !info.username || !info.email) return;
      Swal.showLoading();
      try {
        let res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'sendOTP', ...info }) });
        let result = await res.json();
        if(result.status !== 'success') return Swal.fire('ล้มเหลว', result.message, 'error');
        
        const { value: resetData } = await Swal.fire({
          title: 'ตั้งรหัสผ่านใหม่',
          html: `
            <div class="text-left max-w-xs mx-auto">
              <label class="block text-xs font-semibold text-slate-500 mb-1">รหัส OTP 6 หลัก</label>
              <input id="reset-otp" class="swal-input-box text-center tracking-widest font-bold" maxlength="6">
              <label class="block text-xs font-semibold text-slate-500 mb-1 mt-3">รหัสผ่านใหม่</label>
              <input id="reset-newpass" type="password" class="swal-input-box" placeholder="ขั้นต่ำ 8 ตัว">
            </div>
          `,
          confirmButtonText: 'ยืนยันเปลี่ยนรหัส', confirmButtonColor: '#10b981', showCancelButton: true,
          preConfirm: () => { return { otp: document.getElementById('reset-otp').value.trim(), newPassword: document.getElementById('reset-newpass').value } }
        });

        if(!resetData.otp || !resetData.newPassword) return;
        Swal.showLoading();
        let res2 = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'resetPassword', username: info.username, ...resetData }) });
        let result2 = await res2.json();
        if(result2.status === 'success') {
          Swal.fire('สำเร็จ', 'เปลี่ยนรหัสผ่านเสร็จสิ้น ล็อกอินได้เลยครับ', 'success');
        } else { Swal.fire('ล้มเหลว', result2.message, 'error'); }
      } catch(e) { Swal.fire('ผิดพลาด', 'คำขอถูกปฏิเสธ', 'error'); }
    }

    window.uploadUserAvatarToDrive = function(e) {
      const file = e.target.files[0];
      if(!file) return;
      Swal.fire({ title: 'กำลังอัปโหลดโปรไฟล์...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      const reader = new FileReader();
      reader.onloadend = async () => {
        try {
          let res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'uploadFile', filename: `avatar_${currentUser.username}.png`, base64: reader.result }) });
          let result = await res.json();
          if(result.status === 'success') {
            let directUrl = result.viewUrl || result.url;
            currentUser.avatar = directUrl;
            document.getElementById('my-avatar-img').src = directUrl;
            localStorage.setItem('parakit_chat_user', JSON.stringify(currentUser));
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'updateAvatar', username: currentUser.username, avatarUrl: directUrl }) });
            globalAvatarMap[currentUser.displayName] = directUrl;
            Swal.fire('สำเร็จ', 'เปลี่ยนรูปโปรไฟล์เรียบร้อยครับ', 'success');
            renderAllMessagesWithTemps();
          }
        } catch(err) { Swal.fire('ผิดพลาด', 'อัปโหลดล้มเหลว', 'error'); }
      };
      reader.readAsDataURL(file);
    };

    window.uploadUserBgToDrive = function(e) {
      const file = e.target.files[0];
      if(!file) return;
      Swal.fire({ title: 'กำลังเปลี่ยนพื้นหลัง...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
      const reader = new FileReader();
      reader.onloadend = async () => {
        try {
          let res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'uploadFile', filename: `bg_${currentUser.username}.png`, base64: reader.result }) });
          let result = await res.json();
          if(result.status === 'success') {
            let directBgUrl = result.viewUrl || result.url;
            const chatBody = document.getElementById('chat-body');
            chatBody.style.backgroundImage = `url('${directBgUrl}')`;
            currentUser.bgUrl = directBgUrl;
            localStorage.setItem('parakit_chat_user', JSON.stringify(currentUser));
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'updateUserBg', username: currentUser.username, bgUrl: directBgUrl }) });
            Swal.fire('สำเร็จ', 'เปลี่ยนพื้นหลังวอลเปเปอร์สำเร็จครับ', 'success');
          }
        } catch(err) { Swal.fire('ผิดพลาด', 'เชื่อมต่อคลาวด์ล้มเหลว', 'error'); }
      };
      reader.readAsDataURL(file);
    };

    function initPickers() {
      const ep = document.getElementById('emoji-picker');
      emojis.forEach(emo => {
        let span = document.createElement('span'); 
        span.className = 'flex items-center justify-center p-1 hover:scale-125 transition-transform'; 
        span.innerText = emo;
        span.onclick = (e) => { e.stopPropagation(); document.getElementById('msg-input').value += emo; ep.classList.add('hidden'); };
        ep.appendChild(span);
      });
      document.getElementById('tool-emoji').addEventListener('click', (e) => { e.stopPropagation(); ep.classList.toggle('hidden'); document.getElementById('sticker-picker').classList.add('hidden'); });

      const sp = document.getElementById('sticker-picker');
      stickers.forEach((stk, idx) => {
        let img = document.createElement('img'); 
        img.src = stk; 
        img.className = 'w-14 h-14 object-contain hover:scale-110 transition-transform p-1 cursor-pointer';
        img.onerror = () => { img.src = "https://cdn-icons-png.flaticon.com/512/25/25284.png"; };
        img.onclick = (e) => { e.stopPropagation(); sendSticker(stk); sp.classList.add('hidden'); };
        sp.appendChild(img);
      });
      document.getElementById('tool-sticker').addEventListener('click', (e) => { e.stopPropagation(); sp.classList.toggle('hidden'); ep.classList.add('hidden'); });

      document.addEventListener('click', () => { ep.classList.add('hidden'); sp.classList.add('hidden'); document.getElementById('mention-list-popup').classList.add('hidden'); });
    }
  </script>
</body>
</html>
