<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Chat Parakit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  
  <style>
    body { font-family: 'Prompt', sans-serif; background: #7494c4; }
    .premium-glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.5); }
    .swal2-popup { font-family: 'Prompt', sans-serif !important; border-radius: 20px !important; }
    .chat-bg { background-color: #abc1de; background-size: cover; background-position: center; transition: background 0.3s ease; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="h-screen flex items-center justify-center p-0 md:p-4">

  <div class="w-full h-full md:max-w-md md:h-[85vh] premium-glass md:rounded-3xl shadow-2xl flex flex-col overflow-hidden relative">
    
    <div id="auth-screen" class="absolute inset-0 bg-white z-40 flex flex-col p-6 justify-center">
      <div class="text-center mb-8">
        <div class="w-20 h-20 bg-emerald-500 rounded-3xl mx-auto flex items-center justify-center text-white text-4xl shadow-lg mb-4">
          <i class="fa-solid fa-comments"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-800">Chat Parakit Connect</h2>
        <p class="text-xs text-slate-400 mt-1">กรุณาเลือกผู้ใช้งานและเข้าสู่ระบบ</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1.5"><i class="fa-solid fa-user-tag mr-1"></i> เลือก User ในระบบ</label>
          <select id="user-select" class="w-full p-3 rounded-xl border border-slate-200 bg-slate-50 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500">
            <option value="">-- กำลังโหลดรายชื่อผู้ใช้ --</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1.5">Username</label>
          <input type="text" id="login-username" onkeypress="if(event.key==='Enter') handleLogin()" placeholder="กรอกชื่อผู้ใช้" class="w-full p-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-500 mb-1.5">Password</label>
          <input type="password" id="login-password" onkeypress="if(event.key==='Enter') handleLogin()" placeholder="กรอกรหัสผ่าน" class="w-full p-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <button onclick="handleLogin()" class="w-full py-3.5 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl text-sm font-medium shadow-md transition duration-300">
          เข้าสู่ระบบแชท
        </button>

        <div class="flex justify-between items-center text-xs pt-2">
          <button onclick="handleForgotPasswordOTP()" class="text-slate-400 hover:text-emerald-600"><i class="fa-solid fa-key mr-1"></i>ลืมรหัสผ่าน?</button>
          <button onclick="openRegisterModal()" class="text-emerald-500 font-semibold hover:underline">สร้างบัญชีใหม่ <i class="fa-solid fa-arrow-right-to-bracket ml-1"></i></button>
        </div>
      </div>
    </div>

    <div class="p-4 bg-slate-800 text-white flex items-center justify-between shadow-md">
      <div class="flex items-center gap-3">
        <div class="relative cursor-pointer" onclick="changeUserAvatar()">
          <img id="my-avatar" src="" class="w-10 h-10 rounded-full border-2 border-emerald-400 object-cover">
          <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-slate-800 rounded-full"></span>
        </div>
        <div>
          <h3 id="my-name" class="font-semibold text-sm">Username</h3>
          <p class="text-[10px] text-emerald-400"><i class="fa-solid fa-circle text-[8px] mr-1"></i>ออนไลน์ห้องรวม</p>
        </div>
      </div>
      <div class="flex items-center gap-4 text-lg text-slate-300">
        <button onclick="changeChatBgLink()" title="เปลี่ยนพื้นหลังแชทด้วยลิงก์" class="hover:text-white">
          <i class="fa-solid fa-image"></i>
        </button>
        <button onclick="handleLogout()" title="ออกจากระบบ" class="hover:text-rose-400"><i class="fa-solid fa-right-from-bracket"></i></button>
      </div>
    </div>

    <div id="chat-box" class="flex-1 chat-bg p-4 overflow-y-auto no-scrollbar space-y-3"></div>

    <div class="p-3 bg-white border-t border-slate-100 flex flex-col gap-2">
      <div class="flex items-center gap-3 text-slate-400 text-sm px-1">
        <button onclick="showEmojiPicker()" class="hover:text-amber-500"><i class="fa-regular fa-face-smile text-lg"></i></button>
        <button onclick="showStickerPicker()" class="hover:text-blue-500"><i class="fa-regular fa-note-sticky text-lg"></i></button>
        <label class="cursor-pointer hover:text-emerald-500">
          <i class="fa-solid fa-paperclip text-lg"></i>
          <input type="file" id="file-input" class="hidden" onchange="handleFileUpload(event)">
        </label>
      </div>
      
      <div class="flex items-center gap-2">
        <input type="text" id="msg-input" onkeypress="if(event.key==='Enter') sendText()" placeholder="พิมพ์ข้อความที่นี่..." class="flex-1 p-2.5 px-4 bg-slate-50 border border-slate-200 rounded-2xl text-sm focus:outline-none focus:ring-1 focus:ring-emerald-500">
        <button onclick="sendText()" class="w-10 h-10 bg-emerald-500 hover:bg-emerald-600 text-white rounded-full flex items-center justify-center shadow-md transition"><i class="fa-solid fa-paper-plane text-xs"></i></button>
      </div>
    </div>

  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwVG966YS_0-qCA4y7tJzIH2_nPj-9lBpHGYkZMFkPblCnJ-xlsmzjMKAQ_jmpT6nsm_w/exec"; 
    let currentUser = null;
    let localLoadedImages = {}; 
    let lastMessageTimestamp = 0; // เก็บจุดเวลาล่าสุดเพื่อลดแบนด์วิดท์ในการ Sync ข้อความ

    document.addEventListener("DOMContentLoaded", () => {
      loadUserList();
      
      const savedUser = localStorage.getItem("chat_current_user");
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
        document.getElementById("auth-screen").classList.add("hidden");
        document.getElementById("my-name").innerText = currentUser.username;
        document.getElementById("my-avatar").src = currentUser.avatar;
        
        const savedBg = localStorage.getItem(`chat_bg_${currentUser.username}`);
        if(savedBg) { document.getElementById("chat-box").style.backgroundImage = `url('${savedBg}')`; }
        
        loadMessages();
      }
      
      // ดึงข้อมูลแชทแบบ Real-time ความเร็วสูง
      setInterval(loadMessages, 2500);
    });

    function loadUserList() {
      fetch(`${WEB_APP_URL}?action=getUsers`)
        .then(res => res.json())
        .then(users => {
          const select = document.getElementById("user-select");
          if(users.length === 0){
            select.innerHTML = `<option value="">ยังไม่มี User ในระบบ</option>`;
            return;
          }
          select.innerHTML = users.map(u => `<option value="${u.username}">${u.username}</option>`).join('');
          document.getElementById("login-username").value = select.value;
          select.onchange = () => { document.getElementById("login-username").value = select.value; };
        });
    }

    function handleLogin() {
      const username = document.getElementById("login-username").value;
      const password = document.getElementById("login-password").value;
      if(!username || !password) return;

      // แสดงสปินเนอร์เพื่อความลื่นไหลแบบทันทีทันใด
      const btn = document.querySelector("button[onclick='handleLogin()']");
      btn.disabled = true;
      btn.innerText = "กำลังตรวจสอบ...";

      fetch(WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify({ action: "login", username, password })
      })
      .then(res => res.json())
      .then(res => {
        btn.disabled = false;
        btn.innerText = "เข้าสู่ระบบแชท";
        if(res.success) {
          currentUser = res.user;
          localStorage.setItem("chat_current_user", JSON.stringify(currentUser));
          document.getElementById("auth-screen").classList.add("hidden");
          document.getElementById("my-name").innerText = currentUser.username;
          document.getElementById("my-avatar").src = currentUser.avatar;
          
          const savedBg = localStorage.getItem(`chat_bg_${currentUser.username}`);
          if(savedBg) { document.getElementById("chat-box").style.backgroundImage = `url('${savedBg}')`; }
          
          loadMessages();
        } else {
          Swal.fire({ icon: 'error', title: 'เข้าสู่ระบบล้มเหลว', text: res.message, confirmButtonColor: '#ef4444' });
        }
      });
    }

    function handleLogout() {
      localStorage.removeItem("chat_current_user");
      location.reload();
    }

    function openRegisterModal() {
      Swal.fire({
        title: 'สร้างบัญชีผู้ใช้ใหม่',
        html: `
          <input type="text" id="reg-user" class="swal2-input" placeholder="Username" onkeypress="if(event.key==='Enter') Swal.clickConfirm()">
          <input type="password" id="reg-pass" class="swal2-input" placeholder="Password (ขั้นต่ำ 8 ตัว)" onkeypress="if(event.key==='Enter') Swal.clickConfirm()">
          <input type="email" id="reg-email" class="swal2-input" placeholder="Email สำหรับรีเซ็ตรหัสผ่าน" onkeypress="if(event.key==='Enter') Swal.clickConfirm()">
        `,
        confirmButtonText: 'สมัครสมาชิก',
        showCancelButton: true,
        cancelButtonText: 'ยกเลิก',
        preConfirm: () => {
          const username = Swal.getPopup().querySelector('#reg-user').value;
          const password = Swal.getPopup().querySelector('#reg-pass').value;
          const email = Swal.getPopup().querySelector('#reg-email').value;
          
          if (!username || !password || !email) { Swal.showValidationMessage(`กรุณากรอกข้อมูลให้ครบทุกช่องครับ`); return; }
          if (password.length < 8) { Swal.showValidationMessage(`รหัสผ่านต้องมีความยาวอย่างน้อย 8 ตัวอักษรขึ้นไปครับ`); return; }
          
          return { username, password, email }
        }
      }).then((result) => {
        if (result.isConfirmed) {
          fetch(WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify({ action: "register", ...result.value })
          }).then(res => res.json()).then(data => {
            Swal.fire(data.success ? 'สำเร็จ!' : 'ล้มเหลว', data.message, data.success ? 'success' : 'error').then(() => loadUserList());
          });
        }
      });
    }

    // ฟังก์ชันระบบกู้รหัสผ่านผ่าน OTP ป้อนในหน้าเว็บโดยตรง
    function handleForgotPasswordOTP() {
      Swal.fire({
        title: 'ลืมรหัสผ่าน',
        input: 'text',
        inputLabel: 'ระบุ Username ของคุณเพื่อรับรหัส OTP ในเมล',
        inputPlaceholder: 'กรอก Username...',
        showCancelButton: true,
        confirmButtonText: 'ส่งรหัส OTP',
        cancelButtonText: 'ยกเลิก',
        didOpen: () => {
          Swal.getInput().addEventListener('keyup', (e) => { if(e.key==='Enter') Swal.clickConfirm(); });
        }
      }).then((result) => {
        if (result.value) {
          const targetUser = result.value;
          
          // หน้าต่างโหลดพื้นหลังทันทีระหว่างยิง OTP เข้าเมล
          Swal.fire({ title: 'กำลังส่งรหัส OTP เข้าอีเมล...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } });

          fetch(WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify({ action: "sendOTP", username: targetUser })
          })
          .then(res => res.json())
          .then(data => {
            if(data.success) {
              // เปิดหน้าต่างกรอกรหัส OTP ทันที
              Swal.fire({
                title: 'กรอกรหัส OTP',
                text: 'กรุณานำรหัส OTP 6 หลักจากอีเมลของคุณมากรอกในช่องด้านล่าง',
                input: 'text',
                inputPlaceholder: 'กรอกรหัส 6 หลักที่นี่...',
                showCancelButton: true,
                confirmButtonText: 'ยืนยันรหัส',
                cancelButtonText: 'ยกเลิก',
                didOpen: () => {
                  Swal.getInput().addEventListener('keyup', (e) => { if(e.key==='Enter') Swal.clickConfirm(); });
                },
                preConfirm: (otpCode) => {
                  if(!otpCode || otpCode.length !== 6) { Swal.showValidationMessage('กรุณากรอกรหัส OTP ให้ครบ 6 หลักครับ'); return; }
                  return otpCode;
                }
              }).then((otpResult) => {
                if(otpResult.value) {
                  // ส่งตรวจสอบความถูกต้องของรหัส OTP
                  fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify({ action: "verifyOTP", username: targetUser, otp: otpResult.value })
                  })
                  .then(res => res.json())
                  .then(verifyData => {
                    if(verifyData.success) {
                      // เปิดหน้าต่างรีเซ็ตรหัสผ่านใหม่ทันที
                      Swal.fire({
                        title: 'ตั้งรหัสผ่านใหม่',
                        html: `
                          <input type="password" id="new-pwd-otp" class="swal2-input" placeholder="ป้อนรหัสผ่านใหม่ (ขั้นต่ำ 8 ตัว)" onkeypress="if(event.key==='Enter') Swal.clickConfirm()">
                          <input type="password" id="confirm-pwd-otp" class="swal2-input" placeholder="ยืนยันรหัสผ่านอีกครั้ง" onkeypress="if(event.key==='Enter') Swal.clickConfirm()">
                        `,
                        confirmButtonText: 'เปลี่ยนรหัสผ่าน',
                        showCancelButton: true,
                        cancelButtonText: 'ยกเลิก',
                        preConfirm: () => {
                          const p1 = Swal.getPopup().querySelector('#new-pwd-otp').value;
                          const p2 = Swal.getPopup().querySelector('#confirm-pwd-otp').value;
                          if(!p1 || !p2) { Swal.showValidationMessage('กรุณากรอกรหัสผ่านให้ครบถ้วนครับ'); return; }
                          if(p1.length < 8) { Swal.showValidationMessage('รหัสผ่านต้องมีความยาวอย่างน้อย 8 ตัวอักษรขึ้นไปครับ'); return; }
                          if(p1 !== p2) { Swal.showValidationMessage('รหัสผ่านทั้งสองช่องไม่ตรงกันครับ'); return; }
                          return p1;
                        }
                      }).then((newPwdResult) => {
                        if(newPwdResult.value) {
                          // อัปเดตรหัสผ่านใหม่ลงชีตทันที
                          fetch(WEB_APP_URL, {
                            method: "POST",
                            body: JSON.stringify({ action: "resetPasswordOTP", username: targetUser, token: verifyData.token, newPassword: newPwdResult.value })
                          }).then(res => res.json()).then(finalRes => {
                            Swal.fire(finalRes.success ? 'สำเร็จ!' : 'ล้มเหลว', finalRes.message, finalRes.success ? 'success' : 'error');
                          });
                        }
                      });
                    } else {
                      Swal.fire('ข้อผิดพลาด', verifyData.message, 'error');
                    }
                  });
                }
              });
            } else {
              Swal.fire('ข้อผิดพลาด', data.message, 'error');
            }
          });
        }
      });
    }

    // ฟังก์ชันความเร็วสูงยิงข้อความแสดงผลแบบ 0.1 วินาที (Optimistic UI)
    function sendText() {
      const input = document.getElementById("msg-input");
      const content = input.value.trim();
      if(!content) return;
      input.value = "";
      
      appendOptimisticMessage({ sender: currentUser.username, type: "text", content: content, timeStr: getNowTimeStr(), avatar: currentUser.avatar });

      fetch(WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify({ action: "sendMessage", username: currentUser.username, type: "text", content })
      });
    }

    function sendSticker(url) {
      appendOptimisticMessage({ sender: currentUser.username, type: "sticker", content: url, timeStr: getNowTimeStr(), avatar: currentUser.avatar });
      Swal.close();

      fetch(WEB_APP_URL, {
        method: "POST",
        body: JSON.stringify({ action: "sendMessage", username: currentUser.username, type: "sticker", content: url })
      });
    }

    function getNowTimeStr() {
      const n = new Date();
      return String(n.getHours()).padStart(2, '0') + ":" + String(n.getMinutes()).padStart(2, '0');
    }

    function appendOptimisticMessage(msg) {
      const container = document.getElementById("chat-box");
      const div = document.createElement("div");
      const isMe = msg.sender === currentUser.username;
      div.className = `flex items-start gap-2.5 ${isMe ? 'flex-row-reverse' : ''}`;
      
      let contentHtml = "";
      if(msg.type === "text") {
        contentHtml = `<div class="p-2.5 px-4 rounded-2xl text-sm bg-emerald-400 text-white rounded-tr-none shadow-sm">${msg.content}</div>`;
      } else if(msg.type === "sticker") {
        contentHtml = `<img src="${msg.content}" class="w-24 h-24 object-contain">`;
      } else if(msg.type === "file-preview") {
        contentHtml = `
          <div class="relative rounded-2xl border bg-white shadow-sm max-w-[200px]">
            <img src="${msg.content}" class="max-w-full h-auto rounded-2xl object-cover min-w-[120px]" alt="preview">
          </div>`;
      }
      
      div.innerHTML = `
        <img src="${msg.avatar}" class="w-8 h-8 rounded-full object-cover shadow-sm">
        <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
          <span class="text-[10px] text-slate-600 mb-0.5">${msg.sender}</span>
          <div class="flex items-end gap-1.5 ${isMe ? 'flex-row-reverse' : ''}">
            ${contentHtml}
            <span class="text-[9px] text-slate-500">${msg.timeStr}</span>
          </div>
        </div>
      `;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function loadMessages() {
      if(!currentUser) return;
      fetch(`${WEB_APP_URL}?action=getMessages`)
        .then(res => res.json())
        .then(messages => {
          const container = document.getElementById("chat-box");
          let html = "";
          messages.forEach(msg => {
            const isMe = msg.sender === currentUser.username;
            let contentHtml = "";

            if (msg.type === "text") {
              contentHtml = `<div class="p-2.5 px-4 rounded-2xl text-sm ${isMe ? 'bg-emerald-400 text-white rounded-tr-none' : 'bg-white text-slate-800 rounded-tl-none'} shadow-sm">${msg.content}</div>`;
            } else if (msg.type === "sticker") {
              contentHtml = `<img src="${msg.content}" class="w-24 h-24 object-contain">`;
            } else if (msg.type === "file") {
              const isImage = /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(msg.fileName);
              
              if (isImage) {
                const cachedData = localLoadedImages[msg.content];
                const imgSrc = cachedData ? cachedData : "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";
                const lazyClass = cachedData ? "" : "lazy-stream-img";
                
                contentHtml = `
                  <div class="relative group cursor-pointer overflow-hidden rounded-2xl border bg-white shadow-sm max-w-[200px]" onclick="previewImageInline('${msg.content}', '${msg.fileName}')">
                    <img src="${imgSrc}" data-id="${msg.content}" class="${lazyClass} max-w-full h-auto min-w-[120px] min-h-[80px] object-cover" alt="Image">
                    <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 flex items-center justify-center text-white text-xs transition"><i class="fa-solid fa-expand text-sm"></i></div>
                  </div>
                `;
              } else {
                contentHtml = `
                  <div onclick="downloadFileInline('${msg.content}', '${msg.fileName}')" class="p-3 rounded-2xl bg-white border flex items-center gap-3 shadow-sm max-w-[240px] cursor-pointer hover:bg-slate-50 transition">
                    <div class="w-10 h-10 bg-slate-100 rounded-xl flex items-center justify-center text-slate-600"><i class="fa-solid fa-file-arrow-down text-lg"></i></div>
                    <div class="overflow-hidden">
                      <p class="text-xs font-semibold text-slate-700 truncate">${msg.fileName}</p>
                      <p class="text-[10px] text-slate-400">คลิกเพื่อดาวน์โหลด</p>
                    </div>
                  </div>
                `;
              }
            }

            html += `
              <div class="flex items-start gap-2.5 ${isMe ? 'flex-row-reverse' : ''}">
                <img src="${msg.avatar}" class="w-8 h-8 rounded-full object-cover shadow-sm">
                <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                  <span class="text-[10px] text-slate-600 mb-0.5">${msg.sender}</span>
                  <div class="flex items-end gap-1.5 ${isMe ? 'flex-row-reverse' : ''}">
                    ${contentHtml}
                    <span class="text-[9px] text-slate-500">${msg.timeStr}</span>
                  </div>
                </div>
              </div>
            `;
          });
          
          const isScrollBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 200;
          container.innerHTML = html;
          
          lazyLoadStreamImages();
          if(isScrollBottom) { container.scrollTop = container.scrollHeight; }
        });
    }

    function lazyLoadStreamImages() {
      document.querySelectorAll(".lazy-stream-img").forEach(img => {
        const fileId = img.getAttribute("data-id");
        if (fileId && !localLoadedImages[fileId]) {
          fetch(`${WEB_APP_URL}?action=streamImage&fileId=${fileId}`)
            .then(res => res.text())
            .then(base64 => {
              if(base64) { 
                const fullSrc = "data:image/jpeg;base64," + base64;
                img.src = fullSrc;
                localLoadedImages[fileId] = fullSrc; 
              }
            });
        }
      });
    }

    function previewImageInline(fileId, fileName) {
      if(localLoadedImages[fileId]) {
        openSpotlightSwal(localLoadedImages[fileId], fileName);
      } else {
        fetch(`${WEB_APP_URL}?action=streamImage&fileId=${fileId}`).then(res => res.text()).then(base64 => {
          const srcData = "data:image/jpeg;base64," + base64;
          localLoadedImages[fileId] = srcData;
          openSpotlightSwal(srcData, fileName);
        });
      }
    }

    function openSpotlightSwal(srcData, fileName) {
      Swal.fire({
        title: fileName,
        imageUrl: srcData,
        imageAlt: fileName,
        showCancelButton: true,
        confirmButtonText: '<i class="fa-solid fa-download"></i> ดาวน์โหลดรูป',
        cancelButtonText: 'ปิด',
        confirmButtonColor: '#10b981'
      }).then((result) => {
        if (result.isConfirmed) { triggerBinaryDownload(srcData, fileName); }
      });
    }

    function downloadFileInline(fileId, fileName) {
      fetch(`${WEB_APP_URL}?action=streamImage&fileId=${fileId}`)
        .then(res => res.text())
        .then(base64 => {
          triggerBinaryDownload("data:application/octet-stream;base64," + base64, fileName);
        });
    }

    function triggerBinaryDownload(dataUrl, fileName) {
      const a = document.createElement("a");
      a.href = dataUrl;
      a.download = fileName;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const isImage = /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(file.name);
      const reader = new FileReader();
      
      reader.onload = function(event) {
        const base64Data = event.target.result;
        
        if(isImage) {
          appendOptimisticMessage({ sender: currentUser.username, type: "file-preview", content: base64Data, timeStr: getNowTimeStr(), avatar: currentUser.avatar });
        }

        fetch(WEB_APP_URL, {
          method: "POST",
          body: JSON.stringify({ action: "uploadFile", base64Data, fileName: file.name, mimeType: file.type })
        }).then(res => res.json()).then(data => {
          if(data.success) {
            fetch(WEB_APP_URL, {
              method: "POST",
              body: JSON.stringify({ action: "sendMessage", username: currentUser.username, type: "file", content: data.fileId, fileName: file.name })
            }).then(() => { loadMessages(); });
          }
        });
      };
      reader.readAsDataURL(file);
    }

    function showEmojiPicker() {
      const emojis = ["😀", "😂", "🥰", "😎", "👍", "🙏", "🎉", "🔥", "❤️", "✨"];
      Swal.fire({
        title: 'เลือกคีย์บอร์ดอิโมจิ',
        html: `<div class="grid grid-cols-5 gap-3 text-2xl">${emojis.map(e => `<span onclick="insertEmoji('${e}')" class="cursor-pointer hover:scale-125 transition">${e}</span>`).join('')}</div>`,
        showConfirmButton: false
      });
    }
    function insertEmoji(e) { document.getElementById("msg-input").value += e; Swal.close(); document.getElementById("msg-input").focus(); }

    function showStickerPicker() {
      const stickers = [
        "https://fonts.gstatic.com/s/e/notoemoji/latest/1f431/512.webp",
        "https://fonts.gstatic.com/s/e/notoemoji/latest/1f436/512.webp",
        "https://fonts.gstatic.com/s/e/notoemoji/latest/1f98a/512.webp",
        "https://fonts.gstatic.com/s/e/notoemoji/latest/1f42a/512.webp"
      ];
      Swal.fire({
        title: 'ส่งสติ๊กเกอร์ด่วน',
        html: `<div class="grid grid-cols-2 gap-4">${stickers.map(s => `<img src="${s}" onclick="sendSticker('${s}')" class="w-20 h-20 mx-auto cursor-pointer hover:scale-110 transition">`).join('')}</div>`,
        showConfirmButton: false
      });
    }

    function changeChatBgLink() {
      Swal.fire({
        title: 'เปลี่ยนภาพพื้นหลังแชท',
        input: 'url',
        inputLabel: 'ใส่ URL ลิงก์รูปภาพพื้นหลังที่คุณต้องการ',
        inputPlaceholder: 'https://example.com/background.jpg',
        showCancelButton: true,
        didOpen: () => { Swal.getInput().addEventListener('keyup', (e) => { if(e.key==='Enter') Swal.clickConfirm(); }); }
      }).then((result) => {
        if (result.value) {
          document.getElementById("chat-box").style.backgroundImage = `url('${result.value}')`;
          localStorage.setItem(`chat_bg_${currentUser.username}`, result.value);
          Swal.fire('สำเร็จ', 'ปรับเปลี่ยนภาพพื้นหลังเฉพาะคุณเรียบร้อยแล้วครับ', 'success');
        }
      });
    }

    function changeUserAvatar() {
      Swal.fire({
        title: 'เปลี่ยนรูปโปรไฟล์ของคุณ',
        input: 'url',
        inputLabel: 'ใส่ URL ลิงก์รูปภาพใหม่ของคุณที่นี่',
        inputPlaceholder: 'https://example.com/image.jpg',
        showCancelButton: true,
        didOpen: () => { Swal.getInput().addEventListener('keyup', (e) => { if(e.key==='Enter') Swal.clickConfirm(); }); }
      }).then((result) => {
        if (result.value) {
          fetch(WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify({ action: "updateAvatar", username: currentUser.username, avatarUrl: result.value })
          }).then(() => {
            currentUser.avatar = result.value;
            localStorage.setItem("chat_current_user", JSON.stringify(currentUser));
            document.getElementById("my-avatar").src = result.value;
            Swal.fire('สำเร็จ', 'อัปเดตรูปประจำตัวเรียบร้อยแล้วครับ', 'success');
          });
        }
      });
    }
  </script>
</body>
