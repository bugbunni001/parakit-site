<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Target - Parakit-site</title>
  <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --ios-blue: #007AFF;
            --ios-green: #34C759;
            --ios-red: #FF3B30;
            --glass: rgba(255, 255, 255, 0.45);
            --glass-strong: rgba(255, 255, 255, 0.7);
            --border: rgba(255, 255, 255, 0.5);
            --text-dark: #1d1d1f;
            --text-light: #86868b;
            --blur-val: blur(30px);
            /* Sidebar Variables จาก Index */
            --sidebar-dark: rgba(28, 28, 30, 0.96);
            --transition-swift: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * { box-sizing: border-box; font-family: 'Kanit', sans-serif; transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }

        body { 
            margin: 0; padding: 0; min-height: 100vh;
            background: radial-gradient(circle at top right, #e8f0ff, #f5f5f7), 
                        radial-gradient(circle at bottom left, #fff0f0, #f5f5f7);
            color: var(--text-dark); overflow-x: hidden;
        }

        .container { width: 100%; max-width: 1080px; margin: 0 auto; padding: 40px 20px; }

        /* Header & Status */
        .top-nav { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; }
        .header-title h1 { font-size: 32px; margin: 0; font-weight: 600; letter-spacing: -0.8px; background: linear-gradient(180deg, #1d1d1f, #86868b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .status-pill {
            display: flex; align-items: center; gap: 8px; background: var(--glass);
            padding: 6px 16px; border-radius: 50px; font-size: 13px; border: 1px solid var(--border);
            backdrop-filter: var(--blur-val); -webkit-backdrop-filter: var(--blur-val);
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; }
        .pulse { animation: pulse-anim 2s infinite; }
        @keyframes pulse-anim { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(1.2); } }

        /* Control Area */
        .controls { display: flex; justify-content: flex-end; align-items: center; gap: 12px; margin-bottom: 25px; }
        .switch-label { font-size: 14px; font-weight: 500; color: var(--text-light); }
        .switch { position: relative; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background: #e5e5ea; border-radius: 30px; }
        .slider:before { position: absolute; content: ""; height: 24px; width: 24px; left: 2px; bottom: 2px; background: white; border-radius: 50%; box-shadow: 0 3px 10px rgba(0,0,0,0.1); }
        input:checked + .slider { background: var(--ios-green); }
        input:checked + .slider:before { transform: translateX(22px); }

        /* Dashboard Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 20px; }

        /* Premium Card Design */
        .card {
            background: var(--glass); backdrop-filter: var(--blur-val); -webkit-backdrop-filter: var(--blur-val);
            border-radius: 32px; border: 1px solid var(--border);
            padding: 24px; position: relative; overflow: hidden;
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.05);
        }
        .card:hover { transform: translateY(-5px); background: var(--glass-strong); box-shadow: 0 20px 50px -10px rgba(0,0,0,0.1); }

        .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .card-name { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .badge { 
            background: var(--ios-blue); color: white; padding: 6px 18px; 
            border-radius: 16px; font-size: 20px; font-weight: 600; min-width: 60px; text-align: center;
            box-shadow: 0 5px 15px rgba(0,122,255,0.25);
        }

        /* Grouping */
        .group { margin-bottom: 20px; }
        .group-label { font-size: 12px; font-weight: 600; color: var(--text-light); text-transform: uppercase; margin: 0 0 12px 10px; letter-spacing: 1.2px; }
        
        /* Data Row - Wide Input */
        .row { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 10px 16px; background: rgba(255,255,255,0.3); 
            border-radius: 18px; margin-bottom: 6px; border: 1px solid rgba(255,255,255,0.2);
        }
        .row:hover { background: rgba(255,255,255,0.8); border-color: var(--ios-blue); }
        .row span { font-size: 16px; font-weight: 400; color: var(--text-dark); }

        input[type="number"] {
            width: 120px; height: 38px; border: none; background: transparent;
            text-align: right; font-size: 18px; font-weight: 600;
            color: var(--ios-blue); outline: none;
        }
        input:focus { color: #000; }
        input:disabled { color: var(--text-dark); opacity: 0.8; }

        .summary { margin-top: 10px; padding: 12px 16px; text-align: right; }
        .summary-text { font-size: 13px; color: var(--text-light); margin-right: 8px; }
        .summary-val { font-size: 22px; font-weight: 600; color: var(--text-dark); }

        /* Professional Modal */
        .modal-bg {
            position: fixed; inset: 0; background: rgba(0,0,0,0.15); backdrop-filter: blur(12px);
            display: none; align-items: center; justify-content: center; z-index: 2000;
        }
        .modal-ui {
            background: rgba(255,255,255,0.8); width: 300px; border-radius: 24px; 
            text-align: center; overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,0.15);
            transform: scale(0.9); opacity: 0;
        }
        .modal-ui.active { transform: scale(1); opacity: 1; }
        .modal-info { padding: 25px; }
        .modal-title { font-weight: 600; font-size: 18px; margin-bottom: 8px; }
        .modal-desc { font-size: 14px; color: var(--text-dark); line-height: 1.4; }
        .modal-field { 
            width: 100%; margin-top: 15px; padding: 12px; border-radius: 12px; border: 1px solid rgba(0,0,0,0.1);
            text-align: center; font-size: 20px; font-weight: 600; letter-spacing: 4px; outline: none; background: white;
        }
        .modal-btns { display: flex; border-top: 1px solid rgba(0,0,0,0.05); }
        .modal-btn { flex: 1; padding: 16px; border: none; background: transparent; font-size: 16px; cursor: pointer; color: var(--ios-blue); }
        .modal-btn.bold { font-weight: 700; }
        .modal-btn.red { color: var(--ios-red); }
        .modal-btn:hover { background: rgba(0,0,0,0.03); }

        /* Save Button */
        .fab-save {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: var(--text-dark); color: white; border: none;
            padding: 14px 40px; border-radius: 40px; font-size: 17px; font-weight: 500;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); cursor: pointer; display: none; z-index: 100;
        }
        .fab-save:hover { transform: translateX(-50%) translateY(-5px); box-shadow: 0 25px 50px rgba(0,0,0,0.3); background: #000; }

        #load-screen { position: fixed; inset: 0; background: white; display: none; align-items: center; justify-content: center; z-index: 9999; }

        /* ===== SIDEBAR FLOATING STYLES (1:1 จาก INDEX) ===== */
        #floatingMenuBtn {
            position: fixed; top: 10px; left: 15px; width: 45px; height: 45px;
            background: var(--ios-blue); color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; cursor: move; z-index: 2100;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4); border: none; touch-action: none;
            transition: transform 0.2s, opacity 0.2s;
        }
        #floatingMenuBtn:active { transform: scale(0.9); }

        .sidebar-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.2);
            z-index: 2000; display: none; opacity: 0; transition: opacity 0.3s;
        }
        .sidebar-overlay.active { display: block; opacity: 1; }

        .sidebar-float {
            position: fixed; width: 280px; max-height: 70vh;
            background: var(--sidebar-dark); border-radius: 20px;
            overflow-y: auto; z-index: 2001; opacity: 0; visibility: hidden;
            transform: scale(0.8) translateY(10px);
            transition: opacity 0.3s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
            scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.2) transparent;
        }
        .sidebar-float.active { opacity: 1; visibility: visible; transform: scale(1) translateY(0); }
        .sidebar-float .sidebar-header { padding: 20px; font-size: 17px; font-weight: 600; color: #fff; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
        .sidebar-float .menu { padding: 8px 0; }
        .sidebar-float .menu a, .sidebar-float .drop-btn { 
            width: 100%; padding: 12px 20px; background: none; border: none; 
            color: #ebebf5; text-align: left; font-size: 14px; cursor: pointer; 
            display: flex; align-items: center; text-decoration: none; transition: 0.2s;
        }
        .sidebar-float .menu a:hover, .sidebar-float .drop-btn:hover { background: rgba(255,255,255,0.1); }
        .sidebar-float .sub { display: none; background: rgba(0,0,0,0.2); }
        .sidebar-float .item.open .sub { display: block; }
        .sidebar-float .sub a { padding-left: 45px; font-size: 13px; color: #8e8e93; }

        @media (max-width: 500px) {
            .grid { grid-template-columns: 1fr; }
            .header-title h1 { font-size: 26px; }
            input[type="number"] { width: 100px; }
        }
    </style>
</head>
<body>

<button id="floatingMenuBtn" title="ลากเพื่อย้าย">เมนู</button>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebarFloat()"></div>
<aside class="sidebar-float" id="sidebarFloat"></aside>

<div id="load-screen"><i class="fas fa-circle-notch fa-spin fa-2x" style="color: var(--ios-blue);"></i></div>

<div class="modal-bg" id="modalBox">
    <div class="modal-ui" id="modalInner">
        <div class="modal-info">
            <div class="modal-title" id="mTitle"></div>
            <div class="modal-desc" id="mDesc"></div>
            <div id="mInputWrapper"></div>
        </div>
        <div class="modal-btns" id="mBtnGrid"></div>
    </div>
</div>

<div class="container">
    <div class="top-nav">
        <div class="header-title">
            <h1>Sales Target</h1>
        </div>
        <div class="status-pill">
            <div class="dot pulse" id="sync-dot"></div>
            <span id="status-text">Connecting</span>
        </div>
    </div>

    <div class="controls">
        <span class="switch-label">โหมดแก้ไขข้อมูล</span>
        <label class="switch">
            <input type="checkbox" id="editToggle" onchange="handleAuth()">
            <span class="slider"></span>
        </label>
    </div>

    <div class="grid">
        <div class="card">
            <div class="card-head">
                <div class="card-name"><i class="fa-solid fa-credit-card" style="color: var(--ios-blue);"></i> Postpay</div>
                <div class="badge" id="C7_disp">0</div>
            </div>
            
            <div class="group">
                <div class="group-label">New Post</div>
                <div class="row"><span>นวพล</span><input type="number" id="F7" disabled oninput="recalc()"></div>
                <div class="row"><span>ปิยะพร</span><input type="number" id="F8" disabled oninput="recalc()"></div>
                <div class="row"><span>กรทักษ์</span><input type="number" id="F9" disabled oninput="recalc()"></div>
                <div class="summary"><span class="summary-text">Target New Post : </span><span class="summary-val" id="C10_val">0</span></div>
            </div>

            <div class="group">
                <div class="group-label">Existing</div>
                <div class="row"><span>นวพล</span><input type="number" id="F12" disabled oninput="recalc()"></div>
                <div class="row"><span>ปิยะพร</span><input type="number" id="F13" disabled oninput="recalc()"></div>
                <div class="row"><span>กรทักษ์</span><input type="number" id="F14" disabled oninput="recalc()"></div>
                <div class="summary"><span class="summary-text">Target Existing : </span><span class="summary-val" id="C13_val">0</span></div>
            </div>
        </div>

        <div class="card">
            <div class="card-head">
                <div class="card-name"><i class="fa-solid fa-mobile-screen" style="color: var(--ios-green);"></i> Device</div>
                <div class="badge" id="C17_disp" style="background: var(--ios-green);">0</div>
            </div>

            <div class="group">
                <div class="group-label">Apple</div>
                <div class="row"><span>นวพล</span><input type="number" id="F18" disabled oninput="recalc()"></div>
                <div class="row"><span>ปิยะพร</span><input type="number" id="F19" disabled oninput="recalc()"></div>
                <div class="row"><span>กรทักษ์</span><input type="number" id="F20" disabled oninput="recalc()"></div>
                <div class="summary"><span class="summary-text">Target Apple : </span><span class="summary-val" id="C20_val">0</span></div>
            </div>

            <div class="group">
                <div class="group-label">Smartphones</div>
                <div class="row"><span>นวพล</span><input type="number" id="F23" disabled oninput="recalc()"></div>
                <div class="row"><span>ปิยะพร</span><input type="number" id="F24" disabled oninput="recalc()"></div>
                <div class="row"><span>กรทักษ์</span><input type="number" id="F25" disabled oninput="recalc()"></div>
                <div class="summary"><span class="summary-text">Target SmartPhone : </span><span class="summary-val" id="C23_val">0</span></div>
            </div>
        </div>
    </div>

    <button class="fab-save" id="saveBtn" onclick="askSave()">บันทึกการเปลี่ยนแปลง</button>
</div>

<script>
    /* ===== SIDEBAR SYSTEM (1:1 FROM INDEX) ===== */
    const dragBtn = document.getElementById('floatingMenuBtn');
    const sideFloat = document.getElementById('sidebarFloat');
    const sideOverlay = document.getElementById('sidebarOverlay');
    let isDragging = false;
    let startX, startY, shiftX, shiftY;

    function loadButtonPosition() {
        const savedLeft = localStorage.getItem('floatBtnLeft');
        const savedTop = localStorage.getItem('floatBtnTop');
        if (savedLeft && savedTop) {
            dragBtn.style.left = savedLeft + 'px';
            dragBtn.style.top = savedTop + 'px';
        }
    }

    dragBtn.onpointerdown = function(e) {
        isDragging = false;
        startX = e.clientX; startY = e.clientY;
        const rect = dragBtn.getBoundingClientRect();
        shiftX = e.clientX - rect.left; shiftY = e.clientY - rect.top;
        dragBtn.setPointerCapture(e.pointerId);
        document.addEventListener('pointermove', onPointerMove);
        document.addEventListener('pointerup', onPointerUp);
    };

    function onPointerMove(e) {
        if (!isDragging && (Math.abs(e.clientX - startX) > 5 || Math.abs(e.clientY - startY) > 5)) isDragging = true;
        if (isDragging) {
            let newX = e.clientX - shiftX;
            let newY = e.clientY - shiftY;
            newX = Math.max(0, Math.min(newX, window.innerWidth - dragBtn.offsetWidth));
            newY = Math.max(0, Math.min(newY, window.innerHeight - dragBtn.offsetHeight));
            dragBtn.style.left = newX + 'px';
            dragBtn.style.top = newY + 'px';
        }
    }

    function onPointerUp(e) {
        document.removeEventListener('pointermove', onPointerMove);
        document.removeEventListener('pointerup', onPointerUp);
        dragBtn.releasePointerCapture(e.pointerId);
        if (isDragging) {
            localStorage.setItem('floatBtnLeft', dragBtn.offsetLeft);
            localStorage.setItem('floatBtnTop', dragBtn.offsetTop);
        } else {
            toggleSidebarFloat();
        }
        isDragging = false;
    }

    function toggleSidebarFloat() {
        const btnRect = dragBtn.getBoundingClientRect();
        const sidebarWidth = 280;
        let top = btnRect.bottom + 10;
        let left = btnRect.left;
        if (left + sidebarWidth > window.innerWidth) left = window.innerWidth - sidebarWidth - 15;
        if (top + 400 > window.innerHeight) {
            top = btnRect.top - 410;
            if (top < 10) top = 10;
        }
        sideFloat.style.top = top + 'px';
        sideFloat.style.left = left + 'px';
        sideFloat.style.transformOrigin = `${btnRect.left - left + 20}px ${btnRect.top > top ? 'bottom' : 'top'}`;
        const isActive = sideFloat.classList.toggle('active');
        sideOverlay.classList.toggle('active', isActive);
        if (isActive && !sideFloat.innerHTML) loadSidebarContent();
    }

    function closeSidebarFloat() {
        sideFloat.classList.remove('active');
        sideOverlay.classList.remove('active');
    }

    function loadSidebarContent() {
        fetch('sidebar.html')
            .then(res => res.text())
            .then(data => {
                sideFloat.innerHTML = `<div class="sidebar-header">เมนูนำทาง</div>` + data;
                ['credit', 'branch', 'sales'].forEach(id => {
                    if (localStorage.getItem('menu-' + id) === 'true') {
                        const el = sideFloat.querySelector('#menu-' + id);
                        if (el) el.classList.add('open');
                    }
                });
            });
    }

    window.toggleDrop = function(btn, id) {
        const item = btn.parentElement;
        const isOpen = item.classList.toggle("open");
        if (id) localStorage.setItem('menu-' + id, isOpen);
    }

    /* ===== ORIGINAL SALES TARGET SYSTEM (KEEP 100%) ===== */
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxyW3uaL3N-2lkPxWb5VBbKj-XJAUNbCkPjBhL69O0UlTC-1KUtMvOw1pfzhH2M_JSe/exec";
    const ids = ["F7", "F8", "F9", "F12", "F13", "F14", "F18", "F19", "F20", "F23", "F24", "F25"];

    window.addEventListener('DOMContentLoaded', () => {
        loadButtonPosition();
        initApp();
    });

    async function initApp() {
        try {
            const res = await fetch(SCRIPT_URL);
            const data = await res.json();
            ids.forEach(id => { if(document.getElementById(id)) document.getElementById(id).value = data[id] || 0; });
            recalc();
            setStatus('success');
        } catch (e) { setStatus('error'); }
    }

    function recalc() {
        const val = (id) => parseInt(document.getElementById(id).value) || 0;
        const c10 = val('F7') + val('F8') + val('F9');
        const c13 = val('F12') + val('F13') + val('F14');
        const c20 = val('F18') + val('F19') + val('F20');
        const c23 = val('F23') + val('F24') + val('F25');

        document.getElementById('C10_val').innerText = c10.toLocaleString();
        document.getElementById('C13_val').innerText = c13.toLocaleString();
        document.getElementById('C20_val').innerText = c20.toLocaleString();
        document.getElementById('C23_val').innerText = c23.toLocaleString();
        document.getElementById('C7_disp').innerText = (c10 + c13).toLocaleString();
        document.getElementById('C17_disp').innerText = (c20 + c23).toLocaleString();
    }

    function popModal(title, desc, btns, hasPass = false) {
        document.getElementById('mTitle').innerText = title;
        document.getElementById('mDesc').innerText = desc;
        const wrap = document.getElementById('mInputWrapper');
        const bGrid = document.getElementById('mBtnGrid');
        wrap.innerHTML = ''; bGrid.innerHTML = '';

        if(hasPass) {
            const input = document.createElement('input');
            input.type = 'password'; input.className = 'modal-field'; input.id = 'passKey';
            input.placeholder = '••••';
            wrap.appendChild(input);
            setTimeout(() => input.focus(), 300);
            input.onkeydown = (e) => { if(e.key === 'Enter') bGrid.querySelector('.bold').click(); };
        }

        btns.forEach(bInfo => {
            const b = document.createElement('button');
            b.className = `modal-btn ${bInfo.cls || ''}`;
            b.innerText = bInfo.txt;
            b.onclick = () => {
                const p = hasPass ? document.getElementById('passKey').value : null;
                bInfo.fn && bInfo.fn(p);
                closePop();
            };
            bGrid.appendChild(b);
        });

        document.getElementById('modalBox').style.display = 'flex';
        setTimeout(() => document.getElementById('modalInner').classList.add('active'), 50);
    }

    function closePop() {
        document.getElementById('modalInner').classList.remove('active');
        setTimeout(() => document.getElementById('modalBox').style.display = 'none', 300);
    }

    function handleAuth() {
        if(document.getElementById('editToggle').checked) {
            popModal("ยืนยันตัวตน", "กรุณาระบุรหัสผ่านเพื่อปลดล็อกการแก้ไข", [
                { txt: "ยกเลิก", cls: "red", fn: () => document.getElementById('editToggle').checked = false },
                { txt: "ยืนยัน", cls: "bold", fn: (p) => {
                    if(p === "0285") setEdit(true);
                    else {
                        document.getElementById('editToggle').checked = false;
                        setTimeout(() => popModal("รหัสผ่านผิด", "คุณไม่ได้รับอนุญาตให้แก้ไขข้อมูล", [{txt: "ปิด"}]), 400);
                    }
                }}
            ], true);
        } else { setEdit(false); }
    }

    function setEdit(state) {
        ids.forEach(id => document.getElementById(id).disabled = !state);
        document.getElementById('saveBtn').style.display = state ? 'block' : 'none';
    }

    function askSave() {
        popModal("บันทึกข้อมูล", "ยืนยันการบันทึกข้อมูลลงระบบคลาวด์?", [
            { txt: "ยกเลิก", cls: "red" },
            { txt: "บันทึกทันที", cls: "bold", fn: pushData }
        ]);
    }

    async function pushData() {
        document.getElementById('load-screen').style.display = 'flex';
        const p = {};
        ids.forEach(id => p[id] = document.getElementById(id).value);
        p.C10 = document.getElementById('C10_val').innerText.replace(/,/g, '');
        p.C13 = document.getElementById('C13_val').innerText.replace(/,/g, '');
        p.C20 = document.getElementById('C20_val').innerText.replace(/,/g, '');
        p.C23 = document.getElementById('C23_val').innerText.replace(/,/g, '');
        p.C7 = document.getElementById('C7_disp').innerText.replace(/,/g, '');
        p.C17 = document.getElementById('C17_disp').innerText.replace(/,/g, '');

        try {
            await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(p) });
            document.getElementById('load-screen').style.display = 'none';
            popModal("สำเร็จ", "ข้อมูลถูกอัปเดตเรียบร้อยแล้ว", [{txt: "ปิดหน้าต่าง", fn: () => location.reload()}]);
        } catch (e) {
            document.getElementById('load-screen').style.display = 'none';
            popModal("ผิดพลาด", "ไม่สามารถเชื่อมต่อ Server ได้", [{txt: "ตกลง"}]);
        }
    }

    function setStatus(type) {
        const d = document.getElementById('sync-dot');
        const t = document.getElementById('status-text');
        if(type === 'success') { d.style.background = '#34C759'; d.classList.remove('pulse'); t.innerText = 'Connected'; }
        else { d.style.background = '#FF3B30'; t.innerText = 'Sync Error'; }
    }
</script>
</body>
</html>
