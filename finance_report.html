<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>รายงานสินเชื่อรายสาขา - Parakit-site</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --ios-blue: #007aff;
            --ios-green: #34c759;
            --ios-red: #ff3b30;
            --ios-orange: #ff9500;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.4);
            --sidebar-dark: rgba(28, 28, 30, 0.96);
            --text-main: #1c1c1e;
            --text-muted: #8e8e93;
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { 
            box-sizing: border-box; 
            font-family: 'Kanit', sans-serif !important;
            -webkit-tap-highlight-color: transparent;
        }
        
        body { 
            margin: 0; padding: 0; width: 100%; 
            background-color: #f2f2f7;
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 122, 255, 0.08) 0px, transparent 40%),
                radial-gradient(at 100% 0%, rgba(255, 149, 0, 0.05) 0px, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main); 
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* ===== OPTIMIZED FLOATING SIDEBAR ===== */
        #floatingMenuBtn {
            position: fixed;
            top: 10px;
            left: 15px;
            width: 45px;
            height: 45px;
            background: var(--ios-blue);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: move;
            z-index: 2100;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
            border: none;
            touch-action: none;
            will-change: transform;
            backface-visibility: hidden;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s;
        }
        #floatingMenuBtn:active { transform: scale(0.9); }

        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.3);
            z-index: 2000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(4px);
        }
        .sidebar-overlay.active { display: block; opacity: 1; }

        .sidebar-float {
            position: fixed;
            width: 280px;
            max-height: 70vh;
            background: var(--sidebar-dark);
            border-radius: 20px;
            overflow-y: auto;
            z-index: 2001;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.9) translateY(10px);
            transition: opacity 0.25s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            will-change: transform, opacity;
            scrollbar-width: none;
        }
        .sidebar-float::-webkit-scrollbar { display: none; }
        .sidebar-float.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1) translateY(0);
        }

        .sidebar-float .sidebar-header { padding: 20px; font-size: 17px; font-weight: 600; color: #fff; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
        .sidebar-float .menu { padding: 8px 0; }
        .sidebar-float .menu a, .sidebar-float .drop-btn { 
            width: 100%; padding: 12px 20px; background: none; border: none; 
            color: #ebebf5; text-align: left; font-size: 14px; cursor: pointer; 
            display: flex; align-items: center; text-decoration: none; transition: 0.2s;
        }
        .sidebar-float .menu a:hover, .sidebar-float .drop-btn:hover { background: rgba(255,255,255,0.1); }
        .sidebar-float .sub { display: none; background: rgba(0,0,0,0.2); }
        .sidebar-float .item.open .sub { display: block; }
        .sidebar-float .sub a { padding-left: 45px; font-size: 13px; color: #8e8e93; }

        /* ===== MAIN LAYOUT ===== */
        .main-content { 
            width: 100%; 
            padding: 80px 16px 30px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        .report-container { width: 100%; max-width: 1400px; }

        .header-bar { 
            background: var(--glass-bg);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            padding: 20px; 
            border-radius: 20px; 
            display: flex; 
            flex-wrap: wrap;
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 25px; 
            border: 1px solid var(--glass-border);
            gap: 15px;
        }
        .header-bar h2 { font-size: 18px; font-weight: 600; margin: 0; display: flex; align-items: center; gap: 8px; }
        
        .date-input { 
            padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(0,0,0,0.08); 
            font-size: 14px; background: rgba(255,255,255,0.8); 
        }
        
        .btn-fetch { 
            background: var(--ios-blue); color: white; border: none; padding: 10px 20px; 
            border-radius: 10px; cursor: pointer; font-weight: 500;
        }

        .card { 
            background: var(--glass-bg); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 24px; overflow: hidden; 
            border: 1px solid var(--glass-border); 
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            transition: transform 0.3s ease;
        }

        .card-header { 
            padding: 16px 20px; font-weight: 600; font-size: 16px;
            background: rgba(255,255,255,0.3); 
            border-bottom: 1px solid rgba(0,0,0,0.03);
            display: flex; justify-content: space-between; align-items: center; 
        }

        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); padding: 20px; gap: 10px; }
        .stat-box { 
            padding: 15px 10px; border-radius: 16px; 
            background: rgba(255,255,255,0.4); 
            display: flex; flex-direction: column; align-items: center; 
            border: 1px solid rgba(255,255,255,0.6);
        }
        .stat-label { font-size: 11px; font-weight: 500; color: var(--text-muted); margin-bottom: 4px; text-align: center; }
        .stat-value { font-size: 24px; font-weight: 700; }

        .table-wrapper { width: 100%; overflow-x: auto; padding-bottom: 10px; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { 
            padding: 12px 8px; font-size: 11px; font-weight: 600; 
            color: var(--text-muted); text-transform: uppercase; text-align: center;
        }
        td { padding: 12px 8px; font-size: 14px; text-align: center; border-bottom: 1px solid rgba(0,0,0,0.02); }
        
        .shop-name { 
            font-weight: 600; text-align: left !important; padding-left: 15px; 
            color: var(--text-main); position: sticky; left: 0; 
            background: rgba(255,255,255,0.95); z-index: 10; min-width: 140px; 
        }

        .badge { 
            padding: 4px 8px; border-radius: 8px; font-size: 10px; font-weight: 600; 
            display: inline-block;
        }
        .c1 { background: #ffebee; color: #ef5350; } 
        .c2 { background: #e8f5e9; color: #4caf50; }
        .c3 { background: #e3f2fd; color: #2196f3; } 
        .c4 { background: #fff3e0; color: #ff9800; }
        .c5 { background: #f3e5f5; color: #9c27b0; }

        .chart-container { padding: 10px; width: 100%; }
        .iframe-wrap { 
            width: 100%; aspect-ratio: 16 / 9; 
            border-radius: 15px; overflow: hidden; 
            border: 1px solid var(--glass-border);
        }
        .iframe-wrap iframe { width: 100%; height: 100%; border: none; }
        
        .loading-overlay { 
            position: fixed; inset: 0; background: rgba(255,255,255,0.85); 
            display: none; flex-direction: column; justify-content: center; 
            align-items: center; z-index: 3000; backdrop-filter: blur(10px); 
        }
        .spinner { width: 35px; height: 35px; border: 3px solid rgba(0,0,0,0.05); border-top: 3px solid var(--ios-blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        footer { text-align: center; padding: 30px 20px; color: var(--text-muted); font-size: 11px; }
        .col-total { background: rgba(0, 122, 255, 0.05) !important; font-weight: 700 !important; color: var(--ios-blue) !important; }

        @media (max-width: 600px) {
            .stat-value { font-size: 20px; }
            .header-bar h2 { font-size: 16px; }
            .main-content { padding-top: 70px; }
        }
    </style>
</head>
<body id="mainBody">

<div class="loading-overlay" id="loader">
    <div class="spinner"></div>
    <span style="color: var(--text-main); font-weight: 500; margin-top: 15px;">กำลังดึงข้อมูลกรุณารอสักครู่...</span>
</div>

<button id="floatingMenuBtn" title="ลากเพื่อย้าย">เมนู</button>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebarFloat()"></div>
<aside class="sidebar-float" id="sidebarFloat"></aside>

<main class="main-content">
    <div class="report-container">
        
        <div class="header-bar">
            <div>
                <h2>📊 ระบบจัดการรายงานสินเชื่อ</h2>
            </div>
            <div style="display:flex; align-items:center; gap:8px;">
                <input type="date" id="targetDate" class="date-input">
                <button class="btn-fetch" onclick="refreshData()">🚀 ดึงข้อมูล</button>
            </div>
        </div>

        <div id="dashboard-content">
            
            <div class="card" style="border-top: 4px solid var(--ios-orange);">
                <div class="card-header"><span>📋 ภาพรวมผลการสมัคร (App In)</span></div>
                <div class="stat-grid">
                    <div class="stat-box">
                        <div class="stat-label">ยอดสมัครทั้งหมด</div>
                        <div id="stat-appin" class="stat-value">0</div>
                    </div>
                    <div class="stat-box" style="background: rgba(52, 199, 89, 0.1);">
                        <div class="stat-label" style="color: var(--ios-green);">ผ่านการอนุมัติ</div>
                        <div id="stat-approved" class="stat-value" style="color: var(--ios-green);">0</div>
                    </div>
                    <div class="stat-box" style="background: rgba(255, 59, 48, 0.1);">
                        <div class="stat-label" style="color: var(--ios-red);">ไม่ผ่านการอนุมัติ</div>
                        <div id="stat-rejected" class="stat-value" style="color: var(--ios-red);">0</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><span>📈 แนวโน้มยอดสินเชื่อสะสมรายเดือน</span></div>
                <div class="chart-container">
                    <div class="iframe-wrap">
                        <iframe seamless frameborder="0" scrolling="yes" src="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ6-tg6_zQhxuiO4IMG5OkJRoWUHosvKa6iCiTGkdzURgNxpLrXIu5F7zcQNBG8Oa9ZgS3ab7vFL1HQ/pubchart?oid=903541046&amp;format=interactive"></iframe>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span>📅 ผลการดำเนินงานรายวัน: <small id="date-label" style="color:var(--ios-blue); margin-left:10px;"></small></span>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead><tr id="h-daily"></tr></thead>
                        <tbody id="b-daily"></tbody>
                    </table>
                </div>
            </div>

            <div class="card" style="border-top: 4px solid var(--ios-blue);">
                <div class="card-header">
                    <span>⭐ สรุปยอดสะสมประจำเดือน: <span id="month-label" style="color:var(--ios-blue); margin-left:5px;"></span></span>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead><tr id="h-month"></tr></thead>
                        <tbody id="b-month"></tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><span>💡 วิเคราะห์เหตุผลการไม่ตัดสินใจ</span></div>
                <div class="table-wrapper reason-table-container">
                    <table>
                        <thead><tr id="h-reason"></tr></thead>
                        <tbody id="b-reason"></tbody>
                    </table>
                </div>
            </div>

        </div>

        <footer>© 2026 Copyright By Angerina Frog</footer>
    </div>
</main>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxtVarfEdENjtmWIxiMszOQjE4Ikz-1XaXHammfUIE310IHEE8bqnWfevkBsrQCFDuskg/exec"; 

    window.onload = () => {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('targetDate').value = today;
        loadButtonPosition();
        refreshData();
    };

    const dragBtn = document.getElementById('floatingMenuBtn');
    const sideFloat = document.getElementById('sidebarFloat');
    const sideOverlay = document.getElementById('sidebarOverlay');
    let isDragging = false;
    let startX, startY, shiftX, shiftY;

    function loadButtonPosition() {
        const savedLeft = localStorage.getItem('floatBtnLeft');
        const savedTop = localStorage.getItem('floatBtnTop');
        if (savedLeft && savedTop) {
            dragBtn.style.left = savedLeft + 'px';
            dragBtn.style.top = savedTop + 'px';
        }
    }

    dragBtn.addEventListener('pointerdown', (e) => {
        isDragging = false;
        startX = e.clientX; startY = e.clientY;
        const rect = dragBtn.getBoundingClientRect();
        shiftX = e.clientX - rect.left;
        shiftY = e.clientY - rect.top;
        dragBtn.setPointerCapture(e.pointerId);
        
        const moveHandler = (ev) => {
            if (!isDragging && (Math.abs(ev.clientX - startX) > 5 || Math.abs(ev.clientY - startY) > 5)) isDragging = true;
            if (isDragging) {
                let x = ev.clientX - shiftX;
                let y = ev.clientY - shiftY;
                x = Math.max(0, Math.min(x, window.innerWidth - dragBtn.offsetWidth));
                y = Math.max(0, Math.min(y, window.innerHeight - dragBtn.offsetHeight));
                dragBtn.style.left = x + 'px';
                dragBtn.style.top = y + 'px';
            }
        };

        const upHandler = (ev) => {
            document.removeEventListener('pointermove', moveHandler);
            document.removeEventListener('pointerup', upHandler);
            dragBtn.releasePointerCapture(ev.pointerId);
            if (isDragging) {
                localStorage.setItem('floatBtnLeft', dragBtn.offsetLeft);
                localStorage.setItem('floatBtnTop', dragBtn.offsetTop);
            } else { toggleSidebarFloat(); }
            isDragging = false;
        };

        document.addEventListener('pointermove', moveHandler, { passive: true });
        document.addEventListener('pointerup', upHandler);
    });

    function toggleSidebarFloat() {
        const btnRect = dragBtn.getBoundingClientRect();
        let top = btnRect.bottom + 10;
        let left = btnRect.left;
        if (left + 280 > window.innerWidth) left = window.innerWidth - 295;
        if (top + 400 > window.innerHeight) top = Math.max(10, btnRect.top - 410);
        
        sideFloat.style.top = top + 'px';
        sideFloat.style.left = left + 'px';
        const isActive = sideFloat.classList.toggle('active');
        sideOverlay.classList.toggle('active', isActive);
        if (isActive && !sideFloat.innerHTML) loadSidebarContent();
    }

    function closeSidebarFloat() {
        sideFloat.classList.remove('active');
        sideOverlay.classList.remove('active');
    }

    function loadSidebarContent() {
        fetch('sidebar.html')
            .then(res => res.text())
            .then(data => {
                sideFloat.innerHTML = `<div class="sidebar-header">เมนูนำทาง</div>` + data;
                ['credit', 'branch', 'sales'].forEach(id => {
                    if (localStorage.getItem('menu-' + id) === 'true') {
                        const el = sideFloat.querySelector('#menu-' + id);
                        if (el) el.classList.add('open');
                    }
                });
            });
    }

    window.toggleDrop = function(btn, id) {
        const item = btn.parentElement;
        const isOpen = item.classList.toggle("open");
        if (id) localStorage.setItem('menu-' + id, isOpen);
    }

    async function refreshData() {
        const date = document.getElementById('targetDate').value;
        const loader = document.getElementById('loader');
        loader.style.display = 'flex';
        try {
            const response = await fetch(`${WEB_APP_URL}?date=${date}`);
            const data = await response.json();
            renderTable(data.dailyTable, 'daily');
            renderTable(data.monthlyTable, 'month');
            document.getElementById('date-label').innerText = date;
            document.getElementById('month-label').innerText = data.displayMonth;
            if(data.appStats) {
                document.getElementById('stat-appin').innerText = data.appStats.appIn.toLocaleString();
                document.getElementById('stat-approved').innerText = data.appStats.approved.toLocaleString();
                document.getElementById('stat-rejected').innerText = data.appStats.rejected.toLocaleString();
            }
            if(data.reasonTable) { renderReasonTable(data.reasonTable); }
            loader.style.display = 'none';
        } catch (error) {
            console.error(error);
            alert("ไม่สามารถดึงข้อมูลได้ค่ะแม่!");
            loader.style.display = 'none';
        }
    }

    function renderTable(tableObj, type) {
        let headerHtml = `<th>ชื่อสาขา</th>` + 
            tableObj.loanTypes.map((n, i) => `<th><span class="badge c${(i % 5) + 1}">${n}</span></th>`).join('');
        
        // เพิ่มช่องรวมทั้ง Daily และ Month
        headerHtml += `<th class="col-total">🏆 รวม</th>`;
        
        document.getElementById('h-' + type).innerHTML = headerHtml;
        let html = '';
        tableObj.branches.forEach(branch => {
            let rowTotal = 0;
            html += `<tr><td class="shop-name">${branch}</td>`;
            tableObj.loanTypes.forEach(t => {
                const val = tableObj.data[branch][t] || 0;
                rowTotal += val;
                html += `<td style="${val > 0 ? 'font-weight:600; color:var(--ios-blue)' : 'color:#cbd5e1'}">${val.toLocaleString()}</td>`;
            });
            html += `<td class="col-total">${rowTotal.toLocaleString()}</td>`;
            html += `</tr>`;
        });
        document.getElementById('b-' + type).innerHTML = html;
    }

    function renderReasonTable(tableObj) {
        const headerRow = document.getElementById('h-reason');
        headerRow.innerHTML = `<th>ชื่อสาขา</th>` + 
            tableObj.headers.map(h => `<th><span class="badge" style="background:rgba(0,0,0,0.05); color:var(--text-muted);">${h}</span></th>`).join('');
        let html = '';
        tableObj.branches.forEach(branch => {
            html += `<tr><td class="shop-name">${branch}</td>`;
            tableObj.headers.forEach(h => {
                const val = (tableObj.data[branch] && tableObj.data[branch][h]) ? tableObj.data[branch][h] : 0;
                html += `<td style="${val > 0 ? 'font-weight:600; color:var(--ios-blue)' : 'color:#cbd5e1'}">${val.toLocaleString()}</td>`;
            });
            html += `</tr>`;
        });
        document.getElementById('b-reason').innerHTML = html;
    }
</script>
</body>
</html>
