<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตารางวันหยุด กุมภาพันธ์ - Parakit-Site</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root {
            --ios-blue: #007aff;
            --ios-bg: #f2f2f7;
            --glass-white: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.5);
            --sidebar-dark: rgba(28, 28, 30, 0.94);
            --text-main: #1c1c1e;
            --text-light: #8e8e93;
            --sidebar-width: 280px;
            --transition-swift: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --header-gradient: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
        }

        /* ===== GLOBAL RESET & SIDEBAR ADAPTATION ===== */
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif !important; }
        
        body { 
            margin: 0; 
            background-color: var(--ios-bg);
            color: var(--text-main); 
            -webkit-font-smoothing: antialiased;
            transition: padding-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ===== Header Navbar ===== */
        .top-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 60px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            z-index: 1200;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 0.5px solid rgba(0,0,0,0.1);
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .top-toggle {
            width: 36px; height: 36px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--ios-blue);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            transition: background 0.2s;
        }
        .top-toggle:hover { background: rgba(0, 122, 255, 0.1); }

        /* ===== Sidebar Style ===== */
        .sidebar { 
            position: fixed; top: 0; left: 0; 
            width: var(--sidebar-width); height: 100vh; 
            background: var(--sidebar-dark); 
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            color: #fff; overflow-y: auto; 
            transition: all .3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 2000;
            box-shadow: 10px 0 30px rgba(0,0,0,0.1);
        }
        
        @media(min-width:769px) { 
            body:not(.collapsed) { padding-left: var(--sidebar-width); }
            body:not(.collapsed) .top-header { left: var(--sidebar-width); }
            body.collapsed .sidebar { transform: translateX(-100%); }
            body.collapsed .top-header { left: 0; }
        }

        @media(max-width:768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.show { transform: translateX(0); }
            body { padding-left: 0 !important; }
            .top-header { left: 0 !important; }
        }

        .overlay { 
            position: fixed; inset: 0; 
            background: rgba(0, 0, 0, 0.3); 
            backdrop-filter: blur(4px); 
            display: none; z-index: 1500; 
        }
        .overlay.show { display: block; }

        .sidebar-header { padding: 30px 20px; font-size: 20px; font-weight: 600; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
        .menu { padding: 10px 0; }
        .menu a, .menu .drop-btn { 
            width: 100%; min-height: 50px; padding: 12px 20px; background: none; border: none; 
            color: #ebebf5; text-align: left; font-size: 15px; cursor: pointer; 
            display: flex; align-items: center; text-decoration: none; transition: 0.3s;
        }
        .menu a:hover, .menu .drop-btn:hover { background: rgba(255,255,255,0.1); padding-left: 30px; }
        .sub { display: none; background: rgba(0,0,0,0.2); }
        .item.open .sub { display: block; }
        .sub a { padding-left: 45px; font-size: 14px; color: #8e8e93; }

        /* ===== Calendar Specific Styles ===== */
        .content-area { padding: 80px 20px 40px; max-width: 1300px; margin: 0 auto; animation: fadeIn 0.8s ease-out; }
        
        .glass { 
            background: var(--glass-white); 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px); 
            border-radius: 30px; 
            border: 1px solid var(--glass-border); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
        }

        .calendar-wrapper { overflow: hidden; border-radius: 30px; background: white; }
        .day-cell { 
            height: 140px; 
            background: rgba(255, 255, 255, 0.6); 
            border-right: 1px solid rgba(0,0,0,0.03); 
            border-bottom: 1px solid rgba(0,0,0,0.03); 
            transition: all 0.2s ease;
            cursor: pointer;
            overflow: hidden; 
            padding: 8px;
        }
        .day-cell:hover { background: rgba(255, 255, 255, 0.9); z-index: 10; box-shadow: inset 0 0 0 2px #0071e3; }

        .day-header { 
            font-size: 0.85rem; 
            font-weight: 600; 
            color: #8e8e93; 
            padding: 12px 0; 
            background: rgba(255, 255, 255, 0.8);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .cell-content { display: flex; flex-wrap: wrap; gap: 4px; align-items: flex-start; }
        .date-number { 
            font-size: 1.1rem; 
            font-weight: 600; 
            color: #1d1d1f;
            min-width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .current-day .date-number { background: #0071e3; color: white; border-radius: 50%; }

        /* ขยายขนาด Tag และตัวหนังสือ */
        .emp-tag { 
            font-size: 13px; 
            width: 58px; height: 58px; 
            padding: 4px; border-radius: 12px; color: white; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; line-height: 1.1; word-break: break-all; font-weight: 600;
            box-shadow: 0 4px 6px rgba(0,0,0,0.08); transition: transform 0.1s;
        }

        /* ปรับปรุงขนาดและน้ำหนักตัวอักษรภาษาอังกฤษในวงเล็บ */
        .status-label {
            font-size: 11px; /* ขยายขนาด */
            font-weight: 800; /* ทำให้หนาขึ้น */
            margin-top: 1px;
            text-transform: uppercase;
        }

        /* ปรับปรุงสีตามคำขอ */
        .st-Work { background: #34c759; } 
        .st-V { background: #ff3b30; }    
        .st-SICK { background: #8e8e93; }  
        .st-EVENT { background: #FFD60A; color: #1c1c1e; } /* เปลี่ยนเป็นสีเหลือง + ตัวหนังสือดำเพื่อให้เห็นชัด */
        .st-PH { background: #ff9500; }    
        .st-H { background: #af52de; }    

        #toast {
            position: fixed;
            top: 80px; left: 50%;
            transform: translateX(-50%) translateY(-150px);
            z-index: 3000;
            transition: transform 0.5s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }
        #toast.show { transform: translateX(-50%) translateY(0); }

        #loading { position: fixed; inset: 0; background: rgba(245,245,247,0.7); backdrop-filter: blur(15px); z-index: 4000; display: none; justify-content: center; align-items: center; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header class="top-header">
    <button class="top-toggle" onclick="toggleSidebar()">☰</button>
    <div style="font-weight: 700; font-size: 1.25rem; color: var(--text-main); letter-spacing: -0.8px; margin-left: 10px;">ตารางวันหยุดทรูช้อปบิ๊กซีประชาอุทิศ</div>
</header>

<div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

<aside class="sidebar" id="sidebar"></aside>

<div id="toast">
    <div class="glass px-6 py-3 shadow-2xl flex items-center gap-3 border border-white/50">
        <span id="toastIcon"></span>
        <p id="toastMsg" class="font-medium text-sm"></p>
    </div>
</div>

<div id="loading">
    <div class="flex flex-col items-center">
        <div class="animate-spin rounded-full h-12 w-12 border-t-4 border-b-4 border-blue-500 mb-4"></div>
        <p class="text-blue-500 font-semibold tracking-wide">กำลังซิงค์ข้อมูล...</p>
    </div>
</div>

<main class="content-area">
    <div class="max-w-7xl mx-auto glass shadow-2xl overflow-hidden mb-12">
        <div class="p-8 flex flex-wrap justify-between items-center gap-6" style="background: var(--header-gradient); border-bottom: 1px solid rgba(255,255,255,0.3);">
            <div>
                <h1 class="text-3xl font-semibold text-white drop-shadow-sm">ตารางวันหยุด</h1>
                <p class="text-white/80 font-light">ทรูช้อปบิ๊กซีประชาอุทิศ</p>
            </div>
            <div class="flex gap-4">
                <select id="mSel" class="p-3 px-6 rounded-2xl border-none shadow-lg bg-white/90 font-semibold outline-none cursor-pointer hover:bg-white transition-all w-44"></select>
                <select id="ySel" class="p-3 px-6 rounded-2xl border-none shadow-lg bg-white/90 font-semibold outline-none cursor-pointer hover:bg-white transition-all w-32"></select>
            </div>
        </div>

        <div class="calendar-wrapper">
            <div class="grid grid-cols-7 text-center">
                <div class="day-header">อา.</div>
                <div class="day-header">จ.</div>
                <div class="day-header">อ.</div>
                <div class="day-header">พ.</div>
                <div class="day-header">พฤ.</div>
                <div class="day-header">ศ.</div>
                <div class="day-header">ส.</div>
            </div>
            <div id="calendarGrid" class="grid grid-cols-7"></div>
        </div>
    </div>

    <footer class="max-w-7xl mx-auto text-center pb-10">
        <p class="text-sm text-gray-400 font-light">© 2026 Copy Right By Angerina Frog</p>
    </footer>
</main>

<div id="modal" class="fixed inset-0 bg-black/30 hidden z-[2500] flex justify-center items-center p-4 backdrop-blur-sm">
    <div class="bg-white/95 rounded-[35px] p-8 w-full max-w-md shadow-2xl border border-white">
        <h2 id="modalDate" class="text-2xl font-semibold mb-2 text-center text-gray-800"></h2>
        <div id="existingEntries" class="mb-6 space-y-2 max-h-40 overflow-y-auto pr-2"></div>
        <div class="space-y-4">
            <div class="bg-gray-50 p-5 rounded-3xl space-y-3 border border-gray-100">
                <select id="empId" class="w-full p-3.5 bg-white rounded-2xl border border-gray-200 outline-none font-medium text-sm">
                    <option value="1100">ศุภกฤต (1100)</option>
                    <option value="3535">นวพล (3535)</option>
                    <option value="3400">ปิยะพร (3400)</option>
                    <option value="3723">กรทักษ์ (3723)</option>
                </select>
                <select id="status" class="w-full p-3.5 bg-white rounded-2xl border border-gray-200 outline-none font-medium text-sm">
                    <option value="Work">🟢 มาทำงาน (Work)</option>
                    <option value="V">🔴 ลาพักร้อน (V)</option>
                    <option value="SICK">⚪ ลาป่วย (Sick)</option>
                    <option value="EVENT">🟡 ออกอีเว้นท์ (EVENT)</option>
                    <option value="PH">🟠 วันหยุดนักขัตฤกษ์ (PH)</option>
                    <option value="H">🟣 วันหยุดประจำสัปดาห์ (H)</option>
                </select>
            </div>
            <div class="flex gap-3 pt-2">
                <button onclick="closeModal()" class="flex-1 py-4 bg-gray-100 rounded-2xl font-semibold text-gray-500">ยกเลิก</button>
                <button onclick="save()" class="flex-1 py-4 bg-blue-600 text-white rounded-2xl font-semibold shadow-lg shadow-blue-200">บันทึก</button>
            </div>
        </div>
    </div>
</div>

<div id="confirmModal" class="fixed inset-0 bg-black/40 hidden z-[3000] flex flex-col justify-end p-4 backdrop-blur-sm">
    <div class="max-w-md mx-auto w-full">
        <div class="bg-white/90 rounded-2xl overflow-hidden mb-3">
            <div class="p-5 text-center border-bottom border-gray-100">
                <p class="text-sm text-gray-600">คุณต้องการลบข้อมูลพนักงานคนนี้ใช่หรือไม่?</p>
            </div>
            <button id="confirmOk" class="w-full py-4 text-red-500 font-semibold text-lg bg-white/50 border-t border-gray-100">ลบข้อมูล</button>
        </div>
        <button id="confirmCancel" class="w-full py-4 bg-white rounded-2xl font-bold text-blue-500 text-lg shadow-xl">ยกเลิก</button>
    </div>
</div>

<script>
    // --- SIDEBAR SYSTEM ---
    function includeSidebar() {
        const cached = localStorage.getItem('sidebar_cache');
        if (cached) {
            document.getElementById('sidebar').innerHTML = cached;
            restoreMenuState();
        }

        fetch('sidebar.html')
            .then(response => response.text())
            .then(data => {
                if (data !== cached) {
                    document.getElementById('sidebar').innerHTML = data;
                    localStorage.setItem('sidebar_cache', data);
                    restoreMenuState();
                }
            })
            .catch(err => console.warn("Sidebar Load Error"));
            
        if(localStorage.getItem('sidebar_collapsed') === 'true' && window.innerWidth > 768) {
            document.body.classList.add('collapsed');
        }
    }

    function toggleSidebar() {
        if (window.innerWidth <= 768) {
            document.getElementById("sidebar").classList.toggle("show");
            document.getElementById("overlay").classList.toggle("show");
        } else {
            const isCollapsed = document.body.classList.toggle("collapsed");
            localStorage.setItem('sidebar_collapsed', isCollapsed);
        }
    }

    window.toggleDrop = function(btn, id) {
        const item = btn.parentElement;
        const isOpen = item.classList.toggle("open");
        if (id) localStorage.setItem('menu-' + id, isOpen);
    }

    function restoreMenuState() {
        ['credit', 'branch', 'sales'].forEach(id => {
            if (localStorage.getItem('menu-' + id) === 'true') {
                const el = document.getElementById('menu-' + id);
                if (el) el.classList.add('open');
            }
        });
    }

    // --- CALENDAR LOGIC ---
    const URL = "https://script.google.com/macros/s/AKfycbwqlWkhMFrhiTvySSSwPt7sd0aLJyW9I6g4HlnmdgX7l8SI0yBAKEEAZEKvT0fOr2VzqA/exec"; 
    let db = [];
    let selDate = "";
    const months = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];

    function showToast(msg, type = 'success') {
        const toast = document.getElementById('toast');
        const icon = document.getElementById('toastIcon');
        const text = document.getElementById('toastMsg');
        text.innerText = msg;
        icon.innerHTML = type === 'success' ? '✅' : '⚠️';
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    function showConfirm(callback) {
        const modal = document.getElementById('confirmModal');
        const okBtn = document.getElementById('confirmOk');
        const cancelBtn = document.getElementById('confirmCancel');
        modal.style.display = 'flex';
        const close = () => { modal.style.display = 'none'; };
        okBtn.onclick = () => { callback(); close(); };
        cancelBtn.onclick = close;
        modal.onclick = (e) => { if(e.target === modal) close(); };
    }

    async function init() {
        includeSidebar(); 
        const mS = document.getElementById('mSel');
        const yS = document.getElementById('ySel');
        months.forEach((m, i) => mS.innerHTML += `<option value="${i}">${m}</option>`);
        for(let y=2024; y<=2030; y++) yS.innerHTML += `<option value="${y}">${y+543}</option>`;
        mS.value = new Date().getMonth();
        yS.value = new Date().getFullYear();
        mS.onchange = yS.onchange = () => render();
        await refreshData();
    }

    async function refreshData() {
        showLoad(true);
        try {
            const res = await fetch(URL + "?action=get");
            db = await res.json();
            render();
        } catch(e) { showToast("ไม่สามารถเชื่อมต่อข้อมูลได้", "error"); }
        showLoad(false);
    }

    function render() {
        const grid = document.getElementById('calendarGrid');
        grid.innerHTML = "";
        const m = parseInt(document.getElementById('mSel').value);
        const y = parseInt(document.getElementById('ySel').value);
        const first = new Date(y, m, 1).getDay();
        const last = new Date(y, m+1, 0).getDate();
        const today = new Date();

        for(let i=0; i<first; i++) grid.innerHTML += `<div class="day-cell bg-gray-50/20"></div>`;

        for(let d=1; d<=last; d++) {
            const dateKey = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
            const isToday = today.getDate() === d && today.getMonth() === m && today.getFullYear() === y;
            const records = db.filter(r => r.date === dateKey);
            let tags = records.map(r => `
                <div class="emp-tag st-${r.status}" title="${r.empName}">
                    <span class="leading-tight text-[13px]">${r.empName}</span>
                    <span class="status-label">(${r.status})</span>
                </div>
            `).join('');

            grid.innerHTML += `
                <div class="day-cell ${isToday ? 'current-day' : ''}" onclick="openModal('${dateKey}')">
                    <div class="cell-content">
                        <div class="date-number">${d}</div>
                        ${tags}
                    </div>
                </div>
            `;
        }
    }

    function openModal(d) {
        selDate = d;
        const [y, m, day] = d.split('-');
        document.getElementById('modalDate').innerText = `${parseInt(day)} ${months[parseInt(m)-1]} ${parseInt(y)+543}`;
        const list = document.getElementById('existingEntries');
        list.innerHTML = "";
        const records = db.filter(r => r.date === d);
        if(records.length > 0) {
            records.forEach(r => {
                list.innerHTML += `
                <div class="flex justify-between items-center bg-white p-3 rounded-2xl border border-gray-100 shadow-sm">
                    <div class="flex items-center gap-2">
                        <div class="w-2 h-2 rounded-full st-${r.status}"></div>
                        <p class="font-medium text-gray-700 text-sm">${r.empName} (${r.status})</p>
                    </div>
                    <button onclick="event.stopPropagation(); deleteEntry('${r.date}', '${r.empId}')" class="text-red-500 hover:bg-red-50 p-2 rounded-xl transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                        </svg>
                    </button>
                </div>`;
            });
        } else {
            list.innerHTML = `<div class="py-4 text-center text-gray-300 font-light italic text-xs">ว่างเปล่า</div>`;
        }
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    async function save() {
        const id = document.getElementById('empId').value;
        const st = document.getElementById('status').value;
        const name = document.getElementById('empId').options[document.getElementById('empId').selectedIndex].text.split(' (')[0];
        showLoad(true);
        try {
            const res = await fetch(URL, {
                method: 'POST',
                body: JSON.stringify({ date: selDate, empId: id, empName: name, status: st })
            });
            const out = await res.json();
            if(out.status === "duplicate") {
                showToast("มีข้อมูลพนักงานคนนี้อยู่แล้ว", "error");
            } else {
                showToast("บันทึกข้อมูลเรียบร้อย");
                closeModal();
                await refreshData();
            }
        } catch(e) { closeModal(); await refreshData(); }
        showLoad(false);
    }

    async function deleteEntry(date, empId) {
        showConfirm(async () => {
            showLoad(true);
            try {
                const response = await fetch(`${URL}?action=delete&date=${date}&empId=${empId}`);
                const result = await response.json();
                if (result.status === "success") {
                    showToast("ลบข้อมูลสำเร็จ");
                    closeModal();
                    await refreshData();
                } else { showToast("เกิดข้อผิดพลาดในการลบ", "error"); }
            } catch(e) { closeModal(); await refreshData(); }
            showLoad(false);
        });
    }

    function showLoad(v) { document.getElementById('loading').style.display = v ? 'flex' : 'none'; }

    init();
</script>
</body>
</html>
