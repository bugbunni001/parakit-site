<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ส่งยอดขายสิ้นวัน - Parakit-site</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --ios-blue: #007aff;
            --ios-bg: #f2f2f7;
            --glass-white: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.5);
            --sidebar-dark: rgba(28, 28, 30, 0.96);
            --text-main: #1c1c1e;
            --text-light: #8e8e93;
        }

        body { 
            font-family: 'Kanit', sans-serif; 
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%); 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
            margin: 0;
            padding-top: 60px; /* เว้นที่ให้ Top Header */
        }

        /* ===== Header Navbar ===== */
        .top-header {
            position: fixed; top: 0; left: 0; right: 0; height: 60px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            z-index: 1000; display: flex; align-items: center; 
            padding: 0 20px 0 75px;
            border-bottom: 0.5px solid rgba(0,0,0,0.1);
        }

        /* ===== Floating Draggable Button ===== */
        #floatingMenuBtn {
            position: fixed; top: 10px; left: 15px; width: 45px; height: 45px;
            background: var(--ios-blue); color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; cursor: move; z-index: 2100;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4); border: none;
            touch-action: none; transition: transform 0.2s, opacity 0.2s;
        }
        #floatingMenuBtn:active { transform: scale(0.9); }

        /* ===== Sidebar Style ===== */
        .sidebar-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.2);
            z-index: 2000; display: none; opacity: 0; transition: opacity 0.3s;
        }
        .sidebar-overlay.active { display: block; opacity: 1; }

        .sidebar-float {
            position: fixed; width: 280px; max-height: 70vh;
            background: var(--sidebar-dark); border-radius: 20px;
            overflow-y: auto; z-index: 2001; opacity: 0; visibility: hidden;
            transform: scale(0.8) translateY(10px);
            transition: opacity 0.3s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar-float.active { opacity: 1; visibility: visible; transform: scale(1) translateY(0); }
        .sidebar-float .sidebar-header { padding: 20px; font-size: 17px; font-weight: 600; color: #fff; border-bottom: 0.5px solid rgba(255,255,255,0.1); }

        /* ===== Main Container ===== */
        .glass-container { 
            background: rgba(255, 255, 255, 0.4); 
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.3); 
            border-radius: 2rem; 
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05); 
            width: 100%; max-width: 400px; 
            padding: 2.5rem 2rem; text-align: center; 
        }

        .btn-ios { transition: all 0.3s ease; border-radius: 1rem; font-weight: 600; font-size: 1.1rem; }
        
        /* SweetAlert Custom UI */
        .swal2-popup { font-family: 'Kanit', sans-serif !important; border-radius: 1.5rem !important; width: 90% !important; max-width: 480px !important; padding: 1.25rem !important; font-size: 0.95rem !important; }
        .section-header { border-left: 5px solid #3b82f6; padding-left: 10px; margin: 1.2rem 0 0.6rem 0; font-weight: 600; color: #1e3a8a; font-size: 1.05rem; text-align: left; }
        .row-label { font-size: 0.95rem; font-weight: 600; color: #4b5563; margin-bottom: 4px; display: block; text-align: left; }
        .input-row-container { display: flex !important; gap: 8px !important; margin-bottom: 10px; }
        .input-col { flex: 1 !important; }
        .inner-label { font-size: 0.8rem; color: #3b82f6; font-weight: 600; margin-bottom: 2px; text-align: left; }
        input, select { border-radius: 0.7rem !important; border: 1.5px solid rgba(0,0,0,0.1) !important; padding: 8px 12px !important; font-size: 0.95rem !important; width: 100% !important; outline: none; }
        pre { white-space: pre-wrap; word-wrap: break-word; line-height: 1.5; }

        footer { margin-top: 2rem; font-size: 0.85rem; color: #64748b; text-align: center; }
    </style>
</head>
<body>

    <header class="top-header">
        <div style="font-weight: 700; font-size: 1.25rem; color: var(--text-main); letter-spacing: -0.8px;">ส่งยอดขายสิ้นวัน</div>
    </header>

    <button id="floatingMenuBtn" title="ลากเพื่อย้าย">เมนู</button>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebarFloat()"></div>
    <aside class="sidebar-float" id="sidebarFloat"></aside>

    <div class="glass-container">
        <h2 class="text-xl font-semibold text-gray-800 mb-1">Sale Report</h2>
        <p class="text-gray-500 text-xs mb-6">จัดเก็บข้อมูลยอดขายสิ้นวันแต่ละสาขา</p>
        <div class="space-y-3">
            <button onclick="showAddModal()" class="btn-ios w-full bg-blue-500 text-white py-4 shadow-lg shadow-blue-200 hover:bg-blue-600">เพิ่มข้อมูลใหม่</button>
            <button onclick="showFetchModal()" class="btn-ios w-full bg-white text-gray-700 py-4 shadow-sm border border-gray-100 hover:bg-gray-50">ดึงข้อมูลสรุป</button>
        </div>
    </div>

    <footer>© 2026 Copy Right By Angerina Frog</footer>

    <script>
        // --- ระบบ Draggable Sidebar Logic (1:1) ---
        const dragBtn = document.getElementById('floatingMenuBtn');
        const sideFloat = document.getElementById('sidebarFloat');
        const sideOverlay = document.getElementById('sidebarOverlay');
        let isDragging = false;
        let startX, startY, shiftX, shiftY;

        function loadButtonPosition() {
            const savedLeft = localStorage.getItem('floatBtnLeft');
            const savedTop = localStorage.getItem('floatBtnTop');
            if (savedLeft && savedTop) {
                dragBtn.style.left = savedLeft + 'px';
                dragBtn.style.top = savedTop + 'px';
            }
        }

        dragBtn.onpointerdown = function(e) {
            isDragging = false;
            startX = e.clientX; startY = e.clientY;
            const rect = dragBtn.getBoundingClientRect();
            shiftX = e.clientX - rect.left;
            shiftY = e.clientY - rect.top;
            dragBtn.setPointerCapture(e.pointerId);
            document.addEventListener('pointermove', onPointerMove);
            document.addEventListener('pointerup', onPointerUp);
        };

        function onPointerMove(e) {
            if (!isDragging && (Math.abs(e.clientX - startX) > 5 || Math.abs(e.clientY - startY) > 5)) isDragging = true;
            if (isDragging) {
                let newX = e.clientX - shiftX;
                let newY = e.clientY - shiftY;
                newX = Math.max(0, Math.min(newX, window.innerWidth - dragBtn.offsetWidth));
                newY = Math.max(0, Math.min(newY, window.innerHeight - dragBtn.offsetHeight));
                dragBtn.style.left = newX + 'px';
                dragBtn.style.top = newY + 'px';
            }
        }

        function onPointerUp(e) {
            document.removeEventListener('pointermove', onPointerMove);
            document.removeEventListener('pointerup', onPointerUp);
            dragBtn.releasePointerCapture(e.pointerId);
            if (isDragging) {
                localStorage.setItem('floatBtnLeft', dragBtn.offsetLeft);
                localStorage.setItem('floatBtnTop', dragBtn.offsetTop);
            } else {
                toggleSidebarFloat();
            }
            isDragging = false;
        }

        function toggleSidebarFloat() {
            const btnRect = dragBtn.getBoundingClientRect();
            const sidebarWidth = 280;
            let top = btnRect.bottom + 10;
            let left = btnRect.left;
            if (left + sidebarWidth > window.innerWidth) left = window.innerWidth - sidebarWidth - 15;
            if (top + 400 > window.innerHeight) {
                top = btnRect.top - 410;
                if (top < 10) top = 10;
            }
            sideFloat.style.top = top + 'px';
            sideFloat.style.left = left + 'px';
            sideFloat.style.transformOrigin = `${btnRect.left - left + 20}px ${btnRect.top > top ? 'bottom' : 'top'}`;
            const isActive = sideFloat.classList.toggle('active');
            sideOverlay.classList.toggle('active', isActive);
            if (isActive && !sideFloat.innerHTML) loadSidebarContent();
        }

        function closeSidebarFloat() {
            sideFloat.classList.remove('active');
            sideOverlay.classList.remove('active');
        }

        function loadSidebarContent() {
            fetch('sidebar.html')
                .then(res => res.text())
                .then(data => {
                    sideFloat.innerHTML = `<div class="sidebar-header">เมนูนำทาง</div>` + data;
                }).catch(err => {
                    sideFloat.innerHTML = `<div class="sidebar-header">เมนูนำทาง</div><div style="padding:20px; color:#fff;">ไม่พบไฟล์ sidebar.html</div>`;
                });
        }

        // --- ระบบจัดการยอดขาย (Sale Report Logic) ---
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxGQmg5crSIBj6utEmGEeYeNn6OwS_WFgaqynJiPCS5bqj1_PyFAZIuXZZ4jo-T30mY-w/exec"; 
        const BRANCHES = ["80000397 TS BC Pracha Uthit", "80000264 TS LT Rama 2", "80000022 TS BC Rama 2", "80000530 TS LT Bang Yai", "80000215 TS JC Wanghin", "80000251 TS LT Rama 3", "80000538 TS Robinson Samutprakan", "80000023 TS BC Bangplee", "80000263 TS LT Bangpoo", "80000087 TS LT Srinakarin", "80002441 TS Lotus Bangkruai Sainoi", "80000284 TS BC Sapankhwai", "80000086 TS LT Bangkapi", "80000207 TS LT Prachachuen", "80002390 TS Terminal 21 Rama 3"];

        function getToday() { return new Date().toISOString().split('T')[0]; }
        
        function renderInputRow(label, id) {
            return `<div class="mb-3"><label class="row-label">${label}</label><div class="input-row-container"><div class="input-col"><div class="inner-label">Sub</div><input id="${id}-s" type="number" placeholder="0"></div><div class="input-col"><div class="inner-label">Rev</div><input id="${id}-r" type="number" placeholder="0"></div></div></div>`;
        }

        async function showAddModal() {
            const { value: formValues } = await Swal.fire({
                title: 'กรอกยอดขายรายวัน',
                confirmButtonText: 'บันทึกข้อมูล',
                confirmButtonColor: '#3b82f6',
                showCancelButton: true,
                cancelButtonText: 'ยกเลิก',
                html: `<div class="text-left" style="max-height: 60vh; overflow-y: auto; padding-right: 5px;">
                    <label class="row-label">วันที่</label><input id="swal-date" type="date" class="mb-3" value="${getToday()}">
                    <label class="row-label">สาขา</label><select id="swal-branch" class="mb-3">${BRANCHES.map(b => `<option value="${b}">${b}</option>`).join('')}</select>
                    <div class="section-header">Stock</div>
                    <select id="swal-stock-status" class="mb-2" onchange="document.getElementById('stock-reason-div').classList.toggle('hidden', this.value !== 'ขาด')">
                        <option value="ครบ">ครบ</option><option value="ขาด">ขาด</option>
                    </select>
                    <div id="stock-reason-div" class="hidden mb-3"><input id="swal-stock-reason" type="text" placeholder="ระบุเหตุผลที่ขาด..."></div>
                    <div class="section-header">Transaction SL</div>
                    <div class="input-row-container"><div class="input-col"><div class="inner-label">SL</div><input id="swal-sl" type="number" placeholder="0"></div><div class="input-col"><div class="inner-label">Cancel</div><input id="swal-cancelq" type="number" placeholder="0"></div></div>
                    <div class="section-header">Postpay (Target)</div>
                    <div class="input-row-container"><div class="input-col"><div class="inner-label">New</div><input id="swal-tg-new" type="number" placeholder="0"></div><div class="input-col"><div class="inner-label">Exist</div><input id="swal-tg-exist" type="number" placeholder="0"></div></div>
                    <div class="section-header">Postpay (ยอดรายรายการ)</div>
                    ${renderInputRow("ราหู", "rahu")}${renderInputRow("Device Bundle", "dv")}${renderInputRow("Migrate", "mg")}${renderInputRow("MNP", "mnp")}${renderInputRow("Existing", "ex")}
                    <div class="section-header">TOL (Target)</div>
                    ${renderInputRow("Regis", "t-rg")}${renderInputRow("Install", "t-in")}
                    <div class="section-header">TOL (ยอดวันนี้)</div>
                    ${renderInputRow("Regis", "rg")}${renderInputRow("Install", "in")}
                </div>`,
                preConfirm: () => ({
                    date: document.getElementById('swal-date').value,
                    branch: document.getElementById('swal-branch').value,
                    stockStatus: document.getElementById('swal-stock-status').value,
                    stockReason: document.getElementById('swal-stock-reason').value || "",
                    sl: document.getElementById('swal-sl').value || 0,
                    cancelQ: document.getElementById('swal-cancelq').value || 0,
                    tgNew: document.getElementById('swal-tg-new').value || 0,
                    tgExist: document.getElementById('swal-tg-exist').value || 0,
                    rahuSub: document.getElementById('rahu-s').value || 0, rahuRev: document.getElementById('rahu-r').value || 0,
                    dvSub: document.getElementById('dv-s').value || 0, dvRev: document.getElementById('dv-r').value || 0,
                    mgSub: document.getElementById('mg-s').value || 0, mgRev: document.getElementById('mg-r').value || 0,
                    mnpSub: document.getElementById('mnp-s').value || 0, mnpRev: document.getElementById('mnp-r').value || 0,
                    existSub: document.getElementById('ex-s').value || 0, existRev: document.getElementById('ex-r').value || 0,
                    tolTgRegisSub: document.getElementById('t-rg-s').value || 0, tolTgRegisRev: document.getElementById('t-rg-r').value || 0,
                    tolTgInstSub: document.getElementById('t-in-s').value || 0, tolTgInstRev: document.getElementById('t-in-r').value || 0,
                    tolRegisSub: document.getElementById('rg-s').value || 0, tolRegisRev: document.getElementById('rg-r').value || 0,
                    tolInstSub: document.getElementById('in-s').value || 0, tolInstRev: document.getElementById('in-r').value || 0
                })
            });

            if (formValues) {
                Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(formValues) })
                .then(() => Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ!', timer: 1500 }))
                .catch(() => Swal.fire('Error', 'ไม่สามารถเชื่อมต่อ Server ได้', 'error'));
            }
        }

        async function showFetchModal() {
            const { value: fetchParams } = await Swal.fire({
                title: 'ดึงข้อมูลสรุป',
                confirmButtonText: 'ดึงข้อมูล',
                confirmButtonColor: '#3b82f6',
                showCancelButton: true,
                cancelButtonText: 'ยกเลิก',
                html: `<div class="text-left">
                    <label class="row-label">ระบุวันที่</label><input id="f-date" type="date" value="${getToday()}" class="mb-4">
                    <label class="row-label">ระบุสาขา</label><select id="f-branch">${BRANCHES.map(b => `<option value="${b}">${b}</option>`).join('')}</select>
                </div>`,
                preConfirm: () => ({ date: document.getElementById('f-date').value, branch: document.getElementById('f-branch').value })
            });

            if (fetchParams) {
                Swal.fire({ title: 'กำลังค้นหา...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
                try {
                    const response = await fetch(`${SCRIPT_URL}?date=${fetchParams.date}&branch=${encodeURIComponent(fetchParams.branch)}`);
                    const data = await response.json();
                    
                    if (data === "Not Found") {
                        Swal.fire('ไม่พบข้อมูล', 'ไม่พบข้อมูลของสาขาและวันที่ระบุครับ', 'warning');
                    } else {
                        const [y, m, d] = data[0].split('-');
                        const formattedDate = `${d}/${m}/${y}`;
                        
                        const summary = `สรุปสิ้นวัน (${formattedDate})\nสาขา: ${data[1]}\nนับ stock: ${data[2] === "ขาด" ? `ขาด (${data[3]})` : "ครบ"}\nSL: ${data[4]} / Cancel: ${data[5]}\n=======\nPostpay\nTG Day: New ${data[6]} / Exist ${data[7]}\nทำได้วันนี้: ${Number(data[8]) + Number(data[10]) + Number(data[12]) + Number(data[14]) + Number(data[16])} / ${Number(data[9]) + Number(data[11]) + Number(data[13]) + Number(data[15]) + Number(data[17])}\nแบ่งเป็น ซิม/REV\nราหู: ${data[8]}/${data[9]}\nDV: ${data[10]}/${data[11]}\nMG: ${data[12]}/${data[13]}\nMNP: ${data[14]}/${data[15]}\nExist: ${data[16]}/${data[17]}\n=========\nTOL\nTG Day: Regis ${data[18]}/${data[19]} | Install ${data[20]}/${data[21]}\nวันนี้: Regis ${data[22]}/${data[23]} | Install ${data[24]}/${data[25]}\n=======`;
                        
                        Swal.fire({ 
                            title: 'พบข้อมูลล่าสุด', 
                            confirmButtonText: 'คัดลอกส่ง Line', 
                            html: `<pre class="text-left text-[12px] bg-gray-50 p-3 rounded-lg border border-gray-200 font-mono">${summary}</pre>` 
                        }).then((result) => { 
                            if (result.isConfirmed) { 
                                navigator.clipboard.writeText(summary); 
                                Swal.fire({ title: 'คัดลอกแล้ว!', icon: 'success', timer: 1000 }); 
                            } 
                        });
                    }
                } catch (error) { Swal.fire('Error', 'ไม่สามารถเชื่อมต่อ Server ได้', 'error'); }
            }
        }

        window.onload = loadButtonPosition;
    </script>
</body>
</html>
