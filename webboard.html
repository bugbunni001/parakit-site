<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เว็บบอร์ดข้อมูลสำคัญ - Parakit-site</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --ios-blue: #007aff;
            --sidebar-dark: rgba(28, 28, 30, 0.96);
            --transition-bounce: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        body { 
            font-family: 'Kanit', sans-serif; 
            background-color: #f8fafc; 
        }
        
        * { font-family: 'Kanit', sans-serif !important; }

        #postContainer {
            display: grid;
            transition: all 0.5s ease-in-out;
        }

        .post-card { 
            height: 400px; 
            display: flex; 
            flex-direction: column; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: slideIn 0.5s ease forwards;
            opacity: 0;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .post-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px -12px rgba(0,0,0,0.12); }
        
        .loader-ring {
            width: 60px; height: 60px;
            border: 5px solid #e2e8f0; border-top: 5px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #postModal, #viewModal { display: none; opacity: 0; transition: opacity 0.3s ease; z-index: 3000; }
        .modal-active { display: flex !important; opacity: 1 !important; }
        .line-clamp-2 { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
        .line-clamp-3 { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }

        .swal2-popup { border-radius: 24px !important; padding: 2rem !important; }
        .swal2-image { border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); margin-top: 10px !important; }

        /* FLOATING MENU */
        #floatingMenuBtn {
            position: fixed; top: 80px; left: 20px; width: 50px; height: 50px;
            background: var(--ios-blue); color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; cursor: move; z-index: 2100;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4); border: none; touch-action: none;
        }

        .sidebar-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.3);
            z-index: 2000; display: none; opacity: 0; transition: opacity 0.3s;
            backdrop-filter: blur(2px);
        }
        .sidebar-overlay.active { display: block; opacity: 1; }

        .sidebar-float {
            position: fixed; width: 280px; max-height: 75vh;
            background: var(--sidebar-dark); border-radius: 24px;
            overflow-y: auto; z-index: 2001; opacity: 0; visibility: hidden;
            transform: scale(0.8) translateY(10px);
            transition: opacity 0.3s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar-float.active { opacity: 1; visibility: visible; transform: scale(1) translateY(0); }
        .sidebar-float i { width: 20px; text-align: center; margin-right: 10px; }
    </style>
</head>
<body>

    <button id="floatingMenuBtn"><i class="fa-solid fa-bars"></i></button>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebarFloat()"></div>
    <aside class="sidebar-float" id="sidebarFloat"></aside>

    <nav class="bg-white shadow-sm border-b sticky top-0 z-40 p-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black text-blue-600 tracking-tight">เว็บบอร์ด <span class="text-slate-800">ข้อมูลสำคัญ</span></h1>
            <button onclick="openModal('add')" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-full font-medium shadow-lg transition-all active:scale-95">
                <i class="fa-solid fa-plus mr-2"></i>สร้างกระทู้
            </button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-4 mt-8">
        <div id="postContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div id="loadingUI" class="col-span-full flex flex-col items-center py-32">
                <div class="loader-ring"></div>
                <p class="mt-4 text-slate-500 font-medium animate-pulse">กำลังดึงข้อมูลล่าสุด...</p>
            </div>
        </div>
    </main>

    <div id="postModal" class="fixed inset-0 items-center justify-center bg-black/50 backdrop-blur-sm p-4">
        <div class="bg-white p-8 rounded-3xl w-full max-w-2xl shadow-2xl transform transition-all overflow-y-auto max-h-[95vh]">
            <h2 id="modalTitle" class="text-2xl font-bold mb-6 text-slate-800 border-b pb-4">ตั้งกระทู้ใหม่</h2>
            <input type="hidden" id="editPostId">
            <input type="hidden" id="existingFileId">
            <input type="hidden" id="deleteOldImageFlag" value="false">
            
            <div class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">หัวข้อกระทู้</label>
                    <input type="text" id="postSubject" class="w-full border border-slate-200 p-4 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">รายละเอียด</label>
                    <textarea id="postContent" class="w-full border border-slate-200 p-4 rounded-2xl h-48 focus:ring-2 focus:ring-blue-500 outline-none transition-all resize-none"></textarea>
                </div>
                <div id="imageSection">
                    <label class="block text-sm font-medium text-slate-700 mb-1">รูปภาพประกอบ</label>
                    <div id="currentImageWrapper" class="hidden mb-4 p-3 border rounded-2xl bg-slate-50 relative">
                        <img id="previewOldImage" src="" class="h-32 rounded-lg object-cover mb-2 cursor-pointer" onclick="viewFullImage(this.src)">
                        <button onclick="removeCurrentImage()" class="text-red-500 text-sm block font-medium hover:underline">
                            <i class="fa-solid fa-trash-can mr-1"></i> ลบเพื่อแนบใหม่
                        </button>
                    </div>
                    <div id="fileInputWrapper">
                        <input type="file" id="postImage" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-6 file:rounded-full file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
                    </div>
                </div>
            </div>
            <div class="flex justify-end gap-4 mt-8">
                <button onclick="closeModal('postModal')" class="px-6 py-3 font-medium text-slate-400">ยกเลิก</button>
                <button id="saveBtn" onclick="submitPost()" class="bg-blue-600 text-white px-10 py-3 rounded-2xl font-medium shadow-lg hover:bg-blue-700 transition-all">บันทึกข้อมูล</button>
            </div>
        </div>
    </div>

    <div id="viewModal" class="fixed inset-0 items-center justify-center bg-black/60 backdrop-blur-sm p-4">
        <div class="bg-white rounded-3xl w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-2xl">
            <div id="viewContent" class="p-8"></div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzWuwy18RtC9BqaYOI8DYXJakZBsXQZ3SgnjXcD5GHJ6tbnUJ7ojQxPKaA7AzhKCird/exec';
        let allPosts = [];

        const toast = {
            error: (msg) => Swal.fire({ icon: 'error', title: 'แจ้งเตือน', text: msg }),
            success: (msg) => Swal.fire({ icon: 'success', title: 'สำเร็จ', text: msg, timer: 1500, showConfirmButton: false }),
            loading: (msg) => Swal.fire({ title: msg, allowOutsideClick: false, didOpen: () => Swal.showLoading() }),
            confirm: (msg, btnText = 'ยืนยัน') => Swal.fire({
                title: 'ยืนยันการทำรายการ', text: msg, icon: 'warning', showCancelButton: true, confirmButtonColor: '#3b82f6', confirmButtonText: btnText, cancelButtonText: 'ยกเลิก'
            })
        };

        // ฟังก์ชันขยายรูปภาพ
        function viewFullImage(url) {
            Swal.fire({
                imageUrl: url,
                imageAlt: 'Full size image',
                showConfirmButton: false,
                showCloseButton: true,
                width: 'auto',
                padding: '0',
                background: 'transparent',
                customClass: { popup: 'bg-transparent shadow-none border-none' }
            });
        }

        async function fetchPosts() {
            try {
                const res = await fetch(`${WEB_APP_URL}?action=getList`);
                const data = await res.json();
                allPosts = data;
                renderPosts();
            } catch (e) {
                document.getElementById('postContainer').innerHTML = '<div class="col-span-full text-center py-20 text-red-400">โหลดข้อมูลไม่สำเร็จ</div>';
            }
        }

        function renderPosts() {
            const container = document.getElementById('postContainer');
            if (!allPosts || allPosts.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-20 text-slate-400">ยังไม่มีกระทู้</div>';
                return;
            }
            container.innerHTML = '';
            
            const sorted = [...allPosts].sort((a, b) => {
                const pinA = a.isPinned === true || a.isPinned === 'true';
                const pinB = b.isPinned === true || b.isPinned === 'true';
                if (pinA !== pinB) return pinA ? -1 : 1;
                return new Date(b.Timestamp) - new Date(a.Timestamp);
            });

            sorted.forEach((post, index) => {
                const isPinned = post.isPinned === true || post.isPinned === 'true';
                const card = document.createElement('div');
                card.className = `post-card bg-white rounded-3xl border-2 overflow-hidden ${isPinned ? 'border-yellow-400 ring-4 ring-yellow-50' : 'border-white shadow-sm'}`;
                card.style.animationDelay = `${index * 0.05}s`;
                
                card.innerHTML = `
                    <div class="h-44 bg-slate-200 overflow-hidden relative">
                        ${post.imageUrl ? `<img src="${post.imageUrl}" class="w-full h-full object-cover cursor-zoom-in" onclick="event.stopPropagation(); viewFullImage('${post.imageUrl}')">` : `<div class="w-full h-full flex items-center justify-center text-slate-400 text-xs">ไม่มีรูปภาพ</div>`}
                        ${isPinned ? '<span class="absolute top-3 left-3 bg-yellow-400 text-white text-[10px] px-2 py-1 rounded font-bold shadow-sm animate-bounce"><i class="fa-solid fa-thumbtack mr-1"></i> ปักหมุด</span>' : ''}
                    </div>
                    <div class="p-5 flex-grow flex flex-col cursor-pointer" onclick="openViewModal('${post.postId}')">
                        <span class="text-[10px] text-slate-400 font-medium mb-1 uppercase">#${post.postId}</span>
                        <h3 class="text-lg font-bold text-slate-800 mb-2 line-clamp-2">${post.title || 'ไม่มีหัวข้อ'}</h3>
                        <p class="text-slate-500 text-sm line-clamp-3 mb-4 font-light">${post.content || 'ไม่มีรายละเอียด'}</p>
                        <div class="mt-auto pt-3 border-t flex justify-between items-center text-[10px] text-slate-400">
                            <span>📅 ${post.Timestamp ? new Date(post.Timestamp).toLocaleDateString('th-TH') : ''}</span>
                            <span class="text-blue-600 font-bold">อ่านต่อ...</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openViewModal(id) {
            const post = allPosts.find(p => p.postId == id);
            if(!post) return;
            const isPinned = post.isPinned === true || post.isPinned === 'true';
            
            document.getElementById('viewContent').innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <span class="bg-slate-100 px-4 py-1 rounded-full text-xs font-bold text-slate-500 uppercase">กระทู้ #${post.postId}</span>
                    <button onclick="closeModal('viewModal')" class="text-slate-400 hover:text-slate-600 transition-colors font-medium">✕ ปิด</button>
                </div>
                <h2 class="text-3xl font-bold text-slate-800 mb-4 leading-tight">${post.title}</h2>
                <div class="text-slate-400 text-xs mb-6">📅 โพสต์เมื่อ: ${new Date(post.Timestamp).toLocaleString('th-TH')} ${isPinned ? ' | 📌 ปักหมุด' : ''}</div>
                ${post.imageUrl ? `<img src="${post.imageUrl}" class="w-full rounded-2xl mb-8 shadow-md cursor-zoom-in" onclick="viewFullImage('${post.imageUrl}')">` : ''}
                <div class="text-slate-700 leading-relaxed whitespace-pre-wrap text-lg mb-10 border-l-4 border-blue-500 pl-6 font-light">${post.content}</div>
                <div class="flex flex-wrap gap-3 pt-6 border-t">
                    <button onclick="togglePin('${post.postId}')" class="flex-1 min-w-[120px] px-4 py-3 bg-yellow-50 text-yellow-700 rounded-xl font-medium flex items-center justify-center"><i class="fa-solid fa-thumbtack mr-2"></i> ${isPinned ? 'เลิกหมุด' : 'ปักหมุด'}</button>
                    <button onclick="openEditModal('${post.postId}')" class="flex-1 min-w-[120px] px-4 py-3 bg-blue-600 text-white rounded-xl font-medium flex items-center justify-center"><i class="fa-solid fa-pen-to-square mr-2"></i>แก้ไข</button>
                    <button onclick="deletePost('${post.postId}', '${post.fileId}')" class="flex-1 min-w-[120px] px-4 py-3 bg-red-50 text-red-600 rounded-xl font-medium flex items-center justify-center"><i class="fa-solid fa-trash mr-2"></i>ลบ</button>
                </div>
            `;
            document.getElementById('viewModal').classList.add('modal-active');
        }

        // --- functions อื่นๆ (openModal, closeModal, submitPost, togglePin, deletePost, sidebar logic) ยังคงเดิมจากโค้ดที่คุณส่งมา ---
        
        function openModal(mode) {
            document.getElementById('postModal').classList.add('modal-active');
            resetModalFields();
            if(mode === 'add') {
                document.getElementById('modalTitle').innerText = 'สร้างกระทู้ใหม่';
                document.getElementById('editPostId').value = '';
            }
            setTimeout(() => document.getElementById('postSubject').focus(), 100);
        }

        function resetModalFields() {
            document.getElementById('postSubject').value = '';
            document.getElementById('postContent').value = '';
            document.getElementById('postImage').value = '';
            document.getElementById('existingFileId').value = '';
            document.getElementById('deleteOldImageFlag').value = 'false';
            document.getElementById('currentImageWrapper').classList.add('hidden');
            document.getElementById('fileInputWrapper').classList.remove('hidden');
        }

        function closeModal(id) { document.getElementById(id).classList.remove('modal-active'); }

        function openEditModal(id) {
            const post = allPosts.find(p => p.postId == id);
            if(!post) return;
            closeModal('viewModal');
            openModal('edit');
            document.getElementById('modalTitle').innerText = 'แก้ไขกระทู้';
            document.getElementById('editPostId').value = post.postId;
            document.getElementById('postSubject').value = post.title;
            document.getElementById('postContent').value = post.content;
            document.getElementById('existingFileId').value = post.fileId || '';
            if (post.imageUrl) {
                document.getElementById('previewOldImage').src = post.imageUrl;
                document.getElementById('currentImageWrapper').classList.remove('hidden');
                document.getElementById('fileInputWrapper').classList.add('hidden');
            }
        }

        async function removeCurrentImage() {
            const res = await toast.confirm("ลบรูปภาพเดิม?", "ลบรูปภาพ");
            if(res.isConfirmed) {
                document.getElementById('currentImageWrapper').classList.add('hidden');
                document.getElementById('fileInputWrapper').classList.remove('hidden');
                document.getElementById('deleteOldImageFlag').value = 'true';
            }
        }

        async function submitPost() {
            const btn = document.getElementById('saveBtn');
            const title = document.getElementById('postSubject').value.trim();
            const content = document.getElementById('postContent').value.trim();
            const fileInput = document.getElementById('postImage');
            if (!title || !content) return toast.error("กรุณาใส่หัวข้อและรายละเอียด");
            
            btn.disabled = true; toast.loading("กำลังบันทึก...");
            let imageData = null;
            if (fileInput.files.length > 0) {
                imageData = await new Promise(resolve => {
                    const reader = new FileReader();
                    reader.onload = () => resolve({ base64: reader.result, type: fileInput.files[0].type });
                    reader.readAsDataURL(fileInput.files[0]);
                });
            }

            const payload = {
                action: document.getElementById('editPostId').value ? 'update' : 'add',
                postId: document.getElementById('editPostId').value || 'PK' + Math.random().toString().substring(2, 8),
                title, content, image: imageData?.base64, imageType: imageData?.type,
                deleteOldImage: document.getElementById('deleteOldImageFlag').value === 'true',
                existingFileId: document.getElementById('existingFileId').value
            };

            try {
                await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) });
                closeModal('postModal');
                toast.success("สำเร็จ");
                fetchPosts();
            } catch (e) { toast.error("ข้อผิดพลาดการเชื่อมต่อ"); } finally { btn.disabled = false; }
        }

        async function deletePost(id, fileId) {
            const res = await toast.confirm("ต้องการลบกระทู้นี้?", "ลบกระทู้");
            if (res.isConfirmed) {
                closeModal('viewModal'); toast.loading("กำลังลบ...");
                await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: 'delete', id: id, fileId: fileId }) });
                toast.success("ลบสำเร็จ"); fetchPosts();
            }
        }

        async function togglePin(id) {
            toast.loading("กำลังดำเนินการ...");
            try {
                await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: 'togglePin', id: id }) });
                closeModal('viewModal'); fetchPosts(); Swal.close();
            } catch (e) { toast.error("ไม่สามารถดำเนินการได้"); }
        }

        /* SIDEBAR SYSTEM (Same as original) */
        const dragBtn = document.getElementById('floatingMenuBtn');
        const sideFloat = document.getElementById('sidebarFloat');
        const sideOverlay = document.getElementById('sidebarOverlay');
        let isDragging = false;
        let startX, startY, shiftX, shiftY;

        function loadButtonPosition() {
            const savedLeft = localStorage.getItem('floatBtnLeft');
            const savedTop = localStorage.getItem('floatBtnTop');
            if (savedLeft && savedTop) { dragBtn.style.left = savedLeft + 'px'; dragBtn.style.top = savedTop + 'px'; }
        }

        dragBtn.onpointerdown = function(e) {
            isDragging = false; startX = e.clientX; startY = e.clientY;
            const rect = dragBtn.getBoundingClientRect();
            shiftX = e.clientX - rect.left; shiftY = e.clientY - rect.top;
            dragBtn.setPointerCapture(e.pointerId);
            document.addEventListener('pointermove', onPointerMove);
            document.addEventListener('pointerup', onPointerUp);
        };

        function onPointerMove(e) {
            if (!isDragging && (Math.abs(e.clientX - startX) > 5 || Math.abs(e.clientY - startY) > 5)) isDragging = true;
            if (isDragging) {
                let newX = e.clientX - shiftX; let newY = e.clientY - shiftY;
                newX = Math.max(0, Math.min(newX, window.innerWidth - dragBtn.offsetWidth));
                newY = Math.max(0, Math.min(newY, window.innerHeight - dragBtn.offsetHeight));
                dragBtn.style.left = newX + 'px'; dragBtn.style.top = newY + 'px';
            }
        }

        function onPointerUp(e) {
            document.removeEventListener('pointermove', onPointerMove);
            document.removeEventListener('pointerup', onPointerUp);
            dragBtn.releasePointerCapture(e.pointerId);
            if (isDragging) {
                localStorage.setItem('floatBtnLeft', dragBtn.offsetLeft);
                localStorage.setItem('floatBtnTop', dragBtn.offsetTop);
            } else { toggleSidebarFloat(); }
            isDragging = false;
        }

        function toggleSidebarFloat() {
            const btnRect = dragBtn.getBoundingClientRect();
            let top = btnRect.bottom + 10; let left = btnRect.left;
            if (left + 280 > window.innerWidth) left = window.innerWidth - 295;
            if (top + 400 > window.innerHeight) top = btnRect.top - 410;
            sideFloat.style.top = Math.max(10, top) + 'px';
            sideFloat.style.left = left + 'px';
            const isActive = sideFloat.classList.toggle('active');
            sideOverlay.classList.toggle('active', isActive);
            if (isActive && !sideFloat.innerHTML) loadSidebarContent();
        }

        function closeSidebarFloat() {
            sideFloat.classList.remove('active');
            sideOverlay.classList.remove('active');
        }

        function loadSidebarContent() {
            fetch('sidebar.html').then(res => res.text()).then(data => {
                sideFloat.innerHTML = `<div class="sidebar-header">เมนูนำทาง</div>` + data;
            });
        }

        window.toggleDrop = function(btn, id) {
            const item = btn.parentElement;
            const isOpen = item.classList.toggle("open");
            if (id) localStorage.setItem('menu-' + id, isOpen);
        }

        window.onload = () => { fetchPosts(); loadButtonPosition(); };
    </script>
</body>
</html>
