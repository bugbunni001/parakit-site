<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เว็บบอร์ดข้อมูลสำคัญ - Parakit-site</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --ios-blue: #007aff;
            --ios-bg: #f2f2f7;
            --glass-white: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.5);
            --sidebar-dark: rgba(28, 28, 30, 0.96);
            --text-main: #1c1c1e;
            --text-light: #8e8e93;
            --transition-swift: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        body { 
            font-family: 'Kanit', sans-serif; 
            background-color: #f8fafc; 
            zoom: 0.95; 
        }
        
        * { font-family: 'Kanit', sans-serif !important; }

        /* --- Layer Management (Z-Index) --- */
        #postModal, #viewModal { z-index: 4000; }
        #imageOverlay { z-index: 5000; }
        .swal2-container { z-index: 10000 !important; }

        /* --- Custom Scrollbar --- */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.1); border-radius: 10px; }
        
        .lucide {
            width: 24px; height: 24px; stroke-width: 2; stroke: currentColor;
            fill: none; stroke-linecap: round; stroke-linejoin: round;
            vertical-align: middle; display: inline-block;
        }

        #postContainer { display: grid; transition: all 0.5s ease-in-out; }

        .post-card { 
            height: 400px; display: flex; flex-direction: column; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: slideIn 0.5s ease forwards; opacity: 0;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .post-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px -12px rgba(0,0,0,0.12); }
        
        .loader-ring {
            width: 60px; height: 60px;
            border: 5px solid #e2e8f0; border-top: 5px solid #3b82f6;
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #postModal, #viewModal { display: none; opacity: 0; transition: opacity 0.3s ease; position: fixed; inset: 0; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        .modal-active { display: flex !important; opacity: 1 !important; }
        .line-clamp-2 { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
        .line-clamp-3 { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; }

        .swal2-popup { border-radius: 24px !important; padding: 2rem !important; }

        /* Image Lightbox */
        #imageOverlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9);
            align-items: center; justify-content: center; padding: 20px; cursor: zoom-out;
        }
        #imageOverlay.active { display: flex; }
        .close-image-btn {
            position: absolute; top: 20px; right: 20px; color: white; cursor: pointer;
            width: 50px; height: 50px; display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.1); border-radius: 50%;
        }

        /* ===== Floating Draggable Button ===== */
        #floatingMenuBtn {
            position: fixed;
            top: 10px;
            left: 15px;
            width: 45px;
            height: 45px;
            background: var(--ios-blue);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: move;
            z-index: 2100;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
            border: none;
            touch-action: none;
            transition: transform 0.2s, opacity 0.2s;
            zoom: 1.0526; 
        }
        #floatingMenuBtn:active { transform: scale(0.9); }

        /* ===== Floating Sidebar ===== */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.2);
            z-index: 2000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .sidebar-overlay.active { display: block; opacity: 1; }

        .sidebar-float {
            position: fixed;
            width: 280px;
            max-height: 70vh;
            background: var(--sidebar-dark);
            border-radius: 20px;
            overflow-y: auto;
            z-index: 2001;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.8) translateY(10px);
            transition: opacity 0.3s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.2) transparent;
            zoom: 1.0526;
        }
        .sidebar-float.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1) translateY(0);
        }

        .sidebar-float .sidebar-header { padding: 20px; font-size: 17px; font-weight: 600; color: #fff; border-bottom: 0.5px solid rgba(255,255,255,0.1); }
        .sidebar-float .menu { padding: 8px 0; }
        .sidebar-float .menu a, .sidebar-float .drop-btn { 
            width: 100%; padding: 12px 20px; background: none; border: none; 
            color: #ebebf5; text-align: left; font-size: 14px; cursor: pointer; 
            display: flex; align-items: center; text-decoration: none; transition: 0.2s;
        }
        .sidebar-float .menu a:hover, .sidebar-float .drop-btn:hover { background: rgba(255,255,255,0.1); }
        .sidebar-float .sub { display: none; background: rgba(0,0,0,0.2); }
        .sidebar-float .item.open .sub { display: block; }
        .sidebar-float .sub a { padding-left: 45px; font-size: 13px; color: #8e8e93; }

        .fallback-cover {
            background: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);
            width: 100%; height: 100%; display: flex; align-items: center;
            justify-content: center; padding: 20px; text-align: center;
            color: white; font-weight: bold; font-size: 1.1rem; line-height: 1.4;
        }

        /* ปรับแต่งลิงก์ในเนื้อหา */
        .content-link { color: #2563eb; text-decoration: underline; word-break: break-all; }
        .content-link:hover { color: #1d4ed8; }
    </style>
</head>
<body>

    <div id="imageOverlay" onclick="closeImage()">
        <span class="close-image-btn"><i data-lucide="x"></i></span>
        <img id="expandedImg" src="" alt="ขยายรูปภาพ" style="max-width: 90%; max-height: 90%; object-fit: contain;">
    </div>

    <button id="floatingMenuBtn" title="ลากเพื่อย้าย">เมนู</button>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebarFloat()"></div>
    <aside class="sidebar-float" id="sidebarFloat"></aside>

    <nav class="bg-white shadow-sm border-b sticky top-0 z-40 p-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-normal text-blue-600 tracking-tight">เว็บบอร์ด <span class="text-slate-800">ข้อมูลสำคัญ</span></h1>
            <button onclick="openModal('add')" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-full font-medium shadow-lg transition-all active:scale-95 flex items-center">
                <i data-lucide="plus-circle" class="mr-2"></i>สร้างกระทู้
            </button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-4 mt-8">
        <div id="postContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div id="loadingUI" class="col-span-full flex flex-col items-center py-32">
                <div class="loader-ring"></div>
                <p class="mt-4 text-slate-500 font-medium animate-pulse">กำลังดึงข้อมูลล่าสุด...</p>
            </div>
        </div>
    </main>

    <div id="postModal">
        <div class="bg-white p-10 rounded-[40px] w-full max-w-[700px] shadow-2xl transform transition-all overflow-y-auto max-h-[95vh] mx-4 border border-slate-100">
            <h2 id="modalTitle" class="text-[32px] font-bold mb-8 text-slate-800 tracking-tight">สร้างกระทู้ใหม่</h2>
            
            <input type="hidden" id="editPostId">
            <input type="hidden" id="existingFileId">
            <input type="hidden" id="deleteOldImageFlag" value="false">
            
            <div class="space-y-8">
                <div>
                    <label class="block text-[16px] font-bold text-slate-800 mb-3">หัวข้อกระทู้</label>
                    <input type="text" id="postSubject" placeholder="พิมพ์ชื่อเรื่องที่นี่..." 
                        class="w-full border border-slate-200 p-5 rounded-2xl bg-white text-[16px] placeholder:text-slate-300 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none transition-all">
                </div>
                
                <div>
                    <label class="block text-[16px] font-bold text-slate-800 mb-3">รายละเอียด (รองรับการใส่ลิงก์)</label>
                    <textarea id="postContent" placeholder="เขียนรายละเอียดเนื้อหาของคุณ... ลิงก์จะถูกเปลี่ยนเป็นคลิกได้โดยอัตโนมัติ" 
                        class="w-full border border-slate-200 p-5 rounded-2xl h-56 bg-white text-[16px] placeholder:text-slate-300 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none resize-none transition-all"></textarea>
                </div>

                <div id="imageSection" class="p-6 border-2 border-dashed border-slate-200 rounded-[30px] bg-slate-50/50">
                    <div class="flex items-center gap-2 mb-4 text-slate-800 font-bold">
                        <i data-lucide="image" class="w-5 h-5 text-blue-500"></i>
                        <span>แถบจัดการรูปภาพประกอบ</span>
                    </div>
                    
                    <div id="currentImageWrapper" class="hidden mb-4 p-4 border rounded-2xl bg-white shadow-sm">
                        <img id="previewOldImage" src="" class="h-32 rounded-lg object-cover mb-3">
                        <button onclick="removeCurrentImage()" class="text-red-500 text-sm font-medium flex items-center hover:bg-red-50 p-2 rounded-lg transition-colors">
                            <i data-lucide="trash-2" class="w-4 h-4 mr-2"></i> ลบรูปภาพเดิม
                        </button>
                    </div>

                    <div id="fileInputWrapper" class="space-y-3">
                        <p class="text-xs text-slate-400 font-medium">เลือกไฟล์ใหม่:</p>
                        <div class="flex items-center gap-4">
                            <label class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-3.5 rounded-full font-bold cursor-pointer transition-all active:scale-95 shadow-md">
                                Choose File
                                <input type="file" id="postImage" accept="image/*" class="hidden" onchange="updateFileName(this)">
                            </label>
                            <span id="fileNameDisplay" class="text-slate-400 text-sm">No file chosen</span>
                        </div>
                        <p class="text-[11px] text-slate-400 mt-2">* รองรับไฟล์รูปภาพเท่านั้น</p>
                    </div>
                </div>
            </div>

            <div class="flex justify-end items-center gap-8 mt-12">
                <button onclick="closeModal('postModal')" class="text-[18px] font-bold text-slate-400 hover:text-slate-600 transition-colors">ยกเลิก</button>
                <button id="saveBtn" onclick="submitPost()" class="bg-blue-600 hover:bg-blue-700 text-white px-12 py-4 rounded-[20px] text-[18px] font-bold shadow-xl shadow-blue-500/20 active:scale-95 transition-all">บันทึกข้อมูล</button>
            </div>
        </div>
    </div>

    <div id="viewModal">
        <div class="bg-white rounded-3xl w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-2xl mx-4">
            <div id="viewContent" class="p-8"></div>
        </div>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzWuwy18RtC9BqaYOI8DYXJakZBsXQZ3SgnjXcD5GHJ6tbnUJ7ojQxPKaA7AzhKCird/exec';
        let allPosts = [];

        // ฟังก์ชันแปลงข้อความ URL เป็น HTML Link
        function linkify(text) {
            const urlPattern = /(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/ig;
            return text.replace(urlPattern, function(url) {
                return `<a href="${url}" target="_blank" class="content-link">${url}</a>`;
            });
        }

        const toast = {
            error: (msg) => Swal.fire({ icon: 'error', title: 'แจ้งเตือน', text: msg, confirmButtonColor: '#3b82f6' }),
            success: (msg) => Swal.fire({ icon: 'success', title: 'สำเร็จ', text: msg, timer: 1500, showConfirmButton: false }),
            loading: (msg) => Swal.fire({ title: msg, allowOutsideClick: false, didOpen: () => Swal.showLoading() }),
            confirm: (msg, btnText = 'ยืนยัน') => Swal.fire({
                title: 'ยืนยันการทำรายการ', text: msg, icon: 'warning', showCancelButton: true,
                confirmButtonColor: '#3b82f6', cancelButtonColor: '#94a3b8', confirmButtonText: btnText, cancelButtonText: 'ยกเลิก', reverseButtons: true
            })
        };

        function updateFileName(input) {
            const display = document.getElementById('fileNameDisplay');
            display.textContent = input.files.length > 0 ? input.files[0].name : "No file chosen";
        }

        async function fetchPosts() {
            try {
                const res = await fetch(`${WEB_APP_URL}?action=getList`);
                const data = await res.json();
                allPosts = data;
                renderPosts();
            } catch (e) {
                document.getElementById('postContainer').innerHTML = '<div class="col-span-full text-center py-20 text-red-400">ไม่สามารถโหลดข้อมูลได้</div>';
            }
        }

        function renderPosts() {
            const container = document.getElementById('postContainer');
            if (!allPosts || allPosts.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center py-20 text-slate-400">ยังไม่มีกระทู้ในขณะนี้</div>';
                return;
            }
            container.innerHTML = '';
            
            const sorted = [...allPosts].sort((a, b) => {
                const pinA = a.isPinned === true || a.isPinned === 'true';
                const pinB = b.isPinned === true || b.isPinned === 'true';
                if (pinA !== pinB) return pinA ? -1 : 1;
                return new Date(b.Timestamp) - new Date(a.Timestamp);
            });

            sorted.forEach((post, index) => {
                const title = post.title || 'ไม่มีหัวข้อ';
                const content = post.content || 'ไม่มีรายละเอียด';
                const date = post.Timestamp ? new Date(post.Timestamp).toLocaleString('th-TH', { dateStyle: 'medium' }) : 'ไม่ระบุวันที่';
                const isPinned = post.isPinned === true || post.isPinned === 'true';
                
                const card = document.createElement('div');
                card.className = `post-card bg-white rounded-3xl border-2 overflow-hidden cursor-pointer ${isPinned ? 'border-yellow-400 ring-4 ring-yellow-50' : 'border-white shadow-sm'}`;
                card.style.animationDelay = `${index * 0.05}s`;
                
                const coverImage = post.imageUrl 
                    ? `<img src="${post.imageUrl}" class="w-full h-full object-cover">` 
                    : `<div class="fallback-cover"><span>${title}</span></div>`;

                card.onclick = () => openViewModal(post.postId);
                card.innerHTML = `
                    <div class="h-44 bg-slate-200 overflow-hidden relative">
                        ${coverImage}
                        ${isPinned ? '<span class="absolute top-3 left-3 bg-yellow-400 text-white text-[10px] px-2 py-1 rounded font-bold shadow-sm flex items-center"><i data-lucide="pin" class="w-3 h-3 mr-1"></i> ปักหมุด</span>' : ''}
                    </div>
                    <div class="p-5 flex-grow flex flex-col">
                        <span class="text-[10px] text-slate-400 font-medium mb-1 uppercase">#${post.postId}</span>
                        <h3 class="text-lg font-bold text-slate-800 mb-2 line-clamp-2">${title}</h3>
                        <p class="text-slate-500 text-sm line-clamp-3 mb-4 font-light">${content}</p>
                        <div class="mt-auto pt-3 border-t flex justify-between items-center text-[10px] text-slate-400">
                            <span class="flex items-center"><i data-lucide="calendar" class="w-3 h-3 mr-1"></i> ${date}</span>
                            <span class="text-blue-600 font-bold">อ่านต่อ...</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
            lucide.createIcons();
        }

        function openViewModal(id) {
            const post = allPosts.find(p => p.postId == id);
            if(!post) return;
            const content = document.getElementById('viewContent');
            const isPinned = post.isPinned === true || post.isPinned === 'true';
            const date = new Date(post.Timestamp).toLocaleString('th-TH', { dateStyle: 'long', timeStyle: 'short' });
            
            // ใช้ linkify เพื่อเปลี่ยน URL เป็นคลิกได้
            const linkifiedContent = linkify(post.content || '');

            const modalCover = post.imageUrl 
                ? `<img src="${post.imageUrl}" onclick="expandImage(this.src)" class="w-full rounded-2xl mb-8 shadow-md cursor-zoom-in hover:opacity-95 transition-opacity">` 
                : `<div class="fallback-cover rounded-2xl h-48 mb-8 text-2xl"><span>${post.title}</span></div>`;

            content.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <span class="bg-slate-100 px-4 py-1 rounded-full text-xs font-bold text-slate-500 uppercase">กระทู้ #${post.postId}</span>
                    <button onclick="closeModal('viewModal')" class="text-slate-400 hover:text-slate-600 transition-colors font-medium flex items-center"><i data-lucide="x" class="mr-1"></i> ปิด</button>
                </div>
                <h2 class="text-3xl font-bold text-slate-800 mb-4 leading-tight">${post.title}</h2>
                <div class="text-slate-400 text-xs mb-6 flex items-center">
                    <span class="mr-4 font-light flex items-center"><i data-lucide="clock" class="w-3 h-3 mr-1"></i> ${date}</span>
                    ${isPinned ? '<span class="text-yellow-600 font-bold flex items-center"><i data-lucide="pin" class="w-3 h-3 mr-1"></i> ปักหมุด</span>' : ''}
                </div>
                ${modalCover}
                <div class="text-slate-700 leading-relaxed whitespace-pre-wrap text-lg mb-10 border-l-4 border-blue-500 pl-6 font-light">${linkifiedContent}</div>
                <div class="flex flex-wrap gap-3 pt-6 border-t">
                    <button onclick="togglePin('${post.postId}')" class="flex-1 min-w-[140px] px-4 py-3 bg-yellow-50 text-yellow-700 rounded-xl font-medium transition-all hover:scale-105 active:scale-95 flex items-center justify-center"><i data-lucide="pin" class="mr-2"></i> ${isPinned ? 'เลิกปักหมุด' : 'ปักหมุด'}</button>
                    <button onclick="openEditModal('${post.postId}')" class="flex-1 min-w-[140px] px-4 py-3 bg-blue-600 text-white rounded-xl font-medium shadow-lg transition-all hover:scale-105 active:scale-95 flex items-center justify-center"><i data-lucide="edit-3" class="mr-2"></i>แก้ไข</button>
                    <button onclick="deletePost('${post.postId}', '${post.fileId}')" class="flex-1 min-w-[140px] px-4 py-3 bg-red-50 text-red-600 rounded-xl font-medium transition-all hover:scale-105 active:scale-95 flex items-center justify-center"><i data-lucide="trash-2" class="mr-2"></i>ลบ</button>
                </div>
            `;
            document.getElementById('viewModal').classList.add('modal-active');
            lucide.createIcons();
        }

        function expandImage(src) {
            const overlay = document.getElementById('imageOverlay');
            document.getElementById('expandedImg').src = src;
            overlay.classList.add('active');
        }

        function closeImage() { document.getElementById('imageOverlay').classList.remove('active'); }

        function openModal(mode) {
            document.getElementById('postModal').classList.add('modal-active');
            resetModalFields();
            if(mode === 'add') {
                document.getElementById('modalTitle').innerText = 'สร้างกระทู้ใหม่';
                document.getElementById('editPostId').value = '';
            }
            setTimeout(() => document.getElementById('postSubject').focus(), 100);
            lucide.createIcons();
        }

        function resetModalFields() {
            document.getElementById('postSubject').value = '';
            document.getElementById('postContent').value = '';
            document.getElementById('postImage').value = '';
            document.getElementById('fileNameDisplay').textContent = "No file chosen";
            document.getElementById('existingFileId').value = '';
            document.getElementById('deleteOldImageFlag').value = 'false';
            document.getElementById('currentImageWrapper').classList.add('hidden');
            document.getElementById('fileInputWrapper').classList.remove('hidden');
        }

        function closeModal(id) { document.getElementById(id).classList.remove('modal-active'); }

        function openEditModal(id) {
            const post = allPosts.find(p => p.postId == id);
            if(!post) return;
            closeModal('viewModal');
            openModal('edit');
            document.getElementById('modalTitle').innerText = 'แก้ไขกระทู้';
            document.getElementById('editPostId').value = post.postId;
            document.getElementById('postSubject').value = post.title;
            document.getElementById('postContent').value = post.content;
            document.getElementById('existingFileId').value = post.fileId || '';
            if (post.imageUrl) {
                document.getElementById('previewOldImage').src = post.imageUrl;
                document.getElementById('currentImageWrapper').classList.remove('hidden');
                document.getElementById('fileInputWrapper').classList.add('hidden');
            }
            lucide.createIcons();
        }

        async function removeCurrentImage() {
            const res = await toast.confirm("ลบรูปภาพเดิมออก?", "ลบรูปภาพ");
            if(res.isConfirmed) {
                document.getElementById('currentImageWrapper').classList.add('hidden');
                document.getElementById('fileInputWrapper').classList.remove('hidden');
                document.getElementById('deleteOldImageFlag').value = 'true';
            }
        }

        async function submitPost() {
            const btn = document.getElementById('saveBtn');
            const editId = document.getElementById('editPostId').value;
            const title = document.getElementById('postSubject').value.trim();
            const content = document.getElementById('postContent').value.trim();
            const fileInput = document.getElementById('postImage');
            if (!title || !content) return toast.error("กรุณาใส่หัวข้อและรายละเอียด");
            
            btn.disabled = true; 
            toast.loading("กำลังบันทึก...");

            let imageData = null;
            if (fileInput.files.length > 0) {
                imageData = await new Promise(resolve => {
                    const reader = new FileReader();
                    reader.onload = () => resolve({ base64: reader.result, type: fileInput.files[0].type });
                    reader.readAsDataURL(fileInput.files[0]);
                });
            }

            const payload = {
                action: editId ? 'update' : 'add',
                postId: editId || 'PK' + Math.random().toString().substring(2, 8),
                title, content, image: imageData?.base64, imageType: imageData?.type,
                deleteOldImage: document.getElementById('deleteOldImageFlag').value === 'true',
                existingFileId: document.getElementById('existingFileId').value
            };

            try {
                await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) });
                closeModal('postModal');
                toast.success("บันทึกข้อมูลสำเร็จ");
                fetchPosts();
            } catch (e) { toast.error("เกิดข้อผิดพลาด"); } finally { btn.disabled = false; }
        }

        async function deletePost(id, fileId) {
            const res = await toast.confirm("ต้องการลบกระทู้นี้ใช่หรือไม่?", "ลบกระทู้");
            if (res.isConfirmed) {
                closeModal('viewModal');
                toast.loading("กำลังลบ...");
                await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: 'delete', id: id, fileId: fileId }) });
                toast.success("ลบสำเร็จ");
                fetchPosts();
            }
        }

        async function togglePin(id) {
            toast.loading("กำลังดำเนินการ...");
            try {
                await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: 'togglePin', id: id }) });
                closeModal('viewModal');
                await fetchPosts();
                Swal.close();
            } catch (e) { toast.error("ไม่สามารถดำเนินการได้"); }
        }

        /* --- SIDEBAR & DRAG LOGIC --- */
        const dragBtn = document.getElementById('floatingMenuBtn');
        const sideFloat = document.getElementById('sidebarFloat');
        const sideOverlay = document.getElementById('sidebarOverlay');
        let isDragging = false;
        let startX, startY;
        let shiftX, shiftY;

        function loadButtonPosition() {
            const savedLeft = localStorage.getItem('floatBtnLeft');
            const savedTop = localStorage.getItem('floatBtnTop');
            if (savedLeft && savedTop) {
                dragBtn.style.left = savedLeft + 'px';
                dragBtn.style.top = savedTop + 'px';
            }
        }

        dragBtn.onpointerdown = function(e) {
            isDragging = false;
            startX = e.clientX;
            startY = e.clientY;
            
            const rect = dragBtn.getBoundingClientRect();
            shiftX = (e.clientX - rect.left);
            shiftY = (e.clientY - rect.top);

            dragBtn.setPointerCapture(e.pointerId);
            document.addEventListener('pointermove', onPointerMove);
            document.addEventListener('pointerup', onPointerUp);
        };

        function onPointerMove(e) {
            if (!isDragging && (Math.abs(e.clientX - startX) > 5 || Math.abs(e.clientY - startY) > 5)) {
                isDragging = true;
            }

            if (isDragging) {
                let newX = (e.clientX - shiftX) / 0.95;
                let newY = (e.clientY - shiftY) / 0.95;
                
                newX = Math.max(0, Math.min(newX, window.innerWidth - dragBtn.offsetWidth));
                newY = Math.max(0, Math.min(newY, window.innerHeight - dragBtn.offsetHeight));

                dragBtn.style.left = newX + 'px';
                dragBtn.style.top = newY + 'px';
            }
        }

        function onPointerUp(e) {
            document.removeEventListener('pointermove', onPointerMove);
            document.removeEventListener('pointerup', onPointerUp);
            dragBtn.releasePointerCapture(e.pointerId);

            if (isDragging) {
                localStorage.setItem('floatBtnLeft', dragBtn.offsetLeft);
                localStorage.setItem('floatBtnTop', dragBtn.offsetTop);
            } else {
                toggleSidebarFloat();
            }
            isDragging = false;
        }

        function toggleSidebarFloat() {
            const btnRect = dragBtn.getBoundingClientRect();
            const sidebarWidth = 280;
            
            let top = (btnRect.bottom / 0.95) + 10;
            let left = (btnRect.left / 0.95);

            if (left + sidebarWidth > window.innerWidth) {
                left = window.innerWidth - sidebarWidth - 15;
            }
            
            if (top + 400 > window.innerHeight) {
                top = (btnRect.top / 0.95) - 410;
                if (top < 10) top = 10;
            }

            sideFloat.style.top = top + 'px';
            sideFloat.style.left = left + 'px';
            
            sideFloat.style.transformOrigin = `${(btnRect.left / 0.95) - left + 20}px ${(btnRect.top / 0.95) > top ? 'bottom' : 'top'}`;

            const isActive = sideFloat.classList.toggle('active');
            sideOverlay.classList.toggle('active', isActive);
            
            if (isActive && !sideFloat.innerHTML) loadSidebarContent();
        }

        function closeSidebarFloat() {
            sideFloat.classList.remove('active');
            sideOverlay.classList.remove('active');
        }

        function loadSidebarContent() {
            fetch('sidebar.html')
                .then(res => res.text())
                .then(data => {
                    sideFloat.innerHTML = `<div class="sidebar-header">เมนูนำทาง</div>` + data;
                    ['credit', 'branch', 'sales'].forEach(id => {
                        if (localStorage.getItem('menu-' + id) === 'true') {
                            const el = sideFloat.querySelector('#menu-' + id);
                            if (el) el.classList.add('open');
                        }
                    });
                });
        }

        window.toggleDrop = function(btn, id) {
            const item = btn.parentElement;
            const isOpen = item.classList.toggle("open");
            if (id) localStorage.setItem('menu-' + id, isOpen);
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { closeImage(); closeModal('postModal'); closeModal('viewModal'); }
        });

        window.onload = () => { fetchPosts(); loadButtonPosition(); lucide.createIcons(); };
    </script>
</body>
</html>
