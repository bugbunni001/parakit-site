<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เว็บบอร์ดข้อมูลสำคัญ - Parakit-site</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --ios-blue: #007aff;
            --ios-bg: #f2f2f7;
            --glass-white: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.5);
            --sidebar-dark: rgba(28, 28, 30, 0.96);
            --text-main: #1c1c1e;
            --text-light: #8e8e93;
            --transition-swift: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * { box-sizing: border-box; font-family: 'Kanit', sans-serif !important; }
        
        body { 
            margin: 0; 
            background-color: var(--ios-bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 122, 255, 0.08) 0px, transparent 40%), 
                radial-gradient(at 100% 100%, rgba(255, 45, 85, 0.06) 0px, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main); 
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* Header Style */
        .top-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 60px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            z-index: 1000;
            display: flex;
            align-items: center;
            padding: 0 20px 0 75px; 
            border-bottom: 0.5px solid rgba(0,0,0,0.1);
        }

        .content { 
            padding: 80px 20px 40px; 
            max-width: 1400px; 
            margin: 0 auto; 
            animation: fadeIn 0.8s ease-out; 
        }

        /* Sidebar Floating Menu */
        #floatingMenuBtn {
            position: fixed; top: 10px; left: 15px;
            width: 45px; height: 45px;
            background: var(--ios-blue); color: white;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 20px; cursor: move; z-index: 2100;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4); border: none; touch-action: none;
        }

        .sidebar-float {
            position: fixed; width: 280px; max-height: 70vh;
            background: var(--sidebar-dark); border-radius: 20px;
            overflow-y: auto; z-index: 2001; opacity: 0; visibility: hidden;
            transform: scale(0.8) translateY(10px);
            transition: opacity 0.3s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar-float.active { opacity: 1; visibility: visible; transform: scale(1) translateY(0); }
        .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.2); z-index: 2000; display: none; opacity: 0; transition: opacity 0.3s; }
        .sidebar-overlay.active { display: block; opacity: 1; }

        /* Webboard Grid */
        .main-section-card {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 30px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0,0,0,0.03);
        }

        #postContainer { 
            display: grid; 
            grid-template-columns: repeat(1, 1fr);
            gap: 20px;
        }

        @media (min-width: 1024px) {
            #postContainer { grid-template-columns: repeat(4, 1fr); }
        }
        @media (min-width: 768px) and (max-width: 1023px) {
            #postContainer { grid-template-columns: repeat(2, 1fr); }
        }

        .post-card { 
            height: 380px; 
            display: flex; flex-direction: column; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: slideIn 0.5s ease forwards; opacity: 0;
            background: white; border-radius: 24px; overflow: hidden;
        }
        .post-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px -12px rgba(0,0,0,0.12); }

        /* Search Bar */
        .search-wrapper { position: relative; flex: 1; max-width: 400px; }
        .search-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid var(--glass-border);
            padding: 10px 15px 10px 45px;
            border-radius: 15px;
            font-size: 14px;
            outline: none;
            transition: var(--transition-swift);
        }
        .search-input:focus { background: white; border-color: var(--ios-blue); box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.1); }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-light); }

        /* Content Links */
        .link-text { color: var(--ios-blue); text-decoration: underline; transition: opacity 0.2s; font-weight: 500; }
        .link-text:hover { opacity: 0.7; }

        /* Pagination & Loader */
        .pagination-wrapper { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 40px; flex-wrap: wrap; }
        .page-btn { width: 38px; height: 38px; border-radius: 10px; background: white; border: 1px solid var(--glass-border); font-weight: 600; cursor: pointer; transition: 0.2s; }
        .page-btn.active { background: var(--ios-blue); color: white; border-color: var(--ios-blue); box-shadow: 0 4px 12px rgba(0, 122, 255, 0.3); }

        .loader-ring { width: 50px; height: 50px; border: 4px solid #f3f4f6; border-top: 4px solid var(--ios-blue); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; } }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Modals */
        #postModal, #viewModal { 
            display: none; opacity: 0; transition: opacity 0.3s ease; 
            position: fixed; inset: 0; align-items: center; justify-content: center; 
            background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 4000;
        }
        .modal-active { display: flex !important; opacity: 1 !important; }
        #imageOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; z-index: 5000; cursor: zoom-out; }
        #imageOverlay.active { display: flex; }

        .preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; margin-top: 15px; }
        .preview-item { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; border: 2px solid transparent; cursor: pointer; background: #f8fafc; }
        .preview-item.is-cover { border-color: var(--ios-blue); }
        .preview-item img { width: 100%; height: 100%; object-fit: cover; }

        .fallback-cover {
            background: linear-gradient(135deg, #6366f1 0%, #3b82f6 100%);
            width: 100%; height: 100%; display: flex; align-items: center;
            justify-content: center; padding: 15px; text-align: center;
            color: white; font-weight: bold; font-size: 14px;
        }
    </style>
</head>
<body>

<header class="top-header">
    <div style="font-weight: 700; font-size: 1.25rem; color: var(--text-main); letter-spacing: -0.8px;">เว็บบอร์ด ข้อมูลสำคัญ</div>
</header>

<button id="floatingMenuBtn">เมนู</button>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebarFloat()"></div>
<aside class="sidebar-float" id="sidebarFloat"></aside>

<div id="imageOverlay" onclick="closeImage()">
    <img id="expandedImg" src="" style="max-width: 90%; max-height: 90%; object-fit: contain;">
</div>

<div class="content">
    <div class="main-section-card">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <h2 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
                <i class="bi bi-chat-left-text-fill text-blue-600"></i> กระทู้ข่าวสาร
            </h2>
            
            <div class="flex flex-col sm:flex-row w-full md:w-auto gap-3 items-center">
                <div class="search-wrapper w-full sm:w-64">
                    <i class="bi bi-search search-icon"></i>
                    <input type="text" id="searchInput" placeholder="ค้นหาหัวข้อหรือเนื้อหา..." class="search-input" oninput="handleSearch()">
                </div>
                
                <button onclick="openModal('add')" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-full font-medium shadow-lg transition-all active:scale-95 flex items-center whitespace-nowrap">
                    <i class="bi bi-plus-circle-fill mr-2"></i>สร้างกระทู้ใหม่
                </button>
            </div>
        </div>

        <div id="postContainer">
            <div id="loadingUI" class="col-span-full flex flex-col items-center py-32">
                <div class="loader-ring"></div>
                <p class="mt-4 text-slate-500 font-medium">กำลังเตรียมข้อมูล...</p>
            </div>
        </div>

        <div id="paginationUI" class="pagination-wrapper"></div>
    </div>

    <footer class="mt-10 text-center text-slate-400 text-sm">© 2026 Copy Right By Angerina Frog</footer>
</div>

<div id="postModal">
    <div class="bg-white p-8 rounded-3xl w-full max-w-2xl shadow-2xl overflow-y-auto max-h-[95vh] mx-4">
        <h2 id="modalTitle" class="text-2xl font-bold mb-6 text-slate-800 border-b pb-4">ตั้งกระทู้</h2>
        <input type="hidden" id="editPostId">
        <div class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">หัวข้อกระทู้</label>
                <input type="text" id="postSubject" placeholder="พิมพ์หัวข้อ..." class="w-full border border-slate-200 p-4 rounded-2xl focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">รายละเอียด (รองรับการใส่ลิงก์ http://...)</label>
                <textarea id="postContent" placeholder="เขียนรายละเอียด..." class="w-full border border-slate-200 p-4 rounded-2xl h-48 focus:ring-2 focus:ring-blue-500 outline-none resize-none"></textarea>
            </div>
            <div class="p-4 border-2 border-dashed border-slate-200 rounded-2xl bg-slate-50">
                <label class="block text-sm font-bold text-slate-700 mb-3"><i class="bi bi-image"></i> รูปภาพประกอบ (สูงสุด 10 รูป)</label>
                <input type="file" id="postImage" accept="image/*" multiple onchange="handleImageSelect(event)" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-blue-600 file:text-white cursor-pointer">
                <div id="imagePreviewGrid" class="preview-grid"></div>
            </div>
        </div>
        <div class="flex justify-end gap-4 mt-8">
            <button onclick="closeModal('postModal')" class="px-6 py-3 font-medium text-slate-400">ยกเลิก</button>
            <button id="saveBtn" onclick="submitPost()" class="bg-blue-600 text-white px-10 py-3 rounded-2xl font-medium shadow-lg hover:bg-blue-700 transition-colors">บันทึกข้อมูล</button>
        </div>
    </div>
</div>

<div id="viewModal">
    <div class="bg-white rounded-3xl w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-2xl mx-4">
        <div id="viewContent" class="p-8"></div>
    </div>
</div>

<script>
    const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbwXkjjB47TJfteV-YvP6BOVY3NcaUm9XTVq2TUXnIqzWvqLKGaTFJmxR-QP9hxrFT0D/exec';
    let allPosts = [], filteredPosts = [], currentPage = 1, postsPerPage = 20;
    let selectedImages = [], deletedFileIds = [], coverIndex = 0;

    const toast = {
        error: (msg) => Swal.fire({ icon: 'error', title: 'แจ้งเตือน', text: msg }),
        success: (msg) => Swal.fire({ icon: 'success', title: 'สำเร็จ', text: msg, timer: 1500, showConfirmButton: false }),
        loading: (msg) => Swal.fire({ title: msg, allowOutsideClick: false, didOpen: () => Swal.showLoading() }),
        confirm: (msg) => Swal.fire({ title: 'ยืนยัน?', text: msg, icon: 'warning', showCancelButton: true, confirmButtonColor: '#3b82f6' })
    };

    // ฟังก์ชันเปลี่ยน URL ในข้อความให้เป็นลิงก์ที่คลิกได้
    function linkify(text) {
        const urlPattern = /(\b(https?|ftp|file):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/ig;
        return text.replace(urlPattern, function(url) {
            return `<a href="${url}" target="_blank" class="link-text">${url}</a>`;
        });
    }

    async function fetchPosts() {
        try {
            const res = await fetch(`${WEB_APP_URL}?action=getList`);
            allPosts = await res.json();
            handleSearch();
        } catch (e) {
            document.getElementById('postContainer').innerHTML = '<p class="col-span-full text-center py-20 text-red-400">ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้</p>';
        }
    }

    function handleSearch() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        filteredPosts = allPosts.filter(post => 
            (post.title || "").toLowerCase().includes(query) || 
            (post.content || "").toLowerCase().includes(query)
        );
        filteredPosts.sort((a, b) => {
            const pinA = a.isPinned === true || a.isPinned === 'true';
            const pinB = b.isPinned === true || b.isPinned === 'true';
            if (pinA !== pinB) return pinA ? -1 : 1;
            return new Date(b.Timestamp) - new Date(a.Timestamp);
        });
        currentPage = 1;
        renderPosts();
    }

    function renderPosts() {
        const container = document.getElementById('postContainer');
        const pagination = document.getElementById('paginationUI');
        if (!filteredPosts || filteredPosts.length === 0) {
            container.innerHTML = '<div class="col-span-full text-center py-32 text-slate-400"><i class="bi bi-search" style="font-size:3rem;"></i><p class="mt-4">ไม่พบข้อมูล</p></div>';
            pagination.innerHTML = '';
            return;
        }

        const totalPages = Math.ceil(filteredPosts.length / postsPerPage);
        const startIndex = (currentPage - 1) * postsPerPage;
        const pagePosts = filteredPosts.slice(startIndex, startIndex + postsPerPage);

        container.innerHTML = '';
        pagePosts.forEach((post, idx) => {
            const isPinned = post.isPinned === true || post.isPinned === 'true';
            const coverUrl = post.imageUrls?.length > 0 ? post.imageUrls[0] : null;
            
            const card = document.createElement('div');
            card.className = `post-card border-2 cursor-pointer ${isPinned ? 'border-yellow-400 ring-4 ring-yellow-50' : 'border-white shadow-sm'}`;
            card.style.animationDelay = `${idx * 0.05}s`;
            card.onclick = () => openViewModal(post.postId);
            card.innerHTML = `
                <div class="h-40 bg-slate-200 relative">
                    ${coverUrl ? `<img src="${coverUrl}" class="w-full h-full object-cover">` : `<div class="fallback-cover"><span>${post.title}</span></div>`}
                    ${isPinned ? '<span class="absolute top-3 left-3 bg-yellow-400 text-white text-[10px] px-2 py-1 rounded font-bold shadow-sm">ปักหมุด</span>' : ''}
                </div>
                <div class="p-4 flex-grow flex flex-col">
                    <h3 class="font-bold text-slate-800 line-clamp-2 text-sm mb-1 leading-snug">${post.title}</h3>
                    <p class="text-slate-500 text-[11px] line-clamp-3 mb-4 font-light">${post.content}</p>
                    <div class="mt-auto pt-3 border-t flex justify-between items-center text-[10px] text-slate-400">
                        <span><i class="bi bi-calendar3"></i> ${new Date(post.Timestamp).toLocaleDateString('th-TH')}</span>
                        <span class="text-blue-600 font-bold uppercase">View</span>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });

        pagination.innerHTML = '';
        if (totalPages > 1) {
            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.innerText = i;
                btn.onclick = () => { currentPage = i; renderPosts(); window.scrollTo({top: 0, behavior: 'smooth'}); };
                pagination.appendChild(btn);
            }
        }
    }

    function openViewModal(id) {
        const post = allPosts.find(p => p.postId == id);
        const contentDiv = document.getElementById('viewContent');
        const isPinned = post.isPinned === true || post.isPinned === 'true';
        
        // แปลงลิงก์ในเนื้อหา
        const linkedContent = linkify(post.content || "");

        let imagesHtml = '<div class="view-gallery">';
        post.imageUrls?.forEach(url => imagesHtml += `<div class="gallery-item" onclick="expandImage('${url}')"><img src="${url}"></div>`);
        imagesHtml += '</div>';

        contentDiv.innerHTML = `
            <div class="flex justify-between items-center mb-6">
                <span class="bg-slate-100 px-3 py-1 rounded-full text-[10px] font-bold text-slate-400">POST ID #${post.postId}</span>
                <button onclick="closeModal('viewModal')" class="text-slate-400"><i class="bi bi-x-lg"></i> ปิด</button>
            </div>
            <h2 class="text-2xl font-bold text-slate-800 mb-4">${post.title}</h2>
            <div class="text-slate-700 whitespace-pre-wrap mb-8 font-light border-l-4 border-blue-500 pl-4">${linkedContent}</div>
            ${imagesHtml}
            <div class="flex gap-3 pt-6 border-t mt-8">
                <button onclick="togglePin('${post.postId}')" class="flex-1 py-3 bg-yellow-50 text-yellow-700 rounded-xl font-medium">${isPinned ? 'เลิกปักหมุด' : 'ปักหมุด'}</button>
                <button onclick="openEditModal('${post.postId}')" class="flex-1 py-3 bg-blue-600 text-white rounded-xl font-medium">แก้ไข</button>
                <button onclick="deletePost('${post.postId}')" class="flex-1 py-3 bg-red-50 text-red-600 rounded-xl font-medium">ลบ</button>
            </div>
        `;
        document.getElementById('viewModal').classList.add('modal-active');
    }

    async function handleImageSelect(event) {
        const files = Array.from(event.target.files);
        if (selectedImages.length + files.length > 10) return toast.error("สูงสุด 10 รูป");
        for (let file of files) {
            const base64 = await new Promise(r => {
                const reader = new FileReader();
                reader.onload = () => r(reader.result);
                reader.readAsDataURL(file);
            });
            selectedImages.push({ base64, isNew: true });
        }
        renderImagePreviews();
    }

    function renderImagePreviews() {
        const grid = document.getElementById('imagePreviewGrid');
        grid.innerHTML = '';
        selectedImages.forEach((img, idx) => {
            const item = document.createElement('div');
            item.className = `preview-item ${idx === coverIndex ? 'is-cover' : ''}`;
            item.onclick = () => { coverIndex = idx; renderImagePreviews(); };
            item.innerHTML = `<img src="${img.base64}"><div class="cover-badge" style="position:absolute; top:2px; left:2px; background:var(--ios-blue); color:white; font-size:8px; padding:2px 4px; border-radius:4px; opacity:${idx === coverIndex ? 1 : 0};">หน้าปก</div>
                <button onclick="removeSelectedImg(event, ${idx})" class="absolute top-1 right-1 bg-red-500 text-white w-5 h-5 rounded-full text-xs">×</button>`;
            grid.appendChild(item);
        });
    }

    function removeSelectedImg(e, idx) {
        e.stopPropagation();
        const removed = selectedImages.splice(idx, 1)[0];
        if (!removed.isNew) deletedFileIds.push(removed.fileId);
        coverIndex = 0; renderImagePreviews();
    }

    async function submitPost() {
        const title = document.getElementById('postSubject').value.trim();
        const content = document.getElementById('postContent').value.trim();
        const editId = document.getElementById('editPostId').value;
        if (!title || !content) return toast.error("กรุณากรอกข้อมูลให้ครบ");

        toast.loading("กำลังบันทึก...");
        const payload = {
            action: editId ? 'update' : 'add',
            postId: editId || 'PK' + Math.random().toString().substring(2, 8),
            title, content, coverIndex, deletedFileIds,
            images: selectedImages.map(img => img.base64),
            currentFileIds: selectedImages.map(img => img.fileId || "")
        };

        try {
            await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(payload) });
            closeModal('postModal');
            toast.success("สำเร็จ");
            fetchPosts();
        } catch (e) { toast.error("ล้มเหลว"); }
    }

    async function deletePost(id) {
        const res = await toast.confirm("ลบกระทู้นี้?");
        if (res.isConfirmed) {
            closeModal('viewModal');
            toast.loading("กำลังลบ...");
            await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: 'delete', id }) });
            toast.success("ลบแล้ว");
            fetchPosts();
        }
    }

    async function togglePin(id) {
        toast.loading("รอดำเนินการ...");
        await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action: 'togglePin', id }) });
        closeModal('viewModal');
        fetchPosts();
        Swal.close();
    }

    function openModal(mode) {
        document.getElementById('postModal').classList.add('modal-active');
        resetModal();
        if(mode === 'add') {
            document.getElementById('modalTitle').innerText = 'สร้างกระทู้ใหม่';
            document.getElementById('editPostId').value = '';
        }
    }

    function openEditModal(id) {
        const post = allPosts.find(p => p.postId == id);
        closeModal('viewModal');
        resetModal();
        openModal('edit');
        document.getElementById('modalTitle').innerText = 'แก้ไขกระทู้';
        document.getElementById('editPostId').value = post.postId;
        document.getElementById('postSubject').value = post.title;
        document.getElementById('postContent').value = post.content;
        post.imageUrls?.forEach((url, i) => selectedImages.push({ base64: url, fileId: post.fileIds[i], isNew: false }));
        renderImagePreviews();
    }

    function resetModal() {
        document.getElementById('postSubject').value = '';
        document.getElementById('postContent').value = '';
        document.getElementById('imagePreviewGrid').innerHTML = '';
        selectedImages = []; deletedFileIds = []; coverIndex = 0;
    }

    function closeModal(id) { document.getElementById(id).classList.remove('modal-active'); }
    function expandImage(src) { document.getElementById('expandedImg').src = src; document.getElementById('imageOverlay').classList.add('active'); }
    function closeImage() { document.getElementById('imageOverlay').classList.remove('active'); }

    // Sidebar Logic
    const dragBtn = document.getElementById('floatingMenuBtn');
    const sideFloat = document.getElementById('sidebarFloat');
    const sideOverlay = document.getElementById('sidebarOverlay');
    
    dragBtn.onclick = () => {
        const isActive = sideFloat.classList.toggle('active');
        sideOverlay.classList.toggle('active', isActive);
        if (isActive && !sideFloat.innerHTML) {
            fetch('sidebar.html').then(r => r.text()).then(data => sideFloat.innerHTML = `<div class="p-5 font-bold text-white border-b border-white/10">เมนูนำทาง</div>` + data);
        }
    };
    function closeSidebarFloat() { sideFloat.classList.remove('active'); sideOverlay.classList.remove('active'); }

    window.onload = () => { fetchPosts(); };
</script>

</body>
</html>
